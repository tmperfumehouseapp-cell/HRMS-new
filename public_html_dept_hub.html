<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HRMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Workbenches — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<link rel="stylesheet" href="assets/css/boss.css?v=1">
<style>
  .dh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:14px;}
  .dh-card{display:flex;flex-direction:column;gap:9px;background:var(--surface);border-radius:var(--radius);padding:18px 20px;color:inherit;text-decoration:none;box-shadow:0 1px 2px rgba(20,22,26,.04),0 6px 18px -10px rgba(20,22,26,.12);}
  .dh-card:hover{transform:translateY(-1px);} .dh-card h3{margin:0;font-size:17px;font-weight:800;}
  .dh-card .nums{display:flex;gap:16px;} .dh-card .nums b{display:block;font-size:22px;font-weight:800;line-height:1.1;} .dh-card .nums small{font-size:11.5px;color:var(--muted);font-weight:600;}
  .dh-card .who{font-size:12.5px;color:var(--muted);line-height:1.45;}
  .dh-tbl{width:100%;border-collapse:collapse;} .dh-tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 8px;font-weight:700;} .dh-tbl td{padding:11px 8px;border-top:1px solid var(--line);font-size:14px;vertical-align:middle;}
  .dh-who{display:inline-flex;gap:6px;flex-wrap:wrap;} .dh-who span{background:#f1f3f6;border-radius:99px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;} .dh-who span em{font-style:normal;font-size:10px;color:#fff;background:var(--ink);border-radius:99px;padding:2px 6px;}
  .dh-who span button{border:0;background:#dfe2e7;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;line-height:1;padding:0;}
  .dh-none{display:inline-block;background:#f1f3f6;border-radius:99px;padding:5px 12px;font-size:13px;color:#7a8499;}
  .dh-sug{font-size:12.5px;color:#4a505c;line-height:1.45;}
  .scrollx{overflow-x:auto;}
</style>
<style>
/* === MOBILE PASS v1 === */
@media (max-width:820px){
  /* the small round "x" next to a name was stretched to 20x38 by the global button height */
  .dh-who span button{min-height:0; width:36px; height:36px; font-size:15px;}
}
/* === END MOBILE PASS v1 === */
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><div><h1>Workbenches</h1><div class="bd-sub" id="sub">The working tools for departments with their own daily work. People, seats and questions live in People and Questions.</div></div><div id="topBtns"></div></div>
    <div class="content"><div class="bd" id="root"><div class="bd-empty">Loading…</div></div></div>
  </main>
</div>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/api.js?v=4"></script>
<script src="assets/js/layout.js?v=4"></script>
<script src="assets/js/boss_common.js?v=3"></script>
<script>
  guardPage();
  renderSidebar('dept_hub');
  const { esc, $, toast, inr } = BD;
  let S = null, ST = null, ADMIN = false;
  const PAGE = { dispatch: 'dept_dispatch.html', money: 'dept_money.html', shops: 'dept_shops.html', supplies: 'dept_supplies.html' };
  const ABOUT = { dispatch: 'Tracking number in 48 hours, in transit by day 4', money: 'Every rupee that came in is used by 9 PM', shops: 'Display visits, photo count, shops that owe more than they hold', supplies: 'Milk, ice, coffee, cleaners for every office' };

  async function load() {
    try {
      const [a, c, w] = await Promise.all([api.get('dp.summary'), api.get('dp.settings'), BD.who()]);
      S = a; ST = c; ADMIN = !!w.admin; render();
    } catch (e) { $('root').innerHTML = '<div class="bd-card"><div class="bd-empty"><b>Cannot open Workbenches</b>' + esc(e.message) + '</div></div>'; }
  }
  function render() {
    let h = '<div class="dh-grid">' + S.topics.filter((t) => PAGE[t.topic]).map((t) =>
      '<a class="dh-card" href="' + PAGE[t.topic] + '"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3>' + esc(t.name) + '</h3></div><div class="bd-sub">' + esc(ABOUT[t.topic]) + '</div>'
        + '<div class="nums"><div><b>' + t.open_today + '</b><small>open today</small></div><div><b style="' + (t.missed_month ? 'color:#d9423b' : '') + '">' + t.missed_month + '</b><small>missed this month</small></div><div><b>' + inr(t.pen_applied) + '</b><small>penalties this month</small></div></div></a>'
    ).join('')
      + '<a class="dh-card" href="dept_work.html"><h3>Shopping list &amp; repairs</h3><div class="bd-sub">Everything to buy and everything to fix, for every office. Give it to a person, they do it and add the proof.</div></a></div>';
    h += '<div class="bd-sub" style="margin:4px 4px 14px">Who sits in each seat is set in <b>People → a person → Seats</b>. Claude’s questions for these departments are in <b>Questions</b>.</div>';
    if (ADMIN) h += '<div class="bd-card"><div class="bd-h"><h2>Settings</h2></div><div class="bd-f" style="max-width:520px"><label>Google API key (maps, shop phone numbers)</label><input class="bd-in" id="gk" type="password" placeholder="' + (ST.google_key_set ? 'Saved: ' + esc(ST.google_key_hint) + ' (type a new one to replace)' : 'Paste the key here') + '"></div>'
      + '<label style="display:flex;gap:8px;align-items:center;font-size:14px;margin:8px 0 12px"><input type="checkbox" id="pa" ' + (ST.proof_ai ? 'checked' : '') + '> Claude reads punch-in comment screenshots (is it a real comment on our page?)</label><button class="bd-btn pri" id="sv">Save settings</button></div>';
    $('root').innerHTML = h; wire();
  }
  function wire() {
    const sv = $('sv'); if (sv) sv.onclick = async () => {
      const body = { proof_ai: $('pa').checked ? '1' : '0' }; if ($('gk').value.trim()) body.google_key = $('gk').value.trim();
      try { await api.post('dp.settings', body); toast('Saved.'); load(); } catch (e) { toast(e.message, true); }
    };
  }
  load();
</script>
</body>
</html>

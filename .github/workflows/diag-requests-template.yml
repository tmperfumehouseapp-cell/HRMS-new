# READ-ONLY: chats that sit in Requests right after a pre-made message went to them: what re-opened them (no phone numbers, no names).
# Changes nothing. Run it by hand: Actions → "Auto assign check (read-only)" → Run workflow.
name: Requests after a template (read-only)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Requests after template
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          cat > /tmp/rq_check.php <<'PHP'
          <?php
          require $argv[1] . "empmanagment/config.php";
          $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
          date_default_timezone_set("Asia/Kolkata"); echo "IST " . date("Y-m-d H:i:s") . " · db now " . $d->query("SELECT NOW()")->fetchColumn() . " · newest message " . $d->query("SELECT MAX(ts) FROM wa_messages")->fetchColumn() . "\n"; $since = date("Y-m-d H:i:s", time() - 5 * 3600);
          $mask = function ($s) { return preg_replace('/\d{6,}/', '#', (string)$s); };
          echo "--- template sends by people, last 5 h, by minute (top)\n";
          foreach ($d->query("SELECT CONCAT(LEFT(ts, 15), "x ", mtype) m, who, emp_id, COUNT(*) n, COUNT(DISTINCT phone) ph FROM wa_messages WHERE dir = 'out' AND ts >= '$since' GROUP BY LEFT(ts, 15), who, emp_id, mtype ORDER BY n DESC LIMIT 14")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "  " . $r["m"] . " who=" . $r["who"] . " emp=" . $r["emp_id"] . " msgs=" . $r["n"] . " phones=" . $r["ph"] . "\n";
          $base = "FROM wa_contacts c WHERE c.assigned_emp = 0 AND c.status = 'open' AND c.optout = 0 AND c.last_in_at IS NOT NULL AND c.last_out_at >= '$since'";
          echo "--- unassigned open chats with our message in the last 5 h: " . $d->query("SELECT COUNT(*) $base")->fetchColumn() . "\n";
          echo "    of them the customer wrote AFTER our last message: " . $d->query("SELECT COUNT(*) $base AND c.last_in_at > c.last_out_at")->fetchColumn() . "\n";
          echo "    of them the customer's last message is older than 24 h: " . $d->query("SELECT COUNT(*) $base AND c.last_in_at < '" . date("Y-m-d H:i:s", time() - 86400) . "'")->fetchColumn() . "\n";
          foreach ($d->query("SELECT c.phone, c.state, c.source, c.tag, c.last_in_at, c.last_out_at, c.closed_at $base ORDER BY c.last_out_at DESC LIMIT 7")->fetchAll(PDO::FETCH_ASSOC) as $c) {
            echo "=== chat · state " . $c["state"] . " · source [" . $c["source"] . "] · last_in " . $c["last_in_at"] . " · last_out " . $c["last_out_at"] . " · closed_at " . ($c["closed_at"] ?: "-") . "\n";
            $m = $d->prepare("SELECT dir, who, emp_id, mtype, ts, LEFT(REPLACE(body, CHAR(10), ' '), 70) b FROM wa_messages WHERE phone = ? ORDER BY id DESC LIMIT 9"); $m->execute([$c["phone"]]);
            foreach (array_reverse($m->fetchAll(PDO::FETCH_ASSOC)) as $x) echo "    " . $x["ts"] . " " . $x["dir"] . " " . $x["who"] . ($x["emp_id"] ? "#" . $x["emp_id"] : "") . " [" . $x["mtype"] . "] " . $mask($x["b"]) . "\n";
            try { $a = $d->prepare("SELECT at, to_emp, by_emp, how FROM wa_assign_log WHERE phone = ? ORDER BY id DESC LIMIT 3"); $a->execute([$c["phone"]]); foreach ($a->fetchAll(PDO::FETCH_ASSOC) as $x) echo "    assign " . $x["at"] . " to=" . $x["to_emp"] . " by=" . $x["by_emp"] . " how=" . $x["how"] . "\n"; } catch (Throwable $e) { }
          }
          PHP
          php /tmp/rq_check.php "$P"; rm -f /tmp/rq_check.php
          REMOTE

# READ-ONLY customer numbers from the staging VPS: how many unique customers, delivered, failed, replied, ordered, 2+ orders. Prints totals only (no names, no phone numbers).
# Changes nothing. Run it by hand: Actions → "Customer numbers (read-only)" → Run workflow. Uses the same 4 secrets as the deploy.
name: Customer numbers (read-only)

on:
  workflow_dispatch:

jobs:
  numbers:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Customer numbers (totals only)
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          cat > /tmp/cust_numbers.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          $n = function ($sql) use ($d) { try { return number_format((int)$d->query($sql)->fetchColumn()); } catch (Throwable $e) { return "n/a (" . substr($e->getMessage(), 0, 80) . ")"; } };
          echo "=== the funnel table (wa_cfun) ===\n";
          echo "rows counted so far: " . $n("SELECT COUNT(*) FROM wa_cfun") . "\n";
          try { $r = $d->query("SELECT setting_value FROM hrms_settings WHERE setting_key = 'wa_cfun_stats'")->fetchColumn(); $j = json_decode((string)$r, true);
            if (!$j) echo "no saved numbers yet (the first count has not finished a round)\n"; else { echo "counting still running: " . ($j["walking"] ? "yes" : "no") . " · saved at " . $j["at"] . "\n";
              foreach (["all", "query", "campaign"] as $s) { $x = $j["by"][$s] ?? null; if (!$x) continue; echo "--- source: $s ---\n";
                foreach (["total" => "Unique customers (mobile numbers)", "messaged" => "Messaged", "reached" => "Delivered (at least one reached the phone)", "not_delivered" => "Not delivered", "any_failed" => "Had a failed message", "all_failed" => "Every message failed", "failed" => "Failed group (never replied, last 3 failed)", "replied" => "Replied", "never_replied" => "Never replied", "wrote_first" => "Wrote first", "ordered" => "Ordered", "repeat_n" => "Ordered 2+ times", "optout" => "Opted out", "m_total" => "Messages sent", "m_deliv" => "Messages delivered/read", "m_sent" => "Messages sent, not confirmed", "m_fail" => "Messages failed", "m_in" => "Messages received", "g_never" => "Group: never messaged", "g_sent" => "Group: sent not delivered", "g_failed" => "Group: failed", "g_deliv" => "Group: delivered no reply", "g_replied" => "Group: replied no order", "g_ord1" => "Group: ordered once", "g_ord2" => "Group: ordered 2+"] as $k => $l) echo sprintf("%-48s %s\n", $l, number_format((int)($x[$k] ?? 0)));
                if ($s === "all") foreach (($x["reasons"] ?? []) as $q) echo "  failed because: " . $q["text"] . " = " . number_format($q["n"]) . "\n"; } }
          } catch (Throwable $e) { echo "saved numbers: " . $e->getMessage() . "\n"; }
          echo "\n=== straight from the source tables (cross-check, totals only) ===\n";
          echo "WhatsApp contacts (chats + Excel imports + first messages): " . $n("SELECT COUNT(*) FROM wa_contacts") . "\n";
          try { foreach ($d->query("SELECT COALESCE(NULLIF(source, ''), '(none)') s, COUNT(*) c FROM wa_contacts GROUP BY s ORDER BY c DESC LIMIT 12")->fetchAll(PDO::FETCH_NUM) as $x) echo "   source " . $x[0] . ": " . number_format($x[1]) . "\n"; } catch (Throwable $e) { }
          echo "Contacts that ever wrote to us (last_in_at set): " . $n("SELECT COUNT(*) FROM wa_contacts WHERE last_in_at IS NOT NULL") . "\n";
          echo "Contacts opted out: " . $n("SELECT COUNT(*) FROM wa_contacts WHERE optout = 1") . "\n";
          echo "Customers with orders (wa_cust): " . $n("SELECT COUNT(*) FROM wa_cust WHERE n > 0") . " · with 2+: " . $n("SELECT COUNT(*) FROM wa_cust WHERE n >= 2") . "\n";
          echo "Customers in customer_facts (all channels): " . $n("SELECT COUNT(*) FROM customer_facts") . " · with orders: " . $n("SELECT COUNT(*) FROM customer_facts WHERE orders_n > 0") . " · 2+: " . $n("SELECT COUNT(*) FROM customer_facts WHERE orders_n >= 2") . "\n";
          echo "Numbers in campaign lists (distinct): " . $n("SELECT COUNT(DISTINCT phone) FROM wa_camp_items") . "\n";
          try { echo "Messages we sent, by status:\n"; foreach ($d->query("SELECT /*+ MAX_EXECUTION_TIME(20000) */ status, COUNT(*) c FROM wa_messages WHERE dir = 'out' GROUP BY status ORDER BY c DESC")->fetchAll(PDO::FETCH_NUM) as $x) echo "   " . $x[0] . ": " . number_format($x[1]) . "\n"; } catch (Throwable $e) { echo "   n/a: " . substr($e->getMessage(), 0, 90) . "\n"; }
          echo "Messages received from customers: " . $n("SELECT /*+ MAX_EXECUTION_TIME(20000) */ COUNT(*) FROM wa_messages WHERE dir = 'in'") . "\n";
          echo "\n=== EVERY unique mobile number, counted exactly (contacts + campaign lists + orders) ===\n";
          $u = "SELECT COUNT(*) FROM (SELECT phone COLLATE utf8mb4_unicode_ci p FROM wa_contacts UNION SELECT phone COLLATE utf8mb4_unicode_ci FROM wa_camp_items UNION SELECT phone COLLATE utf8mb4_unicode_ci FROM wa_cust UNION SELECT p10 COLLATE utf8mb4_unicode_ci FROM customer_facts) x";
          try { $d->exec("SET SESSION MAX_EXECUTION_TIME=60000"); } catch (Throwable $e) { }
          echo "Unique mobile numbers in total: " . $n($u) . "\n";
          echo "  ...of which proper 10-digit Indian mobiles in contacts: " . $n("SELECT COUNT(*) FROM wa_contacts WHERE phone REGEXP '^[6-9][0-9]{9}$'") . " · other shapes: " . $n("SELECT COUNT(*) FROM wa_contacts WHERE phone NOT REGEXP '^[6-9][0-9]{9}$'") . "\n";
          echo "\n=== names and owners (contacts) ===\n";
          echo "With a name: " . $n("SELECT COUNT(*) FROM wa_contacts WHERE TRIM(name) <> ''") . " · without a name: " . $n("SELECT COUNT(*) FROM wa_contacts WHERE TRIM(COALESCE(name, '')) = ''") . "\n";
          echo "Chat given to a staff member (assigned): " . $n("SELECT COUNT(*) FROM wa_contacts WHERE assigned_emp > 0") . " · not assigned: " . $n("SELECT COUNT(*) FROM wa_contacts WHERE assigned_emp = 0") . "\n";
          echo "Campaign-list numbers with a name: " . $n("SELECT COUNT(DISTINCT phone) FROM wa_camp_items WHERE TRIM(COALESCE(name, '')) <> ''") . "\n";
          echo "\n=== messages we sent, by kind and status (who sent it) ===\n";
          try { foreach ($d->query("SELECT /*+ MAX_EXECUTION_TIME(40000) */ who, status, COUNT(*) c FROM wa_messages WHERE dir = 'out' GROUP BY who, status ORDER BY who, c DESC")->fetchAll(PDO::FETCH_NUM) as $x) echo sprintf("   %-12s %-12s %s\n", $x[0], $x[1], number_format($x[2])); } catch (Throwable $e) { echo "   n/a: " . substr($e->getMessage(), 0, 90) . "\n"; }
          echo "\n=== campaign messages (the campaign lists themselves) ===\n";
          echo "Rows in all campaign lists: " . $n("SELECT COUNT(*) FROM wa_camp_items") . " · distinct numbers: " . $n("SELECT COUNT(DISTINCT phone) FROM wa_camp_items") . "\n";
          try { foreach ($d->query("SELECT /*+ MAX_EXECUTION_TIME(40000) */ status, COUNT(*) c, COUNT(DISTINCT phone) p FROM wa_camp_items GROUP BY status ORDER BY c DESC")->fetchAll(PDO::FETCH_NUM) as $x) echo sprintf("   status %-10s messages %-10s numbers %s\n", $x[0], number_format($x[1]), number_format($x[2])); } catch (Throwable $e) { }
          try { foreach ($d->query("SELECT /*+ MAX_EXECUTION_TIME(40000) */ last_status, COUNT(*) c FROM wa_camp_items WHERE status = 'sent' GROUP BY last_status ORDER BY c DESC")->fetchAll(PDO::FETCH_NUM) as $x) echo sprintf("   accepted, then: %-10s %s\n", $x[0] === '' ? '(none)' : $x[0], number_format($x[1])); } catch (Throwable $e) { }
          echo "\n=== replies ===\n";
          echo "Numbers that ever wrote to us (from the message log): " . $n("SELECT /*+ MAX_EXECUTION_TIME(40000) */ COUNT(DISTINCT phone) FROM wa_messages WHERE dir = 'in'") . "\n";
          echo "\n=== EXCEL-IMPORTED customers: did anything reach them? (imported = saved with the Excel-import marker) ===\n";
          try { $d->exec("SET SESSION MAX_EXECUTION_TIME=0"); } catch (Throwable $e) { }
          $t0 = time(); $cur = ""; $tot = 0; $never = 0; $deliv = 0; $nodel = 0; $allfail = 0; $repl = 0; $nodelRepl = 0; $noC = 0; $timeout = false;
          try {
            while (true) {
              $q = $d->prepare("SELECT DISTINCT phone FROM wa_ctags WHERE src = 'import' AND phone > ? ORDER BY phone LIMIT 3000"); $q->execute([$cur]); $ph = $q->fetchAll(PDO::FETCH_COLUMN); if (!$ph) break; $cur = (string)end($ph); $ph = array_map("strval", $ph);
              $in = implode(",", array_fill(0, count($ph), "?")); $M = []; $R = [];
              $m = $d->prepare("SELECT phone, COUNT(*) n, SUM(status IN ('delivered','read')) dl, SUM(status = 'failed') f FROM wa_messages WHERE dir = 'out' AND phone IN ($in) GROUP BY phone"); $m->execute($ph); foreach ($m->fetchAll(PDO::FETCH_ASSOC) as $r) $M[(string)$r["phone"]] = $r;
              $c = $d->prepare("SELECT phone FROM wa_contacts WHERE last_in_at IS NOT NULL AND phone IN ($in)"); $c->execute($ph); foreach ($c->fetchAll(PDO::FETCH_COLUMN) as $x) $R[(string)$x] = 1;
              foreach ($ph as $p) { $p = (string)$p; $tot++; $x = $M[$p] ?? null; $rep = isset($R[$p]);
                if ($rep) $repl++;
                if (!$x) { $never++; continue; }
                if ((int)$x["dl"] > 0) { $deliv++; continue; }
                $nodel++; if ($rep) $nodelRepl++; if ((int)$x["f"] >= (int)$x["n"]) $allfail++; }
              if (time() - $t0 > 170) { $timeout = true; break; }
            }
          } catch (Throwable $e) { echo "import check stopped: " . substr($e->getMessage(), 0, 120) . "\n"; }
          echo "Imported numbers checked: " . number_format($tot) . ($timeout ? "  (stopped after 170 s — partial)" : "") . "\n";
          echo "  never sent any message: " . number_format($never) . "\n";
          echo "  at least one message delivered/read: " . number_format($deliv) . "\n";
          echo "  messages sent but NOT A SINGLE ONE delivered: " . number_format($nodel) . "   (of these, every message failed: " . number_format($allfail) . "; replied anyway: " . number_format($nodelRepl) . ")\n";
          echo "  imported numbers that ever wrote to us: " . number_format($repl) . "\n";
          try { echo "Import batches (tag, numbers):\n"; foreach ($d->query("SELECT tag, COUNT(*) c FROM wa_ctags WHERE src = 'import' AND tag LIKE 'import\\_%' GROUP BY tag ORDER BY c DESC LIMIT 15")->fetchAll(PDO::FETCH_NUM) as $x) echo "   " . $x[0] . ": " . number_format($x[1]) . "\n"; } catch (Throwable $e) { }
          echo "\n=== CONSISTENCY CHECK of the funnel table (every line should say 0) ===\n";
          echo "Numbers counted so far: " . $n("SELECT COUNT(*) FROM wa_cfun") . "\n";
          echo "Replied but not in the replied list: " . $n("SELECT COUNT(*) FROM wa_cfun WHERE replied = 1 AND bucket <> 'replied'") . "\n";
          echo "In the failed list although they replied: " . $n("SELECT COUNT(*) FROM wa_cfun WHERE bucket = 'failed' AND (replied = 1 OR in_n > 0)") . "\n";
          echo "In the delivered / sent / failed lists with no message sent: " . $n("SELECT COUNT(*) FROM wa_cfun WHERE bucket IN ('delivered','pending','failed') AND out_n = 0") . "\n";
          echo "In the delivered list but nothing delivered: " . $n("SELECT COUNT(*) FROM wa_cfun WHERE bucket = 'delivered' AND deliv_n = 0") . "\n";
          $bad1 = 0; $bad2 = 0; $bad3 = 0; $s1 = 0; $s2 = 0;
          try {
            $q = $d->query("SELECT phone FROM wa_cfun WHERE replied = 0 ORDER BY RAND() LIMIT 6000"); $ph = array_map("strval", $q->fetchAll(PDO::FETCH_COLUMN)); $s1 = count($ph);
            foreach (array_chunk($ph, 2000) as $ch) { $in = implode(",", array_fill(0, count($ch), "?"));
              $c = $d->prepare("SELECT COUNT(*) FROM wa_contacts WHERE last_in_at IS NOT NULL AND phone IN ($in)"); $c->execute($ch); $bad1 += (int)$c->fetchColumn(); }
            $q = $d->query("SELECT phone FROM wa_cfun WHERE bucket = 'failed' ORDER BY RAND() LIMIT 1500"); $ph = array_map("strval", $q->fetchAll(PDO::FETCH_COLUMN)); $s2 = count($ph);
            $m = $d->prepare("SELECT status FROM wa_messages WHERE phone = ? AND dir = 'out' ORDER BY id DESC LIMIT 3"); $in1 = $d->prepare("SELECT COUNT(*) FROM wa_messages WHERE phone = ? AND dir = 'in'");
            foreach ($ph as $p) { $m->execute([$p]); $st = $m->fetchAll(PDO::FETCH_COLUMN); if (!$st || count(array_filter($st, function ($x) { return $x === "failed"; })) !== count($st)) $bad2++; $in1->execute([$p]); if ((int)$in1->fetchColumn() > 0) $bad3++; }
          } catch (Throwable $e) { echo "sample check stopped: " . substr($e->getMessage(), 0, 100) . "\n"; }
          echo "Sample of $s1 'not replied' numbers that really did write to us: $bad1\n";
          echo "Sample of $s2 'failed' numbers whose last 3 messages are NOT all failed: $bad2\n";
          echo "Sample of $s2 'failed' numbers that actually wrote to us: $bad3\n";
          echo "\n=== do the customer-value thresholds fit? (customers with orders, all channels) ===\n";
          try { foreach ($d->query("SELECT CASE WHEN last_at >= NOW() - INTERVAL 30 DAY THEN 'a: last order 0-30 days' WHEN last_at >= NOW() - INTERVAL 90 DAY THEN 'b: 31-90 days' WHEN last_at >= NOW() - INTERVAL 120 DAY THEN 'c: 91-120 days' WHEN last_at >= NOW() - INTERVAL 180 DAY THEN 'd: 121-180 days' WHEN last_at >= NOW() - INTERVAL 365 DAY THEN 'e: 181-365 days' ELSE 'f: over a year / unknown' END b, orders_n >= 3 o3, orders_n = 2 o2, orders_n = 1 o1, COUNT(*) c FROM customer_facts WHERE orders_n > 0 GROUP BY b, o3, o2, o1 ORDER BY b")->fetchAll(PDO::FETCH_ASSOC) as $x) echo sprintf("   %-28s orders %-4s %s\n", $x["b"], $x["o3"] ? "3+" : ($x["o2"] ? "2" : "1"), number_format($x["c"])); } catch (Throwable $e) { echo "   n/a: " . substr($e->getMessage(), 0, 90) . "\n"; }
          try { echo "Funnel tags written so far:\n"; foreach ($d->query("SELECT tag, COUNT(*) c FROM wa_auto_tags WHERE src = 'funnel' GROUP BY tag ORDER BY tag")->fetchAll(PDO::FETCH_NUM) as $x) echo "   " . $x[0] . ": " . number_format($x[1]) . "\n"; } catch (Throwable $e) { echo "   n/a: " . substr($e->getMessage(), 0, 90) . "\n"; }
          echo "\n=== why does almost nobody have a recent last-order date? ===\n";
          echo "With orders: " . $n("SELECT COUNT(*) FROM customer_facts WHERE orders_n > 0") . " · last_at empty: " . $n("SELECT COUNT(*) FROM customer_facts WHERE orders_n > 0 AND last_at IS NULL") . " · Shopify last order (shop_last) known: " . $n("SELECT COUNT(*) FROM customer_facts WHERE orders_n > 0 AND shop_last IS NOT NULL") . " · shop_n bigger than orders_n: " . $n("SELECT COUNT(*) FROM customer_facts WHERE shop_n > orders_n") . "\n";
          try { foreach ($d->query("SELECT CASE WHEN GREATEST(COALESCE(last_at,'1970-01-01'), COALESCE(shop_last,'1970-01-01')) >= NOW() - INTERVAL 30 DAY THEN 'a: 0-30 days' WHEN GREATEST(COALESCE(last_at,'1970-01-01'), COALESCE(shop_last,'1970-01-01')) >= NOW() - INTERVAL 90 DAY THEN 'b: 31-90' WHEN GREATEST(COALESCE(last_at,'1970-01-01'), COALESCE(shop_last,'1970-01-01')) >= NOW() - INTERVAL 180 DAY THEN 'c: 91-180' WHEN GREATEST(COALESCE(last_at,'1970-01-01'), COALESCE(shop_last,'1970-01-01')) >= NOW() - INTERVAL 365 DAY THEN 'd: 181-365' WHEN GREATEST(COALESCE(last_at,'1970-01-01'), COALESCE(shop_last,'1970-01-01')) > '1970-01-01' THEN 'e: over a year' ELSE 'f: no date anywhere' END b, COUNT(*) c FROM customer_facts WHERE orders_n > 0 GROUP BY b ORDER BY b")->fetchAll(PDO::FETCH_NUM) as $x) echo sprintf("   best known last order %-22s %s\n", $x[0], number_format($x[1])); } catch (Throwable $e) { echo "   n/a: " . substr($e->getMessage(), 0, 90) . "\n"; }
          echo "wa_cust (Shopify copy) with a last order: " . $n("SELECT COUNT(*) FROM wa_cust WHERE n > 0 AND last_order IS NOT NULL") . " of " . $n("SELECT COUNT(*) FROM wa_cust WHERE n > 0") . "\n";
          echo "\n=== funnel counting state ===\n";
          try { foreach ($d->query("SELECT setting_key, LEFT(setting_value, 40) FROM hrms_settings WHERE setting_key IN ('wa_cfun_v','wa_cfun_cur','wa_cfun_curf','wa_cfun_full','wa_cfun_at')")->fetchAll(PDO::FETCH_NUM) as $x) echo "   " . $x[0] . " = " . $x[1] . "\n"; } catch (Throwable $e) { }
          echo "Rows with a score above 0: " . $n("SELECT COUNT(*) FROM wa_cfun WHERE score > 0") . " · rows with a value group: " . $n("SELECT COUNT(*) FROM wa_cfun WHERE val <> ''") . " · tags in wa_auto_tags by source: ";
          try { foreach ($d->query("SELECT src, COUNT(*) FROM wa_auto_tags GROUP BY src")->fetchAll(PDO::FETCH_NUM) as $x) echo $x[0] . "=" . number_format($x[1]) . " "; } catch (Throwable $e) { echo "n/a"; } echo "\n";
          PHP
          php /tmp/cust_numbers.php "$P"; rm -f /tmp/cust_numbers.php
          REMOTE

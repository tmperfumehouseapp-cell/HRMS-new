# READ-ONLY: marketplace (Myntra / Amazon / Flipkart) orders of the sales people and the commission cache that pays them. Prints counts and flags only (no phone numbers, no names).
# Changes nothing. Run it by hand: Actions → "Auto assign check (read-only)" → Run workflow.
name: Marketplace orders check (read-only)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Marketplace
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          cat > /tmp/mp_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; require $f;
          $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
          $S = function ($k) use ($d) { $q = $d->prepare("SELECT setting_value FROM hrms_settings WHERE setting_key = ?"); $q->execute([$k]); $v = $q->fetchColumn(); return $v === false ? "(not set)" : $v; };
          echo "server " . date("Y-m-d H:i:s") . " · mp_flat_pct = " . $S("mp_flat_pct") . " (not set = 6)\n";
          $nm = []; foreach ($d->query("SELECT employee_id, full_name FROM employees") as $r) $nm[(int)$r["employee_id"]] = $r["full_name"];
          try { $d->query("SELECT channel FROM manual_orders LIMIT 0"); echo "manual_orders.channel column: yes\n"; } catch (Throwable $e) { echo "manual_orders.channel column: NO (no marketplace order was ever added)\n"; exit; }
          echo "=== marketplace orders, last 7 days (day · channel · order no · person · amount · expected 6%) ===\n";
          $rows = $d->query("SELECT manual_order_id, order_no, order_date, total, employee_id, channel FROM manual_orders WHERE channel IN ('Myntra','Amazon','Flipkart') AND order_date >= DATE_SUB(NOW(), INTERVAL 7 DAY) ORDER BY order_date")->fetchAll(PDO::FETCH_ASSOC);
          $sum = []; foreach ($rows as $r) { echo "  " . substr($r["order_date"], 0, 16) . " · " . $r["channel"] . " · #" . $r["order_no"] . " · " . ($nm[(int)$r["employee_id"]] ?? $r["employee_id"]) . " · " . $r["total"] . " · " . round($r["total"] * 0.06, 2) . "\n"; $k = ($nm[(int)$r["employee_id"]] ?? $r["employee_id"]); $sum[$k] = ($sum[$k] ?? 0) + $r["total"] * 0.06; }
          echo "orders: " . count($rows) . "\n=== expected marketplace commission per person (6% of the amounts above) ===\n"; foreach ($sum as $k => $v) echo "  $k: " . round($v, 2) . "\n";
          echo "=== employee_id = 0 marketplace orders (counted for nobody) ===\n  " . $d->query("SELECT COUNT(*) FROM manual_orders WHERE channel IN ('Myntra','Amazon','Flipkart') AND employee_id = 0")->fetchColumn() . "\n";
          echo "=== commission cache (cm_paid_cache): newest 6 days, when each was last made ===\n";
          try { foreach ($d->query("SELECT day, ver, at FROM cm_paid_cache ORDER BY day DESC LIMIT 6") as $r) echo "  " . $r["day"] . " · ver " . $r["ver"] . " · made " . $r["at"] . "\n"; } catch (Throwable $e) { echo "  (no cache table)\n"; }
          
          PHP
          php /tmp/mp_check.php "$P"; rm -f /tmp/mp_check.php
          REMOTE

# READ-ONLY look at the Lineup on the VPS: is the new code there, did it start, which tables / settings / messages exist, what the engine log says. Counts and names only (no phone numbers, no customer data).
# Changes nothing. Run it by hand: Actions → "Lineup check (read-only)" → Run workflow.
name: Lineup check (read-only)

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Run the Lineup screen's own queries (overview, status, summary, report) on the real data and print errors and timings"
        type: boolean
        default: false
      brief:
        description: "Short report: skip the lists of existing messages"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Lineup state
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "${{ inputs.brief }}" "${{ inputs.probe }}" <<'REMOTE' || true
          P="$1"; export LN_BRIEF="$2"; export LN_PROBE="$3"
          if [ "$LN_PROBE" = "true" ]; then
          echo "=== server files ===" ; echo "whatsapp.html: $(grep -o 'wa_camp_ui.js?v=c[0-9]*' "$P"whatsapp.html) · wa_camp_ui.js $(stat -c '%y' "$P"assets/js/wa_camp_ui.js | cut -c1-19) · top-space marker: $(grep -c 'its own space' "$P"assets/js/wa_camp_ui.js) · speed cache marker: $(grep -c 'ONCE per message and 45 seconds' "$P"empmanagment/wa_line.php) · server time $(date '+%H:%M:%S')"
          cat > /tmp/ln_probe.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; require $f;
          $pdo = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION, PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC]);
          function json_response($a, $c = 200) { throw new Exception("json_response"); } function wa_log($p, $k, $ok, $i) { }
          function setting_get($p, $k, $d = "") { $q = $p->prepare("SELECT setting_value FROM hrms_settings WHERE setting_key = ?"); $q->execute([$k]); $v = $q->fetchColumn(); return $v === false ? $d : (string)$v; } function setting_set($p, $k, $v) { }
          function wa_key($n) { $d = preg_replace('/\D+/', '', (string)$n); return strlen($d) > 10 ? substr($d, -10) : $d; }
          $action = ""; require $argv[1] . "empmanagment/wa_line.php";
          echo "\n=== PROBE: the Lineup screen's queries on the real data ===\n";
          foreach (["wl_status" => fn() => wl_status($pdo, false), "wl_summary today" => fn() => wl_summary($pdo, strtotime(date("Y-m-d 00:00:00"))), "wl_summary total" => fn() => wl_summary($pdo, (int)strtotime(wl_cfg($pdo)["started"]) - 60), "wl_report" => fn() => wl_report($pdo, 30), "wl_overview" => fn() => wl_overview($pdo)] as $n => $fn) { $t = microtime(true); try { $r = $fn(); echo "  $n: ok in " . round(microtime(true) - $t, 2) . " s" . (isset($r["sent"]) ? " · sent " . $r["sent"] . " replied " . $r["replied"] . " orders " . $r["orders"] . " cost " . $r["cost"] : "") . "\n"; } catch (Throwable $e) { echo "  $n: FAIL after " . round(microtime(true) - $t, 2) . " s: " . substr($e->getMessage(), 0, 300) . " @ " . basename($e->getFile()) . ":" . $e->getLine() . "\n"; } }
          echo "  last round: " . setting_get($pdo, "wl_last_round", "(none yet)") . "\n";
          try { foreach ($pdo->query("SELECT why, COUNT(*) n FROM wa_line_plan WHERE status = 'failed' GROUP BY why ORDER BY n DESC LIMIT 6")->fetchAll() as $r) echo "  failed because: " . substr(preg_replace('/\s+/', ' ', (string)$r["why"]), 0, 220) . " x" . $r["n"] . "\n"; foreach ($pdo->query("SELECT tpl_key, step, COUNT(*) n FROM wa_line_plan WHERE status = 'failed' GROUP BY tpl_key, step ORDER BY n DESC LIMIT 6")->fetchAll() as $r) echo "  failed at " . $r["tpl_key"] . " step " . $r["step"] . ": " . $r["n"] . "\n"; foreach ($pdo->query("SELECT status, COUNT(*) n FROM wa_line_plan WHERE status IN ('sent','failed') AND sent_at >= '" . date("Y-m-d H:i:s", time() - 360) . "' GROUP BY status")->fetchAll() as $r) echo "  last 6 minutes " . $r["status"] . ": " . $r["n"] . "\n"; } catch (Throwable $e) { echo "  failed-reason query FAIL: " . $e->getMessage() . "\n"; }
          try { $ov = wl_overview($pdo); echo "  customers by the day they wrote: " . json_encode($ov["by_day"]) . "\n"; try { $tz0 = date("Y-m-d 00:00:00"); $vin = $pdo->query("SELECT COUNT(*) FROM wa_line_plan p WHERE p.status = 'sent' AND p.sent_at >= '" . $tz0 . "' AND p.why = '' AND EXISTS (SELECT 1 FROM wa_messages m WHERE (m.phone COLLATE utf8mb4_unicode_ci) = (p.phone COLLATE utf8mb4_unicode_ci) AND m.dir = 'in' AND m.ts > DATE_SUB(p.sent_at, INTERVAL 24 HOUR) AND m.ts < p.sent_at)")->fetchColumn(); $vout = $pdo->query("SELECT COUNT(*) FROM wa_line_plan p WHERE p.status = 'sent' AND p.sent_at >= '" . $tz0 . "' AND p.why = '' AND EXISTS (SELECT 1 FROM wa_messages m WHERE (m.phone COLLATE utf8mb4_unicode_ci) = (p.phone COLLATE utf8mb4_unicode_ci) AND m.dir = 'out' AND m.who IN ('emp','person','phone') AND m.status <> 'failed' AND m.ts > DATE_SUB(p.sent_at, INTERVAL 24 HOUR) AND m.ts < p.sent_at)")->fetchColumn(); echo "  CHECK sent today to a customer who wrote in the 24 h before: " . $vin . " · to one a salesperson wrote to in the 24 h before: " . $vout . "\n"; } catch (Throwable $e) { echo "  CHECK failed: " . substr($e->getMessage(), 0, 120) . "\n"; } try { foreach ($pdo->query("SELECT m.err_code c, COUNT(*) n FROM wa_line_plan p JOIN wa_messages m ON (m.wamid COLLATE utf8mb4_unicode_ci) = (p.wamid COLLATE utf8mb4_unicode_ci) WHERE p.status = 'sent' AND p.sent_at >= '" . date("Y-m-d 00:00:00") . "' AND m.status = 'failed' GROUP BY m.err_code ORDER BY n DESC LIMIT 8")->fetchAll() as $r) echo "  RECEIPT FAILED today, code " . $r["c"] . ": " . $r["n"] . "\n"; echo "  RESCUED (utility again) rows today: " . $pdo->query("SELECT COUNT(*) FROM wa_line_plan WHERE status = 'sent' AND why LIKE 'utility rescue%' AND sent_at >= '" . date("Y-m-d 00:00:00") . "'")->fetchColumn() . "\n"; } catch (Throwable $e) { echo "  RECEIPT check failed: " . substr($e->getMessage(), 0, 100) . "\n"; } try { foreach ($pdo->query("SELECT SUBSTR(why, 1, 34) w, COUNT(*) n FROM wa_line_plan WHERE (why LIKE 'rescue%' OR why LIKE 'rescued%' OR why LIKE 'utility rescue%') AND sent_at >= '" . date("Y-m-d 00:00:00") . "' GROUP BY SUBSTR(why, 1, 34) ORDER BY n DESC LIMIT 8")->fetchAll() as $r) echo "  RESCUE reason: " . $r["w"] . " : " . $r["n"] . "\n"; } catch (Throwable $e) { echo "  RESCUE reason check failed: " . substr($e->getMessage(), 0, 100) . "\n"; } try { $t0 = date("Y-m-d 00:00:00"); $pl = []; foreach ($pdo->query("SELECT phone, MAX(sent_at) s FROM wa_line_plan WHERE status = 'sent' AND sent_at >= '" . $t0 . "' GROUP BY phone")->fetchAll() as $r) $pl[(string)$r["phone"]] = (string)$r["s"]; $rep = []; foreach (array_chunk(array_keys($pl), 400) as $ch) { $x = $pdo->prepare("SELECT phone, MIN(ts) t FROM wa_messages WHERE dir = 'in' AND ts >= ? AND phone IN (" . implode(",", array_fill(0, count($ch), "?")) . ") GROUP BY phone"); $x->execute(array_merge([$t0], $ch)); foreach ($x->fetchAll() as $r) if ((string)$r["t"] > $pl[(string)$r["phone"]]) $rep[(string)$r["phone"]] = (string)$r["t"]; } $who = []; $none = 0; $dly = []; $q2 = $pdo->prepare("SELECT who, ts FROM wa_messages WHERE phone = ? AND dir = 'out' AND ts > ? AND ts <= DATE_ADD(?, INTERVAL 30 MINUTE) ORDER BY id LIMIT 1"); foreach ($rep as $ph => $tt) { $q2->execute([$ph, $tt, $tt]); $o = $q2->fetch(); if (!$o) { $none++; continue; } $who[(string)$o["who"]] = ($who[(string)$o["who"]] ?? 0) + 1; $dly[] = strtotime($o["ts"]) - strtotime($tt); } sort($dly); echo "  AFTER A REPLY (customers who wrote after a Lineup message today): " . count($rep) . " · first answer within 30 min by: " . json_encode($who) . " · no answer in 30 min: " . $none . " · median delay s: " . ($dly ? $dly[intdiv(count($dly), 2)] : "n/a") . "\n"; } catch (Throwable $e) { echo "  AFTER A REPLY check failed: " . substr($e->getMessage(), 0, 100) . "\n"; } echo "  TODAY left by hour (IST): " . json_encode($ov["today"]["left_by_hour"] ?? []) . " · today sent " . ($ov["today"]["sent"] ?? 0) . " of " . ($ov["today"]["total"] ?? 0) . " · now " . date("H:i") . "\n"; $dd = $pdo->query("SELECT COUNT(*) FROM wa_line_plan p JOIN wa_line_cust c ON c.phone = p.phone WHERE p.status = 'planned' AND c.status = 'active' AND p.due_at <= NOW()")->fetchColumn(); echo "  DUE NOW (planned, due time passed, active): " . $dd . "\n"; echo "  PLAN (steps waiting, day of the ladder): " . json_encode($ov["calendar"]["steps"] ?? []) . "\n  PLAN (calendar day => messages): " . json_encode($ov["calendar"]["days"] ?? []) . "\n"; echo "  customers: " . json_encode($ov["status"]["customers"]) . "\n"; echo "  today: " . json_encode($ov["summary"]["today"]) . "\n"; echo "  total: " . json_encode($ov["summary"]["total"]) . "\n"; echo "  since: " . date("Y-m-d H:i", wl_cfg($pdo)["since"]) . "\n"; } catch (Throwable $e) { echo "  overview detail FAIL: " . $e->getMessage() . "\n"; }
          try { $now = time(); $b = []; foreach ($pdo->query("SELECT c.hot, c.hot_why, c.assigned_emp, c.cx_id, c.last_in_at FROM wa_contacts c WHERE c.status = 'open' AND c.optout = 0 AND c.last_in_at >= '" . date("Y-m-d H:i:s", $now - 23 * 3600) . "' AND c.last_in_at <= '" . date("Y-m-d H:i:s", $now - 60) . "' AND (c.last_out_at IS NULL OR c.last_out_at < c.last_in_at) LIMIT 300")->fetchAll(PDO::FETCH_ASSOC) as $r) { $k = ((int)$r["cx_id"] > 0 ? "complaint" : ($r["hot"] ? "hot " . $r["hot_why"] : "other")) . " | " . ($now - strtotime($r["last_in_at"]) < 14400 ? "<4h" : ">4h") . " | " . ((int)$r["assigned_emp"] > 0 ? "person" : "OPEN"); $b[$k] = ($b[$k] ?? 0) + 1; } arsort($b); echo "  BOT7 unanswered open chats: " . json_encode(array_slice($b, 0, 12), JSON_UNESCAPED_UNICODE) . "\n"; } catch (Throwable $e) { echo "  BOT7 error\n"; }
          try { $t = date("Y-m-d 00:00:00"); $st = []; foreach ($pdo->query("SELECT body, phone, ts FROM wa_messages WHERE dir = 'sys' AND body LIKE '%The bot followed up%' AND ts >= '" . $t . "' ORDER BY id DESC LIMIT 400")->fetchAll(PDO::FETCH_ASSOC) as $r) { if (preg_match("/step (\d)/", $r["body"], $m)) $st[$m[1]] = ($st[$m[1]] ?? 0) + 1; $ev[] = $r; } ksort($st); $sm = []; foreach (array_slice($ev ?? [], 0, 4) as $r) { $q = $pdo->prepare("SELECT body FROM wa_messages WHERE phone = ? AND dir = 'out' AND who = 'bot' AND ts >= ? ORDER BY id LIMIT 1"); $q->execute([$r["phone"], date("Y-m-d H:i:s", strtotime($r["ts"]) - 120)]); $sm[] = substr(preg_replace("/\s+/", " ", (string)$q->fetchColumn()), 0, 150); } $ans = 0; $vv = []; foreach (array_slice($ev ?? [], 0, 150) as $r) { $q = $pdo->prepare("SELECT COUNT(*) FROM wa_messages WHERE phone = ? AND dir = 'in' AND ts > ? AND ts <= ?"); $q->execute([$r["phone"], $r["ts"], date("Y-m-d H:i:s", strtotime($r["ts"]) + 7200)]); $hit = (int)$q->fetchColumn() > 0; if ($hit) $ans++; $pv = preg_match("/\\[([AB])\\]/", $r["body"], $mv) ? $mv[1] : (strpos($r["body"], "salesperson") !== false ? "P" : "-"); $vv[$pv][0] = ($vv[$pv][0] ?? 0) + 1; if ($hit) $vv[$pv][1] = ($vv[$pv][1] ?? 0) + 1; } $qq = $pdo->query("SELECT SUM(body LIKE '%?%'), COUNT(*) FROM wa_messages WHERE dir = 'out' AND who = 'bot' AND mtype = 'text' AND ts >= '" . $t . "'")->fetch(PDO::FETCH_NUM); echo "  BOT21 bot follow-ups today by step: " . json_encode($st) . " · total " . count($ev ?? []) . " · wrote back within 2 h (newest 150): " . $ans . " · bot texts ending with a question: " . $qq[0] . " of " . $qq[1] . " · by wording (n, replied; A plain, B buttons, P person-held, - old): " . json_encode($vv) . " · samples: " . implode(" || ", $sm) . "\n"; } catch (Throwable $e) { echo "  BOT21 error " . $e->getMessage() . "\n"; }
          try { $ref = strtotime((string)$pdo->query("SELECT MAX(ts) FROM wa_messages")->fetchColumn()); $q = $pdo->prepare("SELECT m.ts, (SELECT MAX(i.ts) FROM wa_messages i WHERE i.phone = m.phone AND i.dir = 'in' AND i.ts <= m.ts) it FROM wa_messages m WHERE m.dir = 'out' AND m.who = 'bot' AND m.mtype = 'text' AND m.ts >= ? AND NOT EXISTS (SELECT 1 FROM wa_messages e WHERE e.phone = m.phone AND e.dir = 'sys' AND e.body LIKE '%followed up%' AND e.ts BETWEEN DATE_SUB(m.ts, INTERVAL 8 SECOND) AND DATE_ADD(m.ts, INTERVAL 8 SECOND)) LIMIT 2500"); $q->execute([date("Y-m-d H:i:s", $ref - 3600)]); $w = ["10" => [], "60" => []]; foreach ($q->fetchAll(PDO::FETCH_NUM) as $r) { $d = strtotime($r[0]) - strtotime((string)$r[1]); if (!$r[1] || $d < 0 || $d > 900) continue; $w[strtotime($r[0]) >= $ref - 600 ? "10" : "60"][] = $d; } $o = []; foreach ($w as $k => $a) { sort($a); $n = count($a); $o[] = ($k == "10" ? "last 10 min" : "10-60 min ago") . " n " . $n . " p50 " . ($n ? $a[intdiv($n, 2)] : "-") . "s p75 " . ($n ? $a[(int)($n * 0.75)] : "-") . "s p90 " . ($n ? $a[(int)($n * 0.9)] : "-") . "s >20s " . count(array_filter($a, fn($x) => $x > 20)) . " >60s " . count(array_filter($a, fn($x) => $x > 60)) . " >120s " . count(array_filter($a, fn($x) => $x > 120)); } $nw = $pdo->prepare("SELECT COUNT(*), COALESCE(MAX(TIMESTAMPDIFF(SECOND, last_in_at, ?)), 0) FROM wa_contacts WHERE status = 'open' AND optout = 0 AND (cx_id IS NULL OR cx_id = 0) AND last_in_at >= ? AND last_in_at <= ? AND (last_out_at IS NULL OR last_out_at < last_in_at) AND (assigned_emp IS NULL OR assigned_emp = 0)"); $nw->execute([date("Y-m-d H:i:s", $ref), date("Y-m-d H:i:s", $ref - 900), date("Y-m-d H:i:s", $ref - 20)]); $x = $nw->fetch(PDO::FETCH_NUM); echo "  BOT32 bot reply delay (follow-ups excluded) " . implode(" || ", $o) . " · waiting unassigned chats >20s: " . $x[0] . " (oldest " . $x[1] . "s)\n"; } catch (Throwable $e) { echo "  BOT32 error " . $e->getMessage() . "\n"; }
          try { $t0 = date("Y-m-d 00:00:00"); $ac = $pdo->query("SELECT status, COUNT(*), COALESCE(SUM(amount), 0), COALESCE(SUM(n), 0) FROM wag_addon WHERE at >= '" . $t0 . "' GROUP BY status")->fetchAll(PDO::FETCH_NUM); $m = $pdo->query("SELECT CONCAT(SUBSTRING_INDEX(v, '|', 1), IF(v LIKE 'skip|%', CONCAT(':', SUBSTRING_INDEX(v, '|', -1)), '')) st, COUNT(*) FROM wq_meta WHERE k LIKE 'addon:%' AND v NOT LIKE 'claim%' GROUP BY 1")->fetchAll(PDO::FETCH_KEY_PAIR); $pc = (int)$pdo->query("SELECT COUNT(DISTINCT phone) FROM wa_messages WHERE dir = 'in' AND ts >= '" . date("Y-m-d H:i:s", time() - 7200) . "' AND body REGEXP '(^|[^0-9])[0-9]{6}([^0-9]|$)'")->fetchColumn(); echo "  BOT31 addon today (status,n,Rs,bottles) " . json_encode($ac) . " · meta " . json_encode($m) . " · pincode chats 2h " . $pc . " · tune " . setting_get($pdo, "wag_tune_log", "") . "\n"; } catch (Throwable $e) { echo "  BOT31 error " . $e->getMessage() . "\n"; }
          try { date_default_timezone_set("Asia/Kolkata"); $now = time(); $q = $pdo->prepare("SELECT COUNT(*) c, SUM(c.last_in_at <= ?) due FROM wa_contacts c JOIN (SELECT phone, MAX(ts) z FROM wa_messages WHERE dir = 'out' AND who = 'bot' AND ts >= ? GROUP BY phone) b ON b.phone = c.phone WHERE c.status = 'open' AND c.optout = 0 AND (c.cx_id IS NULL OR c.cx_id = 0) AND c.last_in_at >= ? AND c.last_out_at IS NOT NULL AND c.last_out_at > c.last_in_at AND c.last_out_at <= DATE_ADD(b.z, INTERVAL 5 SECOND)"); $q->execute([date("Y-m-d H:i:s", $now - 300), date("Y-m-d H:i:s", $now - 23 * 3600), date("Y-m-d H:i:s", $now - 22 * 3600 - 1800)]); $r = $q->fetch(PDO::FETCH_ASSOC); echo "  BOT23 follow-up candidates: " . $r["c"] . " · due: " . $r["due"] . " · settings: bfu_on=" . setting_get($pdo, "wag_bfu_on", "1") . " bfu_at_age=" . ($now - (int)setting_get($pdo, "wag_bfu_at", "0")) . "s bfu_n=" . setting_get($pdo, "wag_bfu_n", "0") . " dbg=" . setting_get($pdo, "wag_bfu_dbg", "-") . "\n"; } catch (Throwable $e) { echo "  BOT23 error " . $e->getMessage() . "\n"; }
          try { $r8 = $pdo->query("SELECT COUNT(*) n, SUM(body REGEXP '(^|[^0-9])10 ?ml|solid|shower|roll-?on|\\bwax\\b|candle') bad FROM wa_messages WHERE dir = 'out' AND who = 'bot' AND ts >= '" . date("Y-m-d H:i:s", time() - 1200) . "'")->fetch(PDO::FETCH_ASSOC); echo "  BOT8 bot messages in the last 20 min: " . $r8["n"] . " · mentioning solid / shower gel / 10 ml / roll-on / wax / candle (must be ~0): " . $r8["bad"] . "\n"; $h8 = $pdo->query("SELECT COUNT(*) FROM wq_meta WHERE k LIKE 'bothand:%' AND v >= '" . date("Y-m-d H:i:s", time() - 1200) . "'")->fetchColumn(); echo "  BOT8 bot hand-overs in the last 20 min: " . $h8 . "\n"; $ms = $pdo->query("SELECT info FROM wa_log WHERE kind = 'botms' ORDER BY id DESC LIMIT 300")->fetchAll(PDO::FETCH_COLUMN); $v8 = []; $w8 = []; foreach ($ms as $m8) { if (preg_match("/ai ([0-9.]+) s/", $m8, $x8)) $v8[] = (float)$x8[1]; if (preg_match("/wait ([0-9]+) s/", $m8, $y8)) $w8[] = (int)$y8[1]; } sort($v8); sort($w8); $n8 = count($v8); echo "  BOT8 bot speed split (last " . $n8 . " answers): AI call median " . ($n8 ? $v8[intdiv($n8, 2)] : "n/a") . " s · p90 " . ($n8 ? $v8[(int)($n8 * 0.9)] : "n/a") . " s | customer waited before the bot started: median " . ($w8 ? $w8[intdiv(count($w8), 2)] : "n/a") . " s · p90 " . ($w8 ? $w8[(int)(count($w8) * 0.9)] : "n/a") . " s\n"; } catch (Throwable $e) { echo "  BOT8 error\n"; }
          try {  echo "  BOT10 settings: waa_off=" . setting_get($pdo, "waa_off", "?") . " wag_open_market=" . setting_get($pdo, "wag_open_market", "?") . " wq_auto_on=" . setting_get($pdo, "wq_auto_on", "?") . " manual=" . setting_get($pdo, "wa_manual_assign", "?") . " cutover=[" . setting_get($pdo, "wq_cutover", "") . "] bot_heartbeat_age_s=" . (time() - (int)setting_get($pdo, "wag_tick_at", "0")) . "\n"; } catch (Throwable $e) { echo "  BOT10 error " . $e->getMessage() . "\n"; }
          try { $t12 = date("Y-m-d 00:00:00"); $act = []; foreach ($pdo->query("SELECT e.full_name n, COUNT(*) c FROM wa_messages m JOIN employees e ON e.employee_id = m.emp_id WHERE m.dir = 'out' AND m.emp_id > 0 AND m.ts >= '" . date("Y-m-d H:i:s", time() - 900) . "' GROUP BY m.emp_id ORDER BY c DESC LIMIT 14")->fetchAll(PDO::FETCH_ASSOC) as $r) $act[] = $r["n"] . " " . $r["c"]; echo "  BOT12 salespeople who wrote to customers in the last 15 min (" . count($act) . "): " . implode(" · ", $act) . "\n"; foreach ($pdo->query("SELECT kind, COUNT(*) n FROM wa_mkt WHERE at >= '" . $t12 . "' GROUP BY kind")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "  BOT12 open market today " . $r["kind"] . ": " . $r["n"] . "\n"; $o12 = $pdo->query("SELECT COUNT(*) n, COALESCE(SUM(amount), 0) a FROM wa_outcomes WHERE code = 'order' AND at >= '" . $t12 . "'")->fetch(PDO::FETCH_ASSOC); $a12 = $pdo->query("SELECT COUNT(*) FROM wa_messages WHERE dir = 'sys' AND mtype = 'event' AND ts >= '" . $t12 . "' AND body LIKE '%collected the order details%'")->fetchColumn(); echo "  BOT12 today: addresses collected by the bot " . $a12 . " · orders recorded by salespeople " . $o12["n"] . " (Rs " . round($o12["a"]) . ")\n"; } catch (Throwable $e) { echo "  BOT12 error " . $e->getMessage() . "\n"; }
          try { $t13 = date("Y-m-d 00:00:00"); $o13 = []; foreach ($pdo->query("SELECT who, COUNT(*) m, COUNT(DISTINCT phone) c FROM wa_messages WHERE dir = 'out' AND ts >= '" . $t13 . "' AND mtype IN ('text','template') GROUP BY who ORDER BY m DESC LIMIT 8")->fetchAll(PDO::FETCH_ASSOC) as $r) $o13[] = $r["who"] . ": " . $r["m"] . " messages to " . $r["c"] . " chats"; $u13 = $pdo->query("SELECT COUNT(DISTINCT phone) FROM wa_messages WHERE dir = 'out' AND ts >= '" . $t13 . "' AND mtype IN ('text','template')")->fetchColumn(); echo "  BOT13 today we wrote to " . $u13 . " different chats · by sender: " . implode(" · ", $o13) . "\n"; } catch (Throwable $e) { echo "  BOT13 error\n"; }
          PHP
          php /tmp/ln_probe.php "$P"; rm -f /tmp/ln_probe.php
          exit 0
          fi
          echo "=== files on the server ==="

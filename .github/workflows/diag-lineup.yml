# READ-ONLY look at the Lineup on the VPS: is the new code there, did it start, which tables / settings / messages exist, what the engine log says. Counts and names only (no phone numbers, no customer data).
# Changes nothing. Run it by hand: Actions → "Lineup check (read-only)" → Run workflow.
name: Lineup check (read-only)

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Run the Lineup screen's own queries (overview, status, summary, report) on the real data and print errors and timings"
        type: boolean
        default: false
      tpls:
        description: "List the approved text templates (id, category, accounts, body) for the After-Order module"
        type: boolean
        default: false
      cli:
        description: "Run ONE command-line Lineup sending round (cron_line.php test) instead of the probe"
        type: boolean
        default: false
      brief:
        description: "Short report: skip the lists of existing messages"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Lineup state
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "${{ inputs.brief }}" "${{ inputs.probe }}" <<'REMOTE' || true
          P="$1"; export LN_BRIEF="$2"; export LN_PROBE="$3"
          if [ "$LN_PROBE" = "true" ]; then
          echo "=== server files ===" ; echo "whatsapp.html: $(grep -o 'wa_camp_ui.js?v=c[0-9]*' "$P"whatsapp.html) · wa_camp_ui.js $(stat -c '%y' "$P"assets/js/wa_camp_ui.js | cut -c1-19) · top-space marker: $(grep -c 'its own space' "$P"assets/js/wa_camp_ui.js) · speed cache marker: $(grep -c 'ONCE per message and 45 seconds' "$P"empmanagment/wa_line.php) · server time $(date '+%H:%M:%S')"
          echo "=== cron_bot on the server === file: $(stat -c %y "$P"empmanagment/cron_bot.php | cut -c1-19) · has role=fuw: $(grep -c 'role=fuw' "$P"empmanagment/cron_bot.php) · has 3 ticks: $(grep -c 'i < 3' "$P"empmanagment/cron_bot.php) · running now: $(pgrep -fc cron_bot.php) · hits of role=fuw in the access log (last 2000 lines): $(tail -n 2000 /home/*/logs/nginx/access.log 2>/dev/null | grep -c 'role=fuw')"
          echo "=== LN3 sender: cron_send hits in the last 6000 access-log lines: $(tail -n 6000 /home/*/logs/nginx/access.log 2>/dev/null | grep -c 'wa.cron_send') · fanout: $(tail -n 6000 /home/*/logs/nginx/access.log 2>/dev/null | grep -c 'wa-line-fanout') · fpm max_children: $(grep -h '^pm.max_children' /etc/php/*/fpm/pool.d/*.conf 2>/dev/null | tr '\n' ' ') · load: $(cut -d' ' -f1-3 /proc/loadavg) · fpm busy: $(pgrep -fc 'php-fpm: pool')"
          cat > /tmp/ln_probe.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; require $f;
          $pdo = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION, PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC]);
          function json_response($a, $c = 200) { throw new Exception("json_response"); } function wa_log($p, $k, $ok, $i) { }
          function setting_get($p, $k, $d = "") { $q = $p->prepare("SELECT setting_value FROM hrms_settings WHERE setting_key = ?"); $q->execute([$k]); $v = $q->fetchColumn(); return $v === false ? $d : (string)$v; } function setting_set($p, $k, $v) { }
          function wa_key($n) { $d = preg_replace('/\D+/', '', (string)$n); return strlen($d) > 10 ? substr($d, -10) : $d; }
          $action = ""; require $argv[1] . "empmanagment/wa_line.php";
          echo "\n=== PROBE: the Lineup screen's queries on the real data ===\n";
          foreach (["wl_status" => fn() => wl_status($pdo, false), "wl_summary today" => fn() => wl_summary($pdo, strtotime(date("Y-m-d 00:00:00"))), "wl_summary total" => fn() => wl_summary($pdo, (int)strtotime(wl_cfg($pdo)["started"]) - 60), "wl_report" => fn() => wl_report($pdo, 30), "wl_overview" => fn() => wl_overview($pdo)] as $n => $fn) { $t = microtime(true); try { $r = $fn(); echo "  $n: ok in " . round(microtime(true) - $t, 2) . " s" . (isset($r["sent"]) ? " · sent " . $r["sent"] . " replied " . $r["replied"] . " orders " . $r["orders"] . " cost " . $r["cost"] : "") . "\n"; } catch (Throwable $e) { echo "  $n: FAIL after " . round(microtime(true) - $t, 2) . " s: " . substr($e->getMessage(), 0, 300) . " @ " . basename($e->getFile()) . ":" . $e->getLine() . "\n"; } }
          echo "  last round: " . setting_get($pdo, "wl_last_round", "(none yet)") . "\n";
          try { foreach ($pdo->query("SELECT why, COUNT(*) n FROM wa_line_plan WHERE status = 'failed' GROUP BY why ORDER BY n DESC LIMIT 6")->fetchAll() as $r) echo "  failed because: " . substr(preg_replace('/\s+/', ' ', (string)$r["why"]), 0, 220) . " x" . $r["n"] . "\n"; foreach ($pdo->query("SELECT tpl_key, step, COUNT(*) n FROM wa_line_plan WHERE status = 'failed' GROUP BY tpl_key, step ORDER BY n DESC LIMIT 6")->fetchAll() as $r) echo "  failed at " . $r["tpl_key"] . " step " . $r["step"] . ": " . $r["n"] . "\n"; foreach ($pdo->query("SELECT status, COUNT(*) n FROM wa_line_plan WHERE status IN ('sent','failed') AND sent_at >= '" . date("Y-m-d H:i:s", time() - 360) . "' GROUP BY status")->fetchAll() as $r) echo "  last 6 minutes " . $r["status"] . ": " . $r["n"] . "\n"; } catch (Throwable $e) { echo "  failed-reason query FAIL: " . $e->getMessage() . "\n"; }
          try { $ov = wl_overview($pdo); echo "  customers by the day they wrote: " . json_encode($ov["by_day"]) . "\n"; try { foreach ($pdo->query("SELECT m.err_code c, COUNT(*) n FROM wa_line_plan p JOIN wa_messages m ON (m.wamid COLLATE utf8mb4_unicode_ci) = (p.wamid COLLATE utf8mb4_unicode_ci) WHERE p.status = 'sent' AND p.sent_at >= '" . date("Y-m-d 00:00:00") . "' AND m.status = 'failed' GROUP BY m.err_code ORDER BY n DESC LIMIT 8")->fetchAll() as $r) echo "  RECEIPT FAILED today, code " . $r["c"] . ": " . $r["n"] . "\n"; } catch (Throwable $e) { echo "  RECEIPT check failed: " . substr($e->getMessage(), 0, 100) . "\n"; } try { $t0 = date("Y-m-d 00:00:00"); $pl = []; foreach ($pdo->query("SELECT phone, MAX(sent_at) s FROM wa_line_plan WHERE status = 'sent' AND sent_at >= '" . $t0 . "' GROUP BY phone")->fetchAll() as $r) $pl[(string)$r["phone"]] = (string)$r["s"]; $rep = []; foreach (array_chunk(array_keys($pl), 400) as $ch) { $x = $pdo->prepare("SELECT phone, MIN(ts) t FROM wa_messages WHERE dir = 'in' AND ts >= ? AND phone IN (" . implode(",", array_fill(0, count($ch), "?")) . ") GROUP BY phone"); $x->execute(array_merge([$t0], $ch)); foreach ($x->fetchAll() as $r) if ((string)$r["t"] > $pl[(string)$r["phone"]]) $rep[(string)$r["phone"]] = (string)$r["t"]; } $who = []; $none = 0; $dly = []; $q2 = $pdo->prepare("SELECT who, ts FROM wa_messages WHERE phone = ? AND dir = 'out' AND ts > ? AND ts <= DATE_ADD(?, INTERVAL 30 MINUTE) ORDER BY id LIMIT 1"); foreach ($rep as $ph => $tt) { $q2->execute([$ph, $tt, $tt]); $o = $q2->fetch(); if (!$o) { $none++; continue; } $who[(string)$o["who"]] = ($who[(string)$o["who"]] ?? 0) + 1; $dly[] = strtotime($o["ts"]) - strtotime($tt); } sort($dly); echo "  AFTER A REPLY (customers who wrote after a Lineup message today): " . count($rep) . " · first answer within 30 min by: " . json_encode($who) . " · no answer in 30 min: " . $none . " · median delay s: " . ($dly ? $dly[intdiv(count($dly), 2)] : "n/a") . "\n"; } catch (Throwable $e) { echo "  AFTER A REPLY check failed: " . substr($e->getMessage(), 0, 100) . "\n"; } echo "  TODAY left by hour (IST): " . json_encode($ov["today"]["left_by_hour"] ?? []) . " · today sent " . ($ov["today"]["sent"] ?? 0) . " of " . ($ov["today"]["total"] ?? 0) . " · now " . date("H:i") . "\n"; $dd = $pdo->query("SELECT COUNT(*) FROM wa_line_plan p JOIN wa_line_cust c ON c.phone = p.phone WHERE p.status = 'planned' AND c.status = 'active' AND p.due_at <= NOW()")->fetchColumn(); echo "  DUE NOW (planned, due time passed, active): " . $dd . "\n"; echo "  PLAN (steps waiting, day of the ladder): " . json_encode($ov["calendar"]["steps"] ?? []) . "\n  PLAN (calendar day => messages): " . json_encode($ov["calendar"]["days"] ?? []) . "\n"; echo "  customers: " . json_encode($ov["status"]["customers"]) . "\n"; echo "  today: " . json_encode($ov["summary"]["today"]) . "\n"; echo "  total: " . json_encode($ov["summary"]["total"]) . "\n"; echo "  since: " . date("Y-m-d H:i", wl_cfg($pdo)["since"]) . "\n"; } catch (Throwable $e) { echo "  overview detail FAIL: " . $e->getMessage() . "\n"; }
          try { $tz0 = date_default_timezone_get() . " " . date("H:i"); date_default_timezone_set("Asia/Kolkata"); $in = date("Y-m-d H:i:s"); $sh = $pdo->query("SELECT MOD(CAST(RIGHT(p.phone, 6) AS UNSIGNED), 8) k, COUNT(DISTINCT p.phone) n FROM wa_line_plan p JOIN wa_line_cust c ON c.phone = p.phone WHERE p.status = 'planned' AND c.status = 'active' AND p.due_at <= '" . $in . "' GROUP BY k ORDER BY k")->fetchAll(PDO::FETCH_KEY_PAIR); echo "  LN4 default tz " . $tz0 . " · due customers per shard " . json_encode($sh) . "\n"; $x = $pdo->query("SELECT NOW(), SUM(p.due_at <= '" . $in . "'), SUM(p.due_at <= '" . $in . "' AND c.status = 'active'), MIN(p.due_at), SUM(p.due_at <= '" . $in . "' AND p.due_at >= '" . date("Y-m-d 00:00:00") . "'), COUNT(DISTINCT IF(p.due_at <= '" . $in . "' AND c.status = 'active', p.phone, NULL)), COUNT(DISTINCT IF(p.due_at <= '" . $in . "' AND p.step = 1, p.phone, NULL)) FROM wa_line_plan p JOIN wa_line_cust c ON c.phone = p.phone WHERE p.status = 'planned'")->fetch(PDO::FETCH_NUM); $by = $pdo->query("SELECT SUBSTR(p.due_at, 6, 8) d, COUNT(*) n FROM wa_line_plan p JOIN wa_line_cust c ON c.phone = p.phone WHERE p.status = 'planned' AND c.status = 'active' AND p.due_at <= '" . $in . "' GROUP BY d ORDER BY d DESC LIMIT 6")->fetchAll(PDO::FETCH_KEY_PAIR); echo "  LN2 IST now " . $in . " · db NOW " . $x[0] . " · planned due(IST) " . $x[1] . " · of them active " . $x[2] . " · oldest due " . $x[3] . " · due today " . $x[4] . " · DISTINCT customers due " . $x[5] . " (at step 1: " . $x[6] . ")" . " · by date " . json_encode($by) . " · sent last 10 min(IST) " . $pdo->query("SELECT COUNT(*) FROM wa_line_plan WHERE status = 'sent' AND sent_at >= '" . date("Y-m-d H:i:s", time() - 600) . "'")->fetchColumn() . "\n"; } catch (Throwable $e) { echo "  LN2 error " . $e->getMessage() . "\n"; }
          try { $t6 = date("Y-m-d 00:00:00"); $q6 = $pdo->query("SELECT x.emp, COUNT(*) n, SUM(x.total) r FROM (SELECT o.total, (SELECT m.emp_id FROM wa_messages m WHERE (m.phone COLLATE utf8mb4_unicode_ci) = (RIGHT(REPLACE(REPLACE(REPLACE(o.phone, '+', ''), ' ', ''), '-', ''), 10) COLLATE utf8mb4_unicode_ci) AND m.dir = 'out' AND m.emp_id > 0 AND m.ts <= o.created_at AND m.ts >= DATE_SUB(o.created_at, INTERVAL 3 DAY) ORDER BY m.id DESC LIMIT 1) emp FROM shop_orders o WHERE o.created_at >= '" . $t6 . "') x GROUP BY x.emp"); $tk = $pdo->query("SELECT emp_id, COUNT(*) FROM wa_mkt WHERE kind = 'taken' AND at >= '" . $t6 . "' GROUP BY emp_id")->fetchAll(PDO::FETCH_KEY_PAIR); $nm = $pdo->query("SELECT employee_id, full_name FROM employees")->fetchAll(PDO::FETCH_KEY_PAIR); $rows6 = []; $un = 0; $tot = 0; foreach ($q6->fetchAll(PDO::FETCH_NUM) as $r) { $tot += (int)$r[1]; if (!$r[0]) { $un = (int)$r[1]; continue; } $t = (int)($tk[$r[0]] ?? 0); $rows6[] = [explode(" ", (string)($nm[$r[0]] ?? $r[0]))[0], (int)$r[1], (int)$r[2], $t]; } usort($rows6, function ($x, $y) { return $y[1] <=> $x[1]; }); $o6 = []; foreach (array_slice($rows6, 0, 16) as $r) $o6[] = $r[0] . " orders " . $r[1] . " Rs " . $r[2] . " AOV " . round($r[2] / max(1, $r[1])) . " took " . $r[3] . ($r[3] ? " ratio " . round($r[1] / $r[3], 2) : ""); echo "  LN6 REAL orders today by salesperson who wrote last (total " . $tot . ", no salesperson " . $un . "): " . implode(" · ", $o6) . "\n"; } catch (Throwable $e) { echo "  LN6 error " . $e->getMessage() . "\n"; }
          try { $o = []; foreach ($pdo->query("SELECT HOUR(sent_at) h, COUNT(*) n FROM wa_line_plan WHERE status = 'sent' AND sent_at >= '" . date("Y-m-d 00:00:00") . "' GROUP BY h ORDER BY h")->fetchAll() as $r) $o[] = $r["h"] . "h:" . $r["n"]; echo "  LN1 Lineup sent per hour " . implode(" ", $o)."\n"; } catch (Throwable $e) { echo "  LN1 error " . $e->getMessage() . "\n"; }
          
          try { $ref = strtotime((string)$pdo->query("SELECT MAX(ts) FROM wa_messages")->fetchColumn()); $q = $pdo->prepare("SELECT m.ts, (SELECT MAX(i.ts) FROM wa_messages i WHERE i.phone = m.phone AND i.dir = 'in' AND i.ts <= m.ts) it FROM wa_messages m WHERE m.dir = 'out' AND m.who = 'bot' AND m.mtype = 'text' AND m.ts >= ? AND NOT EXISTS (SELECT 1 FROM wa_messages e WHERE e.phone = m.phone AND e.dir = 'sys' AND e.body LIKE '%followed up%' AND e.ts BETWEEN DATE_SUB(m.ts, INTERVAL 8 SECOND) AND DATE_ADD(m.ts, INTERVAL 8 SECOND)) LIMIT 2500"); $q->execute([date("Y-m-d H:i:s", $ref - 3600)]); $w = ["10" => [], "60" => []]; foreach ($q->fetchAll(PDO::FETCH_NUM) as $r) { $d = strtotime($r[0]) - strtotime((string)$r[1]); if (!$r[1] || $d < 0 || $d > 900) continue; $w[strtotime($r[0]) >= $ref - 600 ? "10" : "60"][] = $d; } $o = []; foreach ($w as $k => $a) { sort($a); $n = count($a); $o[] = ($k == "10" ? "last 10 min" : "10-60 min ago") . " n " . $n . " p50 " . ($n ? $a[intdiv($n, 2)] : "-") . "s p75 " . ($n ? $a[(int)($n * 0.75)] : "-") . "s p90 " . ($n ? $a[(int)($n * 0.9)] : "-") . "s >20s " . count(array_filter($a, fn($x) => $x > 20)) . " >60s " . count(array_filter($a, fn($x) => $x > 60)) . " >120s " . count(array_filter($a, fn($x) => $x > 120)); } $nw = $pdo->prepare("SELECT COUNT(*), COALESCE(MAX(TIMESTAMPDIFF(SECOND, last_in_at, ?)), 0) FROM wa_contacts WHERE status = 'open' AND optout = 0 AND (cx_id IS NULL OR cx_id = 0) AND last_in_at >= ? AND last_in_at <= ? AND (last_out_at IS NULL OR last_out_at < last_in_at) AND (assigned_emp IS NULL OR assigned_emp = 0)"); $nw->execute([date("Y-m-d H:i:s", $ref), date("Y-m-d H:i:s", $ref - 900), date("Y-m-d H:i:s", $ref - 20)]); $x = $nw->fetch(PDO::FETCH_NUM); echo "  BOT32 bot reply delay (follow-ups excluded) " . implode(" || ", $o) . " · waiting unassigned chats >20s: " . $x[0] . " (oldest " . $x[1] . "s)\n"; } catch (Throwable $e) { echo "  BOT32 error " . $e->getMessage() . "\n"; }
          try { $t0 = date("Y-m-d 00:00:00"); $ac = $pdo->query("SELECT status, COUNT(*), COALESCE(SUM(amount), 0), COALESCE(SUM(n), 0) FROM wag_addon WHERE at >= '" . $t0 . "' GROUP BY status")->fetchAll(PDO::FETCH_NUM); $m = $pdo->query("SELECT CONCAT(SUBSTRING_INDEX(v, '|', 1), IF(v LIKE 'skip|%', CONCAT(':', SUBSTRING_INDEX(v, '|', -1)), '')) st, COUNT(*) FROM wq_meta WHERE k LIKE 'addon:%' AND v NOT LIKE 'claim%' GROUP BY 1")->fetchAll(PDO::FETCH_KEY_PAIR); $pc = (int)$pdo->query("SELECT COUNT(DISTINCT phone) FROM wa_messages WHERE dir = 'in' AND ts >= '" . date("Y-m-d H:i:s", time() - 7200) . "' AND body REGEXP '(^|[^0-9])[0-9]{6}([^0-9]|$)'")->fetchColumn(); echo "  BOT31 addon today (status,n,Rs,bottles) " . json_encode($ac) . " · meta " . json_encode($m) . " · cart use today (emp: cart_open/sent) " . setting_get($pdo, "adc:" . date("md"), "{}") . " · pincode chats 2h " . $pc . " · tune " . setting_get($pdo, "wag_tune_log", "") . "\n"; } catch (Throwable $e) { echo "  BOT31 error " . $e->getMessage() . "\n"; }
          try { date_default_timezone_set("Asia/Kolkata"); $now = time(); $q = $pdo->prepare("SELECT COUNT(*) c, SUM(c.last_in_at <= ?) due FROM wa_contacts c JOIN (SELECT phone, MAX(ts) z FROM wa_messages WHERE dir = 'out' AND who = 'bot' AND ts >= ? GROUP BY phone) b ON b.phone = c.phone WHERE c.status = 'open' AND c.optout = 0 AND (c.cx_id IS NULL OR c.cx_id = 0) AND c.last_in_at >= ? AND c.last_out_at IS NOT NULL AND c.last_out_at > c.last_in_at AND c.last_out_at <= DATE_ADD(b.z, INTERVAL 5 SECOND)"); $q->execute([date("Y-m-d H:i:s", $now - 300), date("Y-m-d H:i:s", $now - 23 * 3600), date("Y-m-d H:i:s", $now - 22 * 3600 - 1800)]); $r = $q->fetch(PDO::FETCH_ASSOC); echo "  BOT23 follow-up candidates: " . $r["c"] . " · due: " . $r["due"] . " · settings: bfu_on=" . setting_get($pdo, "wag_bfu_on", "1") . " bfu_at_age=" . ($now - (int)setting_get($pdo, "wag_bfu_at", "0")) . "s bfu_n=" . setting_get($pdo, "wag_bfu_n", "0") . " fuw_age=" . ($now - (int)setting_get($pdo, "wag_fuw_at", "0")) . "s fuw_starts=" . setting_get($pdo, "wag_fuw_n", "0") . " dbg=" . setting_get($pdo, "wag_bfu_dbg", "-") . "\n"; } catch (Throwable $e) { echo "  BOT23 error " . $e->getMessage() . "\n"; }
          try { $r8 = $pdo->query("SELECT COUNT(*) n, SUM(body REGEXP '(^|[^0-9])10 ?ml|solid|shower|roll-?on|\\bwax\\b|candle') bad FROM wa_messages WHERE dir = 'out' AND who = 'bot' AND ts >= '" . date("Y-m-d H:i:s", time() - 1200) . "'")->fetch(PDO::FETCH_ASSOC); echo "  BOT8 bot messages in the last 20 min: " . $r8["n"] . " · mentioning solid / shower gel / 10 ml / roll-on / wax / candle (must be ~0): " . $r8["bad"] . "\n"; $h8 = $pdo->query("SELECT COUNT(*) FROM wq_meta WHERE k LIKE 'bothand:%' AND v >= '" . date("Y-m-d H:i:s", time() - 1200) . "'")->fetchColumn(); echo "  BOT8 bot hand-overs in the last 20 min: " . $h8 . "\n"; } catch (Throwable $e) { echo "  BOT8 error\n"; }
          try {  echo "  BOT10 settings: waa_off=" . setting_get($pdo, "waa_off", "?") . " wag_open_market=" . setting_get($pdo, "wag_open_market", "?") . " wq_auto_on=" . setting_get($pdo, "wq_auto_on", "?") . " manual=" . setting_get($pdo, "wa_manual_assign", "?") . " cutover=[" . setting_get($pdo, "wq_cutover", "") . "] bot_heartbeat_age_s=" . (time() - (int)setting_get($pdo, "wag_tick_at", "0")) . "\n"; } catch (Throwable $e) { echo "  BOT10 error " . $e->getMessage() . "\n"; }
          try { $t12 = date("Y-m-d 00:00:00"); foreach ($pdo->query("SELECT kind, COUNT(*) n FROM wa_mkt WHERE at >= '" . $t12 . "' GROUP BY kind")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "  BOT12 open market today " . $r["kind"] . ": " . $r["n"] . "\n"; $o12 = $pdo->query("SELECT COUNT(*) n, COALESCE(SUM(amount), 0) a FROM wa_outcomes WHERE code = 'order' AND at >= '" . $t12 . "'")->fetch(PDO::FETCH_ASSOC); $a12 = $pdo->query("SELECT COUNT(*) FROM wa_messages WHERE dir = 'sys' AND mtype = 'event' AND ts >= '" . $t12 . "' AND body LIKE '%collected the order details%'")->fetchColumn(); echo "  BOT12 today: addresses collected by the bot " . $a12 . " · orders recorded by salespeople " . $o12["n"] . " (Rs " . round($o12["a"]) . ")\n"; } catch (Throwable $e) { echo "  BOT12 error " . $e->getMessage() . "\n"; }
          try { $t = date("Y-m-d H:i:s", time() - 21600); $c = function ($re) use ($pdo, $t) { $q = $pdo->prepare("SELECT COUNT(*) FROM wa_messages WHERE dir = 'out' AND who = 'bot' AND ts >= ? AND body REGEXP ?"); $q->execute([$t, $re]); return (int)$q->fetchColumn(); }; $g = $pdo->query("SELECT SUM(body LIKE '%MAXIMUM ORDERS%'), SUM(body LIKE '%ONLY OUR CATALOGUE%') FROM lib_guide WHERE status = 'live'")->fetch(PDO::FETCH_NUM); $sm = $pdo->prepare("SELECT body FROM wa_messages WHERE dir = 'out' AND who = 'bot' AND ts >= ? AND body REGEXP 'ml (extra|aur)|aur dene par|more for' ORDER BY id DESC LIMIT 2"); $sm->execute([$t]); echo "  BT1 bot texts last 6 h: bigger-size upsell " . $c("ml (extra|aur)|aur dene par|more for") . " · sell-more combos " . $c("3 x [0-9]+ ml.*4 x") . " · add-on offers " . $c("add (kar|karun)|extra [0-9]+ ml") . " · guidebook live (goal rule, catalogue rule) " . json_encode($g) . " · samples: " . implode(" || ", array_map(function ($b) { return substr(preg_replace("/\\s+/", " ", $b), 0, 170); }, $sm->fetchAll(PDO::FETCH_COLUMN))) . "\n"; } catch (Throwable $e) { echo "  BT1 error " . $e->getMessage() . "\n"; }

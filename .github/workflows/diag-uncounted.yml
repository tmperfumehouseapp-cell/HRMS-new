# READ-ONLY: what the must-send check sees for ONE order (times and which rule matched, no message text). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          $t0 = date("Y-m-d", time() - 36000) . " 10:00:00"; $me = (int)$d->query("SELECT employee_id FROM employees WHERE full_name LIKE 'Irfan Ansari%' AND status != 'ex' LIMIT 1")->fetchColumn(); echo "U Irfan id " . $me . "\n";
          foreach ($d->query("SELECT setting_key, LEFT(setting_value, 200) v FROM hrms_settings WHERE setting_key IN ('wq_mode','waa_off','waa_gap','waa_cyc','waa_run_at','waa_dbg')")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U set " . $r["setting_key"] . " = " . (preg_match("/^\d{10}$/", $r["v"]) ? date("H:i:s", (int)$r["v"]) : $r["v"]) . "\n";
          $st = json_decode((string)$d->query("SELECT setting_value FROM hrms_settings WHERE setting_key = 'waa_st'")->fetchColumn(), true); echo "U Irfan switch state: " . json_encode($st["e"][$me] ?? $st["e"][(string)$me] ?? null) . "\n";
          $q = $d->prepare("SELECT l.emp_id, e.full_name, SUM(l.kind = 'fresh') f, SUM(l.kind = 'camp') c, MAX(CASE WHEN l.kind = 'fresh' THEN l.at END) lf, SUM(l.kind = 'fresh' AND l.at >= NOW() - INTERVAL 60 MINUTE) f60 FROM waa_log l LEFT JOIN employees e ON e.employee_id = l.emp_id WHERE l.at >= ? GROUP BY l.emp_id ORDER BY f DESC LIMIT 60"); $q->execute([$t0]); $rows = $q->fetchAll(PDO::FETCH_ASSOC);
          $tf = 0; $t60 = 0; foreach ($rows as $r) { $tf += (int)$r["f"]; $t60 += (int)$r["f60"]; } echo "U auto assign today: " . count($rows) . " people · fresh given " . $tf . " · fresh in the last 60 min " . $t60 . "\n";
          foreach ($rows as $k => $r) if ($k < 10 || (int)$r["emp_id"] === $me) echo "U " . ((int)$r["emp_id"] === $me ? ">> " : "   ") . str_pad(mb_substr((string)$r["full_name"], 0, 18), 18) . " · fresh " . $r["f"] . " · last fresh " . substr((string)$r["lf"], 11, 5) . " · last 60 min " . $r["f60"] . " · campaign " . $r["c"] . "\n";
          $w = $d->prepare("SELECT COUNT(*) FROM wa_contacts c WHERE c.assigned_emp = ? AND c.status = 'open' AND c.last_in_at >= NOW() - INTERVAL 24 HOUR AND (c.last_out_at IS NULL OR c.last_out_at < c.last_in_at)"); $w->execute([$me]); echo "U Irfan: customers waiting for his answer " . $w->fetchColumn() . "\n";
          $lg = $d->prepare("SELECT at, kind, LEFT(why, 90) w FROM waa_log WHERE emp_id = ? AND at >= ? ORDER BY id DESC LIMIT 5"); $lg->execute([$me, $t0]); foreach ($lg->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U Irfan last given " . substr($r["at"], 11, 8) . " · " . $r["kind"] . " · " . $r["w"] . "\n";
          echo "U unassigned open requests waiting now: " . $d->query("SELECT COUNT(*) FROM wa_contacts WHERE assigned_emp = 0 AND status = 'open' AND optout = 0 AND last_in_at >= NOW() - INTERVAL 24 HOUR AND (last_out_at IS NULL OR last_out_at < last_in_at)")->fetchColumn() . "\n";
          foreach ($d->query("SELECT at, LEFT(info, 230) i FROM wa_log WHERE at >= NOW() - INTERVAL 20 MINUTE AND info LIKE 'auto assign%' ORDER BY id DESC LIMIT 4")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U log " . substr($r["at"], 11, 8) . " " . $r["i"] . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

# READ-ONLY: sales people without an order tag. Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          echo "U now " . date("Y-m-d H:i:s") . "\n"; echo "U deployed code still stops without an order tag: " . (strpos((string)file_get_contents($argv[1] . "empmanagment/api.php"), "No order tag set on your profile yet") !== false ? "YES (old code)" : "no (fixed)") . "\n";
          $me = (int)$d->query("SELECT employee_id FROM employees WHERE full_name LIKE 'Bushra Diwan%' AND status != 'ex' LIMIT 1")->fetchColumn(); $m0 = date("Y-m-01") . " 10:00:00";
          $a = $d->query("SELECT COUNT(*) n, COALESCE(SUM(o.total), 0) s FROM shop_orders o JOIN order_allocations a ON a.source COLLATE utf8mb4_unicode_ci = o.store_key COLLATE utf8mb4_unicode_ci AND a.order_id COLLATE utf8mb4_unicode_ci = CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci WHERE o.created_at >= '$m0' AND a.employee_id = $me AND o.total > 0 AND (o.tags IS NULL OR o.tags NOT LIKE '%cancel%')")->fetch(PDO::FETCH_ASSOC); $b = $d->query("SELECT COUNT(*) n, COALESCE(SUM(total), 0) s FROM manual_orders WHERE order_date >= '$m0' AND employee_id = $me")->fetch(PDO::FETCH_ASSOC);
          echo "U Bushra this month: Shopify orders given to her " . $a["n"] . " (Rs " . round($a["s"]) . ") · HRMS / website orders " . $b["n"] . " (Rs " . round($b["s"]) . ") · together " . ($a["n"] + $b["n"]) . " orders, Rs " . round($a["s"] + $b["s"]) . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

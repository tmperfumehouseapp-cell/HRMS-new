# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          $t0 = strtotime(date("Y-m-d", time() - 10 * 3600) . " 10:00:00"); $arg = [date("Y-m-d H:i:s", $t0), date("Y-m-d H:i:s", $t0 + 86400)];
          echo "U marker wrote_first_fix = " . (string)$d->query("SELECT v FROM wq_meta WHERE k = 'wrote_first_fix'")->fetchColumn() . " · deployed rule in wq.php: " . (strpos((string)@file_get_contents($argv[1] . "empmanagment/wq.php"), "function wq_we_wrote_first") !== false ? "yes" : "NO") . "\n";
          $q = $d->prepare("SELECT COALESCE(t.type, 'unclear') type, COUNT(*) n, SUM(COALESCE(s.orders, 0) > 0) o FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id LEFT JOIN wq_qstat s ON s.query_id = q.id WHERE q.opened_at >= ? AND q.opened_at < ? GROUP BY 1 ORDER BY n DESC"); $q->execute($arg);
          foreach ($q->fetchAll(PDO::FETCH_NUM) as $r) echo "U today type " . $r[0] . " · " . $r[1] . " queries · " . (int)$r[2] . " with an order\n";
          $q = $d->prepare("SELECT (t.reason LIKE '%was New, corrected%') fixed, MIN(q.opened_at) a, MAX(q.opened_at) b, COUNT(*) n FROM wa_queries q JOIN wq_qtype t ON t.query_id = q.id WHERE q.opened_at >= ? AND t.reason LIKE 'campaign customer: we wrote first%' GROUP BY 1"); $q->execute([$arg[0]]);
          foreach ($q->fetchAll(PDO::FETCH_NUM) as $r) echo "U 'we wrote first' " . ((int)$r[0] ? "corrected from New" : "typed at arrival by the new rule") . " · " . $r[3] . " · opened " . substr($r[1], 11, 5) . " to " . substr($r[2], 11, 5) . "\n";
          $pi = $d->prepare("SELECT MAX(ts) FROM wa_messages WHERE phone = ? AND dir = 'in' AND ts < ?"); $ww = $d->prepare("SELECT who FROM wa_messages WHERE phone = ? AND dir = 'out' AND emp_id = 0 AND who IN ('campaign', 'followup', 'recover') AND mtype = 'template' AND status <> 'failed' AND ts <= ? ORDER BY id DESC LIMIT 1");
          $q = $d->prepare("SELECT q.id, q.phone, q.opened_at, q.src, t.auto FROM wa_queries q JOIN wq_qtype t ON t.query_id = q.id WHERE q.opened_at >= ? AND q.opened_at < ? AND t.type = 'new'"); $q->execute($arg); $left = 0; $n = 0; $leftAfter = 0; $hand = 0;
          foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) { $n++; $pi->execute([$r["phone"], date("Y-m-d H:i:s", strtotime($r["opened_at"]) - 120)]); if ((string)$pi->fetchColumn() !== "") continue; $ww->execute([$r["phone"], $r["opened_at"]]); if ($ww->fetchColumn() === false) continue; $left++; if (!(int)$r["auto"]) $hand++; }
          echo "U still typed New today " . $n . " · of them we wrote first (includes ad / link arrivals that rightly stay fresh; 7 at the last check) " . $left . " · hand-set " . $hand . "\n";
          $q = $d->prepare("SELECT q.src, COALESCE(t.type, 'unclear') type, COUNT(*) n FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id WHERE q.opened_at >= ? GROUP BY 1, 2 ORDER BY n DESC LIMIT 12"); $q->execute([date("Y-m-d H:i:s", time() - 1800)]);
          foreach ($q->fetchAll(PDO::FETCH_NUM) as $r) echo "U last 30 min: given as '" . ($r[0] === "" ? "(none)" : $r[0]) . "' · typed " . $r[1] . " · " . $r[2] . "\n";
          $lt = json_decode((string)$d->query("SELECT v FROM wq_meta WHERE k = 'last_tick'")->fetchColumn(), true); echo "U last tick " . ($lt["at"] ?? "?") . " · " . ($lt["ms"] ?? "?") . " ms · wrote_first_fix " . json_encode($lt["result"]["wrote_first_fix"] ?? null) . " · error " . json_encode($lt["result"]["error"] ?? null) . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

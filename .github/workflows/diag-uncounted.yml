# READ-ONLY: business day 2026-11-19 — all orders vs the orders that have an allocation row (what the Leaders collection counts), the orders WITHOUT one, and the HRMS-typed manual orders. No customer names or phone numbers. Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Uncounted orders
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          cat > /tmp/un_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata");
          $day = "2026-11-19"; $from = $day . " 10:00:00"; $to = date("Y-m-d 10:00:00", strtotime($day . " +1 day"));
          echo "business day $day ($from -> $to)\n";
          $sql = "SELECT o.store_key sk, o.order_name nm, o.created_at ca, ROUND(o.total) total, o.financial_status fs, o.tags tg, a.alloc_id aid, a.order_type ot, a.employee_id emp, a.house hs
                  FROM shop_orders o LEFT JOIN order_allocations a ON a.source = o.store_key AND a.order_id COLLATE utf8mb4_unicode_ci = CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci
                  WHERE o.created_at >= ? AND o.created_at < ? AND o.total > 0 ORDER BY o.created_at";
          try { $q = $d->prepare($sql); $q->execute([$from, $to]); $rows = $q->fetchAll(PDO::FETCH_ASSOC); } catch (Throwable $e) { echo "n/a: " . substr($e->getMessage(), 0, 200) . "\n"; exit; }
          $all = [0, 0.0]; $given = [0, 0.0]; $noRow = [];
          foreach ($rows as $r) {
            $canc = stripos((string)$r["tg"], "cancel") !== false; if ($canc) continue;
            $all[0]++; $all[1] += (float)$r["total"];
            if ($r["aid"] !== null) { $given[0]++; $given[1] += (float)$r["total"]; } else $noRow[] = $r;
          }
          echo "ALL non-cancelled orders: " . $all[0] . " · Rs " . round($all[1]) . "\n";
          echo "with an allocation row (counted by the Leaders collection): " . $given[0] . " · Rs " . round($given[1]) . "\n";
          echo "WITHOUT an allocation row: " . count($noRow) . " · Rs " . round($all[1] - $given[1]) . "\n";
          foreach ($noRow as $r) echo "  NO ROW " . $r["nm"] . " · " . $r["sk"] . " · " . $r["ca"] . " · Rs " . $r["total"] . " · " . $r["fs"] . " · tags=[" . $r["tg"] . "]\n";
          try { $m = $d->prepare("SELECT COUNT(*) n, ROUND(COALESCE(SUM(total),0)) s FROM manual_orders WHERE order_date >= ? AND order_date < ?"); $m->execute([$from, $to]); $x = $m->fetch(PDO::FETCH_ASSOC); echo "manual orders (HRMS typed) in the window: " . $x["n"] . " · Rs " . $x["s"] . "\n"; } catch (Throwable $e) { echo "manual orders: n/a\n"; }
          PHP
          php /tmp/un_check.php "$P"; rm -f /tmp/un_check.php
          REMOTE

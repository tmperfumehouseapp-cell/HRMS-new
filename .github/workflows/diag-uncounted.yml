# READ-ONLY: which orders of the current (and the previous) business day are NOT counted as Query or Campaign on the Orders page, and why (tags, allocation row, who it was given to, status). No customer names or phone numbers. Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Uncounted orders
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          cat > /tmp/un_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata");
          $now = time(); $bdNow = date("G") >= 10 ? date("Y-m-d") : date("Y-m-d", $now - 86400);
          echo "now (IST) " . date("Y-m-d H:i") . " · business day " . $bdNow . " (and the one before it)\n";
          $from = date("Y-m-d 10:00:00", strtotime($bdNow . " -1 day"));
          $sql = "SELECT o.store_key, o.order_name, o.created_at, ROUND(o.total) total, o.financial_status fs, o.tags, a.order_type ot, a.employee_id emp, a.allocated_by ab, a.allocated_at aa
                  FROM shop_orders o LEFT JOIN order_allocations a ON a.source = o.store_key AND a.order_id COLLATE utf8mb4_unicode_ci = CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci
                  WHERE o.created_at >= ? AND o.total > 0 ORDER BY o.created_at";
          try { $q = $d->prepare($sql); $q->execute([$from]); $rows = $q->fetchAll(PDO::FETCH_ASSOC); } catch (Throwable $e) { echo "n/a: " . substr($e->getMessage(), 0, 200) . "\n"; exit; }
          $QT = ["query", "s"]; $CT = ["campaign", "c"]; $n = 0; $unc = 0;
          foreach ($rows as $r) {
            $n++; $tg = array_map(function ($x) { return strtolower(trim($x)); }, explode(",", (string)$r["tags"]));
            $isTag = count(array_intersect($tg, array_merge($QT, $CT))) > 0; $isCancel = stripos((string)$r["tags"], "cancel") !== false;
            if ($isTag) continue; $unc++;
            echo "UNCOUNTED " . $r["order_name"] . " · " . $r["store_key"] . " · " . $r["created_at"] . " · Rs " . $r["total"] . " · " . $r["fs"] . ($isCancel ? " · CANCELLED" : "") . " · tags=[" . $r["tags"] . "] · allocation: type=" . ($r["ot"] === null ? "NO ROW" : ($r["ot"] === "" ? "(empty)" : $r["ot"])) . " emp=" . ($r["emp"] === null ? "-" : $r["emp"]) . " by=" . ($r["ab"] === null ? "-" : $r["ab"]) . " at=" . ($r["aa"] === null ? "-" : $r["aa"]) . "\n";
          }
          echo "\norders checked: $n · not counted as Query/Campaign by tags: $unc\n";
          PHP
          php /tmp/un_check.php "$P"; rm -f /tmp/un_check.php
          REMOTE

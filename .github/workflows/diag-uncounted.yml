# READ-ONLY: how much of a day's collection and orders is done by 9 PM on recent days (totals only). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          echo "U now " . date("Y-m-d H:i:s") . "\n"; $nowH = (time() - strtotime(date("Y-m-d", time() - 36000) . " 10:00:00")) / 3600;
          $rd = function ($from, $to) use ($d) { $q = $d->prepare("SELECT COUNT(*) n, COALESCE(SUM(total), 0) s FROM shop_orders WHERE created_at >= ? AND created_at < ? AND total > 0 AND (tags IS NULL OR tags NOT LIKE '%cancel%')"); $q->execute([$from, $to]); $a = $q->fetch(PDO::FETCH_ASSOC); $q = $d->prepare("SELECT COUNT(*) n, COALESCE(SUM(total), 0) s FROM manual_orders WHERE order_date >= ? AND order_date < ? AND total > 0"); $q->execute([$from, $to]); $b = $q->fetch(PDO::FETCH_ASSOC); return [(int)$a["n"] + (int)$b["n"], (float)$a["s"] + (float)$b["s"]]; };
          $marks = [11 => "9 PM", 12 => "10 PM", 14 => "12 AM", 16 => "2 AM", 20 => "6 AM", 24 => "10 AM"];
          foreach (["2026-11-17", "2026-11-18", "2026-11-19", "2026-11-23", "2026-11-24", "2026-11-25"] as $day) { $t0 = strtotime($day . " 10:00:00"); $line = "U " . $day . " (" . date("D", $t0) . ")"; $full = $rd(date("Y-m-d H:i:s", $t0), date("Y-m-d H:i:s", $t0 + 86400)); foreach ($marks as $h => $lab) { if ($t0 + $h * 3600 > time() + 60) { $line .= " · " . $lab . " -"; continue; } $x = $rd(date("Y-m-d H:i:s", $t0), date("Y-m-d H:i:s", $t0 + $h * 3600)); $line .= " · " . $lab . " Rs " . round($x[1]) . " / " . $x[0] . ($full[1] > 0 && $day !== "2026-11-25" ? " (" . round(100 * $x[1] / $full[1]) . "% · " . round(100 * $x[0] / max(1, $full[0])) . "%)" : ""); } echo $line . "\n"; }
          $t0 = strtotime(date("Y-m-d", time() - 36000) . " 10:00:00"); $x = $rd(date("Y-m-d H:i:s", $t0), date("Y-m-d H:i:s")); echo "U today so far (" . date("H:i") . "): Rs " . round($x[1]) . " / " . $x[0] . " orders\n";
          foreach ([1, 2] as $back) { $y0 = $t0 - $back * 86400; $line = "U hourly " . date("d M", $y0) . ":"; $prev = [0, 0.0]; for ($h = 1; $h <= 24; $h++) { $c = $rd(date("Y-m-d H:i:s", $y0), date("Y-m-d H:i:s", $y0 + $h * 3600)); $line .= " " . ($c[0] - $prev[0]); $prev = $c; } echo $line . "  (orders per hour from 10 AM)\n"; }
          $line = "U hourly today:"; $prev = [0, 0.0]; for ($h = 1; $h <= 24 && $t0 + ($h - 1) * 3600 < time(); $h++) { $c = $rd(date("Y-m-d H:i:s", $t0), date("Y-m-d H:i:s", min(time(), $t0 + $h * 3600))); $line .= " " . ($c[0] - $prev[0]); $prev = $c; } echo $line . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

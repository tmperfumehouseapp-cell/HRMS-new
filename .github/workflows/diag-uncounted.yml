# READ-ONLY: counts of the tickets the bot raised today against the new strict rule (no customer text is printed). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          function cx_text_problem($t, $strict = false) {
              $soft = $strict ? '' : '|\bexchange\b|\breplace(ment)?\b|\bbadalna\b|\bbadalni\b|\bbadalne\b';
              $map = ['leak' => '/(\bleak|\btoota\b|\btut gay|\bbroken\b|\bdamaged?\b|\bspill|dabba khula|bottle.{0,12}(crack|toot))/u',
                      'wrong' => '/(\bwrong (item|product|perfume)|\bgalat\b|(mila|aaya|aayi|received|got|came|diya|bheja|delivered|arrived).{0,30}(different|alag) (perfume|product)|(different|alag) (perfume|product).{0,30}(mila|aaya|aayi|received|came|delivered|diya|bheja|arrived)' . $soft . ')/u',
                      'notdelivered' => '/(\bnot (delivered|received)|\bnahi (mila|aaya|pahucha)|\babhi tak nahi|\bkab aayega|\bstill (not|waiting)|marked delivered)/u',
                      'quality' => '/(\bfake\b|\bsmell.{0,14}(different|bad|weak|not same)|\bkhushbu.{0,14}(alag|nahi|kam)|\bquality (is )?(bad|poor)|\bduplicate\b)/u', 'refund' => '/(\brefund|\bpaisa wapas|\bmoney back|\breturn kar)/u', 'missing' => '/(\bmissing\b|\bincomplete\b|\bkam aaya|(nhi|nahi) (ayi|aayi|aya|aaya) (h|hai)\b)/u'];
              foreach ($map as $k => $re) if (preg_match($re, (string)$t)) return $k;
              return '';
          }
          echo "U now " . date("Y-m-d H:i:s") . "\n"; $day = date("Y-m-d", time() - 36000); $t0 = $day . " 10:00:00";
          $rows = $d->query("SELECT id, problem, status, summary FROM cx_cases WHERE raised_at >= '$t0' AND summary LIKE 'WhatsApp (raised by the bot)%' ORDER BY id")->fetchAll(PDO::FETCH_ASSOC); $by = []; $nb = []; $none = 0; $fp = 0; $open = 0;
          foreach ($rows as $r) { $by[$r["problem"]] = ($by[$r["problem"]] ?? 0) + 1; $t = " " . mb_strtolower(preg_replace("/^WhatsApp \(raised by the bot\): /u", "", (string)$r["summary"])) . " "; if (cx_text_problem($t, true) === "") { $none++; $nb[$r["problem"]] = ($nb[$r["problem"]] ?? 0) + 1; if (preg_match("/exchange|replace|badaln/u", $t)) $fp++; if (in_array($r["status"], ["open", "reopened"], true)) $open++; } }
          echo "U tickets the bot raised today: " . count($rows) . " · by problem " . json_encode($by) . "\n"; echo "U of them, the last customer message names NO real problem under the new rule: " . $none . " · by problem " . json_encode($nb) . " · with an exchange / replace word: " . $fp . " · still open: " . $open . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

# READ-ONLY: why one order was typed Query (contact source, earlier orders, campaign messages, query rows — fields only). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f; $ch = substr(preg_replace("/\D/", "", (string)($argv[2] ?? "")), -10);
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); if (strlen($ch) !== 10) { echo "no number\n"; exit; }
          echo "=== why is this order typed Query? (fields only) ===\n";
          $c = $d->query("SELECT phone, source, status, first_seen, last_in_at, assigned_emp, cx_id, tag FROM wa_contacts WHERE phone LIKE '%$ch'")->fetch(PDO::FETCH_ASSOC); echo "contact: " . json_encode($c) . "\n";
          $o = $d->query("SELECT shopify_id, store_key, order_name, created_at, total FROM shop_orders WHERE phone LIKE '%$ch' ORDER BY created_at")->fetchAll(PDO::FETCH_ASSOC); echo "orders of this number: " . count($o) . "\n"; foreach ($o as $x) echo "  " . $x["created_at"] . " " . $x["store_key"] . " " . $x["order_name"] . " Rs " . $x["total"] . "\n";
          $last = end($o); if ($last) { $a = $d->prepare("SELECT order_type, employee_id, allocated_by, allocated_at, is_direct FROM order_allocations WHERE source = ? AND order_id = ?"); $a->execute([$last["store_key"], (string)$last["shopify_id"]]); echo "allocation of the newest order: " . json_encode($a->fetch(PDO::FETCH_ASSOC)) . "\n"; }
          echo "outgoing messages by sender type (all time): "; foreach ($d->query("SELECT who, COUNT(*) n, MIN(ts) a, MAX(ts) b FROM wa_messages WHERE phone LIKE '%$ch' AND dir = 'out' GROUP BY who") as $r) echo $r["who"] . "=" . $r["n"] . " (" . substr($r["a"], 0, 16) . " .. " . substr($r["b"], 0, 16) . ") "; echo "\n";
          echo "campaign-sent rows (wa_camp_items sent): "; try { echo $d->query("SELECT COUNT(*) FROM wa_camp_items WHERE phone LIKE '%$ch' AND status = 'sent'")->fetchColumn(); } catch (Throwable $e) { echo "n/a"; } echo "\n";
          echo "query rows of this number (opened_at, src, again, type): "; foreach ($d->query("SELECT q.opened_at, q.src, q.again, COALESCE(t.type,'unclear') ty FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id WHERE q.phone LIKE '%$ch' ORDER BY q.opened_at") as $r) echo "[" . substr($r["opened_at"], 0, 16) . " " . $r["src"] . " again=" . $r["again"] . " " . $r["ty"] . "] "; echo "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

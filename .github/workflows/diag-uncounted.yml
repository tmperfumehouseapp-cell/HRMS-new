# READ-ONLY: what the must-send check sees for ONE order (times and which rule matched, no message text). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          echo "U now " . date("Y-m-d H:i:s") . "\n"; require $argv[1] . "empmanagment/wq_auto_rules.php";
          $g = function ($k) use ($d) { $q = $d->prepare("SELECT setting_value FROM hrms_settings WHERE setting_key = ?"); $q->execute([$k]); return (string)$q->fetchColumn(); };
          $me = (int)$d->query("SELECT employee_id FROM employees WHERE full_name LIKE 'Irfan Ansari%' AND status != 'ex' LIMIT 1")->fetchColumn(); $cpj = json_decode($g("waa_cp"), true); $cp = (array)($cpj["rows"] ?? []); $st = json_decode($g("waa_st"), true); echo "U Irfan id " . $me . " · waa_cp day " . ($cpj["day"] ?? "?") . " age " . (time() - (int)($cpj["at"] ?? 0)) . " s · rows " . count($cp) . " · state day " . ($st["day"] ?? "?") . "\n";
          $x = $cp[$me] ?? $cp[(string)$me] ?? null; echo "U Irfan day row: " . json_encode($x) . "\n";
          $tq = 0; $tqo = 0; foreach ($cp as $e => $r) if (empty($r["off"])) { $tq += (int)($r["q"] ?? 0); $tqo += (int)($r["qo"] ?? 0); } $team = $tq > 0 ? $tqo / $tq : 0; echo "U team ratio " . round(100 * $team, 1) . "% (" . $tqo . " / " . $tq . ") · floor " . round(100 * waa_floor($team), 1) . "%\n";
          $T = []; foreach ($d->query("SELECT emp_id, kind, COUNT(*) c, MAX(at) m FROM waa_log WHERE at >= '" . date("Y-m-d", time() - 36000) . " 10:00:00' GROUP BY emp_id, kind")->fetchAll(PDO::FETCH_ASSOC) as $r) { $T[(int)$r["emp_id"]][$r["kind"]] = (int)$r["c"]; $T[(int)$r["emp_id"]]["last_" . $r["kind"]] = strtotime($r["m"]); }
          $pres = []; foreach ($d->query("SELECT DISTINCT employee_id FROM attendance WHERE punch_in IS NOT NULL AND punch_out IS NULL AND punch_in >= NOW() - INTERVAL 20 HOUR")->fetchAll(PDO::FETCH_COLUMN) as $e) $pres[(int)$e] = 1; echo "U Irfan punched in now: " . (isset($pres[$me]) ? "yes" : "no") . "\n";
          $nm = []; foreach ($d->query("SELECT employee_id, full_name FROM employees")->fetchAll(PDO::FETCH_ASSOC) as $r) $nm[(int)$r["employee_id"]] = $r["full_name"];
          $cand = []; $tiers = [0, 0, 0, 0]; foreach ($cp as $e => $r) { $e = (int)$e; $s = $st["e"][$e] ?? $st["e"][(string)$e] ?? []; $m = (string)($s["m"] ?? ""); $force = $m === "on" && !empty($s["f"]); if ($m === "on" && !$force) $m = ""; $present = isset($pres[$e]) || (($s["m"] ?? "") === "on"); if (!$present || $m === "off") continue; $q = (int)($r["q"] ?? 0); $qo = (int)($r["qo"] ?? 0); if ($m !== "on" && (!empty($s["ao"]) || waa_below($q, $qo, $team))) continue;
            $t = waa_tier($q, $qo, $team); if ($m === "on" && $t > 2) $t = 2; $tiers[$t]++; $cand[$e] = ["w" => 1, "cnt" => max($q, (int)($T[$e]["fresh"] ?? 0)), "tier" => $t, "full" => false, "rest" => false, "last" => (int)($T[$e]["last_fresh"] ?? 0)]; }
          echo "U candidates for a fresh query now (my copy of the rules): " . count($cand) . " · grey " . $tiers[0] . " · green " . $tiers[1] . " · yellow " . $tiers[2] . " · Irfan is a candidate: " . (isset($cand[$me]) ? "yes " . json_encode($cand[$me]) : "NO") . "\n";
          foreach ($cand as $e => $c) if ($c["tier"] === 0) echo "U grey: " . mb_substr((string)($nm[$e] ?? $e), 0, 18) . " · q " . $c["cnt"] . " · engine gave " . (int)($T[$e]["fresh"] ?? 0) . " · last " . ($c["last"] ? date("H:i", $c["last"]) : "-") . "\n";
          $pos = (int)$g("waa_cyc"); for ($k = 0; $k < 3; $k++) { $to = waa_pick_tiers($cand, WAA_MIN_Q, $pos + $k); echo "U next pick (pos " . ($pos + $k) . "): " . ($nm[$to] ?? $to) . " " . json_encode($cand[$to] ?? null) . "\n"; }
          $same = array_filter($cand, function ($c) use ($cand, $me) { return isset($cand[$me]) && $c["tier"] === $cand[$me]["tier"]; }); uasort($same, function ($a, $b) { return [$a["last"], $a["cnt"]] <=> [$b["last"], $b["cnt"]]; }); $k = 0; foreach ($same as $e => $c) { if ($k++ >= 6) break; echo "U line in his group: " . mb_substr((string)($nm[$e] ?? $e), 0, 18) . " · last " . ($c["last"] ? date("H:i:s", $c["last"]) : "never") . " · count " . $c["cnt"] . "\n"; }
          foreach ($d->query("SELECT q.src, COALESCE(t.type, '-') ty, COUNT(*) n, MIN(q.opened_at) a, MAX(q.opened_at) b FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id WHERE q.emp_id = $me AND q.opened_at >= '" . date("Y-m-d", time() - 36000) . " 10:00:00' GROUP BY q.src, ty")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U Irfan queries today: src " . $r["src"] . " · type " . $r["ty"] . " · " . $r["n"] . " · " . substr($r["a"], 11, 5) . "-" . substr($r["b"], 11, 5) . "\n";
          foreach ($d->query("SELECT how, COUNT(*) n, MAX(at) m FROM wa_assign_log WHERE to_emp = $me AND at >= '" . date("Y-m-d", time() - 36000) . " 10:00:00' GROUP BY how")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U Irfan chats came to him today by: " . $r["how"] . " · " . $r["n"] . " · last " . substr($r["m"], 11, 5) . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

# READ-ONLY: why one order was typed Query (contact source, earlier orders, campaign messages, query rows — fields only). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f; $ch = substr(preg_replace("/\D/", "", (string)($argv[2] ?? "")), -10);
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); if (strlen($ch) !== 10) { echo "no number\n"; exit; }
          echo "=== types and tags of this customer (fields only) ===\n";
          foreach ($d->query("SELECT q.id, q.opened_at, q.again, t.type, t.reason, t.rule_id FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id WHERE q.phone LIKE '%$ch' ORDER BY q.opened_at") as $r) echo "query " . $r["id"] . " opened " . $r["opened_at"] . " again=" . $r["again"] . " type=" . $r["type"] . " rule=" . $r["rule_id"] . " reason: " . $r["reason"] . "\n";
          echo "ctags: "; foreach ($d->query("SELECT tag, src, at FROM wa_ctags WHERE phone LIKE '%$ch' ORDER BY at") as $r) echo "[" . $r["tag"] . "/" . $r["src"] . " " . $r["at"] . "] "; echo "\n";
          echo "customer messages (times only), last 8: "; foreach ($d->query("SELECT ts FROM wa_messages WHERE phone LIKE '%$ch' AND dir = 'in' ORDER BY id DESC LIMIT 8") as $r) echo substr($r["ts"], 5, 11) . " | "; echo "\n";
          echo "ad fields on the contact: "; $c = $d->query("SELECT ad_id <> '' a, ad_head <> '' b, ref_text <> '' r, last_number_id n FROM wa_contacts WHERE phone LIKE '%$ch'")->fetch(PDO::FETCH_ASSOC); echo json_encode($c) . "\n";
          echo "newest order created_at: "; echo $d->query("SELECT MAX(created_at) FROM shop_orders WHERE phone LIKE '%$ch'")->fetchColumn() . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

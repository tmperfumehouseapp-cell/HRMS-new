# READ-ONLY: what the must-send check sees for ONE order (times and which rule matched, no message text). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'");
          echo "U now " . date("Y-m-d H:i:s") . " · model in config: " . (defined("TMPH_MODEL") ? TMPH_MODEL : "(default)") . " · fallbacks: " . (defined("TMPH_FALLBACK_MODELS") ? json_encode(TMPH_FALLBACK_MODELS) : "(default)") . "\n";
          $bk = trim((string)$d->query("SELECT setting_value FROM hrms_settings WHERE setting_key = 'ai_fb_key'")->fetchColumn());
          $models = array_values(array_unique(array_filter(array_merge([defined("TMPH_MODEL") ? TMPH_MODEL : "claude-sonnet-5-5"], defined("TMPH_FALLBACK_MODELS") ? (array)TMPH_FALLBACK_MODELS : ["claude-haiku-5-5"]))));
          foreach ($models as $m) { if (strpos((string)$m, "claude") !== 0) continue; $hd = []; $t0 = microtime(true);
            $ch = curl_init("https://api.anthropic.com/v1/messages"); curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER => true, CURLOPT_TIMEOUT => 40, CURLOPT_POST => true, CURLOPT_HTTPHEADER => ["x-api-key: " . $bk, "anthropic-version: 2023-06-01", "content-type: application/json"],
              CURLOPT_POSTFIELDS => json_encode(["model" => $m, "max_tokens" => 64, "messages" => [["role" => "user", "content" => "Reply with the single word OK."]]]),
              CURLOPT_HEADERFUNCTION => function ($c, $h) use (&$hd) { if (preg_match("/^(anthropic-ratelimit-[a-z-]+|retry-after):\s*(.+)$/i", trim($h), $mm)) $hd[strtolower($mm[1])] = trim($mm[2]); return strlen($h); }]);
            $out = curl_exec($ch); $code = (int)curl_getinfo($ch, CURLINFO_HTTP_CODE); curl_close($ch); $jj = json_decode((string)$out, true);
            echo "U model " . $m . " · HTTP " . $code . " · " . round(microtime(true) - $t0, 1) . " s · " . ($code === 200 ? "answer: " . mb_substr((string)($jj["content"][0]["text"] ?? json_encode($jj["content"] ?? null)), 0, 40) . " · stop " . ($jj["stop_reason"] ?? "") : "error: " . mb_substr((string)($jj["error"]["type"] ?? "") . " " . (string)($jj["error"]["message"] ?? $out), 0, 200)) . "\n";
            foreach (["anthropic-ratelimit-requests-limit", "anthropic-ratelimit-input-tokens-limit", "anthropic-ratelimit-output-tokens-limit", "anthropic-ratelimit-requests-remaining", "anthropic-ratelimit-input-tokens-remaining", "retry-after"] as $hk) if (isset($hd[$hk])) echo "U   " . $hk . " = " . $hd[$hk] . "\n"; }
          foreach ($d->query("SELECT setting_key, LEFT(setting_value, 300) v FROM hrms_settings WHERE setting_key IN ('ora_fill_dbg','tmph_busy_until','ai_busy_until') OR setting_key LIKE 'tmph_busy%' OR setting_key LIKE 'claude_busy%'")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U set " . $r["setting_key"] . " = " . $r["v"] . "\n";
          foreach ($d->query("SELECT DATE_FORMAT(at, '%H:%i') m, COUNT(*) n, SUM(rating IS NULL) nul FROM order_rate_auto WHERE at >= NOW() - INTERVAL 40 MINUTE GROUP BY 1 ORDER BY 1 DESC LIMIT 14")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U read at " . $r["m"] . " · " . $r["n"] . " (no chat " . $r["nul"] . ")\n";
          try { foreach ($d->query("SELECT at, info FROM wa_log WHERE at >= NOW() - INTERVAL 15 MINUTE AND (info LIKE '%429%' OR info LIKE '%rate%' OR info LIKE '%busy%' OR info LIKE '%overloaded%' OR info LIKE '%AI %') AND info NOT LIKE 'ai %' ORDER BY id DESC LIMIT 10")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U log " . substr($r["at"], 11, 8) . " " . mb_substr($r["info"], 0, 240) . "\n"; } catch (Throwable $e) { }
          try { $x = $d->query("SELECT COUNT(*) n, ROUND(AVG(CAST(SUBSTRING_INDEX(SUBSTRING(info, 4), ' s', 1) AS DECIMAL(8,2))), 1) av, MAX(CAST(SUBSTRING_INDEX(SUBSTRING(info, 4), ' s', 1) AS DECIMAL(8,2))) mx FROM wa_log WHERE at >= NOW() - INTERVAL 15 MINUTE AND info LIKE 'ai % s %'")->fetch(PDO::FETCH_ASSOC); echo "U bot answers last 15 min: " . $x["n"] . " · average AI time " . $x["av"] . " s · slowest " . $x["mx"] . " s\n"; } catch (Throwable $e) { }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

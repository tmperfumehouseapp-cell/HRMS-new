# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          $P = "/^hey tmperfumehouse, i need the .*perfume combo|placing my first order|show me your best-selling and longest-lasting|help choosing the perfect perfume|want to buy any 3 shower gels|2 showe?r gels combo|found this fragrance cheaper elsewhere|can.?t find my perfect scent|^hey tmperfumehouse, i am interested in|i have a bulk requirement|^hi tmperfumehouse, i.?m looking for|^hey tmperfumehouse, i need perfume|want to know the secret offers|^hi, i want to place an order/u";
          $fi = $d->prepare("SELECT LEFT(body, 320) b FROM wa_messages WHERE phone = ? AND dir = 'in' AND ts >= ? ORDER BY id LIMIT 1");
          $pi = $d->prepare("SELECT MAX(ts) FROM wa_messages WHERE phone = ? AND dir = 'in' AND ts < ?");
          $mo = $d->prepare("SELECT who, status, ts FROM wa_messages WHERE phone = ? AND dir = 'out' AND emp_id = 0 AND who IN ('campaign', 'followup', 'recover') AND mtype = 'template' AND ts <= ? ORDER BY id DESC LIMIT 60");
          $tg = $d->prepare("SELECT src FROM wa_ctags WHERE phone = ? AND tag = 'campaign' AND at <= ? LIMIT 1");
          $q = $d->prepare("SELECT q.id, q.phone, q.opened_at, q.src, COALESCE(t.type, 'unclear') type, COALESCE(t.reason, '') reason FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id WHERE q.opened_at >= '2026-11-24 10:00:00'"); $q->execute();
          $X = []; $W = []; $A = []; $n = 0; $allFailFresh = 0; $allFailCamp = 0; $day = [];
          foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) { $T = strtotime($r["opened_at"]); $cut = date("Y-m-d H:i:s", $T - 120);
            $pi->execute([$r["phone"], $cut]); $wrote = (string)$pi->fetchColumn() !== "";
            $mo->execute([$r["phone"], $r["opened_at"]]); $ms = $mo->fetchAll(PDO::FETCH_ASSOC); $ok = 0; $bad = 0; $ok3 = 0; foreach ($ms as $m) { if ($m["status"] === "failed") $bad++; else { $ok++; if ($T - strtotime($m["ts"]) <= 3 * 86400) $ok3++; } }
            $st = !$ms ? "nothing sent by us" : ($ok === 0 ? "ONLY FAILED sends (" . ($bad >= 3 ? "3+" : $bad) . ")" : ($ok3 ? "a message reached him in the last 3 days" : "a message reached him earlier"));
            $fresh = in_array($r["type"], ["campaign", "community"], true) ? "counted " . $r["type"] : "counted fresh";
            $k = ($wrote ? "wrote before" : "never wrote before") . " · " . $st . " · " . $fresh; $A[$k] = ($A[$k] ?? 0) + 1;
            $fi->execute([$r["phone"], $cut]); $b = trim((string)preg_replace("/\s+/u", " ", mb_strtolower((string)$fi->fetchColumn()))); if (!preg_match($P, $b)) continue; $n++;
            $W[$k] = ($W[$k] ?? 0) + 1;
            if (!$wrote && $ms && $ok === 0 && $fresh !== "counted fresh") { $tg->execute([$r["phone"], date("Y-m-d H:i:s", $T + 60)]); $ts = $tg->fetchColumn(); $rs = preg_replace("/\d/", "#", (string)preg_replace("/^(campaign): .*$/u", "$1: (name)", preg_replace("/\(.*$/u", "", $r["reason"]))); $kk = trim($rs) . " · campaign tag: " . ($ts === false ? "no" : $ts); $X[$kk] = ($X[$kk] ?? 0) + 1; } }
          echo "U website-message queries since 24 Nov: " . $n . "\n"; arsort($W); foreach ($W as $k => $c) echo "U web " . $c . " · " . $k . "\n";
          arsort($X); foreach ($X as $k => $c) echo "U web, never wrote, only failed sends, yet not fresh — why: " . $c . " · " . $k . "\n";
          arsort($A); foreach ($A as $k => $c) if (strpos($k, "ONLY FAILED") !== false) echo "U ALL queries " . $c . " · " . $k . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

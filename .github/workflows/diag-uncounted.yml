# READ-ONLY: the final prepaid rule - today's orders (salesperson lines only), the guidebook and the blocked 2% templates. Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          echo "U now " . date("Y-m-d H:i:s") . "\n"; $day = date("Y-m-d", time() - 36000); $t0 = $day . " 10:00:00"; $src = (string)file_get_contents($argv[1] . "empmanagment/api.php");
          if (!preg_match("/function must3_cod_charge.*?(?=function must3_compute)/s", $src, $mm) || strpos($mm[0], "must3_extra100") === false) { echo "U the final rule is NOT in the deployed code yet\n"; exit; } eval($mm[0]); echo "U deployed code has the final prepaid rule: yes\n";
          $gv = (string)$d->query("SELECT setting_value FROM hrms_settings WHERE setting_key = 'wag_gb_cod_v'")->fetchColumn(); $b = (string)$d->query("SELECT body FROM lib_guide WHERE status = 'live' ORDER BY version DESC, id DESC LIMIT 1")->fetchColumn(); echo "U guidebook pass marker " . $gv . " · final rule in it: " . (strpos($b, "COD CHARGE (owner, 25 Nov, final)") !== false ? "yes" : "no") . " · bot still told to say the COD line: " . (strpos($b, "bach jayenge") !== false ? "YES" : "no") . " · 2% near prepaid left: " . preg_match_all("/2\s*%.{0,50}prepaid|prepaid.{0,50}2\s*%/i", (string)preg_replace("/NO .{0,3}2% off on prepaid|the old 2% is gone/", "", $b)) . "\n";
          $rx = "/(prepaid|pre\s*paid|full\s*pay|online\s*pay)[^\n]{0,60}(?<![\d.])2\s*(%|percent)|(?<![\d.])2\s*(%|percent)[^\n]{0,60}(prepaid|pre\s*paid|full\s*pay|online\s*pay)/iu"; $n = 0; $ap = 0; $nm = []; foreach ($d->query("SELECT t.id, t.name, t.body, (SELECT COUNT(*) FROM wa_tpl_waba w WHERE w.tpl_id = t.id AND UPPER(w.status) = 'APPROVED') a FROM wa_templates t WHERE t.body LIKE '%2%' AND (t.body LIKE '%prepaid%' OR t.body LIKE '%payment%')")->fetchAll(PDO::FETCH_ASSOC) as $r) if (preg_match($rx, (string)$r["body"])) { $n++; if ((int)$r["a"] > 0) { $ap++; if (count($nm) < 12) $nm[] = $r["name"]; } } echo "U templates with the 2% prepaid line (now blocked): " . $n . " · approved by Meta: " . $ap . " · " . implode(", ", $nm) . "\n";
          $rows = $d->query("SELECT o.phone, a.employee_id e, o.created_at t FROM shop_orders o JOIN order_allocations a ON a.source COLLATE utf8mb4_unicode_ci = o.store_key COLLATE utf8mb4_unicode_ci AND a.order_id COLLATE utf8mb4_unicode_ci = CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci WHERE o.created_at >= '$t0' AND a.employee_id > 0 AND o.total > 0 AND (o.tags IS NULL OR o.tags NOT LIKE '%cancel%')")->fetchAll(PDO::FETCH_ASSOC);
          foreach ($d->query("SELECT phone, employee_id e, order_date t FROM manual_orders WHERE order_date >= '$t0' AND employee_id > 0 AND total > 0 AND phone <> ''")->fetchAll(PDO::FETCH_ASSOC) as $r) $rows[] = $r;
          $en = []; foreach ($d->query("SELECT employee_id, full_name FROM employees")->fetchAll(PDO::FETCH_ASSOC) as $r) $en[(int)$r["employee_id"]] = $r["full_name"];
          $q = $d->prepare("SELECT body, who, emp_id FROM wa_messages WHERE phone IN (?, ?) AND dir = 'out' AND ts >= ? ORDER BY id ASC LIMIT 700"); $tot = 0; $new = 0; $bot = 0; $no = 0; $per = [];
          foreach ($rows as $r) { $k = substr(preg_replace("/\D+/", "", (string)$r["phone"]), -10); if (strlen($k) !== 10) continue; $tot++; $q->execute([$k, "91" . $k, date("Y-m-d H:i:s", strtotime($r["t"]) - 3 * 86400)]); $ms = $q->fetchAll(PDO::FETCH_ASSOC); if (!$ms) { $no++; continue; } $pc = false; $pw = false; $ac = false; $aw = false; foreach ($ms as $m) { $b = (string)$m["body"]; $S = in_array((string)$m["who"], ["emp", "phone"], true) || (int)$m["emp_id"] > 0; $c = must3_cod_charge($b) || must3_extra100($b); $w = must3_prepaid_word($b); if ($S) { if ($c) $pc = true; if ($w) $pw = true; } if ($c) $ac = true; if ($w) $aw = true; }
            $e = (int)$r["e"]; $per[$e] = $per[$e] ?? [0, 0]; $per[$e][0]++; if ($pc && $pw) { $new++; $per[$e][1]++; } elseif ($ac && $aw) $bot++; }
          echo "U orders since 10 AM with a mobile number: " . $tot . " · no chat under the order number: " . $no . " · Prepaid done (the SALESPERSON told the Rs 100 extra + prepaid): " . $new . " · only the bot / an automatic message said it (not counted): " . $bot . "\n";
          uasort($per, function ($a, $b) { return $b[1] <=> $a[1] ?: $b[0] <=> $a[0]; }); $k = 0; foreach ($per as $e => $x) { if ($k++ >= 45) break; echo "U " . str_pad(mb_substr((string)($en[$e] ?? $e), 0, 20), 20) . " · orders " . $x[0] . " · prepaid told " . $x[1] . "\n"; }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

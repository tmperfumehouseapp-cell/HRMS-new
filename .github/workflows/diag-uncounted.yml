# READ-ONLY: what the must-send check sees for ONE order (times and which rule matched, no message text). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f; $on = preg_replace("/\D/", "", (string)($argv[2] ?? "")); if ($on === "") { echo "no order number\n"; exit; }
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "now " . date("Y-m-d H:i:s") . "\n";
          $q = $d->prepare("SELECT o.order_name, o.store_key, o.shopify_id, o.created_at, o.phone, o.total, o.tags FROM shop_orders o WHERE REPLACE(o.order_name, '#', '') LIKE ? AND o.created_at >= ? ORDER BY o.created_at DESC LIMIT 2"); $q->execute([$on . '%', date('Y-m-d H:i:s', time() - 3 * 86400)]);
          foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $o) {
            $k = substr(preg_replace("/\D+/", "", (string)$o["phone"]), -10); $t = strtotime((string)$o["created_at"]);
            echo "ORDER " . $o["order_name"] . " store " . $o["store_key"] . " created " . $o["created_at"] . " total " . $o["total"] . " phone digits " . strlen($k) . " cancelled " . (stripos((string)$o["tags"], "cancel") !== false ? "yes" : "no") . "\n";
            $a = $d->prepare("SELECT employee_id, order_type, allocated_by, allocated_at FROM order_allocations WHERE source = ? AND order_id = ?"); $a->execute([$o["store_key"], (string)$o["shopify_id"]]); echo "  allocation: " . json_encode($a->fetch(PDO::FETCH_ASSOC)) . "\n";
            $c = $d->prepare("SELECT COUNT(*) FROM wa_messages WHERE phone = ?"); $c->execute([$k]); $has = (int)$c->fetchColumn(); echo "  messages under the order's number: $has\n";
            { $x = $d->prepare("SELECT phone FROM order_extra_phones WHERE source = ? AND order_id = ? LIMIT 1"); $x->execute([$o["store_key"], (string)$o["shopify_id"]]); $k2 = substr(preg_replace("/\D+/", "", (string)$x->fetchColumn()), -10); echo "  extra mobile no. on the order: " . (strlen($k2) === 10 ? "yes" : "none") . "\n";
              $fq = $d->prepare("SELECT phone, COUNT(*) n FROM wa_messages WHERE ts >= ? AND ts <= ? AND body LIKE ? GROUP BY phone ORDER BY n DESC LIMIT 5"); $t0 = microtime(true); $fq->execute([date("Y-m-d H:i:s", $t - 3 * 86400), date("Y-m-d H:i:s", $t + 2 * 3600), "%" . $k . "%"]); $fr = $fq->fetchAll(PDO::FETCH_ASSOC); echo "  chats where the order's number is written (3 d before .. 2 h after): " . count($fr) . " (search took " . round(microtime(true) - $t0, 2) . " s)\n";
              $fq->execute([date("Y-m-d H:i:s", $t - 10 * 86400), date("Y-m-d H:i:s", min(time(), $t + 48 * 3600)), "%" . $k . "%"]); $fr2 = $fq->fetchAll(PDO::FETCH_ASSOC); echo "  ... in a wider window (10 d before .. 48 h after): " . count($fr2) . "\n";
              $e0 = (int)$d->query("SELECT employee_id FROM order_allocations WHERE source = " . $d->quote($o["store_key"]) . " AND order_id = " . $d->quote((string)$o["shopify_id"]) . " LIMIT 1")->fetchColumn(); $t0 = microtime(true);
              $sq = $d->prepare("SELECT m.phone, COUNT(*) n FROM wa_contacts c JOIN wa_messages m ON m.phone = c.phone WHERE c.assigned_emp = ? AND c.last_in_at >= ? AND c.phone <> ? AND m.ts >= ? AND m.ts <= ? AND m.body LIKE ? GROUP BY m.phone ORDER BY n DESC LIMIT 3"); $sq->execute([$e0, date("Y-m-d H:i:s", $t - 3 * 86400), $k, date("Y-m-d H:i:s", $t - 3 * 86400), date("Y-m-d H:i:s", $t + 2 * 3600), "%" . $k . "%"]); $sr = $sq->fetchAll(PDO::FETCH_ASSOC);
              echo "  NEW scoped search (only that salesperson's chats): " . count($sr) . " chat(s), took " . round(microtime(true) - $t0, 2) . " s\n";
              $wm = $d->prepare("SELECT dir, who, mtype, ts FROM wa_messages WHERE phone = ? AND ts >= ? ORDER BY id"); $wm->execute([$k, date("Y-m-d H:i:s", $t - 3 * 86400)]); foreach ($wm->fetchAll(PDO::FETCH_ASSOC) as $w) echo "  order-number chat msg: " . $w["ts"] . " " . $w["dir"] . "/" . $w["who"] . "/" . $w["mtype"] . "\n";
              if (count($sr) === 1) { $k = (string)$sr[0]["phone"]; echo "  -> reading the found chat instead\n"; }
              $cn = $d->prepare("SELECT COUNT(*) FROM wa_contacts c WHERE c.assigned_emp = (SELECT employee_id FROM order_allocations WHERE source = ? AND order_id = ? LIMIT 1) AND c.last_in_at >= ?"); $cn->execute([$o["store_key"], (string)$o["shopify_id"], date("Y-m-d H:i:s", $t - 3 * 86400)]); echo "  chats of that salesperson active in the 3 days before: " . $cn->fetchColumn() . "\n";
            }
            $m = $d->prepare("SELECT dir, mtype, body, ts, who, emp_id FROM wa_messages WHERE phone = ? AND ts >= ? AND ts <= ? ORDER BY id ASC LIMIT 700"); $m->execute([$k, date("Y-m-d H:i:s", $t - 3 * 86400), date("Y-m-d H:i:s", min(time(), $t + 48 * 3600))]); $ms = $m->fetchAll(PDO::FETCH_ASSOC); $nm = count($ms);
            echo "  messages read in the window (" . date("Y-m-d H:i", $t - 3 * 86400) . " .. " . date("Y-m-d H:i", min(time(), $t + 48 * 3600)) . "): $nm" . ($nm >= 700 ? " (LIMIT REACHED)" : "") . " first " . ($ms[0]["ts"] ?? "-") . " last " . ($ms[$nm - 1]["ts"] ?? "-") . "\n";
            $all = $d->prepare("SELECT COUNT(*), MIN(ts), MAX(ts) FROM wa_messages WHERE phone = ?"); $all->execute([$k]); echo "  all messages of this chat: " . implode(" / ", $all->fetch(PDO::FETCH_NUM)) . "\n";
            $rxA = '/recheck your delivery address|change address\s*\/\s*add new address/i'; $rxC = '/chain_index|jewell?ery item from this catalogue|chain or any other jewell?ery/i';
            $rxChainWord = '/\b(chains?|necklaces?|pendants?|bracelets?|lockets?|jewell?ery|jewelry|mala|kada)\b/iu';
            $rxP = '/((?<![\d.])2|\bdo|\btwo)\s*(%|percent|per\s*cent|pratishat)|extra discount|(prepaid|full\s*pay(ment)?|advance\s*pay(ment)?|online\s*pay(ment)?)[^.\n]{0,80}(discount|off|less|kam|chhut|chut|cashback)|(discount|off|less|kam|chhut|chut|cashback)[^.\n]{0,80}(prepaid|full\s*pay(ment)?|advance\s*pay(ment)?|online\s*pay(ment)?)/iu';
            foreach ($ms as $mi => $x) { if ($x["dir"] !== "out") continue; $body = (string)$x["body"]; $hit = [];
              if (preg_match($rxA, $body)) $hit[] = "ADDRESS"; if ($body !== "" && preg_match($rxP, $body)) $hit[] = "PREPAID"; if (preg_match($rxC, $body) || preg_match($rxChainWord, $body)) $hit[] = "CHAIN";
              if ($hit) echo "  hit " . $x["ts"] . " " . $x["who"] . "/" . $x["mtype"] . ": " . implode(",", $hit) . "\n"; }
            $ad = $d->prepare("SELECT COUNT(*), COALESCE(SUM(price),0) FROM employee_addons WHERE REPLACE(LOWER(order_name), '#', '') = ?"); $ad->execute([$on]); echo "  add-on rows / amount: " . implode(" / ", $ad->fetch(PDO::FETCH_NUM)) . "\n";
          }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

# READ-ONLY: what the must-send check sees for ONE order (times and which rule matched, no message text). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'");
          echo "U now " . date("Y-m-d H:i:s") . "\n";
          foreach ($d->query("SELECT setting_key, LEFT(setting_value, 300) v FROM hrms_settings WHERE setting_key IN ('ai_fb_on','ai_fb_stop','ora_fill_dbg','ora_cu_at')")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U set " . $r["setting_key"] . " = " . (preg_match("/^\d{10}$/", $r["v"]) ? date("Y-m-d H:i:s", (int)$r["v"]) : $r["v"]) . "\n";
          echo "U backup key saved: " . ((int)$d->query("SELECT COUNT(*) FROM hrms_settings WHERE setting_key = 'ai_fb_key' AND setting_value <> ''")->fetchColumn() ? "yes" : "no") . "\n";
          foreach ($d->query("SELECT DATE_FORMAT(at, '%H:%i') m, COUNT(*) n, SUM(rating IS NULL) nul FROM order_rate_auto WHERE at >= NOW() - INTERVAL 90 MINUTE GROUP BY 1 ORDER BY 1 DESC LIMIT 12")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U read at " . $r["m"] . " · " . $r["n"] . " (no chat " . $r["nul"] . ")\n";
          foreach ($d->query("SELECT hr, purpose, calls, ROUND(cost_usd, 3) c FROM ai_usage_hour WHERE use_date = CURDATE() AND hr >= HOUR(NOW()) - 1 ORDER BY hr DESC, cost_usd DESC LIMIT 14")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U hour " . $r["hr"] . " · " . $r["purpose"] . " · " . $r["calls"] . " calls · $" . $r["c"] . "\n";
          try { foreach ($d->query("SELECT at, info FROM wa_log WHERE at >= NOW() - INTERVAL 10 MINUTE AND (info LIKE '%usage limits%' OR info LIKE '%AI %' OR info LIKE '%Claude%') ORDER BY id DESC LIMIT 6")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U log " . substr($r["at"], 11, 8) . " " . mb_substr($r["info"], 0, 220) . "\n"; } catch (Throwable $e) { }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

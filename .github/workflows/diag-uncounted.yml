# READ-ONLY: does the live bot guidebook hold the COD charge rule. Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          echo "U now " . date("Y-m-d H:i:s") . "\n"; echo "U deployed code has the guidebook patch: " . (strpos((string)file_get_contents($argv[1] . "empmanagment/wa_guide_clean.php"), "wag_gb_patch_cod") !== false ? "yes" : "NO") . "\n";
          foreach ($d->query("SELECT setting_key, setting_value FROM hrms_settings WHERE setting_key IN ('wag_gb_cod_v', 'wag_gb_card_v', 'wag_gb_style_v')")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U set " . $r["setting_key"] . " = " . $r["setting_value"] . "\n";
          try { foreach ($d->query("SELECT id, status, version, LENGTH(body) n, body FROM lib_guide ORDER BY id DESC LIMIT 3")->fetchAll(PDO::FETCH_ASSOC) as $r) { $b = (string)$r["body"]; $b2 = (string)preg_replace("/NO .{0,3}2% off on prepaid/", "", $b); echo "U guidebook id " . $r["id"] . " v" . $r["version"] . " · " . $r["status"] . " · " . $r["n"] . " bytes · has the COD CHARGE rule: " . (strpos($b, "COD CHARGE (owner, 25 Nov") !== false ? "yes" : "no") . " · still says the old prepaid 2% line: " . (preg_match("/Prepaid gets 2%|Prepaid 2% off/", $b) ? "YES" : "no") . " · other 2% near prepaid: " . preg_match_all("/2\s*%.{0,50}prepaid|prepaid.{0,50}2\s*%/i", $b2) . "\n"; } } catch (Throwable $e) { echo "U guidebook read failed: " . substr($e->getMessage(), 0, 200) . "\n"; }
          try { $b = (string)$d->query("SELECT body FROM lib_guide WHERE status = 'live' ORDER BY version DESC, id DESC LIMIT 1")->fetchColumn(); $b2 = (string)preg_replace("/NO .{0,3}2% off on prepaid/", "", $b); preg_match_all("/.{0,90}(?:2\s*%.{0,50}prepaid|prepaid.{0,50}2\s*%).{0,60}/iu", $b2, $mm); foreach ($mm[0] as $x) echo "U near: " . $x . "\n"; } catch (Throwable $e) { echo "U read failed\n"; }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

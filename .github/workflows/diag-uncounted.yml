# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          $P = ["1-3 combo (Post-Diwali)" => "/^hey tmperfumehouse, i need the .*perfume combo/u", "4,7 first order" => "/placing my first order/u", "5 best-selling" => "/show me your best-selling and longest-lasting/u", "6 perfume expert" => "/help choosing the perfect perfume/u", "8 any 3 shower gels" => "/want to buy any 3 shower gels/u", "9 2 shower gels combo" => "/2 showe?r gels combo/u", "10,13 cheaper elsewhere" => "/found this fragrance cheaper elsewhere/u", "11 perfect scent" => "/can.?t find my perfect scent/u", "12 interested in" => "/^hey tmperfumehouse, i am interested in/u", "14 bulk" => "/i have a bulk requirement/u", "15 looking for" => "/^hi tmperfumehouse, i.?m looking for/u", "16 need perfume" => "/^hey tmperfumehouse, i need perfume/u", "17 secret offers" => "/want to know the secret offers/u", "18 place an order" => "/^hi, i want to place an order/u"];
          $adt = function ($t) { return (bool)(preg_match("/more info(rmation)? (on|about) this|interested in this|saw (your|this) ad|\\btmph\\b|tm\\s*perfume\\s*house|\\bwant to (buy|order)\\b|placing my first order|free\\s*10\\s*ml|extra discount|\\bi\\s*want\\b.*\\bml\\b/u", $t) || preg_match("/\\d+\\s*ml\\b.*\\b(in|at|for|@|rs\\.?|₹)\\s*\\d{3,5}\\b/u", $t)); };
          $fi = $d->prepare("SELECT LEFT(body, 320) b, reply_to FROM wa_messages WHERE phone = ? AND dir = 'in' AND ts >= ? ORDER BY id LIMIT 1");
          $q = $d->prepare("SELECT q.id, q.phone, q.opened_at, q.src, COALESCE(t.type, 'unclear') type, COALESCE(t.reason, '') reason FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id WHERE q.opened_at >= '2026-11-24 10:00:00'"); $q->execute();
          $M = []; $T = []; $R = []; $S = []; $known = []; $all = 0; $hit = 0; $rep = 0; $day = [];
          foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) { $all++; $fi->execute([$r["phone"], date("Y-m-d H:i:s", strtotime($r["opened_at"]) - 120)]); $f = $fi->fetch(PDO::FETCH_ASSOC); if (!$f) continue; $b = trim((string)preg_replace("/\s+/u", " ", mb_strtolower((string)$f["b"])));
            $pk = ""; foreach ($P as $k => $re) if (preg_match($re, $b)) { $pk = $k; break; } if ($pk === "") continue; $hit++; if (trim((string)$f["reply_to"]) !== "") $rep++;
            $M[$pk][$r["type"]] = ($M[$pk][$r["type"]] ?? 0) + 1; $T[$r["type"]] = ($T[$r["type"]] ?? 0) + 1; $known[$pk] = $adt($b) ? "yes" : "NO"; $dd = substr(date("Y-m-d", strtotime($r["opened_at"]) - 36000), 8); $fresh = in_array($r["type"], ["campaign", "community"], true) ? "not fresh" : "fresh"; $day[$dd][$fresh] = ($day[$dd][$fresh] ?? 0) + 1;
            if (in_array($r["type"], ["campaign", "community"], true)) { $rs = preg_replace("/\d/", "#", (string)preg_replace("/^(campaign|your rule): .*$/u", "$1: (name)", preg_replace("/\(.*$/u", "", $r["reason"]))); $R[$r["type"] . " · " . mb_substr(trim($rs), 0, 70)] = ($R[$r["type"] . " · " . mb_substr(trim($rs), 0, 70)] ?? 0) + 1; $S[$r["src"] === "" ? "(none)" : $r["src"]] = ($S[$r["src"] === "" ? "(none)" : $r["src"]] ?? 0) + 1; } }
          echo "U queries since 24 Nov 10:00: " . $all . " · first message is one of the 18 website messages: " . $hit . " · of them sent as a reply to a message of ours: " . $rep . "\n"; echo "U how they are typed now: " . json_encode($T) . " · per day " . json_encode($day) . "\n";
          foreach ($P as $k => $re) echo "U message " . $k . " · the system already knows it as a ready-made text: " . ($known[$k] ?? "(not seen)") . " · " . json_encode($M[$k] ?? []) . "\n";
          arsort($R); foreach (array_slice($R, 0, 12, true) as $k => $n) echo "U not fresh because: " . $n . " · " . $k . "\n"; echo "U those not-fresh ones were given as: " . json_encode($S) . "\n";
          try { foreach ($d->query("SELECT kind, val, type, active, hits FROM wq_rules ORDER BY id")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U owner rule: " . $r["kind"] . " '" . mb_substr($r["val"], 0, 60) . "' → " . $r["type"] . " · active " . $r["active"] . " · hits " . $r["hits"] . "\n"; } catch (Throwable $e) { }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

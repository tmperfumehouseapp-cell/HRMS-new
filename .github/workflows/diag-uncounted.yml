# READ-ONLY: what the must-send check sees for ONE order (times and which rule matched, no message text). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          $cut = (string)$d->query("SELECT setting_value FROM hrms_settings WHERE setting_key = 'wq_cutover'")->fetchColumn(); $day = date("Y-m-d", time() - 36000); $st = (string)$d->query("SELECT setting_value FROM hrms_settings WHERE setting_key = 'day_start'")->fetchColumn(); echo "U cutover " . $cut . " · business day " . $day . " · day_start setting " . $st . "\n";
          $a = $day . " 10:00:00"; $q = $d->prepare("SELECT FLOOR(TIMESTAMPDIFF(MINUTE, ?, q.opened_at) / 60) h, COUNT(*) n FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id WHERE q.opened_at >= ? AND q.opened_at < DATE_ADD(?, INTERVAL 1 DAY) AND q.emp_id > 0 AND COALESCE(t.type, 'unclear') NOT IN ('campaign', 'community') GROUP BY h ORDER BY h"); $q->execute([$a, $a, $a]); $c = 0; foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) { $c += (int)$r["n"]; echo "U hour +" . $r["h"] . " · " . $r["n"] . " · running " . $c . "\n"; }
          $q = $d->prepare("SELECT COALESCE(SUM(scout_count), 0) FROM employee_queries WHERE query_date = ?"); $q->execute([$day]); echo "U typed scout today " . $q->fetchColumn() . " · live fresh today " . $c . "\n";
          try { $q = $d->prepare("SELECT v, at FROM wa_cp_cache WHERE k = ?"); $q->execute(["qideal2_" . $day]); $r = $q->fetch(PDO::FETCH_ASSOC); if ($r) { $j = json_decode((string)$r["v"], true); echo "U card cache at " . $r["at"] . " · src " . ($j["src"] ?? "?") . " · so far " . json_encode($j["so_far"] ?? null) . "\n"; foreach (($j["hourly"] ?? []) as $h) if (!empty($h["past"])) echo "U card " . $h["t"] . " actual " . json_encode($h["actual"]) . " ideal " . json_encode($h["ideal"]) . "\n"; } else echo "U card cache: nobody has opened the card since the deploy\n"; $q->execute(["qshape2"]); $r = $q->fetch(PDO::FETCH_ASSOC); if ($r) { $j = json_decode((string)$r["v"], true); echo "U shape at " . $r["at"] . " · learned " . json_encode($j["learned"]) . " · days " . $j["days"] . " · avg shout " . $j["avg_shout"] . " · avg orders " . $j["avg_orders"] . " · shout shape " . json_encode($j["shout"]) . "\n"; } } catch (Throwable $e) { echo "U cache read failed: " . $e->getMessage() . "\n"; }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

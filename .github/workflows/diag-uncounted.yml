# READ-ONLY: our own repeated staff lines about the code that the must-send rule does not catch (digits masked, 3+ chats only). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          echo "U now " . date("Y-m-d H:i:s") . "\n"; $src = (string)file_get_contents($argv[1] . "empmanagment/api.php"); $a = strpos($src, "function must3_code_msg("); $b = $a === false ? false : strpos($src, "\n}\n", $a); if ($a === false || $b === false) { echo "U rule not found\n"; exit; } eval(substr($src, $a, $b - $a + 3)); echo "U deployed rule is the final one: " . (strpos($src, "a code we give, not the verification code") !== false ? "yes" : "NO") . "\n";
          $q = $d->query("SELECT phone, LEFT(body, 900) b FROM wa_messages WHERE dir = 'out' AND who IN ('emp', 'phone') AND ts >= NOW() - INTERVAL 4 DAY AND (body LIKE '%code%' OR body LIKE '%broadcast%' OR body LIKE '%erification%' OR body LIKE '%chat.whatsapp.com%') LIMIT 60000"); $y = []; $n = []; $cy = 0; $cn = 0;
          foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) { $body = (string)$r["b"]; $k = mb_substr(trim(preg_replace("/\s+/u", " ", preg_replace("/\d/", "#", mb_strtolower($body)))), 0, 80); if (must3_code_msg($body)) { $cy++; $y[$k][$r["phone"]] = 1; } else { $cn++; $n[$k][$r["phone"]] = 1; } }
          $f = function ($g) { $o = []; foreach ($g as $k => $ph) if (count($ph) >= 3) $o[$k] = count($ph); arsort($o); return $o; }; $oy = $f($y); $on = $f($n); echo "U staff messages checked: " . ($cy + $cn) . " · counted as the code message: " . $cy . " · not counted: " . $cn . "\n";
          $i = 0; foreach ($oy as $k => $c) { if ($i++ >= 12) break; echo "U yes x" . $c . ": " . $k . "\n"; } $i = 0; foreach ($on as $k => $c) { if ($i++ >= 14) break; echo "U no  x" . $c . ": " . $k . "\n"; }
          $day = date("Y-m-d", time() - 36000); $t0 = $day . " 10:00:00"; $rows = $d->query("SELECT phone, mp_no, order_date t FROM manual_orders WHERE order_date >= '$t0' AND employee_id > 0 AND total > 0 AND phone <> ''")->fetchAll(PDO::FETCH_ASSOC); $q2 = $d->prepare("SELECT body FROM wa_messages WHERE phone IN (?, ?) AND dir = 'out' AND ts >= ? AND (body LIKE '%chat.whatsapp.com/%' OR body LIKE '%erification%' OR body LIKE '%code%' OR body LIKE '%roadcast%') ORDER BY id DESC LIMIT 80"); $tt = 0; $hh = 0; $one = [];
          foreach ($rows as $r) { $k = substr(preg_replace("/\D+/", "", (string)$r["phone"]), -10); if (strlen($k) !== 10) continue; $tt++; $q2->execute([$k, "91" . $k, date("Y-m-d H:i:s", strtotime($r["t"]) - 63 * 86400)]); $h = false; foreach ($q2->fetchAll(PDO::FETCH_COLUMN) as $bb) if (must3_code_msg((string)$bb)) { $h = true; break; } if ($h) $hh++; if (in_array((string)$r["mp_no"], ["TM10498", "TM10544"], true)) $one[] = $r["mp_no"] . " " . ($h ? "sent ✓" : "NOT found"); }
          echo "U HRMS / website orders since 10 AM with a mobile number: " . $tt . " · code message found: " . $hh . " (" . ($tt ? round(100 * $hh / $tt) : 0) . "%) · " . implode(" · ", $one) . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

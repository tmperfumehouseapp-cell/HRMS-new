# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          $k10 = function ($p) { $x = preg_replace("/\D+/", "", (string)$p); return strlen($x) >= 10 ? substr($x, -10) : ""; };
          $nm = []; foreach ($d->query("SELECT employee_id, full_name FROM employees")->fetchAll(PDO::FETCH_NUM) as $r) $nm[(int)$r[0]] = explode(" ", trim((string)$r[1]))[0];
          $orig = []; try { foreach ($d->query("SELECT number, otype FROM tms_ring WHERE at >= '2026-11-23 10:00:00'")->fetchAll(PDO::FETCH_NUM) as $r) $orig[strtolower((string)$r[0])] = (string)$r[1]; } catch (Throwable $e) { }
          foreach ($d->query("SELECT body FROM wa_messages WHERE dir = 'sys' AND mtype = 'event' AND ts >= '2026-11-23 10:00:00' AND body LIKE '%allocated to%(automatic)%' ORDER BY id")->fetchAll(PDO::FETCH_NUM) as $r) { if (preg_match("/(?:Website order|Order)\s+(\S+)\s+allocated to .* · (Query|Campaign) \(automatic\)/u", (string)$r[0], $m)) { $k = strtolower(ltrim($m[1], "#")); if (!isset($orig[$k])) $orig[$k] = strtolower($m[2]); } }
          $first = []; foreach ($d->query("SELECT phone, MIN(created_at) m FROM shop_orders WHERE total > 0 GROUP BY phone")->fetchAll(PDO::FETCH_NUM) as $r) { $k = $k10($r[0]); if ($k !== "" && (!isset($first[$k]) || $r[1] < $first[$k])) $first[$k] = $r[1]; }
          foreach ($d->query("SELECT phone, MIN(order_date) m FROM manual_orders WHERE total > 0 GROUP BY phone")->fetchAll(PDO::FETCH_NUM) as $r) { $k = $k10($r[0]); if ($k !== "" && (!isset($first[$k]) || $r[1] < $first[$k])) $first[$k] = $r[1]; }
          $O = [];
          foreach ($d->query("SELECT mp_no nm, phone, order_date at, total, employee_id emp, order_type ty FROM manual_orders WHERE channel = 'TM Store' AND created_by = 'auto (WhatsApp)' AND employee_id > 0 AND order_date >= '2026-11-23 10:00:00' AND NOT EXISTS (SELECT 1 FROM order_allocations a WHERE a.source = 'manual' AND a.order_id = CAST(manual_orders.manual_order_id AS CHAR) COLLATE utf8mb4_unicode_ci)")->fetchAll(PDO::FETCH_ASSOC) as $r) $O[] = $r + ["src" => "website"];
          foreach ($d->query("SELECT o.order_name nm, o.phone, o.created_at at, o.total, a.employee_id emp, a.order_type ty FROM order_allocations a JOIN shop_orders o ON o.store_key = a.source AND CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci = a.order_id WHERE a.allocated_by = 'auto (WhatsApp)' AND a.employee_id > 0 AND o.created_at >= '2026-11-23 10:00:00'")->fetchAll(PDO::FETCH_ASSOC) as $r) $O[] = $r + ["src" => "shopify"];
          $qq = $d->prepare("SELECT query_id, type, reason, opened_at FROM wq_qtype WHERE phone = ? AND opened_at <= ? AND opened_at >= ? ORDER BY opened_at DESC LIMIT 1"); $tl = $d->prepare("SELECT type, at, LEFT(reason, 50) r FROM wq_tlog WHERE query_id = ? ORDER BY id");
          $tg = $d->prepare("SELECT 1 FROM wa_ctags WHERE phone = ? AND tag = 'campaign' AND src = 'wq' AND at <= ? LIMIT 1"); $cs = $d->prepare("SELECT source FROM wa_contacts WHERE phone = ?"); $gc = $d->prepare("SELECT 1 FROM wa_messages WHERE phone = ? AND dir = 'out' AND who = 'campaign' AND ts BETWEEN ? AND ? LIMIT 1");
          $n = 0; $G = []; $lines = []; $byDay = [];
          foreach ($O as $o) { $key = strtolower(ltrim(trim((string)$o["nm"]), "#")); if (isset($orig[$key]) || (string)$o["ty"] !== "campaign") continue;   // only orders with no saved first type that are Campaign now
            $k = $k10($o["phone"]); $T = strtotime($o["at"]); if (isset($first[$k]) && $first[$k] < date("Y-m-d H:i:s", $T - 120)) continue;   // old buyer: Campaign before and after
            $qq->execute([$k, date("Y-m-d H:i:s", $T + 60), date("Y-m-d H:i:s", $T - 7 * 86400)]); $q = $qq->fetch(PDO::FETCH_ASSOC); if (!$q || !in_array($q["type"], ["campaign", "community"], true)) continue;
            $tl->execute([(int)$q["query_id"]]); $h = $tl->fetchAll(PDO::FETCH_ASSOC); $atOrder = ""; $chg = ""; foreach ($h as $x) { if ((string)$x["at"] <= date("Y-m-d H:i:s", $T + 900)) $atOrder = $x["type"]; else $chg = $x["type"] . " on " . substr((string)$x["at"], 5, 11); }
            // what the rule of that time would have said (latest query type = the type at order time)
            $tg->execute([$k, date("Y-m-d H:i:s", $T + 60)]); $tag = (bool)$tg->fetchColumn(); $cs->execute([$k]); $so = (string)$cs->fetchColumn(); $gc->execute([$k, date("Y-m-d H:i:s", $T - 30 * 86400), $o["at"]]); $got = (bool)$gc->fetchColumn();
            $oldSaid = "tag " . ($tag ? "yes" : "no") . " · query at order time " . ($atOrder === "" ? "(not typed yet)" : $atOrder) . " · source " . ($so === "" ? "(none)" : $so) . " · campaign msg in 30d " . ($got ? "yes" : "no");
            $n++; $dd = substr(date("Y-m-d", $T - 36000), 8); $byDay[$dd . " " . $o["src"]] = ($byDay[$dd . " " . $o["src"]] ?? 0) + 1; $why = $o["src"] . " · " . $oldSaid . " · query now " . $q["type"] . " (" . preg_replace("/\d+/", "#", mb_substr((string)preg_replace("/^(campaign): .*$/u", "$1: (name)", preg_replace("/\(.*$/u", "", (string)$q["reason"])), 0, 44)) . ")"; $G[$why] = ($G[$why] ?? 0) + 1;
            $lines[] = $o["at"] . "|U QC " . $dd . " · " . ltrim((string)$o["nm"], "#") . " · " . substr($o["at"], 11, 5) . " · " . round((float)$o["total"]) . " · " . ($nm[(int)$o["emp"]] ?? "#" . $o["emp"]) . " · query opened " . substr($q["opened_at"], 5, 11) . " · " . $why . " [" . preg_replace("/\d{5,}/", "#", mb_substr((string)$q["reason"], 0, 64)) . "]"; }
          echo "U robot orders, Campaign now, no saved first type, not an old buyer, query Campaign / Community: " . $n . " · per day " . json_encode($byDay) . "\n"; arsort($G); foreach ($G as $k => $c) echo "U grp " . $c . " · query was " . $k . "\n"; echo "U (list not printed)\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

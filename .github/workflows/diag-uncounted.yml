# READ-ONLY: what the must-send check sees for ONE order (times and which rule matched, no message text). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'");
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          foreach ($d->query("SELECT setting_key, LEFT(setting_value, 80) v FROM hrms_settings WHERE setting_key IN ('wag_cx_auto','wag_cx_ack','wa_cx_self','wag_sweep_at')")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U set " . $r["setting_key"] . " = " . (preg_match("/^\d{10}$/", $r["v"]) ? date("H:i:s", (int)$r["v"]) : $r["v"]) . "\n";
          $bot = json_decode((string)$d->query("SELECT setting_value FROM hrms_settings WHERE setting_key = 'wag_cfg'")->fetchColumn(), true); echo "U bot switch: " . (is_array($bot) ? ($bot["bot"] ?? "?") : "(no cfg row)") . "\n";
          foreach ($d->query("SELECT DATE(raised_at) dd, COUNT(*) n, SUM(summary LIKE 'WhatsApp (raised by the bot)%') botn, SUM(source = 'whatsapp') wa FROM cx_cases WHERE raised_at >= CURDATE() - INTERVAL 5 DAY GROUP BY 1 ORDER BY 1 DESC")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U complaints " . $r["dd"] . " · " . $r["n"] . " (by the bot " . $r["botn"] . ", whatsapp " . $r["wa"] . ")\n";
          $t0 = date("Y-m-d", time() - 36000) . " 10:00:00"; $cx = "EXISTS (SELECT 1 FROM cx_cases x WHERE x.phone = q.phone AND x.raised_at >= q.opened_at - INTERVAL 30 DAY AND x.raised_at <= q.opened_at + INTERVAL 48 HOUR AND (x.resolved_at IS NULL OR x.resolved_at >= q.opened_at) AND (x.closed_at IS NULL OR x.closed_at >= q.opened_at))";
          $q = $d->prepare("SELECT q.emp_id, e.full_name, SUM(COALESCE(t.type,'unclear') NOT IN ('campaign','community')) fresh, SUM(COALESCE(t.type,'unclear') NOT IN ('campaign','community') AND $cx) fresh_cx, SUM(COALESCE(t.type,'unclear') IN ('campaign','community')) camp, SUM(COALESCE(t.type,'unclear') IN ('campaign','community') AND $cx) camp_cx FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id LEFT JOIN employees e ON e.employee_id = q.emp_id WHERE q.opened_at >= ? AND q.emp_id > 0 GROUP BY q.emp_id ORDER BY (fresh_cx + camp_cx) DESC, fresh DESC LIMIT 14");
          $t1 = microtime(true); $q->execute([$t0]); $rows = $q->fetchAll(PDO::FETCH_ASSOC); echo "U day from " . $t0 . " · query took " . round(microtime(true) - $t1, 2) . " s\n";
          foreach ($rows as $r) echo "U " . str_pad(mb_substr((string)$r["full_name"], 0, 18), 18) . " · fresh " . $r["fresh"] . " (complaint " . $r["fresh_cx"] . ") · campaign " . $r["camp"] . " (complaint " . $r["camp_cx"] . ")\n";
          $tt = $d->prepare("SELECT COUNT(*) n, SUM($cx) c FROM wa_queries q WHERE q.opened_at >= ? AND q.emp_id > 0"); $tt->execute([$t0]); $r = $tt->fetch(PDO::FETCH_ASSOC); echo "U team today: " . $r["n"] . " queries with a person, " . $r["c"] . " are complaints\n";
          $w = $d->query("SELECT COUNT(*) FROM wa_contacts c WHERE c.status = 'open' AND c.optout = 0 AND (c.cx_id IS NULL OR c.cx_id = 0) AND c.last_in_at >= NOW() - INTERVAL 23 HOUR AND (c.last_out_at IS NULL OR c.last_out_at < c.last_in_at)")->fetchColumn(); echo "U open unanswered chats the sweep looks at (it reads 80 newest per run): " . $w . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

# READ-ONLY: what the must-send check sees for ONE order (times and which rule matched, no message text). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); $now = time(); $t0 = strtotime(date("Y-m-d", $now - 36000) . " 10:00:00");
          echo "U now " . date("Y-m-d H:i", $now) . " · day from " . date("Y-m-d H:i", $t0) . "\n";
          $q = $d->prepare("SELECT o.order_name, o.store_key, o.created_at, o.total, o.phone, o.tags, o.xparts, a.alloc_id, a.employee_id, a.house, a.allocated_by, a.is_direct FROM shop_orders o LEFT JOIN order_allocations a ON a.source COLLATE utf8mb4_unicode_ci = o.store_key COLLATE utf8mb4_unicode_ci AND a.order_id COLLATE utf8mb4_unicode_ci = CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci WHERE o.created_at >= ? AND o.total > 0 AND (o.tags IS NULL OR o.tags NOT LIKE '%cancel%') AND (a.alloc_id IS NULL OR a.employee_id = 0) ORDER BY o.created_at");
          $q->execute([date("Y-m-d H:i:s", $t0)]); $rows = $q->fetchAll(PDO::FETCH_ASSOC); $sum = 0; echo "U not given to a salesperson: " . count($rows) . "\n";
          foreach ($rows as $r) { $k = substr(preg_replace("/\D+/", "", (string)$r["phone"]), -10); $c = ["n" => 0, "emp" => 0, "li" => ""];
            if (strlen($k) === 10) { $cq = $d->prepare("SELECT assigned_emp, last_in_at, (SELECT COUNT(*) FROM wa_messages m WHERE m.phone = c.phone AND m.ts >= ?) n FROM wa_contacts c WHERE c.phone = ?"); $cq->execute([date("Y-m-d H:i:s", $t0 - 3 * 86400), $k]); $x = $cq->fetch(PDO::FETCH_ASSOC); if ($x) $c = ["n" => (int)$x["n"], "emp" => (int)$x["assigned_emp"], "li" => (string)$x["last_in_at"]]; }
            $sum += (float)$r["total"];
            echo "U " . $r["order_name"] . " · " . substr($r["created_at"], 11, 5) . " · Rs " . round($r["total"]) . " · store " . $r["store_key"] . " · " . ($r["alloc_id"] === null ? "no allocation row" : "row: house " . $r["house"] . ", nobody, by " . $r["allocated_by"]) . " · chat: " . ($c["n"] ? $c["n"] . " msgs in 3 days, holder " . ($c["emp"] ?: "nobody") : (strlen($k) === 10 ? "none for this number" : "no phone on the order")) . (stripos((string)$r["xparts"], "gel") !== false ? " · shower gel" : "") . "\n"; }
          echo "U total of these: Rs " . round($sum) . "\n";
          try { echo "U manual_orders columns: " . implode(",", $d->query("SHOW COLUMNS FROM manual_orders")->fetchAll(PDO::FETCH_COLUMN)) . "\n";
            $m = $d->prepare("SELECT * FROM manual_orders WHERE order_date >= ? ORDER BY order_date"); $m->execute([date("Y-m-d H:i:s", $t0)]); $mr = $m->fetchAll(PDO::FETCH_ASSOC); $ms = 0; echo "U HRMS-typed / quick-entry orders today: " . count($mr) . "\n";
            foreach ($mr as $x) { $ms += (float)($x["total"] ?? 0); echo "U  M " . ($x["order_no"] ?? ("id " . $x["manual_order_id"])) . " · " . substr((string)$x["order_date"], 11, 5) . " · Rs " . round((float)($x["total"] ?? 0)) . " · emp " . (int)($x["employee_id"] ?? 0) . " · type " . ($x["order_type"] ?? "") . " · batch " . ($x["quick_batch"] ?? ($x["batch"] ?? "")) . "\n"; }
            echo "U  manual total Rs " . round($ms) . "\n"; } catch (Throwable $e) { echo "U manual: " . $e->getMessage() . "\n"; }
          $all = $d->prepare("SELECT COUNT(*) n, COALESCE(SUM(total),0) s FROM shop_orders o WHERE o.created_at >= ? AND o.total > 0 AND (o.tags IS NULL OR o.tags NOT LIKE '%cancel%')"); $all->execute([date("Y-m-d H:i:s", $t0)]); $r = $all->fetch(PDO::FETCH_ASSOC); echo "U website orders today (not cancelled): " . $r["n"] . " Rs " . round($r["s"]) . "\n";
          $cn = $d->prepare("SELECT COUNT(*) n, COALESCE(SUM(total),0) s FROM shop_orders o WHERE o.created_at >= ? AND o.tags LIKE '%cancel%'"); $cn->execute([date("Y-m-d H:i:s", $t0)]); $r = $cn->fetch(PDO::FETCH_ASSOC); echo "U cancelled today: " . $r["n"] . " Rs " . round($r["s"]) . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

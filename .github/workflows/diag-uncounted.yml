# READ-ONLY: order codes on manual (HRMS / website) orders. Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          echo "U now " . date("Y-m-d H:i:s") . "\n"; $day = date("Y-m-d", time() - 36000); $t0 = $day . " 10:00:00";
          foreach ($d->query("SELECT channel, (batch <> '') b, COUNT(*) n, SUM(employee_id > 0) emp FROM manual_orders WHERE order_date >= '$t0' GROUP BY channel, b")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U manual orders today: channel [" . $r["channel"] . "] · batch set " . $r["b"] . " · " . $r["n"] . " · with a salesperson " . $r["emp"] . "\n";
          echo "U shop orders today: " . $d->query("SELECT COUNT(*) FROM shop_orders WHERE created_at >= '$t0' AND total > 0")->fetchColumn() . "\n";
          foreach ($d->query("SELECT source, added_via, COUNT(*) n FROM order_codes WHERE added_at >= '$t0' GROUP BY source, added_via")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U codes saved today: source " . $r["source"] . " · via " . $r["added_via"] . " · " . $r["n"] . "\n";
          echo "U codes on today's manual orders: " . $d->query("SELECT COUNT(*) FROM order_codes c JOIN manual_orders m ON c.source = 'manual' AND c.order_id = CAST(m.manual_order_id AS CHAR) WHERE m.order_date >= '$t0'")->fetchColumn() . " · on today's shop orders: " . $d->query("SELECT COUNT(*) FROM order_codes c JOIN shop_orders o ON c.source = o.store_key AND c.order_id = CAST(o.shopify_id AS CHAR) WHERE o.created_at >= '$t0'")->fetchColumn() . "\n";
          foreach ($d->query("SELECT DATE(m.order_date) dd, COUNT(*) n, SUM(EXISTS (SELECT 1 FROM order_codes c WHERE c.source = 'manual' AND c.order_id = CAST(m.manual_order_id AS CHAR))) wc FROM manual_orders m WHERE m.order_date >= NOW() - INTERVAL 6 DAY GROUP BY dd ORDER BY dd")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U day " . $r["dd"] . " · manual orders " . $r["n"] . " · with a saved code " . $r["wc"] . "\n";
          foreach ($d->query("SHOW COLUMNS FROM order_codes")->fetchAll(PDO::FETCH_ASSOC) as $r) $cols[] = $r["Field"]; echo "U order_codes columns: " . implode(", ", $cols) . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

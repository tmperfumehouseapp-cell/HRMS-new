# READ-ONLY: what the must-send check sees for ONE order (times and which rule matched, no message text). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); $now = time(); $t0 = strtotime(date("Y-m-d", $now - 36000) . " 10:00:00"); $el = $now - $t0;
          echo "F now " . date("Y-m-d H:i", $now) . " · today started " . date("Y-m-d H:i", $t0) . " · elapsed " . round($el / 3600, 2) . " h\n";
          $q = $d->prepare("SELECT COUNT(*) n, COALESCE(SUM(o.total), 0) s FROM shop_orders o JOIN order_allocations a ON a.source COLLATE utf8mb4_unicode_ci = o.store_key COLLATE utf8mb4_unicode_ci AND a.order_id COLLATE utf8mb4_unicode_ci = CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci WHERE o.created_at >= ? AND o.created_at < ? AND o.total > 0 AND (o.tags IS NULL OR o.tags NOT LIKE '%cancel%') AND a.employee_id > 0");
          $get = function ($a, $b) use ($q) { $q->execute([date("Y-m-d H:i:s", $a), date("Y-m-d H:i:s", $b)]); $r = $q->fetch(PDO::FETCH_ASSOC); return [(int)$r["n"], (float)$r["s"]]; };
          [$tn, $ts] = $get($t0, $now); echo "F TODAY so far: $tn orders Rs " . round($ts) . "\n";
          foreach (["2026-11-02","2026-11-03","2026-11-04","2026-11-05","2026-11-06","2026-11-07","2026-11-16","2026-11-17","2026-11-18","2026-11-19"] as $day) { $s0 = strtotime($day . " 10:00:00"); [$an, $as] = $get($s0, $s0 + $el); [$fn, $fs] = $get($s0, $s0 + 86400); [$nn, $ns] = $get($s0 + $el, $s0 + 86400);
            echo "F $day (" . date("D", $s0) . "): by this time $an orders Rs " . round($as) . " · full day $fn orders Rs " . round($fs) . " · share by now orders " . ($fn ? round($an / $fn * 100, 1) : 0) . "% money " . ($fs ? round($as / $fs * 100, 1) : 0) . "% · rest of day $nn orders Rs " . round($ns) . "\n"; }
          [$ln, $ls] = $get($now - 3600, $now); echo "F last 60 minutes today: $ln orders Rs " . round($ls) . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

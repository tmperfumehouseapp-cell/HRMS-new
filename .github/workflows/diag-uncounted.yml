# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          $wk = array_fill(0, 7, "10:00"); try { foreach ($d->query("SELECT weekday, start_time FROM day_timing")->fetchAll(PDO::FETCH_ASSOC) as $r) $wk[(int)$r["weekday"]] = substr((string)$r["start_time"], 0, 5); } catch (Throwable $e) { }
          $raw = (string)$d->query("SELECT setting_value FROM hrms_settings WHERE setting_key = 'day_timing_overrides'")->fetchColumn(); $ov = []; $j = json_decode($raw, true); if (is_array($j)) foreach ($j as $k => $v) $ov[(string)$k] = (string)$v; $ov["2026-11-21"] = "12:25";
          echo "U weekday starts (0=Sun) " . implode(" ", $wk) . " · saved date starts " . json_encode(array_filter($ov, function ($k) { return $k >= "2026-11-16"; }, ARRAY_FILTER_USE_KEY)) . "\n";
          $startOf = function ($date) use ($wk, $ov) { return $ov[$date] ?? $wk[(int)date("w", strtotime($date))]; };
          $days = []; for ($x = strtotime("2026-11-18"); $x <= strtotime("2026-11-26"); $x += 86400) $days[] = date("Y-m-d", $x);
          $win = []; foreach ($days as $sd) { $nx = date("Y-m-d", strtotime($sd . " +1 day")); $win[$sd] = [$sd . " " . $startOf($sd) . ":00", $nx . " " . $startOf($nx) . ":00"]; }
          $o = []; foreach ($days as $sd) $o[] = substr($sd, 8) . " " . date("D", strtotime($sd)) . " " . substr($win[$sd][0], 11, 5) . "→" . substr($win[$sd][1], 11, 5) . " (" . round((strtotime($win[$sd][1]) - strtotime($win[$sd][0])) / 3600, 1) . "h)"; echo "U business days: " . implode(" · ", $o) . "\n";
          try { foreach ($d->query("SELECT * FROM target_rule")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U target_rule " . json_encode($r) . "\n"; foreach ($d->query("SELECT * FROM target_rules ORDER BY sort_order, rule_id")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U rule " . json_encode($r) . "\n"; } catch (Throwable $e) { echo "U rules n/a " . substr($e->getMessage(), 0, 120) . "\n"; }
          $emps = []; foreach ($d->query("SELECT e.employee_id id, e.full_name nm, e.basic_salary bs, e.joining_date jd, e.designation dg, e.status st FROM employees e LEFT JOIN departments dp ON dp.department_id = e.department_id WHERE dp.department_name LIKE '%sales%' AND (e.status IS NULL OR e.status <> 'ex')")->fetchAll(PDO::FETCH_ASSOC) as $r) $emps[(int)$r["id"]] = $r;
          $addon = []; try { foreach ($d->query("SELECT LOWER(TRIM(LEADING '#' FROM TRIM(order_name))) k, SUM(price) s FROM employee_addons WHERE addon_date >= '2026-11-15' GROUP BY k")->fetchAll(PDO::FETCH_ASSOC) as $r) $addon[$r["k"]] = (float)$r["s"]; } catch (Throwable $e) { }
          $tot = []; $raw0 = []; $team = []; $cnt = [];
          foreach ($days as $sd) { [$from, $to] = $win[$sd];
            $q = $d->prepare("SELECT o.order_name nm, o.total total, a.employee_id emp FROM shop_orders o JOIN order_allocations a ON a.source COLLATE utf8mb4_unicode_ci = o.store_key COLLATE utf8mb4_unicode_ci AND a.order_id COLLATE utf8mb4_unicode_ci = CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci WHERE o.created_at >= ? AND o.created_at < ? AND o.total > 0 AND (o.tags IS NULL OR o.tags NOT LIKE '%cancel%') AND a.employee_id > 0"); $q->execute([$from, $to]);
            foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) { $k = strtolower(trim(ltrim(trim($r["nm"]), "#"))); $e = (int)$r["emp"]; $raw0[$e][$sd] = ($raw0[$e][$sd] ?? 0) + (float)$r["total"]; $tot[$e][$sd] = ($tot[$e][$sd] ?? 0) + (float)$r["total"] + ($addon[$k] ?? 0); $cnt[$e][$sd] = ($cnt[$e][$sd] ?? 0) + 1; }
            try { $m = $d->prepare("SELECT employee_id emp, total FROM manual_orders WHERE order_date >= ? AND order_date < ? AND employee_id > 0"); $m->execute([$from, $to]); foreach ($m->fetchAll(PDO::FETCH_ASSOC) as $r) { $e = (int)$r["emp"]; $tot[$e][$sd] = ($tot[$e][$sd] ?? 0) + (float)$r["total"]; $raw0[$e][$sd] = ($raw0[$e][$sd] ?? 0) + (float)$r["total"]; $cnt[$e][$sd] = ($cnt[$e][$sd] ?? 0) + 1; } } catch (Throwable $e) { }
            $team[$sd] = 0; foreach ($emps as $id => $x) $team[$sd] += $tot[$id][$sd] ?? 0; }
          $o = []; foreach ($days as $sd) $o[] = substr($sd, 8) . ": " . round($team[$sd]); echo "U team collection per business day (listed sales people): " . implode(" · ", $o) . "\n";
          $cache = []; foreach (["2026-11-22", "2026-11-23", "2026-11-24", "2026-11-25", "2026-11-26"] as $sd) { $c = json_decode((string)$d->query("SELECT setting_value FROM hrms_settings WHERE setting_key = 'ct_tgt_cache_" . $sd . "'")->fetchColumn(), true); $cache[$sd] = is_array($c) ? ($c["v"] ?? []) : []; }
          $o = []; foreach ($cache as $sd => $v) $o[] = substr($sd, 8) . ": " . round(array_sum($v)) . " (" . count(array_filter($v)) . " people, saved " . ($v ? "yes" : "no") . ")"; echo "U team target the system holds per day: " . implode(" · ", $o) . "\n";
          $dt = []; try { foreach ($d->query("SELECT target_date, employee_id, group_key, amount FROM daily_targets WHERE target_date >= '2026-11-20'")->fetchAll(PDO::FETCH_ASSOC) as $r) $dt[(string)$r["target_date"]][(int)$r["employee_id"]][] = [(string)$r["group_key"], (float)$r["amount"]]; } catch (Throwable $e) { echo "U daily_targets n/a\n"; }
          $o = []; foreach ($dt as $sd => $v) { $s = 0; foreach ($v as $rows) foreach ($rows as $x) $s += $x[1]; $o[] = substr($sd, 8) . ": " . count($v) . " people, sum " . round($s); } ksort($o); echo "U targets typed by hand per day: " . implode(" · ", $o) . "\n";
          foreach ($emps as $id => $e) { if (stripos($e["nm"], "irfan") === false) continue;
            echo "U IRFAN id " . $id . " · " . $e["dg"] . " · joined " . $e["jd"] . " · profile daily target " . round((float)$e["bs"]) . "\n";
            $o = []; foreach ($days as $sd) $o[] = substr($sd, 8) . ": " . round($tot[$id][$sd] ?? 0) . " (" . ($cnt[$id][$sd] ?? 0) . " orders, without add-ons " . round($raw0[$id][$sd] ?? 0) . ")"; echo "U IRFAN collection per business day: " . implode(" · ", $o) . "\n";
            $o = []; foreach ($cache as $sd => $v) $o[] = substr($sd, 8) . ": " . (isset($v[$id]) ? round($v[$id]) : "-"); echo "U IRFAN target the system holds: " . implode(" · ", $o) . "\n";
            $o = []; foreach ($dt as $sd => $v) if (isset($v[$id])) $o[] = substr($sd, 8) . ": " . json_encode($v[$id]); echo "U IRFAN typed by hand: " . ($o ? implode(" · ", $o) : "none") . "\n";
            foreach (["2026-11-24", "2026-11-25", "2026-11-26", "2026-11-27"] as $td) { $h = []; $x = $td; while (count($h) < 3) { $x = date("Y-m-d", strtotime($x . " -1 day")); $h[] = $x; } $vals = []; foreach ($h as $hd) $vals[] = $raw0[$id][$hd] ?? 0; $c = array_values(array_filter($vals)); $avg = $c ? array_sum($c) / count($c) : 0; $valsA = []; foreach ($h as $hd) $valsA[] = $tot[$id][$hd] ?? 0; $cA = array_values(array_filter($valsA)); $avgA = $cA ? array_sum($cA) / count($cA) : 0;
              echo "U IRFAN rule for " . substr($td, 8) . ": days " . implode(",", array_map(function ($z) { return substr($z, 8); }, $h)) . " = " . implode(" + ", array_map("round", $vals)) . " → avg " . round($avg) . " +10% = " . round($avg * 1.1) . " (with add-ons " . round($avgA * 1.1) . ")\n"; }
            try { $q = $d->prepare("SELECT setting_key, setting_value FROM hrms_settings WHERE setting_key IN ('ct_wm_2026-11-24','ct_wm_2026-11-25','ct_wm_2026-11-26')"); $q->execute(); foreach ($q->fetchAll(PDO::FETCH_NUM) as $r) { $x = json_decode((string)$r[1], true); echo "U IRFAN working switch " . substr($r[0], 6) . ": " . json_encode($x[$id] ?? null) . "\n"; } } catch (Throwable $e) { }
          }
          $low = 0; $n = 0; $sumNow = 0; $sumFull = 0; foreach ($emps as $id => $e) { $now = (float)($cache["2026-11-26"][$id] ?? 0); if ($now <= 0) continue; $vals = []; foreach (["2026-11-23", "2026-11-24", "2026-11-25"] as $hd) $vals[] = $raw0[$id][$hd] ?? 0; $c = array_values(array_filter($vals)); if (!$c) continue; $r = round(array_sum($c) / count($c) * 1.1); $n++; $sumNow += $now; $sumFull += $r; if ($now < $r * 0.97) $low++; }
          echo "U team today: people with a target " . $n . " · target held now " . round($sumNow) . " · avg of 23,24,25 +10% (my recount) " . round($sumFull) . " · people whose held target is more than 3% below the recount " . $low . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

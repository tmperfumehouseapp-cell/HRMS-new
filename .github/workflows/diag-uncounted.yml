# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          $t0 = strtotime(date("Y-m-d", time() - 10 * 3600) . " 10:00:00");
          $adt = function ($t) { $t = mb_strtolower(trim((string)$t)); if ($t === "" || mb_strlen($t) > 300) return false; return (bool)(preg_match("/more info(rmation)? (on|about) this|interested in this|saw (your|this) ad|\\btmph\\b|tm\\s*perfume\\s*house|\\bwant to (buy|order)\\b|placing my first order|free\\s*10\\s*ml|extra discount|\\bi\\s*want\\b.*\\bml\\b/u", $t) || preg_match("/\\d+\\s*ml\\b.*\\b(in|at|for|@|rs\\.?|₹)\\s*\\d{3,5}\\b/u", $t) || preg_match("/^\\s*hey\\s+tm\\s*perfume/iu", $t)); };
          $pi = $d->prepare("SELECT MAX(ts) FROM wa_messages WHERE phone = ? AND dir = 'in' AND ts < ?");
          $ww = $d->prepare("SELECT who, ts FROM wa_messages WHERE phone = ? AND dir = 'out' AND emp_id = 0 AND who IN ('campaign', 'followup', 'recover') AND mtype = 'template' AND status <> 'failed' AND ts <= ? ORDER BY id DESC LIMIT 1");
          $fi = $d->prepare("SELECT reply_to, LEFT(body, 320) b, mtype FROM wa_messages WHERE phone = ? AND dir = 'in' AND ts >= ? ORDER BY id LIMIT 1");
          $gap = function ($s) { return $s <= 3600 ? "a<=1h" : ($s <= 86400 ? "b<=24h" : ($s <= 3 * 86400 ? "c<=3d" : ($s <= 7 * 86400 ? "d<=7d" : ($s <= 30 * 86400 ? "e<=30d" : "f>30d")))); };
          for ($back = 0; $back <= 6; $back++) { $a0 = date("Y-m-d H:i:s", $t0 - $back * 86400); $a1 = date("Y-m-d H:i:s", $t0 - ($back - 1) * 86400);
            $q = $d->prepare("SELECT q.id, q.phone, q.opened_at, q.emp_id, COALESCE(t.type, 'unclear') type, COALESCE(s.orders, 0) orders FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id LEFT JOIN wq_qstat s ON s.query_id = q.id WHERE q.opened_at >= ? AND q.opened_at < ? AND COALESCE(t.type, 'unclear') NOT IN ('campaign', 'community')"); $q->execute([$a0, $a1]);
            $n = 0; $o = 0; $mv = 0; $mo = 0; $keep = 0; $link = 0; $linkNoOut = 0; $who = []; $age = []; $emp = []; $empAll = []; $wrote = 0; $typ = [];
            foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) { $n++; $ord = (int)$r["orders"] > 0 ? 1 : 0; $o += $ord; $T = strtotime($r["opened_at"]); $cut = date("Y-m-d H:i:s", $T - 120); $e = (int)$r["emp_id"]; if ($e) $empAll[$e] = ($empAll[$e] ?? 0) + 1;
              $fi->execute([$r["phone"], $cut]); $f = $fi->fetch(PDO::FETCH_ASSOC) ?: []; $isLink = $adt($f["b"] ?? "") && trim((string)($f["reply_to"] ?? "")) === ""; if ($isLink) $link++;
              $pi->execute([$r["phone"], $cut]); if ((string)$pi->fetchColumn() !== "") { $wrote++; continue; }
              $ww->execute([$r["phone"], $r["opened_at"]]); $w = $ww->fetch(PDO::FETCH_ASSOC); if (!$w) { if ($isLink) $linkNoOut++; continue; }
              if ($isLink) { $keep++; continue; }
              $mv++; $mo += $ord; $who[$w["who"]] = ($who[$w["who"]] ?? 0) + 1; $g = $gap($T - strtotime($w["ts"])); $age[$g] = ($age[$g] ?? 0) + 1; if ($e) $emp[$e] = ($emp[$e] ?? 0) + 1; $typ[$r["type"]] = ($typ[$r["type"]] ?? 0) + 1; }
            ksort($age); arsort($emp); $mx = $emp ? max($emp) : 0; $share = []; foreach (array_slice($emp, 0, 5, true) as $e => $x) $share[] = $x . "/" . ($empAll[$e] ?? 0);
            echo "U day " . substr($a0, 0, 10) . " · counted fresh " . $n . " (orders " . $o . ") · would become campaign " . $mv . " (orders " . $mo . ") · stays fresh " . ($n - $mv) . " (orders " . ($o - $mo) . ") · by message " . json_encode($who) . " · age " . json_encode($age) . " · present type " . json_encode($typ) . " · link text kept fresh though we wrote first " . $keep . " · link text in all " . $link . " (no message of ours before " . $linkNoOut . ") · had written before " . $wrote . " · people touched " . count($emp) . " of " . count($empAll) . " · top " . implode(" ", $share) . "\n"; }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

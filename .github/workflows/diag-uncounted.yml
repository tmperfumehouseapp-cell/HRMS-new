# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n"; $NO = "TM11355";
          $nm = []; foreach ($d->query("SELECT employee_id, full_name FROM employees")->fetchAll(PDO::FETCH_NUM) as $r) $nm[(int)$r[0]] = (string)$r[1]; $N = function ($e) use ($nm) { return (int)$e > 0 ? ($nm[(int)$e] ?? "#" . $e) : "nobody"; };
          $m = $d->prepare("SELECT * FROM manual_orders WHERE channel = 'TM Store' AND mp_no = ?"); $m->execute([$NO]); $o = $m->fetch(PDO::FETCH_ASSOC); if (!$o) { echo "U order not found\n"; exit; }
          echo "U order " . $NO . " · row #" . $o["manual_order_id"] . " (" . $o["order_no"] . ") · order time " . $o["order_date"] . " · total " . round((float)$o["total"]) . " · " . $o["payment_status"] . " · now with " . $N($o["employee_id"]) . " · type " . $o["order_type"] . " · given by '" . $o["created_by"] . "'" . (isset($o["created_at"]) ? " · row made " . $o["created_at"] : "") . "\n";
          $k = substr(preg_replace("/\D+/", "", (string)$o["phone"]), -10);
          try { $q = $d->prepare("SELECT * FROM order_allocations WHERE source = 'manual' AND order_id = ?"); $q->execute([(string)$o["manual_order_id"]]); foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U allocation row: " . $N($r["employee_id"]) . " · " . $r["order_type"] . " · by " . $r["allocated_by"] . " · " . $r["allocated_at"] . "\n"; } catch (Throwable $e) { }
          try { $q = $d->prepare("SELECT * FROM tms_auto WHERE number = ?"); $q->execute([$NO]); foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U robot mark: done " . $r["done"] . " · why '" . $r["why"] . "' · " . $r["at"] . "\n"; } catch (Throwable $e) { }
          try { $q = $d->prepare("SELECT emp_id, otype, at, seen FROM tms_ring WHERE number = ?"); $q->execute([$NO]); foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U order bell: rang for " . $N($r["emp_id"]) . " · " . $r["otype"] . " · " . $r["at"] . " · seen " . $r["seen"] . "\n"; } catch (Throwable $e) { }
          try { $q = $d->prepare("SELECT at, actor, detail FROM bd_log WHERE ref = ? ORDER BY id"); $q->execute([$NO]); foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U log " . $r["at"] . " · " . $r["actor"] . " · " . $r["detail"] . "\n"; } catch (Throwable $e) { }
          $c = $d->prepare("SELECT assigned_emp, assigned_at, status, source, last_in_at FROM wa_contacts WHERE phone = ?"); $c->execute([$k]); $cc = $c->fetch(PDO::FETCH_ASSOC); echo "U the customer's chat: " . ($cc ? "now with " . $N($cc["assigned_emp"]) . " since " . $cc["assigned_at"] . " · " . $cc["status"] . " · source '" . $cc["source"] . "' · last wrote " . $cc["last_in_at"] : "no chat on the order's number") . "\n";
          $q = $d->prepare("SELECT from_emp, to_emp, by_emp, how, at FROM wa_assign_log WHERE phone = ? AND at >= '2026-11-20 00:00:00' ORDER BY id"); $q->execute([$k]); foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U chat moved " . $r["at"] . " · " . $N($r["from_emp"]) . " → " . $N($r["to_emp"]) . " · by " . ((int)$r["by_emp"] > 0 ? $N($r["by_emp"]) : "the system") . " · " . $r["how"] . "\n";
          $q = $d->prepare("SELECT ts, body FROM wa_messages WHERE phone = ? AND dir = 'sys' AND ts >= '2026-11-26 00:00:00' ORDER BY id"); $q->execute([$k]); foreach ($q->fetchAll(PDO::FETCH_NUM) as $r) echo "U chat note " . $r[0] . " · " . preg_replace("/\d{10,}/", "#", mb_substr((string)$r[1], 0, 170)) . "\n";
          $q = $d->prepare("SELECT who, emp_id, MIN(ts) a, MAX(ts) b, COUNT(*) n FROM wa_messages WHERE phone = ? AND dir = 'out' AND ts >= '2026-11-26 00:00:00' GROUP BY who, emp_id ORDER BY a"); $q->execute([$k]); foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U our messages: " . $r["who"] . ((int)$r["emp_id"] > 0 ? " (" . $N($r["emp_id"]) . ")" : "") . " · " . $r["n"] . " · " . $r["a"] . " to " . $r["b"] . "\n";
          $q = $d->prepare("SELECT MIN(ts) a, MAX(ts) b, COUNT(*) n FROM wa_messages WHERE phone = ? AND dir = 'in' AND ts >= '2026-11-26 00:00:00'"); $q->execute([$k]); $r = $q->fetch(PDO::FETCH_ASSOC); echo "U customer messages since 26 Nov: " . $r["n"] . " · " . $r["a"] . " to " . $r["b"] . "\n";
          $q = $d->prepare("SELECT q.id, q.opened_at, q.emp_id, q.first_emp, t.type FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id WHERE q.phone = ? ORDER BY q.id DESC LIMIT 3"); $q->execute([$k]); foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) { echo "U query opened " . $r["opened_at"] . " · " . $r["type"] . " · first given to " . $N($r["first_emp"]) . " · now with " . $N($r["emp_id"]) . "\n"; try { $mv = $d->prepare("SELECT from_emp, to_emp, late, at FROM wa_query_moves WHERE query_id = ? ORDER BY id"); $mv->execute([(int)$r["id"]]); foreach ($mv->fetchAll(PDO::FETCH_ASSOC) as $x) echo "U   query moved " . $x["at"] . " · " . $N($x["from_emp"]) . " → " . $N($x["to_emp"]) . ((int)$x["late"] ? " (late)" : "") . "\n"; } catch (Throwable $e) { } }
          try { $q = $d->prepare("SELECT at, emp_id, kind, LEFT(why, 120) w FROM waa_log WHERE phone = ? AND at >= '2026-11-26 00:00:00' ORDER BY id"); $q->execute([$k]); foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U auto-assign " . $r["at"] . " · " . $N($r["emp_id"]) . " · " . $r["kind"] . " · " . $r["w"] . "\n"; } catch (Throwable $e) { echo "U waa_log n/a " . substr($e->getMessage(), 0, 80) . "\n"; }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

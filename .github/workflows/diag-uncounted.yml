# READ-ONLY: who is absent today by the Query / Campaign list's rule. Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          echo "U now " . date("Y-m-d H:i:s") . "\n"; $day = date("Y-m-d", time() - 36000); $t0 = $day . " 10:00:00";
          echo "U deployed code is the one-day version: " . (strpos((string)file_get_contents($argv[1] . "empmanagment/api.php"), "better_at5") !== false ? "yes" : "NO") . "\n";
          $ex = []; foreach ($d->query("SELECT e.employee_id id, e.full_name nm, d.department_name dn, e.designation ds FROM employees e LEFT JOIN departments d ON d.department_id = e.department_id WHERE e.status != 'ex' AND d.department_name LIKE '%sales%'")->fetchAll(PDO::FETCH_ASSOC) as $r) { $n = trim(preg_replace("/\s+/", " ", str_replace(["_", "-"], " ", mb_strtolower($r["dn"])))); $n2 = trim(preg_replace("/\s+/", " ", str_replace(["_", "-"], " ", mb_strtolower((string)$r["ds"])))); if (preg_match("/^sales executives?$/", $n) || (!preg_match("/^sales (head|helper|retailer)s?$/", $n) && preg_match("/^sales executives?$/", $n2))) $ex[(int)$r["id"]] = $r["nm"]; }
          $pin = []; foreach ($d->query("SELECT DISTINCT employee_id FROM attendance WHERE punch_in IS NOT NULL AND (punch_date = '$day' OR punch_in >= '$t0')")->fetchAll(PDO::FETCH_COLUMN) as $e) $pin[(int)$e] = 1;
          $q = []; foreach ($d->query("SELECT emp_id, COUNT(*) n FROM wa_queries WHERE opened_at >= '$t0' AND emp_id > 0 GROUP BY emp_id")->fetchAll(PDO::FETCH_ASSOC) as $r) $q[(int)$r["emp_id"]] = (int)$r["n"];
          $o = []; foreach ($d->query("SELECT a.employee_id e, COUNT(*) n FROM shop_orders o JOIN order_allocations a ON a.source COLLATE utf8mb4_unicode_ci = o.store_key COLLATE utf8mb4_unicode_ci AND a.order_id COLLATE utf8mb4_unicode_ci = CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci WHERE o.created_at >= '$t0' AND a.employee_id > 0 GROUP BY a.employee_id")->fetchAll(PDO::FETCH_ASSOC) as $r) $o[(int)$r["e"]] = (int)$r["n"]; foreach ($d->query("SELECT employee_id e, COUNT(*) n FROM manual_orders WHERE order_date >= '$t0' AND employee_id > 0 GROUP BY employee_id")->fetchAll(PDO::FETCH_ASSOC) as $r) $o[(int)$r["e"]] = ($o[(int)$r["e"]] ?? 0) + (int)$r["n"];
          $ab = []; foreach ($ex as $id => $nm) if (empty($pin[$id]) && empty($q[$id]) && empty($o[$id])) $ab[] = $nm; sort($ab); echo "U sales executives " . count($ex) . " · punched in today " . count(array_intersect_key($pin, $ex)) . " · absent by the new rule (my copy) " . count($ab) . ": " . implode(", ", $ab) . "\n";
          foreach ($ex as $id => $nm) if (stripos($nm, "Danish") !== false) echo "U " . $nm . " · punched in today " . (empty($pin[$id]) ? "no" : "yes") . " · queries today " . (int)($q[$id] ?? 0) . " · orders today " . (int)($o[$id] ?? 0) . "\n";
          $mk = []; foreach ($d->query("SELECT employee_id, mark FROM day_marks WHERE mark_date = '$day'")->fetchAll(PDO::FETCH_ASSOC) as $r) $mk[(int)$r["employee_id"]] = $r["mark"]; $wm = json_decode((string)$d->query("SELECT setting_value FROM hrms_settings WHERE setting_key = 'ct_wm_$day'")->fetchColumn(), true); $hq = []; foreach ($d->query("SELECT emp_id, COUNT(DISTINCT phone) n FROM wa_messages WHERE dir = 'out' AND emp_id > 0 AND ts >= '$t0' GROUP BY emp_id")->fetchAll(PDO::FETCH_ASSOC) as $r) $hq[(int)$r["emp_id"]] = (int)$r["n"];
          foreach ($ex as $id => $nm) if (empty($pin[$id])) echo "U not punched in: " . $nm . " · queries " . (int)($q[$id] ?? 0) . " · orders " . (int)($o[$id] ?? 0) . " · customers he answered today " . (int)($hq[$id] ?? 0) . " · day mark " . ($mk[$id] ?? "-") . " · live switch " . json_encode($wm[$id] ?? $wm[(string)$id] ?? null) . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

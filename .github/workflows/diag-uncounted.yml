# READ-ONLY: what the must-send check sees for ONE order (times and which rule matched, no message text). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'");
          echo "U now " . date("Y-m-d H:i:s") . "\n";
          foreach ($d->query("SELECT setting_key, LEFT(setting_value, 260) v FROM hrms_settings WHERE setting_key IN ('ora_at','ora_cu_at','ora_tick_info','ora_fill_dbg','order_auto_rate','wa_cron_at','tms_auto_at','wag_cxbtn_ts4')")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U set " . $r["setting_key"] . " = " . (preg_match("/^\d{10}$/", $r["v"]) ? date("H:i:s", (int)$r["v"]) : $r["v"]) . "\n";
          foreach ($d->query("SELECT DATE_FORMAT(at, '%H:%i') m, COUNT(*) n, SUM(rating IS NULL) nul, SUM(order_key LIKE 'manual:%') man FROM order_rate_auto WHERE at >= NOW() - INTERVAL 3 HOUR GROUP BY 1 ORDER BY 1 DESC LIMIT 25")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U read at " . $r["m"] . " · " . $r["n"] . " (no chat " . $r["nul"] . ", manual " . $r["man"] . ")\n";
          try { foreach ($d->query("SELECT at, kind, ok, info FROM wa_log WHERE at >= NOW() - INTERVAL 40 MINUTE AND (ok = 0 OR info LIKE '%budget%' OR info LIKE '%late%' OR info LIKE '%slow%') ORDER BY id DESC LIMIT 14")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U log " . substr($r["at"], 11, 8) . " " . $r["kind"] . " " . mb_substr($r["info"], 0, 200) . "\n"; } catch (Throwable $e) { echo "U log err\n"; }
          try { foreach ($d->query("SELECT setting_key, LEFT(setting_value, 400) v FROM hrms_settings WHERE setting_key LIKE 'wa_engine_%' OR setting_key LIKE 'wa_tick_%' OR setting_key LIKE '%step_ms%' LIMIT 8")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U eng " . $r["setting_key"] . " = " . $r["v"] . "\n"; } catch (Throwable $e) { }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

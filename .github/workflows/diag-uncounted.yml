# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          echo "U now " . date("Y-m-d H:i:s") . "\n"; $w5 = function ($x) { $x = (string)$x; return $x === "" ? "(default)" : "…" . substr($x, -5); }; $defW = "";
          $N = []; foreach ($d->query("SELECT * FROM wa_numbers ORDER BY id")->fetchAll(PDO::FETCH_ASSOC) as $n) { $N[(int)$n["id"]] = $n; echo "U number " . $n["id"] . " · " . ($n["label"] ?: $n["display"]) . " · account " . $w5($n["waba_id"]) . " · campaigns " . (isset($n["camp_ok"]) ? ((int)$n["camp_ok"] === 1 ? "on" : "OFF") : "?") . (!empty($n["retired"]) ? " · RETIRED" : "") . (!empty($n["hold"]) ? " · LOCKED (replies only)" : "") . "\n"; }
          $A = json_decode((string)$d->query("SELECT setting_value FROM hrms_settings WHERE setting_key = 'wa_camp_auto'")->fetchColumn(), true); echo "U hourly speed per number (hour " . ($A["hour"] ?? "?") . "): " . json_encode($A["caps"] ?? null) . "\n";
          foreach ($d->query("SELECT number_id, COUNT(DISTINCT phone) u, COUNT(*) n, SUM(status = 'failed') f, SUM(status = 'failed' AND err_code IN (131049, 131026, 130472, 131042, 131031)) fx FROM wa_messages WHERE dir = 'out' AND who = 'campaign' AND mtype = 'template' AND ts >= NOW() - INTERVAL 60 MINUTE GROUP BY number_id")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U last 60 min · number " . $r["number_id"] . " · messages " . $r["n"] . " · failed " . $r["f"] . " (" . ($r["n"] ? round(100 * $r["f"] / $r["n"]) : 0) . "%) · of them Meta frequency / not-on-WhatsApp refusals " . $r["fx"] . " · counted for the fail rule " . ((int)$r["n"] - (int)$r["fx"] ? round(100 * ((int)$r["f"] - (int)$r["fx"]) / max(1, (int)$r["n"] - (int)$r["fx"])) : 0) . "%\n";
          echo "U numbers left out now because most messages fail: " . (string)$d->query("SELECT setting_value FROM hrms_settings WHERE setting_key = 'wa_num_fail'")->fetchColumn() . "\n";
          foreach ($d->query("SELECT err_code, number_id, COUNT(*) n FROM wa_messages WHERE dir = 'out' AND who = 'campaign' AND status = 'failed' AND ts >= NOW() - INTERVAL 60 MINUTE GROUP BY err_code, number_id ORDER BY n DESC LIMIT 8")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U failed last 60 min · code " . $r["err_code"] . " · number " . $r["number_id"] . " · " . $r["n"] . "\n";
          foreach ($d->query("SELECT * FROM wa_campaigns WHERE name LIKE 'contacts\\_part\\_5\\_40001-50000%' ORDER BY id DESC LIMIT 3")->fetchAll(PDO::FETCH_ASSOC) as $c) { $ex = json_decode((string)($c["extra"] ?? ""), true) ?: []; $tid = (int)$c["tpl_id"]; $t = $d->query("SELECT name, category, category_now FROM wa_templates WHERE id = $tid")->fetch(PDO::FETCH_ASSOC) ?: [];
            echo "U CAMPAIGN " . $c["id"] . " · " . $c["name"] . " · status " . $c["status"] . " · message [" . ($t["name"] ?? "?") . "] " . ($t["category"] ?? "") . (($t["category_now"] ?? "") !== "" ? " (now " . $t["category_now"] . ")" : "") . " · send from " . json_encode($ex["numbers"] ?? []) . " · kind " . ($ex["kind"] ?? "-") . " · mix " . json_encode($ex["mix"] ?? null) . " · utility share " . json_encode($ex["u_pct"] ?? null) . " · fast " . json_encode($ex["fast"] ?? ($c["fast"] ?? null)) . "\n";
            $ok = []; foreach ($d->query("SELECT waba_id, status, LEFT(reason, 80) r FROM wa_tpl_waba WHERE tpl_id = $tid")->fetchAll(PDO::FETCH_ASSOC) as $w) { echo "U    message on account " . $w5($w["waba_id"]) . " · " . $w["status"] . ($w["r"] !== "" ? " · " . $w["r"] : "") . "\n"; if (strtoupper($w["status"]) === "APPROVED") $ok[(string)$w["waba_id"]] = 1; }
            $use = []; foreach ($N as $nid => $n) if (isset($ok[(string)$n["waba_id"]])) $use[] = $nid . " " . ($n["label"] ?: $n["display"]); echo "U    numbers whose account has this message approved: " . ($use ? implode(" · ", $use) : "NONE") . "\n";
            foreach ($d->query("SELECT status, COUNT(*) n FROM wa_camp_items WHERE camp_id = " . (int)$c["id"] . " GROUP BY status")->fetchAll(PDO::FETCH_ASSOC) as $s) echo "U    people " . $s["status"] . " · " . $s["n"] . "\n"; }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

# READ-ONLY: why some chats of a salesperson show on the laptop but not in the phone app (counts only, no names or numbers). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'");
          $emp = (int)$d->query("SELECT employee_id FROM employees WHERE full_name LIKE 'Aditya Yadav%' LIMIT 1")->fetchColumn(); echo "employee id: $emp · now " . date("Y-m-d H:i:s") . "\n";
          $c24 = date("Y-m-d H:i:s", time() - 86400); $c90 = date("Y-m-d H:i:s", time() - 90 * 86400);
          $fa = "(c.assigned_emp > 0 AND c.assigned_at IS NOT NULL AND c.assigned_at >= '$c24' AND NOT EXISTS (SELECT 1 FROM wa_messages hm WHERE hm.phone = c.phone AND hm.dir = 'out' AND hm.who IN ('emp','phone') AND hm.ts >= c.assigned_at))";
          $base = "FROM wa_contacts c WHERE c.assigned_emp = $emp AND c.status = 'open' AND COALESCE(c.last_in_at, c.last_out_at) >= '$c90'";
          echo "LAPTOP (open, held by him, last 90 days): " . $d->query("SELECT COUNT(*) $base")->fetchColumn() . "\n";
          echo "PHONE Chats tab (customer wrote in the last 24 h, or given to him and nobody answered yet): " . $d->query("SELECT COUNT(*) $base AND ((c.last_in_at IS NOT NULL AND c.last_in_at >= '$c24') OR $fa)")->fetchColumn() . "\n";
          echo "PHONE History tab (customer's last message older than 24 h): " . $d->query("SELECT COUNT(*) $base AND c.last_in_at IS NOT NULL AND c.last_in_at < '$c24' AND NOT $fa")->fetchColumn() . "\n";
          echo "IN NEITHER (the customer never wrote: last_in_at empty, not 'new for him'): " . $d->query("SELECT COUNT(*) $base AND c.last_in_at IS NULL AND NOT $fa")->fetchColumn() . "\n";
          echo "  ...of those, by source: "; foreach ($d->query("SELECT c.source s, COUNT(*) n $base AND c.last_in_at IS NULL AND NOT $fa GROUP BY c.source") as $r) echo "[" . $r["s"] . "]=" . $r["n"] . " "; echo "\n";
          echo "  ...of those, newest assigned_at / last_out_at: " . $d->query("SELECT CONCAT(IFNULL(MAX(c.assigned_at),'-'), ' / ', IFNULL(MAX(c.last_out_at),'-')) $base AND c.last_in_at IS NULL AND NOT $fa")->fetchColumn() . "\n";
          echo "open chats held by him whose last_in_at is within 24 h but are on a phone 'wide' filter only: n/a\n";
          echo "closed chats held by him with last_in_at within 24 h (laptop 'mine' hides them too): " . $d->query("SELECT COUNT(*) FROM wa_contacts c WHERE c.assigned_emp = $emp AND c.status = 'closed' AND c.last_in_at >= '$c24'")->fetchColumn() . "\n";
          echo "hist: open + older-than-24h split by age: "; foreach ($d->query("SELECT CASE WHEN c.last_in_at >= DATE_SUB(NOW(), INTERVAL 48 HOUR) THEN '24-48h' WHEN c.last_in_at >= DATE_SUB(NOW(), INTERVAL 7 DAY) THEN '2-7d' ELSE '7d+' END b, COUNT(*) n $base AND c.last_in_at IS NOT NULL AND c.last_in_at < '$c24' AND NOT $fa GROUP BY b") as $r) echo $r["b"] . "=" . $r["n"] . " "; echo "\n";
          PHP
          php /tmp/ql_check.php "$P"; rm -f /tmp/ql_check.php
          REMOTE

# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          $k10 = function ($p) { $x = preg_replace("/\D+/", "", (string)$p); return strlen($x) >= 10 ? substr($x, -10) : ""; };
          $nm = []; foreach ($d->query("SELECT employee_id, full_name FROM employees")->fetchAll(PDO::FETCH_NUM) as $r) $nm[(int)$r[0]] = explode(" ", trim((string)$r[1]))[0];
          try { foreach ($d->query("SELECT store_key, COUNT(*) n, SUM(refreshed_at < '2026-11-26 18:12:00') old, MIN(refreshed_at) a, MAX(refreshed_at) b FROM order_facts WHERE created_at >= '2026-11-23 10:00:00' GROUP BY store_key")->fetchAll(PDO::FETCH_NUM) as $r) echo "U facts copy: " . $r[0] . " · rows " . $r[1] . " · last refreshed before the correction " . $r[2] . " · refreshed " . substr((string)$r[3], 5, 11) . " to " . substr((string)$r[4], 5, 11) . "\n"; } catch (Throwable $e) { echo "U facts n/a " . substr($e->getMessage(), 0, 120) . "\n"; }
          $F = []; foreach ($d->query("SELECT store_key, shopify_id, order_name, order_type, emp_id, refreshed_at FROM order_facts WHERE created_at >= '2026-11-23 00:00:00' AND refreshed_at < '2026-11-26 18:12:00'")->fetchAll(PDO::FETCH_ASSOC) as $r) $F[$r["store_key"] . "|" . $r["shopify_id"]] = $r;
          $qq = $d->prepare("SELECT type, reason, opened_at FROM wq_qtype WHERE phone = ? AND opened_at <= ? AND opened_at >= ? ORDER BY opened_at DESC LIMIT 1");
          $O = [];
          foreach ($d->query("SELECT manual_order_id id, mp_no nm, phone, order_date at, total, employee_id emp, order_type ty, created_by cb FROM manual_orders WHERE channel = 'TM Store' AND employee_id > 0 AND order_date >= '2026-11-23 10:00:00'")->fetchAll(PDO::FETCH_ASSOC) as $r) $O[] = $r + ["k" => "manual|" . $r["id"], "src" => "website"];
          foreach ($d->query("SELECT o.shopify_id id, o.store_key sk, o.order_name nm, o.phone, o.created_at at, o.total, a.employee_id emp, a.order_type ty, a.allocated_by cb FROM order_allocations a JOIN shop_orders o ON o.store_key = a.source AND CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci = a.order_id WHERE a.employee_id > 0 AND o.created_at >= '2026-11-23 10:00:00'")->fetchAll(PDO::FETCH_ASSOC) as $r) $O[] = $r + ["k" => $r["sk"] . "|" . $r["id"], "src" => "shopify"];
          $cov = 0; $n = 0; $G = []; $lines = [];
          foreach ($O as $o) { $f = $F[$o["k"]] ?? null; if (!$f) continue; $cov++; $was = (string)$f["order_type"]; $now = (string)$o["ty"]; if ($was === $now || $was === "" || $now === "") continue; $n++;
            $k = $k10($o["phone"]); $T = strtotime($o["at"]); $qq->execute([$k, date("Y-m-d H:i:s", $T + 60), date("Y-m-d H:i:s", $T - 7 * 86400)]); $q = $qq->fetch(PDO::FETCH_ASSOC); $dd = substr(date("Y-m-d", $T - 36000), 8); $robot = stripos((string)$o["cb"], "auto") !== false ? "robot" : "person";
            $g = $dd . " · " . $o["src"] . " · " . $was . " → " . $now . " · given by " . $robot; $G[$g] = ($G[$g] ?? 0) + 1;
            $lines[] = $o["at"] . "|U FC " . $dd . " · " . ltrim((string)$o["nm"], "#") . " · " . substr($o["at"], 11, 5) . " · " . round((float)$o["total"]) . " · " . ($nm[(int)$o["emp"]] ?? "#" . $o["emp"]) . " · " . $was . "→" . $now . " · " . $robot . " · copy of " . substr((string)$f["refreshed_at"], 5, 11) . " · query " . ($q ? $q["type"] . " opened " . substr($q["opened_at"], 5, 11) . " [" . preg_replace("/\d{5,}/", "#", mb_substr((string)$q["reason"], 0, 58)) . "]" : "none in 7 days"); }
          echo "U orders with a salesperson since 23 Nov: " . count($O) . " · with a copy from before the correction: " . $cov . " · type differs now: " . $n . "\n"; ksort($G); foreach ($G as $k => $c) echo "U grp " . $c . " · " . $k . "\n"; sort($lines); foreach ($lines as $l) echo substr($l, strpos($l, "|") + 1) . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

# READ-ONLY: the strict complaint rule and the code message of the must-send check (counts only). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          echo "U now " . date("Y-m-d H:i:s") . "\n"; $day = date("Y-m-d", time() - 36000); $t0 = $day . " 10:00:00"; $src = (string)file_get_contents($argv[1] . "empmanagment/api.php");
          $a = strpos($src, "function must3_code_msg("); $b = $a === false ? false : strpos($src, "\n}\n", $a); $fn = ($a === false || $b === false) ? "" : substr($src, $a, $b - $a + 3); if ($fn === "") { echo "U rule not found\n"; exit; } eval($fn); echo "U deployed code reads older code messages too: " . (strpos($src, "63 * 86400") !== false ? "yes" : "NO") . "\n";
          $rows = $d->query("SELECT phone, mp_no, order_no, order_date t FROM manual_orders WHERE order_date >= '$t0' AND employee_id > 0 AND total > 0 AND phone <> ''")->fetchAll(PDO::FETCH_ASSOC);
          $q = $d->prepare("SELECT body, ts FROM wa_messages WHERE phone IN (?, ?) AND dir = 'out' AND ts >= ? AND (body LIKE '%chat.whatsapp.com/%' OR body LIKE '%erification%' OR body LIKE '%onfirmation code%' OR body LIKE '%roadcast%') ORDER BY id DESC LIMIT 60"); $tot = 0; $n3 = 0; $n63 = 0; $one = "";
          foreach ($rows as $r) { $k = substr(preg_replace("/\D+/", "", (string)$r["phone"]), -10); if (strlen($k) !== 10) continue; $tot++; $t = strtotime($r["t"]); $q->execute([$k, "91" . $k, date("Y-m-d H:i:s", $t - 63 * 86400)]); $h3 = false; $h63 = false; $when = ""; foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $m) { if (!must3_code_msg((string)$m["body"])) continue; $h63 = true; if ($when === "") $when = substr($m["ts"], 0, 16); if (strtotime($m["ts"]) >= $t - 3 * 86400) $h3 = true; } if ($h3) $n3++; if ($h63) $n63++; if ((string)$r["mp_no"] === "WM-00271" || (string)$r["order_no"] === "WM-00271" || (string)$r["order_no"] === "00271") $one = $h63 ? "sent ✓ (latest " . $when . ")" : "NOT found"; }
          echo "U HRMS / website orders since 10 AM with a mobile number: " . $tot . " · code message in the 3 days: " . $n3 . " · counting the 60 days before too: " . $n63 . " (" . ($tot ? round(100 * $n63 / $tot) : 0) . "%) · order WM-00271: " . ($one ?: "not in the list") . "\n";
          $o = $d->query("SELECT store_key, phone, created_at FROM shop_orders WHERE order_name LIKE '%WM-00271' ORDER BY created_at DESC LIMIT 1")->fetch(PDO::FETCH_ASSOC); if (!$o) { $o = $d->query("SELECT 'manual' store_key, phone, order_date created_at FROM manual_orders WHERE order_no LIKE '%WM-00271' OR mp_no LIKE '%WM-00271' ORDER BY order_date DESC LIMIT 1")->fetch(PDO::FETCH_ASSOC); }
          if (!$o) echo "U WM-00271: not found in the orders tables\n"; else { $k = substr(preg_replace("/\D+/", "", (string)$o["phone"]), -10); $t = strtotime($o["created_at"]); $q->execute([$k, "91" . $k, date("Y-m-d H:i:s", $t - 63 * 86400)]); $w3 = ""; $w63 = ""; foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $m) { if (!must3_code_msg((string)$m["body"])) continue; if ($w63 === "") $w63 = substr($m["ts"], 0, 16); if ($w3 === "" && strtotime($m["ts"]) >= $t - 3 * 86400) $w3 = substr($m["ts"], 0, 16); } echo "U WM-00271: store " . $o["store_key"] . " · ordered " . substr($o["created_at"], 0, 16) . " · code message in the 3 days before: " . ($w3 ?: "none") . " · in the 60 days before: " . ($w63 ?: "none") . " → " . ($w63 ? "sent ✓" : "NOT found") . "\n"; }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

# READ-ONLY: personal tags, the number on the tag against the chats that can be listed. Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Uncounted orders
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          cat > /tmp/un_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata");
          echo "U now " . date("Y-m-d H:i:s") . "\n";
          foreach ($d->query("SELECT t.id, t.name, t.emp_id, e.full_name nm, (SELECT COUNT(*) FROM wa_utag_map m WHERE m.tag_id = t.id) n FROM wa_utags t LEFT JOIN employees e ON e.employee_id = t.emp_id HAVING n > 0 ORDER BY n DESC LIMIT 12")->fetchAll(PDO::FETCH_ASSOC) as $t) { $ph = $d->query("SELECT phone FROM wa_utag_map WHERE tag_id = " . (int)$t["id"])->fetchAll(PDO::FETCH_COLUMN); $in = implode(",", array_map(function ($x) use ($d) { return $d->quote((string)$x); }, $ph)); $emp = (int)$t["emp_id"];
            $tot = (int)$d->query("SELECT COUNT(*) FROM wa_contacts c WHERE c.phone IN ($in)")->fetchColumn(); $now = (int)$d->query("SELECT COUNT(*) FROM wa_contacts c WHERE c.phone IN ($in) AND c.status = 'open' AND c.assigned_emp = $emp AND c.last_in_at >= NOW() - INTERVAL 24 HOUR")->fetchColumn(); $cl = (int)$d->query("SELECT COUNT(*) FROM wa_contacts c WHERE c.phone IN ($in) AND c.status = 'closed'")->fetchColumn(); $oth = (int)$d->query("SELECT COUNT(*) FROM wa_contacts c WHERE c.phone IN ($in) AND c.assigned_emp <> $emp")->fetchColumn();
            echo "U tag " . $t["name"] . " · " . mb_substr((string)$t["nm"], 0, 16) . " · number on the tag " . $t["n"] . " · listed after the fix " . $tot . " · were in My chats now " . $now . " · closed " . $cl . " · with someone else / nobody " . $oth . "\n"; }
          PHP
          php /tmp/un_check.php "$P"; rm -f /tmp/un_check.php
          REMOTE

# READ-ONLY: the strict complaint rule and the code message of the must-send check (counts only). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          echo "U now " . date("Y-m-d H:i:s") . "\n"; $day = date("Y-m-d", time() - 36000); $t0 = $day . " 10:00:00"; $src = (string)file_get_contents($argv[1] . "empmanagment/api.php");
          $a = strpos($src, "function must3_code_msg("); $b = $a === false ? false : strpos($src, "\n}\n", $a); $fn = ($a === false || $b === false) ? "" : substr($src, $a, $b - $a + 3); if ($fn === "" || strpos($fn, "confirmation") === false) { echo "U the new code-message rule is NOT in the deployed code yet\n"; exit; } eval($fn); echo "U deployed code has the new code-message rule: yes\n";
          $rows = []; foreach ($d->query("SELECT phone, mp_no, order_no, order_date t FROM manual_orders WHERE order_date >= '$t0' AND employee_id > 0 AND total > 0 AND phone <> ''")->fetchAll(PDO::FETCH_ASSOC) as $r) $rows[] = $r;
          $q = $d->prepare("SELECT body FROM wa_messages WHERE phone IN (?, ?) AND dir = 'out' AND ts >= ? ORDER BY id ASC LIMIT 700"); $tot = 0; $hit = 0; $old = 0; $one = "";
          foreach ($rows as $r) { $k = substr(preg_replace("/\D+/", "", (string)$r["phone"]), -10); if (strlen($k) !== 10) continue; $tot++; $q->execute([$k, "91" . $k, date("Y-m-d H:i:s", strtotime($r["t"]) - 3 * 86400)]); $h = false; $o = false; foreach ($q->fetchAll(PDO::FETCH_COLUMN) as $b) { $b = (string)$b; if (must3_code_msg($b)) $h = true; if (stripos($b, "chat.whatsapp.com/") !== false) $o = true; } if ($h) $hit++; if ($o) $old++; if ((string)$r["mp_no"] === "TM10544") $one = $h ? "sent ✓" : "NOT found"; }
          echo "U HRMS / website orders since 10 AM with a mobile number: " . $tot . " · code message by the NEW rule: " . $hit . " (" . ($tot ? round(100 * $hit / $tot) : 0) . "%) · by the old rule (link only): " . $old . " · order TM10544: " . ($one ?: "not in the list") . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          $t0 = strtotime(date("Y-m-d", time() - 10 * 3600) . " 10:00:00"); $arg = [date("Y-m-d H:i:s", $t0), date("Y-m-d H:i:s", $t0 + 86400)]; echo "U day window " . $arg[0] . " to " . $arg[1] . "\n";
          $base = "q.opened_at >= ? AND q.opened_at < ? AND COALESCE(t.type, 'unclear') NOT IN ('campaign', 'community')";
          $q = $d->prepare("SELECT HOUR(q.opened_at) h, q.emp_id, COUNT(*) n FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id WHERE $base GROUP BY HOUR(q.opened_at), q.emp_id"); $q->execute($arg); $chip = []; $hn = [];
          foreach ($q->fetchAll(PDO::FETCH_NUM) as $r) { $hn[(int)$r[0]] = ($hn[(int)$r[0]] ?? 0) + (int)$r[2]; if ((int)$r[1] > 0) $chip[] = [(int)$r[0], (int)$r[1], (int)$r[2]]; }
          ksort($hn); echo "U queries per hour (chips): " . json_encode($hn) . " · day " . array_sum($hn) . "\n";
          usort($chip, function ($x, $y) { return $y[2] <=> $x[2]; }); $bad = 0; $tested = 0;
          $run = function ($w) use ($d, $arg) { $m0 = microtime(true);
            $q = $d->prepare("SELECT q.id, q.phone, q.opened_at, q.emp_id, COALESCE(t.type, 'unclear') type, s.first_person_at fpa, COALESCE(s.orders, 0) orders, COALESCE(s.revenue, 0) rev FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id LEFT JOIN wq_qstat s ON s.query_id = q.id WHERE $w ORDER BY q.opened_at, q.id LIMIT 601"); $q->execute($arg); $raw = $q->fetchAll(PDO::FETCH_ASSOC);
            $phs = []; foreach ($raw as $r) $phs[(string)$r["phone"]] = 1; $phs = array_map("strval", array_keys($phs)); $info = []; $outs = []; $from = $raw ? (string)$raw[0]["opened_at"] : "";
            foreach (array_chunk($phs, 400) as $ch) { $in = implode(",", array_fill(0, count($ch), "?"));
              $c = $d->prepare("SELECT phone, name, assigned_emp, last_in_at, last_out_at, status FROM wa_contacts WHERE phone IN ($in)"); $c->execute($ch); foreach ($c->fetchAll(PDO::FETCH_ASSOC) as $r) $info[(string)$r["phone"]] = $r;
              $m = $d->prepare("SELECT phone, ts FROM wa_messages WHERE dir = 'out' AND (emp_id > 0 OR who IN ('emp', 'person', 'phone')) AND ts >= ? AND phone IN ($in) ORDER BY ts LIMIT 40000"); $m->execute(array_merge([$from], $ch)); foreach ($m->fetchAll(PDO::FETCH_NUM) as $r) $outs[(string)$r[0]][] = (string)$r[1]; }
            $ans = 0; $wait = 0; $ord = 0; $named = 0; $stat = 0;
            foreach ($raw as $r) { $ph = (string)$r["phone"]; $c = $info[$ph] ?? []; $op = (string)$r["opened_at"]; $fp = (string)($r["fpa"] ?? ""); if ($fp !== "") $stat++; if ($fp === "") foreach (($outs[$ph] ?? []) as $ts) if ($ts >= $op) { $fp = $ts; break; }
              if ($fp !== "") $ans++; $li = (string)($c["last_in_at"] ?? ""); $lo = (string)($c["last_out_at"] ?? ""); if ($li !== "" && ($lo === "" || $lo < $li)) $wait++; if ((int)$r["orders"] > 0) $ord++; if ((string)($c["name"] ?? "") !== "") $named++; }
            return [count($raw), count($info), $named, $ans, $stat, $wait, $ord, round(microtime(true) - $m0, 2)]; };
          foreach (array_slice($chip, 0, 8) as $i => $c) { $r = $run($base . " AND q.emp_id = " . $c[1] . " AND HOUR(q.opened_at) = " . $c[0]); $tested++; if ($r[0] !== $c[2]) $bad++; if ($i < 3) echo "U chip #" . ($i + 1) . " hour " . $c[0] . " shows " . $c[2] . " · list rows " . $r[0] . " · contacts found " . $r[1] . " · with a name " . $r[2] . " · person answered " . $r[3] . " (from stats " . $r[4] . ") · waiting " . $r[5] . " · order " . $r[6] . " · " . $r[7] . " s\n"; }
          echo "U chips tested " . $tested . " · list count differs from the chip in " . $bad . "\n";
          if ($hn) { arsort($hn); $h = (int)array_key_first($hn); $r = $run($base . " AND HOUR(q.opened_at) = " . $h); echo "U whole team, busiest hour " . $h . ": chip total " . $hn[$h] . " · list rows " . $r[0] . " · contacts " . $r[1] . " · person answered " . $r[3] . " · waiting " . $r[5] . " · order " . $r[6] . " · " . $r[7] . " s\n"; }
          if ($chip) { $r = $run($base . " AND q.emp_id = " . $chip[0][1]); echo "U one person, whole day: list rows " . $r[0] . " · person answered " . $r[3] . " · waiting " . $r[5] . " · order " . $r[6] . " · " . $r[7] . " s\n"; }
          $r = $run($base); echo "U whole team, whole day (first 600): list rows " . $r[0] . " · person answered " . $r[3] . " · " . $r[7] . " s\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

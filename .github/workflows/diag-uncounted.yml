# READ-ONLY: per salesperson collection of the business days 21, 23, 24 Nov (same counting as the Sunday sheet). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Uncounted orders
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          cat > /tmp/un_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata");
          $wk = array_fill(0, 7, "10:00"); try { foreach ($d->query("SELECT weekday, start_time FROM day_timing")->fetchAll(PDO::FETCH_ASSOC) as $r) $wk[(int)$r["weekday"]] = (string)$r["start_time"]; } catch (Throwable $e) { }
          echo "weekday starts (0=Sun): " . implode(" ", $wk) . "\n";
          $ov = []; for ($x = strtotime("2026-11-08"); $x <= strtotime("2026-11-15"); $x += 86400) $ov[date("Y-m-d", $x)] = "12:00"; try { $raw = (string)$d->query("SELECT setting_value FROM hrms_settings WHERE setting_key = 'day_timing_overrides'")->fetchColumn(); $j = json_decode($raw, true); if (is_array($j)) { $ov = []; foreach ($j as $k => $v) $ov[(string)$k] = (string)$v; } } catch (Throwable $e) { } $ov["2026-11-21"] = "12:25"; /* the Sunday weekday start was 10:00 until 20 Nov, so 1 Nov really ran 10 AM -> 10 AM */
          $startOf = function ($date) use ($wk, $ov) { return $ov[$date] ?? $wk[(int)date("w", strtotime($date))]; };
          $suns = ["2026-11-21", "2026-11-23", "2026-11-24"];
          $emps = []; try { foreach ($d->query("SELECT e.employee_id id, e.employee_code code, e.full_name nm FROM employees e LEFT JOIN departments dp ON dp.department_id = e.department_id WHERE dp.department_name LIKE '%sales%' AND (e.status IS NULL OR e.status <> 'ex') ORDER BY e.full_name")->fetchAll(PDO::FETCH_ASSOC) as $r) $emps[(int)$r["id"]] = [$r["code"], $r["nm"]]; } catch (Throwable $e) { echo "emps n/a: " . substr($e->getMessage(), 0, 160) . "\n"; }
          echo "sales employees: " . count($emps) . "\n";
          $addon = []; try { foreach ($d->query("SELECT LOWER(TRIM(LEADING '#' FROM TRIM(order_name))) k, SUM(price) s FROM employee_addons WHERE addon_date >= '2026-11-18' GROUP BY k")->fetchAll(PDO::FETCH_ASSOC) as $r) $addon[$r["k"]] = (float)$r["s"]; } catch (Throwable $e) { }
          $tot = []; $teamAll = [];
          foreach ($suns as $si => $sd) {
            $from = $sd . " " . $startOf($sd) . ":00"; $nx = date("Y-m-d", strtotime($sd . " +1 day")); $to = $nx . " " . $startOf($nx) . ":00";
            echo "DAY $sd window: $from -> $to\n";
            $q = $d->prepare("SELECT o.order_name nm, o.total total, a.employee_id emp FROM shop_orders o JOIN order_allocations a ON a.source COLLATE utf8mb4_unicode_ci = o.store_key COLLATE utf8mb4_unicode_ci AND a.order_id COLLATE utf8mb4_unicode_ci = CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci WHERE o.created_at >= ? AND o.created_at < ? AND o.total > 0 AND (o.tags IS NULL OR o.tags NOT LIKE '%cancel%') AND a.employee_id > 0");
            $q->execute([$from, $to]); $teamAll[$si] = 0.0;
            foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) { $k = strtolower(trim(ltrim(trim($r["nm"]), "#"))); $v = (float)$r["total"] + ($addon[$k] ?? 0.0); $tot[(int)$r["emp"]][$si] = ($tot[(int)$r["emp"]][$si] ?? 0.0) + $v; $teamAll[$si] += $v; }
            try { $m = $d->prepare("SELECT employee_id emp, total FROM manual_orders WHERE order_date >= ? AND order_date < ? AND employee_id > 0"); $m->execute([$from, $to]); foreach ($m->fetchAll(PDO::FETCH_ASSOC) as $r) { $tot[(int)$r["emp"]][$si] = ($tot[(int)$r["emp"]][$si] ?? 0.0) + (float)$r["total"]; $teamAll[$si] += (float)$r["total"]; } } catch (Throwable $e) { }
          }
          foreach ($emps as $id => $e) echo "ROW|" . $id . "|" . $e[0] . "|" . $e[1] . "|" . round($tot[$id][0] ?? 0) . "|" . round($tot[$id][1] ?? 0) . "|" . round($tot[$id][2] ?? 0) . "\n";
          $other = 0; foreach ($tot as $id => $x) if (!isset($emps[$id])) { $other++; foreach ([0, 1, 2] as $si) $teamAll[$si] += 0; }
          echo "TEAM_TOTAL|" . round($teamAll[0]) . "|" . round($teamAll[1]) . "|" . round($teamAll[2]) . "\n";
          $listed = [0, 0, 0]; foreach ($emps as $id => $e) foreach ([0, 1, 2] as $si) $listed[$si] += $tot[$id][$si] ?? 0; echo "LISTED_TOTAL|" . round($listed[0]) . "|" . round($listed[1]) . "|" . round($listed[2]) . "\n";
          echo "people with sales on those Sundays who are not in the list (left the company / other department): $other\n";
          PHP
          php /tmp/un_check.php "$P"; rm -f /tmp/un_check.php
          REMOTE

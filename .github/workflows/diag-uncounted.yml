# READ-ONLY: which queries are counted for Shivam Vibhani and Aditya Yadav in the current sales day (the '12 queries today' lock message): time, type, who first had it, transfers. No phone numbers. Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          echo "server now: " . date("Y-m-d H:i:s") . "\n";
          $names = [];
          foreach ($d->query("SELECT employee_id, full_name FROM employees") as $r) $names[(int)$r["employee_id"]] = $r["full_name"];
          $want = []; foreach ($names as $id => $n) if (preg_match("/shivam.*vibhani|aditya.*yadav/i", $n)) $want[$id] = $n;
          echo "people: " . json_encode($want) . "\n";
          $since = date("Y-m-d 00:00:00");
          foreach ($want as $id => $nm) {
            echo "\n=== $nm: queries held now, opened since $since ===\n";
            $q = $d->prepare("SELECT q.id, q.opened_at, q.src, q.again, q.first_emp, COALESCE(t.type,'unclear') ty FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id WHERE q.emp_id = ? AND q.opened_at >= ? ORDER BY q.opened_at");
            $q->execute([$id, $since]); $k = 0; $by = [];
            foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) {
              $k++; $mv = $d->prepare("SELECT from_emp, to_emp, at FROM wa_query_moves WHERE query_id = ? ORDER BY id"); $mv->execute([$r["id"]]); $ms = [];
              foreach ($mv->fetchAll(PDO::FETCH_ASSOC) as $m) $ms[] = ($names[(int)$m["from_emp"]] ?? ("#" . $m["from_emp"])) . " -> " . ($names[(int)$m["to_emp"]] ?? ("#" . $m["to_emp"])) . " at " . $m["at"];
              $by[$r["ty"] . ($r["again"] ? "/again" : "")] = ($by[$r["ty"] . ($r["again"] ? "/again" : "")] ?? 0) + 1;
              echo sprintf("%2d. opened %s · type %s%s · src [%s] · first had: %s%s\n", $k, $r["opened_at"], $r["ty"], $r["again"] ? " (again)" : "", $r["src"], (int)$r["first_emp"] === $id ? "same person" : ($names[(int)$r["first_emp"]] ?? ("#" . $r["first_emp"])), $ms ? " · moves: " . implode("; ", $ms) : "");
            }
            echo "total held since midnight: $k · by type: " . json_encode($by) . "\n";
            $o = $d->prepare("SELECT COUNT(*) FROM wa_queries WHERE first_emp = ? AND emp_id <> ? AND opened_at >= ?"); $o->execute([$id, $id, $since]); echo "queries he had first but now held by somebody else: " . $o->fetchColumn() . "\n";
          }
          echo "\nsnapshot setting: "; $v = $d->query("SELECT setting_value FROM hrms_settings WHERE setting_key = 'wgate_snap'")->fetchColumn(); $j = json_decode((string)$v, true); if ($j) { echo "t=" . date("H:i:s", (int)$j["t"]) . " day=" . $j["day"] . "\n"; foreach ($want as $id => $nm) echo "  $nm: " . json_encode($j["rows"][$id] ?? null) . "  (queries incl. campaign, orders)\n"; } else echo "(none)\n";
          PHP
          php /tmp/ql_check.php "$P"; rm -f /tmp/ql_check.php
          REMOTE

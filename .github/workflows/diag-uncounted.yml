# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          try { foreach ($d->query("SELECT at, kind, info FROM wa_log WHERE info LIKE '%last 4 days:%' ORDER BY id")->fetchAll(PDO::FETCH_NUM) as $r) echo "U log " . substr($r[0], 11, 8) . " [" . $r[1] . "] " . $r[2] . "\n"; } catch (Throwable $e) { echo "U log n/a\n"; }
          foreach (["2026-11-23", "2026-11-24", "2026-11-25", "2026-11-26"] as $sd) { $f = $sd . " 10:00:00"; $t = date("Y-m-d", strtotime($sd . " +1 day")) . " 10:00:00";
            $m = $d->prepare("SELECT order_type, COUNT(*) n FROM manual_orders WHERE order_date >= ? AND order_date < ? AND employee_id > 0 AND total > 0 AND channel = 'TM Store' GROUP BY 1"); $m->execute([$f, $t]); $mo = []; foreach ($m->fetchAll(PDO::FETCH_NUM) as $r) $mo[$r[0] === "" ? "(none)" : $r[0]] = (int)$r[1];
            $a = $d->prepare("SELECT a.order_type, COUNT(*) n FROM order_allocations a JOIN shop_orders o ON o.store_key = a.source AND CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci = a.order_id WHERE o.created_at >= ? AND o.created_at < ? AND a.employee_id > 0 AND o.total > 0 GROUP BY 1"); $a->execute([$f, $t]); $so = []; foreach ($a->fetchAll(PDO::FETCH_NUM) as $r) $so[$r[0] === "" ? "(none)" : $r[0]] = (int)$r[1];
            echo "U day " . substr($sd, 8) . " now · website orders " . json_encode($mo) . " · Shopify orders " . json_encode($so) . "\n"; }
          $k10 = function ($p) { $x = preg_replace("/\D+/", "", (string)$p); return strlen($x) >= 10 ? substr($x, -10) : ""; };
          $orig = []; $cnt = []; foreach ($d->query("SELECT body, ts FROM wa_messages WHERE dir = 'sys' AND mtype = 'event' AND ts >= '2026-11-23 10:00:00' AND body LIKE '%allocated to%' ORDER BY id")->fetchAll(PDO::FETCH_NUM) as $r) { if (preg_match("/(?:Website order|Order)\s+(\S+)\s+allocated to .* · (Query|Campaign)(?: \((automatic)\))?/u", (string)$r[0], $m)) { $k = strtolower(ltrim($m[1], "#")); $orig[$k][] = strtolower($m[2]) . (isset($m[3]) ? "" : " by hand") . " " . substr($r[1], 5, 11); } }
          $first = []; foreach ($d->query("SELECT phone, MIN(created_at) m FROM shop_orders WHERE total > 0 GROUP BY phone")->fetchAll(PDO::FETCH_NUM) as $r) { $k = $k10($r[0]); if ($k !== "" && (!isset($first[$k]) || $r[1] < $first[$k])) $first[$k] = $r[1]; }
          foreach ($d->query("SELECT phone, MIN(order_date) m FROM manual_orders WHERE total > 0 GROUP BY phone")->fetchAll(PDO::FETCH_NUM) as $r) { $k = $k10($r[0]); if ($k !== "" && (!isset($first[$k]) || $r[1] < $first[$k])) $first[$k] = $r[1]; }
          $O = [];
          foreach ($d->query("SELECT mp_no nm, phone, order_date at, total, order_type ty FROM manual_orders WHERE channel = 'TM Store' AND created_by = 'auto (WhatsApp)' AND employee_id > 0 AND order_date >= '2026-11-23 10:00:00' AND NOT EXISTS (SELECT 1 FROM order_allocations a WHERE a.source = 'manual' AND a.order_id = CAST(manual_orders.manual_order_id AS CHAR) COLLATE utf8mb4_unicode_ci)")->fetchAll(PDO::FETCH_ASSOC) as $r) $O[] = $r + ["src" => "website"];
          foreach ($d->query("SELECT o.order_name nm, o.phone, o.created_at at, o.total, a.order_type ty FROM order_allocations a JOIN shop_orders o ON o.store_key = a.source AND CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci = a.order_id WHERE a.allocated_by = 'auto (WhatsApp)' AND a.employee_id > 0 AND o.created_at >= '2026-11-23 10:00:00'")->fetchAll(PDO::FETCH_ASSOC) as $r) $O[] = $r + ["src" => "shopify"];
          $qq = $d->prepare("SELECT query_id, type, opened_at FROM wq_qtype WHERE phone = ? AND opened_at <= ? AND opened_at >= ? ORDER BY opened_at DESC LIMIT 1"); $tg = $d->prepare("SELECT 1 FROM wa_ctags WHERE phone = ? AND tag = 'campaign' AND src = 'wq' AND at > ? AND at <= ? LIMIT 1");
          $tl = $d->prepare("SELECT type, auto, set_by, at, LEFT(reason, 46) r FROM wq_tlog WHERE query_id = ? ORDER BY id");
          $S = []; $watch = ["tm10880", "tm10537", "tm10753", "wm-00191", "wm-00206", "tm10334"];
          foreach ($O as $o) { $k = $k10($o["phone"]); $T = strtotime($o["at"]); $old = isset($first[$k]) && $first[$k] < date("Y-m-d H:i:s", $T - 120); $qq->execute([$k, date("Y-m-d H:i:s", $T + 60), date("Y-m-d H:i:s", $T - 7 * 86400)]); $q = $qq->fetch(PDO::FETCH_ASSOC);
            $path = $old ? "old buyer" : ($q ? "has a query" : "no query in 7 days"); $E = $old ? "campaign" : "?"; if (!$old && $q) { $E = in_array($q["type"], ["campaign", "community"], true) ? "campaign" : "query"; if ($E === "query") { $tg->execute([$k, $q["opened_at"], date("Y-m-d H:i:s", $T + 60)]); if ($tg->fetchColumn()) $E = "campaign"; } }
            $key = strtolower(ltrim(trim((string)$o["nm"]), "#")); $note = isset($orig[$key]) ? explode(" ", $orig[$key][0])[0] : "no note"; $now = $o["ty"] === "" ? "(none)" : $o["ty"];
            $kk = $o["src"] . " · " . $path . " · first note " . $note . " · now " . $now . " · rule says " . $E; $S[$kk] = ($S[$kk] ?? 0) + 1;
            if (in_array($key, $watch, true)) { $h = []; if ($q) { $tl->execute([(int)$q["query_id"]]); foreach ($tl->fetchAll(PDO::FETCH_ASSOC) as $x) $h[] = $x["type"] . ((int)$x["auto"] ? "" : " (by hand/answer)") . " " . substr((string)$x["at"], 5, 11) . " [" . preg_replace("/\d{5,}/", "#", $x["r"]) . "]"; } echo "U watch " . strtoupper($key) . " · ordered " . substr($o["at"], 5, 11) . " · notes: " . implode(" | ", $orig[$key] ?? []) . " · now " . $now . " · rule says " . $E . " · query type history: " . implode(" → ", $h) . "\n"; } }
          ksort($S); foreach ($S as $k => $c) echo "U sum " . $c . " · " . $k . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

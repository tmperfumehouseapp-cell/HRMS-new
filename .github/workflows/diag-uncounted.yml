# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          echo "U markers: queries " . json_encode($d->query("SELECT v FROM wq_meta WHERE k = 'reach_fix_q'")->fetchColumn()) . " · orders " . json_encode($d->query("SELECT v FROM wq_meta WHERE k = 'reach_fix_o'")->fetchColumn()) . "\n";
          $t0 = microtime(true);
          try { $q = $d->query("SELECT t.type, COUNT(*) n FROM wa_queries q JOIN wq_qtype t ON t.query_id = q.id WHERE q.id > 0 AND q.opened_at >= '2026-11-23 10:00:00' AND t.auto = 1 AND ((t.type = 'new' AND t.reason LIKE 'first message ever%') OR (t.type = 'campaign' AND (t.reason LIKE 'campaign customer: chat window had closed%' OR t.reason LIKE 'campaign: %') AND NOT EXISTS (SELECT 1 FROM wa_messages m WHERE m.phone = q.phone AND m.dir = 'in' AND m.ts < DATE_SUB(q.opened_at, INTERVAL 120 SECOND)))) GROUP BY t.type"); foreach ($q->fetchAll(PDO::FETCH_NUM) as $r) echo "U step 1 rows to look at: " . $r[0] . " " . $r[1] . "\n"; echo "U step 1 query took " . round(microtime(true) - $t0, 2) . " s\n"; } catch (Throwable $e) { echo "U step 1 SQL ERROR " . substr($e->getMessage(), 0, 200) . "\n"; }
          $t0 = microtime(true);
          try { echo "U step 2 Shopify rows: " . $d->query("SELECT COUNT(*) FROM order_allocations a JOIN shop_orders o ON o.store_key = a.source AND CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci = a.order_id WHERE a.allocated_by = 'auto (WhatsApp)' AND a.order_type IN ('query', 'campaign') AND a.employee_id > 0 AND o.created_at >= '2026-11-23 10:00:00'")->fetchColumn() . " · " . round(microtime(true) - $t0, 2) . " s\n"; } catch (Throwable $e) { echo "U step 2a SQL ERROR " . substr($e->getMessage(), 0, 200) . "\n"; }
          $t0 = microtime(true);
          try { echo "U step 2 website rows: " . $d->query("SELECT COUNT(*) FROM manual_orders m WHERE m.channel = 'TM Store' AND m.created_by = 'auto (WhatsApp)' AND m.employee_id > 0 AND m.order_type IN ('query', 'campaign') AND m.order_date >= '2026-11-23 10:00:00' AND NOT EXISTS (SELECT 1 FROM order_allocations a WHERE a.source = 'manual' AND a.order_id = CAST(m.manual_order_id AS CHAR) COLLATE utf8mb4_unicode_ci)")->fetchColumn() . " · " . round(microtime(true) - $t0, 2) . " s\n"; } catch (Throwable $e) { echo "U step 2b SQL ERROR " . substr($e->getMessage(), 0, 200) . "\n"; }
          try { foreach ($d->query("SELECT created_by, COUNT(*) n FROM manual_orders WHERE channel = 'TM Store' AND order_date >= '2026-11-23 10:00:00' AND employee_id > 0 GROUP BY (created_by = 'auto (WhatsApp)')")->fetchAll(PDO::FETCH_NUM) as $r) echo "U website orders by: " . ($r[0] === "auto (WhatsApp)" ? "robot" : "a person / other") . " " . $r[1] . "\n"; echo "U manual allocation rows: " . $d->query("SELECT COUNT(*) FROM order_allocations WHERE source = 'manual'")->fetchColumn() . "\n"; } catch (Throwable $e) { }
          foreach (["2026-11-23", "2026-11-24", "2026-11-25", "2026-11-26"] as $sd) { $f = $sd . " 10:00:00"; $t = date("Y-m-d", strtotime($sd . " +1 day")) . " 10:00:00"; $q = $d->prepare("SELECT COALESCE(t.type, 'unclear') ty, COUNT(*) n FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id WHERE q.opened_at >= ? AND q.opened_at < ? GROUP BY 1"); $q->execute([$f, $t]); $o = []; foreach ($q->fetchAll(PDO::FETCH_NUM) as $r) $o[$r[0]] = (int)$r[1];
            $m = $d->prepare("SELECT order_type, COUNT(*) n FROM manual_orders WHERE order_date >= ? AND order_date < ? AND employee_id > 0 AND total > 0 AND channel = 'TM Store' GROUP BY 1"); $m->execute([$f, $t]); $mo = []; foreach ($m->fetchAll(PDO::FETCH_NUM) as $r) $mo[$r[0] === "" ? "(none)" : $r[0]] = (int)$r[1];
            $a = $d->prepare("SELECT a.order_type, COUNT(*) n FROM order_allocations a JOIN shop_orders o ON o.store_key = a.source AND CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci = a.order_id WHERE o.created_at >= ? AND o.created_at < ? AND a.employee_id > 0 AND o.total > 0 GROUP BY 1"); $a->execute([$f, $t]); $so = []; foreach ($a->fetchAll(PDO::FETCH_NUM) as $r) $so[$r[0] === "" ? "(none)" : $r[0]] = (int)$r[1];
            echo "U day " . substr($sd, 8) . " · queries " . json_encode($o) . " · website orders " . json_encode($mo) . " · Shopify orders " . json_encode($so) . "\n"; }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          $src = (string)@file_get_contents($argv[1] . "empmanagment/wq.php"); $since = date("Y-m-d H:i:s", (int)@filemtime($argv[1] . "empmanagment/wq.php")); echo "U deployed: tag rule " . (strpos($src, "\$unreached") !== false ? "yes" : "NO") . " · link exception removed " . (strpos($src, "function wq_came_by_link") === false ? "yes" : "NO") . " · at " . substr($since, 11) . "\n";
          $q = $d->prepare("SELECT q.src, COALESCE(t.type, '(not typed yet)') type, COUNT(*) n FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id WHERE q.opened_at >= ? GROUP BY 1, 2 ORDER BY n DESC"); $q->execute([$since]); foreach ($q->fetchAll(PDO::FETCH_NUM) as $r) echo "U since the deploy: given as '" . ($r[0] === "" ? "(none)" : $r[0]) . "' · typed " . $r[1] . " · " . $r[2] . "\n";
          $lt = json_decode((string)$d->query("SELECT v FROM wq_meta WHERE k = 'last_tick'")->fetchColumn(), true); echo "U last tick " . ($lt["at"] ?? "?") . " · error " . json_encode($lt["result"]["error"] ?? null) . "\n";
          $k10 = function ($p) { $x = preg_replace("/\D+/", "", (string)$p); return strlen($x) >= 10 ? substr($x, -10) : ""; };
          $Q = []; foreach ($d->query("SELECT q.phone, q.opened_at, COALESCE(t.type, 'unclear') type FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id WHERE q.opened_at >= '2026-11-15 00:00:00' ORDER BY q.opened_at")->fetchAll(PDO::FETCH_NUM) as $r) { $k = $k10($r[0]); if ($k !== "") $Q[$k][] = [$r[1], $r[2]]; }
          $first = []; foreach ($d->query("SELECT phone, MIN(created_at) m FROM shop_orders WHERE total > 0 GROUP BY phone")->fetchAll(PDO::FETCH_NUM) as $r) { $k = $k10($r[0]); if ($k !== "" && (!isset($first[$k]) || $r[1] < $first[$k])) $first[$k] = $r[1]; }
          foreach ($d->query("SELECT phone, MIN(order_date) m FROM manual_orders WHERE total > 0 GROUP BY phone")->fetchAll(PDO::FETCH_NUM) as $r) { $k = $k10($r[0]); if ($k !== "" && (!isset($first[$k]) || $r[1] < $first[$k])) $first[$k] = $r[1]; }
          $al = []; foreach ($d->query("SELECT source, order_id, order_type, employee_id, allocated_by, is_direct FROM order_allocations")->fetchAll(PDO::FETCH_ASSOC) as $r) $al[$r["source"] . "|" . $r["order_id"]] = $r;
          $O = [];
          foreach ($d->query("SELECT manual_order_id id, phone, order_date at, total, employee_id emp, order_type ty, created_by cb FROM manual_orders WHERE order_date >= '2026-11-23 10:00:00' AND total > 0 AND employee_id > 0 AND channel = 'TM Store'")->fetchAll(PDO::FETCH_ASSOC) as $r) { $a = $al["manual|" . $r["id"]] ?? null; if ($a && (int)$a["is_direct"]) continue; $ty = $a && (string)$a["order_type"] !== "" ? (string)$a["order_type"] : (string)$r["ty"]; $by = $a ? (string)$a["allocated_by"] : (string)$r["cb"]; $O[] = ["website", $k10($r["phone"]), $r["at"], $ty, stripos($by, "auto") !== false ? "robot" : "person", (float)$r["total"]]; }
          foreach ($d->query("SELECT shopify_id id, store_key sk, phone, created_at at, total FROM shop_orders WHERE created_at >= '2026-11-23 10:00:00' AND total > 0 AND (tags IS NULL OR tags NOT LIKE '%cancel%')")->fetchAll(PDO::FETCH_ASSOC) as $r) { $a = $al[$r["sk"] . "|" . $r["id"]] ?? null; if (!$a || (int)$a["is_direct"] || (int)$a["employee_id"] <= 0) continue; $O[] = ["shopify", $k10($r["phone"]), $r["at"], (string)$a["order_type"], stripos((string)$a["allocated_by"], "auto") !== false ? "robot" : "person", (float)$r["total"]]; }
          $M = []; $A = []; $D = [];
          foreach ($O as $o) { $qt = "no query found"; $gap = ""; if ($o[1] !== "" && isset($Q[$o[1]])) { $best = null; foreach ($Q[$o[1]] as $x) if ($x[0] <= $o[2]) $best = $x; if ($best) { $qt = in_array($best[1], ["campaign", "community"], true) ? "query is " . $best[1] : "query is FRESH (" . $best[1] . ")"; $gap = (strtotime($o[2]) - strtotime($best[0])) > 7 * 86400 ? " (older than 7 days)" : ""; } }
            $rep = isset($first[$o[1]]) && $first[$o[1]] < date("Y-m-d H:i:s", strtotime($o[2]) - 120) ? "old buyer" : "first order"; $ot = $o[3] === "" ? "(none)" : $o[3];
            $k = "order typed " . $ot . " by " . $o[4] . " · " . $qt . $gap . " · " . $rep; $M[$k] = ($M[$k] ?? 0) + 1; $A[$k] = ($A[$k] ?? 0) + $o[5];
            $dd = substr(date("Y-m-d", strtotime($o[2]) - 36000), 8); $mis = (strpos($qt, "FRESH") !== false && $ot === "campaign") ? "fresh query → Campaign order" : ((strpos($qt, "query is c") === 0 && $ot === "query") ? "campaign query → Query order" : ""); if ($mis !== "" && $gap === "") $D[$dd . " " . $mis . " (" . $o[4] . ", " . $rep . ")"] = ($D[$dd . " " . $mis . " (" . $o[4] . ", " . $rep . ")"] ?? 0) + 1; }
          echo "U orders with a salesperson since 23 Nov 10:00: " . count($O) . "\n"; arsort($M); foreach ($M as $k => $c) echo "U ord " . $c . " · " . round($A[$k]) . " · " . $k . "\n"; ksort($D); foreach ($D as $k => $c) echo "U mismatch day " . $k . ": " . $c . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

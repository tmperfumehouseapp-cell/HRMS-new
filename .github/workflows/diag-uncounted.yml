# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          foreach (["2026-11-23", "2026-11-24", "2026-11-25", "2026-11-26", "2026-11-27"] as $sd) { $q = $d->prepare("SELECT group_key, amount, COUNT(*) n FROM daily_targets WHERE target_date = ? GROUP BY group_key, amount ORDER BY n DESC, amount DESC LIMIT 12"); $q->execute([$sd]); $o = []; $tot = 0; foreach ($q->fetchAll(PDO::FETCH_NUM) as $r) { $o[] = round($r[1]) . "×" . $r[2] . ($r[0] !== "tmph" ? " [" . $r[0] . "]" : ""); $tot += $r[2]; } echo "U hand-typed targets " . substr($sd, 8) . " (top amounts, amount×people): " . ($o ? implode(" · ", $o) : "none") . "\n"; }
          try { $cols = []; foreach ($d->query("SHOW COLUMNS FROM daily_targets")->fetchAll(PDO::FETCH_NUM) as $r) $cols[] = $r[0]; echo "U daily_targets columns: " . implode(", ", $cols) . "\n"; } catch (Throwable $e) { }
          try { foreach ($d->query("SELECT action, COUNT(*) n, MIN(created_at) a, MAX(created_at) b FROM audit_log WHERE created_at >= '2026-11-25 18:00:00' AND action LIKE '%target%' GROUP BY action ORDER BY n DESC LIMIT 8")->fetchAll(PDO::FETCH_NUM) as $r) echo "U audit " . $r[0] . " · " . $r[1] . " · " . $r[2] . " to " . $r[3] . "\n"; } catch (Throwable $e) { echo "U audit n/a: " . substr($e->getMessage(), 0, 90) . "\n"; }
          $days = ["2026-11-23", "2026-11-24", "2026-11-25"]; $emps = []; foreach ($d->query("SELECT e.employee_id id FROM employees e LEFT JOIN departments dp ON dp.department_id = e.department_id WHERE dp.department_name LIKE '%sales%' AND (e.status IS NULL OR e.status <> 'ex')")->fetchAll(PDO::FETCH_NUM) as $r) $emps[(int)$r[0]] = 1;
          $al = []; foreach ($d->query("SELECT order_id, employee_id, is_direct FROM order_allocations WHERE source = 'manual'")->fetchAll(PDO::FETCH_ASSOC) as $r) $al[(string)$r["order_id"]] = $r; $col = [];
          foreach ($days as $sd) { $from = $sd . " 10:00:00"; $to = date("Y-m-d", strtotime($sd . " +1 day")) . " 10:00:00";
            $q = $d->prepare("SELECT o.total total, a.employee_id emp FROM shop_orders o JOIN order_allocations a ON a.source COLLATE utf8mb4_unicode_ci = o.store_key COLLATE utf8mb4_unicode_ci AND a.order_id COLLATE utf8mb4_unicode_ci = CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci WHERE o.created_at >= ? AND o.created_at < ? AND o.total > 0 AND (o.tags IS NULL OR o.tags NOT LIKE '%cancel%') AND a.employee_id > 0 AND COALESCE(a.is_direct, 0) = 0"); $q->execute([$from, $to]); foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) $col[(int)$r["emp"]][$sd] = ($col[(int)$r["emp"]][$sd] ?? 0) + (float)$r["total"];
            $m = $d->prepare("SELECT manual_order_id id, employee_id emp, total FROM manual_orders WHERE order_date >= ? AND order_date < ? AND employee_id > 0"); $m->execute([$from, $to]); foreach ($m->fetchAll(PDO::FETCH_ASSOC) as $r) { $a = $al[(string)$r["id"]] ?? null; if ($a && (int)$a["is_direct"]) continue; $e = $a && (int)$a["employee_id"] > 0 ? (int)$a["employee_id"] : (int)$r["emp"]; $col[$e][$sd] = ($col[$e][$sd] ?? 0) + (float)$r["total"]; } }
          $q = $d->query("SELECT employee_id, SUM(amount) a FROM daily_targets WHERE target_date = '2026-11-26' GROUP BY employee_id"); $below = 0; $above = 0; $same = 0; $n = 0; $sumT = 0; $sumR = 0; $bk = ["typed below rule by >20%" => 0, "within 20%" => 0, "typed above rule by >20%" => 0];
          foreach ($q->fetchAll(PDO::FETCH_NUM) as $r) { $id = (int)$r[0]; if (!isset($emps[$id])) continue; $c = array_values(array_filter([$col[$id]["2026-11-23"] ?? 0, $col[$id]["2026-11-24"] ?? 0, $col[$id]["2026-11-25"] ?? 0])); $rule = max(25000, $c ? round(array_sum($c) / count($c) * 1.1) : 0); $n++; $sumT += (float)$r[1]; $sumR += $rule; $t = (float)$r[1]; if ($t < $rule * 0.8) $bk["typed below rule by >20%"]++; elseif ($t > $rule * 1.2) $bk["typed above rule by >20%"]++; else $bk["within 20%"]++; }
          echo "U today hand-typed " . $n . " people: typed sum " . round($sumT) . " · rule sum " . round($sumR) . " · " . json_encode($bk) . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

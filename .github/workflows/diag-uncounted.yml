# READ-ONLY: business day 2026-11-19 — all orders vs the orders that have an allocation row (what the Leaders collection counts), the orders WITHOUT one, and the HRMS-typed manual orders. No customer names or phone numbers. Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Uncounted orders
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          cat > /tmp/un_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata");
          $from = "2026-11-01 10:00:00"; $to = "2026-11-20 10:00:00";
          echo "ADD-ONS sold on orders of business days 1 Nov .. 19 Nov (order day = created_at minus 10 h), split by the ORDER's type\n";
          $norm = function ($n) { return strtolower(trim(ltrim(trim((string)$n), "#"))); };
          try {
            $sql = "SELECT o.order_name nm, DATE(DATE_SUB(o.created_at, INTERVAL 10 HOUR)) bd, COALESCE(NULLIF(a.order_type, ''), 'untyped') ot FROM shop_orders o LEFT JOIN order_allocations a ON a.source = o.store_key AND a.order_id COLLATE utf8mb4_unicode_ci = CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci WHERE o.created_at >= ? AND o.created_at < ? AND (o.tags IS NULL OR o.tags NOT LIKE '%cancel%')";
            $q = $d->prepare($sql); $q->execute([$from, $to]); $ord = []; foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) $ord[$norm($r["nm"])] = [$r["bd"], $r["ot"]];
            $ad = $d->query("SELECT order_name, addon_group, group_key, price, addon_date FROM employee_addons WHERE addon_date >= '2026-10-25' AND addon_date <= '2026-11-21'")->fetchAll(PDO::FETCH_ASSOC);
          } catch (Throwable $e) { echo "n/a: " . substr($e->getMessage(), 0, 200) . "\n"; exit; }
          $by = []; $un = []; $tot = ["query" => 0.0, "campaign" => 0.0, "untyped" => 0.0]; $cnt = [];
          foreach ($ad as $r) {
            $k = $norm($r["order_name"]); $p = (float)$r["price"];
            if (!isset($ord[$k])) { $un[] = [$r["addon_date"], $p, $k === "" ? "(no order number)" : "order not found in the window"]; continue; }
            [$bd, $ot] = $ord[$k]; $ot = isset($tot[$ot]) ? $ot : "untyped";
            $by[$bd][$ot] = ($by[$bd][$ot] ?? 0) + $p; $tot[$ot] += $p; $cnt[$k] = 1;
          }
          ksort($by); echo "day        | query     | campaign  | untyped   | day total\n";
          foreach ($by as $bd => $x) { $q1 = $x["query"] ?? 0; $c1 = $x["campaign"] ?? 0; $u1 = $x["untyped"] ?? 0; echo $bd . " | " . str_pad(round($q1), 9) . " | " . str_pad(round($c1), 9) . " | " . str_pad(round($u1), 9) . " | " . round($q1 + $c1 + $u1) . "\n"; }
          echo "TOTAL 1-19 Nov: query Rs " . round($tot["query"]) . " · campaign Rs " . round($tot["campaign"]) . " · untyped Rs " . round($tot["untyped"]) . " · ALL Rs " . round(array_sum($tot)) . " · orders with an add-on: " . count($cnt) . "\n";
          $ua = 0; foreach ($un as $u) $ua += $u[1];
          echo "\nADD-ON ROWS NOT MATCHED to any order of 1-19 Nov: " . count($un) . " · Rs " . round($ua) . "\n"; foreach (array_slice($un, 0, 40) as $u) echo "  " . $u[0] . " · Rs " . round($u[1]) . " · " . $u[2] . "\n";
          PHP
          php /tmp/un_check.php "$P"; rm -f /tmp/un_check.php
          REMOTE

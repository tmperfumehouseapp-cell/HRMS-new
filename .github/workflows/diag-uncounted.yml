# READ-ONLY: what the must-send check sees for ONE order (times and which rule matched, no message text). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          $g = function ($k) use ($d) { $q = $d->prepare("SELECT setting_value FROM hrms_settings WHERE setting_key = ?"); $q->execute([$k]); return trim((string)$q->fetchColumn()); };
          $base = rtrim($g("tms_api_base") ?: "https://test.tmperfumehouse.store/api/v1", "/"); $key = $g("tms_api_key"); if ($key === "") { echo "U no shop key\n"; exit; }
          $ch = curl_init($base . "/orders?page=1&limit=40&since=" . date("Y-m-d", time() - 86400)); curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER => true, CURLOPT_TIMEOUT => 20, CURLOPT_HTTPHEADER => ["Authorization: Bearer " . $key, "Accept: application/json"]]);
          $j = json_decode((string)curl_exec($ch), true); curl_close($ch); $items = (array)($j["data"]["items"] ?? []); echo "U shop orders read: " . count($items) . "\n";
          $all = $items; for ($p = 2; $p <= 6 && !empty($j["data"]["has_more"]); $p++) { $ch = curl_init($base . "/orders?page=" . $p . "&limit=40&since=" . date("Y-m-d", time() - 86400)); curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER => true, CURLOPT_TIMEOUT => 20, CURLOPT_HTTPHEADER => ["Authorization: Bearer " . $key, "Accept: application/json"]]); $j = json_decode((string)curl_exec($ch), true); curl_close($ch); foreach ((array)($j["data"]["items"] ?? []) as $o) $all[] = $o; }
          echo "U server now " . date("Y-m-d H:i:s") . " · all orders " . count($all) . "\n";
          $mq = $d->prepare("SELECT order_no, order_date, employee_id, created_by FROM manual_orders WHERE channel = 'TM Store' AND mp_no = ?");
          foreach ($all as $o) { $mq->execute([(string)($o["number"] ?? "")]); $m = $mq->fetch(PDO::FETCH_ASSOC);
            echo "U " . ($o["number"] ?? "?") . " · " . ($o["source"] ?? "") . " · placed " . substr((string)($o["placed_at"] ?? ""), 5, 11) . " · updated " . substr((string)($o["updated_at"] ?? ""), 5, 11) . " · " . ($o["payment_status"] ?? "") . " " . ($o["payment_method"] ?? "") . " paid " . round((float)($o["amount_paid"] ?? 0)) . "/" . round((float)($o["total"] ?? 0)) . " · ship " . ($o["fulfillment_status"] ?? "") . (($o["awb"] ?? "") !== "" ? " awb" : "") . " · HRMS " . ($m ? $m["order_no"] . " emp " . $m["employee_id"] . " date " . substr($m["order_date"], 5, 11) . " by " . $m["created_by"] : "no row") . "\n"; }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

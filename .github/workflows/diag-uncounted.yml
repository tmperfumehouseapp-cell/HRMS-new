# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          $days = ["2026-11-19", "2026-11-20", "2026-11-21", "2026-11-22", "2026-11-23", "2026-11-24", "2026-11-25", "2026-11-26"]; $st = ["2026-11-19" => "10:00", "2026-11-20" => "10:00", "2026-11-21" => "12:25", "2026-11-22" => "12:00", "2026-11-23" => "10:00", "2026-11-24" => "10:00", "2026-11-25" => "10:00", "2026-11-26" => "10:00", "2026-11-27" => "10:00"];
          $emps = []; foreach ($d->query("SELECT e.employee_id id, e.full_name nm FROM employees e LEFT JOIN departments dp ON dp.department_id = e.department_id WHERE dp.department_name LIKE '%sales%' AND (e.status IS NULL OR e.status <> 'ex')")->fetchAll(PDO::FETCH_ASSOC) as $r) $emps[(int)$r["id"]] = $r["nm"];
          $irf = 0; foreach ($emps as $id => $nm) if (stripos($nm, "irfan") !== false) $irf = $id;
          $canc = []; try { foreach ($d->query("SELECT * FROM order_cancels LIMIT 20000")->fetchAll(PDO::FETCH_ASSOC) as $r) $canc[(string)($r["source"] ?? "") . "|" . (string)($r["order_id"] ?? "")] = 1; } catch (Throwable $e) { echo "U cancels table n/a: " . substr($e->getMessage(), 0, 100) . "\n"; }
          $al = []; foreach ($d->query("SELECT source, order_id, house, employee_id, is_direct FROM order_allocations WHERE source = 'manual'")->fetchAll(PDO::FETCH_ASSOC) as $r) $al[(string)$r["order_id"]] = $r;
          $shop = []; $man = []; $chan = []; $house = []; $addon = []; $mcanc = 0;
          try { foreach ($d->query("SELECT LOWER(TRIM(LEADING '#' FROM TRIM(order_name))) k, SUM(price) s FROM employee_addons WHERE addon_date >= '2026-11-15' GROUP BY k")->fetchAll(PDO::FETCH_ASSOC) as $r) $addon[$r["k"]] = (float)$r["s"]; } catch (Throwable $e) { }
          $addT = [];
          foreach ($days as $sd) { $nx = date("Y-m-d", strtotime($sd . " +1 day")); $from = $sd . " " . $st[$sd] . ":00"; $to = $nx . " " . $st[$nx] . ":00";
            $q = $d->prepare("SELECT o.order_name nm, o.total total, a.employee_id emp FROM shop_orders o JOIN order_allocations a ON a.source COLLATE utf8mb4_unicode_ci = o.store_key COLLATE utf8mb4_unicode_ci AND a.order_id COLLATE utf8mb4_unicode_ci = CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci WHERE o.created_at >= ? AND o.created_at < ? AND o.total > 0 AND (o.tags IS NULL OR o.tags NOT LIKE '%cancel%') AND a.employee_id > 0 AND COALESCE(a.is_direct, 0) = 0"); $q->execute([$from, $to]);
            foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) { $e = (int)$r["emp"]; $shop[$e][$sd] = ($shop[$e][$sd] ?? 0) + (float)$r["total"]; $k = strtolower(trim(ltrim(trim($r["nm"]), "#"))); if (isset($emps[$e])) $addT[$sd] = ($addT[$sd] ?? 0) + ($addon[$k] ?? 0); }
            $m = $d->prepare("SELECT manual_order_id id, employee_id emp, total, channel, house, batch FROM manual_orders WHERE order_date >= ? AND order_date < ? AND employee_id > 0"); $m->execute([$from, $to]);
            foreach ($m->fetchAll(PDO::FETCH_ASSOC) as $r) { if (isset($canc["manual|" . $r["id"]])) { $mcanc++; continue; } $a = $al[(string)$r["id"]] ?? null; if ($a && (int)$a["is_direct"]) continue; $e = $a && (int)$a["employee_id"] > 0 ? (int)$a["employee_id"] : (int)$r["emp"];
              $man[$e][$sd] = ($man[$e][$sd] ?? 0) + (float)$r["total"]; $c = (string)$r["channel"] !== "" ? (string)$r["channel"] : ((string)$r["batch"] !== "" ? "quick entry" : "manual"); $chan[$sd][$c] = ($chan[$sd][$c] ?? 0) + (float)$r["total"]; $h = ($a ? (string)$a["house"] : "") . "/" . (string)$r["house"]; $house[$h] = ($house[$h] ?? 0) + 1; } }
          echo "U manual orders: house (allocation/order) counts " . json_encode($house) . " · cancelled left out " . $mcanc . "\n";
          foreach ($days as $sd) { $s = 0; $mm = 0; foreach ($emps as $id => $nm) { $s += $shop[$id][$sd] ?? 0; $mm += $man[$id][$sd] ?? 0; } echo "U team " . substr($sd, 8) . ": Shopify " . round($s) . " · manual / website " . round($mm) . " (" . ($s + $mm > 0 ? round(100 * $mm / ($s + $mm)) : 0) . "%) by channel " . json_encode(array_map("round", $chan[$sd] ?? [])) . " · add-ons " . round($addT[$sd] ?? 0) . "\n"; }
          $o = []; foreach ($days as $sd) $o[] = substr($sd, 8) . ": Shopify " . round($shop[$irf][$sd] ?? 0) . " + manual/website " . round($man[$irf][$sd] ?? 0); echo "U IRFAN " . implode(" · ", $o) . "\n";
          $h3 = ["2026-11-23", "2026-11-24", "2026-11-25"]; $f = function ($arr) { $c = array_values(array_filter($arr)); return $c ? array_sum($c) / count($c) : 0; };
          $vS = []; $vA = []; foreach ($h3 as $hd) { $vS[] = $shop[$irf][$hd] ?? 0; $vA[] = ($shop[$irf][$hd] ?? 0) + ($man[$irf][$hd] ?? 0); } echo "U IRFAN rule today from Shopify only: avg " . round($f($vS)) . " +10% = " . round($f($vS) * 1.1) . " (system holds 29610) · with manual / website orders: avg " . round($f($vA)) . " +10% = " . round($f($vA) * 1.1) . "\n";
          $hand = []; foreach ($d->query("SELECT employee_id, SUM(amount) a FROM daily_targets WHERE target_date = '2026-11-26' GROUP BY employee_id")->fetchAll(PDO::FETCH_NUM) as $r) $hand[(int)$r[0]] = (float)$r[1];
          $c = json_decode((string)$d->query("SELECT setting_value FROM hrms_settings WHERE setting_key = 'ct_tgt_cache_2026-11-26'")->fetchColumn(), true); $held = is_array($c) ? ($c["v"] ?? []) : [];
          $n = 0; $sumHeld = 0; $sumNew = 0; $rows = [];
          foreach ($emps as $id => $nm) { if (isset($hand[$id])) continue; $now = (float)($held[$id] ?? 0); $vS = []; $vA = []; foreach ($h3 as $hd) { $vS[] = $shop[$id][$hd] ?? 0; $vA[] = ($shop[$id][$hd] ?? 0) + ($man[$id][$hd] ?? 0); } $rs = max(25000, round($f($vS) * 1.1)); $ra = max(25000, round($f($vA) * 1.1)); if (!$f($vA) && $now <= 0) continue; $n++; $sumHeld += $now; $sumNew += $now > 0 ? $ra : 0; $rows[] = "#" . $id . " held " . round($now) . " → Shopify-only recount " . $rs . " → with manual " . $ra; }
          echo "U today: people WITHOUT a hand-typed target " . $n . " · held sum " . round($sumHeld) . " · with manual / website orders " . round($sumNew) . "\n"; foreach ($rows as $x) echo "U   " . $x . "\n";
          $hn = 0; $hs = 0; $hr = 0; foreach ($hand as $id => $a) { if (!isset($emps[$id])) continue; $vA = []; foreach ($h3 as $hd) $vA[] = ($shop[$id][$hd] ?? 0) + ($man[$id][$hd] ?? 0); $hn++; $hs += $a; $hr += max(25000, round($f($vA) * 1.1)); } echo "U today: people WITH a hand-typed target " . $hn . " · typed sum " . round($hs) . " · rule (3 days avg +10%, min 25000) would give " . round($hr) . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

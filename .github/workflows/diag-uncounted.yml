# READ-ONLY: what the must-send check sees for ONE order (times and which rule matched, no message text). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'");
          $g = function ($k) use ($d) { $q = $d->prepare("SELECT setting_value FROM hrms_settings WHERE setting_key = ?"); $q->execute([$k]); return trim((string)$q->fetchColumn()); };
          echo "U now " . date("Y-m-d H:i:s") . " · cursor " . $g("wag_cxbtn_ts3") . " · cron " . $g("wa_cron_at") . "\n";
          echo "U auto-resolved events: " . $d->query("SELECT COUNT(*) FROM wa_messages WHERE dir = 'sys' AND body LIKE '%Resolved automatically: the customer only tapped%'")->fetchColumn() . "\n";
          $q = $d->query("SELECT m.id, m.phone, m.ts, m.mtype, c.status, (SELECT LEFT(body, 40) FROM wa_messages o WHERE o.phone = m.phone AND o.dir = 'out' AND o.id < m.id ORDER BY o.id DESC LIMIT 1) prev, (SELECT COUNT(*) FROM wa_messages l WHERE l.phone = m.phone AND l.id > m.id AND l.dir <> 'sys') later FROM wa_messages m JOIN wa_contacts c ON c.phone = m.phone WHERE m.dir = 'in' AND m.mtype IN ('button','interactive') AND m.ts >= NOW() - INTERVAL 3 HOUR ORDER BY m.id DESC LIMIT 25");
          foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U tap ..." . substr($r["phone"], -4) . " · " . substr($r["ts"], 11, 5) . " · " . $r["mtype"] . " · chat " . $r["status"] . " · later " . $r["later"] . " · prev: " . preg_replace("/\s+/", " ", (string)$r["prev"]) . "\n";
          try { foreach ($d->query("SELECT at, info FROM wa_log WHERE kind = 'engine' AND ok = 0 AND at >= NOW() - INTERVAL 30 MINUTE ORDER BY id DESC LIMIT 8")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U log " . substr($r["at"], 11, 5) . " " . mb_substr($r["info"], 0, 160) . "\n"; } catch (Throwable $e) { }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

# READ-ONLY: the strict complaint rule and the code message of the must-send check (counts only). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          echo "U now " . date("Y-m-d H:i:s") . "\n"; $day = date("Y-m-d", time() - 36000); $t0 = $day . " 10:00:00"; $src = (string)file_get_contents($argv[1] . "empmanagment/api.php"); $cxs = (string)file_get_contents($argv[1] . "empmanagment/complaints.php");
          echo "U deployed: strict complaint words " . (strpos($cxs, "function cx_text_problem") !== false ? "yes" : "NO") . " · code message in the must-send check " . (strpos($src, "function must3_code_msg") !== false ? "yes" : "NO") . " · complaints file changed " . date("H:i:s", filemtime($argv[1] . "empmanagment/complaints.php")) . "\n";
          $ft = date("Y-m-d H:i:s", filemtime($argv[1] . "empmanagment/complaints.php")); $q = $d->prepare("SELECT problem, COUNT(*) n FROM cx_cases WHERE raised_at >= ? AND summary LIKE 'WhatsApp (raised by the bot)%' GROUP BY problem"); $q->execute([$ft]); echo "U tickets the bot raised since the new rule went live: " . json_encode($q->fetchAll(PDO::FETCH_KEY_PAIR)) . "\n";
          $rows = $d->query("SELECT o.phone, a.employee_id e, o.created_at t FROM shop_orders o JOIN order_allocations a ON a.source COLLATE utf8mb4_unicode_ci = o.store_key COLLATE utf8mb4_unicode_ci AND a.order_id COLLATE utf8mb4_unicode_ci = CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci WHERE o.created_at >= '$t0' AND a.employee_id > 0 AND o.total > 0 AND (o.tags IS NULL OR o.tags NOT LIKE '%cancel%')")->fetchAll(PDO::FETCH_ASSOC);
          foreach ($d->query("SELECT phone, employee_id e, order_date t FROM manual_orders WHERE order_date >= '$t0' AND employee_id > 0 AND total > 0 AND phone <> ''")->fetchAll(PDO::FETCH_ASSOC) as $r) $rows[] = $r;
          $q = $d->prepare("SELECT COUNT(*) n, SUM(who IN ('emp', 'phone') OR emp_id > 0) s FROM wa_messages WHERE phone IN (?, ?) AND dir = 'out' AND ts >= ? AND body LIKE '%chat.whatsapp.com/%'"); $tot = 0; $hit = 0; $byS = 0;
          foreach ($rows as $r) { $k = substr(preg_replace("/\D+/", "", (string)$r["phone"]), -10); if (strlen($k) !== 10) continue; $tot++; $q->execute([$k, "91" . $k, date("Y-m-d H:i:s", strtotime($r["t"]) - 3 * 86400)]); $x = $q->fetch(PDO::FETCH_ASSOC); if ((int)$x["n"] > 0) { $hit++; if ((int)$x["s"] > 0) $byS++; } }
          echo "U orders since 10 AM with a mobile number: " . $tot . " · the code message went in the order number's chat: " . $hit . " (" . ($tot ? round(100 * $hit / $tot) : 0) . "%) · of them sent by a salesperson: " . $byS . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

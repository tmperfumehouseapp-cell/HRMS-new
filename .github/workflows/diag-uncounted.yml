# READ-ONLY: business day 2026-11-19 — all orders vs the orders that have an allocation row (what the Leaders collection counts), the orders WITHOUT one, and the HRMS-typed manual orders. No customer names or phone numbers. Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Uncounted orders
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          cat > /tmp/un_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          function sg($d, $k) { try { $q = $d->prepare("SELECT setting_value FROM hrms_settings WHERE setting_key = ?"); $q->execute([$k]); return (string)$q->fetchColumn(); } catch (Throwable $e) { return ""; } }
          foreach (["ml_slab", "ml_slab_chart", "price_chart", "cm_chart"] as $k) { $v = sg($d, $k); echo "setting $k: " . ($v === "" ? "(none)" : strlen($v) . " bytes") . "\n"; }
          // find the chart JSON among the settings: the one that has rows with ml and p
          $found = null; try { foreach ($d->query("SELECT setting_key, setting_value FROM hrms_settings WHERE setting_value LIKE '%\"rows\"%' AND setting_value LIKE '%\"cols\"%' LIMIT 20")->fetchAll(PDO::FETCH_ASSOC) as $r) { $j = json_decode($r["setting_value"], true); if (is_array($j) && !empty($j["rows"][0]["ml"]) && isset($j["rows"][0]["p"])) { echo "chart setting key: " . $r["setting_key"] . "\n"; $found = $j; break; } } } catch (Throwable $e) { echo "n/a " . $e->getMessage() . "\n"; }
          if ($found) { echo "cols: " . json_encode($found["cols"] ?? []) . " names: " . json_encode($found["names"] ?? []) . "\n"; foreach ($found["rows"] as $r) if ((int)$r["ml"] >= 80 && (int)$r["ml"] <= 260) echo "CHART " . (int)$r["ml"] . " ml: " . json_encode($r["p"]) . "\n"; }
          // the bot's price list (price_list.php) lines
          try { foreach ($d->query("SELECT setting_key, LENGTH(setting_value) n FROM hrms_settings WHERE setting_key LIKE '%price%' OR setting_key LIKE 'pl_%' LIMIT 30")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "setting " . $r["setting_key"] . " " . $r["n"] . " bytes\n"; } catch (Throwable $e) { }
          PHP
          php /tmp/un_check.php "$P"; rm -f /tmp/un_check.php
          REMOTE

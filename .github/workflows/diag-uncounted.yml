# READ-ONLY: business day 2026-11-19 — all orders vs the orders that have an allocation row (what the Leaders collection counts), the orders WITHOUT one, and the HRMS-typed manual orders. No customer names or phone numbers. Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Uncounted orders
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          cat > /tmp/un_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata");
          echo "now (IST) " . date("Y-m-d H:i") . "\n";
          $sql = "SELECT o.shopify_id sid, o.store_key sk, o.order_name nm, o.created_at ca, o.total total, o.tags tg, a.alloc_id aid, a.order_type ot
                  FROM shop_orders o LEFT JOIN order_allocations a ON a.source COLLATE utf8mb4_unicode_ci = o.store_key COLLATE utf8mb4_unicode_ci AND a.order_id COLLATE utf8mb4_unicode_ci = CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci
                  WHERE o.created_at >= '2026-11-20 10:00:00' AND o.created_at < '2026-11-22 00:00:00' AND o.total > 0 ORDER BY o.created_at";
          try { $rows = $d->query($sql)->fetchAll(PDO::FETCH_ASSOC); } catch (Throwable $e) { echo "n/a: " . substr($e->getMessage(), 0, 200) . "\n"; exit; }
          $addon = []; try { foreach ($d->query("SELECT LOWER(TRIM(LEADING '#' FROM TRIM(order_name))) k, SUM(price) s FROM employee_addons WHERE addon_date >= '2026-11-19' GROUP BY k")->fetchAll(PDO::FETCH_ASSOC) as $r) $addon[$r["k"]] = (float)$r["s"]; } catch (Throwable $e) { }
          $win = function ($label, $from, $to) use ($rows, $addon) {
            $t = ["query" => [0, 0.0], "campaign" => [0, 0.0], "other" => [0, 0.0]]; $n = 0; $s = 0.0; $ad = 0.0;
            foreach ($rows as $r) {
              if ($r["ca"] < $from || $r["ca"] >= $to) continue; if (stripos((string)$r["tg"], "cancel") !== false) continue; if ($r["aid"] === null) continue;
              $k = strtolower(trim(ltrim(trim($r["nm"]), "#"))); $a = $addon[$k] ?? 0.0; $amt = (float)$r["total"] + $a; $ad += $a;
              $ty = in_array($r["ot"], ["query", "campaign"], true) ? $r["ot"] : "other"; $t[$ty][0]++; $t[$ty][1] += $amt; $n++; $s += $amt;
            }
            echo str_pad($label, 52) . " orders " . str_pad($n, 4) . " · collection Rs " . str_pad(number_format(round($s)), 9) . " (add-ons Rs " . round($ad) . ")  Query " . $t["query"][0] . " / Rs " . number_format(round($t["query"][1])) . " · Campaign " . $t["campaign"][0] . " / Rs " . number_format(round($t["campaign"][1])) . ($t["other"][0] ? " · Other " . $t["other"][0] . " / Rs " . number_format(round($t["other"][1])) : "") . "\n";
          };
          echo "\n=== 20 Nov (yesterday) ===\n";
          $win("OLD: 20 Nov 10:00 -> 21 Nov 12:30 (weekday setting)", "2026-11-20 10:00:00", "2026-11-21 12:30:00");
          $win("NEW: 20 Nov 10:00 -> 21 Nov 12:00 (fixed date)", "2026-11-20 10:00:00", "2026-11-21 12:00:00");
          echo "\n=== 21 Nov (today) ===\n";
          $win("OLD: 21 Nov 12:30 -> now", "2026-11-21 12:30:00", "2026-11-22 00:00:00");
          $win("NEW: 21 Nov 12:00 -> now", "2026-11-21 12:00:00", "2026-11-22 00:00:00");
          echo "\n=== the half hour that moved: 21 Nov 12:00 - 12:30 ===\n";
          $win("orders between 12:00 and 12:30 on 21 Nov", "2026-11-21 12:00:00", "2026-11-21 12:30:00");
          echo "\n=== hour by hour on 21 Nov (new day, from 12:00) ===\n";
          for ($h = 12; $h <= 23; $h++) { $win(sprintf("%02d:00 - %02d:00", $h, $h + 1), sprintf("2026-11-21 %02d:00:00", $h), $h < 23 ? sprintf("2026-11-21 %02d:00:00", $h + 1) : "2026-11-22 00:00:00"); }
          PHP
          php /tmp/un_check.php "$P"; rm -f /tmp/un_check.php
          REMOTE

# READ-ONLY: business day 2026-11-19 — all orders vs the orders that have an allocation row (what the Leaders collection counts), the orders WITHOUT one, and the HRMS-typed manual orders. No customer names or phone numbers. Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Uncounted orders
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          cat > /tmp/un_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          $k = "371326"; echo "searching for order number $k everywhere\n";
          $one = function ($label, $sql, $par = []) use ($d) { try { $q = $d->prepare($sql); $q->execute($par); $rows = $q->fetchAll(PDO::FETCH_ASSOC); echo $label . ": " . count($rows) . " row(s)\n"; foreach (array_slice($rows, 0, 10) as $r) echo "   " . json_encode($r, JSON_UNESCAPED_UNICODE) . "\n"; } catch (Throwable $e) { echo $label . ": n/a " . substr($e->getMessage(), 0, 120) . "\n"; } };
          $one("shop_orders", "SELECT store_key, order_name, created_at, ROUND(total) total, financial_status, tags FROM shop_orders WHERE order_name LIKE ?", ["%$k%"]);
          $one("manual_orders", "SELECT order_no, order_date, ROUND(total) total, payment_status, employee_id, order_type FROM manual_orders WHERE order_no LIKE ?", ["%$k%"]);
          $one("wmo_order", "SELECT order_no, status, created_at FROM wmo_order WHERE order_no LIKE ?", ["%$k%"]);
          $one("employee_addons", "SELECT addon_id, employee_id, addon_date, order_name, product_name, size_ml, qty, ROUND(price) price FROM employee_addons WHERE order_name LIKE ?", ["%$k%"]);
          $one("employee_addons of 4 Nov with Rs 2500", "SELECT addon_id, employee_id, addon_date, order_name, product_name, qty, ROUND(price) price FROM employee_addons WHERE addon_date = '2026-11-04' AND ROUND(price) = 2500", []);
          PHP
          php /tmp/un_check.php "$P"; rm -f /tmp/un_check.php
          REMOTE

# READ-ONLY: what the must-send check sees for ONE order (times and which rule matched, no message text). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          echo "U now " . date("Y-m-d H:i:s") . "\n"; $me = (int)$d->query("SELECT employee_id FROM employees WHERE full_name LIKE 'Irfan Ansari%' AND status != 'ex' LIMIT 1")->fetchColumn(); $t0 = date("Y-m-d", time() - 36000) . " 10:00:00";
          foreach ($d->query("SELECT at, kind, LEFT(why, 120) w FROM waa_log WHERE emp_id = $me AND at >= '$t0' ORDER BY id DESC LIMIT 8")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U Irfan given " . substr($r["at"], 11, 8) . " · " . $r["kind"] . " · " . $r["w"] . "\n";
          echo "U gives marked No rules today: " . $d->query("SELECT COUNT(*) FROM waa_log WHERE at >= '$t0' AND why LIKE '%No rules: his turn%'")->fetchColumn() . " · to people: " . $d->query("SELECT COUNT(DISTINCT emp_id) FROM waa_log WHERE at >= '$t0' AND why LIKE '%No rules: his turn%'")->fetchColumn() . "\n";
          foreach ($d->query("SELECT l.emp_id, e.full_name nm, COUNT(*) n, MAX(l.at) m FROM waa_log l LEFT JOIN employees e ON e.employee_id = l.emp_id WHERE l.kind = 'fresh' AND l.at >= NOW() - INTERVAL 20 MINUTE GROUP BY l.emp_id ORDER BY n DESC LIMIT 8")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U last 20 min: " . mb_substr((string)$r["nm"], 0, 18) . " · fresh " . $r["n"] . " · last " . substr($r["m"], 11, 8) . "\n";
          echo "U fresh given in the last 20 min in all: " . $d->query("SELECT COUNT(*) FROM waa_log WHERE kind = 'fresh' AND at >= NOW() - INTERVAL 20 MINUTE")->fetchColumn() . " · last pass " . mb_substr((string)$d->query("SELECT setting_value FROM hrms_settings WHERE setting_key = 'waa_last'")->fetchColumn(), 0, 300) . "\n";
          echo "U deployed code has the new rule: " . (strpos((string)file_get_contents($argv[1] . "empmanagment/wq_auto.php"), "waa_pick_force") !== false ? "yes" : "NO") . " · file changed " . date("H:i:s", filemtime($argv[1] . "empmanagment/wq_auto.php")) . "\n";
          foreach ($d->query("SELECT l.at, e.full_name nm, LEFT(l.why, 110) w FROM waa_log l LEFT JOIN employees e ON e.employee_id = l.emp_id WHERE l.kind = 'fresh' ORDER BY l.id DESC LIMIT 14")->fetchAll(PDO::FETCH_ASSOC) as $r) echo "U give " . substr($r["at"], 11, 8) . " · " . mb_substr((string)$r["nm"], 0, 16) . " · " . $r["w"] . "\n";
          $st = json_decode((string)$d->query("SELECT setting_value FROM hrms_settings WHERE setting_key = 'waa_st'")->fetchColumn(), true); $f = []; foreach ((array)($st["e"] ?? []) as $e => $s) if (($s["m"] ?? "") === "on" && !empty($s["f"])) $f[] = (int)$e; echo "U people with No rules ON: " . json_encode($f) . " · Irfan " . $me . " state " . json_encode($st["e"][$me] ?? $st["e"][(string)$me] ?? null) . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

# READ-ONLY: our own repeated staff lines about the code that the must-send rule does not catch (digits masked, 3+ chats only). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          echo "U now " . date("Y-m-d H:i:s") . "\n"; $src = (string)file_get_contents($argv[1] . "empmanagment/api.php"); $a = strpos($src, "function must3_code_msg("); $b = $a === false ? false : strpos($src, "\n}\n", $a); if ($a === false || $b === false) { echo "U rule not found\n"; exit; } eval(substr($src, $a, $b - $a + 3));
          // our OWN repeated lines about the code (sent by staff to 3 or more different chats in the last 4 days) that the rule does not catch yet: digits masked, counts only per line
          $q = $d->query("SELECT phone, LEFT(body, 400) b FROM wa_messages WHERE dir = 'out' AND who IN ('emp', 'phone') AND ts >= NOW() - INTERVAL 4 DAY AND (body LIKE '%code%' OR body LIKE '%Code%' OR body LIKE '%CODE%' OR body LIKE '%9909238261%' OR body LIKE '%coupon%' OR body LIKE '%Coupon%' OR body LIKE '%broadcast%' OR body LIKE '%erification%') LIMIT 60000"); $g = []; $tot = 0; $caught = 0;
          foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) { $tot++; $body = (string)$r["b"]; if (must3_code_msg($body)) { $caught++; continue; } $n = mb_substr(trim(preg_replace("/\s+/u", " ", preg_replace("/\d/", "#", mb_strtolower($body)))), 0, 110); if (!isset($g[$n])) $g[$n] = []; $g[$n][$r["phone"]] = 1; }
          $o = []; foreach ($g as $n => $ph) if (count($ph) >= 3) $o[$n] = count($ph); arsort($o); echo "U staff messages with a code word in 4 days: " . $tot . " · already counted as the code message: " . $caught . " · other repeated lines (3+ chats): " . count($o) . "\n"; $k = 0; foreach ($o as $n => $c) { if ($k++ >= 30) break; echo "U line x" . $c . ": " . $n . "\n"; }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          echo "U markers: queries " . json_encode($d->query("SELECT v FROM wq_meta WHERE k = 'reach_fix_q'")->fetchColumn()) . " · orders " . json_encode($d->query("SELECT v FROM wq_meta WHERE k = 'reach_fix_o'")->fetchColumn()) . "\n";
          try { foreach ($d->query("SELECT at, info FROM wa_log WHERE kind = 'wq' AND info LIKE 'last 4 days:%' ORDER BY id")->fetchAll(PDO::FETCH_NUM) as $r) echo "U log " . substr($r[0], 11, 8) . " · " . $r[1] . "\n"; } catch (Throwable $e) { }
          foreach ($d->query("SELECT DATE(DATE_SUB(q.opened_at, INTERVAL 10 HOUR)) dd, SUM(t.reason LIKE '%was New, corrected%') a, SUM(t.reason LIKE '%was Campaign, corrected%') b FROM wa_queries q JOIN wq_qtype t ON t.query_id = q.id WHERE q.opened_at >= '2026-11-23 10:00:00' GROUP BY 1 ORDER BY 1")->fetchAll(PDO::FETCH_NUM) as $r) echo "U queries day " . substr($r[0], 8) . ": New → Campaign " . (int)$r[1] . " · Campaign → New " . (int)$r[2] . "\n";
          $k10 = function ($p) { $x = preg_replace("/\D+/", "", (string)$p); return strlen($x) >= 10 ? substr($x, -10) : ""; };
          $nm = []; foreach ($d->query("SELECT employee_id, full_name FROM employees")->fetchAll(PDO::FETCH_NUM) as $r) $nm[(int)$r[0]] = explode(" ", trim((string)$r[1]))[0];
          $orig = []; foreach ($d->query("SELECT body, ts FROM wa_messages WHERE dir = 'sys' AND mtype = 'event' AND ts >= '2026-11-23 10:00:00' AND body LIKE '%allocated to%(automatic)%' ORDER BY id")->fetchAll(PDO::FETCH_NUM) as $r) { if (preg_match("/(?:Website order|Order)\s+(\S+)\s+allocated to .* · (Query|Campaign) \(automatic\)/u", (string)$r[0], $m)) { $k = strtolower(ltrim($m[1], "#")); if (!isset($orig[$k])) $orig[$k] = strtolower($m[2]); } }
          echo "U allocation notes read: " . count($orig) . "\n";
          $first = []; foreach ($d->query("SELECT phone, MIN(created_at) m FROM shop_orders WHERE total > 0 GROUP BY phone")->fetchAll(PDO::FETCH_NUM) as $r) { $k = $k10($r[0]); if ($k !== "" && (!isset($first[$k]) || $r[1] < $first[$k])) $first[$k] = $r[1]; }
          foreach ($d->query("SELECT phone, MIN(order_date) m FROM manual_orders WHERE total > 0 GROUP BY phone")->fetchAll(PDO::FETCH_NUM) as $r) { $k = $k10($r[0]); if ($k !== "" && (!isset($first[$k]) || $r[1] < $first[$k])) $first[$k] = $r[1]; }
          $O = [];
          foreach ($d->query("SELECT mp_no nm, phone, order_date at, total, employee_id emp, order_type ty FROM manual_orders WHERE channel = 'TM Store' AND created_by = 'auto (WhatsApp)' AND employee_id > 0 AND order_date >= '2026-11-23 10:00:00'")->fetchAll(PDO::FETCH_ASSOC) as $r) $O[] = $r + ["src" => "website"];
          foreach ($d->query("SELECT o.order_name nm, o.phone, o.created_at at, o.total, a.employee_id emp, a.order_type ty FROM order_allocations a JOIN shop_orders o ON o.store_key = a.source AND CAST(o.shopify_id AS CHAR) COLLATE utf8mb4_unicode_ci = a.order_id WHERE a.allocated_by = 'auto (WhatsApp)' AND a.employee_id > 0 AND o.created_at >= '2026-11-23 10:00:00'")->fetchAll(PDO::FETCH_ASSOC) as $r) $O[] = $r + ["src" => "shopify"];
          $qq = $d->prepare("SELECT type, reason, opened_at FROM wq_qtype WHERE phone = ? AND opened_at <= ? AND opened_at >= ? ORDER BY opened_at DESC LIMIT 1");
          $mm = $d->prepare("SELECT who, status, ts FROM wa_messages WHERE phone = ? AND dir = 'out' AND emp_id = 0 AND who IN ('campaign', 'followup', 'recover') AND mtype = 'template' AND ts >= ? AND ts <= ? ORDER BY id");
          $tg = $d->prepare("SELECT at FROM wa_ctags WHERE phone = ? AND tag = 'campaign' AND src = 'wq' LIMIT 1"); $cs = $d->prepare("SELECT source FROM wa_contacts WHERE phone = ?");
          $n = 0; $known = 0; $sum = []; $lines = [];
          foreach ($O as $o) { $key = strtolower(ltrim(trim((string)$o["nm"]), "#")); if (!isset($orig[$key])) continue; $known++; $was = $orig[$key]; $now = (string)$o["ty"]; if ($was === $now) continue; $n++; $sum[$was . " → " . $now] = ($sum[$was . " → " . $now] ?? 0) + 1;
            $k = $k10($o["phone"]); $T = strtotime($o["at"]); $qq->execute([$k, date("Y-m-d H:i:s", $T + 60), date("Y-m-d H:i:s", $T - 7 * 86400)]); $q = $qq->fetch(PDO::FETCH_ASSOC);
            $mm->execute([$k, date("Y-m-d H:i:s", $T - 30 * 86400), $o["at"]]); $okB = 0; $okA = 0; $bad = 0; foreach ($mm->fetchAll(PDO::FETCH_ASSOC) as $m) { if ($m["status"] === "failed") { $bad++; continue; } if ($q && $m["ts"] > $q["opened_at"]) $okA++; else $okB++; }
            $tg->execute([$k]); $ta = (string)$tg->fetchColumn(); $cs->execute([$k]); $so = (string)$cs->fetchColumn(); $old = isset($first[$k]) && $first[$k] < date("Y-m-d H:i:s", $T - 120);
            $rs = $q ? preg_replace("/\d{5,}/", "#", mb_substr((string)$q["reason"], 0, 70)) : "";
            $lines[] = [$o["at"], "U CH " . ltrim((string)$o["nm"], "#") . " · " . substr($o["at"], 5, 11) . " · " . round((float)$o["total"]) . " · " . ($nm[(int)$o["emp"]] ?? "#" . $o["emp"]) . " · " . $o["src"] . " · WAS " . $was . " NOW " . $now . " · query: " . ($q ? $q["type"] . " opened " . substr($q["opened_at"], 5, 11) . " (" . $rs . ")" : "none in 7 days") . " · our campaign messages in the 30 days before the order: reached before the query " . $okB . ", reached after the query opened " . $okA . ", failed " . $bad . " · campaign tag " . ($ta === "" ? "no" : "at " . substr($ta, 5, 11)) . " · chat source '" . $so . "' · " . ($old ? "old buyer" : "first order")]; }
          echo "U robot orders since 23 Nov with an allocation note: " . $known . " of " . count($O) . " · type changed: " . $n . " · " . json_encode($sum) . "\n"; sort($lines); foreach ($lines as $l) echo $l[1] . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

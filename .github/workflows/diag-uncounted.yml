# READ-ONLY: what the must-send check sees for ONE order (times and which rule matched, no message text). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'");
          $e = (int)$d->query("SELECT employee_id FROM employees WHERE full_name LIKE 'Dhruvil%' LIMIT 1")->fetchColumn(); echo "N emp id $e\n";
          try { echo "N his phones that allow notifications: " . $d->query("SELECT COUNT(*) FROM push_subscriptions WHERE employee_id = $e")->fetchColumn() . "\n"; } catch (Throwable $x) { echo "N push table: " . $x->getMessage() . "\n"; }
          echo "N chats that left him today, by how / who did it: "; foreach ($d->query("SELECT how, (by_emp = to_emp) self, (to_emp = 0) released, COUNT(*) n FROM wa_assign_log WHERE from_emp = $e AND to_emp <> $e AND at >= '" . date("Y-m-d 00:00:00") . "' GROUP BY how, self, released") as $r) echo "[" . $r["how"] . ($r["released"] ? " -> nobody" : ($r["self"] ? " taken by the new holder" : " given by a third person")) . " " . $r["n"] . "] "; echo "\n";
          echo "N whole team today, by how: "; foreach ($d->query("SELECT how, COUNT(*) n FROM wa_assign_log WHERE from_emp > 0 AND to_emp > 0 AND to_emp <> from_emp AND at >= '" . date("Y-m-d 00:00:00") . "' GROUP BY how") as $r) echo "[" . $r["how"] . " " . $r["n"] . "] "; echo "\n";
          try { $tot = (int)$d->query("SELECT COUNT(DISTINCT e.employee_id) FROM employees e LEFT JOIN departments dp ON dp.department_id = e.department_id WHERE dp.department_name LIKE '%sales%' AND (e.status IS NULL OR e.status <> 'ex')")->fetchColumn(); $with = (int)$d->query("SELECT COUNT(DISTINCT e.employee_id) FROM employees e LEFT JOIN departments dp ON dp.department_id = e.department_id JOIN push_subscriptions p ON p.employee_id = e.employee_id WHERE dp.department_name LIKE '%sales%' AND (e.status IS NULL OR e.status <> 'ex')")->fetchColumn(); echo "N salespeople whose phone allows notifications: $with of $tot\n"; } catch (Throwable $x) { echo "N " . $x->getMessage() . "\n"; }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

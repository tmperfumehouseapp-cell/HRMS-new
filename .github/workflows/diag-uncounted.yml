# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          $k10 = function ($p) { $x = preg_replace("/\D+/", "", (string)$p); return strlen($x) >= 10 ? substr($x, -10) : ""; };
          $Q = []; foreach ($d->query("SELECT q.id, q.phone, q.opened_at, q.emp_id, t.reason FROM wa_queries q JOIN wq_qtype t ON t.query_id = q.id WHERE q.opened_at >= '2026-11-24 10:00:00' AND t.reason LIKE 'campaign customer: we wrote first%'")->fetchAll(PDO::FETCH_ASSOC) as $r) { $k = $k10($r["phone"]); if ($k !== "") $Q[$k][] = $r; }
          echo "U customers whose query was 'we wrote first' since 24 Nov: " . count($Q) . "\n";
          $O = [];
          foreach ($d->query("SELECT manual_order_id id, phone, order_date at, total, employee_id emp, order_type ty, created_by cb, channel FROM manual_orders WHERE order_date >= '2026-11-24 10:00:00' AND total > 0")->fetchAll(PDO::FETCH_ASSOC) as $r) { $k = $k10($r["phone"]); if ($k !== "" && isset($Q[$k])) $O[] = ["manual", $k, $r["at"], (float)$r["total"], (int)$r["emp"], (string)$r["ty"], (string)$r["cb"], (string)$r["id"]]; }
          $al = []; foreach ($d->query("SELECT source, order_id, order_type, employee_id, allocated_by FROM order_allocations WHERE allocated_at >= '2026-11-24 00:00:00' OR source <> 'manual'")->fetchAll(PDO::FETCH_ASSOC) as $r) $al[$r["source"] . "|" . $r["order_id"]] = $r;
          foreach ($d->query("SELECT shopify_id id, store_key sk, phone, created_at at, total FROM shop_orders WHERE created_at >= '2026-11-24 10:00:00' AND total > 0 AND (tags IS NULL OR tags NOT LIKE '%cancel%')")->fetchAll(PDO::FETCH_ASSOC) as $r) { $k = $k10($r["phone"]); if ($k === "" || !isset($Q[$k])) continue; $a = $al[$r["sk"] . "|" . $r["id"]] ?? null; $O[] = ["shopify", $k, $r["at"], (float)$r["total"], $a ? (int)$a["employee_id"] : 0, $a ? (string)$a["order_type"] : "(not allocated)", $a ? (string)$a["allocated_by"] : "", (string)$r["id"]]; }
          $n = 0; $by = []; $amt = []; $same = 0; $diff = 0; $noemp = 0; $before = 0;
          foreach ($O as $o) { $q = null; foreach ($Q[$o[1]] as $x) if ($x["opened_at"] <= $o[2] && ($q === null || $x["opened_at"] > $q["opened_at"])) $q = $x; if (!$q) { $before++; continue; } $n++;
            if ($o[0] === "manual") { $a = $al["manual|" . $o[7]] ?? null; if ($a) { if ((string)$a["order_type"] !== "") $o[5] = (string)$a["order_type"]; if ((int)$a["employee_id"] > 0) $o[4] = (int)$a["employee_id"]; $o[6] = (string)$a["allocated_by"] . " (allocation)"; } }
            $who = stripos($o[6], "auto") !== false ? "robot" : ($o[6] === "" ? "nobody" : "a person"); $k = $o[0] . " · typed " . ($o[5] === "" ? "(none)" : $o[5]) . " · by " . $who; $by[$k] = ($by[$k] ?? 0) + 1; $amt[$k] = ($amt[$k] ?? 0) + $o[3];
            if ($o[4] <= 0) $noemp++; elseif ($o[4] === (int)$q["emp_id"]) $same++; else $diff++; }
          echo "U their orders placed after that query: " . $n . " (orders before the query, not counted: " . $before . ")\n"; arsort($by); foreach ($by as $k => $c) echo "U   " . $c . " orders · " . round($amt[$k]) . " · " . $k . "\n";
          echo "U salesperson on the order = the holder of the query: " . $same . " · a different person: " . $diff . " · no salesperson on the order: " . $noemp . "\n";
          foreach (["2026-11-24", "2026-11-25", "2026-11-26"] as $sd) { $f = $sd . " 10:00:00"; $t = date("Y-m-d", strtotime($sd . " +1 day")) . " 10:00:00"; $q = $d->prepare("SELECT order_type, (created_by LIKE '%auto%') robot, COUNT(*) n, SUM(total) s FROM manual_orders WHERE order_date >= ? AND order_date < ? AND employee_id > 0 AND total > 0 GROUP BY 1, 2 ORDER BY n DESC"); $q->execute([$f, $t]); $o = []; foreach ($q->fetchAll(PDO::FETCH_NUM) as $r) $o[] = ($r[0] === "" ? "(none)" : $r[0]) . ((int)$r[1] ? " robot" : " person") . " " . $r[2] . " (" . round($r[3]) . ")"; echo "U day " . substr($sd, 8) . " website / manual orders with a salesperson: " . implode(" · ", $o) . "\n"; }
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

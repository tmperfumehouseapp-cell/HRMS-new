# READ-ONLY: why one campaign waits while another with the same list sends (numbers, hourly speed, message approval; no customer data). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:
    inputs:
      chat:
        description: 'last 10 digits of the customer number'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Queries of two people
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          CHAT: ${{ github.event.inputs.chat }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$CHAT" <<'REMOTE' || true
          P="$1"; CH="$2"
          cat > /tmp/ql_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'"); echo "U now " . date("Y-m-d H:i:s") . "\n";
          $t0 = strtotime(date("Y-m-d", time() - 10 * 3600) . " 10:00:00");
          echo "U marker pass 1 = " . (string)$d->query("SELECT v FROM wq_meta WHERE k = 'wrote_first_fix'")->fetchColumn() . " · pass 2 (from 24 Nov) = " . (string)$d->query("SELECT v FROM wq_meta WHERE k = 'wrote_first_fix2'")->fetchColumn() . " · deployed pass 2: " . (strpos((string)@file_get_contents($argv[1] . "empmanagment/wq.php"), "wrote_first_fix2") !== false ? "yes" : "NO") . "\n";
          for ($back = 0; $back <= 3; $back++) { $a0 = date("Y-m-d H:i:s", $t0 - $back * 86400); $a1 = date("Y-m-d H:i:s", $t0 - ($back - 1) * 86400);
            $q = $d->prepare("SELECT COALESCE(t.type, 'unclear') type, COUNT(*) n, SUM(COALESCE(s.orders, 0) > 0) o, SUM(t.reason LIKE '%was New, corrected%') fx FROM wa_queries q LEFT JOIN wq_qtype t ON t.query_id = q.id LEFT JOIN wq_qstat s ON s.query_id = q.id WHERE q.opened_at >= ? AND q.opened_at < ? GROUP BY 1 ORDER BY n DESC"); $q->execute([$a0, $a1]); $o = []; $fx = 0; $fr = 0; $fo = 0;
            foreach ($q->fetchAll(PDO::FETCH_NUM) as $r) { $o[] = $r[0] . " " . $r[1] . " (" . (int)$r[2] . " orders)"; $fx += (int)$r[3]; if (!in_array($r[0], ["campaign", "community"], true)) { $fr += (int)$r[1]; $fo += (int)$r[2]; } }
            echo "U day " . substr($a0, 0, 10) . " · " . implode(" · ", $o) . " · corrected from New " . $fx . " · fresh now " . $fr . " with " . $fo . " orders\n"; }
          $lt = json_decode((string)$d->query("SELECT v FROM wq_meta WHERE k = 'last_tick'")->fetchColumn(), true); echo "U last tick " . ($lt["at"] ?? "?") . " · " . ($lt["ms"] ?? "?") . " ms · wrote_first_fix " . json_encode($lt["result"]["wrote_first_fix"] ?? null) . " · error " . json_encode($lt["result"]["error"] ?? null) . "\n";
          PHP
          php /tmp/ql_check.php "$P" "$CH"; rm -f /tmp/ql_check.php
          REMOTE

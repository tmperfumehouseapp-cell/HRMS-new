# READ-ONLY: per salesperson collection of the business days 19, 20, 21 Nov (same counting as the Sunday sheet). Changes nothing.
# Run it by hand: Actions -> "Uncounted orders (read-only)" -> Run workflow.
name: Uncounted orders (read-only)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Uncounted orders
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          cat > /tmp/un_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          date_default_timezone_set("Asia/Kolkata"); $d->exec("SET time_zone = '+05:30'");
          echo "wa_messages columns: " . implode(",", $d->query("SHOW COLUMNS FROM wa_messages")->fetchAll(PDO::FETCH_COLUMN)) . "\n";
          echo "gallery items with chain / jewel in the title:\n"; foreach ($d->query("SELECT id, title, kind, filename, LEFT(mids, 200) mids FROM wa_media_lib WHERE title LIKE '%chain%' OR title LIKE '%jewel%' OR filename LIKE '%chain%' LIMIT 20") as $r) echo "  LIB " . $r["id"] . " [" . $r["title"] . "] " . $r["kind"] . " file " . $r["filename"] . " mids " . $r["mids"] . "\n";
          $k = substr(preg_replace("/\D+/", "", (string)$d->query("SELECT phone FROM shop_orders WHERE REPLACE(order_name, '#', '') = '73499' ORDER BY created_at DESC LIMIT 1")->fetchColumn()), -10);
          echo "outgoing photos of the chat of #73499 today:\n"; $m = $d->prepare("SELECT * FROM wa_messages WHERE phone = ? AND dir = 'out' AND mtype IN ('image','document','video') AND ts >= ? ORDER BY id"); $m->execute([$k, date("Y-m-d 00:00:00")]);
          foreach ($m->fetchAll(PDO::FETCH_ASSOC) as $x) { $mid = (string)($x["media_id"] ?? ""); $n = 0; if ($mid !== "") { $c = $d->prepare("SELECT COUNT(DISTINCT phone) FROM wa_messages WHERE media_id = ? AND dir = 'out'"); $c->execute([$mid]); $n = (int)$c->fetchColumn(); }
            $lib = ""; if ($mid !== "") { $l = $d->prepare("SELECT title FROM wa_media_lib WHERE mids LIKE ? LIMIT 1"); $l->execute(["%" . $mid . "%"]); $lib = (string)$l->fetchColumn(); }
            echo "  IMG " . $x["ts"] . " who " . $x["who"] . " type " . $x["mtype"] . " caption [" . mb_substr((string)$x["body"], 0, 60) . "] media_id " . ($mid !== "" ? "set" : "empty") . " sent to $n chats · gallery title [" . $lib . "] mime " . ($x["media_mime"] ?? "") . "\n"; }
          PHP
          php /tmp/un_check.php "$P"; rm -f /tmp/un_check.php
          REMOTE

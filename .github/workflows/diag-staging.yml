# READ-ONLY diagnostics of the staging VPS (CloudPanel): load, memory, busiest processes, PHP workers, database activity.
# Changes nothing. Run it by hand: Actions → "Diagnose staging (read-only)" → Run workflow. Uses the same 4 secrets as the deploy.
name: Diagnose staging (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Server state (read-only)
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          echo "=== uptime / load ==="; uptime
          echo "=== cpu cores ==="; nproc
          echo "=== memory ==="; free -m
          echo "=== disk ==="; df -h / | tail -2
          echo "=== top 15 processes by CPU ==="; ps -eo pid,user,pcpu,pmem,etimes,args --sort=-pcpu | cut -c1-170 | head -16
          echo "=== counts ==="; echo "php-fpm processes: $(ps -e -o args | grep -c '[p]hp-fpm')"; echo "mysqld processes: $(ps -e -o args | grep -c '[m]ysqld')"
          echo "=== longest running php processes (seconds) ==="; ps -eo etimes,user,args --sort=-etimes | grep '[p]hp' | cut -c1-150 | head -8
          echo "=== connections ==="; ss -s | head -6
          echo "=== database activity (SHOW FULL PROCESSLIST, no passwords) ==="
          php -r '
            $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
            require $f; try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8]);
              $r = $d->query("SHOW FULL PROCESSLIST")->fetchAll(PDO::FETCH_ASSOC); echo count($r) . " connections\n";
              usort($r, fn($a, $b) => (int)$b["Time"] <=> (int)$a["Time"]);
              foreach (array_slice($r, 0, 25) as $x) echo "id=" . $x["Id"] . " time=" . $x["Time"] . "s state=" . $x["State"] . " | " . substr(preg_replace("/\s+/", " ", (string)$x["Info"]), 0, 170) . "\n";
              $s = $d->query("SHOW GLOBAL STATUS LIKE \"Threads_running\"")->fetch(PDO::FETCH_NUM); echo "Threads_running = " . $s[1] . "\n";
              echo "--- engine (cron) ---\n"; foreach ($d->query("SELECT setting_key k, setting_value v FROM hrms_settings WHERE setting_key IN (\"wa_cron_at\", \"wa_cron_start\", \"wa_cron_tick\", \"wa_cron_step\", \"wa_cron_steps\")")->fetchAll(PDO::FETCH_ASSOC) as $x) echo $x["k"] . " = " . substr((string)$x["v"], 0, 120) . "\n"; echo "server time now = " . date("Y-m-d H:i:s") . "\n";
              $lk = (int)$d->query("SELECT IS_USED_LOCK(\"hrms_wa_cron\")")->fetchColumn(); echo "engine lock held by connection: " . ($lk ?: "nobody") . "\n";
              if ($lk) foreach ($d->query("SHOW FULL PROCESSLIST")->fetchAll(PDO::FETCH_ASSOC) as $x) if ((int)$x["Id"] === $lk) echo "  that connection: time=" . $x["Time"] . "s state=" . $x["State"] . " | " . substr(preg_replace("/\\s+/", " ", (string)$x["Info"]), 0, 220) . "\n";
              echo "--- database settings ---\n"; foreach ($d->query("SHOW VARIABLES WHERE Variable_name IN (\"version\", \"innodb_buffer_pool_size\", \"innodb_log_file_size\", \"innodb_redo_log_capacity\", \"innodb_flush_log_at_trx_commit\", \"innodb_io_capacity\", \"max_connections\", \"tmp_table_size\", \"slow_query_log\", \"long_query_time\", \"innodb_flush_method\")")->fetchAll(PDO::FETCH_NUM) as $x) echo $x[0] . " = " . $x[1] . "\n";
              $st = []; foreach ($d->query("SHOW GLOBAL STATUS WHERE Variable_name IN (\"Innodb_buffer_pool_reads\", \"Innodb_buffer_pool_read_requests\", \"Created_tmp_disk_tables\", \"Created_tmp_tables\", \"Select_full_join\", \"Slow_queries\", \"Uptime\")")->fetchAll(PDO::FETCH_NUM) as $x) $st[$x[0]] = (float)$x[1];
              echo "buffer pool: disk reads " . ($st["Innodb_buffer_pool_reads"] ?? 0) . " of " . ($st["Innodb_buffer_pool_read_requests"] ?? 0) . " requests (hit " . round(100 - 100 * ($st["Innodb_buffer_pool_reads"] ?? 0) / max(1, $st["Innodb_buffer_pool_read_requests"] ?? 1), 2) . "%) · tmp tables on disk " . ($st["Created_tmp_disk_tables"] ?? 0) . " of " . ($st["Created_tmp_tables"] ?? 0) . " · slow queries " . ($st["Slow_queries"] ?? 0) . " · uptime " . ($st["Uptime"] ?? 0) . "s\n";
              echo "--- every wa_cron setting ---\n"; foreach ($d->query("SELECT setting_key k, LEFT(setting_value, 300) v FROM hrms_settings WHERE setting_key LIKE \"wa_cron%\"")->fetchAll(PDO::FETCH_ASSOC) as $x) echo $x["k"] . " = " . $x["v"] . "\n";
              echo "--- last engine log lines ---\n"; try { foreach ($d->query("SELECT at, ok, LEFT(info, 200) i FROM wa_log WHERE kind IN (\"engine\", \"campaign\") ORDER BY id DESC LIMIT 8")->fetchAll(PDO::FETCH_ASSOC) as $x) echo $x["at"] . " ok=" . $x["ok"] . " " . $x["i"] . "\n"; } catch (Throwable $e) { echo "log: " . $e->getMessage() . "\n"; }
              echo "--- open transactions older than 20 s ---\n"; try { foreach ($d->query("SELECT trx_mysql_thread_id id, TIMESTAMPDIFF(SECOND, trx_started, NOW()) age, trx_state st, trx_rows_locked rl, trx_rows_modified rm, LEFT(COALESCE(trx_query, \"(idle)\"), 130) q FROM information_schema.INNODB_TRX WHERE TIMESTAMPDIFF(SECOND, trx_started, NOW()) > 20 ORDER BY trx_started LIMIT 12")->fetchAll(PDO::FETCH_ASSOC) as $x) echo "conn " . $x["id"] . " open " . $x["age"] . "s " . $x["st"] . " locked_rows=" . $x["rl"] . " modified=" . $x["rm"] . " | " . $x["q"] . "\n"; } catch (Throwable $e) { echo "trx: " . $e->getMessage() . "\n"; }
              echo "--- who waits for whom (lock waits) ---\n"; try { foreach ($d->query("SELECT w.requesting_thread_id rq, w.blocking_thread_id bl FROM performance_schema.data_lock_waits w LIMIT 10")->fetchAll(PDO::FETCH_ASSOC) as $x) echo "thread " . $x["rq"] . " waits for thread " . $x["bl"] . "\n"; } catch (Throwable $e) { echo "waits: " . $e->getMessage() . "\n"; }
              echo "--- can the engine write its settings? ---\n"; foreach (["wa_cron_start", "wa_cron_step", "diag_write_test"] as $k) { $t0 = microtime(true); try { $d->exec("SET SESSION innodb_lock_wait_timeout = 8"); $q = $d->prepare("INSERT INTO hrms_settings (setting_key, setting_value) VALUES (?, ?) ON DUPLICATE KEY UPDATE setting_value = VALUES(setting_value)"); $q->execute([$k, $k === "diag_write_test" ? (string)time() : ($k === "wa_cron_start" ? "0" : "diag")]); echo $k . ": written in " . round(microtime(true) - $t0, 2) . "s\n"; } catch (Throwable $e) { echo $k . ": FAILED after " . round(microtime(true) - $t0, 1) . "s - " . substr($e->getMessage(), 0, 160) . "\n"; } }
              try { $r = $d->query("SELECT setting_key, LEFT(setting_value, 60) FROM hrms_settings WHERE setting_key IN (\"wa_idx_v1\", \"wa_idx_v3\", \"wa_cron_step\")")->fetchAll(PDO::FETCH_NUM); foreach ($r as $x) echo $x[0] . " = " . $x[1] . "\n"; } catch (Throwable $e) { }
              echo "--- biggest tables ---\n"; foreach ($d->query("SELECT table_name t, table_rows r, ROUND(data_length/1048576) dmb, ROUND(index_length/1048576) imb FROM information_schema.tables WHERE table_schema = DATABASE() ORDER BY data_length DESC LIMIT 8")->fetchAll(PDO::FETCH_ASSOC) as $x) echo $x["t"] . " rows~" . $x["r"] . " data=" . $x["dmb"] . "MB idx=" . $x["imb"] . "MB\n";
              foreach (["wa_messages", "wa_camp_items", "wa_contacts"] as $tb) { echo "--- indexes of $tb ---\n"; $ix = []; foreach ($d->query("SHOW INDEX FROM $tb")->fetchAll(PDO::FETCH_ASSOC) as $x) $ix[$x["Key_name"]][] = $x["Column_name"]; foreach ($ix as $k => $c) echo $k . ": " . implode(", ", $c) . "\n"; }
            } catch (Throwable $e) { echo "DB: " . $e->getMessage() . "\n"; }
          ' "$P"
          echo "=== PHP pool of the site ==="; for f in /etc/php/8.3/fpm/pool.d/*staging*.conf /etc/php/8.3/fpm/pool.d/*.conf; do [ -r "$f" ] && { echo "$f"; grep -E "^(pm|pm\.max_children|pm\.start_servers|pm\.min_spare_servers|pm\.max_spare_servers|pm\.max_requests|request_terminate_timeout)" "$f" | head -8; break; }; done
          echo "=== heaviest answers: by total data sent (last 20000 requests) ==="; tail -n 20000 $HOME/logs/nginx/access.log 2>/dev/null | awk '{u=$7; sub(/&_t=.*/,"",u); sub(/\?_t=.*/,"",u); sub(/&phone=.*/,"",u); sub(/&id=.*/,"",u); sub(/&days=.*/,"",u); n[u]++; b[u]+=$10} END {for (k in n) printf "%9.1f MB  %6d calls  %8.0f KB avg  %s\n", b[k]/1048576, n[k], b[k]/n[k]/1024, k}' | sort -rn | head -14 | cut -c1-150
          echo "=== most called (last 20000 requests) ==="; tail -n 20000 $HOME/logs/nginx/access.log 2>/dev/null | awk '{u=$7; sub(/&_t=.*/,"",u); sub(/\?_t=.*/,"",u); sub(/&phone=.*/,"",u); sub(/&id=.*/,"",u); sub(/&days=.*/,"",u); n[u]++} END {for (k in n) print n[k], k}' | sort -rn | head -12 | cut -c1-120
          echo "=== crontab of this user ==="; crontab -l 2>&1 | head -8 | cut -c1-200; echo "=== engine hits in the access log (wa.cron) ==="; grep -c "action=wa.cron" $HOME/logs/nginx/access.log 2>/dev/null; grep "action=wa.cron" $HOME/logs/nginx/access.log 2>/dev/null | tail -3 | awk '{print $4, $5, $9}'
          echo "=== php-fpm log (if readable) ==="; tail -n 12 /var/log/php8.3-fpm.log 2>&1 | cut -c1-220
          echo "=== 502 / 504 / upstream lines (latest 8, with time) ==="; for f in $HOME/logs/nginx/error.log; do [ -r "$f" ] && grep -E "upstream|connect\(\)" "$f" | tail -n 8 | cut -c1-210; done; date
          echo "=== 5xx answers in the access log (latest 600 lines) ==="; awk '$9 ~ /^50[0-9]$/ {c[$9" "$7]++} END {for (k in c) print c[k], k}' <(tail -n 600 $HOME/logs/nginx/access.log 2>/dev/null) | sort -rn | head -8
          echo "=== last nginx errors of the site ==="; for f in $(ls -t ${P}../logs/nginx/error.log ${P}logs/nginx/error.log $HOME/logs/nginx/error.log 2>/dev/null | head -1); do tail -n 15 "$f" | cut -c1-220; done
          echo "=== webhook hits in the last access-log lines ==="; for f in $(ls -t $HOME/logs/nginx/access.log 2>/dev/null | head -1); do tail -n 2000 "$f" | awk '{print $7}' | sed 's/&_t=.*//' | sort | uniq -c | sort -rn | head -12; done
          REMOTE

# Cancels RUNAWAY duplicate database queries on the staging VPS (only the reply-pace scan of wa_messages that has run over 30 s). It cancels the query only; connections, data and everything else stay.
# Run by hand: Actions → "Cancel runaway queries (staging)" → Run workflow. Uses the same 4 secrets as the deploy.
name: Cancel runaway queries (staging)

on:
  workflow_dispatch:

jobs:
  kill:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Cancel the runaway scans
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          echo "load before: $(uptime)"
          php -r '
            $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
            require $f; try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 10]);
              $me = (int)$d->query("SELECT CONNECTION_ID()")->fetchColumn(); $n = 0;
              foreach ($d->query("SHOW FULL PROCESSLIST")->fetchAll(PDO::FETCH_ASSOC) as $x) {
                $info = (string)$x["Info"]; if ((int)$x["Id"] === $me || (int)$x["Time"] < 30 || $info === "") continue;
                if (strpos($info, "FROM wa_messages WHERE ts >=") !== false && strpos($info, "ORDER BY phone, id LIMIT 900000") !== false) { try { $d->exec("KILL QUERY " . (int)$x["Id"]); $n++; } catch (Throwable $e) { } }
              }
              echo "cancelled $n runaway queries\n"; sleep(6);
              echo "now " . count($d->query("SHOW FULL PROCESSLIST")->fetchAll()) . " connections, Threads_running = " . $d->query("SHOW GLOBAL STATUS LIKE \"Threads_running\"")->fetch(PDO::FETCH_NUM)[1] . "\n";
            } catch (Throwable $e) { echo "DB: " . $e->getMessage() . "\n"; }
          ' "$P"
          sleep 5; echo "load after: $(uptime)"
          REMOTE

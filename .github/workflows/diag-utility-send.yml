# READ-ONLY look at why the utility messages (Module B + "utility first" in campaigns) stopped moving or keep failing: the settings and the last round of Module B, what was sent / delivered / failed per hour and per number,
# the failure reasons, the numbers' quality, the state of the running campaigns, the approval state and Meta's rejection reasons of the utility messages. Counts and labels only (no phone numbers, no customer names).
# Changes nothing. Run it by hand: Actions → "Utility send check (read-only)" → Run workflow.
name: Utility send check (read-only)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Utility send state
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          cat > /tmp/us_check.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "no database: " . $e->getMessage() . "\n"; exit; }
          $all = function ($sql, $p = []) use ($d) { try { $q = $d->prepare($sql); $q->execute($p); return $q->fetchAll(PDO::FETCH_ASSOC); } catch (Throwable $e) { echo "  (n/a: " . substr($e->getMessage(), 0, 140) . ")\n"; return []; } };
          $s = function ($k) use ($d) { try { $q = $d->prepare("SELECT setting_value FROM hrms_settings WHERE setting_key = ?"); $q->execute([$k]); $v = $q->fetchColumn(); return $v === false ? "" : (string)$v; } catch (Throwable $e) { return ""; } };
          $row = function ($r) { $o = []; foreach ($r as $k => $v) $o[] = $k . "=" . $v; return "  " . implode(" · ", $o) . "\n"; };
          echo "server time now: " . date("Y-m-d H:i:s") . "\n";
          echo "\n=== settings (Module B and utility first) ===\n";
          foreach (["wa_ru_on", "wa_ru_pause_until", "wa_ru_hourly", "wa_ru_cursor", "wa_ru_submit_pause", "wa_ru_rest", "wa_u_first", "wa_u_reuse", "wa_ru_make_n", "wa_ru_last", "wa_ru_make_last", "wa_send_at", "wa_lock_ru", "wa_lock_rumake", "wa_lock_rec"] as $k) echo "  " . $k . " = " . substr($s($k), 0, 500) . "\n";
          echo "  (pause_until / lock values are unix times; now = " . time() . ")\n";
          echo "\n=== Module B: what it sent in the last 8 hours (per hour and number) ===\n";
          foreach ($all("SELECT DATE_FORMAT(r.at, '%m-%d %H:00') h, r.number_id nid, r.attempt att, COUNT(*) sent, SUM(r.ok = 1) accepted, SUM(m.status IN ('delivered', 'read')) delivered, SUM(r.ok = 0 OR m.status = 'failed') failed FROM wa_ru_log r LEFT JOIN wa_messages m ON m.wamid = r.wamid AND r.wamid <> '' WHERE r.at >= NOW() - INTERVAL 8 HOUR GROUP BY h, r.number_id, r.attempt ORDER BY h DESC, r.number_id") as $r) echo $row($r);
          echo "  Module B failures by code:\n";
          foreach ($all("SELECT err_code, LEFT(err, 90) e, COUNT(*) n FROM wa_ru_log WHERE ok = 0 AND at >= NOW() - INTERVAL 8 HOUR GROUP BY err_code, e ORDER BY n DESC LIMIT 10") as $r) echo $row($r);
          echo "  newest Module B send: "; foreach ($all("SELECT MAX(at) last_at, COUNT(*) total FROM wa_ru_log") as $r) echo $row($r);
          echo "\n=== utility inside campaigns (variant U): per hour, last 8 hours ===\n";
          foreach ($all("SELECT DATE_FORMAT(i.sent_at, '%m-%d %H:00') h, COUNT(*) sent, SUM(m.status IN ('delivered', 'read')) delivered, SUM(m.status = 'failed') failed FROM wa_camp_items i LEFT JOIN wa_messages m ON m.wamid = i.wamid AND i.wamid <> '' WHERE i.variant = 'U' AND i.status = 'sent' AND i.sent_at >= NOW() - INTERVAL 8 HOUR GROUP BY h ORDER BY h DESC") as $r) echo $row($r);
          echo "  utility items by state (all time, newest campaigns):\n";
          foreach ($all("SELECT i.camp_id, i.status, i.err_code, LEFT(i.err, 70) e, COUNT(*) n FROM wa_camp_items i WHERE i.variant = 'U' AND i.camp_id >= (SELECT MAX(id) - 12 FROM wa_campaigns) AND i.status <> 'sent' GROUP BY i.camp_id, i.status, i.err_code, e ORDER BY n DESC LIMIT 14") as $r) echo $row($r);
          echo "  which utility messages were sent from campaigns (8 h):\n";
          foreach ($all("SELECT t.name, t.category, COUNT(*) sent, SUM(m.status IN ('delivered', 'read')) delivered FROM wa_camp_items i JOIN wa_templates t ON t.id = i.tpl_used LEFT JOIN wa_messages m ON m.wamid = i.wamid AND i.wamid <> '' WHERE i.variant = 'U' AND i.sent_at >= NOW() - INTERVAL 8 HOUR GROUP BY t.id ORDER BY sent DESC LIMIT 10") as $r) echo $row($r);
          echo "\n=== numbers (labels and quality only) ===\n";
          $health = json_decode($s("wa_health"), true); if (!is_array($health)) $health = [];
          foreach ($all("SELECT id, label, waba_id FROM wa_numbers ORDER BY id") as $n) { $h = $health[(int)$n["id"]] ?? []; echo "  #" . $n["id"] . " " . ($n["label"] !== "" ? $n["label"] : "(no label)") . " · account …" . substr((string)$n["waba_id"], -4) . " · status " . ($h["status"] ?? "?") . " · quality " . ($h["quality"] ?? "?") . "\n"; }
          echo "\n=== the campaigns that are sending / paused ===\n";
          foreach ($all("SELECT id, name, status, note, last_tick, extra FROM wa_campaigns WHERE status IN ('running', 'paused', 'scheduled') ORDER BY id DESC LIMIT 8") as $c) {
            $x = json_decode((string)$c["extra"], true); $keep = []; if (is_array($x)) foreach (["u_pct", "u_off", "u_off_owner", "u_set", "u_only", "u_tpl", "u_auto", "u_restart", "kind"] as $k) if (isset($x[$k])) $keep[] = $k . "=" . json_encode($x[$k]);
            echo "campaign #" . $c["id"] . " · " . substr($c["name"], 0, 50) . " · " . $c["status"] . " · last tick " . $c["last_tick"] . " · note: " . substr((string)$c["note"], 0, 160) . "\n   utility settings: " . implode(" ", $keep) . "\n";
            $cnt = []; foreach ($all("SELECT status, COUNT(*) n FROM wa_camp_items WHERE camp_id = ? GROUP BY status", [(int)$c["id"]]) as $ci) $cnt[] = $ci["status"] . " " . $ci["n"]; echo "   people by state: " . implode(", ", $cnt) . "\n";
          }
          echo "\n=== standard follow-up messages: how many per status (not listed one by one) ===\n";
          foreach ($all("SELECT t.name, t.category, w.status, LEFT(w.reason, 80) reason, COUNT(*) n FROM wa_templates t JOIN wa_tpl_waba w ON w.tpl_id = t.id WHERE t.name LIKE 'tmph\\_fu\\_%' GROUP BY t.name, t.category, w.status, reason ORDER BY t.name") as $r) echo $row($r);
          echo "\n=== people put back by \"Start as utility\" (marked restart-utility) and what happened to them ===\n";
          foreach ($all("SELECT camp_id, status, LEFT(err, 70) e, COUNT(*) n FROM wa_camp_items WHERE variant = 'R' OR err IN ('No chosen utility message fits this person', 'Already delivered a message of ours') GROUP BY camp_id, status, e ORDER BY camp_id DESC, n DESC LIMIT 20") as $r) echo $row($r);
          echo "\n=== why the people of campaigns started again as utility were left out (skipped reasons) ===\n";
          foreach ($all("SELECT camp_id, LEFT(err, 80) e, COUNT(*) n FROM wa_camp_items WHERE status = 'skipped' AND camp_id IN (SELECT id FROM wa_campaigns WHERE extra LIKE '%u_restart%') GROUP BY camp_id, e ORDER BY camp_id DESC, n DESC LIMIT 24") as $r) echo $row($r);
          echo "  what the restart picked: "; foreach ($all("SELECT id, JSON_EXTRACT(extra, '$.u_set') AS u_set, JSON_EXTRACT(extra, '$.u_restart.n') AS n FROM wa_campaigns WHERE extra LIKE '%u_restart%' ORDER BY id DESC LIMIT 6") as $r) echo $row($r);
          echo "  the chosen messages (name · variables):\n";
          foreach ($all("SELECT t.id, t.name, LEFT(t.examples, 90) ex FROM wa_templates t WHERE t.id IN (404, 387)") as $r) echo $row($r);
          echo "\n=== the shared sending plan and locks (settings) ===\n";
          foreach ($all("SELECT setting_key k, LEFT(setting_value, 160) v FROM hrms_settings WHERE setting_key LIKE 'wa_dq%' OR setting_key LIKE 'wa_lock_%' OR setting_key LIKE 'wa_fast%' ORDER BY setting_key LIMIT 40") as $r) echo $row($r);
          echo "\n=== newest campaign log lines (any kind, 20) ===\n";
          foreach ($all("SELECT at, kind, ok, info FROM wa_log WHERE kind IN ('campaign', 'engine') ORDER BY id DESC LIMIT 20") as $r) echo "  " . $r["at"] . " [" . $r["kind"] . "/" . ($r["ok"] ? "ok" : "FAIL") . "] " . substr($r["info"], 0, 180) . "\n";
          echo "\n=== utility messages made in the last 24 h: Meta's status and reason ===\n";
          foreach ($all("SELECT w.status, LEFT(w.reason, 110) reason, COUNT(*) n FROM wa_templates t JOIN wa_tpl_waba w ON w.tpl_id = t.id WHERE t.category = 'UTILITY' AND t.created_at >= NOW() - INTERVAL 1 DAY GROUP BY w.status, reason ORDER BY n DESC LIMIT 15") as $r) echo $row($r);
          echo "  utility messages without any Meta row (never sent): "; foreach ($all("SELECT COUNT(*) n FROM wa_templates t WHERE t.category = 'UTILITY' AND t.created_at >= NOW() - INTERVAL 3 DAY AND NOT EXISTS (SELECT 1 FROM wa_tpl_waba w WHERE w.tpl_id = t.id)") as $r) echo $row($r);
          echo "\n=== FAILED people of the running campaigns: by Meta code, and how many Module B has already given utility ===\n";
          foreach ($all("SELECT i.err_code, LEFT(i.err, 60) e, COUNT(*) n, SUM(EXISTS (SELECT 1 FROM wa_ru_log l WHERE l.item_id = i.id)) got_utility FROM wa_camp_items i WHERE i.status = 'failed' AND i.camp_id IN (SELECT id FROM wa_campaigns WHERE status = 'running') GROUP BY i.err_code, e ORDER BY n DESC LIMIT 12") as $r) echo $row($r);
          echo "\n=== TODAY after 12:00: people whose marketing failed / was held, by what utility message can fit them ===\n";
          foreach ($all("SELECT x.cls, COUNT(DISTINCT x.phone) people, SUM(x.got) got_utility FROM (SELECT i.phone, EXISTS (SELECT 1 FROM wa_ru_log l WHERE l.phone COLLATE utf8mb4_unicode_ci = i.phone COLLATE utf8mb4_unicode_ci AND l.ok = 1) got, CASE WHEN i.err_code IN (131026, 131021, 131051, 100, 131008, 131009, 131047, 131048) THEN 'never (not on WhatsApp / blocked)' WHEN c.optout = 1 THEN 'opted out' WHEN c.last_in_at >= NOW() - INTERVAL 90 DAY THEN 'wrote to us in 90 days (enquiry message fits)' ELSE 'no recent chat (only the welcome message fits)' END cls FROM wa_camp_items i LEFT JOIN wa_contacts c ON c.phone COLLATE utf8mb4_unicode_ci = i.phone COLLATE utf8mb4_unicode_ci WHERE (i.status = 'failed' OR (i.status IN ('skipped', 'retry') AND i.err_code = 131049) OR (i.status = 'sent' AND i.last_status = 'failed')) AND i.sent_at >= CURDATE() + INTERVAL 12 HOUR) x GROUP BY x.cls") as $r) echo $row($r);
          foreach ($all("SELECT i.err_code, COUNT(DISTINCT i.phone) people FROM wa_camp_items i WHERE (i.status = 'failed' OR (i.status IN ('skipped', 'retry') AND i.err_code = 131049) OR (i.status = 'sent' AND i.last_status = 'failed')) AND i.sent_at >= CURDATE() + INTERVAL 12 HOUR GROUP BY i.err_code ORDER BY people DESC LIMIT 8") as $r) echo $row($r);
          echo "  standard messages usable now (approved per account):\n";
          foreach ($all("SELECT t.name, SUM(w.status = 'APPROVED') approved_accounts, COUNT(*) accounts FROM wa_templates t JOIN wa_tpl_waba w ON w.tpl_id = t.id WHERE t.name LIKE 'tmph\\\\_fu\\\\_%' AND t.category = 'UTILITY' GROUP BY t.name") as $r) echo $row($r);
          echo "  of the 'no recent chat' people: how many have a shop order (the order utility message fits them)\n";
          try { $ph = $d->query("SELECT DISTINCT i.phone FROM wa_camp_items i LEFT JOIN wa_contacts c ON c.phone COLLATE utf8mb4_unicode_ci = i.phone COLLATE utf8mb4_unicode_ci WHERE (i.status = 'failed' OR (i.status IN ('skipped', 'retry') AND i.err_code = 131049) OR (i.status = 'sent' AND i.last_status = 'failed')) AND i.sent_at >= CURDATE() + INTERVAL 12 HOUR AND i.err_code NOT IN (131026, 131021, 131051, 100, 131008, 131009, 131047, 131048) AND COALESCE(c.optout, 0) = 0 AND (c.last_in_at IS NULL OR c.last_in_at < NOW() - INTERVAL 90 DAY)")->fetchAll(PDO::FETCH_COLUMN);
            $om = []; foreach ($d->query("SELECT phone, MAX(created_at) at FROM shop_orders WHERE phone <> '' AND (financial_status IS NULL OR financial_status NOT IN ('refunded', 'voided')) GROUP BY phone")->fetchAll() as $r) { $k = substr(preg_replace('/\\D+/', '', (string)$r['phone']), -10); if (strlen($k) === 10 && (!isset($om[$k]) || $om[$k] < $r['at'])) $om[$k] = $r['at']; }
            $b = ['total' => count($ph), 'order_60d' => 0, 'order_120d' => 0, 'order_180d' => 0, 'order_ever' => 0, 'no_order_at_all' => 0];
            foreach ($ph as $p0) { $k = substr(preg_replace('/\\D+/', '', (string)$p0), -10); $at = $om[$k] ?? ''; if ($at === '') { $b['no_order_at_all']++; continue; } $b['order_ever']++; $age = (time() - strtotime($at)) / 86400; if ($age <= 60) $b['order_60d']++; if ($age <= 120) $b['order_120d']++; if ($age <= 180) $b['order_180d']++; }
            echo $row($b); } catch (Throwable $e) { echo "  (n/a: " . substr($e->getMessage(), 0, 140) . ")\n"; }
          echo "\n=== Module B per 5 minutes (last 90 min): sent / delivered / failed / still waiting ===\n";
          foreach ($all("SELECT DATE_FORMAT(r.at - INTERVAL (MINUTE(r.at) % 5) MINUTE, '%H:%i') slot, COUNT(*) sent, SUM(m.status IN ('delivered', 'read')) delivered, SUM(r.ok = 0 OR m.status = 'failed') failed, SUM(r.ok = 1 AND (m.status IS NULL OR m.status IN ('sent', 'accepted'))) waiting FROM wa_ru_log r LEFT JOIN wa_messages m ON m.wamid = r.wamid AND r.wamid <> '' WHERE r.at >= NOW() - INTERVAL 90 MINUTE GROUP BY slot ORDER BY slot DESC") as $r) echo $row($r);
          echo "  now (db time): " . $d->query("SELECT NOW()")->fetchColumn() . " · pause_until " . $s("wa_ru_pause_until") . " · held_off2 " . $s("wa_ru_held_off2") . " · brake_since " . $s("wa_ru_brake_since") . " · time " . time() . "\n";
          echo "\n=== Module B FAILED sends between 01:30 and 02:10 (db time): by error code, number and message ===\n";
          foreach ($all("SELECT r.kind, r.err_code, i.err_code item_code, r.number_id, r.tpl_id, COUNT(*) n, LEFT(MAX(r.err), 90) err FROM wa_ru_log r LEFT JOIN wa_camp_items i ON i.id = r.item_id WHERE r.at >= CONCAT(CURDATE(), ' 01:30:00') AND r.at < CONCAT(CURDATE(), ' 02:10:00') AND (r.ok = 0 OR i.status = 'failed') GROUP BY r.kind, r.err_code, i.err_code, r.number_id, r.tpl_id ORDER BY n DESC LIMIT 25") as $r) echo $row($r);
          echo "\n=== Module B failures by code, last 3 h vs the 01:00-01:30 good period ===\n";
          foreach ($all("SELECT CASE WHEN r.at < CONCAT(CURDATE(), ' 01:30:00') THEN 'before 01:30' ELSE 'after 01:30' END part, r.err_code, i.err_code item_code, COUNT(*) n FROM wa_ru_log r LEFT JOIN wa_camp_items i ON i.id = r.item_id WHERE r.at >= NOW() - INTERVAL 5 HOUR AND (r.ok = 0 OR i.status = 'failed') GROUP BY part, r.err_code, i.err_code ORDER BY part, n DESC LIMIT 30") as $r) echo $row($r);
          echo "\n=== per campaign: Module B sends in the last 30 min / 24 h, and failed people of the last 90 min still without a message ===\n";
          foreach ($all("SELECT c.id, LEFT(c.name, 34) name, c.status, (SELECT COUNT(*) FROM wa_ru_log l WHERE l.camp_id = c.id AND l.at >= NOW() - INTERVAL 30 MINUTE) last30m, (SELECT COUNT(*) FROM wa_ru_log l WHERE l.camp_id = c.id AND l.at >= NOW() - INTERVAL 24 HOUR) last24h, (SELECT COUNT(*) FROM wa_camp_items i WHERE i.camp_id = c.id AND i.status = 'failed' AND i.err_code NOT IN (131049, 131026, 131021, 131051, 100, 131008, 131009, 131047, 131048) AND i.sent_at >= NOW() - INTERVAL 90 MINUTE AND NOT EXISTS (SELECT 1 FROM wa_ru_log l2 WHERE l2.item_id = i.id)) wait90 FROM wa_campaigns c WHERE c.status = 'done' AND c.id IN (SELECT camp_id FROM wa_ru_log WHERE at >= NOW() - INTERVAL 3 HOUR) ORDER BY last30m DESC LIMIT 25") as $r) echo $row($r);
          echo "\n=== campaign (marketing) messages sent per 5 minutes, last 60 min ===\n";
          foreach ($all("SELECT DATE_FORMAT(ts - INTERVAL (MINUTE(ts) % 5) MINUTE, '%H:%i') slot, COUNT(*) pushed, SUM(status IN ('delivered', 'read')) delivered, SUM(status = 'failed') failed FROM wa_messages WHERE dir = 'out' AND who = 'campaign' AND mtype = 'template' AND ts >= NOW() - INTERVAL 60 MINUTE GROUP BY slot ORDER BY MIN(ts) DESC") as $r) echo $row($r);
          echo "  plan settings now: "; foreach (["wa_dq_on", "wa_dq_daily", "wa_dq_budget", "wa_dq_auto", "wa_dq_hourly", "wa_dq_pace", "wa_dq_nolimit"] as $k) echo $k . "=" . $s($k) . " "; echo "\n";
          echo "\n=== OPTIONS for the two paused import campaigns: their message, their people, and the best delivering approved marketing messages (14 days) ===\n";
          foreach ($all("SELECT c.id, LEFT(c.name, 30) name, c.status, t.name tpl, (SELECT COUNT(*) FROM wa_camp_items i WHERE i.camp_id = c.id AND i.status = 'queued') queued, (SELECT COUNT(*) FROM wa_camp_items i WHERE i.camp_id = c.id AND i.status = 'queued' AND EXISTS (SELECT 1 FROM wa_messages m WHERE m.phone COLLATE utf8mb4_unicode_ci = i.phone COLLATE utf8mb4_unicode_ci AND m.dir = 'out' AND m.status IN ('delivered', 'read') AND m.ts >= NOW() - INTERVAL 30 DAY)) queued_reached_30d, (SELECT COUNT(*) FROM wa_camp_items i WHERE i.camp_id = c.id AND i.status = 'queued' AND EXISTS (SELECT 1 FROM wa_contacts k WHERE k.phone COLLATE utf8mb4_unicode_ci = i.phone COLLATE utf8mb4_unicode_ci AND k.last_in_at >= NOW() - INTERVAL 90 DAY)) queued_wrote_90d FROM wa_campaigns c JOIN wa_templates t ON t.id = c.tpl_id WHERE c.id IN (517, 518)") as $r) echo $row($r);
          foreach ($all("SELECT t.id, t.name, COUNT(*) sent, ROUND(100 * SUM(m.status IN ('delivered', 'read')) / COUNT(*)) deliv_pct FROM wa_camp_items i JOIN wa_templates t ON t.id = i.tpl_used JOIN wa_messages m ON m.wamid = i.wamid AND i.wamid <> '' WHERE i.sent_at >= NOW() - INTERVAL 14 DAY AND t.category = 'MARKETING' AND t.name NOT LIKE 'tmph\\\\_fu\\\\_%' GROUP BY t.id, t.name HAVING sent >= 1500 ORDER BY deliv_pct DESC LIMIT 8") as $r) echo $row($r);
          echo "\n=== welcome message (open_welcome) ===\n";
          foreach ($all("SELECT t.id, t.name, t.category, t.created_at, t.relabelled_at, (SELECT GROUP_CONCAT(CONCAT(w.status, ':', LEFT(w.reason, 60)) SEPARATOR ' | ') FROM wa_tpl_waba w WHERE w.tpl_id = t.id) st FROM wa_templates t WHERE t.name LIKE 'tmph\\\\_fu\\\\_open%' OR t.extra LIKE '%open_welcome%'") as $r) echo $row($r);
          foreach ($all("SELECT at, ok, info FROM wa_log WHERE info LIKE '%follow-ups made%' OR info LIKE '%open_welcome%' ORDER BY id DESC LIMIT 6") as $r) echo $row($r);
          echo "\n=== log lines about utility (newest 25) ===\n";
          foreach ($all("SELECT at, kind, ok, info FROM wa_log WHERE info LIKE '%tility%' ORDER BY id DESC LIMIT 25") as $r) echo "  " . $r["at"] . " [" . $r["kind"] . "/" . ($r["ok"] ? "ok" : "FAIL") . "] " . substr($r["info"], 0, 200) . "\n";
          PHP
          php /tmp/us_check.php "$P"; rm -f /tmp/us_check.php
          REMOTE

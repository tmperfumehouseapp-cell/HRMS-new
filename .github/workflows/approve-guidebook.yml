# ONE-OFF, owner-requested: approve the waiting guidebook draft of the given version (same steps as the Approve button: the draft becomes live, the old live one becomes old, its corrections are marked used).
# Does nothing if that version is not a waiting draft. Run by hand: Actions -> "Approve guidebook draft (one-off)".
name: Approve guidebook draft (one-off)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Draft version to approve (digits only)"
        required: true

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Approve
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          VER: ${{ github.event.inputs.version }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" "$(printf '%s' "$VER" | tr -cd '0-9')" <<'REMOTE'
          P="$1"
          cat > /tmp/gb_approve.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f; $v = (int)($argv[2] ?? 0); if ($v <= 0) { echo "no version given\n"; exit; }
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 8, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
            $q = $d->prepare("SELECT id, version, status FROM lib_guide WHERE version = ? AND status = 'draft' ORDER BY id DESC LIMIT 1"); $q->execute([$v]); $r = $q->fetch(PDO::FETCH_ASSOC);
            if (!$r) { echo "version $v is not a waiting draft - nothing changed\n"; foreach ($d->query("SELECT version, status FROM lib_guide ORDER BY version DESC LIMIT 6")->fetchAll(PDO::FETCH_ASSOC) as $x) echo "  v" . $x["version"] . " " . $x["status"] . "\n"; exit; }
            $d->beginTransaction();
            $d->exec("UPDATE lib_guide SET status = 'old' WHERE status = 'live'");
            $d->prepare("UPDATE lib_guide SET status = 'live', approved_at = NOW(), approved_by = ? WHERE id = ?")->execute(["Owner (asked in chat)", (int)$r["id"]]);
            try { $d->prepare("UPDATE lib_feedback SET used = -1 WHERE used = ?")->execute([$v]); } catch (Throwable $e) { }
            $d->commit(); echo "guidebook v$v approved - it is now the live guidebook\n";
            foreach ($d->query("SELECT version, status FROM lib_guide ORDER BY version DESC LIMIT 4")->fetchAll(PDO::FETCH_ASSOC) as $x) echo "  v" . $x["version"] . " " . $x["status"] . "\n";
          } catch (Throwable $e) { echo "failed: " . substr($e->getMessage(), 0, 160) . "\n"; }
          PHP
          php /tmp/gb_approve.php "$P" "$2"; rm -f /tmp/gb_approve.php
          REMOTE

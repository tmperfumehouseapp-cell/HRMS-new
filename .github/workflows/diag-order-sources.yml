# READ-ONLY (counts only): which kinds of order today's business day holds and which of them carry ML / bottle colours / Dress to Impress, so those boxes can count every order. No names, phones or order numbers.
# Changes nothing. Run it by hand: Actions -> "Order sources and details today (read-only)" -> Run workflow.
name: Order sources and details today (read-only)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Order kinds today
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          cat > /tmp/os_check.php <<'PHP'
          <?php
          require $argv[1] . "empmanagment/config.php";
          $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
          date_default_timezone_set("Asia/Kolkata"); $from = date("G") >= 10 ? date("Y-m-d 10:00:00") : date("Y-m-d 10:00:00", time() - 86400); echo "business day from $from (now " . date("H:i") . ")\n";
          $p = function ($sql, $a = []) use ($d) { try { $q = $d->prepare($sql); $q->execute($a); foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) echo "  " . json_encode($r) . "\n"; } catch (Throwable $e) { echo "  n/a: " . substr($e->getMessage(), 0, 140) . "\n"; } };
          echo "shop_orders (Shopify + HRMS-made WM-): by store, made in HRMS (id >= 7e15), with ML / colours / DTI\n";
          $p("SELECT store_key, shopify_id >= 7000000000000000 hrms_made, LEFT(order_name, 3) pfx, COUNT(*) n, SUM(ml_total > 0) has_ml, SUM(colors IS NOT NULL AND colors <> '') has_colors, SUM(dti IS NOT NULL) dti_checked, ROUND(SUM(total)) amt FROM shop_orders WHERE created_at >= ? GROUP BY store_key, hrms_made, pfx", [$from]);
          echo "manual_orders: by kind (channel / quick-entry batch / marketplace)\n";
          $p("SELECT channel, batch <> '' quick_entry, COUNT(*) n, ROUND(SUM(total)) amt, SUM(items) items FROM manual_orders WHERE order_date >= ? GROUP BY channel, quick_entry", [$from]);
          echo "wmo_order (WhatsApp manual order): by status, with lines\n";
          $p("SELECT status, COUNT(*) n, SUM(lines_json IS NOT NULL AND lines_json <> '' AND lines_json <> '[]') has_lines, SUM(ml > 0) has_ml FROM wmo_order WHERE created_at >= ? GROUP BY status", [$from]);
          echo "order_allocations today: by source\n";
          $p("SELECT source, COUNT(*) n FROM order_allocations WHERE allocated_at >= ? GROUP BY source", [$from]);
          PHP
          php /tmp/os_check.php "$P"; rm -f /tmp/os_check.php
          REMOTE

# ONE database change, run by hand: adds the index k_sent (sent_at) to wa_camp_items (about 2 million rows).
# Why: the "waiting today, by reason" count (query 4) reads every row of that table because nothing indexes sent_at (EXPLAIN: type ALL, 2,071,786 rows).
# Safe: online build (ALGORITHM=INPLACE, LOCK=NONE), gives up after 10 s if it cannot get its turn (so it never makes other queries queue behind it) and retries 5 times. Nothing is deleted or changed.
# To undo: ALTER TABLE wa_camp_items DROP INDEX k_sent;
name: Add database index k_sent on wa_camp_items

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Connect
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config

      - name: Add the index
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"
          cat > /tmp/dbidx_add.php <<'PHP'
          <?php
          $f = $argv[1] . "empmanagment/config.php"; if (!is_file($f)) { echo "config.php not found\n"; exit; }
          require $f;
          try { $d = new PDO("mysql:host=" . (defined("DB_HOST") ? DB_HOST : "127.0.0.1") . ";dbname=" . DB_NAME . ";charset=utf8mb4", DB_USER, DB_PASS, [PDO::ATTR_TIMEOUT => 20, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); } catch (Throwable $e) { echo "database: " . $e->getMessage() . "\n"; exit; }
          $has = function () use ($d) { foreach ($d->query("SHOW INDEX FROM wa_camp_items")->fetchAll(PDO::FETCH_ASSOC) as $x) if ($x["Key_name"] === "k_sent") return true; return false; };
          if ($has()) { echo "k_sent already exists: nothing to do\n"; } else {
            $d->exec("SET SESSION lock_wait_timeout = 10");
            for ($i = 1; $i <= 5; $i++) {
              $t = microtime(true);
              try { $d->exec("ALTER TABLE wa_camp_items ADD INDEX k_sent (sent_at), ALGORITHM=INPLACE, LOCK=NONE"); echo "try $i: index added in " . round(microtime(true) - $t, 1) . " s\n"; break; }
              catch (Throwable $e) { echo "try $i: " . substr($e->getMessage(), 0, 160) . " (after " . round(microtime(true) - $t, 1) . " s)\n"; if ($has()) { echo "the index is there\n"; break; } sleep(15); }
            }
          }
          echo "k_sent present now: " . ($has() ? "YES" : "NO") . "\n";
          $q = $d->prepare("EXPLAIN SELECT i.id FROM wa_camp_items i WHERE i.sent_at >= ?"); $q->execute([date("Y-m-d 10:00:00")]);
          foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) echo "EXPLAIN sent_at filter: type=" . $r["type"] . " key=" . ($r["key"] ?? "NONE") . " rows=" . $r["rows"] . "\n";
          PHP
          php /tmp/dbidx_add.php "$P"; rm -f /tmp/dbidx_add.php
          REMOTE

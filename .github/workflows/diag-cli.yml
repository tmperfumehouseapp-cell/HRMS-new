# One command-line Lineup sending round on the VPS (cron_line.php test): how long it takes, what it sends, the load before and after. It sends what is due, like the cron job does.
name: Lineup CLI round (one copy)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run one copy
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          ssh-keyscan -T 15 -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  IdentityFile ~/.ssh/staging_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' > ~/.ssh/config
          ssh "$STAGING_USER@$STAGING_HOST" 'bash -s' "$STAGING_PATH" <<'REMOTE' || true
          P="$1"; echo "start $(date +%T) load $(cut -d' ' -f1-3 /proc/loadavg) fpm $(pgrep -fc 'php-fpm: pool')"
          T0=$(date +%s); timeout 90 php "$P"empmanagment/cron_line.php test 2>&1 | head -c 1500; echo; echo "rc=$? took $(( $(date +%s) - T0 )) s · end load $(cut -d' ' -f1-3 /proc/loadavg)"
          echo "php: $(php -v | head -1) · memory_limit $(php -r 'echo ini_get("memory_limit");') · cron_bot has spawn: $(grep -c cron_line "$P"empmanagment/cron_bot.php)"
          REMOTE

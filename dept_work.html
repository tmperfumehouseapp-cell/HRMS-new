<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HRMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Shopping list — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<link rel="stylesheet" href="assets/css/boss.css?v=1">
<style>
  .wk-note{background:#fff8ea;border-radius:16px;padding:12px 15px;font-size:13.5px;color:#6b4a00;line-height:1.5;margin-bottom:14px;} .wk-note b{color:#4d3500;}
  .wk-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px;}
  .wk-stat{background:#fff;border-radius:22px;padding:15px 18px;box-shadow:0 1px 2px rgba(20,22,26,.04);} .wk-stat small{display:block;font-size:12px;color:var(--muted);font-weight:600;} .wk-stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:3px;}
  .wk-stat.dark{background:#14161a;} .wk-stat.dark small{color:#aeb4c0;} .wk-stat.dark b{color:#fff;} .wk-stat b.bad{color:#d9423b;}
  .wk-chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;align-items:center;} .wk-chips::-webkit-scrollbar{display:none;}
  .wk-chip{flex:none;border:1px solid var(--line);background:#f1f3f6;border-radius:99px;padding:8px 15px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;color:#3a3f4a;}
  .wk-chip.on{background:#fff1e6;border-color:#ffd2b0;color:#c2540a;} .wk-chip em{font-style:normal;background:#e8590c;color:#fff;border-radius:9px;font-size:11px;padding:0 6px;margin-left:6px;line-height:16px;display:inline-block;}
  .wk-grp{margin-left:auto;flex:none;} .wk-grp select{border:0;background:#f1f3f6;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;font-family:inherit;color:#3a3f4a;}
  .wk-bulk{background:#14161a;color:#fff;border-radius:22px;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;position:sticky;top:8px;z-index:5;}
  .wk-bulk b{font-size:14px;} .wk-bulk .lb{font-size:12.5px;color:#c9ced8;}
  .wk-bulk select,.wk-bulk input[type=datetime-local]{background:#2a2e36;color:#fff;border:0;border-radius:99px;padding:9px 14px;font-weight:700;font-size:13.5px;font-family:inherit;max-width:100%;min-height:38px;}
  .wk-bulk .go{background:#ff7a2f;color:#fff;border:0;border-radius:99px;padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;min-height:40px;} .wk-bulk .go[disabled]{opacity:.45;cursor:not-allowed;}
  .wk-bulk .x{background:#2a2e36;border:0;color:#fff;cursor:pointer;font-size:13px;font-family:inherit;border-radius:99px;padding:9px 16px;font-weight:700;}
  .wk-sug{background:#e8f0fe;color:#24428f;border-radius:14px;padding:9px 13px;font-size:13px;line-height:1.5;margin:0 0 10px;}
  .wk-head,.wk-row{display:grid;grid-template-columns:28px minmax(0,1.5fr) minmax(0,1fr) 84px minmax(0,1fr) minmax(0,1.5fr) minmax(0,1.6fr);gap:12px;align-items:center;}
  .wk-head{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 4px;}
  .wk-row{padding:12px 4px;border-top:1px solid var(--line);} .wk-row b{font-weight:800;font-size:14.5px;} .wk-row .nb{font-size:13px;color:var(--muted);} .wk-row .pl{font-size:13.5px;}
  .wk-row .sn{font-size:13.5px;font-weight:600;} .wk-row .sn.late{color:#c0261e;font-weight:800;}
  .wk-row input[type=checkbox],.wk-gh input[type=checkbox],.wk-head input[type=checkbox]{width:20px;height:20px;accent-color:#14161a;}
  .wk-gh{display:flex;align-items:center;gap:10px;padding:14px 4px 6px;font-weight:800;font-size:13.5px;border-top:1px solid var(--line);} .wk-gh small{font-weight:600;color:var(--muted);}
  .wk-st{display:inline-block;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:800;white-space:nowrap;} .wk-st.empty{background:#fde8e6;color:#b3261e;} .wk-st.low{background:#fff1cc;color:#8a5a00;} .wk-st.daily,.wk-st.cycle{background:#e8f0fe;color:#2456b3;}
  .wk-who{display:inline-flex;align-items:center;gap:7px;background:#f1f3f6;border-radius:99px;padding:5px 12px 5px 6px;font-weight:700;font-size:13px;max-width:100%;}
  .wk-who i{font-style:normal;width:22px;height:22px;border-radius:50%;background:#ffe2cc;color:#c2540a;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none;}
  .wk-tag{display:inline-block;margin-left:6px;border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:800;background:#e3edff;color:#2456b3;} .wk-tag.no{background:#f1f3f6;color:#6f7480;} .wk-tag.bad{background:#fde8e6;color:#b3261e;} .wk-tag.ok{background:#dcf4e6;color:#0f6b43;} .wk-tag.warn{background:#fff3dc;color:#8a5a00;}
  .wk-sg{font-size:12.5px;color:var(--muted);line-height:1.4;} .wk-back{border:0;background:none;color:#6f7480;font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;padding:0;margin-left:6px;}
  .wk-foot{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:12px;} .wk-foot b{color:var(--ink);}
  .wk-trip{padding:14px 0;border-top:1px solid var(--line);} .wk-trip:first-of-type{border-top:0;}
  .wk-trip .top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;} .wk-trip .tt{font-weight:800;font-size:15px;} .wk-trip .s{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45;}
  .wk-trip .offs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;} .wk-trip .offs span{background:#f1f3f6;border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:700;}
  .wk-trip .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  /* buyer screen */
  .wk-me{max-width:560px;margin:0 auto;}
  .wk-me h2.big{font-size:22px;font-weight:800;margin:2px 0 2px;letter-spacing:-.01em;}
  .wk-li{display:flex;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--line);} .wk-li:first-child{border-top:0;}
  .wk-li input[type=checkbox]{width:24px;height:24px;accent-color:#14161a;flex:none;} .wk-li .nm{font-weight:800;font-size:15.5px;} .wk-li .nm span{font-weight:500;} .wk-li .of{font-size:12.5px;color:var(--muted);margin-top:2px;} .wk-li > div{flex:1;min-width:0;}
  .wk-li.off .nm{color:#8a90a0;text-decoration:line-through;}
  .wk-big{width:100%;border-radius:99px;padding:15px 18px;font-weight:800;font-size:15.5px;cursor:pointer;font-family:inherit;border:1px solid #14161a;background:#14161a;color:#fff;margin-top:10px;min-height:52px;} .wk-big.alt{background:#fff;color:#14161a;} .wk-big.go{background:#ff7a2f;border-color:#ff7a2f;} .wk-big[disabled]{opacity:.5;}
  .wk-amt{display:flex;align-items:center;gap:10px;margin-bottom:8px;} .wk-amt label{flex:1;font-weight:700;font-size:14px;} .wk-amt input{width:130px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;font-size:17px;font-weight:700;font-family:inherit;text-align:right;}
  .wk-tot{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 10px;}
  .wk-pay{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px;} .wk-pay button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:11px 16px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;min-height:44px;} .wk-pay button.on{background:#14161a;color:#fff;border-color:#14161a;}
  .wk-drop{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed #cdd1db;background:#f8f9fb;border-radius:20px;min-height:96px;font-weight:700;color:#7a8090;cursor:pointer;text-align:center;padding:10px;position:relative;overflow:hidden;} .wk-drop input{display:none;}
  .wk-drop img{max-height:190px;max-width:100%;border-radius:12px;} .wk-drop.has{border-style:solid;border-color:#9bd5b6;background:#effaf3;color:#0f6b43;}
  .wk-warn{border-radius:14px;padding:10px 13px;font-size:13px;line-height:1.45;margin:8px 0;} .wk-warn.w{background:#fff3dc;color:#7a4e00;} .wk-warn.i{background:#e8f0fe;color:#2456b3;} .wk-warn.b{background:#fde8e6;color:#9b231c;font-weight:700;} .wk-warn.g{background:#e6f6ee;color:#0f6b43;}
  .wk-pop small.k{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.03em;} .wk-pop h3{font-size:19px;margin:6px 0 4px;} .wk-pop p{font-size:13.5px;color:#4a505c;line-height:1.5;margin:0 0 14px;}
  @media (max-width:820px){
    .wk-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;} .wk-stat b{font-size:22px;}
    .wk-head{display:none;}
    .wk-row{grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:"c i s" ". o n" ". g g" ". k k";row-gap:5px;padding:12px 2px;}
    .wk-row > :nth-child(1){grid-area:c;} .wk-row > :nth-child(2){grid-area:i;} .wk-row > :nth-child(3){grid-area:o;} .wk-row > :nth-child(4){grid-area:s;justify-self:end;} .wk-row > :nth-child(5){grid-area:n;justify-self:end;} .wk-row > :nth-child(6){grid-area:g;} .wk-row > :nth-child(7){grid-area:k;}
    .wk-bulk{border-radius:18px;} .wk-grp{margin-left:0;}
  }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><div><h1>Shopping list</h1><div class="bd-sub" id="sub">Everything that must be bought, for every office and the store, in one place.</div></div><div id="topBtns"></div></div>
    <div class="content"><div class="bd" id="root"><div class="bd-empty">Loading…</div></div></div>
  </main>
</div>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/api.js?v=9"></script>
<script src="assets/js/layout.js?v=22"></script>
<script src="assets/js/boss_common.js?v=2"></script>
<script>
  guardPage();
  renderSidebar('dept_work');
  const { esc, $, toast, inr } = BD;
  const QS = new URLSearchParams(location.search);
  let MODE = QS.get('me') === '1' ? 'me' : 'boss';
  let TAB = QS.get('tab') || 'buy', CUR = QS.get('place') || '', GROUP = 'office';
  let L = null, M = null;
  const SEL = new Set();
  const BULK = { who: '', due: '', custom: '' };
  const REASON = { daily: ['Every day', 'daily'], low: ['Low', 'low'], empty: ['Empty', 'empty'], cycle: ['Cycle up', 'cycle'], min: ['Below min', 'low'], missing: ['Missing', 'empty'], new: ['New', 'cycle'] };   // min / missing / new: needs made by registered places (Pantry ...)
  const hiTag = (r) => r.name_hi ? ' <span class="bd-sub" style="font-weight:600">' + esc(r.name_hi) + '</span>' : '';
  const whereTag = (r) => esc(r.place_name) + (r.zone ? ' \u00b7 ' + esc(r.zone) : '');
  const PAY = { upi: 'Company UPI', credit: 'Supplier ledger', pocket: 'My own pocket', cash: 'Cash ⚠' };
  const PAYN = { upi: 'Company UPI', credit: 'Supplier ledger', pocket: 'Own pocket', cash: 'Cash' };
  const ini = (n) => String(n || '?').trim().charAt(0).toUpperCase();
  const q = (n) => String(Math.round(Number(n) * 100) / 100);
  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':00';
  const t12 = (d) => { let h = d.getHours(); const m = d.getMinutes(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + (m ? ':' + pad(m) : ':00') + ' ' + ap; };

  async function shotOpen(name) {
    try { const r = await fetch(api.buildUrl('dp.su_file', { name }), { headers: { Authorization: 'Bearer ' + api.token() } }); if (!r.ok) throw 0; window.open(URL.createObjectURL(await r.blob()), '_blank'); } catch (e) { toast('Cannot open the picture.', true); }
  }
  const shotBtn = (n, label) => n ? '<button class="bd-btn sm" data-shot="' + esc(n) + '" type="button">' + label + '</button>' : '';

  /* ====================================================== load ====================================================== */
  async function load() {
    if (MODE === 'boss') {
      try { L = await api.get('dp.wk_list', { tab: TAB, place: CUR }); }
      catch (e) { if (/Buyers use/.test(e.message)) { MODE = 'me'; } else { $('root').innerHTML = '<div class="bd-card"><div class="bd-empty"><b>Cannot open the Shopping list</b>' + esc(e.message) + '</div></div>'; return; } }
    }
    if (MODE === 'me') {
      try { M = await api.get('dp.wk_mine'); } catch (e) { $('root').innerHTML = '<div class="bd-card"><div class="bd-empty"><b>Cannot open your shopping</b>' + esc(e.message) + '</div></div>'; return; } }
    render();
  }
  function render() { return MODE === 'me' ? renderMe() : renderBoss(); }
  const topBtns = () => {
    let h = '';
    if (MODE === 'me' && IS_BOSS) h = '<a class="bd-btn sm" href="dept_work.html" id="goBoss">Whole list</a>';
    if (MODE === 'boss') h = '<a class="bd-btn sm" href="dept_work.html?me=1" id="goMe">My shopping</a> ' + (L && L.can.settings ? '<button class="bd-btn sm" id="wkSet" type="button">Settings</button>' : '');
    $('topBtns').innerHTML = h;
  };
  let IS_BOSS = false;

  /* ====================================================== boss view ====================================================== */
  function tabStrip() {
    const S = L.stats;
    const t = (k, label, n) => '<button data-tab="' + k + '" class="' + (TAB === k ? 'on' : '') + '" type="button">' + label + (n !== undefined && n !== null ? ' · ' + n : '') + '</button>';
    return '<div class="bd-tabs">' + t('buy', 'To buy', S.to_buy) + t('bought', 'Bought', S.bought) + t('proof', 'Proof missing', S.waiting_proof)
      + '<button data-go="dept_fix.html" type="button">To fix</button><button data-go="dept_supplies.html?tab=suppliers" type="button">Suppliers</button><button data-go="dept_supplies.html?tab=reimb" type="button">Pay back</button><button data-go="dept_supplies.html?tab=check" type="button">Check</button><button data-go="dept_supplies.html?tab=list" type="button">Items</button></div>';
  }
  function renderBoss() {
    IS_BOSS = true; topBtns();
    const S = L.stats; let h = '';
    if (!L.live) h += '<div class="wk-note"><b>Not live yet.</b> You can look around, but nothing can be given and nobody is asked or fined. Answer Claude\'s questions in <a href="boss_questions.html"><b>Boss &gt; Questions</b></a> (Office supplies) and press "This is right, make it live".</div>';
    h += '<div class="wk-stats"><div class="wk-stat dark"><small>To buy today</small><b>' + S.to_buy + ' item' + (S.to_buy === 1 ? '' : 's') + '</b></div>'
      + '<div class="wk-stat"><small>Not given to anybody yet</small><b class="' + (S.not_given ? 'bad' : '') + '">' + S.not_given + '</b></div>'
      + '<div class="wk-stat"><small>Bought, waiting for proof</small><b>' + S.waiting_proof + '</b></div>'
      + '<div class="wk-stat"><small>Overdue</small><b class="' + (S.overdue ? 'bad' : '') + '">' + S.overdue + '</b></div></div>';
    h += tabStrip();
    h += '<div class="bd-card">' + chips() + (TAB === 'buy' ? buyView() : (TAB === 'bought' ? tripsView(L.bought, false) : tripsView(L.proof, true))) + '</div>';
    $('root').innerHTML = h; bulkSync();
  }
  function chips() {
    return '<div class="wk-chips"><button class="wk-chip ' + (CUR === '' ? 'on' : '') + '" data-place="" type="button">All offices</button>'
      + L.places.map((p) => '<button class="wk-chip ' + (CUR === p.code ? 'on' : '') + '" data-place="' + esc(p.code) + '" type="button">' + esc(p.name) + (p.open ? '<em>' + p.open + '</em>' : '') + '</button>').join('')
      + (TAB === 'buy' ? '<span class="wk-grp"><select id="wkGroup"><option value="office" ' + (GROUP === 'office' ? 'selected' : '') + '>Group by: Office</option><option value="none" ' + (GROUP === 'none' ? 'selected' : '') + '>No grouping</option></select></span>' : '') + '</div>';
  }
  function rowHtml(r) {
    const R = REASON[r.reason] || [r.reason, 'daily'];
    let who;
    if (r.assigned) {
      who = '<span class="wk-who"><i>' + esc(ini(r.assigned.name)) + '</i>' + esc(r.assigned.name) + '</span>' + (r.state === 'held' ? '<span class="wk-tag bad">missed today</span>' : (r.assigned.seen ? '<span class="wk-tag">seen ' + esc(r.assigned.seen_label) + '</span>' : '<span class="wk-tag no">not opened yet</span>'))
        + '<button class="wk-back" data-back="' + r.id + '" type="button">take back</button>';
    } else who = '<span class="nb">Nobody yet</span>';
    const sg = r.assigned ? '' : (r.suggest ? esc(r.suggest.name) + ' · ' + esc(r.suggest.why) : '—');
    return '<div class="wk-row"><input type="checkbox" data-sel="' + r.id + '" ' + (SEL.has(r.id) ? 'checked' : '') + '><div><b>' + esc(r.item) + '</b>' + hiTag(r) + ' ' + esc(r.qty_label) + (r.unit ? ' ' + esc(r.unit) : '') + '</div><div class="pl">' + whereTag(r) + '</div>'
      + '<div><span class="wk-st ' + R[1] + '">' + R[0] + '</span></div><div class="sn ' + (r.late ? 'late' : '') + '">' + esc(r.due_label) + (r.late ? ' · late' : '') + '</div><div>' + who + '</div><div class="wk-sg">' + sg + '</div></div>';
  }
  function buyView() {
    const rows = L.rows;
    if (!rows.length) return '<div class="bd-empty"><b>Nothing to buy</b>' + (CUR ? 'This office has nothing on its list.' : 'Every office is stocked. New needs come up when the checker marks Low or Empty, and every morning for daily items.') + '</div>';
    let h = '<div id="wkBulkHost"></div><div class="wk-head"><span><input type="checkbox" id="wkAll" title="Tick all that nobody has yet"></span><span>Item</span><span>Office</span><span>State</span><span>Needed by</span><span>Given to</span><span>Claude suggests</span></div>';
    if (GROUP === 'office' && !CUR) {
      const by = {}, order = [];
      rows.forEach((r) => { if (!by[r.place]) { by[r.place] = []; order.push(r.place); } by[r.place].push(r); });
      order.forEach((c) => {
        const g = by[c], free = g.filter((r) => !r.assigned).length;
        h += '<div class="wk-gh"><input type="checkbox" data-selgrp="' + esc(c) + '" ' + (g.every((r) => SEL.has(r.id)) ? 'checked' : '') + '>' + esc(g[0].place_name) + ' <small>· ' + g.length + ' item' + (g.length === 1 ? '' : 's') + (free ? ', ' + free + ' not given' : '') + '</small></div>' + g.map(rowHtml).join('');
      });
    } else h += rows.map(rowHtml).join('');
    h += '<div class="wk-foot">One person can be given many items from many offices in one go. He gets <b>one</b> notification ("4 things to buy today: Oberon 1, 2, 3"), then a reminder every ' + (L.settings.repeat_min || 'N/A') + (L.settings.repeat_min ? ' minutes' : '') + ' until the deadline. Items nobody was given stay with that office\'s own buyer, so nothing is ever left without an owner.</div>';
    return h;
  }
  function selRows() { return L.rows.filter((r) => SEL.has(r.id)); }
  function suggestFor(rows) {
    const c = {}; rows.forEach((r) => { if (r.suggest) { const k = r.suggest.id; c[k] = c[k] || { n: 0, s: r.suggest, places: [] }; c[k].n++; if (c[k].places.indexOf(r.place_name) < 0) c[k].places.push(r.place_name); } });
    const k = Object.keys(c).sort((a, b) => c[b].n - c[a].n)[0]; return k ? c[k] : null;
  }
  function dueOptions() {
    const now = new Date(), o = [['', 'Needed by: each item\'s own time']];
    const h2 = new Date(now.getTime() + 2 * 3600e3); o.push(['h2', 'In 2 hours (' + t12(h2) + ')']);
    [[18, '6:00 PM'], [20, '8:00 PM']].forEach((x) => { const d = new Date(); d.setHours(x[0], 0, 0, 0); if (d.getTime() > now.getTime() + 3600e3) o.push(['d' + x[0], 'Today ' + x[1]]); });
    o.push(['t10', 'Tomorrow 10:00 AM']); o.push(['custom', 'Pick a time…']); return o;
  }
  function dueValue() {
    const now = new Date(); const v = BULK.due;
    if (v === 'h2') return fmt(new Date(now.getTime() + 2 * 3600e3));
    if (/^d\d+$/.test(v)) { const d = new Date(); d.setHours(Number(v.slice(1)), 0, 0, 0); return fmt(d); }
    if (v === 't10') { const d = new Date(now.getTime() + 86400e3); d.setHours(10, 0, 0, 0); return fmt(d); }
    if (v === 'custom' && BULK.custom) return BULK.custom.replace('T', ' ') + ':00';
    return '';
  }
  function bulkSync() {
    const host = $('wkBulkHost'); if (!host) return;
    const rows = selRows();
    if (!rows.length) { host.innerHTML = ''; return; }
    const sg = suggestFor(rows);
    if (!BULK.who && sg) BULK.who = String(sg.s.id);
    const emps = L.employees.slice().sort((a, b) => a.name.localeCompare(b.name));
    const sel = emps.find((e) => String(e.id) === BULK.who);
    const label = sel ? sel.name.split(' ')[0] : '';
    let h = '<div class="wk-bulk"><b>' + rows.length + ' selected</b><span class="lb">Give them to:</span><select id="bkWho"><option value="">Choose a person</option>'
      + emps.map((e) => '<option value="' + e.id + '" ' + (String(e.id) === BULK.who ? 'selected' : '') + (e.away ? ' disabled' : '') + '>' + esc(e.name) + (e.away ? ' (' + esc(e.away_why) + ')' : (e.open ? ' · ' + e.open + ' given' : '')) + '</option>').join('') + '</select>'
      + '<select id="bkDue">' + dueOptions().map((o) => '<option value="' + o[0] + '" ' + (BULK.due === o[0] ? 'selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>'
      + (BULK.due === 'custom' ? '<input type="datetime-local" id="bkCustom" value="' + esc(BULK.custom) + '">' : '')
      + '<button class="go" id="bkGo" type="button" ' + (sel ? '' : 'disabled') + '>' + (sel ? 'Give to ' + esc(label) + (L.mode === 'shadow' ? ' · no notification (shadow mode)' : ' · send him a notification') : 'Give') + '</button><button class="x" id="bkClear" type="button">Clear</button></div>';
    if (sg && !rows.every((r) => r.assigned)) h += '<div class="wk-sug"><b>Claude suggests ' + esc(sg.s.name) + '</b> — ' + esc(sg.s.why) + (sg.places.length > 1 ? ' (' + esc(sg.places.slice(0, 4).join(', ')) + ')' : '') + '. It is only a suggestion; you decide.</div>';
    const keep = document.activeElement && document.activeElement.id;
    host.innerHTML = h;
    if (keep && $(keep)) $(keep).focus();
  }

  /* ----- trips (Bought / Proof missing) ----- */
  function tripsView(list, proof) {
    if (!list.length) return '<div class="bd-empty"><b>' + (proof ? 'Nothing is missing' : 'Nothing bought in the last 7 days') + '</b>' + (proof ? 'Every purchase has its screenshot or bill.' : 'Purchases appear here as soon as the buyer saves them.') + '</div>';
    let h = proof ? '<div class="bd-sub" style="margin-bottom:6px">Purchases without a payment screenshot or bill (own pocket, cash, credit), and screenshots Claude could not check. Ask the buyer for the proof; it comes up on his My Day.</div>' : '';
    h += list.map((g) => {
      let tags = '';
      if (g.missing) tags += '<span class="wk-tag bad">no screenshot or bill</span>';
      if (g.flagged) tags += '<span class="wk-tag warn">' + esc(g.checked_note) + '</span>';
      if (!proof && g.has_proof && !g.flagged) tags += '<span class="wk-tag ok">proof ✓</span>';
      if (g.proof_state === 'asked') tags += '<span class="wk-tag">asked ' + esc(String(g.asked_at || '').slice(11, 16)) + '</span>';
      if (g.proof_state === 'added') tags += '<span class="wk-tag ok">proof added</span>';
      return '<div class="wk-trip"><div class="top"><div><div class="tt">' + esc(g.buyer || '—') + ' · ' + inr(g.amount) + ' <span class="wk-tag no">' + esc(PAYN[g.paid_by] || g.paid_by) + (g.supplier ? ' · ' + esc(g.supplier) : '') + '</span>' + tags + '</div>'
        + '<div class="s">' + esc(g.at_label) + (g.note ? ' · ' + esc(g.note) : '') + '</div></div></div>'
        + '<div class="offs">' + g.offices.map((o) => '<span>' + esc(o.name) + ' ' + inr(o.amount) + '</span>').join('') + '</div><div class="s">' + esc(g.items.join(', ')) + '</div>'
        + '<div class="acts">' + shotBtn(g.shot, 'Payment screenshot') + shotBtn(g.bill, 'Bill photo')
        + (proof ? (g.proof_state === 'asked' ? '' : '<button class="bd-btn sm go" data-ask="' + g.first_id + '" type="button">Ask for proof</button>') + '<button class="bd-btn sm" data-fine="' + g.first_id + '" type="button">It\'s fine</button>' : '') + '</div></div>';
    }).join('');
    return h;
  }

  /* ----- settings ----- */
  function settingsModal() {
    const m = BD.modal('<h3>Shopping list settings</h3><div class="bd-f"><label>Remind the buyer every (minutes)</label><input class="bd-in" id="sRep" type="number" min="0" value="' + L.settings.repeat_min + '"><div class="hint">Between 7 am and 9 pm, until the deadline. 0 = only the first notification.</div></div>'
      + '<div class="bd-f"><label><input type="checkbox" id="sAi" ' + (L.settings.shot_ai ? 'checked' : '') + '> Claude checks every payment screenshot (amount, date, not edited, not used before)</label></div>'
      + '<div class="acts"><button class="bd-btn" id="sNo" type="button">Cancel</button><button class="bd-btn pri" id="sYes" type="button">Save</button></div>');
    m.querySelector('#sNo').onclick = BD.close;
    m.querySelector('#sYes').onclick = async () => { try { await api.post('dp.wk_settings', { repeat_min: Number(m.querySelector('#sRep').value), shot_ai: m.querySelector('#sAi').checked ? 1 : 0 }); BD.close(); toast('Saved.'); load(); } catch (e) { toast(e.message, true); } };
  }

  /* ====================================================== buyer view ====================================================== */
  let STEP = 1, TICK = {}, PAYM = 'upi', FILES = { shot: null, bill: null }, POPPED = false;
  function renderMe() {
    IS_BOSS = !!M.boss; topBtns();
    if (!M.live) { $('root').innerHTML = '<div class="wk-me"><div class="wk-note"><b>Not live yet.</b> Shopping is not switched on, so nothing is asked of you yet.</div></div>'; return; }
    let h = '<div class="wk-me">';
    if (M.proofs.length) h += M.proofs.map((g) => '<div class="wk-warn w"><b>Proof needed:</b> ' + esc(g.place_label) + ' · ' + inr(g.amount) + ' (' + esc(PAYN[g.paid_by]) + '). <button class="bd-btn sm go" data-proof="' + g.first_id + '" type="button">Add proof</button></div>').join('');
    if (!M.rows.length) {
      h += '<div class="bd-card"><div class="bd-empty"><b>Nothing to buy for you</b>When someone gives you things to buy, you get a notification and they appear here.</div></div>' + recentHtml();
      $('root').innerHTML = h + '</div>'; return;
    }
    M.rows.forEach((r) => { if (!(r.id in TICK)) TICK[r.id] = true; });
    if (STEP === 1) h += stepList(); else h += stepPay();
    $('root').innerHTML = h + '</div>';
    if (STEP === 1 && !POPPED && M.rows.some((r) => r.new)) { POPPED = true; popup(); }
    if (QS.get('proof') && !POPPED) { POPPED = true; const g = M.proofs.concat(M.recent).find((x) => String(x.first_id) === QS.get('proof')); if (g) proofModal(g); }
  }
  function popup() {
    const nw = M.rows.filter((r) => r.new);
    const offs = [...new Set(nw.map((r) => r.place_name))];
    const m = BD.modal('<div class="wk-pop"><small class="k">NEW · SUPPLIES TO BUY</small><h3>' + nw.length + ' thing' + (nw.length === 1 ? '' : 's') + ', ' + offs.length + ' office' + (offs.length === 1 ? '' : 's') + '</h3><p>' + esc(nw.map((r) => r.item + ' ' + r.qty_label + (r.unit ? ' ' + r.unit : '') + ' (' + r.place_name + ')').join(', ')) + ' · by ' + esc(M.due_label) + '</p>'
      + '<button class="wk-big go" id="pOpen" type="button">Open my shopping list</button><button class="wk-big alt" id="pLater" type="button">Later</button></div>');
    m.querySelector('#pOpen').onclick = BD.close; m.querySelector('#pLater').onclick = BD.close;
  }
  function recentHtml() {
    const r = M.recent || []; if (!r.length) return '';
    return '<div class="bd-card"><div class="bd-h"><h2>Bought in the last 3 days</h2></div>' + r.map((g) => '<div class="bd-row"><div class="l"><div class="t">' + esc(g.place_label) + ' · ' + inr(g.amount) + '</div><div class="s">' + esc(g.at_label) + ' · ' + esc(PAYN[g.paid_by]) + ' · ' + esc(g.items.join(', ')) + '</div></div><div class="r">'
      + (g.missing || (g.flagged && g.proof_state !== 'added') ? '<span class="wk-tag bad">proof needed</span><button class="bd-btn sm go" data-proof="' + g.first_id + '" type="button">Add proof</button>' : '<span class="wk-tag ok">saved</span>') + '</div></div>').join('') + '</div>';
  }
  function stepList() {
    const on = M.rows.filter((r) => TICK[r.id]), off = M.rows.filter((r) => !TICK[r.id]);
    let h = '<h2 class="big">Shopping list</h2><div class="bd-sub" style="margin-bottom:12px">' + M.rows.length + ' to buy · by ' + esc(M.due_label) + ' · ' + esc(M.office_label) + '</div><div class="bd-card" style="padding:6px 16px">';
    h += M.rows.map((r) => '<label class="wk-li ' + (TICK[r.id] ? '' : 'off') + '"><input type="checkbox" data-tick="' + r.id + '" ' + (TICK[r.id] ? 'checked' : '') + '><div><div class="nm">' + esc(r.item) + hiTag(r) + ' <span>' + esc(r.qty_label) + (r.unit ? ' ' + esc(r.unit) : '') + '</span></div><div class="of">' + whereTag(r) + ' · by ' + esc(r.due_label) + (r.late ? ' · <b style="color:#c0261e">late</b>' : '') + '</div></div><span class="wk-st ' + (REASON[r.reason] || ['', 'daily'])[1] + '">' + esc((REASON[r.reason] || [r.reason])[0]) + '</span></label>').join('') + '</div>';
    h += '<button class="wk-big" id="meNext" type="button" ' + (on.length ? '' : 'disabled') + '>I bought these ' + on.length + ' · next</button>';
    if (off.length) h += '<button class="wk-big alt" id="meNo" type="button">The shop did not have ' + (off.length === 1 ? 'it' : 'these ' + off.length) + '</button><div class="bd-sub" style="text-align:center;margin-top:6px">Un-ticked items go back to the list and the person who gave them is told.</div>';
    return h + recentHtml();
  }
  function offices(on) {
    const o = [], seen = {}; on.forEach((r) => { if (!seen[r.place]) { seen[r.place] = 1; o.push({ code: r.place, name: r.place_name }); } }); return o;
  }
  function stepPay() {
    const on = M.rows.filter((r) => TICK[r.id]), offs = offices(on);
    const label = offs.map((o) => o.name).join(', ');
    const needShot = PAYM === 'upi';
    const shotTitle = needShot ? 'Payment screenshot' : (PAYM === 'pocket' ? 'Payment screenshot or receipt' : (PAYM === 'credit' ? 'Bill photo' : 'Bill photo'));
    const warn = { upi: ['i', 'Add the UPI payment screenshot. Claude checks it: amount and date must match, and the same screenshot cannot be used twice.'], credit: ['i', 'Choose the supplier. The bill goes to his ledger as pending. Add a bill photo; without it the boss will ask for proof.'], pocket: ['i', 'You will be paid back by UPI. Add the payment screenshot or receipt; without it the boss will ask for proof.'], cash: ['w', 'Please avoid cash. Pay by UPI or the ledger next time. Add the bill photo; without it the boss will ask for proof.'] }[PAYM];
    let h = '<h2 class="big">How did you pay?</h2><div class="bd-sub" style="margin-bottom:12px">' + on.length + ' item' + (on.length === 1 ? '' : 's') + ' · ' + esc(label) + '</div><div class="bd-card">';
    h += '<div style="font-weight:800;font-size:14px;margin-bottom:8px">Amount' + (offs.length > 1 ? ' for each office' : '') + '</div>' + offs.map((o) => '<div class="wk-amt"><label>' + esc(o.name) + '</label><input type="number" inputmode="decimal" min="0" step="any" placeholder="₹" data-amt="' + esc(o.code) + '" value="' + esc(AMT[o.code] || '') + '"></div>').join('');
    h += '<div class="wk-tot" id="wkTot">' + inr(totalAmt(offs)) + '</div>';
    h += '<div class="wk-pay" id="wkPay">' + Object.keys(PAY).map((k) => '<button type="button" data-pay="' + k + '" class="' + (k === PAYM ? 'on' : '') + '">' + PAY[k] + '</button>').join('') + '</div>';
    h += '<div class="wk-warn ' + warn[0] + '">' + warn[1] + '</div>';
    if (PAYM === 'credit' || PAYM === 'upi') h += '<div class="bd-f"><label>Supplier ' + (PAYM === 'credit' ? '(required)' : '(optional)') + '</label><select class="bd-in" id="meSup"><option value="">—</option>' + M.suppliers.map((s) => '<option value="' + s.id + '" ' + (String(s.id) === SUPID ? 'selected' : '') + '>' + esc(s.name) + '</option>').join('') + '</select></div>';
    h += '<div style="font-weight:800;font-size:14px;margin:8px 0 6px">' + shotTitle + (needShot ? ' <span style="color:#d9423b">(required)</span>' : ' <span class="bd-sub">(optional)</span>') + '</div>' + dropHtml('shot', needShot ? 'Add the UPI screenshot' : 'Add photo');
    h += '<div style="font-weight:800;font-size:14px;margin:12px 0 6px">Bill / items photo <span class="bd-sub">(optional)</span></div>' + dropHtml('bill', 'Add photo');
    h += '<div class="bd-f" style="margin-top:12px"><label>Remark (optional)</label><input class="bd-in" id="meNote" value="' + esc(NOTE) + '" placeholder="e.g. 2 L milk packets"></div><div id="wkErr"></div></div>';
    h += '<button class="wk-big go" id="meSave" type="button">Save · mark ' + on.length + ' as bought</button><button class="wk-big alt" id="meBack" type="button">Back</button><div class="wk-warn g" style="margin-top:10px">Each office\'s list closes. The boss sees it in the Bought tab.</div>';
    return h;
  }
  let AMT = {}, SUPID = '', NOTE = '';
  function totalAmt(offs) { return offs.reduce((s, o) => s + (Number(AMT[o.code]) || 0), 0); }
  function dropHtml(k, text) {
    const f = FILES[k];
    return '<label class="wk-drop ' + (f ? 'has' : '') + '" data-drop="' + k + '">' + (f ? '<img src="' + URL.createObjectURL(f) + '" alt=""><span>' + esc(f.name) + ' · tap to change</span>' : '📷 ' + esc(text)) + '<input type="file" accept="image/*" data-file="' + k + '"></label>';
  }
  async function saveBuy() {
    const on = M.rows.filter((r) => TICK[r.id]), offs = offices(on);
    const errBox = (t) => { const e = $('wkErr'); if (e) e.innerHTML = t ? '<div class="wk-warn b">' + esc(t) + '</div>' : ''; };
    errBox('');
    for (const o of offs) if (!(Number(AMT[o.code]) > 0)) return errBox('Type the amount for ' + o.name + '.');
    if (PAYM === 'upi' && !FILES.shot) return errBox('Company UPI needs the payment screenshot. Tap "Add the UPI screenshot".');
    if (PAYM === 'credit' && !SUPID) return errBox('Choose the supplier for the ledger.');
    const fd = new FormData(); fd.append('lines', JSON.stringify(on.map((r) => ({ need_id: r.id, qty: r.qty })))); fd.append('paid_by', PAYM);
    const am = {}; offs.forEach((o) => { am[o.code] = Number(AMT[o.code]); }); fd.append('amounts', JSON.stringify(am)); fd.append('note', NOTE);
    if (SUPID) fd.append('supplier_id', SUPID); if (FILES.shot) fd.append('shot', FILES.shot); if (FILES.bill) fd.append('bill', FILES.bill);
    const b = $('meSave'); b.disabled = true; b.textContent = 'Saving… Claude is checking the screenshot';
    try {
      const r = await api.upload('dp.wk_bought', fd);
      toast(r.message + (r.warning ? ' ' + r.warning : '') + (r.proof_needed ? ' Add the screenshot or bill later: the boss will ask.' : ''));
      STEP = 1; TICK = {}; AMT = {}; FILES = { shot: null, bill: null }; SUPID = ''; NOTE = ''; PAYM = 'upi'; await load();
    } catch (e) { errBox(e.message); toast(e.message, true); b.disabled = false; b.textContent = 'Save · mark ' + on.length + ' as bought'; }
  }
  function proofModal(g) {
    const st = { shot: null, bill: null };
    const m = BD.modal('<h3>Add the proof</h3><div class="bd-sub" style="margin-bottom:10px">' + esc(g.place_label) + ' · ' + inr(g.amount) + ' · ' + esc(PAYN[g.paid_by]) + '</div>'
      + '<div style="font-weight:800;font-size:14px;margin:8px 0 6px">Payment screenshot</div><label class="wk-drop" id="pdShot">📷 Add the screenshot<input type="file" accept="image/*" id="pShot"></label>'
      + '<div style="font-weight:800;font-size:14px;margin:12px 0 6px">Bill photo</div><label class="wk-drop" id="pdBill">📷 Add photo<input type="file" accept="image/*" id="pBill"></label><div id="pErr"></div>'
      + '<div class="acts"><button class="bd-btn" id="pNo" type="button">Cancel</button><button class="bd-btn pri" id="pYes" type="button">Save proof</button></div>');
    const bind = (id, dropId, key) => { m.querySelector(id).onchange = (e) => { st[key] = e.target.files[0] || null; const d = m.querySelector(dropId); d.classList.toggle('has', !!st[key]); d.firstChild.textContent = st[key] ? '✓ ' + st[key].name : '📷 Add'; }; };
    bind('#pShot', '#pdShot', 'shot'); bind('#pBill', '#pdBill', 'bill');
    m.querySelector('#pNo').onclick = BD.close;
    m.querySelector('#pYes').onclick = async () => {
      if (!st.shot && !st.bill) return toast('Add the screenshot or a bill photo.', true);
      const fd = new FormData(); fd.append('bought_id', g.first_id); if (st.shot) fd.append('shot', st.shot); if (st.bill) fd.append('bill', st.bill);
      const b = m.querySelector('#pYes'); b.disabled = true;
      try { const r = await api.upload('dp.wk_proof_add', fd); BD.close(); toast(r.message); load(); } catch (e) { m.querySelector('#pErr').innerHTML = '<div class="wk-warn b">' + esc(e.message) + '</div>'; b.disabled = false; }
    };
  }

  /* ====================================================== events ====================================================== */
  $('root').onchange = (e) => {
    const t = e.target;
    if (t.dataset.sel) { const id = Number(t.dataset.sel); t.checked ? SEL.add(id) : SEL.delete(id); return bulkSync(); }
    if (t.dataset.selgrp) { L.rows.filter((r) => r.place === t.dataset.selgrp).forEach((r) => { t.checked ? SEL.add(r.id) : SEL.delete(r.id); }); return renderBoss(); }
    if (t.id === 'wkAll') { L.rows.filter((r) => !r.assigned).forEach((r) => { t.checked ? SEL.add(r.id) : SEL.delete(r.id); }); return renderBoss(); }
    if (t.id === 'wkGroup') { GROUP = t.value; return renderBoss(); }
    if (t.id === 'bkWho') { BULK.who = t.value; return bulkSync(); }
    if (t.id === 'bkDue') { BULK.due = t.value; return bulkSync(); }
    if (t.id === 'bkCustom') { BULK.custom = t.value; return; }
    if (t.dataset.tick) { TICK[Number(t.dataset.tick)] = t.checked; return renderMe(); }
    if (t.dataset.file) { FILES[t.dataset.file] = t.files[0] || null; return renderMe(); }
    if (t.id === 'meSup') { SUPID = t.value; return; }
  };
  $('root').oninput = (e) => {
    const t = e.target;
    if (t.dataset.amt) { AMT[t.dataset.amt] = t.value; const offs = offices(M.rows.filter((r) => TICK[r.id])); $('wkTot').textContent = inr(totalAmt(offs)); }
    if (t.id === 'meNote') NOTE = t.value;
  };
  $('root').onclick = async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.go) { location.href = b.dataset.go; return; }
      if (b.dataset.tab) { TAB = b.dataset.tab; SEL.clear(); return load(); }
      if (b.dataset.place !== undefined && b.classList.contains('wk-chip')) { CUR = b.dataset.place; SEL.clear(); return load(); }
      if (b.dataset.shot) return shotOpen(b.dataset.shot);
      if (b.id === 'bkClear') { SEL.clear(); return renderBoss(); }
      if (b.id === 'bkGo') {
        const ids = [...SEL]; if (!ids.length || !BULK.who) return;
        if (BULK.due === 'custom' && !BULK.custom) return toast('Pick the time first.', true);
        b.disabled = true;
        try {
          const r = await api.post('dp.wk_assign', { need_ids: ids, emp_id: Number(BULK.who), due: dueValue() });
          toast(r.message + (r.skipped && r.skipped.length ? ' Skipped: ' + r.skipped.join('; ') + '.' : ''));
          SEL.clear(); BULK.who = ''; BULK.due = ''; await load();
        } catch (er) { toast(er.message, true); b.disabled = false; }
        return;
      }
      if (b.dataset.back) { const r = await api.post('dp.wk_unassign', { need_ids: [Number(b.dataset.back)] }); toast(r.message); return load(); }
      if (b.dataset.ask) { const note = prompt('Tell him what you need (optional):', '') ; if (note === null) return; const r = await api.post('dp.wk_proof_ask', { bought_id: Number(b.dataset.ask), note }); toast(r.message); return load(); }
      if (b.dataset.fine) { if (!(await BD.confirm('Mark as fine?', 'No more proof will be asked for this purchase.'))) return; const r = await api.post('dp.wk_proof_clear', { bought_id: Number(b.dataset.fine) }); toast(r.message); return load(); }
      if (b.dataset.proof) { const g = (M.proofs || []).concat(M.recent || []).find((x) => String(x.first_id) === b.dataset.proof); if (g) proofModal(g); return; }
      if (b.id === 'meNext') { STEP = 2; return renderMe(); }
      if (b.id === 'meBack') { STEP = 1; return renderMe(); }
      if (b.id === 'meSave') return saveBuy();
      if (b.dataset.pay) { PAYM = b.dataset.pay; return renderMe(); }
      if (b.id === 'meNo') {
        const off = M.rows.filter((r) => !TICK[r.id]); if (!off.length) return;
        if (!(await BD.confirm('The shop did not have it?', off.map((r) => r.item + ' (' + r.place_name + ')').join(', ') + ' go back to the list. The person who gave them is told.'))) return;
        const r = await api.post('dp.wk_nostock', { need_ids: off.map((x) => x.id) }); toast(r.message); TICK = {}; return load();
      }
    } catch (er) { toast(er.message, true); }
  };
  $('topBtns').onclick = (e) => { if (e.target.id === 'wkSet') settingsModal(); };
  load();
</script>
</body>
</html>

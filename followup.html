<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Follow-up — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<link rel="stylesheet" href="assets/css/boss.css?v=2">
<style>
  .fu{max-width:1500px;margin:0 auto;padding-bottom:40px;}
  .fu *{box-sizing:border-box;}
  .fu-pills{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;}
  .fu-pills::-webkit-scrollbar{display:none;}
  .fu-pill{flex:none;white-space:nowrap;font:inherit;font-size:13px;font-weight:800;padding:9px 17px;border-radius:999px;background:#fff;border:1px solid var(--line);color:#4a4f5c;cursor:pointer;}
  .fu-pill.on{background:#111827;color:#fff;border-color:#111827;}
  .fu-pill em.fu-n{font-style:normal;background:#d9423b;color:#fff;border-radius:9px;font-size:11px;padding:1px 6px;margin-left:6px;}
  .fu-att{padding:14px 16px;} .fu-att.ok{background:#f1faf5;border-color:#cdebd9;font-size:13.5px;color:#0f5a3a;}
  .fu-agrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .fu-ah{font-size:13px;font-weight:700;color:#4a505c;margin-bottom:6px;} .fu-ah b{font-size:22px;margin-right:4px;}
  .fu-acol.red .fu-ah b{color:#d9423b;} .fu-acol.amb .fu-ah b{color:#b45309;}
  .fu-arow{display:grid;grid-template-columns:1fr auto;gap:0 10px;width:100%;text-align:left;font:inherit;background:#fff;border:0;border-top:1px solid #f0f1f3;padding:7px 2px;cursor:pointer;}
  .fu-arow:hover{background:#f7f8fa;} .fu-arow .t{font-weight:800;font-size:13.5px;} .fu-arow .m{grid-column:1;font-size:12px;color:#6b7280;} .fu-arow .d{grid-column:2;grid-row:1 / span 2;align-self:center;font-size:12px;font-weight:800;white-space:nowrap;}
  .fu-acol.red .fu-arow .d{color:#d9423b;} .fu-acol.amb .fu-arow .d{color:#b45309;}
  @media (max-width:820px){ .fu-agrid{grid-template-columns:1fr;} .fu-ticks{grid-template-columns:1fr;} }
  .fu-pill.add{border-style:dashed;color:#0f7a4d;}
  .fu-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px;}
  .fu-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .fu-head h2{margin:0;font-size:19px;font-weight:800;}
  .fu-head .sp{flex:1;}
  .fu-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .fu-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .fu-stat{background:#f6f7f9;border-radius:12px;padding:8px 12px;font-size:12px;color:#4a505c;}
  .fu-stat b{display:block;font-size:17px;color:#14161a;}
  .fu-stat.r b{color:#d9423b;} .fu-stat.g b{color:#16945a;}
  .fu-lb{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#6b7280;margin-bottom:8px;}
  .fu-chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:5px 0;line-height:1.4;}
  .fu-dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:#f59e0b;}
  .fu-dot.red{background:#d9423b;}
  .fu-dig{white-space:pre-wrap;font-size:13.5px;line-height:1.55;background:#f7f5ff;border:1px solid #e4defc;border-radius:14px;padding:12px 14px;margin-top:10px;}
  .fu{min-width:0;} .fu-wrap{width:100%;max-width:calc(100vw - 48px);}
  .fu-t.side th.tp{text-transform:none;letter-spacing:0;} .fu-t a.fu-tag{white-space:normal;}
  .fu-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:#fff;}
  table.fu-t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;}
  .fu-t th,.fu-t td{border-bottom:1px solid #eef0f3;border-right:1px solid #eef0f3;padding:9px 10px;vertical-align:top;text-align:left;}
  .fu-t th{background:#f6f7f9;font-size:12px;font-weight:800;white-space:nowrap;position:sticky;top:0;z-index:2;}
  .fu-t th.td,.fu-t td.td{background:#fffbea;}
  .fu-t th:first-child,.fu-t td:first-child{position:sticky;left:0;z-index:3;background:#fff;min-width:220px;max-width:260px;box-shadow:1px 0 0 #e5e7eb;}
  .fu-t th:first-child{background:#f6f7f9;z-index:4;}
  .fu-t td.c{min-width:210px;max-width:300px;}
  .fu-t td.c.w{cursor:pointer;} .fu-t td.c.w:hover{background:#f3faf6;}
  .fu-t tr.done td,.fu-t .dn{opacity:.55;}
  .fu-t.side th:first-child,.fu-t.side td:first-child{min-width:130px;max-width:150px;white-space:nowrap;font-weight:800;font-size:12px;}
  .fu-t.side th.tp{white-space:normal;min-width:230px;max-width:300px;vertical-align:top;font-weight:400;}
  .fu-t.side td.dy.td{background:#fffbea;}
  .fu-tt{font-weight:800;font-size:13.5px;line-height:1.3;}
  .fu-tag{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px;margin:4px 4px 0 0;background:#eef2f6;color:#475467;white-space:nowrap;}
  .fu-tag.red{background:#fde8e6;color:#b42318;} .fu-tag.amb{background:#fff3d6;color:#8a5a00;} .fu-tag.grn{background:#e3f6ec;color:#0f7a4d;} .fu-tag.pur{background:#efeafe;color:#5b3fd1;}
  .fu-num{font-weight:800;font-size:14px;}
  .fu-num small{font-weight:600;color:#6b7280;font-size:10.5px;}
  .fu-txt{white-space:pre-wrap;word-break:break-word;line-height:1.4;margin-top:2px;}
  .fu-ai{font-size:11px;font-weight:700;margin-top:3px;line-height:1.35;} .fu-ai.ok{color:#16945a;font-weight:600;} .fu-ai.w{color:#b45309;} .fu-ai.q{color:#d9423b;}
  .fu-vals{display:grid;grid-template-columns:1fr auto;gap:1px 10px;font-size:12px;margin-top:5px;padding-top:5px;border-top:1px dashed #e5e7eb;} .fu-vals span{color:#6b7280;} .fu-vals b{text-align:right;font-weight:800;}
  .fu-fv a{color:#0f7a4d;font-weight:800;text-align:right;text-decoration:none;} .fu-fv b{max-width:190px;overflow-wrap:anywhere;}
  .fu-fr{display:grid;grid-template-columns:1fr 130px auto auto;gap:6px;align-items:center;margin-bottom:6px;} .fu-fr .bd-in{padding:8px 10px;font-size:14px;} .fu-fr .x{border:0;background:none;font-size:18px;cursor:pointer;color:#9aa1ac;}
  @media (max-width:820px){ .fu-fr{grid-template-columns:1fr 1fr;} }
  .fu-ticks{max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;} .fu-tg{grid-column:1 / -1;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#6b7280;margin:6px 0 2px;} .fu-tk{font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer;padding:3px 0;}
  .fu-by{font-size:10.5px;color:#9aa1ac;margin-top:3px;}
  .fu-miss{color:#b45309;font-weight:700;font-size:12px;}
  .fu-none{color:#c0c5cd;}
  .fu-bar{height:5px;border-radius:9px;background:#eef0f3;margin-top:5px;overflow:hidden;} .fu-bar i{display:block;height:100%;background:#16945a;}
  .fu-m{display:none;}
  .fu-mc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;}
  .fu-mc.done{opacity:.6;}
  .fu-mday{border-top:1px solid #f0f1f3;padding:8px 0;font-size:13px;}
  .fu-mday .d{font-size:11.5px;font-weight:800;color:#6b7280;}
  .fu-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:820px){ .fu-wrap,.fu-sw{display:none !important;} .fu-m{display:block;} .fu-card{padding:14px;} .fu-row2{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><div><h1>Follow-up</h1><div class="sub" style="font-size:12.5px;color:var(--muted);margin-top:2px">Every section, its topics, and one update a day on each — checked by Claude.</div></div></div>
    <div class="content"><div class="fu" id="root"><div class="bd-empty">Loading…</div></div></div>
  </main>
</div>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/api.js?v=14"></script>
<script src="assets/js/layout.js?v=33"></script>
<script src="assets/js/boss_common.js?v=4"></script>
<script>
guardPage(); renderSidebar('followup');
(function () {
  const { esc, $, toast, inr } = BD;
  try { api.swrAdd('fup.board', 0); } catch (e) { /* older api.js */ }   // the sheet is always asked fresh: an update somebody else just wrote must show at once, never a remembered copy
  let OPEN_U = 0; try { OPEN_U = Number(new URLSearchParams(location.search).get('u')) || 0; } catch (e) { OPEN_U = 0; }
  let D = null, PPL = null, SID = 0, DAYS = 7, busy = false, SIDE = true;
  try { SIDE = localStorage.getItem('fup_side') !== '0'; } catch (e) { SIDE = true; }
  try { SID = Number(new URLSearchParams(location.search).get('s')) || Number(localStorage.getItem('fup_sec')) || 0; } catch (e) { SID = 0; }

  const dayName = (d, today) => { const dt = new Date(d + 'T12:00:00'); const diff = Math.round((new Date(today + 'T12:00:00') - dt) / 86400000); return (diff === 0 ? 'Today · ' : diff === 1 ? 'Yesterday · ' : '') + dt.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }); };
  const fmt = (v, u) => (u === '₹' ? inr(v) : u === '%' ? v + '%' : u === 'x' ? v + 'x' : Number(v).toLocaleString('en-IN') + (u ? ' ' + u : ''));
  const srcOf = (k) => D.sources.find((x) => x.key === k);
  const short = (l) => String(l).replace(/\s*\(₹\)/, '');
  // the extra numbers of a row (a day-wise sales topic has ten): label on the left, the number on the right
  const extras = (u) => { const ks = u && u.vals ? Object.keys(u.vals) : []; return ks.length ? '<div class="fu-vals">' + ks.map((k) => { const so = srcOf(k); return so ? '<span>' + esc(short(so.label)) + '</span><b>' + fmt(u.vals[k], so.unit) + '</b>' : ''; }).join('') + '</div>' : ''; };
  const numTxtOld = (t, u) => (u && u.val != null ? '<div class="fu-num">' + (t.unit === '₹' ? inr(u.val) : Number(u.val).toLocaleString('en-IN') + (t.unit ? ' ' + esc(t.unit) : '')) + (u.auto ? ' <small>from the system</small>' : '') + '</div>' : '');
  const numTxt = (t, u) => { if (!(u && u.val != null)) return extras(u); const so = t.source && srcOf(t.source), many = t.metrics && t.metrics.length > 1;
    return '<div class="fu-num">' + (many && so ? '<small style="font-size:11px;display:block">' + esc(short(so.label)) + '</small>' : '') + fmt(u.val, t.unit) + (u.auto ? ' <small>from the system</small>' : '') + '</div>' + extras(u); };
  const canDay = (t, d) => t.can_write && t.status !== 'done' && (D.manager || d >= D.days[t.lag ? 2 : 1] || d === D.today);
  const fset = (v) => (v && typeof v === 'object' ? !!v.f : String(v == null ? '' : v).trim() !== '');
  const missing = (t, u) => t.fields.filter((f) => f.req && !fset(u && u.f ? u.f[f.k] : null));
  const covered = (t, d) => { const u = t.updates[d]; if (!u) return false; if (t.fields.some((f) => f.req)) return !missing(t, u).length && !u.q && (!t.need_text || !!u.text);
    return !!((u.text && !u.q) || (!t.need_text && t.source && u.val != null)); };
  const fileUrl = (t, d, k) => api.buildUrl('fup.file', { topic_id: t.id, day: d, key: k, token: api.token() });
  // the owner's own fields of a row: label on the left, what was filled on the right (a link opens, a file opens, yes / no is coloured)
  const fvals = (t, d, u) => { if (!t.fields.length || !u) return ''; const rows = t.fields.map((f) => { const v = u.f ? u.f[f.k] : null; if (!fset(v)) return f.req ? '<span>' + esc(f.label) + '</span><b style="color:#b45309">not filled</b>' : '';
      const show = f.type === 'file' ? '<a href="' + esc(fileUrl(t, d, f.k)) + '" target="_blank" rel="noopener" data-stop="1">📎 ' + esc(v.n || 'file') + '</a>' : f.type === 'link' ? '<a href="' + esc(v) + '" target="_blank" rel="noopener noreferrer" data-stop="1">🔗 open</a>' : f.type === 'yesno' ? '<b style="color:' + (v === 'yes' ? '#16945a' : '#d9423b') + '">' + (v === 'yes' ? 'Yes' : 'No') + '</b>' : f.type === 'num' ? '<b>' + Number(v).toLocaleString('en-IN') + '</b>' : '<b style="font-weight:600;white-space:normal">' + esc(v) + '</b>';
      return '<span>' + esc(f.label) + '</span>' + show; }).join(''); return rows ? '<div class="fu-vals fu-fv">' + rows + '</div>' : ''; };
  const sec = () => D.sections.find((s) => s.id === D.section) || null;

  async function load(keep) {
    try {
      if (!keep) $('root').style.opacity = D ? '.6' : '1';
      D = await api.get('fup.board', { section: SID || '', days: DAYS });
      SID = D.section || 0; try { if (SID) localStorage.setItem('fup_sec', String(SID)); } catch (e) { /* private mode */ }
      render();
      if (OPEN_U) { const tu = D.topics.find((x) => x.id === OPEN_U); OPEN_U = 0; if (tu && tu.can_write && tu.status !== 'done') writeUp(tu.id, tu.due_day); }
    } catch (e) { $('root').innerHTML = '<div class="bd-empty"><b>Could not open Follow-up</b>' + esc(e.message || '') + '</div>'; }
    $('root').style.opacity = '1';
  }
  async function people() { if (!PPL) PPL = await api.get('fup.people'); return PPL; }

  function tags(t) {
    let h = '';
    if (t.status === 'done') h += '<span class="fu-tag grn">Finished</span>';
    else if (t.kind === 'deadline') { const dl = t.days_left; h += '<span class="fu-tag ' + (dl < 0 ? 'red' : dl <= 2 ? 'amb' : '') + '">Deadline ' + esc(new Date(t.due_date + 'T12:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })) + ' · ' + (dl < 0 ? -dl + 'd late' : dl === 0 ? 'today' : dl + 'd left') + '</span>'; }
    else h += '<span class="fu-tag">' + (t.lag ? 'Every day · filled next day' : 'Every day') + '</span>';
    h += '<span class="fu-tag ' + (t.assignee ? '' : 'amb') + '">' + (t.assignee ? '👤 ' + esc(t.assignee) : 'Not given to anyone') + '</span>';
    const so = t.source && D.sources.find((x) => x.key === t.source);
    if (so && t.metrics.length > 1) h += '<a class="fu-tag pur" href="' + esc(so.page) + '" target="_top" style="text-decoration:none">🔗 Auto · ' + t.metrics.length + ' numbers from the HRMS</a>' + (t.need_text ? '<span class="fu-tag">+ summary by the person</span>' : '');
    else if (so) h += '<a class="fu-tag pur" href="' + esc(so.page) + '" target="_top" style="text-decoration:none" title="Open ' + esc(so.group) + '">🔗 Auto · ' + esc(so.group) + ' · ' + esc(so.label) + '</a>';
    return h;
  }
  // Claude's check of this one update: a question that is still open, a remark, or a small tick
  function aiLine(u) {
    if (u.q) return '<div class="fu-ai q">Claude asked: ' + esc(u.q) + ' <b>Not answered.</b></div>';
    if (u.ai === 'clear') return '<div class="fu-ai ok">✓ Claude: clear</div>';
    if (u.ai && u.ai_note) return '<div class="fu-ai ' + (u.ai === 'mismatch' ? 'q' : 'w') + '">Claude: ' + esc(u.ai_note) + '</div>';
    return '';
  }
  function cell(t, d) {
    const u = t.updates[d], w = canDay(t, d);
    let h = numTxt(t, u) + fvals(t, d, u);
    if (u && u.pct != null) h += '<div class="fu-bar"><i style="width:' + u.pct + '%"></i></div><div class="fu-by">' + u.pct + '% done</div>';
    if (u && u.text) h += '<div class="fu-txt">' + esc(u.text) + '</div><div class="fu-by">' + esc(u.by || '') + '</div>' + aiLine(u);
    else if (d === t.due_day && d >= t.created && t.status !== 'done' && !covered(t, d)) h += '<div class="fu-miss">' + (w ? '+ Write ' + (d === D.today ? 'today' : 'yesterday') + '’s update' : 'No update yet') + '</div>';
    else if (w && d === t.due_day && t.status !== 'done') h += '<div class="fu-by">+ add a note</div>';
    else if (!h) h = '<span class="fu-none">—</span>';
    if (d === t.due_day && d >= t.created && t.status !== 'done' && h.indexOf('fu-miss') < 0 && !t.fields.some((f) => f.req) && false) h += '';
    if (d === t.due_day && d >= t.created && t.status !== 'done' && t.need_text && !(u && u.text) && h.indexOf('fu-miss') < 0) h += '<div class="fu-miss">' + (w ? '+ Write the summary' : 'No summary yet') + '</div>';
    return h;
  }

  function render() {
    const s = sec(), OV = D.overview || { late: [], empty: [], by_section: {} }; let h = attention(OV) + '<div class="fu-pills">' + D.sections.map((x) => '<button class="fu-pill' + (x.id === D.section ? ' on' : '') + '" data-sec="' + x.id + '">' + esc(x.name) + (OV.by_section[x.id] ? '<em class="fu-n">' + OV.by_section[x.id] + '</em>' : '') + '</button>').join('') + (D.manager ? '<button class="fu-pill add" id="secAdd">＋ New section</button>' : '') + '</div>';
    if (!s) { $('root').innerHTML = h + '<div class="bd-empty"><b>Nothing here for you yet</b>' + (D.manager ? 'Make the first section with “＋ New section”.' : 'When a topic or a section is given to you, it shows here and on My Day.') + '</div>'; bind(); return; }
    const open = D.topics.filter((t) => t.status !== 'done'), got = open.filter((t) => covered(t, t.due_day) || t.due_day < t.created).length, red = D.checks.filter((c) => c.level === 'red').length;
    h += '<div class="fu-card"><div class="fu-head"><div><h2>' + esc(s.name) + '</h2><div class="fu-sub">' + (s.owner ? 'Whole section given to: <b>' + esc(s.owner) + '</b>' : 'The whole section is not given to one person: each topic has its own person.') + '</div></div><span class="sp"></span>'
      + '<select class="bd-in" id="daysSel" style="width:auto;padding:7px 10px;font-size:13px">' + [7, 14, 31].map((n) => '<option value="' + n + '"' + (n === DAYS ? ' selected' : '') + '>Last ' + n + ' days</option>').join('') + '</select>'
      + (D.topics.some((t) => t.can_write && t.status !== 'done') ? '<button class="bd-btn sm" id="addAny">＋ Add update / number</button>' : '') + (D.manager ? '<button class="bd-btn sm" id="secEdit">Section settings</button><button class="bd-btn sm pri" id="topAdd">＋ Topic</button>' : '') + '</div>'
      + '<div class="fu-stats"><div class="fu-stat"><b>' + open.length + '</b>open topics</div><div class="fu-stat ' + (got === open.length && open.length ? 'g' : '') + '"><b>' + got + ' / ' + open.length + '</b>up to date</div><div class="fu-stat ' + (red ? 'r' : 'g') + '"><b>' + red + '</b>need attention</div></div></div>';

    if (s.own && D.topics.length) {
      h += '<div class="fu-card"><div class="fu-head"><div class="fu-lb" style="margin:0">Claude’s check</div><span class="sp"></span><button class="bd-btn sm" id="askAi"' + (D.ai ? '' : ' disabled title="Claude is switched off on this server"') + '>✨ ' + (D.digest ? 'Ask Claude again' : 'Ask Claude to read this section') + '</button></div>'
        + (D.checks.length ? '<div style="margin-top:8px">' + D.checks.map((c) => '<div class="fu-chk"><span class="fu-dot ' + (c.level === 'red' ? 'red' : '') + '"></span><span>' + esc(c.text) + '</span></div>').join('') + '</div>' : '<div class="fu-sub" style="margin-top:8px">Every open topic has today’s update. Nothing is late.</div>')
        + (D.digest ? '<div class="fu-dig">' + esc(D.digest.text) + '</div><div class="fu-by">Claude read it on ' + esc(dayName(D.digest.day, D.today)) + (D.digest.day !== D.today ? ' — ask again for today' : '') + '</div>' : (D.ai ? '' : '<div class="fu-sub" style="margin-top:8px">The checks above work without Claude. Claude’s written note needs the Anthropic key on the server.</div>')) + '</div>';
    }

    if (!D.topics.length) h += '<div class="bd-empty"><b>No topics yet</b>' + (D.manager ? 'Add the points you follow every day: Sales, New displays reached, New perfumes added …' : 'No topic of this section is given to you.') + '</div>';
    else {
      // big screens: the Excel sheet. Default = topics side by side (one column a topic), one row a day; the switch turns it (topics down, days across).
      const th = (t) => '<div class="fu-tt">' + esc(t.title) + '</div>' + (t.note ? '<div class="fu-sub">' + esc(t.note) + '</div>' : '') + tags(t) + (D.manager ? '<div style="margin-top:6px"><button class="bd-btn sm" data-edit="' + t.id + '">Edit</button></div>' : '');
      const td = (t, d) => '<td class="c' + (d === D.today ? ' td' : '') + (t.status === 'done' ? ' dn' : '') + (canDay(t, d) ? ' w" data-up="' + t.id + '" data-day="' + d : '') + '">' + cell(t, d) + '</td>';
      h += '<div style="display:flex;justify-content:flex-end;margin:0 0 8px" class="fu-sw"><button class="bd-btn sm" id="flip">⇄ ' + (SIDE ? 'Show topics down, days across' : 'Show topics side by side') + '</button></div>';
      if (SIDE) h += '<div class="fu-wrap"><table class="fu-t side"><thead><tr><th>Day</th>' + D.topics.map((t) => '<th class="tp' + (t.status === 'done' ? ' dn' : '') + '">' + th(t) + '</th>').join('') + '</tr></thead><tbody>'

    const u0 = id ? t.updates[day] : null; if (u0 && u0.q && u0.text) { askBack(t, day, { topic_id: t.id, day: day, text: u0.text, pct: u0.pct != null ? u0.pct : '' }, u0.q); return; }   // an open question from Claude is answered first

        if (f.type === 'choice') return '<div class="bd-f">' + lab + '<select class="bd-in" id="' + id + '"><option value="">Choose…</option>' + f.opts.map((o) => '<option' + (v === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select></div>';
        if (f.type === 'file') return '<div class="bd-f">' + lab + (fset(v) ? '<div class="bd-sub" style="margin-bottom:4px">Attached: <a href="' + esc(fileUrl(t, q('#uD').value, f.k)) + '" target="_blank" rel="noopener">📎 ' + esc(v.n || 'file') + '</a> — choose a file to replace it</div>' : '') + '<input class="bd-in" id="' + id + '" type="file" accept="image/*,.pdf,.xlsx,.xls,.csv,.doc,.docx,.txt,.mp4"></div>';
        return '<div class="bd-f">' + lab + '<input class="bd-in" id="' + id + '"' + (f.type === 'num' ? ' inputmode="decimal" placeholder="Number"' : f.type === 'link' ? ' inputmode="url" placeholder="https://…"' : ' maxlength="500"') + ' value="' + esc(fset(v) ? v : '') + '"></div>'; }).join('');

  /* the update was not clear: Claude's ONE question. The answer is added under the update; until then the day is not counted as filled. */

  // the section's own part of the HRMS first (Shop Wholesale section → Shop wholesale numbers on top)
  const allGroups = () => [...new Set(D.sources.map((s) => s.group))];
  const secGroup = () => { const n = (sec() ? sec().name : '').toLowerCase(); return allGroups().find((g) => g.toLowerCase().split(' ').some((w) => w.length > 3 && n.indexOf(w) > -1)) || ''; };
  const srcGroups = () => { const g = secGroup(); return g ? [g].concat(allGroups().filter((x) => x !== g)) : allGroups(); };
  function guessSource(title) {
    const g = secGroup(); if (!g) return ''; const words = title.toLowerCase().split(/[^\p{L}\p{N}\p{M}]+/u).filter(Boolean); let best = '', bs = 0;
    D.sources.filter((s) => s.group === g).forEach((s) => { const kw = s.kw.split(' '); const sc = words.filter((w) => kw.indexOf(w) > -1).length; if (sc > bs) { bs = sc; best = s.key; } });
    return best;
  }

        q('#tFh').innerHTML = '<b style="color:#5b3fd1">Claude set it up:</b> ' + esc(r.why || (r.metrics.length + ' numbers from the HRMS and ' + r.fields.length + ' fields.')) + ' Check it, change what is not right, then Save.'; } finally { b.textContent = old; } }); };
    const ticks = () => [...m.querySelectorAll('#tM input:checked')].map((x) => x.value); let ntTouched = !!t, mTouched = !!t;
    const unitVis = () => { const n = ticks().length; q('#tUw').style.display = n ? 'none' : ''; if (!ntTouched) q('#tNt').checked = n >= 2; }; unitVis();
    // auto-connect: a new topic whose name says what it is (Sales, Visits, Displays, Payment …) gets that number ticked by itself; the ticks can be changed
    if (!t) q('#tT').addEventListener('input', () => { if (mTouched) return; const k = guessSource(q('#tT').value); m.querySelectorAll('#tM input').forEach((x) => { x.checked = x.value === k; }); unitVis(); });
    q('#tM').addEventListener('change', () => { mTouched = true; unitVis(); });
    q('#tNt').addEventListener('change', () => { ntTouched = true; });
    q('#tX').onclick = () => BD.close();
    q('#tOk').onclick = () => run(q('#tOk'), async () => {
      await api.post('fup.topic_save', { id: t ? t.id : 0, section_id: D.section, title: q('#tT').value, note: q('#tN').value, kind: q('#tK').value, due_date: q('#tD').value, assignee_emp: Number(q('#tE').value), metrics: ticks(), fields: readFields(), need_text: q('#tNt').checked ? 1 : 0, unit: q('#tU').value, lag: q('#tL').checked ? 1 : 0 });
      BD.close(); toast('Topic saved.'); await load(true);
    });
    if (t) {
      const act = (a, body, msg) => run(null, async () => { await api.post(a, body); BD.close(); if (msg) toast(msg); await load(true); });
      q('#tUp').onclick = () => act('fup.topic_move', { id: t.id, dir: -1 });
      q('#tDn').onclick = () => act('fup.topic_move', { id: t.id, dir: 1 });
      q('#tFin').onclick = () => act('fup.topic_done', { id: t.id, done: t.status === 'done' ? 0 : 1 }, t.status === 'done' ? 'Topic is open again.' : 'Topic marked finished.');
      q('#tDel').onclick = async () => { if (await BD.confirm('Remove this topic?', '“' + t.title + '” leaves the sheet and My Day. Its old updates are kept in the system, not deleted.', 'Remove', true)) act('fup.topic_del', { id: t.id }, 'Topic removed.'); };
    }
  }

  /* ---------------- a section: its name, and (if wanted) the ONE person or department that writes everything in it ---------------- */
  async function sectionForm(s) {
    let P; try { P = await people(); } catch (e) { toast(e.message || 'Could not load the people.'); return; }
    const mode = s && s.owner_emp ? 'emp' : s && s.owner_dept ? 'dept' : 'none';
    const m = BD.modal('<h3>' + (s ? 'Section settings' : 'New section') + '</h3>'
      + '<div class="bd-f"><label>Name of the section</label><input class="bd-in" id="sN" maxlength="80" placeholder="Shop Wholesale · Surat Store · Dispatch …" value="' + esc(s ? s.name : '') + '"></div>'
      + '<div class="bd-f"><label>Give the WHOLE section to</label><select class="bd-in" id="sM"><option value="none"' + (mode === 'none' ? ' selected' : '') + '>Nobody: each topic has its own person</option><option value="emp"' + (mode === 'emp' ? ' selected' : '') + '>One person</option><option value="dept"' + (mode === 'dept' ? ' selected' : '') + '>A department (everybody in it)</option></select>'
      + '<div class="hint">The owner sees every topic of this section and can write every update. A topic can still have its own person.</div></div>'
      + '<div class="bd-f" id="sEw"><label>Person</label><select class="bd-in" id="sE"><option value="0">Choose…</option>' + P.people.map((p) => '<option value="' + p.id + '"' + (s && s.owner_emp === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select></div>'
      + '<div class="bd-f" id="sDw"><label>Department</label><select class="bd-in" id="sD"><option value="0">Choose…</option>' + P.depts.map((d) => '<option value="' + d.id + '"' + (s && s.owner_dept === d.id ? ' selected' : '') + '>' + esc(d.name) + '</option>').join('') + '</select></div>'
      + (s ? '<div style="margin-bottom:6px"><button class="bd-btn sm bad" id="sDel">Remove this section</button></div>' : '')
      + '<div class="acts"><button class="bd-btn" id="sX">Cancel</button><button class="bd-btn go" id="sOk">Save</button></div>', { sticky: true });
    const q = (i) => m.querySelector(i), vis = () => { q('#sEw').style.display = q('#sM').value === 'emp' ? '' : 'none'; q('#sDw').style.display = q('#sM').value === 'dept' ? '' : 'none'; }; vis(); q('#sM').onchange = vis;
    q('#sX').onclick = () => BD.close();
    q('#sOk').onclick = () => run(q('#sOk'), async () => {
      const md = q('#sM').value, oe = md === 'emp' ? Number(q('#sE').value) : 0, od = md === 'dept' ? Number(q('#sD').value) : 0;
      if ((md === 'emp' && !oe) || (md === 'dept' && !od)) { toast(md === 'emp' ? 'Choose the person.' : 'Choose the department.'); return; }
      const r = await api.post('fup.section_save', { id: s ? s.id : 0, name: q('#sN').value, owner_emp: oe, owner_dept: od });
      BD.close(); toast('Section saved.'); if (!s && r && r.id) SID = r.id; await load(true);
    });
    if (s) q('#sDel').onclick = async () => { if (await BD.confirm('Remove this section?', '“' + s.name + '” and its topics leave the screen for everybody. The old updates are kept in the system, not deleted.', 'Remove', true)) run(null, async () => { await api.post('fup.section_del', { id: s.id }); BD.close(); SID = 0; toast('Section removed.'); await load(true); }); };
  }

  function askClaude() {
    const b = $('askAi'); const old = b.textContent; b.textContent = 'Claude is reading…';
    run(b, async () => { try { const r = await api.post('fup.claude', { section_id: D.section }); if (r && r.digest) { D.digest = r.digest; render(); } } finally { if ($('askAi') && $('askAi').textContent === 'Claude is reading…') $('askAi').textContent = old; } });
  }

  load();
})();
</script>
</body>
</html>

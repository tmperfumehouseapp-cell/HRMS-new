  function renderList() { const fr = $('fRow'); if (fr) fr.innerHTML = filtHtml(); const l = document.querySelector('.sw-list'); if (l) l.innerHTML = listHtml(); }
  function bubHtml(m, prev) {

    x = g('[data-qe]'); if (x) { const q = S.cfg.quick.find((y) => String(y.id) === x.dataset.qe); if (q) { $('qsc').value = q.shortcut; $('qbd').value = q.body; $('qid').value = q.id; $('qsc').focus(); } return; }
    x = g('[data-qd]'); if (x) { if (confirm('Delete this quick reply?')) { try { await api.post('st_wa.quick_del', { id: +x.dataset.qd }); await loadCfg(); render(); } catch (er) { toast(er.message); } } return; }
    if (g('#saveQ')) { try { await api.post('st_wa.quick_save', { id: +$('qid').value, shortcut: $('qsc').value, body: $('qbd').value }); toast('Saved ✓'); await loadCfg(); render(); } catch (er) { toast(er.message); } return; }
  });
  document.addEventListener('change', async (e) => { if (e.target.id === 'asg') { try { await api.post('st_wa.assign', { phone: S.cur, emp_id: +e.target.value }); toast('Handed over'); await openChat(S.cur); S.info = true; render(); } catch (er) { toast(er.message); } } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (S.tplOpen) { S.tplOpen = false; drawTpl(); } else if (S.pop) { S.pop = ''; const c = $('cmp'); if (c) c.innerHTML = cmpHtml(), bind(); } } });
  (async function init() {
    try { await loadCfg(); } catch (e) { $('app').innerHTML = `<div class="empty" style="margin-top:14vh"><div class="ic">🔒</div><b style="font-size:18px">${esc(e.message)}</b><br><br><button class="sx-btn" onclick="location.href='hub.html?w=store&t=store_billing'">‹ Back to HRMS</button></div>`; return; }
    if (S.cfg.number) { await loadChats(); const p = new URLSearchParams(location.search).get('phone'); if (p) { render(); await openChat(p.replace(/\D/g, '').slice(-10)); } }
    render(); setInterval(tick, 6000); document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  })();
})();
</script>
</body>
</html>

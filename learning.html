      }
      const R = C.last; if (!R) return; S.waAllBusy = 'fin'; paint(true, true);
      try {
        const d = await api.post('teach.wa_finish', { title: R.title, understood: R.understood, summary: R.summary, rules: R.rules, concept: R.concept, clash: R.clash, impact: R.impact, turns: C.turns, wa_n: real.reduce((x, g) => x + g.n, 0) });
        applyBoard(d); S.bdOpen[d.tid] = true; let n = 0;
        for (const g of real) n += (await api.post('wa.learn_group_act', { ids: g.ids, act: 'board', title: g.title })).done || 0;
        for (const g of nothing) await api.post('wa.learn_group_act', { ids: g.ids, act: 'skip', title: g.title });
        S.waAllMsg = '✅ <b>Submitted.</b> “' + esc(R.title) + '” is ready on the Teach tab — press <b>Concept clear</b> there to start using it. ' + n + ' WhatsApp replies cleared.';
        S.waConv = null; S.waG = { groups: [] };

      } catch (er) { toast(msg(er), true); }

    }

    if (act === 'wa_gsug' || act === 'wa_gteach' || act === 'wa_gskip') {
      const g = ((S.waG || {}).groups || []).find((x) => x.gid === b.dataset.g); if (!g) return; const box = $('lxG_' + g.gid);

      b.disabled = true; b.textContent = act === 'wa_gteach' ? '🤖 Teaching…' : 'Clearing…';

          const d = await api.post('teach.board_summary', { tid: g.tid, text, part: 1, src: 'whatsapp', wa_n: g.n }); applyBoard(d); S.bdOpen[g.tid] = true; }
        else if (act === 'wa_gteach') { const text = 'From ' + g.n + ' WhatsApp replies — situation: ' + g.title + '.\nWhat customers wrote: ' + g.customers + '\nWhat my team did: ' + g.team + '\nWhat the bot did: ' + g.bot + '\n' + (g.question ? 'Question: ' + g.question + '\n' : '') + 'MY GENERAL ANSWER (follow this for every such customer): ' + ans;
          const d = await api.post('teach.board_add', { text }); applyBoard(d); (d.touched || []).forEach((id) => { S.bdOpen[id] = true; }); }
        const r0 = await api.post('wa.learn_group_act', { ids: g.ids, act: act === 'wa_gteach' ? 'board' : 'skip', title: g.title });
        S.waG.groups = S.waG.groups.filter((x) => x.gid !== g.gid); if (S.waGd) delete S.waGd[g.gid];
        toast(act === 'wa_gteach' ? (g.tid ? 'Added to the topic “' + (g.topic || '') + '” — check the proposal on the Teach tab and Approve. ' : 'Sent to the Teach board — ') + r0.done + ' replies cleared.' : r0.done + ' replies cleared.');
        const r = await soft(() => api.get('wa.learn_list', { st: S.waSt })); if (r.ok) S.wa = r.d;

    if (act === 'wa_teach' || act === 'wa_skip') { const x = S.wa.items[+b.dataset.i]; b.disabled = true; try { await api.post('wa.learn_act', { id: x.id, act: act === 'wa_teach' ? 'teach' : 'skip', text: act === 'wa_teach' ? ($('lxW' + b.dataset.i) || {}).value : undefined }); toast(act === 'wa_teach' ? 'Saved — the bot learns it.' : 'Skipped.'); const r = await soft(() => api.get('wa.learn_list', { st: S.waSt })); if (r.ok) S.wa = r.d; } catch (er) { toast(msg(er), true); } paint(true, true); return; }
    if (act === 'gap_board' || act === 'gap_ignore') { try { const d = await api.post('learn.gap_act', { kind: b.dataset.kind, id: b.dataset.id, act: act === 'gap_board' ? 'board' : 'ignore' }); if (d && d.topics) { applyBoard(d); (d.touched || []).forEach((id) => { S.bdOpen[id] = true; }); } const r = await soft(() => api.get('learn.gaps')); if (r.ok) S.gaps = r.d; if (act === 'gap_board') { toast('Added to the Teach board.'); S.tab = 'teach'; } } catch (er) { toast(msg(er), true); } paint(); return; }

    if (act.startsWith('t_')) { testAct(act, b); return; }
  });
  // screenshots for "Tell me anything": shrunk to at most 1600 px (JPEG) in the browser so they upload fast
  const lxShot = (file) => new Promise((ok) => { if (!file || !/^image\//.test(file.type)) return ok(null); const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 1600 / Math.max(im.width, im.height)); const cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); ok({ mime: 'image/jpeg', data: cv.toDataURL('image/jpeg', 0.85).split(',')[1] }); }; im.onerror = () => ok(null); im.src = fr.result; }; fr.onerror = () => ok(null); fr.readAsDataURL(file); });
  const lxAddShots = async (files) => { const r = $('lxIn'); if (r) S.bdIn = r.value; for (const f of files) { if (S.bdImgs.length >= 4) { toast('Up to 4 screenshots at a time.', true); break; } const x = await lxShot(f); if (x) S.bdImgs.push(x); } paint(true, true); };

  document.addEventListener('change', (e) => { const t = e.target; if (!t) return; if (t.id === 'lxImg') { lxAddShots([...t.files]); t.value = ''; } else if (t.dataset && t.dataset.shelf) S.bdShelf[t.dataset.shelf] = t.value; });

  });

  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target && e.target.id === 'lxChatIn') { e.preventDefault(); const b = root.querySelector('[data-lx="t_send"]'); if (b) b.click(); } if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && e.target && e.target.id === 'lxIn') { e.preventDefault(); const b = root.querySelector('[data-lx="add"]'); if (b) b.click(); } });

  loadAll(); wchBillDot();
  // ⚡ live board: every 4 s the Teach tab checks the server (the cron or another screen may have added questions) and, when old / new chats are waiting, asks the server to read the next ones. Never repaints while you type.
  let mineRun = false, mineNext = 0;
  const boardOf = (d) => ({ topics: d.topics || [], done: d.done || 0, note: d.note || '', groups: d.groups || [], chats: d.chats || null, guide_new: d.guide_new || 0 });
  async function mineKick() {
    mineRun = true; S.mineBusy = true; const typing = () => document.activeElement && document.activeElement.matches('textarea,input');

      const d = await api.post('teach.board_chats', {}); S.mineWhy = d.why || ''; S.mineErr = '';

  }

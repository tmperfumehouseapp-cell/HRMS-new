<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Manual order — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
  .mo{max-width:560px;margin:0 auto;padding:6px 14px 40px;}
  .mo label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 4px;}
  .mo input,.mo select,.mo textarea{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:#fff;color:#111;}
  .mo .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mo .go{margin-top:18px;width:100%;padding:12px;font-size:15px;font-weight:800;}
  .mo .ok{background:#e7f8ee;border:1px solid #8fd6a8;color:#14532d;border-radius:12px;padding:12px;margin:12px 0;font-size:14px;}
  .mo .err{background:#fdecec;border:1px solid #f1a5a5;color:#7f1d1d;border-radius:12px;padding:12px;margin:12px 0;font-size:14px;}
  .mo .hint{font-size:12.5px;color:var(--muted);margin:2px 0 10px;}
  html[data-theme=dark] .mo input,html[data-theme=dark] .mo select,html[data-theme=dark] .mo textarea{background:#1f2430;color:#eee;border-color:#374151;}
  @media (max-width:520px){.mo .row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><h1>Manual order</h1></div>
    <div class="content mo">
      <p class="hint">For a customer who is not in HRMS (came from outside). Type the customer's number, then fill the same Manual order sheet as in a chat (payment, perfumes, combo). It becomes a normal order and counts for you like a Shopify order.</p>
      <div id="moMsg"></div>
      <form id="moForm" autocomplete="off">
        <label>Customer mobile number *</label>
        <input id="mPhone" type="tel" inputmode="numeric" placeholder="10-digit number, e.g. 9876543210" required>
        <label>Customer name</label>
        <input id="mName" type="text" placeholder="Customer name">
        <button class="btn go" id="mSave" type="submit">🧾 Open manual order</button>
      </form>
      <button class="btn go" id="mList" type="button" style="background:#fff;color:#111;border:1px solid var(--line);margin-top:10px">Orders of this customer</button>
    </div>
  </main>
</div>
<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=9"></script>
<script src="assets/js/layout.js?v=28"></script>
<script>
  guardPage();
  renderSidebar('manual_order');
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function loadUi(cb) {
    if (window.WaManual) return cb();
    const sc = document.createElement('script'); sc.src = 'assets/js/wmo_ui.js?v=1'; sc.onload = cb; sc.onerror = cb; document.head.appendChild(sc);
  }
  async function start(listOnly) {
    $('moMsg').innerHTML = '';
    const phone = $('mPhone').value.replace(/\D+/g, '').slice(-10), name = $('mName').value.trim();
    if (phone.length !== 10) { $('moMsg').innerHTML = '<div class="err">Enter the 10-digit customer mobile number.</div>'; return; }
    const b = $('mSave'); b.disabled = true;
    try {
      const r = await api.post('wmo.start', { phone, name });
      loadUi(() => {
        if (!window.WaManual) { $('moMsg').innerHTML = '<div class="err">Manual order could not load. Refresh the page.</div>'; return; }
        const o = { phone: r.phone, name: name || r.name || '', api, onDone: () => { $('moMsg').innerHTML = '<div class="ok">✅ Order created. The customer gets the address link; it lands in your orders when they confirm.</div>'; } };
        if (listOnly) WaManual.orders(o); else WaManual.open(o);
      });
    } catch (err) {
      $('moMsg').innerHTML = '<div class="err">' + esc(err.message) + '</div>';
    } finally { b.disabled = false; }
  }
  $('moForm').addEventListener('submit', (e) => { e.preventDefault(); start(false); });
  $('mList').addEventListener('click', () => start(true));
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Finance New · Receipt and Payment — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=260928b">
<link rel="stylesheet" href="assets/css/store.css?v=6">
<style>
  .ov{position:fixed;inset:0;background:rgba(20,22,26,.42);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}.ov.on{opacity:1;pointer-events:auto}
  .dr{position:fixed;top:0;right:0;bottom:0;width:min(500px,96vw);background:var(--sx-bg);z-index:41;display:flex;flex-direction:column;transform:translateX(104%);transition:transform .22s cubic-bezier(.2,.8,.2,1);box-shadow:-18px 0 50px rgba(20,22,26,.22);border-radius:26px 0 0 26px}.dr.on{transform:none}
  .dr.wide{width:min(720px,96vw)}@media (max-width:640px){.dr,.dr.wide{width:100%;border-radius:0}}
  .dr-h{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-radius:26px 0 0 0;box-shadow:0 1px 0 var(--sx-line)}@media (max-width:640px){.dr-h{border-radius:0}}
  .dr-h b{font-size:16px;flex:1}.dr-x{border:0;background:var(--sx-bg);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;font-weight:700}
  .dr-b{flex:1;overflow-y:auto;padding:12px 14px;display:grid;gap:10px;align-content:start}.dr-f{padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -1px 0 var(--sx-line)}
  .dr .sx-card{padding:12px 14px;border-radius:18px;box-shadow:none;border:1px solid var(--sx-line)}.dr .sx-in{min-height:38px;padding:7px 10px;font-size:14px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar .sp{flex:1}
  .nav{display:flex;gap:4px;align-items:center;background:#fff;border-radius:999px;padding:3px 6px;box-shadow:inset 0 0 0 1.5px var(--sx-line)}
  .nav button{border:0;background:none;width:34px;height:34px;border-radius:12px;font-size:18px;font-weight:800;cursor:pointer}.nav button:hover{background:var(--sx-bg)}.nav button:disabled{opacity:.3;cursor:default}
  .nav input{border:0;background:none;font:800 14px inherit;min-height:34px;padding:0 4px}
  .sheet{background:#fff;border-radius:22px;box-shadow:0 0 0 1px var(--sx-line);overflow:hidden}
  .sheet .ban{background:#3a3f47;color:#fff;text-align:center;font-weight:800;letter-spacing:.04em;padding:9px 12px;font-size:14px}
  .cols{display:grid;grid-template-columns:1fr 1fr}.cols>div{min-width:0}.cols>div+div{border-left:1px solid var(--sx-line)}
  @media (max-width:760px){.cols{grid-template-columns:1fr}.cols>div+div{border-left:0;border-top:2px solid var(--sx-line)}}
  .hd{text-align:center;font-weight:800;letter-spacing:.06em;font-size:13px;padding:10px 8px;border-bottom:1px solid var(--sx-line)}
  .ln{display:flex;gap:8px;justify-content:space-between;align-items:baseline;padding:6px 14px;font-size:13.5px;border-bottom:1px dotted var(--sx-line);cursor:pointer}.ln:hover{background:var(--sx-bg)}
  .ln b{font-variant-numeric:tabular-nums;white-space:nowrap}.ln.z span{color:var(--sx-mut)}.ln.h{cursor:default;background:#f6f7f9;font-weight:800}.ln.h:hover{background:#f6f7f9}
  .ln.tt{cursor:default;background:#eef0f6;font-weight:800;border-top:2px solid var(--sx-ink)}.ln.tt:hover{background:#eef0f6}.ln.tt b.neg{color:#b42318}
  .gap{height:14px;border-bottom:1px solid var(--sx-line)}
  .cb{font-weight:800;text-decoration:underline;padding:8px 14px 4px;font-size:13px}
  .tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--sx-mut);text-align:right;padding:4px 6px}.tb th:first-child,.tb td:first-child{text-align:left}
  .tb td{padding:7px 6px;border-top:1px solid var(--sx-line);text-align:right}.tb tr.void td{opacity:.45;text-decoration:line-through}
  .pen{opacity:.35;font-size:12px;padding:0 4px;cursor:pointer;margin-left:4px}.ln:hover .pen{opacity:1}.pen:hover{color:var(--sx-accent)}
  .pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:800}.pill.in{background:#e3f6ee;color:#0d7a55}.pill.out{background:#fdecea;color:#b42318}
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><div><h1>Finance New · Receipt and Payment</h1><div class="sub" style="font-size:12.5px;color:var(--muted);margin-top:2px">The daily report: opening, receipts, payments and the closing balance of every bank</div></div></div>
    <div class="content"><div class="sx-page" id="root"><div class="sx-card sx-mut">Loading…</div></div></div>
  </main>
</div>
<div class="ov" id="ov"></div>
<aside class="dr" id="dr" aria-hidden="true"><div class="dr-h"><b id="drT"></b><button class="dr-x" id="drX" aria-label="Close">×</button></div><div class="dr-b" id="drB"></div><div class="dr-f" id="drF"></div></aside>

<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/api.js?v=14"></script>
<script src="assets/js/layout.js?v=33"></script>
<script src="assets/js/store_common.js?v=3"></script>
<script>
  guardPage();
  renderSidebar('fn_sum');
  const m2 = (n) => { n = Number(n || 0); return '₹' + n.toLocaleString('en-IN', { minimumFractionDigits: Math.abs(n % 1) > 0.004 ? 2 : 0, maximumFractionDigits: 2 }); };
  const num = (n) => Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const dLong = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const addDays = (d, n) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
  let D = null, day = '', ACC = [], HEADS = [];

  // ---------- drawer
  const open = (title, body, foot) => { $('drT').textContent = title; $('drB').innerHTML = body; $('drF').innerHTML = foot || ''; $('drF').style.display = foot ? '' : 'none'; $('dr').classList.add('on'); $('ov').classList.add('on'); $('dr').setAttribute('aria-hidden', 'false'); };
  const close = () => { $('dr').classList.remove('on'); $('ov').classList.remove('on'); $('dr').setAttribute('aria-hidden', 'true'); };
  $('drX').onclick = close; $('ov').onclick = close; document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  const note = (id, m, bad) => { const e = $(id); if (e) e.innerHTML = m ? `<div class="sx-msg ${bad ? 'bad' : 'ok'}">${sxi(bad ? 'xc' : 'ok')}<span>${esc(m)}</span></div>` : ''; };

  // ---------- the sheet
  const lines = (arr, side) => arr.map((l) => `<div class="ln ${l.amount ? '' : 'z'}" data-add="${side}" data-head="${l.id}" title="Add an entry for ${esc(l.name)}"><span>${esc(l.name)}${l.n > 1 ? ' <small class="sx-mut">(' + l.n + ')</small>' : ''}<span class="pen" data-hed="${l.id}" title="Rename or hide this line">✎</span></span><b>${l.amount ? num(l.amount) : ''}</b></div>`).join('') || '<div class="ln h"><span class="sx-mut">No lines yet: add them under “Lines”.</span></div>';
  function draw() {
    const R = D.receipts, P = D.payments, C = D.closing, canNext = day < D.today;
    const warn = Math.abs(D.check) > 0.004 ? `<div class="sx-card" style="margin-bottom:12px"><div class="sx-msg warn">${sxi('alert')}<span>The sheet is out by <b>${m2(D.check)}</b>. Money dated <b>before a bank's opening-balance day</b> is not counted in that bank's balance. Check the bank's opening-balance day under “Banks”.</span></div></div>` : '';
    $('root').innerHTML = `
      <div class="bar"><div class="nav"><button id="pv" aria-label="Previous day">‹</button><input type="date" id="dp" value="${esc(day)}" max="${esc(D.today)}"><button id="nx" ${canNext ? '' : 'disabled'} aria-label="Next day">›</button></div>
        ${day !== D.today ? '<button class="sx-btn" id="tdy">Today</button>' : ''}<span class="sp"></span>
        <button class="sx-btn" data-add="in">+ Receipt</button><button class="sx-btn" data-add="out">+ Payment</button><button class="sx-btn" id="bAcc">Banks</button><button class="sx-btn" id="bHeads">Lines</button></div>
      ${warn}
      <div class="sheet"><div class="ban">${esc(dLong(day))}</div>
        <div class="cols">
          <div><div class="hd">RECEIPT</div>
            ${lines(R.lines, 'in')}
            <div class="ln tt"><span>Total Receipts</span><b>${num(R.total_in)}</b></div><div class="gap"></div>
            <div class="cb">OPENING BALANCE</div>
            ${C.accounts.map((a) => `<div class="ln" style="cursor:default" title="The closing of the day before"><span>${esc(a.name)}</span><b>${num(a.opening)}</b></div>`).join('') || '<div class="ln h"><span class="sx-mut">No bank yet: add under “Banks”.</span></div>'}
            <div class="ln tt"><span>TOTAL</span><b>${num(R.total)}</b></div></div>
          <div><div class="hd">PAYMENTS</div>
            ${lines(P.lines, 'out')}
            <div class="ln tt"><span>Total Expenses</span><b class="neg">${num(P.total_expenses)}</b></div><div class="gap"></div>
            <div class="cb">CLOSING BALANCE</div>
            ${C.accounts.map((a) => `<div class="ln" style="cursor:default" title="Opening ${num(a.opening)} · in ${num(a.in)} · out ${num(a.out)}"><span>${esc(a.name)}</span><b>${num(a.closing)}</b></div>`).join('') || '<div class="ln h"><span class="sx-mut">No bank yet: add under “Banks”.</span></div>'}
            <div class="ln tt"><span>TOTAL</span><b>${num(C.with_expenses)}</b></div></div>
        </div></div>
      <div class="sx-card" style="margin-top:12px"><div class="sx-f" style="margin-bottom:6px">Entries of this day <small class="sx-mut">${D.entries.filter((e) => e.status === 'ok').length}</small></div>
        ${D.entries.length ? `<table class="tb"><tr><th>What</th><th>Bank</th><th>Note</th><th>Amount</th><th></th></tr>${D.entries.map((e) => `<tr class="${e.status === 'void' ? 'void' : ''}"><td><span class="pill ${e.side}">${e.side === 'in' ? 'Receipt' : 'Payment'}</span> ${esc(e.head)}</td><td>${esc(e.account)}</td><td style="text-align:left">${esc(e.note)}${e.status === 'void' ? ' <small>(cancelled: ' + esc(e.void_reason) + ')</small>' : ''}${e.edited ? ' <small class="sx-mut">(edited)</small>' : ''}</td><td><b>${num(e.amount)}</b></td><td style="white-space:nowrap">${e.status === 'ok' ? `<button class="sx-btn" data-eent="${e.id}" style="padding:2px 10px">Edit</button> <button class="sx-btn" data-void="${e.id}" style="padding:2px 10px">Cancel</button>` : ''}</td></tr>`).join('')}</table>` : '<div class="sx-mut">Nothing entered for this day yet. Click a line on the sheet, or use “+ Receipt” / “+ Payment”.</div>'}</div>`;
  }
  async function load(d) {
    try { D = await api.get('fn.day', d ? { date: d } : {}); day = D.date; draw(); }
    catch (e) { $('root').innerHTML = `<div class="sx-card"><div class="sx-msg bad">${sxi('xc')}<span>${esc(e.message)}</span></div></div>`; }
  }
  async function loadLists() { ACC = (await api.get('fn.accounts')).accounts; HEADS = (await api.get('fn.heads')).heads; }

  // ---------- add an entry
  async function entryDrawer(side, headId, ent) {
    await loadLists(); const accs = ent ? ACC : ACC.filter((a) => a.active);
    if (!accs.length) { accDrawer(); return; }
    if (ent) { side = ent.side; headId = ent.head_id; }
    const heads = (s) => HEADS.filter((h) => h.side === s && (h.active || (ent && h.id === ent.head_id)));
    const headOpts = (s, sel) => heads(s).map((h) => `<option value="${h.id}" ${+sel === h.id ? 'selected' : ''}>${esc(h.name)}</option>`).join('');
    open(ent ? 'Edit this entry' : side === 'in' ? 'Add a receipt' : 'Add a payment', `<div class="sx-card">
      <div class="sx-r2"><label class="sx-f">Type<select class="sx-in" id="eS"><option value="in" ${side === 'in' ? 'selected' : ''}>Receipt (money in)</option><option value="out" ${side === 'out' ? 'selected' : ''}>Payment (money out)</option></select></label>
      <label class="sx-f">Date<input class="sx-in" id="eD" type="date" value="${esc(ent ? ent.day : day)}" max="${esc(D.today)}"></label></div>
      <label class="sx-f" style="margin-top:10px">What is it<select class="sx-in" id="eH">${headOpts(side, headId)}</select></label>
      <label class="sx-f" style="margin-top:10px">Bank / cash box<select class="sx-in" id="eA">${accs.map((a) => `<option value="${a.id}" ${ent && ent.account_id === a.id ? 'selected' : ''}>${esc(a.name)}${a.active ? '' : ' (hidden)'}</option>`).join('')}</select></label>
      <label class="sx-f" style="margin-top:10px">Amount (₹)<input class="sx-in" id="eM" type="number" step="0.01" inputmode="decimal" placeholder="0" value="${ent ? ent.amount : ''}"></label>
      <label class="sx-f" style="margin-top:10px">Note (optional)<input class="sx-in" id="eN" maxlength="255" autocomplete="off" value="${ent ? esc(ent.note) : ''}"></label><div id="eMsg" style="margin-top:8px"></div></div>`,
      `<button class="sx-btn big" id="eOk">${ent ? 'Save changes' : 'Save'}</button>`);
    $('eS').onchange = () => { $('eH').innerHTML = headOpts($('eS').value, 0); };
    $('eM').focus();
    $('eOk').onclick = async () => {
      try { await api.post(ent ? 'fn.entry_update' : 'fn.entry_save', { id: ent ? ent.id : 0, date: $('eD').value, side: $('eS').value, head_id: +$('eH').value, account_id: +$('eA').value, amount: $('eM').value, note: $('eN').value }); close(); await load($('eD').value); }
      catch (e) { note('eMsg', e.message, 1); }
    };
  }

  // ---------- banks
  async function accDrawer() {
    await loadLists(); let edit = 0;
    const list = () => ACC.map((a) => `<div class="ln" style="cursor:default"><span><b>${esc(a.name)}</b> <small class="sx-mut">${a.opening_date ? 'opening ' + num(a.opening_balance) + ' on ' + esc(a.opening_date) : 'no opening balance'}${a.active ? '' : ' · hidden'}</small></span><span><button class="sx-btn" data-ed="${a.id}" style="padding:2px 10px">Edit</button></span></div>`).join('') || '<div class="sx-mut">No bank yet.</div>';
    open('Banks and cash boxes', `<div class="sx-card"><div class="sx-f" style="margin-bottom:6px">Your banks</div>${list()}</div>
      <div class="sx-card"><div class="sx-f" style="margin-bottom:6px" id="aT">Add one</div><label class="sx-f">Name<input class="sx-in" id="aN" placeholder="e.g. HDFC, Store cash box" autocomplete="off"></label>
        <div class="sx-r2" style="margin-top:10px"><label class="sx-f">Opening balance (₹)<input class="sx-in" id="aO" type="number" step="0.01" inputmode="decimal" placeholder="0"></label><label class="sx-f">Balance as of<input class="sx-in" id="aD" type="date" value="${esc(D.today)}" max="${esc(D.today)}"></label></div>
        <label class="sx-f" id="aHW" style="display:none;margin-top:8px;flex-direction:row;gap:6px;align-items:center"><input type="checkbox" id="aH"> Hide this bank</label><div id="aM" style="margin-top:8px"></div></div>`,
      `<button class="sx-btn big" id="aS">Add bank</button>`);
    document.querySelectorAll('[data-ed]').forEach((b) => { b.onclick = () => { const a = ACC.find((x) => x.id === +b.dataset.ed); if (!a) return; edit = a.id; $('aN').value = a.name; $('aO').value = a.opening_date ? a.opening_balance : ''; $('aD').value = a.opening_date || D.today; $('aT').textContent = 'Edit: ' + a.name; $('aS').textContent = 'Save changes'; $('aHW').style.display = 'flex'; $('aH').checked = !a.active; $('aN').focus(); }; });
    $('aS').onclick = async () => {
      try { await api.post('fn.account_save', { id: edit, name: $('aN').value, opening_balance: $('aO').value, opening_date: $('aO').value !== '' ? $('aD').value : '', active: edit && $('aH').checked ? 0 : 1 }); await load(day); accDrawer(); }
      catch (e) { note('aM', e.message, 1); }
    };
  }

  // ---------- lines (the receipt / payment heads of the sheet)
  async function headsDrawer(startId) {
    await loadLists(); let edit = 0;
    const list = (s) => HEADS.filter((h) => h.side === s).map((h) => `<div class="ln" style="cursor:default"><span>${esc(h.name)}${h.active ? '' : ' <small class="sx-mut">hidden</small>'}</span><span><button class="sx-btn" data-eh="${h.id}" style="padding:2px 10px">Edit</button></span></div>`).join('') || '<div class="sx-mut">None yet.</div>';
    open('Lines of the sheet', `<div class="sx-card"><div class="sx-f" style="margin-bottom:6px">Receipt lines</div>${list('in')}</div><div class="sx-card"><div class="sx-f" style="margin-bottom:6px">Payment lines</div>${list('out')}</div>
      <div class="sx-card"><div class="sx-f" style="margin-bottom:6px" id="hT">Add a line</div>
        <div class="sx-r2"><label class="sx-f">Name<input class="sx-in" id="hN" autocomplete="off" placeholder="e.g. Myntra, Rent"></label><label class="sx-f">Side<select class="sx-in" id="hS"><option value="in">Receipt</option><option value="out">Payment</option></select></label></div>
        <label class="sx-f" id="hHW" style="display:none;margin-top:8px;flex-direction:row;gap:6px;align-items:center"><input type="checkbox" id="hH"> Hide this line</label><div id="hM" style="margin-top:8px"></div></div>`,
      `<button class="sx-btn big" id="hOk">Add line</button>`);
    document.querySelectorAll('[data-eh]').forEach((b) => { b.onclick = () => { const h = HEADS.find((x) => x.id === +b.dataset.eh); if (!h) return; edit = h.id; $('hN').value = h.name; $('hS').value = h.side; $('hS').disabled = true; $('hT').textContent = 'Edit: ' + h.name; $('hOk').textContent = 'Save changes'; $('hHW').style.display = 'flex'; $('hH').checked = !h.active; $('hN').focus(); }; });
    if (startId) { const sb = document.querySelector('[data-eh="' + startId + '"]'); if (sb) sb.click(); }
    $('hOk').onclick = async () => {
      try { await api.post('fn.head_save', { id: edit, side: $('hS').value, name: $('hN').value, active: edit && $('hH').checked ? 0 : 1 }); await load(day); headsDrawer(); }
      catch (e) { note('hM', e.message, 1); }
    };
  }

  document.addEventListener('click', async (e) => {
    const t = e.target.closest('button, [data-hed], [data-add]'); if (!t) return;
    if (t.id === 'pv') load(addDays(day, -1)); else if (t.id === 'nx' && !t.disabled) load(addDays(day, 1)); else if (t.id === 'tdy') load('');
    else if (t.id === 'bAcc') accDrawer(); else if (t.id === 'bHeads') headsDrawer();
    else if (t.dataset.hed) headsDrawer(+t.dataset.hed);
    else if (t.dataset.eent) entryDrawer('', 0, D.entries.find((x) => x.id === +t.dataset.eent));
    else if (t.dataset.add) entryDrawer(t.dataset.add, t.dataset.head || 0);
    else if (t.dataset.void) {
      const why = prompt('Why is this entry cancelled?'); if (!why) return;
      try { await api.post('fn.entry_void', { id: +t.dataset.void, reason: why }); await load(day); } catch (er) { alert(er.message); }
    }
  });
  document.addEventListener('change', (e) => { if (e.target.id === 'dp' && e.target.value) load(e.target.value); });
  load('');
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<title>Team manager — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
.tm-sub{font-size:12.5px;color:var(--muted);margin-top:3px;max-width:75ch}
.tm-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.tm-sum{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;margin-bottom:12px;font-size:13px;line-height:1.5;white-space:pre-wrap}
.tm-row{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.tm-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tm-n{font-weight:700}
.tm-chip{font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;background:#e5e7eb;color:#374151}
.tm-chip.first{background:#dcfce7;color:#166534}.tm-chip.late{background:#ffedd5;color:#9a3412}.tm-chip.hold{background:#fee2e2;color:#b91c1c}.tm-chip.off{background:#f3f4f6;color:#6b7280}.tm-chip.meet{background:#ede9fe;color:#5b21b6}
.tm-m{font-size:12px;color:var(--muted);margin-top:4px}
.tm-card{font-size:13px;margin-top:6px;padding:6px 8px;background:#f1f5f9;border-radius:8px}
.tm-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.tm-empty{padding:26px;text-align:center;color:var(--muted)}.tm-err{color:#d9423b;padding:12px}
@media (max-width:820px){.topbar{padding-left:62px}}
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><div><h1>🧭 Team manager</h1><div class="tm-sub">Claude looks at every salesperson together (order ratio, speed, who is at work, complaints, load) and decides who sees new orange / red chats first. <b>Suggest</b> = decisions are only shown here. <b>Apply</b> = Needs-you-now uses them. Nobody is blocked without your Approve.</div></div></div>
    <div class="content"><div id="tmRoot"><div class="tm-empty">Loading…</div></div></div>
  </main>
</div>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/api.js?v=9"></script>
<script src="assets/js/layout.js?v=24"></script>
<script>
guardPage();
(function () {
  'use strict';
  renderSidebar('wasales');
  const root = document.getElementById('tmRoot');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let D = null, busy = false;
  async function load() {
    try { D = await api.get('wq.mgr_get'); draw(); } catch (e) { root.innerHTML = '<div class="tm-err">' + esc(e.message) + '</div>'; }
  }
  function row(r) {
    const s = r.sig || {}, L = D.levels || {};
    const sel = '<select data-set="' + r.emp_id + '"><option value="auto"' + (!r.manual ? ' selected' : '') + '>Auto (Claude)</option>' + Object.keys(L).map((k) => '<option value="' + k + '"' + (r.manual === k ? ' selected' : '') + '>' + esc(L[k]) + '</option>').join('') + '</select>';
    const lv = r.level || 'normal';
    return '<div class="tm-row"><div class="tm-h"><span class="tm-n">' + esc(s.name) + '</span>'
      + '<span class="tm-chip ' + esc(lv) + '">' + esc(L[lv] || lv || 'not decided yet') + (r.manual ? ' · by hand' : '') + '</span>'
      + (s.present ? '<span class="tm-chip first">At work</span>' : '<span class="tm-chip off">Not at work</span>')
      + (r.meet_admin ? '<span class="tm-chip meet">Meet admin</span>' : '')
      + (s.sure_behind ? '<span class="tm-chip late">Clearly behind the team</span>' : '') + '</div>'
      + '<div class="tm-m">Ratio ' + (s.ratio_pct == null ? '—' : s.ratio_pct + '%') + ' (team ' + esc(s.team_ratio_pct) + '%) · ' + esc(s.orders_30d) + ' orders / ' + esc(s.queries_30d) + ' queries (30 days) · speed today ' + (s.speed_median_min_today == null ? '—' : esc(s.speed_median_min_today) + ' min') + ' · overdue complaints ' + esc(s.overdue_complaints) + ' · pending answers ' + esc(s.pending_answers) + ' · open chats ' + esc(s.open_chats) + '</div>'
      + (r.card ? '<div class="tm-card">📣 ' + esc(r.card) + '</div>' : '') + (r.reason ? '<div class="tm-m">Why: ' + esc(r.reason) + '</div>' : '')
      + '<div class="tm-act">' + sel + ((r.auto_level === 'hold' || r.manual === 'hold') ? '<button class="btn ' + (r.approved ? '' : 'primary') + '" data-appr="' + r.emp_id + '" data-v="' + (r.approved ? 0 : 1) + '">' + (r.approved ? 'Approved — undo' : 'Approve “no new chats”') + '</button>' : '') + '</div></div>';
  }
  function draw() {
    const rows = (D.rows || []).slice().sort((a, b) => (b.sig.present - a.sig.present) || String(a.sig.name).localeCompare(b.sig.name));
    root.innerHTML = '<div class="tm-bar"><label>Mode <select id="tmMode"><option value="off">Off</option><option value="suggest">Suggest (only show)</option><option value="apply">Apply (Needs-you-now uses it)</option></select></label>'
      + '<button class="btn primary" id="tmRun">Ask Claude now</button><span class="tm-m">Last run: ' + esc(D.ran_at || 'never') + ' · runs by itself every 10 minutes</span></div>'
      + (D.summary ? '<div class="tm-sum">🧠 ' + esc(D.summary) + '</div>' : '') + (rows.length ? rows.map(row).join('') : '<div class="tm-empty">No salespeople found.</div>');
    document.getElementById('tmMode').value = D.mode;
  }
  root.addEventListener('change', async (e) => {
    const t = e.target; if (busy) return; busy = true;
    try {
      if (t.id === 'tmMode') await api.post('wq.mgr_cfg', { mode: t.value });
      else if (t.dataset.set) await api.post('wq.mgr_set', { emp_id: +t.dataset.set, level: t.value });
      await load();
    } catch (er) { alert(er.message); } busy = false;
  });
  root.addEventListener('click', async (e) => {
    const t = e.target.closest('button'); if (!t || busy) return; busy = true;
    try {
      if (t.id === 'tmRun') { t.disabled = true; t.textContent = 'Claude is reading the team…'; await api.post('wq.mgr_run', {}); }
      else if (t.dataset.appr) await api.post('wq.mgr_approve', { emp_id: +t.dataset.appr, approve: +t.dataset.v });
      await load();
    } catch (er) { alert(er.message); } busy = false;
  });
  load();
})();
</script>
</body>
</html>

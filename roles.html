<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HRMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Roles — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=3">
<style>
  /* Role popup: the tick list sits inside ".field", so the shared label / input rules made every page name huge, upper-case and grey,
     and stretched the tick boxes to full width. These rules give each page its own tidy row. */
  #permGrid{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; margin-top:8px;}
  #permGrid .perm{display:flex; align-items:center; gap:10px; margin:0; padding:10px 12px; min-height:44px; border:1px solid var(--line); border-radius:12px; background:#fff; font-size:13.5px; font-weight:500; line-height:1.35; text-transform:none; letter-spacing:0; color:var(--ink); cursor:pointer;}
  #permGrid .perm:has(input:checked){background:#f3f7ff; border-color:#9db9f0;}
  #permGrid .perm input{flex:none; width:20px; height:20px; margin:0; padding:0; border-radius:5px; accent-color:var(--accent-dark);}
  #permGrid .perm span{min-width:0; overflow-wrap:anywhere;}
  /* Save / Cancel stay in view while the long list scrolls */
  #roleModal .actions{position:sticky; bottom:-26px; z-index:2; background:#fff; padding:12px 0 2px; margin-top:16px; border-top:1px solid var(--line);}
  @media (max-width:820px){ #permGrid{grid-template-columns:1fr;} #roleModal .actions{bottom:-20px;} }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar">
      <h1>Roles</h1>
      <button class="btn" id="btnAddRole">+ Add Role</button>
    </div>
    <div class="content">
      <div id="alertBox"></div>

      <div class="card">
        <div class="card-head"><h2>All Roles</h2></div>
        <table>
          <thead>
            <tr><th>Role</th><th>Access</th><th>Users</th><th style="width:140px;">Actions</th></tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="4" class="loading">Loading...</td></tr>
          </tbody>
        </table>
        <div style="padding:12px 20px; display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;">
          <span id="roleShownCount" style="font-size:12.5px; color:var(--muted);"></span>
          <button class="btn secondary" id="btnRoleLoadMore" style="width:auto; display:none;">Load more</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="roleModal">
  <div class="modal wide">
    <h3 id="roleModalTitle">Add Role</h3>
    <div class="field">
      <label for="roleName">Role Name</label>
      <input type="text" id="roleName" maxlength="50" placeholder="e.g. Manager">
    </div>
    <div class="field">
      <label>Access — tick the pages this role can use</label>
      <div id="permGrid"></div>
    </div>
    <div class="actions">
      <button type="button" class="btn secondary" id="roleCancel">Cancel</button>
      <button type="button" class="btn" id="roleSave">Save Role</button>
    </div>
  </div>
</div>

<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=9"></script>
<script src="assets/js/layout.js?v=27"></script>
<script>
  guardPage();
  renderSidebar('roles');

  const alertBox = document.getElementById('alertBox');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let allPerms = {};
  let editingId = 0;

  function showAlert(msg, type = 'success') {
    alertBox.innerHTML = `<div class="alert ${type}">${msg}</div>`;
    setTimeout(() => (alertBox.innerHTML = ''), 4000);
  }

  const modal = document.getElementById('roleModal');
  document.getElementById('roleCancel').addEventListener('click', () => modal.classList.remove('open'));

  function openModal(role) {
    editingId = role ? role.role_id : 0;
    document.getElementById('roleModalTitle').textContent = role ? 'Edit Role — ' + role.role_name : 'Add Role';
    const nameInput = document.getElementById('roleName');
    nameInput.value = role ? role.role_name : '';
    nameInput.disabled = !!(role && Number(role.is_system));

    document.getElementById('permGrid').innerHTML = Object.entries(allPerms).map(([key, label]) => `
      <label class="perm">
        <input type="checkbox" class="perm-cb" value="${esc(key)}" ${role && role.permissions.includes(key) ? 'checked' : ''}><span>${esc(label)}</span>
      </label>`).join('');
    modal.classList.add('open');
  }

  document.getElementById('btnAddRole').addEventListener('click', () => openModal(null));

  document.getElementById('roleSave').addEventListener('click', async () => {
    const name = document.getElementById('roleName').value.trim();
    if (!name) { showAlert('Role name is required.', 'error'); return; }
    const perms = [...document.querySelectorAll('.perm-cb:checked')].map(cb => cb.value);
    const btn = document.getElementById('roleSave');
    btn.disabled = true;
    try {
      await api.post('roles.save', { role_id: editingId, role_name: name, permissions: perms });
      modal.classList.remove('open');
      showAlert('Role saved.');
      load();
    } catch (err) {
      showAlert(err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  });

  window.editRole = function (id) {
    const role = window._roles.find(r => r.role_id === id);
    if (role) openModal(role);
  };

  window.deleteRole = async function (id, name) {
    if (!confirm(`Delete role "${name}"?`)) return;
    try {
      await api.post('roles.delete', { role_id: id });
      showAlert('Role deleted.');
      load();
    } catch (err) {
      showAlert(err.message, 'error');
    }
  };

  // Paging: 10 rows, "Load more" adds 10. Kept as a count so saving or
  // deleting a role (which reloads the list) keeps your place.
  const ROLE_PAGE_SIZE = 10;
  let roleLimit = ROLE_PAGE_SIZE;

  function roleRowHtml(r) {
        const isSystem = Number(r.is_system) === 1;
        const access = r.role_name === 'Admin'
          ? '<span class="badge">Everything</span>'
          : (r.role_name === 'HR' && !r.permissions.length
            ? '<span class="badge">Everything except Approvals & Users (default)</span>'
            : (r.role_name === 'Employee' && !r.permissions.length
              ? '<span class="badge">Own portal only</span>'
              : (r.permissions.length
                ? r.permissions.map(p => `<span class="badge" style="margin:1px;">${esc(allPerms[p] || p)}</span>`).join(' ')
                : '<span style="color:var(--muted); font-size:12.5px;">No access yet</span>')));
        return `<tr>
          <td style="font-weight:600;">${esc(r.role_name)}${isSystem ? ' <span style="font-size:11px; color:var(--muted);">(system)</span>' : ''}</td>
          <td>${access}</td>
          <td>${r.user_count}</td>
          <td>
            <div class="row-actions">
              ${r.role_name === 'Admin'
                ? '<span style="color:var(--muted); font-size:12.5px;">Locked</span>'
                : `<button onclick="editRole(${r.role_id})">Edit</button>`}
              ${isSystem && r.role_name !== 'HR' ? '' : `<button class="danger-link" data-name="${esc(r.role_name)}" onclick="deleteRole(${r.role_id}, this.dataset.name)">Delete</button>`}
            </div>
          </td>
        </tr>`;
  }

  function renderRoles() {
    const tbody = document.getElementById('tableBody');
    const label = document.getElementById('roleShownCount');
    const btn = document.getElementById('btnRoleLoadMore');
    const rows = window._roles || [];
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No roles yet — run the roles SQL, then add roles here.</td></tr>';
      label.textContent = '';
      btn.style.display = 'none';
      return;
    }
    const showing = Math.min(roleLimit, rows.length);
    tbody.innerHTML = rows.slice(0, showing).map(roleRowHtml).join('');
    label.textContent = `Showing ${showing} of ${rows.length}`;
    btn.style.display = showing >= rows.length ? 'none' : 'inline-block';
  }

  document.getElementById('btnRoleLoadMore').addEventListener('click', () => {
    roleLimit += ROLE_PAGE_SIZE;
    renderRoles();
  });

  async function load() {
    const tbody = document.getElementById('tableBody');
    try {
      const data = await api.get('roles.list');
      allPerms = data.all_permissions || {};
      window._roles = data.roles || [];   // editRole() still looks roles up here
      renderRoles();
    } catch (err) {
      document.getElementById('roleShownCount').textContent = '';
      document.getElementById('btnRoleLoadMore').style.display = 'none';
      tbody.innerHTML = `<tr><td colspan="4"><div class="alert error">${err.message}</div></td></tr>`;
    }
  }

  load();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>

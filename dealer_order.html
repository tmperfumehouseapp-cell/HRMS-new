<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111827">
<title>Order perfumes — TM Perfume House</title>
<style>
  :root{--ink:#1c1917; --muted:#78716c; --line:#e7e0d6; --accent:#ff7a2f; --accent-d:#c2570c; --bg:#fdf8f1;}
  *{box-sizing:border-box;} html,body{margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-text-size-adjust:100%;}
  .top{background:#111827; color:#fff; padding:18px 18px 16px;} .top .b{font-size:12px; letter-spacing:.12em; text-transform:uppercase; opacity:.7; font-weight:700;} .top h1{margin:4px 0 2px; font-size:21px; line-height:1.25;} .top p{margin:0; font-size:13px; opacity:.8;}
  .wrap{max-width:640px; margin:0 auto; padding:14px 14px 150px;}
  .tabs{display:flex; gap:8px; margin:4px 0 10px; position:sticky; top:0; background:var(--bg); padding:8px 0; z-index:3;}
  .tabs button{flex:1; min-height:46px; border-radius:14px; border:2px solid var(--line); background:#fff; font-size:16px; font-weight:800; color:var(--ink); cursor:pointer; font-family:inherit;}
  .tabs button.on{background:#111827; color:#fff; border-color:#111827;} .tabs small{display:block; font-size:11.5px; font-weight:600; opacity:.75;}
  .search{width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:14px; font-size:16px; font-family:inherit; background:#fff; margin-bottom:10px;}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px; background:#fff; border-radius:14px; padding:11px 14px; margin-bottom:8px; box-shadow:0 1px 2px rgba(20,22,26,.06); border:2px solid transparent;}
  .row.has{border-color:var(--accent); background:#fff8f2;}
  .row .n{font-weight:700; font-size:15px; line-height:1.3;} .row .s{font-size:11.5px; color:var(--muted); margin-top:2px;} .row .s.low{color:#b45f06; font-weight:700;}
  .st{display:flex; align-items:center; gap:6px; flex:none;} .st button{width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:#fff; font-size:21px; font-weight:800; cursor:pointer;} .st input{width:52px; height:40px; border:2px solid var(--line); border-radius:11px; text-align:center; font-size:17px; font-weight:800; font-family:inherit;}
  .bar{position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:12px 14px calc(12px + env(safe-area-inset-bottom)); box-shadow:0 -6px 20px rgba(0,0,0,.06); z-index:5;}
  .bar .in{max-width:640px; margin:0 auto;} .bar textarea{width:100%; border:1px solid var(--line); border-radius:12px; padding:9px 11px; font-size:15px; font-family:inherit; margin-bottom:8px; min-height:42px; resize:none;}
  .sum{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:14px;} .sum b{font-size:19px;}
  .go{width:100%; min-height:52px; border:0; border-radius:999px; background:var(--accent); color:#fff; font-size:17px; font-weight:800; cursor:pointer; font-family:inherit;} .go[disabled]{opacity:.4;}
  .msg{border-radius:14px; padding:14px 16px; margin:10px 0; font-size:14.5px; line-height:1.5; font-weight:600;} .msg.bad{background:#fdecea; color:#8a2620;} .msg.warn{background:#fff3df; color:#7a4310;} .msg.ok{background:#e4f6ec; color:#0f5f3b;}
  .done{text-align:center; padding:50px 20px;} .done .tick{width:74px; height:74px; border-radius:50%; background:#16945a; color:#fff; font-size:40px; display:flex; align-items:center; justify-content:center; margin:0 auto 16px;} .done h2{margin:0 0 6px; font-size:22px;} .done p{color:var(--muted); line-height:1.6; margin:4px 0;}
  .empty{text-align:center; color:var(--muted); padding:40px 10px;}
</style>
</head>
<body>
<div class="top"><div class="b">TM Perfume House</div><h1 id="shop">Order your perfumes</h1><p id="valid">Choose the perfumes and how many. We will send the parcel.</p></div>
<div class="wrap" id="root"><div class="empty">Loading...</div></div>
<div class="bar" id="bar" style="display:none;"><div class="in"><textarea id="note" placeholder="Note for us (optional)" maxlength="200"></textarea><div class="sum"><span id="cnt">Nothing chosen yet</span><b id="tot"></b></div><button class="go" id="send" disabled>Place my order</button></div></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js?v=13"></script>
<script>
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const TOKEN = new URLSearchParams(location.search).get('t') || '';
  let DATA = null, ML = '50', Q = '', QTY = {}, sending = false;
  function url(a, p) {
    if (typeof api !== 'undefined' && api && api.buildUrl) return api.buildUrl(a, p || {});
    const u = new URL(typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'api.php', location.href); u.searchParams.set('action', a); Object.keys(p || {}).forEach((k) => u.searchParams.set(k, p[k])); return u.href;
  }
  async function call(a, p, body) {
    const r = await fetch(url(a, p), body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
    const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Something went wrong. Please try again.'); return j;
  }
  const key = (i) => i.name.toLowerCase() + '|' + i.ml;
  async function load() {
    if (!TOKEN) return fail('This link is not complete. Ask your salesperson for a new one.');
    try { DATA = await call('rf.dealer_get', { t: TOKEN }); } catch (e) { return fail(e.message); }
    document.getElementById('shop').textContent = DATA.shop; document.getElementById('valid').textContent = 'Choose the perfumes and how many. We will send the parcel. Link valid till ' + DATA.valid_until + '.';
    draw();
  }
  function fail(m) { document.getElementById('root').innerHTML = `<div class="msg bad">${esc(m)}</div>`; }
  function draw() {
    const items = DATA.items.filter((i) => i.ml === ML && (!Q || i.name.toLowerCase().includes(Q)));
    const n20 = DATA.items.filter((i) => i.ml === '20').length, n50 = DATA.items.filter((i) => i.ml === '50').length;
    let h = '';
    if (DATA.hold) h += '<div class="msg warn">You can still send your order. Because of a pending payment, our team will call you to confirm it.</div>';
    h += `<div class="tabs"><button data-ml="20" class="${ML === '20' ? 'on' : ''}">20 ml<small>${DATA.prices['20'] ? '₹' + DATA.prices['20'] + ' each' : ''} · ${n20} perfumes</small></button><button data-ml="50" class="${ML === '50' ? 'on' : ''}">50 ml<small>${DATA.prices['50'] ? '₹' + DATA.prices['50'] + ' each' : ''} · ${n50} perfumes</small></button></div>
      <input class="search" id="q" placeholder="Search a perfume" value="${esc(Q)}" autocomplete="off">`;
    h += items.map((i) => { const q = QTY[key(i)] || 0; return `<div class="row ${q ? 'has' : ''}"><div><div class="n">${esc(i.name)}</div>${i.stock !== null && i.stock <= 10 ? `<div class="s low">Only ${i.stock} left</div>` : ''}</div><div class="st"><button data-d="-1" data-k="${esc(key(i))}">−</button><input type="number" inputmode="numeric" min="0" max="500" value="${q || ''}" placeholder="0" data-k="${esc(key(i))}"><button data-d="1" data-k="${esc(key(i))}">+</button></div></div>`; }).join('') || '<div class="empty">No perfume found.</div>';
    document.getElementById('root').innerHTML = h; document.getElementById('bar').style.display = ''; sum();
    const q = document.getElementById('q'); if (document.activeElement && document.activeElement.id === 'q') { q.focus(); q.setSelectionRange(Q.length, Q.length); }
  }
  function sum() {
    let n = 0, t = 0, lines = 0; DATA.items.forEach((i) => { const q = QTY[key(i)] || 0; if (q) { n += q; t += q * (DATA.prices[i.ml] || 0); lines++; } });
    document.getElementById('cnt').textContent = n ? n + ' bottles · ' + lines + ' perfume' + (lines > 1 ? 's' : '') : 'Nothing chosen yet';
    document.getElementById('tot').textContent = n && t ? '₹' + t.toLocaleString('en-IN') : ''; document.getElementById('send').disabled = !n || sending;
  }
  const keep = {};
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-ml]'); if (t) { ML = t.dataset.ml; return draw(); }
    const d = e.target.closest('[data-d]'); if (d) { const k = d.dataset.k; QTY[k] = Math.max(0, Math.min(500, (QTY[k] || 0) + (+d.dataset.d))); if (!QTY[k]) delete QTY[k]; const y = window.scrollY; draw(); window.scrollTo(0, y); }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'q') { Q = e.target.value.trim().toLowerCase(); return draw(); }
    if (e.target.dataset && e.target.dataset.k !== undefined && e.target.type === 'number') { const k = e.target.dataset.k, v = Math.max(0, Math.min(500, parseInt(e.target.value, 10) || 0)); if (v) QTY[k] = v; else delete QTY[k]; e.target.closest('.row').classList.toggle('has', !!v); sum(); }
  });
  document.getElementById('send').addEventListener('click', async () => {
    if (sending) return; sending = true; const b = document.getElementById('send'); b.textContent = 'Sending…'; sum();
    const items = DATA.items.filter((i) => QTY[key(i)]).map((i) => ({ name: i.name, ml: i.ml, qty: QTY[key(i)] }));
    try {
      const r = await call('rf.dealer_order', {}, { token: TOKEN, items, note: document.getElementById('note').value });
      document.getElementById('bar').style.display = 'none';
      document.getElementById('root').innerHTML = `<div class="done"><div class="tick">✓</div><h2>${r.status === 'placed' ? 'Order received' : 'We got your order'}</h2><p>${esc(r.message)}</p>${r.order_no ? `<p>Order number: <b>${esc(r.order_no)}</b></p>` : ''}<p>${r.qty} bottles${r.total ? ' · ₹' + r.total.toLocaleString('en-IN') : ''}</p><p style="margin-top:18px;">You can close this page.</p></div>`;
    } catch (e) { sending = false; b.textContent = 'Place my order'; sum(); document.getElementById('root').insertAdjacentHTML('afterbegin', `<div class="msg bad">${esc(e.message)}</div>`); window.scrollTo(0, 0); }
  });
  load();
</script>
</body>
</html>

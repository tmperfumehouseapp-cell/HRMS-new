      <section id="p-conv" style="display:none;"></section>
      <section id="p-set" style="display:none;"></section>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="mvModal"><div class="modal" id="mvBody" style="max-width:580px;max-height:92vh;overflow:auto;"></div></div>

<div class="modal-overlay" id="resModal">
  <div class="modal" style="max-width:420px;">
    <h3 id="resTitle">Mark resolved</h3>
    <div class="sub" id="resSub" style="margin-bottom:10px;"></div>

<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=9"></script>
<script src="assets/js/layout.js?v=27"></script>
<script>

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const inr = (n) => n == null ? '—' : '₹' + Math.round(Number(n)).toLocaleString('en-IN');
  const alertBox = document.getElementById('alertBox');
  function showAlert(msg, type = 'success') { alertBox.innerHTML = `<div class="alert ${type}">${esc(msg)}</div>`; window.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(() => (alertBox.innerHTML = ''), 6000); }
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');
  const dstr = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

  let T = null, MD = null, BM = null, tab = 'today';
  // People who are not working today (no punch-in, leave / holiday mark, or switched off by Admin) are left out of every list; their sales still count in the team totals.
  let OFFSET = new Set();
  const onlyWorking = (arr, k) => (arr || []).filter(x => !OFFSET.has(Number(x[k || 'id'])));
  // "Unknown action" = the server still runs the OLD api.php (the new one has not been uploaded yet).
  const errHtml = (err) => /unknown action/i.test(err.message || '')
    ? `<div class="empty" style="text-align:left;max-width:640px;margin:0 auto;"><b style="font-size:15px;">⚠️ The server still has the old api.php</b><br><br>The Control Tower needs the new <b>api.php</b> from the update zip.<br>
       hPanel → fourpirates.space → Files → File Manager → <b>public_html/empmanagment</b> → upload the new <b>api.php</b> and choose <b>Overwrite</b> (do not touch config.php). Then refresh this page.</div>`
    : `<div class="empty">${esc(err.message)}</div>`;
  const nameOf = (id) => ((T && T.names || []).find(n => Number(n.id) === Number(id)) || {}).name || ('#' + id);
  const stCls = (s) => s === 'ok' || s === 'hit' || s === 'top' ? 'ok' : (s === 'warn' || s === 'near' || s === 'climb' ? 'warn' : (s === 'red' || s === 'miss' || s === 'low' ? 'red' : ''));
  const pctCls = (v, goal, amber, red) => v == null ? '' : (v >= goal ? 'ok' : (v >= amber ? 'warn' : 'red'));
  const bar = (v, max, cls) => `<div class="bar ${cls || ''}"><i style="width:${Math.max(0, Math.min(100, max ? v / max * 100 : 0))}%"></i></div>`;

  // ---------- the OLD typed-query screens (Give queries, Campaign, Move, Planner, Overnight) end on the WhatsApp Sales cut-over date: read-only + banner; the server refuses every write ----------
  const QA = { ended: false, msg: '' };
  const QA_W = ['qb.bump', 'qb.set', 'cq.bump', 'cq.tag', 'qm.move', 'qm.waive', 'qm.undo', 'qm.tag'];
  (function () { const post = api.post.bind(api); api.post = (a, ...r) => (QA.ended && QA_W.indexOf(a) >= 0) ? Promise.reject(new Error(QA.msg)) : post(a, ...r); })();
  api.get('qa.status').then(s => {
    if (!s || !s.ended) return;
    QA.ended = true; QA.msg = s.message;
    const b = document.getElementById('qaBanner'); if (b) { b.textContent = s.message; b.hidden = false; }
    const p = document.getElementById('p-qb'); if (p) p.classList.add('qa-ro');
  }).catch(() => { /* older api.php: nothing to show */ });

  // ---------- tabs ----------
  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('.ct-tab'); if (!b) return;
    tab = b.dataset.t;
    document.querySelectorAll('.ct-tab').forEach(x => x.classList.toggle('on', x === b));
    ['focus', 'today', 'alerts', 'md', 'qb', 'rt', 'pp', 'bench', 'lib', 'conv', 'set'].forEach(k => $('p-' + k).style.display = (k === tab || (tab === 'today' && k === 'alerts')) ? '' : 'none');      // Alerts now sit under the Blocks on the Live page
    if (tab === 'pp') loadPerson();
    if (tab === 'today') { loadHist(); if (RC) loadRecon(); loadRemToday(); }
    if (tab === 'focus') loadFocus();
    if (tab === 'qb') loadGive();
    if (tab === 'rt') loadRt();
    if (tab === 'md' && !MD) loadMd(false);
    if (tab === 'bench' && !BM) loadBench();
    if (tab === 'bench' && !MD) loadMd(false);
    if (tab === 'lib') loadLib(false);
    if (tab === 'conv') loadConv();
    if (tab === 'set') renderSettings();
  });

  // ---------- 📚 CHAT LIBRARY ----------
  let LB = null, LBG = null, LBL = [], LBF = { outcome: 'all', q: '' }, LBOPEN = null;
  async function loadLib(force) {
    if (!LB || force) $('p-lib').innerHTML = '<div class="card"><div class="empty">Loading the chat library…</div></div>';
    try { [LB, LBG] = await Promise.all([api.get('lib.status'), api.get('lib.guide')]); LBL = (await api.get('lib.list', { outcome: LBF.outcome, q: LBF.q, limit: 60 })).list || []; }
    catch (e) { LB = { error: e.message }; }
    renderLib();
    if (LB && !LB.error && (!LB.last_tick || Date.now() / 1000 - (LB.last_tick.at || 0) > 3600)) api.get('lib.tick').catch(() => {});   // the hourly study pass, without waiting for it
  }
  const lbShare = (h) => h.share == null ? '—' : h.share + '%';
  const lbHabit = { offered_10ml: 'Offered a 10 ml add-on', offered_combo: 'Offered a combo', asked_prepaid: 'Asked for prepaid', price_objection: 'Customer doubted the price', objection_handled: 'Price doubt answered well' };
  function lbBody(b, title) {
    b = b || {}; const ul = (a) => (a && a.length) ? `<ul class="lb-ul">${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<div class="sub">Nothing yet.</div>';
    return `<div class="lb-sum">${esc(b.summary || '')}${b.confidence ? `<div class="sub" style="margin-top:4px;">Confidence: ${esc(b.confidence)}</div>` : ''}</div>
      <div class="lb-cols"><div><h4>✅ Do</h4>${ul(b.do)}</div><div><h4>🚫 Do not</h4>${ul(b.dont)}</div></div>
      ${(b.openers || []).length ? `<h4>👋 Opening messages that worked</h4>${ul(b.openers)}` : ''}
      ${(b.objection_replies || []).length ? `<h4>💬 Doubts &amp; good replies</h4>${b.objection_replies.map(o => `<div class="lb-q"><b>${esc(o.objection)}</b><br>${esc(o.reply)}</div>`).join('')}` : ''}
      ${(b.offers || []).length ? `<h4>🎁 Offers</h4>${b.offers.map(o => `<div class="lb-q"><b>${esc(o.offer)}</b> — ${esc(o.when)}</div>`).join('')}` : ''}
      ${(b.followups || []).length ? `<h4>⏰ Follow-ups</h4>${ul(b.followups)}` : ''}
      ${(b.owner_corrections || []).length ? `<h4>🧑‍🏫 Your corrections <span class="sub">(the bot follows these first)</span></h4>${b.owner_corrections.map(o => `<div class="lb-q"><b>${esc(o.customer)}</b><br>${esc(o.better)}</div>`).join('')}` : ''}`;
  }
  function renderLib() {
    const box = $('p-lib'), D = LB; if (!box) return;
    if (!D || D.error) { box.innerHTML = `<div class="card"><div class="card-head"><div><h2>📚 Chat library</h2></div></div>${errHtml({ message: D ? D.error : 'No data' })}</div>`; return; }
    const G = LBG || {}, st = G.stats || {}, tot = (st.ordered || 0) + (st.lost || 0), lt = D.last_tick;
    const when = lt && lt.at ? new Date(lt.at * 1000).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'not yet';
    const tiles = `<div class="rd-sum" style="margin:0 16px 4px;"><div><b>${D.chats}</b><small>Chats saved</small></div><div><b>${D.with_transcript}</b><small>With chat transcript</small></div><div><b>${D.with_call || 0}</b><small>With call transcript</small></div><div><b>${D.ordered}</b><small>Became orders</small></div><div><b>${D.lost}</b><small>Lost</small></div><div><b>${D.new_24h}</b><small>New in 24 h</small></div></div>`;
    const warn = D.to_read > 0 ? `<div class="lb-note">📥 ${D.to_read} older chat${D.to_read === 1 ? '' : 's'} still to be read into the library (read automatically in the background, about 24 every 10 minutes while this page is open). Screenshots are deleted after ${D.keep_days} days — set <b>CONVO_KEEP_DAYS</b> higher in config.php to keep them readable longer.</div>` : '';
    const ai = D.ai ? '' : '<div class="lb-note">The AI key is not set, so guidebooks are written from numbers only.</div>';
    const head = `<div class="card"><div class="card-head"><div><h2>📚 Chat library</h2><div class="sub">Every reviewed chat is saved as a masked transcript (no phone numbers) with its result. Every hour the system studies them and writes the next guidebook. Last study: <b>${esc(when)}</b>${lt && lt.transcribed ? ` · ${lt.transcribed} read` : ''}.</div></div>
      <div><button class="btn" id="lbTick">Study now</button></div></div>${tiles}${warn}${ai}</div>`;
    let gd = '';
    if (G.draft) {
      gd += `<div class="card lb-draft"><div class="card-head"><div><h2>📝 Draft guidebook v${G.draft.version} <span class="tag">${G.draft.source === 'ai' ? 'AI' : 'numbers'}</span></h2><div class="sub">Written from ${G.draft.based_on} chats. It is used by the AI only after you approve it.${G.draft.change_note ? ` <b>What changed:</b> ${esc(G.draft.change_note)}` : ''}</div></div>
        <div style="display:flex;gap:8px;"><button class="btn primary" data-lbg="approve" data-id="${G.draft.id}">Approve</button><button class="btn" data-lbg="reject" data-id="${G.draft.id}">Reject</button></div></div><div class="lb-bd">${lbBody(G.draft.body)}</div></div>`;
    }
    gd += `<div class="card"><div class="card-head"><div><h2>📖 Live guidebook ${G.live ? 'v' + G.live.version : ''}</h2><div class="sub">${G.live ? `Approved ${esc(G.live.approved_at || '')}${G.live.approved_by ? ' by ' + esc(G.live.approved_by) : ''}. Every new chat review is judged against it.` : 'No approved guidebook yet — the AI reviews chats without it.'}</div></div>
      ${G.draft ? '' : `<div><button class="btn" id="lbRun">Write new draft</button></div>`}</div>${G.live ? `<div class="lb-bd">${lbBody(G.live.body)}</div>` : `<div class="empty">${tot < 20 ? `The first draft appears after 20 saved chats (now ${tot}).` : 'The first draft is being prepared — press “Study now”.'}</div>`}</div>`;
    const offL = { flash: 'Flash offer', combo: 'Combo offer', ml10: '10 ml add-on offer', discount: 'Discount', prepaid_discount: 'Prepaid discount', free_gift: 'Free gift', other: 'Other offer' };
    const rows = (a, lab, pre) => (a || []).filter(h => h.chats > 0).map(h => `<div class="lb-n"><span>${esc((pre || '') + (lab ? (lab[h.key] || h.key) : h.key))}</span><span>${h.chats}</span><span>${h.ordered}</span><b>${lbShare(h)}</b></div>`).join('');
    const base = tot ? Math.round(st.ordered / tot * 100) : null;
    const nums = `<div class="card"><div class="card-head"><div><h2>🔢 What the saved chats show</h2><div class="sub">Of the chats that did this, how many ended in an order. All saved chats: <b>${base == null ? '—' : base + '%'}</b> (${tot} chats, last ${st.days || 120} days). Lost chats are uploaded less often than won ones, so treat these as a guide, not proof.</div></div></div>
      <div class="lb-nt"><div class="lb-n hd"><span>Habit</span><span>Chats</span><span>Orders</span><span>Share</span></div>${rows(st.habits, lbHabit)}${rows(st.offers, offL)}${rows(st.questions, null, 'Questions asked: ')}${rows(st.reply_time, null, 'First reply: ')}</div>
      ${Object.keys(st.lost_reasons || {}).length ? `<div class="sub" style="margin-top:8px;"><b>Why chats were lost:</b> ${Object.entries(st.lost_reasons).map(([k, v]) => `${esc(k)} (${v})`).join(' · ')}</div>` : ''}</div>`;
    const hist = (G.history || []).length ? `<div class="card"><div class="card-head"><div><h2>🕘 Guidebook history</h2></div></div>${G.history.map(h => `<div class="md-it"><b>v${h.version}</b> <span class="tag">${esc(h.status)}</span> <span class="sub">${esc(h.created_at)} · ${h.based_on} chats · ${h.source === 'ai' ? 'AI' : 'numbers'}</span>${h.change_note ? `<div class="adv">${esc(h.change_note)}</div>` : ''}</div>`).join('')}</div>` : '';
    const list = `<div class="card"><div class="card-head"><div><h2>💬 Saved chats</h2></div><div style="display:flex;gap:8px;flex-wrap:wrap;"><select id="lbOut"><option value="all">All</option><option value="ordered">Orders</option><option value="lost">Lost</option></select><input id="lbQ" placeholder="Search product / reason…" style="min-width:170px;"></div></div>
      <div id="lbList">${lbRows()}</div></div>`;
    box.innerHTML = head + gd + nums + list + hist;
    $('lbOut').value = LBF.outcome; $('lbQ').value = LBF.q;
  }
  function lbRows() {
    if (!LBL.length) return '<div class="empty">No chats match.</div>';
    return LBL.map(c => `<div class="lb-row" data-id="${c.id}"><div class="lb-h"><span class="lb-o ${c.outcome}">${c.outcome === 'ordered' ? 'Order' : 'Lost'}</span><b>${esc(c.employee || '—')}</b><span class="sub">${esc(c.chat_day || '')}${c.order_name ? ' · ' + esc(c.order_name) : ''}${c.order_total > 0 ? ' · ' + inr(c.order_total) : ''}</span>${c.score != null ? `<span class="lb-s">${Number(c.score).toFixed(1)}</span>` : ''}</div>
      <div class="adv">${esc([c.wants, c.products, c.lost_reason && 'Lost: ' + c.lost_reason].filter(Boolean).join(' · ') || '—')} ${c.has_transcript ? `<span class="sub">· ${c.turn_count} messages</span>` : (c.has_call ? '' : '<span class="sub">· notes only (no transcript)</span>')}${c.has_call ? ' <span class="sub">· 📞 call</span>' : ''}</div>
      <div class="lb-tr" id="lbt${c.id}" style="display:${LBOPEN === c.id ? '' : 'none'};"></div></div>`).join('');
  }
  async function lbToggle(id) {
    const el = $('lbt' + id); if (!el) return;
    if (el.style.display !== 'none') { el.style.display = 'none'; LBOPEN = null; return; }
    document.querySelectorAll('.lb-tr').forEach(x => x.style.display = 'none'); LBOPEN = id; el.style.display = ''; el.innerHTML = '<div class="sub">Loading…</div>';
    try {
      const c = (await api.get('lib.get', { id })).chat;
      const bub = (a) => a.map(t => `<div class="lb-m ${t.who}"><small>${t.who === 'customer' ? 'Customer' : 'Salesperson'}${t.at ? ' · ' + esc(t.at) : ''}</small>${esc(t.text)}</div>`).join('');
      el.innerHTML = (c.has_transcript ? bub(c.turns) : (c.has_call ? '' : '<div class="sub">The screenshots of this chat were read before the library existed (or were already deleted), so only the AI notes are saved.</div>'))
        + (c.has_call ? `<div class="sub" style="margin-top:6px;"><b>📞 Call recording</b>${c.call_facts && c.call_facts.summary ? ' — ' + esc(c.call_facts.summary) : ''}</div>` + bub(c.call_turns) : '');
    } catch (e) { el.innerHTML = `<div class="sub">${esc(e.message)}</div>`; }
  }
  document.addEventListener('click', async (e) => {
    const t = e.target; if (!$('p-lib') || !$('p-lib').contains(t)) return;
    const g = t.closest('[data-lbg]');
    if (g) { try { await api.post('lib.guide_approve', { id: Number(g.dataset.id), action: g.dataset.lbg }); showAlert(g.dataset.lbg === 'approve' ? 'Guidebook approved — the AI uses it from the next review.' : 'Draft rejected.'); loadLib(true); } catch (er) { showAlert(er.message, 'error'); } return; }
    if (t.id === 'lbTick') { t.disabled = true; t.textContent = 'Studying…'; try { const r = await api.post('lib.tick', {}); showAlert(`Done: ${r.imported || 0} old chats added, ${r.transcribed || 0} read${r.guide ? ', new guidebook draft v' + r.guide.version : ''}.`); } catch (er) { showAlert(er.message, 'error'); } loadLib(true); return; }
    if (t.id === 'lbRun') { t.disabled = true; t.textContent = 'Writing…'; try { await api.post('lib.guide_run', {}); showAlert('New draft written — review and approve it.'); } catch (er) { showAlert(er.message, 'error'); } loadLib(true); return; }
    const row = t.closest('.lb-row'); if (row && !t.closest('.lb-tr')) lbToggle(Number(row.dataset.id));
  });
  document.addEventListener('change', async (e) => { if (e.target.id !== 'lbOut') return; LBF.outcome = e.target.value; loadLib(true); });
  let lbTm = null;
  document.addEventListener('input', (e) => { if (e.target.id !== 'lbQ') return; LBF.q = e.target.value; clearTimeout(lbTm); lbTm = setTimeout(async () => { try { LBL = (await api.get('lib.list', { outcome: LBF.outcome, q: LBF.q, limit: 60 })).list || []; $('lbList').innerHTML = lbRows(); } catch (er) { } }, 350); });

  // ---------- 💬 CONVERSATIONS (Sales → Learn & Setup → Conversations) ----------
  // Search every saved chat / call as text, open one, get reply ideas from what worked, star a best example, and read the old uploads into the library.
  const CV = { kind: 'all', q: '', emp: 0, from: '', to: '', list: [], counts: null, people: [], more: false, open: null, th: null, sel: -1, sg: null, sgBusy: false, bf: null, ls: null, run: false, stop: false, built: false };
  async function loadConv() {
    const box = $('p-conv'); if (!box) return;
    if (!CV.built) { CV.built = true; box.innerHTML = cvShell(); }
    try { await Promise.all([cvFetch(false), cvStatus()]); } catch (e) { $('cvList').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
    cvDrawList(); cvDrawRight(); if (!CV.th) cvDrawThread();
  }
  function cvShell() {
    return `<div class="card" style="margin-bottom:12px;"><div class="card-head"><div><h2>💬 Conversations</h2><div class="sub">Every saved chat and call as text, from your own database. Gemini only reads each file once. Phone numbers are hidden before saving.</div></div></div></div>
      <div class="cv-grid">
        <div class="card cv-l"><div class="cv-pills" id="cvPills"></div>
          <div class="cv-f"><input id="cvQ" placeholder="Search words: “10 ml”, “price”, “COD”…" autocomplete="off"><div class="cv-f2"><select id="cvEmp"><option value="0">Anyone</option></select><input type="date" id="cvFrom" title="From"><input type="date" id="cvTo" title="To"></div></div>
          <div id="cvList"><div class="empty">Loading…</div></div><div id="cvMore" style="padding:10px 16px;"></div></div>
        <div class="card cv-m" id="cvThread"></div>
        <div class="cv-r" id="cvRight"></div>
      </div>`;
  }
  async function cvFetch(append) {
    const off = append ? CV.list.length : 0;
    const r = await api.get('convo.search', { kind: CV.kind, q: CV.q, emp: CV.emp || '', from: CV.from, to: CV.to, limit: 30, offset: off });
    CV.list = append ? CV.list.concat(r.list || []) : (r.list || []); CV.counts = r.counts; CV.more = !!r.more; if ((r.people || []).length || !append) CV.people = r.people && r.people.length ? r.people : CV.people;
  }
  async function cvStatus() {
    try { [CV.bf, CV.ls] = await Promise.all([api.get('convo.backfill_status'), api.get('lib.status')]); } catch (e) { /* the numbers are optional */ }
  }
  const cvTagCls = { ok: 'ok', bad: 'bad', warn: 'warn' };
  function cvDrawList() {
    const c = CV.counts || {}, P = [['all', 'All', c.all], ['ordered', '🛒 Ordered', c.ordered], ['lost', '💔 Lost', c.lost], ['calls', '📞 Calls', c.calls]];
    $('cvPills').innerHTML = P.map(p => `<button type="button" class="cv-p${CV.kind === p[0] ? ' on' : ''}" data-cvk="${p[0]}">${p[1]} <b>${(p[2] || 0).toLocaleString('en-IN')}</b></button>`).join('');
    const sel = $('cvEmp'); if (sel && sel.options.length <= 1 + 0 && CV.people.length) sel.innerHTML = '<option value="0">Anyone</option>' + CV.people.map(p => `<option value="${p.id}">${esc(p.name)} (${p.n})</option>`).join('');
    if (sel) sel.value = String(CV.emp);
    $('cvList').innerHTML = CV.list.length ? CV.list.map(r => {
      const title = r.outcome === 'call' ? `${esc(r.employee || '—')} · call` : `${esc(r.employee || '—')} · ${r.outcome === 'lost' ? 'lost' : esc(r.order_name || 'order')}`;
      const meta = `${esc(r.day)} ${esc(r.time)} · ` + (r.chat_n ? `${r.chat_n} messages${r.first_reply_min != null ? ' · first reply ' + (r.first_reply_min < 1 ? '<1' : Math.round(r.first_reply_min)) + ' min' : ''}` : `${r.call_min ? Math.round(r.call_min) + ' min call · ' : ''}transcript saved`);
      return `<div class="cv-r1${CV.open === r.id ? ' on' : ''}" data-cvid="${r.id}"><div class="cv-h"><b>${title}</b>${r.starred ? '<span title="Best example">⭐</span>' : ''}${r.outcome === 'lost' ? '<span>💔</span>' : ''}${r.total > 0 ? `<span class="cv-t">${inr(r.total)}</span>` : ''}</div>
        <div class="sub">${meta}</div><div class="cv-tg">${r.score != null ? `<span class="cv-g ok">💬 ${Number(r.score).toFixed(1)}</span>` : ''}${r.call_n && r.chat_n ? '<span class="cv-g call">📞 call</span>' : ''}${(r.tags || []).map(t => `<span class="cv-g ${cvTagCls[t.c] || ''}">${esc(t.t)}</span>`).join('')}</div>
        ${r.snippet ? `<div class="cv-sn">${esc(r.snippet)}</div>` : ''}</div>`;
    }).join('') : '<div class="empty">No conversations match. Older uploads appear here after they are read (see “Read old uploads”).</div>';

  // 🌙 OVERNIGHT (inside Give queries)

  const ntP2 = (n) => String(n).padStart(2, '0');
  const ntYmd = (d) => d.getFullYear() + '-' + ntP2(d.getMonth() + 1) + '-' + ntP2(d.getDate());
  const ntAddDays = (x, n) => { const d = new Date(x + 'T00:00:00'); d.setDate(d.getDate() + n); return ntYmd(d); };

  function ntStore() { try { const m = JSON.parse(localStorage.getItem(NT_KEY) || '{}'); return m && typeof m === 'object' ? m : {}; } catch (e) { return {}; } }

  // a day's own time → else the latest earlier day saved with "use for the next days too" → else 12 AM → 10 AM
  function ntWin(day) {
    const m = ntStore();

    const ks = Object.keys(m).filter(k => k < day && m[k] && m[k].c && Number.isInteger(m[k].f) && Number.isInteger(m[k].t)).sort();
    if (ks.length) { const x = m[ks[ks.length - 1]]; return { f: x.f, t: x.t }; }

  }
  const ntStartH = () => (NT.D && NT.D.hours && NT.D.hours[0] && Number.isFinite(+NT.D.hours[0].hour)) ? +NT.D.hours[0].hour : 10;     // the business day's first hour (10 AM)
  // clock hours the window covers, in order: 12 AM → 10 AM = 0..9 · 10 PM → 12 AM = 22, 23
  function ntHoursOf(w) { if (w.f === w.t) return []; const out = []; let h = w.f; do { out.push(h); h = (h + 1) % 24; } while (h !== w.t && out.length < 24); return out; }

  // ---------- 📣 CAMPAIGN (inside Give queries): customers who replied to a campaign / came from the community. THREE kinds per person, day totals only (no hours, no overnight) ----------
  //   🔁 already in her chat = an old customer of hers replied again · 🆕 new query assigned = a customer nobody had before · 👥 community query = a query that came from the community.

  const CQK = [['in', '🔁', 'Already in her chat', 'cq-a'], ['new', '🆕', 'New query assigned', 'cq-n'], ['comm', '👥', 'Community query', 'cq-c']];

  // tag one community / campaign order with its kind (🔁 / 🆕 / 👥) — the numbers of that person move at once, saved in the background
  function cqTag(key, k) {

  $('btnRefresh').onclick = () => { loadTower(true); loadHist(true); if (MD) loadMd(true); if (BM) loadBench(); };
  $('datePick').onchange = () => { loadTower(false); loadHist(); if (tab === 'qb') loadGive(); };
  // ---------- 👤 PERSON — one salesperson, the last days of every number (People → Person) ----------
  // Numbers come from the api's cp.days (the same Control Tower snapshot as Live, one row per person per business day).
  const PP = { cache: {}, id: null, range: 7, sum: 7, mode: 'blocks', month: '', names: {}, goals: {}, today: '', busy: false, err: '' };
  const ppAddDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
  const ppDow = (d) => ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(d + 'T00:00:00Z').getUTCDay()];
  const ppSpan = (a, b) => { const o = []; for (let d = a; d <= b; d = ppAddDays(d, 1)) o.push(d); return o; };
  const ppLate = (r) => r && r.lt != null && r.lt > 0;
  const ppPre = (r) => r && r.n > 0 ? Math.round(r.pn / r.n * 100) : null;
  // [key, label, icon, pick(row) → number|null, format, direction (1 higher is better, -1 lower), goal(goals) → colour rule, 'pts' when the change is shown in points]
  const PPM = [
    { k: 'sales', l: 'Sales vs target', i: '💰', g: (r) => r.s, f: 'rs', d: 1, col: (v, r) => r.p == null ? null : r.p >= 95 ? 'g' : r.p >= 80 ? 'a' : 'r', sub: (r) => (r.t ? 'target ' + inr(r.t) + ' · ' + Math.round(r.p || 0) + '%' : 'no target set') },
    { k: 'qo', l: 'Query orders', i: '🎯', g: (r) => r.qo, f: 'n', d: 1, col: (v, r, G) => r.qc == null ? null : r.qc >= G.q_conv ? 'g' : r.qc >= G.q_conv * 0.85 ? 'a' : 'r', sub: (r, G) => r.q + ' queries · converting ' + (r.qc == null ? '—' : Math.round(r.qc) + '%') + ' (goal ' + G.q_conv + '%)' },
    { k: 'co', l: 'Campaign orders', i: '📣', g: (r) => r.co, f: 'n', d: 1, rel: 1, sub: (r) => r.n + ' orders in all' },
    { k: 'q', l: 'Queries given', i: '📞', g: (r) => r.q, f: 'n', d: 1, rel: 1, sub: () => '' },
    { k: 'pre', l: 'Prepaid share', i: '💳', g: ppPre, f: 'pct', d: 1, pts: 1, col: (v, r, G) => v == null ? null : G.prepaid > 0 ? (v >= G.prepaid ? 'g' : v >= G.prepaid * 0.85 ? 'a' : 'r') : null, rel: 1, sub: (r, G) => r.pn + ' of ' + r.n + ' orders' + (G.prepaid > 0 ? ' · goal ' + G.prepaid + '%' : '') },
    { k: 'tk', l: 'Average ticket', i: '🧾', g: (r) => r.n > 0 ? r.tk : null, f: 'rs', d: 1, rel: 1, sub: () => '' },
    { k: 'cr', l: 'Order codes', i: '🏷', g: (r) => r.n > 0 ? r.cr : null, f: 'pct', d: 1, pts: 1, col: (v, r, G) => v == null ? null : v >= G.code ? 'g' : v >= G.code * 0.85 ? 'a' : 'r', sub: (r, G) => 'goal ' + G.code + '%' },
    { k: 'mx', l: 'DG + LG + WH', i: '🟢', g: (r) => r.pcs > 0 ? r.mx : null, f: 'pct', d: 1, pts: 1, col: (v, r, G) => v == null ? null : v >= G.mix ? 'g' : v >= G.mix * 0.92 ? 'a' : 'r', sub: (r, G) => r.pcs + ' pieces · goal ' + G.mix + '%' },
    { k: 's7', l: '7% orders', i: '💸', g: (r) => r.n > 0 ? r.s7 : null, f: 'n', d: 1, rel: 1, sub: (r) => '7% ' + r.s7 + ' · 6% ' + r.s6 + ' · 2.8% ' + r.s28 + (r.so ? ' · other ' + r.so : '') },
    { k: 'disc', l: 'Discipline', i: '🕘', g: (r) => r.off ? null : (ppLate(r) ? 0 : 1), f: 'ontime', d: 1, col: (v) => v == null ? null : v ? 'g' : 'r', sub: (r) => r.ar ? 'punched in ' + r.ar + (ppLate(r) ? ' · ' + r.lt + ' min late' : '') : 'no punch-in' },
    { k: 'rt', l: 'Overall rating', i: '⭐', g: (r) => r.rt, f: 'dec', d: 1, rel: 1, sub: () => 'the daily rating score' },
  ];
  const ppFmt = (m, v) => v == null ? '—' : m.f === 'rs' ? inr(v) : m.f === 'pct' ? Math.round(v) + '%' : m.f === 'dec' ? (Math.round(v * 10) / 10) : m.f === 'ontime' ? (v ? 'On time' : 'Late') : m.f === 'missing' ? (v === 0 ? 'All done' : v + ' missing') : String(Math.round(v * 10) / 10);
  const ppAvgFmt = (m, v) => v == null ? '—' : m.f === 'rs' ? inr(v) : m.f === 'pct' ? Math.round(v) + '%' : m.f === 'ontime' ? Math.round(v * 100) + '% on time' : m.f === 'missing' ? (Math.round(v * 10) / 10) + ' / day' : String(Math.round(v * 10) / 10);
  const ppRow = (day, id) => (PP.cache[day] && PP.cache[day].rows && PP.cache[day].rows[id]) || null;
  const ppWorked = (day, id) => { const r = ppRow(day, id); return r && !r.off ? r : null; };
  const ppAvg = (m, days, id) => { let s = 0, c = 0; days.forEach(d => { const r = ppWorked(d, id); if (!r) return; const v = m.g(r); if (v != null && !isNaN(v)) { s += Number(v); c++; } }); return c ? s / c : null; };
  const ppColour = (m, v, r, base) => {
    if (v == null) return 'n';
    if (m.col) { const c = m.col(v, r, PP.goals); if (c) return c; }
    if (base == null || base <= 0) return 'g';

    return x >= 0.97 ? 'g' : x >= 0.8 ? 'a' : 'r';
  };

  async function ppEnsure(days) {
    const need = days.filter(d => d <= PP.today && (!PP.cache[d] || (d === PP.today && Date.now() - PP.cache[d].at > 120000)));
    const chunks = []; for (let i = 0; i < need.length; i += 10) chunks.push(need.slice(i, i + 10));
    await Promise.all(chunks.map(async (c) => {
      const d = await api.get('cp.days', { days: c.join(',') });
      Object.assign(PP.names, d.names || {}); PP.goals = Object.assign({ mix: 85, code: 65, q_conv: 23, prepaid: 0 }, d.goals || {});
      c.forEach(day => { PP.cache[day] = { at: Date.now(), rows: (d.days && d.days[day]) || {} }; });
    }));
  }
  const ppDays = (n) => ppSpan(ppAddDays(PP.today, -(n - 1)), PP.today);
  function ppPeople() {
    const order = ((T && T.emps_all) || []).map(e => Number(e.id)), seen = new Set(order);
    Object.keys(PP.names).forEach(k => { if (!seen.has(Number(k))) order.push(Number(k)); });
    return order.filter(id => PP.names[id] || ((T && T.emps_all) || []).some(e => Number(e.id) === id)).map(id => {

  const ppInit = (nm) => nm.split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase();

  async function loadPerson() {

      if (PP.mode === 'month') await ppEnsure(ppSpan(PP.month + '-01', ppMonthEnd() < PP.today ? ppMonthEnd() : PP.today));

  }
  const ppMonthEnd = () => { const [y, m] = PP.month.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); };

  function ppSwitcher(ppl) {
    return `<div class="pp-list">${ppl.map(p => `<button type="button" class="pp-pi${p.id === PP.id ? ' on' : ''}" data-id="${p.id}"><span class="av">${esc(ppInit(p.name))}</span><span class="nm">${esc(p.name)}</span>${p.pct == null ? '' : `<small>${p.pct}%</small>`}</button>`).join('')}</div>`;
  }
  function ppBlock(m, days, id) {
    const rows = days.map(d => ppWorked(d, id)), vals = rows.map(r => r ? m.g(r) : null);
    const worked = days.filter(d => ppWorked(d, id));
    const lastDay = [...days].reverse().find(d => { const r = ppWorked(d, id); return r && m.g(r) != null; });
    const last = lastDay ? ppWorked(lastDay, id) : null, v = last ? m.g(last) : null;
    // change = average of this window vs the same-size window before it
    const n = days.length, prev = ppSpan(ppAddDays(days[0], -n), ppAddDays(days[0], -1));
    const a = ppAvg(m, days, id), b = ppAvg(m, prev, id);
    let dl = '—', dc = 'fl';
    if (a != null && b != null) {
      const diff = a - b, rel = b ? diff / Math.abs(b) : 0, good = diff * m.d > 0, flat = Math.abs(rel) < 0.02 || (m.pts && Math.abs(diff) < 1);

  // ---- summary: what got better / what needs work (last N days against the N before) ----
  function ppSummary(id, N) {

      const a = ppAvg(m, cur, id), b = ppAvg(m, prev, id); if (a == null) return;

        if (late.length > lateB) worse.push({ k: m.k, w: 2, t: `Late ${late.length} time${late.length > 1 ? 's' : ''} (${lateB} before) — ${late.slice(-3).map(d => ppDow(d) + ' ' + ppRow(d, id).ar).join(', ')}` });

      }
      if (b == null) return;

    const tip = worse.length ? 'Start with: ' + worse[0].t.replace(/ \(.*/, '') + '.' : better.length ? 'Nothing is slipping — keep the same routine.' : '';

  }

  function go(sKey, tKey, kKey, noPush) { const p = pick(sKey, tKey, kKey); if (!p) return; cur = p; show(noPush); }

  $('slPills').addEventListener('click', (e) => { const b = e.target.closest('.sl-pill'); if (b) go(b.dataset.s, ''); });
  $('slSub').addEventListener('click', (e) => {
    const b = e.target.closest('.sl-tab'); if (b) { go(cur.sec.k, b.dataset.t); return; }
  });
  $('slKids').addEventListener('click', (e) => { const b = e.target.closest('.sl-kid'); if (b) go(cur.sec.k, cur.tab[0], b.dataset.k); });
  window.addEventListener('hashchange', () => { const h = parseHash(); if (cur && h.s === cur.sec.k && h.t === cur.tab[0] && (!h.k || (cur.kid && h.k === cur.kid[0]))) return; go(h.s, h.t, h.k, true); });

  let LIVE_N = 0;
  async function pulse() { try { const d = await api.get('ct.pulse'); LIVE_N = ((d && d.red) || 0) + ((d && d.meet) || 0); renderBars(); } catch (e) { /* the badge is optional */ } }

  (async function init() {
    try {
      const d = await api.get('me.flags'); PERMS = d.permissions || [];
    } catch (e) { $('slHost').innerHTML = `<div class="sl-empty">Could not load your access (${esc(e.message)}).</div>`; return; }
    VIS = SECTIONS.map(s => ({ k: s.k, t: s.t, tabs: s.tabs.map(t => t[4] ? [t[0], t[1], null, null, t[4].filter(k => PERMS.includes(k[3]))] : t).filter(t => t[4] ? t[4].length : PERMS.includes(t[3])) })).filter(s => s.tabs.length);
    if (!VIS.length) { $('slHost').innerHTML = '<div class="sl-empty">No sales pages are open for your role yet — ask Admin to tick them on the Roles page.</div>'; return; }
    const h = parseHash(); cur = pick(h.s, h.t, h.k); show(); pulse(); setInterval(() => { if (!document.hidden) pulse(); }, 120000);
  })();

})();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>

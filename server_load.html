<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<title>Server load — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
  .sl{padding:6px 14px 40px;max-width:1300px;margin:0 auto}
  .sl .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
  .sl select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:13.5px;background:#fff;color:#111}
  .sl .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 14px}
  .sl .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .sl .tile small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .sl .tile b{display:block;font-size:24px;font-weight:800;margin-top:2px}.sl .tile span{font-size:12px;color:var(--muted)}
  .sl .tile.bad b{color:#b91c1c}.sl .tile.warn b{color:#b45309}.sl .tile.ok b{color:#0f7a41}
  .sl .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px}
  .sl .card h2{margin:0 0 2px;font-size:16px}.sl .card .sub{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.45}
  .sl .adv{border-radius:12px;padding:10px 12px;margin:0 0 8px;font-size:13.5px;line-height:1.45;border:1px solid #e5e7eb;background:#f8fafc}
  .sl .adv b{display:block}.sl .adv.bad{background:#fdecec;border-color:#f3b6b3}.sl .adv.warn{background:#fff7e6;border-color:#f5d79a}.sl .adv.ok{background:#e7f7ee;border-color:#b7e3c8}.sl .adv.info{background:#eef4ff;border-color:#c5d8fb}
  .sl .wrap{overflow-x:auto}
  .sl table{border-collapse:collapse;width:100%;font-size:13px}
  .sl th{text-align:right;padding:7px 8px;font-size:11.5px;color:#55606e;white-space:nowrap;border-bottom:1px solid var(--line)}
  .sl td{text-align:right;padding:8px;border-bottom:1px solid #edf0f4;vertical-align:top;white-space:nowrap}
  .sl th:first-child,.sl td:first-child{text-align:left;white-space:normal;min-width:240px}
  .sl td small{display:block;color:#64748b;font-size:11.5px;white-space:normal}
  .sl .meter{display:inline-block;width:110px;height:8px;border-radius:6px;background:#eef1f5;vertical-align:middle;margin-right:6px;overflow:hidden}.sl .meter i{display:block;height:100%;background:#f59e0b}.sl .meter i.hi{background:#dc2626}
  .sl code{font-size:11.5px;color:#475569;white-space:normal;word-break:break-all}
  .sl .empty{color:#64748b;font-size:13px;padding:6px 0}
  .sl .cp{border:1px solid #cfd8e3;border-radius:9px;padding:5px 11px;font:inherit;font-size:12.5px;font-weight:700;background:#fff;color:#111;cursor:pointer;margin-top:7px;min-height:0;width:auto}.sl .cp:hover{background:#eef6ff}.sl .cp.big{background:#111827;color:#fff;border-color:#111827;padding:9px 16px;font-size:13.5px;margin:0 0 10px}
  .sl .adv i{display:block;font-style:normal;font-size:12px;color:#64748b;word-break:break-word}
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><h1>📊 Server load</h1></div>
    <div class="content sl">
      <div class="bar">
        <button class="btn" type="button" id="bRef">🔄 Refresh</button>
        <select id="fMins" aria-label="Period"><option value="15">Last 15 minutes</option><option value="60" selected>Last hour</option><option value="180">Last 3 hours</option></select>
        <button class="btn" type="button" id="bPrompt" style="background:#111827;border-color:#111827" disabled title="Copies one ready message for Claude with the numbers and the queries of this page. Paste it to Claude to bring the CPU down.">📋 Claude prompt</button>
        <button class="btn" type="button" id="bHint" style="background:#fff;color:#111;border:1px solid var(--line)" title="What you can do yourself right now, without Claude">💡 Hint</button>
        <span id="slAt" style="font-size:12.5px;color:var(--muted)"></span>
      </div>
      <div id="slHint" class="card" style="display:none"></div>
      <div id="root"><div class="card">Loading…</div></div>
    </div>
  </main>
</div>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/api.js?v=13"></script>
<script src="assets/js/layout.js?v=33"></script>
<script>
  guardPage();
  renderSidebar('server_load');
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (n) => Number(n || 0).toLocaleString('en-IN');
  const dur = (ms) => ms >= 1000 ? (Math.round(ms / 100) / 10) + ' s' : ms + ' ms';
  const secs = (s) => s >= 3600 ? (Math.round(s / 360) / 10) + ' h' : s >= 60 ? Math.round(s / 60) + ' min' : s + ' s';
  const card = (t, sub, body) => '<div class="card"><h2>' + t + '</h2>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + body + '</div>';
  const tone = (v, warn, bad) => v == null ? '' : v >= bad ? 'bad' : v >= warn ? 'warn' : 'ok';
  let PR = [];      // the prompts of this view: [everything, advice 1, advice 2 …]
  document.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-cp]'); if (!b) return; const t = PR[Number(b.dataset.cp)] || ''; if (!t) return; const old = b.textContent;
    try { await navigator.clipboard.writeText(t); b.textContent = '✓ Copied — paste it to Claude'; } catch (er) { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;height:40vh;z-index:9999'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); b.textContent = '✓ Copied'; ta.remove(); } catch (e2) { b.textContent = 'Select the text below and copy it'; } }
    setTimeout(() => { b.textContent = old; }, 2500);
  });
  function draw(d) {
    $('slAt').textContent = 'Measured at ' + d.now + (d.span_min ? ' · ' + num(d.requests) + ' requests counted over ' + d.span_min + ' min' : '');
    const loadPct = d.load ? Math.round(d.load[0] / d.cores * 100) : null;
    const A = d.avg || {}, m5 = A.m5 || A.m1 || null, head = m5 ? m5.pct : d.cpu, W = A.win || m5;
    const rest = W && W.db != null ? Math.max(0, Math.round((W.pct - W.db - (d.php_of_server || 0)) * 10) / 10) : null;
    let h = '<div class="tiles">'
      + '<div class="tile ' + tone(head, 50, 80) + '"><small>CPU used · average' + (m5 ? ' of the last ' + Math.max(1, m5.mins) + ' min' : ' right now') + '</small><b>' + (head == null ? '—' : head + '%') + '</b><span>of ' + d.cores + ' cores · this second ' + (d.cpu == null ? '—' : d.cpu + '%') + (A.m15 ? ' · 15 min ' + A.m15.pct + '%' : '') + ((m5 && m5.steal != null ? m5.steal : d.steal_now) >= 1 ? ' · plus ' + (m5 && m5.steal != null ? m5.steal : d.steal_now) + '% taken by the hosting' : '') + '</span></div>'
      + '<div class="tile ' + (W && W.db != null ? tone(W.db, 25, 50) : '') + '"><small>Where it goes' + (W ? ' · ' + Math.max(1, W.mins) + ' min' : '') + '</small><b>' + (W && W.db != null ? 'Database ' + W.db + '%' : '—') + '</b><span>' + (W && W.db != null ? 'HRMS code ' + (d.php_of_server == null ? '—' : d.php_of_server + '%') + ' · everything else ' + rest + '%' : 'counting — open again in a few minutes') + '</span></div>'
      + '<div class="tile ' + tone(loadPct, 70, 100) + '"><small>Load (1 / 5 / 15 min)</small><b>' + (d.load ? d.load[0] : '—') + '</b><span>' + (d.load ? d.load[1] + ' · ' + d.load[2] + ' — full is ' + d.cores : '') + '</span></div>'
      + '<div class="tile ' + (d.mem ? tone(100 - d.mem.free_mb / d.mem.total_mb * 100, 80, 92) : '') + '"><small>Memory free</small><b>' + (d.mem ? num(d.mem.free_mb) + ' MB' : '—') + '</b><span>' + (d.mem ? 'of ' + num(d.mem.total_mb) + ' MB' : '') + '</span></div>'
      + '<div class="tile"><small>Requests a minute</small><b>' + (d.span_min ? num(Math.round(d.requests / d.span_min)) : '—') + '</b><span>' + (d.span_min ? num(d.requests) + ' in ' + d.span_min + ' min' : 'just started counting') + '</span></div>'
      + '</div>';
    const B = d.blocks || [], done = B.filter((b) => !b.open), pk = done.reduce((m, b) => (!m || b.pct > m.pct ? b : m), null);
    h += card('CPU · every 5 minutes', 'One line for each 5 minutes on the clock, newest first. This is the same thing the hosting graph draws, so compare a line here with the same time there. ' + (pk ? 'Highest in this period: <b>' + pk.pct + '%</b> at ' + pk.from + '–' + pk.to + '.' : ''),
      B.length ? '<div class="wrap"><table><thead><tr><th>Time</th><th>CPU used</th><th>Database part</th><th>Taken by the hosting</th></tr></thead><tbody>'
        + B.map((b) => '<tr><td><b>' + b.from + ' – ' + b.to + '</b>' + (b.open ? ' <small style="display:inline">still running</small>' : '') + '</td><td><span class="meter" style="width:180px"><i class="' + (b.pct >= 80 ? 'hi' : '') + '" style="width:' + Math.min(100, b.pct) + '%;' + (b.pct < 50 ? 'background:#16a34a' : '') + '"></i></span><b>' + b.pct + '%</b></td><td>' + (b.db == null ? '—' : b.db + '%') + '</td><td>' + (b.steal == null ? '—' : b.steal + '%') + '</td></tr>').join('') + '</tbody></table></div>'
        : '<div class="empty">Counting — the first line appears after about 5 minutes.</div>');
    PR = [d.full_prompt || ''].concat((d.advice || []).map((a) => a.prompt || '')); LAST = d; $('bPrompt').disabled = !PR[0]; if ($('slHint').style.display !== 'none') $('slHint').innerHTML = hintHtml();
    h += card('What to do', 'Worked out from the numbers on this page, the most expensive first. Press <b>Copy prompt</b> on a row and paste it to Claude: it carries the numbers and the query, so Claude can fix exactly that.',
      (d.full_prompt ? '<button type="button" class="cp big" data-cp="0">📋 Copy ONE prompt for everything</button>' : '')
      + ((d.advice || []).map((a, i) => '<div class="adv ' + esc(a.lvl) + '"><b>' + esc(a.t) + '</b>' + (a.prompt ? '<i>' + esc(a.d) + '</i><button type="button" class="cp" data-cp="' + (i + 1) + '">📋 Copy prompt</button>' : esc(a.d)) + '</div>').join('') || '<div class="empty">Nothing stands out.</div>'));
    h += card('The database · this period', 'What the database spent its time on in the last ' + (d.db_span_min || '—') + ' minutes, the most expensive first. This is usually where the CPU goes.',
      (d.db_recent || []).length ? (d.db_mode === 'looks' ? '<p class="sub">The database was looked at ' + num(d.db_looks) + ' times (25 looks a minute). On average ' + (d.db_busy_cores == null ? '—' : d.db_busy_cores) + ' queries were running at once. Numbers are shown as N and texts as ?.</p>' : '')
        + '<div class="wrap"><table><thead><tr><th>Query</th><th>Share of database work</th><th>CPU cores kept busy</th>' + (d.db_mode === 'looks' ? '<th>Longest run seen</th>' : '<th>Runs</th><th>Each takes</th><th>Rows read per run</th>') + '</tr></thead><tbody>'
        + d.db_recent.map((q) => '<tr><td><code>' + esc(q.q) + '</code></td><td><span class="meter"><i class="' + (q.share >= 25 ? 'hi' : '') + '" style="width:' + Math.min(100, q.share) + '%"></i></span><b>' + q.share + '%</b></td><td>' + q.cores + '</td>' + (d.db_mode === 'looks' ? '<td>' + (q.max_s ? q.max_s + ' s' : 'under 1 s') + '</td>' : '<td>' + num(q.calls) + '</td><td>' + dur(q.avg_ms) + '</td><td>' + num(q.rows_each) + '</td>') + '</tr>').join('') + '</tbody></table></div>'
        : '<div class="empty">Counting has started. The database is looked at once a minute: open this page again in a few minutes.</div>');
    h += card('What keeps the HRMS busy', 'Every function of the HRMS that ran in this period, by the time it took in total (its own work plus waiting for the database). "PHP itself" is the part that is the page\'s own CPU.',
      (d.actions || []).length ? '<div class="wrap"><table><thead><tr><th>Function</th><th>Share of time</th><th>Calls</th><th>A minute</th><th>Each takes</th><th>Slowest</th><th>Total time</th><th>PHP itself</th></tr></thead><tbody>'
        + d.actions.map((r) => '<tr><td><b>' + esc(r.name) + '</b>' + (r.name !== r.action ? ' <code>' + esc(r.action) + '</code>' : '') + (r.why ? '<small>' + esc(r.why) + '</small>' : '') + '</td><td><span class="meter"><i class="' + (r.time_share >= 25 ? 'hi' : '') + '" style="width:' + Math.min(100, r.time_share) + '%"></i></span><b>' + r.time_share + '%</b></td><td>' + num(r.calls) + '</td><td>' + r.per_min + '</td><td>' + dur(r.avg_ms) + '</td><td>' + dur(r.max_ms) + '</td><td>' + secs(Math.round(r.wall_s)) + '</td><td>' + secs(Math.round(r.cpu_s)) + '</td></tr>').join('')
        + '</tbody></table></div>' : '<div class="empty">Nothing counted yet. This page counts every request from the moment it was installed: open it again in 10 to 15 minutes.</div>');
    h += card('Slowest functions', 'Functions where one call takes long (0.8 seconds or more on average, at least 3 calls). These are what people feel as "loading".',
      (d.slow || []).length ? '<div class="wrap"><table><thead><tr><th>Function</th><th>Each takes</th><th>Slowest</th><th>Calls</th></tr></thead><tbody>' + d.slow.map((r) => '<tr><td><b>' + esc(r.name) + '</b>' + (r.name !== r.action ? ' <code>' + esc(r.action) + '</code>' : '') + '</td><td><b>' + dur(r.avg_ms) + '</b></td><td>' + dur(r.max_ms) + '</td><td>' + num(r.calls) + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">No slow function in this period.</div>');
    h += card('Programs on the server right now', 'Which program is using the CPU at this moment.',
      !d.shell ? '<div class="empty">The server does not let the HRMS read its program list, so this part is not shown.</div>' : ((d.groups || []).length ? '<div class="wrap"><table><thead><tr><th>Program</th><th>Of the server</th></tr></thead><tbody>' + d.groups.map((g) => '<tr><td><b>' + esc(g.name) + '</b></td><td><span class="meter"><i class="' + (g.of_all >= 40 ? 'hi' : '') + '" style="width:' + Math.min(100, g.of_all) + '%"></i></span><b>' + g.of_all + '%</b></td></tr>').join('') + '</tbody></table></div>'
        + ((d.procs || []).length ? '<p class="sub" style="margin-top:10px">The busiest single processes:</p><div class="wrap"><table><thead><tr><th>Process</th><th>One core</th><th>Running for</th></tr></thead><tbody>' + d.procs.map((p) => '<tr><td><code>' + esc(p.what) + '</code></td><td>' + p.cpu + '%</td><td>' + secs(p.secs) + '</td></tr>').join('') + '</tbody></table></div>' : '') : '<div class="empty">Nothing is using the CPU right now.</div>'));
    h += card('The database · right now and since it started', 'Queries running at this moment, then the kinds of query that have cost the most time since the database was last started.',
      ((d.db_running || []).length ? '<p class="sub">Running right now:</p><div class="wrap"><table><thead><tr><th>Query</th><th>Running for</th></tr></thead><tbody>' + d.db_running.map((q) => '<tr><td><code>' + esc(q.q) + '</code></td><td><b>' + secs(q.secs) + '</b></td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">No query is running right now.</div>')
      + ((d.db_top || []).length ? '<p class="sub" style="margin-top:12px">Most expensive kinds of query:</p><div class="wrap"><table><thead><tr><th>Query</th><th>Total time</th><th>Calls</th><th>Rows read</th></tr></thead><tbody>' + d.db_top.map((q) => '<tr><td><code>' + esc(q.q) + '</code></td><td><b>' + secs(q.secs) + '</b></td><td>' + num(q.calls) + '</td><td>' + q.mrows + ' M</td></tr>').join('') + '</tbody></table></div>' : ''));
    h += card('The WhatsApp engine', 'How long each part of the engine took on its last run (it runs every minute).',
      (d.engine || []).length ? d.engine.map((e) => '<p class="sub" style="margin-top:6px"><b>' + esc(e.title) + '</b> · last run ' + esc(e.at) + '</p>' + (e.steps.length ? '<div class="wrap"><table><thead><tr><th>Part</th><th>Took</th></tr></thead><tbody>' + e.steps.map((s) => '<tr><td>' + esc(s.step) + '</td><td><b>' + s.secs + ' s</b></td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">Every part took under half a second.</div>')).join('') : '<div class="empty">No engine timings recorded yet.</div>');
    $('root').innerHTML = h;
  }
  async function load() {
    const b = $('bRef'); b.disabled = true;
    try { draw(await api.get('sysload.view', { mins: $('fMins').value })); }
    catch (e) { $('root').innerHTML = '<div class="card"><div class="adv bad"><b>Could not read the server load</b>' + esc(e.message || '') + '</div></div>'; }
    b.disabled = false;
  }
  $('bRef').onclick = load; $('fMins').onchange = load;
  // 📋 Claude prompt (top): the same text as "Copy ONE prompt for everything"
  $('bPrompt').onclick = async function () {
    const t = PR[0] || ''; if (!t) return; const b = this, old = b.textContent;
    try { await navigator.clipboard.writeText(t); b.textContent = '✓ Copied — paste it to Claude'; }
    catch (e) { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;height:40vh;z-index:9999'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); b.textContent = '✓ Copied'; ta.remove(); } catch (e2) { b.textContent = 'Select the text below and copy it'; } }
    setTimeout(() => { b.textContent = old; }, 2500);
  };
  // 💡 Hint: what the owner can do right now, the items that fit this moment first
  let LAST = null;
  function hintHtml() {
    const d = LAST || {}, A = d.avg || {}, m5 = A.m5 || A.m1 || null, W = A.win || m5, cpu = m5 ? m5.pct : d.cpu, tips = [];
    const top = (d.actions || [])[0], camp = (d.actions || []).filter((r) => /^wa\.(camp_fast_tick|camp_tick|dq_worker)$/.test(r.action)).reduce((a, r) => a + r.time_share, 0);
    const poll = (d.actions || []).filter((r) => r.per_min >= 40 && r.avg_ms < 400).slice(0, 2);
    if (camp >= 5) tips.push(['Close Campaigns pages nobody is watching.', 'An open Campaigns page keeps asking the server for sending rounds (' + Math.round(camp) + '% of the HRMS time right now). The server sends the campaigns by itself every minute, so a closed page loses nothing.']);
    if (W && W.db != null && W.db >= 20) tips.push(['The database is ' + W.db + '% of the server: this is where the CPU goes.', 'You cannot fix a slow query yourself. Press "📋 Claude prompt" above and paste it to Claude: it carries the exact queries, so Claude can make them cheaper.']);
    tips.push(['Do not start many campaigns in the same minute.', 'Every running campaign makes the engine count and send at once. Start them a few minutes apart, or let the Campaign Planner space them.']);
    if (poll.length) tips.push(['Close chat and list tabs that are not in use.', 'Every open tab asks the server again every few seconds (' + poll.map((r) => r.name + ': ' + r.per_min + ' a minute').join(' · ') + '). Ten forgotten tabs are ten times the load.']);
    tips.push(['Open the heavy reports in quiet hours.', 'Commission "Day by day" for 30 days, long date ranges on Orders and big exports each keep a CPU core busy for a while. Use 7 days unless you need more.']);
    const stl = m5 && m5.steal != null ? m5.steal : d.steal_now;
    if (stl >= 3) tips.push(['Hostinger is taking ' + stl + '% of your CPU away.', 'This is not the HRMS. Write to Hostinger support: "My VPS shows ' + stl + '% CPU steal time in top. Please move it to a less busy host."']);
    tips.push(['Press Refresh here after each change.', 'The top figure is the average of the last minutes, so give it 5 minutes to show the effect.']);
    return '<h2>💡 What you can do right now</h2><p class="sub">' + (cpu == null ? '' : 'CPU used is ' + cpu + '% on average. ') + 'The first items fit this moment best.' + (top ? ' The busiest function now: ' + esc(top.name) + ' (' + top.time_share + '% of the time).' : '') + '</p>'
      + tips.map((t, i) => '<div class="adv ' + (i === 0 ? 'warn' : 'info') + '"><b>' + (i + 1) + '. ' + esc(t[0]) + '</b>' + esc(t[1]) + '</div>').join('');
  }
  $('bHint').onclick = () => { const h = $('slHint'); if (h.style.display === 'none') { h.innerHTML = hintHtml(); h.style.display = ''; } else h.style.display = 'none'; };
  load();      // no automatic refresh: this page must not add load by itself
</script>
</body>
</html>

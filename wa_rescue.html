<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<title>Rescue Queries — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
.rq-sub{font-size:12.5px;color:var(--muted);margin-top:3px;max-width:70ch}
.rq-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.rq-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.rq-card b{display:block;font-size:22px;letter-spacing:-.02em}.rq-card span{font-size:12px;color:var(--muted)}
.rq-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.rq-main{flex:1 1 260px;min-width:0}
.rq-name{font-weight:700}.rq-meta{font-size:12px;color:var(--muted);margin-top:2px}
.rq-text{font-size:13px;margin-top:6px;padding:6px 8px;background:#f1f5f9;border-radius:8px;word-break:break-word}
.rq-chip{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;margin:4px 4px 0 0;background:#fef3c7;color:#92400e}
.rq-chip.hot{background:#fee2e2;color:#b91c1c}.rq-chip.won{background:#dcfce7;color:#166534}.rq-chip.st{background:#e0e7ff;color:#3730a3}
.rq-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rq-team{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;margin:10px 0}
.rq-team label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:14px}
.rq-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.rq-row input[type=number]{width:80px}
.rq-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.rq-tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer}
.rq-tabs button.on{background:#111827;color:#fff}
.rq-empty{padding:26px;text-align:center;color:var(--muted)}
.rq-err{color:#d9423b;padding:12px}
@media (max-width:820px){.topbar{padding-left:62px}}
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><div><h1>🛟 Rescue Queries</h1><div class="rq-sub" id="rqSub">Interested customers nobody followed up. Take one, win the order, earn the extra bonus.</div></div></div>
    <div class="content"><div id="rqRoot"><div class="rq-empty">Loading…</div></div></div>
  </main>
</div>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/api.js?v=9"></script>
<script src="assets/js/layout.js?v=23"></script>
<script>
guardPage();
(function () {
  'use strict';
  renderSidebar('wasales');
  const root = document.getElementById('rqRoot');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n) => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
  const WHY = { hot: ['🔥 Wanted to pay / order', 'hot'], price: ['💬 Asked the price – no follow-up', ''], ignored: ['🔕 Wrote 2+ times – no person answered', ''] };
  const ST = { open: 'Open', taken: 'Taken', given: 'Taken', won: '✅ Order won', ordered: 'Ordered anyway', expired: 'Expired' };
  let u = null; try { u = api.currentUser(); } catch (e) { u = null; }
  const S = { admin: false, d: null, team: null, bonus: null, tab: 'list', status: 'all', days: 7, busy: false };

  const ago = (s) => { if (!s) return ''; const t = new Date(String(s).replace(' ', 'T')); const m = Math.max(0, Math.round((Date.now() - t.getTime()) / 60000)); return m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };

  async function load() {
    try {
      S.d = await api.get('wq.rescue_list', { days: S.days, status: S.status });
      S.admin = !!S.d.admin;
      if (S.admin && S.tab === 'team') S.team = await api.get('wq.rescue_team');
      if (S.tab === 'bonus') S.bonus = await api.get('wq.rescue_bonus', {});
    } catch (e) { root.innerHTML = '<div class="rq-err">' + esc(e.message || 'Could not load.') + ' <button class="btn" id="rqRetry">Try again</button></div>'; document.getElementById('rqRetry').onclick = load; return; }
    draw();
  }
  function chips(it) {
    return (it.why || []).map((w) => { const x = WHY[w] || [w, '']; return '<span class="rq-chip ' + x[1] + '">' + esc(x[0]) + '</span>'; }).join('') + '<span class="rq-chip st">' + esc(ST[it.status] || it.status) + '</span>';
  }
  function itemHtml(it) {
    const who = it.taken_by && it.taken_by.emp_id ? '<div class="rq-meta">Taken by <b>' + esc(it.taken_by.name) + '</b> ' + esc(ago(it.taken_at)) + '</div>' : '';
    const won = it.status === 'won' ? '<div class="rq-meta">Order ' + esc(it.order_name) + ' · ' + money(it.order_total) + ' · bonus <b>' + money(it.bonus_amt) + '</b> (' + it.bonus_pct + '%)</div>' : '';
    const win = it.window_open ? '' : '<div class="rq-meta" style="color:#b45309">24-hour chat window closed – use an approved template to reach them.</div>';
    let act = '';
    if (it.status === 'open') {
      if (S.d.member || S.admin) act += '<button class="btn" data-take="' + it.phone + '">Take this query</button>';
      if (S.admin) act += '<button class="btn secondary" data-give="' + it.phone + '">Give to…</button><button class="btn secondary" data-skip="' + it.phone + '">Not a chance</button>';
    } else if (it.status === 'taken' || it.status === 'given') act = '<a class="btn" href="my_chats.html?phone=' + it.phone + '">Open chat</a>';
    return '<div class="rq-item"><div class="rq-main"><div class="rq-name">' + esc(it.name || ('+91 ' + it.phone)) + ' <span class="rq-meta">+91 ' + esc(it.phone) + '</span></div>' +
      '<div>' + chips(it) + '</div><div class="rq-meta">' + esc(it.why_text) + ' · last message ' + esc(ago(it.last_in_at)) + (it.orig && it.orig.name ? ' · was with ' + esc(it.orig.name) : '') + '</div>' +
      (it.last_text ? '<div class="rq-text">“' + esc(it.last_text) + '”</div>' : '') + who + won + win + '</div><div class="rq-act">' + act + '</div></div>';
  }
  function draw() {
    const d = S.d, s = d.summary || {}, cfg = d.cfg || {};
    let h = '';
    if (!S.admin && !d.member) { root.innerHTML = '<div class="rq-empty">You are not on today\'s rescue team. Ask the owner to add you — then the missed queries show up here and every order you win earns +' + esc(cfg.pct) + '% extra.</div>'; return; }
    h += '<div class="rq-cards"><div class="rq-card"><b>' + (s.open || 0) + '</b><span>Waiting to be taken</span></div><div class="rq-card"><b>' + (s.taken || 0) + '</b><span>Being worked</span></div>' +
      '<div class="rq-card"><b>' + (s.won || 0) + '</b><span>Orders won</span></div><div class="rq-card"><b>' + money(s.revenue) + '</b><span>Won revenue</span></div><div class="rq-card"><b>' + money(s.bonus) + '</b><span>Bonus earned (' + esc(cfg.pct) + '%)</span></div></div>';
    if (S.admin) h += '<div class="rq-tabs"><button data-tab="list" class="' + (S.tab === 'list' ? 'on' : '') + '">Queries</button><button data-tab="team" class="' + (S.tab === 'team' ? 'on' : '') + '">Rescue team</button><button data-tab="bonus" class="' + (S.tab === 'bonus' ? 'on' : '') + '">Bonus report</button><button data-tab="cfg" class="' + (S.tab === 'cfg' ? 'on' : '') + '">Settings</button></div>';
    else h += '<div class="rq-tabs"><button data-tab="list" class="' + (S.tab === 'list' ? 'on' : '') + '">Queries</button><button data-tab="bonus" class="' + (S.tab === 'bonus' ? 'on' : '') + '">My bonus</button></div>';
    if (S.tab === 'list') {
      if (S.admin) h += '<div class="rq-row"><select id="rqSt">' + ['all', 'open', 'taken', 'won', 'ordered', 'expired'].map((x) => '<option value="' + x + '"' + (S.status === x ? ' selected' : '') + '>' + (x === 'all' ? 'All' : (ST[x] || x)) + '</option>').join('') + '</select>' +
        '<select id="rqDays">' + [1, 3, 7, 14, 30].map((x) => '<option value="' + x + '"' + (S.days === x ? ' selected' : '') + '>Last ' + x + ' day' + (x > 1 ? 's' : '') + '</option>').join('') + '</select><button class="btn secondary" id="rqScan">Scan now</button></div>';
      h += d.items.length ? d.items.map(itemHtml).join('') : '<div class="rq-empty">Nothing here right now. 🎉</div>';
    } else if (S.tab === 'team' && S.team) {
      const t = S.team;
      h += '<div class="card" style="padding:14px 18px"><b>Who sees the rescue queries? (' + esc(t.day) + ')</b><div class="rq-sub">Pick up to 40 people. Only they see this list and can take a query.</div><div class="rq-team">' +
        (t.people || []).map((p) => '<label><input type="checkbox" data-emp="' + p.emp_id + '"' + (p.in ? ' checked' : '') + '> ' + esc(p.name) + '</label>').join('') + '</div>' +
        '<div class="rq-row"><button class="btn" id="rqTeamDay">Save for today</button><button class="btn secondary" id="rqTeamAlways">Save for every day</button></div>' + (t.always ? '<div class="rq-sub">Today uses the “every day” list.</div>' : '') + '</div>';
    } else if (S.tab === 'bonus' && S.bonus) {
      const b = S.bonus;
      h += '<div class="card" style="padding:14px 18px"><b>Rescue bonus ' + esc(b.from) + ' → ' + esc(b.to) + ': ' + money(b.total_bonus) + '</b><div class="rq-sub">Extra on top of the normal commission – ' + esc(cfg.pct) + '% of the order total, for orders won from a rescued query.</div></div>' +
        (S.admin && b.people.length ? '<table><thead><tr><th>Person</th><th>Orders</th><th>Revenue</th><th>Bonus</th></tr></thead><tbody>' + b.people.map((p) => '<tr><td>' + esc(p.name) + '</td><td>' + p.orders + '</td><td>' + money(p.revenue) + '</td><td><b>' + money(p.bonus) + '</b></td></tr>').join('') + '</tbody></table>' : '') +
        (b.orders.length ? '<table style="margin-top:10px"><thead><tr><th>Order</th><th>Customer</th><th>Person</th><th>Total</th><th>Bonus</th><th>Date</th></tr></thead><tbody>' + b.orders.map((o) => '<tr><td>' + esc(o.order_name) + '</td><td>' + esc(o.customer || o.phone) + '</td><td>' + esc(o.name) + '</td><td>' + money(o.total) + '</td><td>' + money(o.bonus) + '</td><td>' + esc(o.won_at) + '</td></tr>').join('') + '</tbody></table>' : '<div class="rq-empty">No rescued orders in this period yet.</div>');
    } else if (S.tab === 'cfg' && S.admin) {
      h += '<div class="card" style="padding:14px 18px;margin-bottom:12px"><b>Which queries count as missed</b>' +
        '<div class="rq-row"><label>Look back (days) <input type="number" id="cDays" min="1" max="30" value="' + esc(cfg.days) + '"></label>' +
        '<label>No follow-up for (hours) <input type="number" id="cWait" step="0.5" min="0.5" max="48" value="' + esc(cfg.wait_h) + '"></label><button class="btn" id="cSave">Save</button></div>' +
        '<div class="rq-sub">A price query counts as missed after this long without a person answering.</div></div>' +
        '<div class="rq-sub" style="margin-bottom:6px">The extra bonus % and ON/OFF are in Commission Rules — the same page as in Sales (shown below):</div>' +
        '<iframe title="Commission Rules" src="commission_rules.html?in=sales" style="width:100%;height:calc(100vh - 330px);min-height:520px;border:1px solid var(--line);border-radius:12px;background:#fff"></iframe>';
    }
    root.innerHTML = h;
  }
  async function act(fn, okMsg) {
    if (S.busy) return; S.busy = true;
    try { const r = await fn(); if (okMsg) alert(okMsg(r)); } catch (e) { alert(e.message || 'Failed.'); }
    S.busy = false; load();
  }
  root.addEventListener('click', (e) => {
    const t = e.target.closest('button,a'); if (!t) return;
    if (t.dataset.tab) { S.tab = t.dataset.tab; load(); return; }
    if (t.dataset.take) { act(() => api.post('wq.rescue_take', { phone: t.dataset.take }).then((r) => { location.href = 'my_chats.html?phone=' + t.dataset.take; return r; })); return; }
    if (t.dataset.skip) { if (confirm('Hide this query – not a real chance?')) act(() => api.post('wq.rescue_skip', { phone: t.dataset.skip })); return; }
    if (t.dataset.give) {
      api.get('wq.rescue_team').then((tm) => {
        const ppl = (tm.people || []).filter((p) => p.in); if (!ppl.length) { alert('Add people to the Rescue team first.'); return; }
        const n = prompt('Give to (type the number):\n' + ppl.map((p, i) => (i + 1) + '. ' + p.name).join('\n')); const p = ppl[(parseInt(n, 10) || 0) - 1];
        if (p) act(() => api.post('wq.rescue_give', { phone: t.dataset.give, emp_id: p.emp_id }));
      }, (er) => alert(er.message));
      return;
    }
    if (t.id === 'rqScan') act(() => api.post('wq.rescue_scan', { force: true }), (r) => 'Checked ' + ((r.scan || {}).checked || 0) + ' queries, ' + ((r.scan || {}).flagged || 0) + ' new rescue queries.');
    if (t.id === 'rqTeamDay' || t.id === 'rqTeamAlways') {
      const ids = [...root.querySelectorAll('[data-emp]:checked')].map((c) => +c.dataset.emp);
      act(() => api.post('wq.rescue_team', { emp_ids: ids, always: t.id === 'rqTeamAlways' }), () => ids.length + ' people saved.');
    }
    if (t.id === 'cSave') act(() => api.post('wq.rescue_cfg', { days: +document.getElementById('cDays').value, wait_h: +document.getElementById('cWait').value }), () => 'Saved.');
  });
  root.addEventListener('change', (e) => {
    if (e.target.id === 'rqSt') { S.status = e.target.value; load(); } if (e.target.id === 'rqDays') { S.days = +e.target.value; load(); }
  });
  load();
})();
</script>
</body>
</html>

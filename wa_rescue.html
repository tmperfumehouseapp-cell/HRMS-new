<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<title>Rescue Queries — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
.rq-sub{font-size:12.5px;color:var(--muted);margin-top:3px;max-width:70ch}
.rq-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.rq-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.rq-card b{display:block;font-size:22px;letter-spacing:-.02em}.rq-card span{font-size:12px;color:var(--muted)}
.rq-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.rq-main{flex:1 1 260px;min-width:0}
.rq-name{font-weight:700}.rq-meta{font-size:12px;color:var(--muted);margin-top:2px}
.rq-text{font-size:13px;margin-top:6px;padding:6px 8px;background:#f1f5f9;border-radius:8px;word-break:break-word}
.rq-chip{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;margin:4px 4px 0 0;background:#fef3c7;color:#92400e}
.rq-chip.hot{background:#fee2e2;color:#b91c1c}.rq-chip.won{background:#dcfce7;color:#166534}.rq-chip.st{background:#e0e7ff;color:#3730a3}
.rq-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rq-team{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;margin:10px 0}
.rq-team label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:14px}
.rq-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.rq-row input[type=number]{width:80px}
.rq-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.rq-tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer}
.rq-tabs button.on{background:#111827;color:#fff}
.rq-empty{padding:26px;text-align:center;color:var(--muted)}
.rq-err{color:#d9423b;padding:12px}
@media (max-width:820px){.topbar{padding-left:62px}}
@media (max-width:700px){ table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap} input,select,textarea{font-size:16px} .btn{min-height:40px} }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><div><h1>🛟 Rescue Queries</h1><div class="rq-sub" id="rqSub">Interested customers nobody followed up. The team works on them in WhatsApp → Chats → 🛟 Rescue; this is the control panel.</div></div></div>
    <div class="content"><div id="rqRoot"><div class="rq-empty">Loading…</div></div></div>
  </main>
</div>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/api.js?v=9"></script>
<script src="assets/js/layout.js?v=28"></script>
<script>
guardPage();
(function () {
  'use strict';
  renderSidebar('wasales');
  const root = document.getElementById('rqRoot');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const WHY = { hot: ['🔥 Wanted to pay / order', 'hot'], price: ['💬 Asked the price', ''], ignored: ['🔕 Wrote 2+ times – no person answered', ''] };
  const TIERC = { act: '#fee2e2', today: '#ffedd5', week: '#fef9c3', long: '#e5e7eb' };
  const ST = { open: 'Open', taken: 'Taken', given: 'Taken', won: '✅ Order placed', ordered: 'Ordered anyway', expired: 'Expired', silent: '🔇 Gone silent', skipped: '🚫 Not a chance', stale: '⏳ Waiting for your decision' };
  const S = { d: null, team: null, tab: 'list', status: 'all', days: 7, busy: false, scanned: false };
  const ago = (s) => { if (!s) return ''; const t = new Date(String(s).replace(' ', 'T')); const m = Math.max(0, Math.round((Date.now() - t.getTime()) / 60000)); return m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
  // Read a customer's chat: inside WhatsApp it opens in the side panel (the list stays); on its own it goes to the chat app.
  function openChat(phone) {
    try { if (window.parent !== window && typeof window.parent.waOpenChat === 'function') { window.parent.waOpenChat(phone); return; } } catch (e) { /* cross-frame */ }
    location.href = 'my_chats.html?phone=' + phone;
  }
  async function load(quiet) {
    try {
      S.d = await api.get('wq.rescue_list', { days: S.days, status: S.status, page: S.page || 1 });
      if (S.tab === 'team') S.team = await api.get('wq.rescue_team');
      if (S.tab === 'start') S.start = await api.get('wq.rescue_start');
      if (S.tab === 'msgs') S.msgs = await api.get('wq.rescue_tpl_list');
      if (S.tab === 'people') { S.people = await api.get('wq.rescue_stats', { days: S.pdays || 14 }); S.lost = await api.get('wq.rescue_lost', { days: S.pdays || 14 }); }
    } catch (e) { root.innerHTML = '<div class="rq-err">' + esc(e.message || 'Could not load.') + ' <button class="btn" id="rqRetry">Try again</button></div>'; document.getElementById('rqRetry').onclick = load; return; }
    if (!quiet || !S.busy) draw();
    // the check runs in the background (the list is already on screen); earlier chats are preloaded in steps until every chat is checked
    if (!S.scanned) { S.scanned = true; kick(false); }
  }
  let kicking = false;
  function kick(force) {
    if (kicking) return; kicking = true;
    api.post('wq.rescue_scan', force ? { backfill: true } : {}).then((r) => {
      kicking = false; if (!r) return; if (r.scan || r.backfill) load(true);
      const bf = (r.backfill || (S.d && S.d.backfill)); if (bf && !bf.done && !bf.error) setTimeout(() => { if (document.visibilityState === 'visible') kick(true); else setTimeout(() => kick(true), 5000); }, 1500);
    }, () => { kicking = false; });
  }
  // refresh every 5 minutes while the screen is open: check again and reload the list
  setInterval(() => { if (document.visibilityState === 'visible') kick(true); }, 300000);
  function chips(it) {
    return (it.want_label ? '<span class="rq-chip" style="background:#f1f5f9;color:#334155">' + esc(it.want_label) + '</span>' : '') + (it.bot ? '<span class="rq-chip" style="background:#e0f2fe;color:#075985">🤖 Bot is following up — step ' + esc(it.bot.step) + (it.bot.due_at ? ', next ' + esc(String(it.bot.due_at).slice(11, 16)) : '') + '</span>' : '') + (it.bot_gave_up ? '<span class="rq-chip" style="background:#fef3c7;color:#92400e">🤖 The bot\'s follow-ups got no answer</span>' : '') + (it.tier_label && (it.status === 'open' || it.status === 'taken') ? '<span class="rq-chip" style="background:' + (TIERC[it.tier] || '#e5e7eb') + ';color:#1f2937">' + esc(it.tier_label) + '</span>' : '') + (it.why || []).map((w) => { const x = WHY[w] || [w, '']; return '<span class="rq-chip ' + x[1] + '">' + esc(x[0]) + '</span>'; }).join('') + '<span class="rq-chip st">' + esc(ST[it.status] || it.status) + '</span>';
  }
  function itemHtml(it) {
    const who = it.taken_by && it.taken_by.emp_id ? '<div class="rq-meta">Taken by <b>' + esc(it.taken_by.name) + '</b> ' + esc(ago(it.taken_at)) + '</div>' : '';
    const RS = { price: 'the price', no_reply: 'the customer stopped replying', other: 'another reason' };
    const AIS = { auto: '🤖 Removed by the AI — not a buyer', pending: '🤖 The AI is checking this…', agreed: '🤖 The AI agrees — no chance', returned: '🤖 The AI saw a chance and put it back', unreviewed: '🤖 The AI could not check it', final: '' };
    const skp = (it.status === 'skipped' && it.skipped_by && it.skipped_by.emp_id ? '<div class="rq-meta">Marked “not a chance” by <b>' + esc(it.skipped_by.name) + '</b>' + (it.skip_reason ? ' — ' + esc(RS[it.skip_reason] || it.skip_reason) : '') + '</div>' : '')
      + ((it.status === 'skipped' || it.ai_state === 'returned') && AIS[it.ai_state] ? '<div class="rq-meta" style="color:#4338ca">' + AIS[it.ai_state] + (it.ai_note ? ': ' + esc(it.ai_note) : '') + '</div>' : '');
    const won = it.status === 'won' ? '<div class="rq-meta">Order ' + esc(it.order_name) + ' placed after it was taken ✅</div>' : '';
    const win = it.window_open ? '' : '<div class="rq-meta" style="color:#b45309">24-hour chat window closed – an approved template is needed to reach them.</div>';
    let act = '<button class="btn secondary" data-open="' + it.phone + '">Read chat</button>';
    if (['taken', 'given', 'stale'].indexOf(it.status) >= 0) act += '<button class="btn secondary" data-skip="' + it.phone + '">Not a chance</button>' + (it.status === 'stale' ? '<button class="btn secondary" data-give="' + it.phone + '">Give to…</button>' : '');
    if (it.status === 'skipped') act += '<button class="btn secondary" data-undo="' + it.phone + '">Put back</button>';
    if (it.status === 'open') act += '<button class="btn secondary" data-give="' + it.phone + '">Give to…</button><button class="btn secondary" data-skip="' + it.phone + '">Not a chance</button>';
    return '<div class="rq-item"><div class="rq-main"><div class="rq-name" style="cursor:pointer" data-open="' + it.phone + '">' + esc(it.name || ('+91 ' + it.phone)) + ' <span class="rq-meta">+91 ' + esc(it.phone) + '</span></div>' +
      '<div>' + chips(it) + '</div><div class="rq-meta">' + esc(it.why_text) + ' · last message ' + esc(ago(it.last_in_at)) + (it.orig && it.orig.name ? ' · was with ' + esc(it.orig.name) : '') + '</div>' +
      (it.last_text ? '<div class="rq-text">“' + esc(it.last_text) + '”</div>' : '') + who + skp + won + win + '</div><div class="rq-act">' + act + '</div></div>';
  }
  function draw() {
    const d = S.d, s = d.summary || {}, cfg = d.cfg || {};
    let h = '<div class="rq-cards"><div class="rq-card"><b>' + (s.open || 0) + '</b><span>Waiting to be taken</span></div><div class="rq-card"><b>' + (s.taken || 0) + '</b><span>Being worked</span></div>' +
      '<div class="rq-card"><b>' + (s.won || 0) + '</b><span>Orders placed</span></div><div class="rq-card"><b>' + (s.silent || 0) + '</b><span>Gone silent</span></div><div class="rq-card" data-gostatus="skipped" style="cursor:pointer" title="Open the list of removed customers"><b>' + (s.skipped || 0) + '</b><span>🚫 Not a chance — tap to see</span></div></div>';
    const bf = d.backfill;
    if (bf) h += '<div class="rq-sub" style="margin-bottom:6px">' + (bf.done ? '✅ Every earlier chat has been checked (' + (bf.checked || 0) + ' queries).' : '⏳ Loading all earlier chats… <b>' + (bf.pct || 0) + '%</b> — ' + (bf.flagged || 0) + ' opportunities found so far. You can keep working; the list fills up by itself.') + (bf.error ? ' <span style="color:#d9423b">Problem: ' + esc(bf.error) + '</span>' : '') + '</div>';
    const tc = (s.tiers || {}); h += '<div class="rq-sub" style="margin-bottom:8px">Waiting by urgency: 🔴 Act now <b>' + (tc.act || 0) + '</b> · 🟠 Today <b>' + (tc.today || 0) + '</b> · 🟡 This week <b>' + (tc.week || 0) + '</b> · ⚪ Long shot <b>' + (tc.long || 0) + '</b> — listed most urgent first, then how interested, then newest. A chat somebody is working on (4-minute rule) is not offered; if the person who took it does not talk with the customer, it comes back.</div>';
    const ls = d.last_scan, sc = ls && ls.scan;
    h += '<div class="rq-sub" style="margin-bottom:10px">' + (sc ? 'Last check ' + esc(ago(ls.at)) + ' (last ' + esc(cfg.days) + ' days): <b>' + (sc.all || 0) + '</b> queries · <b>' + (sc.quiet || 0) + '</b> quiet for ' + esc(cfg.wait_h) + '+ h · <b>' + (sc.ordered || 0) + '</b> already ordered · looked at <b>' + (sc.candidates || 0) + '</b> · <b>' + (sc.flagged || 0) + '</b> new opportunities · ' + (sc.no_signal || 0) + ' showed no interest · ' + (sc.silent || 0) + ' gone silent.' + (sc.error ? ' <span style="color:#d9423b">Problem: ' + esc(sc.error) + '</span>' : '') : 'No check has run yet — it runs by itself when WhatsApp opens and every 5 minutes.') + '</div>';
    h += '<div class="rq-tabs"><button data-tab="list" class="' + (S.tab === 'list' ? 'on' : '') + '">Queries</button><button data-tab="start" class="' + (S.tab === 'start' ? 'on' : '') + '">Getting started</button><button data-tab="team" class="' + (S.tab === 'team' ? 'on' : '') + '">Rescue team</button><button data-tab="msgs" class="' + (S.tab === 'msgs' ? 'on' : '') + '">Messages</button><button data-tab="people" class="' + (S.tab === 'people' ? 'on' : '') + '">People</button><button data-tab="cfg" class="' + (S.tab === 'cfg' ? 'on' : '') + '">Settings</button></div>';
    if (S.tab === 'list') {
      h += '<div class="rq-row"><select id="rqSt">' + ['all', 'open', 'taken', 'stale', 'won', 'ordered', 'silent', 'skipped'].map((x) => '<option value="' + x + '"' + (S.status === x ? ' selected' : '') + '>' + (x === 'all' ? 'All' : (ST[x] || x)) + '</option>').join('') + '</select>' +
        '<select id="rqDays">' + [1, 3, 7, 14, 30, 90, 365].map((x) => '<option value="' + x + '"' + (S.days === x ? ' selected' : '') + '>Last ' + x + ' day' + (x > 1 ? 's' : '') + '</option>').join('') + '</select></div>';
      h += d.items.length ? d.items.map(itemHtml).join('') : '<div class="rq-empty">Nothing here right now. 🎉</div>';
      if ((d.total || 0) > (d.page_size || 100)) { const pg = d.page || 1, last = Math.ceil(d.total / d.page_size); h += '<div class="rq-row" style="justify-content:center"><button class="btn secondary" data-pg="' + (pg - 1) + '"' + (pg <= 1 ? ' disabled' : '') + '>← Newer</button><span class="rq-sub">Page ' + pg + ' of ' + last + ' · ' + d.total + ' chats</span><button class="btn secondary" data-pg="' + (pg + 1) + '"' + (pg >= last ? ' disabled' : '') + '>Older →</button></div>'; }
    } else if (S.tab === 'team' && S.team) {
      const t = S.team;
      h += '<div class="card" style="padding:14px 18px"><b>Who sees the 🛟 Rescue chip in Chats? (' + esc(t.day) + ')</b><div class="rq-sub">Pick up to 40 people. Only they (and you) see the rescue chats and can take one.</div><div class="rq-team">' +
        (t.people || []).map((p) => '<label><input type="checkbox" data-emp="' + p.emp_id + '"' + (p.in ? ' checked' : '') + '> ' + esc(p.name) + '</label>').join('') + '</div>' +
        '<div class="rq-row"><button class="btn" id="rqTeamDay">Save for today</button><button class="btn secondary" id="rqTeamAlways">Save for every day</button></div>' + (t.always ? '<div class="rq-sub">Today uses the “every day” list.</div>' : '') + '</div>';
    } else if (S.tab === 'start' && S.start) {
      h += '<div class="card" style="padding:14px 18px"><b>Start small: 2 or 3 people for 2–3 days</b><div class="rq-sub" style="margin-bottom:8px">Tick everything below, then watch one customer go through: Take → message → order → ✅.</div>' +
        S.start.steps.map((x) => '<div style="padding:7px 0;border-bottom:1px solid var(--line)">' + (x.done ? '✅ ' : '⬜ ') + esc(x.text) + '</div>').join('') + '</div>';
    } else if (S.tab === 'msgs' && S.msgs) {
      const SM = { missing: 'Draft — not sent to Meta', pending: '⏳ Waiting for Meta', approved: '✅ Approved', partial: '✅ Approved on some numbers', rejected: '❌ Rejected', paused: '⏸ Paused' };
      const drafts = S.msgs.items.filter((m) => m.status === 'missing').length;
      h += '<div class="card" style="padding:14px 18px;margin-bottom:12px"><b>Ready messages for customers whose 24-hour window is closed</b><div class="rq-sub">I wrote 12, one per situation (the customer\'s first name goes where {{1}} is). Read them, change what you like, then press <b>Send all to Meta</b>. After Meta approves, a salesperson sends one with one tap. Once a message is at Meta it cannot be edited: saving a change makes a new version, and the old one keeps working until the new one is approved.</div>' +
        '<div class="rq-row"><button class="btn" id="msgSubmit"' + (drafts ? '' : ' disabled') + '>' + (drafts ? 'Send all ' + drafts + ' drafts to Meta' : 'All sent to Meta') + '</button></div></div>' +
        S.msgs.items.map((m) => '<div class="rq-item"><div class="rq-main"><div class="rq-name">' + esc(m.title) + ' <span class="rq-chip st">' + esc(SM[m.status] || m.status) + '</span></div>' +
          '<textarea data-body="' + m.topic + '" rows="3" style="width:100%;margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px">' + esc(m.body) + '</textarea>' +
          (m.reason ? '<div class="rq-meta" style="color:#b91c1c">Meta says: ' + esc(m.reason) + '</div>' : '') + '</div><div class="rq-act"><button class="btn secondary" data-savemsg="' + m.topic + '">' + (m.editable ? 'Save' : 'Save as new version') + '</button></div></div>').join('');
    } else if (S.tab === 'people' && S.people) {
      h += '<div class="rq-row"><select id="pdays">' + [7, 14, 30, 90].map((x) => '<option value="' + x + '"' + ((S.pdays || 14) === x ? ' selected' : '') + '>Last ' + x + ' days</option>').join('') + '</select></div>' +
        (S.people.people.length ? '<table><thead><tr><th>Person</th><th>Taken</th><th>Orders placed</th><th>Win %</th><th>First message after</th><th>Not a chance</th><th>Sent back</th></tr></thead><tbody>' +
        S.people.people.map((p) => '<tr><td>' + esc(p.name) + '</td><td>' + p.taken + '</td><td><b>' + p.won + '</b></td><td>' + (p.win_pct == null ? '—' : p.win_pct + '%') + '</td><td>' + (p.median_min == null ? '—' : p.median_min + ' min') + '</td><td>' + p.not_a_chance + '</td><td>' + p.returned + '</td></tr>').join('') + '</tbody></table>' : '<div class="rq-empty">Nobody has taken a rescue chat in this period yet.</div>') +
        (S.lost ? '<div class="card" style="padding:14px 18px;margin-top:12px"><b>Why chats were lost (last ' + S.lost.days + ' days): ' + S.lost.total + '</b><div class="rq-sub">Price <b>' + S.lost.by_reason.price + '</b> · Stopped replying <b>' + S.lost.by_reason.no_reply + '</b> · Other <b>' + S.lost.by_reason.other + '</b> · No reason given <b>' + S.lost.by_reason.none + '</b> — the AI agreed on <b>' + S.lost.ai.agreed + '</b>, put <b>' + S.lost.ai.returned + '</b> back, removed <b>' + S.lost.ai.auto + '</b> as not buyers.</div>' + (S.lost.notes.length ? '<ul style="margin:8px 0 0 18px;font-size:13px">' + S.lost.notes.map((n) => '<li>' + esc(n) + '</li>').join('') + '</ul>' : '') + '</div>' : '');
    } else if (S.tab === 'cfg') {
      h += '<div class="card" style="padding:14px 18px"><div class="rq-row"><label><input type="checkbox" id="cOn"' + (cfg.on ? ' checked' : '') + '> Rescue is ON</label></div>' +
        '<div class="rq-row"><label>Stop after (attempts) <input type="number" id="cAtt" min="1" max="30" value="' + esc(cfg.attempts) + '"></label><span class="rq-sub">a person tried this many times since the customer last wrote, no answer → goes silent</span></div>' +
        '<div class="rq-row"><label>Ask “not a chance?” after (days) <input type="number" id="cDec" min="1" max="30" value="' + esc(cfg.decide_days) + '"></label><label>Send to you after (days) <input type="number" id="cStale" min="2" max="60" value="' + esc(cfg.stale_days) + '"></label><span class="rq-sub">a chat a person took and did not close: after the first number it is marked red for them; after the second it waits for your decision</span></div><div class="rq-row"><label><input type="checkbox" id="cBot"' + (cfg.bot_first ? ' checked' : '') + '> Bot and people take turns</label><span class="rq-sub">Bot and people take turns. A chat is left to the bot while the Follow-up Autopilot plan is running, or for 36 hours after any bot message (Autopilot or 60-day Journey). A customer who wants to pay waits only 2 hours after a bot message. While a person has taken a chat, <b>no automatic message</b> (bot, Autopilot, Journey, campaign) goes to that customer. Now: Autopilot <b>' + esc(d.fu_mode && d.fu_mode !== 'off' ? 'ON (' + d.fu_mode + ')' : 'OFF') + '</b> · 60-day Journey <b>' + esc(d.wj_mode && d.wj_mode !== 'off' ? 'ON (' + d.wj_mode + ')' : 'OFF') + '</b>.</span></div><div class="rq-row"><label>Most chats one person can have open <input type="number" id="cMax" min="1" max="100" value="' + esc(cfg.max_open) + '"></label><label>The team sees chats from the last (days) <input type="number" id="cView" min="1" max="365" value="' + esc(cfg.view_days) + '"></label><label><input type="checkbox" id="cLong"' + (cfg.hide_long ? ' checked' : '') + '> Hide ⚪ Long shot from the team</label></div><div class="rq-row"><label>Look back (days) <input type="number" id="cDays" min="1" max="30" value="' + esc(cfg.days) + '"></label></div>' +
        '<div class="rq-row"><label>Quiet for (hours) <input type="number" id="cWait" step="0.5" min="0.5" max="48" value="' + esc(cfg.wait_h) + '"></label><span class="rq-sub">a customer counts as not followed up after this long without a message from them</span></div>' +
        '<button class="btn" id="cSave">Save settings</button></div>';
    }
    root.innerHTML = h;
  }
  async function act(fn, okMsg) {
    if (S.busy) return; S.busy = true;
    try { const r = await fn(); if (okMsg) alert(okMsg(r)); } catch (e) { alert(e.message || 'Failed.'); }
    S.busy = false; load();
  }
  root.addEventListener('click', (e) => {
    const t = e.target.closest('button,a,[data-open],[data-gostatus]'); if (!t) return;
    if (t.dataset.gostatus) { S.tab = 'list'; S.status = t.dataset.gostatus; load(); return; }
    if (t.dataset.pg) { S.page = +t.dataset.pg; load(); return; }
    if (t.dataset.tab) { S.tab = t.dataset.tab; S.page = 1; load(); return; }
    if (t.dataset.open) { openChat(t.dataset.open); return; }
    if (t.dataset.undo) { act(() => api.post('wq.rescue_skip', { phone: t.dataset.undo, undo: true })); return; }
    if (t.dataset.skip) { if (confirm('Hide this query – not a real chance?')) act(() => api.post('wq.rescue_skip', { phone: t.dataset.skip })); return; }
    if (t.dataset.give) {
      api.get('wq.rescue_team').then((tm) => {
        const ppl = (tm.people || []).filter((p) => p.in); if (!ppl.length) { alert('Add people to the Rescue team first.'); return; }
        const n = prompt('Give to (type the number):\n' + ppl.map((p, i) => (i + 1) + '. ' + p.name).join('\n')); const p = ppl[(parseInt(n, 10) || 0) - 1];
        if (p) act(() => api.post('wq.rescue_give', { phone: t.dataset.give, emp_id: p.emp_id }));
      }, (er) => alert(er.message));
      return;
    }
    if (t.id === 'rqTeamDay' || t.id === 'rqTeamAlways') {
      const ids = [...root.querySelectorAll('[data-emp]:checked')].map((c) => +c.dataset.emp);
      act(() => api.post('wq.rescue_team', { emp_ids: ids, always: t.id === 'rqTeamAlways' }), () => ids.length + ' people saved.');
    }
    if (t.id === 'msgSubmit') { if (!confirm('Send all draft messages to Meta for approval now?')) return; act(() => api.post('wq.rescue_tpl_submit', {}), (r) => r.errors && r.errors.length ? 'Sent ' + r.sent + '. Problems:\n' + r.errors.slice(0, 6).join('\n') : 'Sent ' + r.sent + ' to Meta. Approval usually takes minutes to a day.'); return; }
    if (t.dataset.savemsg) { const ta = root.querySelector('[data-body="' + t.dataset.savemsg + '"]'); act(() => api.post('wq.rescue_tpl_save', { topic: t.dataset.savemsg, body: ta ? ta.value : '' }), (r) => r.version === 'new' ? 'Saved as a new version — send it to Meta again.' : 'Saved.'); return; }
    if (t.id === 'cSave') act(() => api.post('wq.rescue_cfg', { on: document.getElementById('cOn').checked, attempts: +document.getElementById('cAtt').value, decide_days: +document.getElementById('cDec').value, max_open: +document.getElementById('cMax').value, bot_first: document.getElementById('cBot').checked, view_days: +document.getElementById('cView').value, hide_long: document.getElementById('cLong').checked, stale_days: +document.getElementById('cStale').value, days: +document.getElementById('cDays').value, wait_h: +document.getElementById('cWait').value }), () => 'Saved.');
  });
  root.addEventListener('change', (e) => {
    if (e.target.id === 'pdays') { S.pdays = +e.target.value; load(); } if (e.target.id === 'rqSt') { S.status = e.target.value; S.page = 1; load(); } if (e.target.id === 'rqDays') { S.days = +e.target.value; S.page = 1; load(); }
  });
  load();
})();
</script>
</body>

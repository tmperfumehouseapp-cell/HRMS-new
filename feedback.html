<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Feedback — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
  .fb{padding:6px 14px 40px;max-width:1400px;margin:0 auto;font-size:13px}
  .fb .pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}.fb .pills button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font:700 12.5px inherit;cursor:pointer;color:#111}.fb .pills button.on{background:#111;color:#fff;border-color:#111}
  .fb .k{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 0 10px}.fb .k div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:#555;font-size:11.5px}.fb .k b{display:block;font-size:20px;color:#111}
  .fb .g{display:grid;grid-template-columns:1.35fr 1fr;gap:12px;align-items:start}
  .fb .c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
  .fb .bar{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center}.fb .bar input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;background:#fff;color:#111}
  .fb .btn{background:#111;color:#fff;border:0;border-radius:10px;padding:9px 13px;font:700 12.5px inherit;cursor:pointer;text-decoration:none;display:inline-block}.fb .btn.g2{background:#0f766e}.fb .btn.gh{background:#fff;color:#111;border:1px solid var(--line)}.fb .btn.rd{background:#fff1f2;color:#b91c1c;border:1px solid #fecdd3}.fb .btn[disabled]{opacity:.5;cursor:not-allowed}
  .fb .wrap{overflow-x:auto}.fb table{width:100%;border-collapse:collapse}.fb th{font-size:10.5px;text-align:left;color:#777;text-transform:uppercase;padding:5px 6px;white-space:nowrap}.fb td{padding:8px 6px;border-top:1px solid #eef0f2;vertical-align:top}
  .fb tr.row{cursor:pointer}.fb tr.row:hover td{background:#f8fafb}.fb tr.sel td{background:#f0fdf4!important}
  .fb .t{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}.s-wait{background:#f3f4f6;color:#555}.s-sent{background:#fef3c7;color:#92400e}.s-replied{background:#e0e7ff;color:#3730a3}.s-proof{background:#dcfce7;color:#166534}.s-cmp{background:#fee2e2;color:#991b1b}.s-rew{background:#ede9fe;color:#5b21b6}.s-skip{background:#eceff1;color:#607d8b}
  .fb .h{font-weight:800;font-size:14px}.fb .sm{color:#666;font-size:11.5px}
  .fb .ph{width:100%;min-height:90px;border-radius:10px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;color:#777;margin:8px 0;overflow:hidden;text-align:center;flex-wrap:wrap;gap:6px;padding:4px}.fb .ph img{max-width:100%;max-height:340px;border-radius:8px;cursor:zoom-in}
  .fb .tl div{padding:3px 0 3px 10px;border-left:2px solid #bde5d2;font-size:12px;color:#444}.fb .tl b{color:#111}.fb .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .fb .msg{background:#dcf8c6;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.45;margin:6px 0;white-space:pre-wrap;color:#111}
  .fb .set{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:12.5px}.fb .set .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.fb .set label{display:block;font-size:11px;font-weight:700;color:#666;margin:0 0 3px}.fb .set input,.fb .set select,.fb .set textarea{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;background:#fff;color:#111;max-width:100%}
  .fb .warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:12px}
  .fb .chips{display:flex;flex-wrap:wrap;gap:6px}.fb .chip{border:1.5px solid #cfd6d9;border-radius:99px;padding:6px 12px;font-weight:600;background:#fff;cursor:pointer;user-select:none;color:#111}.fb .chip.on{background:#0f766e;color:#fff;border-color:#0f766e}.fb .padd{display:flex;gap:6px;margin-top:8px}.fb .padd input{flex:1}
  .fb .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:300;padding:14px}.fb .ov.on{display:flex}.fb .md{background:#fff;color:#111;border-radius:16px;padding:16px;width:min(460px,94vw);max-height:90vh;overflow:auto}.fb .md h3{margin:0 0 8px}.fb .md label{display:block;font-size:12px;color:#555;margin:8px 0 3px}.fb .md input,.fb .md select,.fb .md textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px;font:inherit;background:#fff;color:#111}
  .fb .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);background:#111;color:#fff;border-radius:12px;padding:10px 16px;transition:.3s;opacity:0;z-index:400;pointer-events:none}.fb .toast.on{transform:translateX(-50%);opacity:1}
  .fb .pop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:250;display:none;padding:1.5vh 1.5vw}.fb .pop.on{display:flex}.fb .pp{background:#fff;border-radius:16px;display:flex;width:100%;height:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);color:#111}
  .fb .pL{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;padding:8px 10px;overflow:hidden}.fb .pL iframe{flex:1;min-height:0;height:100%;width:100%;border:1px solid var(--line);border-radius:12px;background:#efeae2;display:block}.fb .pR{width:380px;flex:none;border-left:1px solid var(--line);padding:12px 12px 20px;overflow:auto;position:relative}.fb .pR .acts .btn{font-size:12px;padding:7px 10px}
  .fb .pX{position:absolute;top:8px;right:10px;border:0;background:transparent;font-size:20px;cursor:pointer;color:#555}
  .fb .pop.fold .pR{display:none}.fb .pop.full{padding:0}.fb .pop.full .pp{border-radius:0}.fb .pT{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 6px}.fb .pT .sp{flex:1}.fb .pT button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 10px;font:700 12px inherit;cursor:pointer;color:#111}.fb .pT button.x{background:#111;color:#fff;border-color:#111}
  @media(max-width:900px){.fb .pp{flex-direction:column}.fb .pL{flex:1 1 60%}.fb .pR{width:auto;flex:1 1 40%;border-left:0;border-top:1px solid var(--line)}}
  @media(max-width:900px){.fb .g{grid-template-columns:1fr}.fb .k{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><div><h1>Feedback</h1><div class="sub" style="font-size:12.5px;color:var(--muted);margin-top:2px">Ask delivered customers for feedback, keep the proof, reward them, handle complaints</div></div></div>
    <div class="content"><div class="fb" id="fb">
      <div id="warn"></div>
      <details class="set" id="setBox"><summary style="cursor:pointer;font-weight:800">⚙ Settings <span class="sm" id="setSum"></span></summary><div id="setIn" style="margin-top:10px"></div></details>
      <div class="pills" id="tabs"></div><div class="k" id="kp"></div>
      <div class="g"><div class="c"><div class="bar"><input id="q" placeholder="🔍 Search order ID, name or phone  e.g. 72474" autocomplete="off"><button class="btn gh" id="testBtn" type="button">🧪 Test with a customer</button><a class="btn" id="newOrd" href="hub.html?w=dispatch&t=dispatch_manual" target="_top">＋ Create order</a></div>
        <div class="wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Delivered</th><th>Message</th><th>Seen</th><th>Status</th><th>Proof</th><th>Chat</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="sm" style="padding:16px">Loading…</td></tr></tbody></table></div><div id="none" class="sm" style="display:none;padding:14px">No order found.</div></div>
      <div class="c" id="side"><div class="sm">Pick an order.</div></div></div>
      <div class="pop" id="pop"><div class="pp"><div class="pL"><div id="popTop" class="pT"></div><div id="popChat" style="flex:1;display:flex;flex-direction:column;min-height:0"></div></div><div class="pR"><button class="pX" id="popX" type="button" aria-label="Close">✕</button><div id="popR"></div></div></div></div>
      <div class="ov" id="ov"><div class="md" id="md"></div></div><div class="toast" id="ts"></div><input type="file" id="fi" accept="image/jpeg,image/png,image/webp" style="display:none">
    </div></div>
  </main>
</div>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/api.js?v=13"></script>
<script src="assets/js/layout.js?v=38"></script>
<script src="assets/js/order_hub.js?v=7"></script>
<script>
  guardPage();
  renderSidebar('feedback');
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ST = { wait: ['Waiting', 's-wait'], sent: ['Message sent', 's-sent'], replied: ['Replied', 's-replied'], proof: ['Proof received', 's-proof'], rew: ['Reward given', 's-rew'], cmp: ['Complaint', 's-cmp'], skip: ['Left out', 's-skip'] };
  const TABS = [['all', 'All'], ['wait', 'Waiting'], ['sent', 'Message sent'], ['unseen', 'Not seen'], ['replied', 'Replied'], ['proof', 'Proof received'], ['rew', 'Reward given'], ['cmp', 'Complaint'], ['skip', 'Left out']];
  let tab = 'all', sel = '', query = '', L = null, CFG = null, CAN = false, DET = null, tplList = null, seq = 0;
  function say(t, bad) { const e = $('ts'); e.textContent = t; e.style.background = bad ? '#b91c1c' : '#111'; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 3200); }
  const dt = (s) => { if (!s) return ''; const m = /^\d{4}-(\d\d)-(\d\d)[ T](\d\d:\d\d)/.exec(s); if (!m) return s; return new Date(2000, +m[1] - 1, +m[2]).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) + ' ' + m[3]; };
  const dd = (s) => { const m = /^\d{4}-(\d\d)-(\d\d)/.exec(s || ''); return m ? new Date(2000, +m[1] - 1, +m[2]).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : ''; };

  async function load() {
    const my = ++seq;
    try { const r = await api.get('fb.list', { tab, q: query }); if (my !== seq) return; L = r; CFG = r.cfg; CAN = r.can_edit; draw(); if (sel) openOrder(sel, true); }
    catch (e) { $('rows').innerHTML = `<tr><td colspan="7" style="padding:16px;color:#b91c1c">${esc(e.message)}</td></tr>`; }
  }
  function draw() {
    const c = L.counts;
    $('tabs').innerHTML = TABS.map(([k, l]) => `<button class="${tab === k && !query ? 'on' : ''}" data-t="${k}">${l}${k === 'all' ? ' ' + c.all : k === 'unseen' ? ' ' + c.unseen : (c[k] != null ? ' ' + c[k] : '')}</button>`).join('');
    $('kp').innerHTML = `<div>Delivered<b>${c.all}</b>last 60 days</div><div>Message sent<b>${c.sent_total}</b></div><div>Seen<b>${c.seen}</b>${c.sent_total ? Math.round(c.seen * 100 / c.sent_total) + '%' : ''}</div><div>Replied<b>${c.replied + c.proof + c.rew}</b></div><div>Proof received<b>${c.proof_orders}</b>orders with a screenshot</div><div>Complaints<b>${c.cmp}</b></div>`;
    $('warn').innerHTML = !CFG.on ? '<div class="warn">⚠ <b>Automatic messages are OFF.</b> Nothing is sent by itself yet. Open ⚙ Settings, pick the approved messages and switch it on.</div>' : (!CFG.tpl ? '<div class="warn">⚠ Pick the approved <b>feedback message</b> in ⚙ Settings, or nothing can be sent.</div>' : '');
    $('setSum').textContent = '· ' + (CFG.on ? 'automatic ON' : 'automatic OFF') + ' · message after ' + CFG.wait + ' days · follow-up after ' + CFG.fu + ' days';
    $('none').style.display = L.rows.length ? 'none' : 'block';
    $('rows').innerHTML = L.rows.map((x) => `<tr class="row ${x.order === sel ? 'sel' : ''}" data-o="${esc(x.order)}"><td><a href="#" class="oid" data-o="${esc(x.order)}" data-s="${esc(x.store)}" data-p="${esc(x.phone)}" title="Open the order details" style="font-weight:800;color:#c2410c">${esc(x.order)}</a>${x.test ? ' <span class="t s-skip">🧪 TEST</span>' : ''}</td><td>${esc(x.customer || '—')}<br><span class="sm">${esc(x.phone)}</span></td><td>${esc(dd(x.delivered))}</td><td>${x.msg_at ? esc(dt(x.msg_at)) + (x.fu_at ? '<br><span class="sm">+ follow-up ' + esc(dd(x.fu_at)) + '</span>' : '') : '<span class="sm">goes after ' + CFG.wait + ' days</span>' + (x.msg_err ? '<br><span class="sm" style="color:#b91c1c">' + esc(x.msg_err) + '</span>' : '')}</td><td>${x.msg_at ? (x.seen ? '✓✓ Seen' : (x.msg_state === 'failed' ? '<span style="color:#b91c1c" title="' + esc(x.msg_why) + '">✗ Failed</span><br><span class="sm" style="color:#b91c1c">open it to see why</span>' : '✓ Not seen')) : '—'}</td><td><span class="t ${(ST[x.status] || ST.wait)[1]}">${(ST[x.status] || ST.wait)[0]}</span>${x.last_call ? '<br><span class="sm">📞 ' + esc(x.last_call.replace(/^Call:\s*/, '')) + '</span>' : ''}</td><td>${x.proofs ? '🖼 ' + x.proofs : '—'}</td><td><button class="btn g2" data-chat="${esc(x.order)}" type="button" style="padding:5px 9px">💬 Open chat</button></td></tr>`).join('');
    renderSet();
  }
  function renderSet() {
    if (!CAN) { $('setIn').innerHTML = '<div class="sm">Only Admin / HR can change the settings. Now: message ' + CFG.wait + ' days after delivery, follow-up after ' + CFG.fu + ' days, ' + (CFG.on ? 'automatic ON' : 'automatic OFF') + '.</div>'; return; }
    if ($('setIn').dataset.k === JSON.stringify(CFG) && $('setIn').children.length) return; $('setIn').dataset.k = JSON.stringify(CFG);
    $('setIn').innerHTML = `<div class="row"><div><label>Send messages automatically</label><select id="sOn"><option value="0" ${CFG.on ? '' : 'selected'}>OFF</option><option value="1" ${CFG.on ? 'selected' : ''}>ON</option></select></div>
      <div><label>Feedback message after (days from delivery)</label><input id="sW" type="number" min="1" max="30" value="${CFG.wait}" style="width:80px"></div><div><label>Follow-up after (days, if no reply)</label><input id="sF" type="number" min="1" max="30" value="${CFG.fu}" style="width:80px"></div></div>
      <div class="row" style="margin-top:8px"><div><label>Feedback message (approved by Meta, with only the name as a blank)</label><select id="sT"><option value="0">— pick —</option></select></div><div><label>Follow-up message</label><select id="sT2"><option value="0">— none —</option></select></div></div>
      <div class="row" style="margin-top:8px"><div style="flex:1;min-width:240px"><label>Places where feedback counts (one per line)</label><textarea id="sP" rows="3" style="width:100%">${esc(CFG.places.join('\n'))}</textarea></div><div><label>Reward</label><input id="sR" value="${esc(CFG.reward)}"></div></div>
      <div class="row" style="margin-top:8px"><div class="sm" style="flex:1">Review links (Google, Instagram …) are made in the order panel: <b>＋ Add / manage links</b>.</div><button class="btn g2" id="sSave" type="button">Save settings</button></div>
      <div class="sm" style="margin-top:6px">Messages go only between 10 AM and 8 PM, at most a few per minute, and never to a customer who said Stop. A message must first be approved by Meta (Campaigns → Messages).</div>`;
    const fill = (tpls) => { const mk = (sel, cur) => { const e = $(sel); (tpls || []).forEach((t) => { const o = document.createElement('option'); o.value = t.id; o.textContent = t.name + (t.category ? ' · ' + t.category : ''); if (+t.id === +cur) o.selected = true; e.appendChild(o); }); }; mk('sT', CFG.tpl); mk('sT2', CFG.tpl_fu); };
    if (tplList) fill(tplList); else api.get('wa.camp_templates').then((t) => { tplList = ((t || {}).templates || []).filter((x) => (Array.isArray(x.vars) ? x.vars.length : (+x.vars || 0)) <= 1); fill(tplList); }).catch(() => { $('setIn').insertAdjacentHTML('beforeend', '<div class="sm" style="color:#b91c1c">Could not read your messages.</div>'); });
    $('sSave').onclick = async () => {
      try { const r = await api.post('fb.settings_save', { on: $('sOn').value === '1', wait: +$('sW').value, fu: +$('sF').value, tpl: +$('sT').value, tpl_fu: +$('sT2').value, places: $('sP').value.split('\n'), reward: $('sR').value }); CFG = r.cfg; $('setIn').dataset.k = ''; say('Settings saved'); load(); }
      catch (e) { say(e.message, true); }
    };
  }
  async function imgUrl(id) { const r = await api.get('fb.proof_data', { id }); return r.src; }
  async function openOrder(o, quiet) {
    sel = o; if (!quiet) draw();
    try { const d = await api.get('fb.get', { order: o }); if (sel !== o) return; DET = d; drawSide(); }
    catch (e) { $('side').innerHTML = `<div style="color:#b91c1c">${esc(e.message)}</div>`; }
  }
  let popOpen = false;
  // the pieces of an order's panel: header + proof, the buttons, the rest (message, history) — used by the side panel AND the big chat pop-up
  function parts(d) {
    const x = d.row, txt = x.status === 'sent' && !x.seen && d.text_fu ? d.text_fu : d.text;
    const hdr = `<div class="h"><a href="#" class="oid" data-o="${esc(x.order)}" data-s="${esc(x.store)}" data-p="${esc(x.phone)}" title="Open the order details" style="color:#c2410c">${esc(x.order)}</a> · ${esc(x.customer || '')}</div><div class="sm">${esc(x.phone)} · delivered ${esc(dt(x.delivered))} · <span class="t ${(ST[x.status] || ST.wait)[1]}">${(ST[x.status] || ST.wait)[0]}</span></div>
      ${d.proofs.length ? '<div class="ph phs">Loading…</div>' : '<div class="sm" style="margin:6px 0">No feedback screenshot yet</div>'}
      ${x.msg_state === 'failed' ? `<div style="background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:12px;line-height:1.45"><b>✗ WhatsApp could not deliver the message.</b><br>${esc(x.msg_why)}</div>` : ''}${x.place ? `<div class="sm">Given on: <b>${esc(x.place)}</b></div>` : ''}${x.reward_note ? `<div class="sm">Reward: <b>${esc(x.reward_note)}</b>${x.reward_order ? ' · order ' + esc(x.reward_order) : ''}</div>` : ''}${x.cx_code ? `<div class="sm">Complaint: <b>${esc(x.cx_code)}</b></div>` : ''}`;
    const acts = `<div class="acts">${x.status === 'wait' ? '<button class="btn g2" data-act="now">📨 Send message now</button>' : ''}${x.msg_at ? '<button class="btn gh" data-act="fu">📨 Send follow-up</button>' : ''}<button class="btn gh" data-act="call">📞 Call done</button><button class="btn gh" data-act="pf">⬆ Add proof manually</button><button class="btn g2" data-act="rw">🎁 Reward</button><button class="btn rd" data-act="cx">⚠ Customer has an issue</button><button class="btn gh" data-act="sk">Leave out</button>${x.test ? '<button class="btn rd" data-act="del">🗑 Delete this test</button>' : ''}</div><div class="h" style="margin-top:10px;font-size:12px;color:#0f766e">🔗 SEND A REVIEW LINK — ONE TAP</div><div class="acts">${(CFG.links || []).map((l, i) => `<button class="btn g2" data-lk="${i}" type="button">🔗 ${esc(l.name)}</button>`).join('')}<button class="btn gh" data-act="links" type="button">＋ Add / manage links</button></div>`;
    const rest = `${x.test ? '<div class="sm" style="margin-top:6px">🧪 This is a test: nothing is sent automatically for it. Use the chat and the buttons, reply from the customer\'s WhatsApp, and send a screenshot to see the whole flow.</div>' : ''}
      ${txt ? `<div class="h" style="margin-top:12px;font-size:12.5px">Message that ${x.msg_at ? 'was' : 'will be'} sent</div><div class="msg">${esc(txt)}</div>` : '<div class="sm" style="margin-top:10px">No message is picked yet (⚙ Settings).</div>'}
      <div class="h" style="margin-top:10px;font-size:12.5px">History</div><div class="tl">${d.events.length ? d.events.map((e) => `<div><b>${esc(dt(e.at))}</b> ${esc(e.txt)}${e.by_name && e.by_name !== 'automatic' ? ' <span class="sm">· ' + esc(e.by_name) + '</span>' : ''}</div>`).join('') : '<div class="sm">Nothing yet.</div>'}</div>`;
    return { hdr, acts, rest };
  }
  const ACTS = { now: () => send('fb.send_now'), fu: () => send('fb.followup'), call: () => callDone(), links: () => manageLinks(), pf: () => pickProof(), rw: () => reward(), cx: () => complaint(), sk: () => leaveOut(), del: () => delTest(), chat: () => openPop() };
  function wire(root, d) {
    root.querySelectorAll('[data-act]').forEach((b) => { const f = ACTS[b.dataset.act]; if (f) b.onclick = f; });
    root.querySelectorAll('[data-lk]').forEach((b) => { b.onclick = () => askLink(+b.dataset.lk); });
    const box = root.querySelector('.phs'); if (!d.proofs.length || !box) return; box.innerHTML = '';
    d.proofs.forEach((p) => { imgUrl(p.id).then((u) => { const i = document.createElement('img'); i.src = u; i.title = (p.src === 'whatsapp' ? 'Sent by the customer on WhatsApp' : 'Added by hand') + ' · ' + dt(p.created_at); i.onclick = () => { const w = window.open('', '_blank'); if (w) w.document.write('<img src="' + u + '" style="max-width:100%">'); };
        const w = document.createElement('div'); w.style.cssText = 'position:relative;display:inline-block;max-width:100%'; w.appendChild(i);
        const rm = document.createElement('button'); rm.type = 'button'; rm.className = 'btn rd'; rm.textContent = '🗑 Remove proof'; rm.style.cssText = 'position:absolute;top:6px;right:6px;padding:4px 9px;font-size:11px';
        rm.onclick = async (ev) => { ev.stopPropagation(); if (!confirm('Remove this proof picture from ' + sel + '?')) return; rm.disabled = true; try { await api.post('fb.proof_delete', { id: p.id }); say('Proof removed'); load(); } catch (er) { say(er.message, true); rm.disabled = false; } };
        w.appendChild(rm); box.appendChild(w); }).catch((er) => { box.insertAdjacentHTML('beforeend', '<span class="sm" style="color:#b91c1c">The picture could not be shown: ' + esc(er.message) + '</span>'); }); });
  }
  function drawSide() {
    const d = DET, x = d.row, P = parts(d);
    if (!$('sA')) $('side').innerHTML = '<div id="sA"></div><div id="sB"></div>';
    $('sA').innerHTML = P.hdr + `<div class="acts"><button class="btn g2" data-act="chat" type="button" style="font-size:13px;padding:10px 16px">💬 Open WhatsApp chat (big window)</button></div>`;
    $('sB').innerHTML = P.acts + P.rest; wire($('side'), d);
    if (popOpen) drawPop(d);
  }
  // 💬 the big chat window: the customer's WhatsApp live on the left (the whole height), the order on the right. The chat frame is kept while the same customer stays open, so a refresh never closes what you are typing.
  function drawPop(d) {
    const x = d.row, P = parts(d), ph10 = String(x.phone || '').replace(/\D/g, '').slice(-10), cb = $('popChat');
    $('popTop').innerHTML = `<b style="font-size:14px;color:#111">💬 ${esc(x.customer || x.order)}</b><span class="sm">${esc(x.phone)} · ${esc(x.order)} · live</span><span class="sp"></span><button type="button" data-pf="fold">${popFold ? '◂ Show details' : '▸ Hide details'}</button><button type="button" data-pf="full">${popFull ? '⛶ Back to the page' : '⛶ Full screen'}</button><button type="button" class="x" data-pf="x">✕ Close (Esc)</button>`;
    $('pop').classList.toggle('fold', popFold); $('pop').classList.toggle('full', popFull);
    if (ph10.length === 10) { if (cb.dataset.p !== ph10 || !cb.firstChild) { cb.dataset.p = ph10; cb.innerHTML = `<iframe id="chatFr" title="WhatsApp chat" src="my_chats.html?embed=1&fb=1&phone=${ph10}" allow="microphone; clipboard-write"></iframe>`; } }
    else { cb.dataset.p = ''; cb.innerHTML = '<div class="sm" style="margin:10px 0">This order has no phone number, so there is no WhatsApp chat.</div>'; }
    $('popR').innerHTML = P.hdr + P.acts + P.rest; wire($('popR'), d);      // the buttons sit on the right so the chat keeps the whole height
  }
  let popFull = true, popFold = false;
  // ⛶ full screen: the page's own frame (inside the hub) is stretched over the whole browser, so the HRMS menu and header are hidden while the chat is open; closing puts it back
  function goFull(on) { try { const fe = window.frameElement; if (!fe) return; if (on) { if (fe.dataset.fbOld === undefined) fe.dataset.fbOld = fe.getAttribute('style') || ''; fe.style.cssText = fe.dataset.fbOld + ';position:fixed;left:0;top:0;width:100vw;height:100vh;max-width:none;max-height:none;z-index:99999;border:0;background:#e3ebec;'; } else if (fe.dataset.fbOld !== undefined) { fe.style.cssText = fe.dataset.fbOld; delete fe.dataset.fbOld; } } catch (e) { } }
  async function openPop() { if (!DET) return; popOpen = true; $('pop').classList.add('on'); goFull(popFull); drawPop(DET); }
  function closePop() { popOpen = false; $('pop').classList.remove('on'); $('popChat').innerHTML = ''; $('popChat').dataset.p = ''; goFull(false); }
  $('popTop').onclick = (e) => { const b = e.target.closest('[data-pf]'); if (!b) return; const k = b.dataset.pf; if (k === 'x') return closePop(); if (k === 'fold') popFold = !popFold; if (k === 'full') { popFull = !popFull; goFull(popFull); } if (DET) drawPop(DET); };
  $('popX').onclick = closePop; $('pop').onclick = (e) => { if (e.target.id === 'pop') closePop(); };
  document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if ($('ov').classList.contains('on')) closeM(); else if (popOpen) closePop(); });
  async function send(a) { try { await api.post(a, { order: sel }); say('Message sent'); load(); } catch (e) { say(e.message, true); } }
  /* several places + a new one typed by hand (it is kept in the list for next time) */
  function placeBox(sel) {
    const draw = () => { const all = CFG.places.concat(sel.filter((p) => CFG.places.indexOf(p) < 0)); $('pch').innerHTML = all.map((p) => `<span class="chip ${sel.indexOf(p) > -1 ? 'on' : ''}" data-p="${esc(p)}">${sel.indexOf(p) > -1 ? '✓ ' : ''}${esc(p)}</span>`).join(''); };
    const box = `<div class="chips" id="pch"></div><div class="padd"><input id="pnew" placeholder="Type a new place, e.g. Trustpilot"><button class="btn g2" id="padd" type="button">＋ Add</button></div>`;
    const wire = () => {
      draw();
      $('pch').onclick = (e) => { const c = e.target.closest('.chip'); if (!c) return; const p = c.dataset.p, k = sel.indexOf(p); if (k > -1) sel.splice(k, 1); else sel.push(p); draw(); };
      $('padd').onclick = async () => { const v = $('pnew').value.trim(); if (!v) return; try { const r = await api.post('fb.place_add', { place: v }); CFG.places = r.places; v.split(',').map((x) => x.trim()).filter(Boolean).forEach((x) => { if (sel.indexOf(x) < 0) sel.push(x); }); $('pnew').value = ''; draw(); } catch (er) { say(er.message, true); } };
      $('pnew').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); $('padd').click(); } };
    };
    return { html: box, wire };
  }
  function pickProof() {
    const o = sel; $('fi').onchange = (e) => {
      const f = e.target.files[0]; if (!f) return; e.target.value = '';
      const pl = placeBox([]); modal(`<h3>⬆ Add proof to ${esc(o)}</h3><div class="sm">${esc(f.name)}</div><label>Feedback was given on <span class="sm">(tap to select — more than one is fine)</span></label>${pl.html}<div class="acts"><button class="btn g2" id="pgo">Attach screenshot</button><button class="btn gh" id="pno">Cancel</button></div>`); pl.wire();
      $('pno').onclick = closeM;
      $('pgo').onclick = async () => { const fd = new FormData(); fd.append('order', o); fd.append('proof', f); fd.append('place', [...document.querySelectorAll('#pch .chip.on')].map((c) => c.dataset.p).join(', ')); const b = $('pgo'); b.disabled = true; try { await api.upload('fb.proof_add', fd); closeM(); say('Screenshot attached to ' + o); load(); } catch (er) { say(er.message, true); b.disabled = false; } };
    }; $('fi').click();
  }
  function modal(h) { $('md').innerHTML = h; $('ov').classList.add('on'); } function closeM() { $('ov').classList.remove('on'); }
  $('ov').onclick = (e) => { if (e.target.id === 'ov') closeM(); };
  function reward() {
    const x = DET.row, pl = placeBox((x.place || '').split(',').map((p) => p.trim()).filter(Boolean));
    modal(`<h3>🎁 Reward for ${esc(x.order)}</h3><div class="sm">${esc(x.customer)} · ${esc(x.phone)}</div><label>Gift</label><input id="rg" value="${esc(CFG.reward)}"><label>Feedback was given on <span class="sm">(tap to select — more than one is fine)</span></label>${pl.html}
      <label>Reward order number (WM-…), if you made one</label><input id="ro" value="${esc(x.reward_order)}" placeholder="WM-00044">
      <div class="sm" style="margin-top:8px">First make the free order on the <a href="hub.html?w=dispatch&t=dispatch_manual" target="_top">Manual order page</a> (price ₹0), then type its number here. When that order is booked, its tracking ID goes to the customer by the automatic order messages.</div>
      <div class="acts"><button class="btn g2" id="rgo">Mark reward given</button><button class="btn gh" id="rno">Cancel</button></div>`); pl.wire();
    $('rno').onclick = closeM;
    $('rgo').onclick = async () => { try { await api.post('fb.reward', { order: x.order, gift: $('rg').value, place: [...document.querySelectorAll('#pch .chip.on')].map((c) => c.dataset.p).join(', '), reward_order: $('ro').value }); closeM(); say('Reward saved'); load(); } catch (e) { say(e.message, true); } };
  }
  const PROBS = [['leak', 'Leak / damaged'], ['wrong', 'Wrong item'], ['quality', 'Smell / quality'], ['notliked', 'Not liked / return'], ['missing', 'Missing item'], ['notdelivered', 'Not delivered'], ['refund', 'Refund'], ['other', 'Other']];
  function complaint() {
    const x = DET.row;
    modal(`<h3>⚠ Complaint for ${esc(x.order)}</h3><div class="sm">It opens a ticket in the Complaints page, linked to this order.</div><label>What is the issue?</label><select id="cp">${PROBS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select><label>Note</label><textarea id="cn" rows="3" placeholder="What the customer said"></textarea>
      <div class="acts"><button class="btn rd" id="cgo">Create complaint</button><button class="btn gh" id="cno">Cancel</button></div>`);
    $('cno').onclick = closeM;
    $('cgo').onclick = async () => {
      const b = $('cgo'); b.disabled = true;
      try {
        const sum = $('cn').value.trim(), prob = $('cp').value; if (prob === 'other' && !sum) { say('Write a few words about the problem.', true); b.disabled = false; return; }
        const r = await api.post('bd.cx_raise', { phone: x.phone, name: x.customer, source: 'whatsapp', problem: prob, urgency: 'normal', summary: sum, order_name: x.order });
        const m = /\b[A-Z]{1,3}-?\d{2,}\b/.exec(r.message || '') || [''];
        await api.post('fb.cx_done', { order: x.order, code: m[0], why: PROBS.find((p) => p[0] === prob)[1] + (sum ? ' — ' + sum : '') });
        closeM(); say(r.message || 'Complaint created'); load();
      } catch (e) { say(e.message, true); b.disabled = false; }
    };
  }
  const CALLS = [['answered_will', 'Answered — will give feedback'], ['answered_given', 'Answered — feedback already given'], ['answered_issue', 'Answered — has a problem'], ['no_answer', 'No answer'], ['busy', 'Busy / switched off'], ['call_later', 'Asked to call later'], ['wrong_number', 'Wrong number'], ['refused', 'Does not want to give feedback']];
  function callDone() {
    const x = DET.row; let pick = '';
    modal(`<h3>📞 Call to ${esc(x.customer || x.order)}</h3><div class="sm">${esc(x.phone)} · ${esc(x.order)} — what happened on the call?</div><div class="chips" id="cc" style="margin-top:8px">${CALLS.map(([k, l]) => `<span class="chip" data-k="${k}">${l}</span>`).join('')}</div><label>Note (optional)</label><input id="cn2" placeholder="e.g. will send the screenshot tonight">
      <div class="acts"><button class="btn g2" id="cgo2">Save call</button><button class="btn gh" id="cno2">Cancel</button></div>`);
    $('cc').onclick = (e) => { const c = e.target.closest('.chip'); if (!c) return; pick = c.dataset.k; document.querySelectorAll('#cc .chip').forEach((z) => z.classList.toggle('on', z === c)); };
    $('cno2').onclick = closeM;
    $('cgo2').onclick = async () => { if (!pick) { say('Pick what happened on the call.', true); return; } try { await api.post('fb.call', { order: x.order, result: pick, note: $('cn2').value }); closeM(); say('Call saved'); load(); } catch (e) { say(e.message, true); } };
  }
  const LKMSG = 'Hello {name}, thank you for your order {order}. If you liked it, please share your feedback here: {link}';
  const fillMsg = (l, x) => (l.msg || LKMSG).replace(/\{name\}/g, (x.customer || '').split(' ')[0] || 'ji').replace(/\{order\}/g, x.order).replace(/\{link\}/g, l.url);
  function askLink(i) {
    const x = DET.row, l = (CFG.links || [])[i]; if (!l) return;
    modal(`<h3>Send “${esc(l.name)}” to ${esc(x.customer || x.order)}?</h3><div class="sm">${esc(x.phone)} · goes on WhatsApp from HRMS now. You can change the words below.</div><textarea id="lm" rows="5" style="margin-top:8px">${esc(fillMsg(l, x))}</textarea>
      <div class="sm" style="margin-top:6px">A typed message goes only within 24 hours of the customer's last message. After that, send an approved pre-made message with the link from the chat (✨).</div>
      <div class="acts"><button class="btn g2" id="lgo">Send now</button><button class="btn gh" id="lno">Cancel</button></div>`);
    $('lno').onclick = closeM;
    $('lgo').onclick = async () => { const b = $('lgo'); b.disabled = true; try { await api.post('fb.send_link', { order: x.order, url: l.url, text: $('lm').value }); closeM(); say(l.name + ' link sent on WhatsApp'); load(); } catch (e) { say(e.message, true); b.disabled = false; } };
  }
  async function saveLinks(list) { const r = await api.post('fb.links_save', { links: list }); CFG.links = r.links; if (DET) drawSide(); return r.links; }
  function manageLinks() {
    const ls = CFG.links || [];
    modal(`<h3>Review links</h3><div class="sm">Make a link once. It appears as a one-tap button for every customer.</div>${ls.length ? ls.map((l, i) => `<div style="display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0"><div style="flex:1;min-width:0"><b>${esc(l.name)}</b><div class="sm" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.url)}</div></div><button class="btn gh" data-e="${i}" type="button">Edit</button><button class="btn rd" data-d="${i}" type="button">Delete</button></div>`).join('') : '<div class="sm" style="margin:8px 0">No link yet.</div>'}
      <div class="acts"><button class="btn g2" id="lAdd" type="button">＋ Add a link</button><button class="btn gh" id="lClose" type="button">Close</button></div>`);
    $('lClose').onclick = closeM; $('lAdd').onclick = () => editLink(-1);
    document.querySelectorAll('#md [data-e]').forEach((b) => { b.onclick = () => editLink(+b.dataset.e); });
    document.querySelectorAll('#md [data-d]').forEach((b) => { b.onclick = async () => { const i = +b.dataset.d; if (!confirm('Delete the link “' + ls[i].name + '”?')) return; try { await saveLinks(ls.filter((_, k) => k !== i)); manageLinks(); } catch (e) { say(e.message, true); } }; });
  }
  function editLink(i) {
    const ls = CFG.links || [], l = i < 0 ? { name: '', url: '', msg: LKMSG } : ls[i];
    modal(`<h3>${i < 0 ? 'Add a link' : 'Edit link'}</h3><label>Name (the button)</label><input id="en" value="${esc(l.name)}" placeholder="e.g. Google review"><label>Link</label><input id="eu" value="${esc(l.url)}" placeholder="https://…"><label>Message <span class="sm">({name} {order} {link} are filled in for each customer)</span></label><textarea id="em" rows="4">${esc(l.msg || LKMSG)}</textarea>
      <div class="acts"><button class="btn g2" id="esv" type="button">Save link</button><button class="btn gh" id="eback" type="button">Back</button></div>`);
    $('eback').onclick = manageLinks;
    $('esv').onclick = async () => { const o = { name: $('en').value.trim(), url: $('eu').value.trim(), msg: $('em').value }; if (!o.name || !/^https?:\/\//i.test(o.url)) { say('Give a name and a link that starts with https://', true); return; }
      try { const list = ls.slice(); if (i < 0) list.push(o); else list[i] = o; await saveLinks(list); say('Link saved'); manageLinks(); } catch (e) { say(e.message, true); } };
  }
  function delTest() { const o = sel; if (!confirm('Delete the test ' + o + ' with its screenshots and history?')) return; api.post('fb.test_delete', { order: o }).then(() => { sel = ''; $('side').innerHTML = '<div class="sm">Pick an order.</div>'; say('Test deleted'); load(); }).catch((e) => say(e.message, true)); }
  $('testBtn').onclick = () => {
    modal(`<h3>🧪 Test with a customer</h3><div class="sm">Pick one customer (your own number is best). A TEST order is made and the feedback message is sent to that number now. Nothing automatic is ever sent for a test.</div>
      <label>Customer mobile number</label><input id="tp" inputmode="numeric" placeholder="10-digit number"><label>Name (used in the message)</label><input id="tn" placeholder="e.g. Mehul">
      <div class="sm" style="margin-top:6px">The message that goes: the approved feedback message you picked in ⚙ Settings. Then reply to it from that phone, send a screenshot, and watch this page: it shows Seen, Replied and the screenshot on the TEST order.</div>
      <div class="acts"><button class="btn g2" id="tgo">Create test &amp; send the message</button><button class="btn gh" id="tno">Cancel</button></div>`);
    $('tno').onclick = closeM;
    $('tgo').onclick = async () => {
      const b = $('tgo'); b.disabled = true; let o = '';
      try { const r = await api.post('fb.test_add', { phone: $('tp').value, name: $('tn').value }); o = r.order; await api.post('fb.send_now', { order: o }); closeM(); sel = o; say('Test message sent to ' + $('tp').value); load(); }
      catch (e) { if (o) { closeM(); sel = o; load(); } say(e.message + (o ? ' (the TEST order was made: fix it, then press "Send message now")' : ''), true); b.disabled = false; }
    };
  };
  function leaveOut() {
    const x = DET.row; modal(`<h3>Leave ${esc(x.order)} out?</h3><div class="sm">No feedback message is sent for it.</div><label>Why</label><input id="kw" value="no feedback needed"><div class="acts"><button class="btn" id="kgo">Leave out</button><button class="btn gh" id="kno">Cancel</button></div>`);
    $('kno').onclick = closeM; $('kgo').onclick = async () => { try { await api.post('fb.skip', { order: x.order, why: $('kw').value }); closeM(); load(); } catch (e) { say(e.message, true); } };
  }
  document.addEventListener('click', (e) => {
    const oa = e.target.closest('a.oid'); if (oa) {      // the order number opens the order details (the Dispatch order card: order, customer, parcel, chat)
      e.preventDefault(); e.stopPropagation();
      if (!window.OrderHub) { say('The order details are not loaded. Reload the page.', true); return; }
      const o = oa.dataset.o, st = oa.dataset.s, ph = oa.dataset.p;
      if (/^TEST-/.test(o) || !o) OrderHub.open({ phone: ph }); else OrderHub.open(st ? { order: o, store: st } : { order: o, phone: ph });
      return;
    }
    const t = e.target.closest('[data-t]'); if (t) { tab = t.dataset.t; query = ''; $('q').value = ''; load(); return; }
    const cb = e.target.closest('[data-chat]'); if (cb) { e.stopPropagation(); openOrder(cb.dataset.chat).then(() => openPop()); return; }
    const r = e.target.closest('tr.row'); if (r) { openOrder(r.dataset.o); }
  });
  let qt = 0; $('q').oninput = (e) => { clearTimeout(qt); qt = setTimeout(() => { query = e.target.value.trim(); load(); }, 350); };
  load(); setInterval(() => { if (!document.hidden && !$('ov').classList.contains('on')) load(); }, 60000);
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>

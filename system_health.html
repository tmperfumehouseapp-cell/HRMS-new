<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HRMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>System health — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=260929d">
<style>
  [hidden]{display:none !important;}
  .sh{font-family:Manrope,var(--font);}
  .sh-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .sh-top .sp{flex:1;}
  .sh-sum{display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; font-weight:800; font-size:13px;}
  .sh-sum.ok{background:#e4f6ec; color:#16945a;} .sh-sum.warn{background:#fff3e0; color:#b45309;} .sh-sum.bad{background:#fdecea; color:#d9423b;}
  .sh-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:14px; margin-bottom:14px;}
  .sh-card{padding:16px 18px;}
  .sh-card h3{margin:0 0 10px; font-size:14px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .sh-dot{width:10px; height:10px; border-radius:50%; background:#c9ccd2; flex:none;}
  .sh-dot.ok{background:#16945a;} .sh-dot.warn{background:#f59e0b;} .sh-dot.bad{background:#d9423b;}
  .sh-row{display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-top:1px solid #f0f1f4; font-size:13px;}
  .sh-row:first-of-type{border-top:0;}
  .sh-row span:first-child{color:var(--muted);}
  .sh-row b{font-weight:700; text-align:right; word-break:break-word;}
  .sh-pill{display:inline-block; padding:2px 10px; border-radius:999px; font-size:11.5px; font-weight:800;}
  .sh-pill.ok{background:#e4f6ec; color:#16945a;} .sh-pill.warn{background:#fff3e0; color:#b45309;} .sh-pill.bad{background:#fdecea; color:#d9423b;} .sh-pill.na{background:#f1f2f5; color:#6b7280;}
  .sh-tbl{width:100%; border-collapse:collapse; font-size:13px;}
  .sh-tbl th{font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); text-align:left; padding:6px 8px; border-bottom:1px solid var(--line);}
  .sh-tbl td{padding:8px; border-bottom:1px solid #f0f1f4;} .sh-tbl td.r, .sh-tbl th.r{text-align:right;}
  .sh-note{color:var(--muted); font-size:12px; line-height:1.55; margin-top:8px;}
  .sh-warn{background:#fff7e0; border:1px solid #f1dc9a; color:#8a5a00; border-radius:12px; padding:10px 14px; font-size:13px; font-weight:600; margin-bottom:8px;}
  .sh-empty{padding:40px 16px; text-align:center; color:var(--muted); font-size:13px;}
</style>
<style>
/* === MOBILE PASS v1 === */
@media (max-width:820px){ .sh-pill, .sh-pill.ok{font-size:12px;} }
/* === END MOBILE PASS v1 === */
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><h1>System health</h1></div>
    <div class="content sh">
      <div id="alertBox"></div>
      <div class="sh-top"><span class="sh-sum" id="shSum" hidden></span><span class="sp"></span><span class="sub" id="shAt"></span><button class="btn secondary" id="shRefresh" type="button" style="width:auto;">↻ Check again</button></div>
      <div id="shBody"><div class="sh-empty">Checking…</div></div>
    </div>
  </main>
</div>
<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=9"></script>
<script src="assets/js/layout.js?v=20"></script>
<script>
  guardPage();
  renderSidebar('system_health');
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pill = (cls, t) => `<span class="sh-pill ${cls}">${esc(t)}</span>`;
  const row = (k, v) => `<div class="sh-row"><span>${esc(k)}</span><b>${v}</b></div>`;
  const ago = (m) => m == null ? 'not seen yet' : (m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago');

  function draw(d) {
    let bad = 0, warn = 0;
    const cards = [];
    // menu + build
    const lay = d.layout || {};
    const layCls = !lay.found ? 'warn' : (lay.ok ? 'ok' : 'bad');
    if (layCls === 'bad') bad++; else if (layCls === 'warn') warn++;
    cards.push(`<div class="card sh-card"><h3><i class="sh-dot ${layCls}"></i>Menu and backend version</h3>
      ${row('Backend (api.php)', esc(d.build || '—'))}
      ${row('Oldest menu file it accepts', esc(d.layout_min || '—'))}
      ${row('Menu file on the server (layout.js)', lay.found ? esc(lay.build || 'unknown') + ' ' + pill(lay.ok ? 'ok' : 'bad', lay.ok ? 'matches' : 'too old') : pill('na', 'not found next to the backend'))}
      <div class="sh-note">If the menu file is too old, upload the newest <b>assets/js/layout.js</b>, then press Ctrl+F5 once on each device.</div></div>`);
    // server
    const s = d.server || {}, ext = s.ext || {}, missExt = Object.keys(ext).filter((k) => !ext[k]);
    const sCls = missExt.length ? 'warn' : 'ok'; if (missExt.length) warn++;
    cards.push(`<div class="card sh-card"><h3><i class="sh-dot ${sCls}"></i>Server</h3>
      ${row('PHP', esc(s.php))}${row('Time zone', esc(s.timezone))}${row('Server time', esc(d.now))}
      ${row('Upload limit (one file)', esc(s.upload_max_filesize))}${row('Post limit (whole request)', esc(s.post_max_size))}${row('Memory per request', esc(s.memory_limit))}${row('Longest run', esc(s.max_execution_time) + ' s')}
      ${s.disk_free_mb != null ? row('Disk free', Number(s.disk_free_mb).toLocaleString('en-IN') + ' MB') : ''}
      ${row('PHP parts', Object.keys(ext).map((k) => `${pill(ext[k] ? 'ok' : 'bad', k)}`).join(' '))}</div>`);
    // database
    const db = d.db || {}; const dCls = db.ok ? 'ok' : 'bad'; if (!db.ok) bad++;
    cards.push(`<div class="card sh-card"><h3><i class="sh-dot ${dCls}"></i>Database</h3>
      ${row('Connected', db.ok ? pill('ok', 'yes') : pill('bad', 'no'))}${row('Name', esc(db.name || '—'))}${row('Tables', Number(db.tables || 0).toLocaleString('en-IN'))}${row('Total size', esc(db.size_mb) + ' MB')}
      ${(db.biggest || []).length ? `<div class="sh-note"><b>Biggest tables</b></div><table class="sh-tbl"><tbody>${db.biggest.map((t) => `<tr><td>${esc(t.table)}</td><td class="r">${Number(t.rows).toLocaleString('en-IN')} rows</td><td class="r">${esc(t.mb)} MB</td></tr>`).join('')}</tbody></table>` : ''}</div>`);
    // files
    const files = d.files || [], miss = files.filter((f) => !f.ok), fo = d.folders || [], badFo = fo.filter((f) => !f.exists || !f.writable);
    const fCls = miss.length ? 'bad' : (badFo.length ? 'warn' : 'ok'); if (miss.length) bad++; else if (badFo.length) warn++;
    cards.push(`<div class="card sh-card"><h3><i class="sh-dot ${fCls}"></i>Files next to api.php</h3>
      ${files.map((f) => row(f.file + ' — ' + f.what, pill(f.ok ? 'ok' : 'bad', f.ok ? 'there' : 'missing'))).join('')}
      ${fo.map((f) => row('Folder ' + f.name, !f.exists ? pill('warn', 'not created yet') : (f.writable ? pill('ok', 'writable') : pill('bad', 'not writable')))).join('')}</div>`);
    // jobs
    const jobs = d.jobs || [];
    const jr = jobs.map((j) => { let c = 'ok', t = 'on time'; if (j.mins == null) { c = 'na'; t = 'not seen yet'; } else if (j.mins > j.limit) { c = 'warn'; t = 'late'; } return `<tr><td>${esc(j.job)}</td><td>${j.at ? esc(j.at.slice(5, 16)) + ' · ' + esc(ago(j.mins)) : '—'}</td><td class="r">${pill(c, t)}</td></tr>`; });
    const lateN = jobs.filter((j) => j.mins != null && j.mins > j.limit).length; warn += lateN ? 1 : 0;
    const jCls = lateN ? 'warn' : 'ok';
    const jobCard = `<div class="card sh-card" style="grid-column:1/-1;"><h3><i class="sh-dot ${jCls}"></i>Automatic jobs</h3>
      <table class="sh-tbl"><thead><tr><th>Job</th><th>Last ran</th><th class="r">State</th></tr></thead><tbody>${jr.join('')}</tbody></table>
      <div class="sh-note">There is no scheduled job on this server: each one runs when somebody opens a page. A job that is "late" or "not seen yet" in the middle of the night is normal. During working hours it means nobody opened a page, or that job is switched off${d.boss_mode ? ' (Boss Engine mode: ' + esc(d.boss_mode) + ')' : ''}.</div></div>`;
    let h = (d.warnings || []).map((w) => `<div class="sh-warn">⚠ ${esc(w)}</div>`).join('');
    if ((d.warnings || []).length) warn++;
    h += `<div class="sh-grid">${cards.join('')}${jobCard}</div>`;
    $('shBody').innerHTML = h;
    const sum = $('shSum'); sum.hidden = false;
    if (bad) { sum.className = 'sh-sum bad'; sum.textContent = bad + ' thing' + (bad === 1 ? '' : 's') + ' to fix'; }
    else if (warn) { sum.className = 'sh-sum warn'; sum.textContent = warn + ' thing' + (warn === 1 ? '' : 's') + ' to look at'; }
    else { sum.className = 'sh-sum ok'; sum.textContent = 'All good'; }
    $('shAt').textContent = 'Checked ' + d.now.slice(11, 16);
  }

  async function load() {
    $('shRefresh').disabled = true;
    try { const d = await api.get('health.get'); $('alertBox').innerHTML = ''; draw(d); }
    catch (e) { $('shBody').innerHTML = ''; $('alertBox').innerHTML = `<div class="alert error">${esc(e.message)}${/Unknown|404|Not Found/i.test(e.message) ? ' — upload health.php next to api.php.' : ''}</div>`; }
    finally { $('shRefresh').disabled = false; }
  }
  $('shRefresh').addEventListener('click', load);
  load();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>

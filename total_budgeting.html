/* ===== Theme v2: compact, softly shaded, consistent ===== */
#tb{--tb-ink:#111827; --tb-mut:#6b7280; --tb-line:#e6eaee; --tb-acc:#ea580c; --tb-card:linear-gradient(180deg,#fff,#fafbfa); --tb-sh:0 1px 2px rgba(16,24,40,.05),0 8px 20px -12px rgba(16,24,40,.22);}
#tb .tabs{gap:4px; border-bottom:0; margin-bottom:10px; padding:4px; background:linear-gradient(180deg,#f3f5f4,#eef1ef); border-radius:14px; box-shadow:inset 0 1px 2px rgba(16,24,40,.06); align-items:center;}
#tb .tabs button{font-size:12px; padding:6px 12px; border:0; border-radius:10px; color:var(--tb-mut); transition:background .15s,color .15s,box-shadow .15s;}
#tb .tabs button:hover{background:rgba(255,255,255,.7); color:var(--tb-ink);}
#tb .tabs button.on{background:#fff; color:var(--tb-ink); box-shadow:0 1px 2px rgba(16,24,40,.12),0 4px 10px -6px rgba(234,88,12,.5); border-bottom-color:transparent;}
#tb .tabs button.csvb{font-size:11px; padding:4px 10px; background:#fff; border:1px solid var(--tb-line); color:var(--tb-mut);} #tb .tabs button.csvb:hover{border-color:var(--tb-acc); color:var(--tb-acc);}
#tb .kpis{border:0; background:transparent; gap:8px; margin-bottom:10px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
#tb .kpi{background:var(--tb-card); border:1px solid var(--tb-line); border-radius:12px; padding:8px 11px; box-shadow:var(--tb-sh); border-right:1px solid var(--tb-line);}
#tb .kpi:last-child{border-right:1px solid var(--tb-line);}
#tb .kpi span{font-size:10px; letter-spacing:.07em;} #tb .kpi b{font-size:17px; letter-spacing:-.01em;} #tb .kpi em{font-size:10.5px;}

<script>
(function () {
  guardPage();
  /* ?embed=store or ?embed=retail: the same Store / Retail Wholesale view of Total Budgeting, shown inside the Store and Retail pages (same data, so a change here shows there and the other way round) */
  const EMB = (() => { try { const v = new URLSearchParams(location.search).get('embed'); return v === 'store' || v === 'retail' ? v : ''; } catch (e) { return ''; } })();
  if (EMB) document.body.classList.add('emb');

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const f = (n) => Math.round(Number(n) || 0).toLocaleString('en-IN');
  const rs = (n) => '₹' + f(n);
  const lakh = (n) => '₹' + ((Number(n) || 0) / 100000).toLocaleString('en-IN', { maximumFractionDigits: 2 }) + ' L';
  const nk = (s) => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
  const pad = (n) => String(n).padStart(2, '0');
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const PAYDAYS = 30;                                   // salary and fixed expenses are split by 30, the same as the Salary page

  const S = { salMode: (() => { try { return localStorage.getItem('tb_salmode') === 'page' ? 'page' : 'flat'; } catch (e) { return 'flat'; } })(), log: null, bAll: false, dayDate: '', xq: '', nc: false, bd: '', bp: '', bq: '', bn: 300, bills: null, billsFor: '', mm: false, sel: new Set(), tg: 'dept', q: '', msg: '', msgBad: false, tab: EMB || (() => { try { const t = new URLSearchParams(location.search).get('tab'); return ['budget', 'emps', 'retail', 'store', 'lead', 'pen', 'team', 'ex'].indexOf(t) > -1 ? t : 'budget'; } catch (e) { return 'budget'; } })(), emp: 'comm', ea: 'pay', eg: 'all', lead: 'fin', M: null, warn: [], edit: null };
  const ymd = (y, m, d) => y + '-' + pad(m) + '-' + pad(d);
  const addDay = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
  const wdOf = (iso) => WD[new Date(iso + 'T12:00:00').getDay()];

  /* ---------- load everything from the pages that already exist ---------- */
  async function load() {
    const month = $('mon').value || new Date().toISOString().slice(0, 7);
    const [Y, Mo] = month.split('-').map(Number), dim = new Date(Y, Mo, 0).getDate();
    const from = month + '-01', last = ymd(Y, Mo, dim);
    const clientToday = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
    const prev = (() => { const d = new Date(Y, Mo - 2, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); })();
    const shownDay = clientToday.slice(0, 7) === month ? clientToday : (clientToday > last ? last : from);   // last day of the month to read (any past month works)
    const daysBack = Number(shownDay.slice(8));
    // the first load shows "Loading…"; a RELOAD after a save keeps the page as it is (the "Loading" box made the page short, so the scroll jumped to the top) and puts the scroll back

    const R = await Promise.allSettled([
      api.get('lr.get', { date_from: from, date_to: last < clientToday ? last : clientToday }),
      api.get('bd.b2_cm_recount', { days: daysBack, end: shownDay }),
      api.get('employees.list'),
      api.get('penalties.list', { month, status: 'applied' }),
      api.get('penalties.list', { month: prev, status: 'applied' }),
      api.get('budget.get', { month }),
      api.get('departments.list'),
      api.get('budget.store_comm', { date_from: from, date_to: last < clientToday ? last : clientToday }),
      api.get('budget.retail', { date_from: from, date_to: last < clientToday ? last : clientToday }),
      api.get('employees.list', { status: 'ex' }),
      api.get('budget.timing'),
      api.get('budget.helpers', { month }),
      S.salMode === 'page' ? api.get('budget.salary_days', { month }) : Promise.resolve(null),

    const ok = (i) => R[i].status === 'fulfilled' ? R[i].value : null;
    const why = (i) => R[i].status === 'rejected' ? (R[i].reason && R[i].reason.message || 'failed') : '';
    const warn = [];
    if (!ok(0)) warn.push('Leaders could not be read (' + why(0) + '). Leaders show as 0.');
    if (!ok(1)) warn.push('Commission could not be read (' + why(1) + '). It needs the Admin login. Commission shows as 0.');
    if (!ok(2)) warn.push('The employee list could not be read (' + why(2) + ').');
    if (!ok(3)) warn.push('Penalties could not be read (' + why(3) + ').');

    if (!ok(6)) warn.push('The department list could not be read (' + why(6) + '). Total Employees groups by the departments it finds on people.');
    if (!ok(7)) warn.push('Store commission could not be read (' + why(7) + '). Store commission shows as 0.');

    // team rows: sales-department employees + everybody who has commission
    const empAll = ((ok(2) || {}).employees || []).filter(e => e.status !== 'ex');
    const byName = {}; empAll.forEach(e => { byName[nk(e.full_name)] = e; });
    // who is a leader: the names on the Leaders rule are nicknames ("Dipti Madam", "Ayaz Bhai"), so match them to an employee: linked by hand first, then the full name, then the
    // name without Madam / Bhai / Ba / Sir that fits exactly ONE employee (a sales one first). Anything unclear stays "not linked" and can be linked on the Leaders tab.
    const lmap = ((ok(5) || {}).leader_map) || {}, HON = /^(madam|mam|maam|sir|bhai|bhaiya|ji|ba|bhabhi|didi|ben|behen|saheb|sahab|shri)$/;
    const toks = (t) => nk(t).replace(/[^a-z\u0900-\u097f ]/g, ' ').split(' ').filter(Boolean).map(w => (w.length > 4 && /(ba|bhai)$/.test(w)) ? w.replace(/(bhai|ba)$/, '') : w).filter(w => !HON.test(w));
    const empById = {}; empAll.forEach(e => { empById[Number(e.employee_id)] = e; });
    const linkOf = (name) => {
      if (lmap[name] && empById[Number(lmap[name])]) return Number(lmap[name]);
      if (byName[nk(name)]) return Number(byName[nk(name)].employee_id);
      const t = toks(name); if (!t.length) return 0;
      let c = empAll.filter(e => { const w = toks(e.full_name); return t.every(x => w.some(y => y === x || y.startsWith(x))); });
      if (c.length > 1) c = c.filter(e => /sales/i.test(e.department_name || ''));
      return c.length === 1 ? Number(c[0].employee_id) : 0;
    };
    const leadNames = (lr.rules || {}).leaders || [], leadIds = {}; leadNames.forEach(n => { const id = linkOf(n); if (id) leadIds[id] = n; });
    const rows = {}, add = (name, e) => { const k = e ? 'e' + e.employee_id : 'n' + nk(name); if (!rows[k]) rows[k] = { key: k, name: e ? e.full_name : name, empId: e ? Number(e.employee_id) : 0, role: e ? String(e.designation || '') : '', joined: e ? String(e.joining_date || '').slice(0, 10) : '', photo: e ? (e.photo || '') : '', dept: e ? String(e.department_name || '') : '', monthly: e ? Number(e.monthly_salary) || 0 : 0, inTeam: false, comm: {}, scomm: {}, rs: {}, pen: {}, why: {} }; return rows[k]; };
    const pplOv = ((ok(5) || {}).people) || {}, ovOf = (id) => pplOv[id] || {}, retailRx = /wholesale|retailer|dealer|retail field/i;
    const offline = (id, txt) => ovOf(id).grp ? ['store', 'retail'].indexOf(ovOf(id).grp) >= 0 : retailRx.test(txt || '');   // assigned to Retail or Store here (or a retail wholesale person by name): paid by their own rule, no online commission, no target
    empAll.forEach(e => { const r = add(e.full_name, e); if (/sales/i.test(r.dept) && !offline(r.empId, r.dept + ' ' + r.role)) r.inTeam = true; });          // every employee is a row; the sales ones are also the Sales Employees list
    (cm.people || []).forEach(p => { const e = byName[nk(p.name)]; const r = add(p.name, e); r.inTeam = true; (p.perday || []).forEach(x => { r.comm[x.day] = (r.comm[x.day] || 0) + (Number(x.new) || 0); }); });
    const byEmp = {}; Object.values(rows).forEach(r => { if (r.empId) byEmp[r.empId] = r; });
    [ok(3), ok(4)].forEach(p => ((p || {}).rows || []).forEach(x => { const r = byEmp[Number(x.employee_id)]; if (!r) return; r.pen[x.penalty_date] = (r.pen[x.penalty_date] || 0) + Number(x.amount || 0); r.why[x.penalty_date] = (r.why[x.penalty_date] ? r.why[x.penalty_date] + '; ' : '') + (x.title || x.category || 'Penalty'); }));
    const all = Object.values(rows).sort((a, b) => a.name.localeCompare(b.name));
    // group: a leader is paid by the leader commission, so their fixed salary on the employee card is NOT counted (no double pay)
    all.forEach(r => { const og = ovOf(r.empId); r.rpct = og.rpct == null || og.rpct === '' ? null : Number(og.rpct); r.sc = og.sc === 0 ? 0 : 1; r.np = !!og.np; r.rtarget = og.rtarget == null || og.rtarget === '' ? null : Number(og.rtarget); r.ok = !!og.ok; r.okBy = og.ok_by || '', r.okAt = og.ok_at || ''; r.leader = !!leadIds[r.empId]; if (r.leader || r.np) { r.inTeam = false; r.comm = {}; r.scomm = {}; } r.guess = /wholesale|retailer|dealer|retail field/i.test(r.dept + ' ' + r.role) ? 'retail' : r.inTeam ? 'sales' : /store|retail|shop|counter|showroom/i.test(r.dept + ' ' + r.role) ? 'store' : 'other'; r.grp = r.leader ? 'leader' : og.grp ? og.grp : r.guess; r.perDay = !r.leader && !r.np && r.monthly > 0 ? r.monthly / PAYDAYS : 0;
      r.hist = (og.hist || []).slice().sort((a, b) => String(a.from).localeCompare(String(b.from))); });
    // Leaders Helper people: paid by the work done (their own payout), not by a salary on the card: a line of their own
    const helperMap = {}; ((ok(11) || {}).helpers || []).forEach(h => { helperMap[Number(h.employee_id)] = h; });
    all.forEach(r => { const h = helperMap[r.empId]; if (h) { r.helper = true; r.leader = true; r.hpay = h.perday || {}; r.grp = 'helper'; r.inTeam = false; r.comm = {}; r.scomm = {}; r.perDay = 0; } });
    /* the pay rule of a person ON A DAY: the latest dated setup that started on or before it (the first one counts from the start); with no dated setup the current rule is used for every day */
    const ruleAt = (r, d) => {
      let e = null; for (const x of (r.hist || [])) if (String(x.from) <= d) e = x;
      const g = e ? { grp: e.grp || r.guess, np: !!e.np, monthly: Number(e.monthly) || 0, rpct: e.rpct == null || e.rpct === '' ? null : Number(e.rpct), rtarget: e.rtarget == null || e.rtarget === '' ? null : Number(e.rtarget), sc: e.sc === 0 ? 0 : 1 } : { grp: r.grp, np: r.np, monthly: r.monthly, rpct: r.rpct, rtarget: r.rtarget, sc: r.sc };
      if (r.leader) g.grp = r.helper ? 'helper' : 'leader'; g.perDay = !r.leader && !g.np && g.monthly > 0 && !(r.joined && d < r.joined) ? g.monthly / PAYDAYS : 0; return g;   // a salary counts only from the day they joined
    };
    all.forEach(r => { r.at = {}; days.forEach(d => { r.at[d] = ruleAt(r, d); if (r.at[d].np) { delete r.comm[d]; } }); });
    // store commission: same price-by-ML chart as online, but a store has no sales limit, so no over-target extra. People in the Sales department already get their store bills inside the online commission, so they are skipped here (never counted twice).
    const byEmpAll = {}; all.forEach(r => { if (r.empId) byEmpAll[r.empId] = r; });
    const daysMap = (ok(5) || {}).days || {};
    all.forEach(r => { Object.keys(daysMap).forEach(d => { if ((daysMap[d] || {})[r.empId]) delete r.comm[d]; }); });   // the day moved to the store: no online commission
    ((ok(7) || {}).people || []).forEach(p => { const r = byEmpAll[Number(p.employee_id)]; if (!r || r.leader || r.sc === 0 || r.grp === 'retail') return;   // retail wholesale is paid salary + collections %, never the store / online rules
       (p.perday || []).forEach(x => { if (r.inTeam && ((daysMap[x.day] || {})[r.empId] !== 'store')) return; r.scomm[x.day] = (r.scomm[x.day] || 0) + (Number(x.commission) || 0); r.ssales = (r.ssales || 0) + (Number(x.sales) || 0); (r.ssd = r.ssd || {})[x.day] = (Number(x.sales) || 0); (r.sbd = r.sbd || {})[x.day] = (Number(x.bills) || 0); r.sbills = (r.sbills || 0) + (Number(x.bills) || 0); }); });
    // retail wholesale sales per person per day (the % is applied below, so it moves as you type it). Nothing else counts retail orders, so any non-leader who created them is paid on them here.
    ((ok(8) || {}).people || []).forEach(p => { const r = byEmpAll[Number(p.employee_id)]; if (!r || r.leader) return; (p.perday || []).forEach(x => { r.rs[x.day] = { billed: Number(x.billed) || 0, paid: Number(x.paid) || 0 }; }); });
    const team = all.filter(r => r.inTeam);

    const leaders = leadNames.map(n => { const id = linkOf(n), e = id ? empById[id] : null; return { name: n, photo: e ? (e.photo || '') : '', empId: id, full: e ? String(e.full_name) : '', role: e && e.designation ? String(e.designation) : 'Leader', fin: {}, sug: {}, set: {} }; });
    const lrRow = {}; (lr.rows || []).forEach(x => { lrRow[x.date] = x; leaders.forEach(l => { const s = (x.set || {})[l.name]; if (s) { l.fin[x.date] = Number(s.amount) || 0; l.set[x.date] = true; } else if (x.sug_amt != null) l.sug[x.date] = Number(x.sug_amt); }); });

    const bud = ok(5) || { target: 0, lump: 0, expenses: [], goals: {}, can_edit: false };
    const deptMap = {}; ((ok(6) || {}).departments || []).forEach(d => { deptMap[Number(d.department_id)] = String(d.department_name); });
    empAll.forEach(e => { const id = Number(e.department_id) || 0; if (id && !deptMap[id]) deptMap[id] = String(e.department_name || 'Department ' + id); });
    const depts = Object.keys(deptMap).map(id => ({ id: Number(id), name: deptMap[id] })).sort((a, b) => a.name.localeCompare(b.name));
    const people = empAll.map(e => ({ id: Number(e.employee_id), name: String(e.full_name || ''), code: String(e.employee_code || ''), role: String(e.designation || ''), deptId: Number(e.department_id) || 0, monthly: Number(e.monthly_salary) || 0, photo: e.photo || '', joined: String(e.joining_date || ''), pending: e.status && e.status !== 'approved' })).sort((a, b) => a.name.localeCompare(b.name));

  /* what needs fixing: worked out from the numbers above, then Claude writes it up in a few plain lines */
  function needs(F) {

    if (odd.length) n.push(['warn', odd.length + ' name' + (odd.length === 1 ? '' : 's') + ' in the commission result ' + (odd.length === 1 ? 'does' : 'do') + ' not match an employee (' + odd.slice(0, 3).map(r => r.name).join(', ') + '). Their penalties and salary cannot be counted until the names match.']);

    if (!F.exp) n.push(['warn', 'No fixed expenses are entered, so electricity, rent and the like are not in the budget.']);
    GK.forEach(k => { const x = F.L[k]; if (x.goal && x.proj > x.goal) n.push(['bad', GN[k] + ' is heading for ' + lakh(x.proj) + ' against a goal of ' + lakh(x.goal) + ': ' + lakh(x.proj - x.goal) + ' over. ' + (x.pen ? 'Penalties of ' + rs(x.pen) + ' are already taken off.' : '')]); });
    const rSales = M.all.reduce((a, r) => a + Object.values(r.rs || {}).reduce((b, x) => b + (x.billed || 0), 0), 0);

  tb.addEventListener('dragover', (e) => { const g = grpOf(e); if (!g || !dragId) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; tb.querySelectorAll('.over').forEach(x => { if (x !== g) x.classList.remove('over'); }); g.classList.add('over'); });
  tb.addEventListener('dragleave', (e) => { const g = grpOf(e); if (g && !g.contains(e.relatedTarget)) g.classList.remove('over'); });
  tb.addEventListener('drop', (e) => {
    const g = grpOf(e); if (!g || !dragId) return; e.preventDefault(); g.classList.remove('over');
    const ids = S.sel.has(dragId) ? [...S.sel] : [dragId]; dragId = 0; if (g.dataset.pgday) dayAssign(ids); else if (g.dataset.pg) regroup(ids, g.dataset.pg); else moveMany(ids, Number(g.dataset.dept));
  });
  tb.addEventListener('change', (e) => { if (e.target.id === 'dayPick') S.dayDate = e.target.value; });
  tb.addEventListener('input', (e) => { if (e.target.id === 'xq') { S.xq = e.target.value; const xb = $('exBox'); if (xb) xb.innerHTML = exBody(); return; } if (e.target.id === 'bq') { S.bq = e.target.value; S.bn = 300; const bx = $('billsBox'); if (bx) bx.innerHTML = billsInner(); return; } if (e.target.id !== 'teQ') return; S.q = e.target.value; $('teGroups').innerHTML = teamGroups(); });
  $('mon').value = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 7);
  $('mon').onchange = () => load().catch(err => { $('tb').innerHTML = '<div class="card"><div class="empty">' + esc(err.message) + '</div></div>'; });
  $('btnReload').onclick = () => $('mon').onchange();
  $('mon').onchange();
})();
</script>

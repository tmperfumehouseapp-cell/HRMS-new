<style>
#tb{max-width:1400px;}

#tb td.n[data-emp]{cursor:pointer;} #tb td.n[data-emp]:hover{text-decoration:underline; color:#1d4ed8;}

#tb .te-bar{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-bottom:12px;}

#tb .grp-h b{font-size:15px;} #tb .grp-h .cnt{background:var(--ink); color:#fff; border-radius:99px; padding:1px 9px; font-size:12px; font-weight:800;}
#tb .grp-h span{color:var(--muted); font-size:12px;}
#tb .strip{display:flex; flex-wrap:wrap; gap:14px 12px; padding-bottom:8px; min-height:92px; align-items:flex-start;}
#tb .st{width:78px; text-align:center; cursor:grab; user-select:none; -webkit-user-select:none;}
#tb .st:active{cursor:grabbing;} #tb .st.drag{opacity:.35;}
#tb .ring{width:64px; height:64px; margin:0 auto 4px; border-radius:50%; padding:3px; background:linear-gradient(45deg,#f59e0b,#ea580c,#db2777); position:relative;}
#tb .st.pend .ring{background:#cbd5e1;}
#tb .ring .av{position:relative; width:100%; height:100%; border-radius:50%; border:2.5px solid #fff; background:#e5e7eb; overflow:hidden; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; color:#fff;}
#tb .ring .av img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;}
#tb .st:hover .ring{transform:scale(1.06);} #tb .ring{transition:transform .12s;}
#tb .st .nm{font-size:11.5px; font-weight:600; line-height:1.2; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-word;}
#tb .st .rl{font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#tb .grp .none{color:var(--muted); font-size:12.5px; padding:22px 4px; border:1.5px dashed var(--line); border-radius:12px; flex:1; text-align:center;}
#tb .ov{color:#b3261e; font-weight:700;} #tb .un{color:#1d6b47; font-weight:700;}
#tb .lines input{font:inherit; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:2px 6px; height:22px; width:110px; text-align:right; background:#fffaf5;}
#tb .lines td,#tb .lines th{white-space:normal;} #tb .lines td:first-child{font-weight:600;}
#tb .lines tr.bad td{background:#fdf1ef;} #tb .lines tr.good td:last-child{background:#f1f8f4;}
#tb .lines small{display:block; color:var(--muted); font-weight:400; font-size:10.5px;}
#tb .dp{position:relative; display:inline-flex; width:20px; height:20px; border-radius:50%; overflow:hidden; margin-right:7px; vertical-align:-5px; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff; flex:none;}
#tb .dp img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
#tb tr.gap td{height:14px; padding:0; background:#e9ecef; border-right:0; position:static;}
#tb tr.sec td{background:#dbe8e0; font-weight:800; border-top:2px solid #b9c9bf;} #tb tr.sec td.n{background:#dbe8e0; font-weight:800;}
#tb .dock{position:sticky; bottom:0; z-index:20; background:#fff; border:1.5px solid var(--ink); border-radius:14px; padding:8px 10px; margin-top:12px; box-shadow:0 -8px 24px -12px rgba(0,0,0,.35); max-height:38vh; overflow:auto;}
#tb .dock-h{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; margin-bottom:6px;} #tb .dock-h b{font-size:13px;}
#tb .dock-h button{font:inherit; font-size:12px; font-weight:700; border:1px solid var(--line); background:#fff; border-radius:99px; padding:3px 12px; cursor:pointer;} #tb .dock-h button.on{background:var(--ink); color:#fff; border-color:var(--ink);}
#tb .dz{display:inline-flex; align-items:center; gap:6px; border:1.5px dashed #b8bfc7; border-radius:99px; padding:4px 11px; margin:0 6px 6px 0; font-size:12px; font-weight:600; cursor:pointer; background:#f8f9fb;}
#tb .dz i{font-style:normal; background:var(--ink); color:#fff; border-radius:99px; padding:0 7px; font-size:11px; font-weight:800;}
#tb .dz.over,#tb .dz:hover{border-color:#ea580c; background:#fff7ed;} #tb .dz.over{box-shadow:0 0 0 3px #fed7aa;}
#tb .st{position:relative;} #tb .st.sel .ring{box-shadow:0 0 0 3px #2563eb;} #tb .st.sel::after{content:'✓'; position:absolute; top:-2px; right:6px; background:#2563eb; color:#fff; border-radius:50%; width:18px; height:18px; font-size:12px; line-height:18px; font-weight:800;}
</style>

<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar">
      <div><h1>Total Budgeting</h1><div class="sub">Commission, leaders, salary ÷ 30, fixed expenses and penalties, day by day</div></div>
      <div style="display:flex; gap:10px; align-items:center;"><input type="month" id="mon" style="font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px;"><button class="btn secondary" id="btnReload" type="button">↻ Refresh</button></div>
    </div>
    <div class="content">
      <div id="tb"><div class="card"><div class="empty">Loading…</div></div></div>
    </div>
  </main>
</div>
<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=9"></script>
<script src="assets/js/layout.js?v=21"></script>
<script src="assets/js/person_card.js?v=pc3"></script>
<script>
(function () {
  guardPage();
  renderSidebar('commission');
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const f = (n) => Math.round(Number(n) || 0).toLocaleString('en-IN');
  const rs = (n) => '₹' + f(n);
  const lakh = (n) => '₹' + ((Number(n) || 0) / 100000).toLocaleString('en-IN', { maximumFractionDigits: 2 }) + ' L';
  const nk = (s) => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
  const pad = (n) => String(n).padStart(2, '0');
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const PAYDAYS = 30;                                   // salary and fixed expenses are split by 30, the same as the Salary page

  const S = { mm: false, sel: new Set(), tg: 'dept', q: '', msg: '', msgBad: false, tab: 'budget', emp: 'comm', ea: 'pay', eg: 'all', lead: 'fin', M: null, warn: [], edit: null };
  const ymd = (y, m, d) => y + '-' + pad(m) + '-' + pad(d);
  const addDay = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
  const wdOf = (iso) => WD[new Date(iso + 'T12:00:00').getDay()];

  /* ---------- load everything from the pages that already exist ---------- */
  async function load() {
    const month = $('mon').value || new Date().toISOString().slice(0, 7);
    const [Y, Mo] = month.split('-').map(Number), dim = new Date(Y, Mo, 0).getDate();
    const from = month + '-01', last = ymd(Y, Mo, dim);
    const clientToday = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
    const prev = (() => { const d = new Date(Y, Mo - 2, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); })();
    const shownDay = clientToday.slice(0, 7) === month ? clientToday : (clientToday > last ? last : from);   // last day of the month to read (any past month works)
    const daysBack = Number(shownDay.slice(8));
    $('tb').innerHTML = '<div class="card"><div class="empty">Loading the month…</div></div>';
    const R = await Promise.allSettled([
      api.get('lr.get', { date_from: from, date_to: last < clientToday ? last : clientToday }),
      api.get('bd.b2_cm_recount', { days: daysBack, end: shownDay }),
      api.get('employees.list'),
      api.get('penalties.list', { month, status: 'applied' }),
      api.get('penalties.list', { month: prev, status: 'applied' }),
      api.get('budget.get', { month }),
      api.get('departments.list'),
      api.get('st_team.month', { date_from: from, date_to: last < clientToday ? last : clientToday }),
      api.get('budget.retail', { date_from: from, date_to: last < clientToday ? last : clientToday }),
    ]);
    const ok = (i) => R[i].status === 'fulfilled' ? R[i].value : null;
    const why = (i) => R[i].status === 'rejected' ? (R[i].reason && R[i].reason.message || 'failed') : '';
    const warn = [];
    if (!ok(0)) warn.push('Leaders could not be read (' + why(0) + '). Leaders show as 0.');
    if (!ok(1)) warn.push('Commission could not be read (' + why(1) + '). It needs the Admin login. Commission shows as 0.');
    if (!ok(2)) warn.push('The employee list could not be read (' + why(2) + ').');
    if (!ok(3)) warn.push('Penalties could not be read (' + why(3) + ').');
    if (!ok(5)) warn.push('The budget numbers could not be read (' + why(5) + ').');
    if (!ok(6)) warn.push('The department list could not be read (' + why(6) + '). Total Employees groups by the departments it finds on people.');
    if (!ok(7)) warn.push('Store commission could not be read (' + why(7) + '). Store commission shows as 0.');
    if (!ok(8)) warn.push('Retail wholesale sales could not be read (' + why(8) + '). Retail commission shows as 0.');
    const lr = ok(0) || { rows: [], rules: { leaders: [] }, today: clientToday }, cm = ok(1) || { people: [] };
    const today = lr.today || clientToday;
    const shown = today.slice(0, 7) === month ? today : (today > last ? last : (today < from ? from : last));
    const days = []; for (let d = shown; d >= from; d = addDay(d, -1)) days.push(d);

    // team rows: sales-department employees + everybody who has commission
    const empAll = ((ok(2) || {}).employees || []).filter(e => e.status !== 'ex');
    const byName = {}; empAll.forEach(e => { byName[nk(e.full_name)] = e; });
    const leadSet = new Set(((lr.rules || {}).leaders || []).map(nk));
    const rows = {}, add = (name, e) => { const k = e ? 'e' + e.employee_id : 'n' + nk(name); if (!rows[k]) rows[k] = { key: k, name: e ? e.full_name : name, empId: e ? Number(e.employee_id) : 0, role: e ? String(e.designation || '') : '', photo: e ? (e.photo || '') : '', dept: e ? String(e.department_name || '') : '', monthly: e ? Number(e.monthly_salary) || 0 : 0, inTeam: false, comm: {}, scomm: {}, rs: {}, pen: {}, why: {} }; return rows[k]; };
    empAll.forEach(e => { const r = add(e.full_name, e); if (/sales/i.test(r.dept)) r.inTeam = true; });          // every employee is a row; the sales ones are also the Sales Employees list
    (cm.people || []).forEach(p => { const e = byName[nk(p.name)]; const r = add(p.name, e); r.inTeam = true; (p.perday || []).forEach(x => { r.comm[x.day] = (r.comm[x.day] || 0) + (Number(x.new) || 0); }); });
    const byEmp = {}; Object.values(rows).forEach(r => { if (r.empId) byEmp[r.empId] = r; });
    [ok(3), ok(4)].forEach(p => ((p || {}).rows || []).forEach(x => { const r = byEmp[Number(x.employee_id)]; if (!r) return; r.pen[x.penalty_date] = (r.pen[x.penalty_date] || 0) + Number(x.amount || 0); r.why[x.penalty_date] = (r.why[x.penalty_date] ? r.why[x.penalty_date] + '; ' : '') + (x.title || x.category || 'Penalty'); }));
    const all = Object.values(rows).sort((a, b) => a.name.localeCompare(b.name));
    // group: a leader is paid by the leader commission, so their fixed salary on the employee card is NOT counted (no double pay)
    all.forEach(r => { r.leader = leadSet.has(nk(r.name)); r.grp = r.leader ? 'leader' : /wholesale|retailer|dealer|retail field/i.test(r.dept + ' ' + r.role) ? 'retail' : r.inTeam ? 'sales' : /store|retail|shop|counter|showroom/i.test(r.dept + ' ' + r.role) ? 'store' : 'other'; r.perDay = !r.leader && r.monthly > 0 ? r.monthly / PAYDAYS : 0; });
    // store commission: same price-by-ML chart as online, but a store has no sales limit, so no over-target extra. People in the Sales department already get their store bills inside the online commission, so they are skipped here (never counted twice).
    const byEmpAll = {}; all.forEach(r => { if (r.empId) byEmpAll[r.empId] = r; });
    ((ok(7) || {}).people || []).forEach(p => { const r = byEmpAll[Number(p.employee_id)]; if (!r || r.inTeam || r.leader) return; (p.perday || []).forEach(x => { r.scomm[x.day] = (r.scomm[x.day] || 0) + (Number(x.commission) || 0); }); });
    // retail wholesale sales per person per day (the % is applied below, so it moves as you type it). Nothing else counts retail orders, so any non-leader who created them is paid on them here.
    ((ok(8) || {}).people || []).forEach(p => { const r = byEmpAll[Number(p.employee_id)]; if (!r || r.leader) return; (p.perday || []).forEach(x => { r.rs[x.day] = { billed: Number(x.billed) || 0, paid: Number(x.paid) || 0 }; }); });
    const team = all.filter(r => r.inTeam);

    const leaders = (lr.rules.leaders || []).map(n => ({ name: n, photo: byName[nk(n)] ? (byName[nk(n)].photo || '') : '', empId: byName[nk(n)] ? Number(byName[nk(n)].employee_id) : 0, role: byName[nk(n)] && byName[nk(n)].designation ? String(byName[nk(n)].designation) : 'Leader', fin: {}, sug: {}, set: {} }));
    const lrRow = {}; (lr.rows || []).forEach(x => { lrRow[x.date] = x; leaders.forEach(l => { const s = (x.set || {})[l.name]; if (s) { l.fin[x.date] = Number(s.amount) || 0; l.set[x.date] = true; } else if (x.sug_amt != null) l.sug[x.date] = Number(x.sug_amt); }); });

    const bud = ok(5) || { target: 0, lump: 0, expenses: [], goals: {}, can_edit: false };
    const deptMap = {}; ((ok(6) || {}).departments || []).forEach(d => { deptMap[Number(d.department_id)] = String(d.department_name); });
    empAll.forEach(e => { const id = Number(e.department_id) || 0; if (id && !deptMap[id]) deptMap[id] = String(e.department_name || 'Department ' + id); });
    const depts = Object.keys(deptMap).map(id => ({ id: Number(id), name: deptMap[id] })).sort((a, b) => a.name.localeCompare(b.name));
    const people = empAll.map(e => ({ id: Number(e.employee_id), name: String(e.full_name || ''), code: String(e.employee_code || ''), role: String(e.designation || ''), deptId: Number(e.department_id) || 0, monthly: Number(e.monthly_salary) || 0, photo: e.photo || '', joined: String(e.joining_date || ''), pending: e.status && e.status !== 'approved' })).sort((a, b) => a.name.localeCompare(b.name));
    S.M = { all, depts, people, month, from, last, dim, today, shown, days, team, leaders, lrRow, bud, roasKind: lr.rules };
    S.warn = warn; S.edit = JSON.parse(JSON.stringify({ target: bud.target, lump: bud.lump, expenses: bud.expenses, goals: Object.assign({ sales: 0, leader: 0, retail: 0, store: 0, other: 0 }, bud.goals || {}), retail: Object.assign({ pct: 0, basis: 'billed' }, bud.retail || {}) }));
    S.claudeFor = '';
    render(); askClaude();
  }

  /* ---------- the one set of numbers every tab reads ---------- */
  const penCut = (r, d) => r.pen[addDay(d, -1)] || 0;          // a penalty logged on a day is cut the next day
  const rc = (r, d) => { const x = r.rs && r.rs[d]; return x ? (x[S.edit.retail.basis === 'paid' ? 'paid' : 'billed'] || 0) * (Number(S.edit.retail.pct) || 0) / 100 : 0; };   // retail wholesale commission: the % on that day's retail sales
  const dayPay = (r, d) => (Number(d.slice(8)) <= PAYDAYS ? r.perDay : 0) + (r.comm[d] || 0) + (r.scomm[d] || 0) + rc(r, d) - penCut(r, d);
  const GK = ['sales', 'leader', 'retail', 'store', 'other'];
  const GL = { sales: 'Sales', leader: 'Leader', retail: 'Retail', store: 'Store', other: 'Other' };
  const GN = { sales: 'Sales team (commission + salary)', leader: 'Leaders', retail: 'Retail wholesale (commission + salary)', store: 'Store team (commission + salary)', other: 'Other employees salary' };
  function figures() {
    const M = S.M, exp = (S.edit.expenses || []).reduce((a, x) => a + (Number(x.amount) || 0), 0), by = {};
    const tot = { leaders: 0, comm: 0, scomm: 0, rcomm: 0, salary: 0, fixed: 0, pen: 0 };
    const L = {}; GK.forEach(k => { L[k] = { gross: 0, pen: 0, fix: 0, fixFull: M.all.filter(r => r.grp === k).reduce((a, r) => a + r.perDay * PAYDAYS, 0), pend: M.all.filter(r => r.grp === k).reduce((a, r) => a + (r.pen[M.today] || 0), 0) }; });
    M.days.forEach(d => {
      const inPay = Number(d.slice(8)) <= PAYDAYS, g = {}; GK.forEach(k => { g[k] = { gross: 0, pen: 0 }; });
      const lead = M.leaders.reduce((a, l) => a + (l.fin[d] || 0), 0); g.leader.gross += lead;
      M.all.forEach(r => { const x = g[r.grp], c = r.comm[d] || 0, sal = inPay ? r.perDay : 0; x.gross += c + sal; g.store.gross += r.scomm[d] || 0; g.retail.gross += rc(r, d); x.pen += penCut(r, d); L[r.grp].fix += sal; });
      const b = { leaders: lead, comm: M.all.reduce((a, r) => a + (r.comm[d] || 0), 0), scomm: M.all.reduce((a, r) => a + (r.scomm[d] || 0), 0), rcomm: M.all.reduce((a, r) => a + rc(r, d), 0), salary: inPay ? M.all.reduce((a, r) => a + r.perDay, 0) : 0, fixed: inPay ? exp / PAYDAYS : 0, pen: M.all.reduce((a, r) => a + penCut(r, d), 0), g };
      b.net = b.leaders + b.comm + b.scomm + b.rcomm + b.salary + b.fixed - b.pen; by[d] = b; Object.keys(tot).forEach(k => { tot[k] += b[k]; });
      GK.forEach(k => { L[k].gross += g[k].gross; L[k].pen += g[k].pen; });
    });
    const spent = tot.leaders + tot.comm + tot.scomm + tot.rcomm + tot.salary + tot.fixed - tot.pen, elapsed = Math.min(M.days.length, PAYDAYS);
    const projected = elapsed ? spent / elapsed * PAYDAYS : 0;
    const showPend = S.M.today.slice(0, 7) === S.M.month;
    GK.forEach(k => {
      const x = L[k]; x.goal = Number((S.edit.goals || {})[k]) || 0; x.net = x.gross - x.pen; x.variable = x.gross - x.fix;
      x.official = x.fixFull + (elapsed ? x.variable / elapsed * PAYDAYS : 0);          // the full month before any penalty: fixed salaries + variable pay at today's pace
      x.pendCut = showPend ? x.pend : 0;                                                  // logged today, cut tomorrow
      x.proj = x.official - x.pen - x.pendCut;                                           // projected month end after penalties
      x.plan = x.goal * elapsed / PAYDAYS; x.gap = x.net - x.plan; x.projGap = x.proj - x.goal;

  }

  /* ---------- views ---------- */
  const thd = (d) => { const t = d === S.M.today; const y = d === addDay(S.M.today, -1); return '<th class="' + (t ? 'tod' : '') + '" title="' + d + '">' + Number(d.slice(8)) + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(d.slice(5, 7)) - 1] + '<small>' + (t ? 'Today' : y ? 'Yest.' : wdOf(d)) + '</small></th>'; };
  const dp = (x) => { const u = photoUrl(x.photo), n = String(x.name || '?').trim(); return '<span class="dp" style="background:hsl(' + hue(n) + ',45%,48%)">' + esc((n[0] || '?').toUpperCase()) + (u ? '<img src="' + esc(u) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '</span>'; };
  const grid = (head, rows, foot) => '<div class="sheet" tabindex="0"><table><thead><tr><th class="i">#</th><th class="n">Name</th><th>Role</th>' + head + S.M.days.map(thd).join('') + '</tr></thead><tbody>' + rows + '</tbody><tfoot>' + foot + '</tfoot></table></div>';
  const tc = (d) => d === S.M.today ? 'tod' : '';

  function empView(all) {
    const M = S.M, key = all ? 'ea' : 'emp', m = S[key], D = M.days;
    const val = (r, d) => m === 'comm' ? (r.comm[d] || 0) + (r.scomm[d] || 0) + rc(r, d) : m === 'pen' ? (r.pen[d] || 0) : dayPay(r, d);
    const cell = (r, d) => {
      const v = val(r, d);

    };

    // "All" is cut into spaced sections: the sales leaders first, then the sales team, then retail wholesale, store and the rest, each with its own subtotal
    const secs = all && S.eg === 'all' ? [

      ['Retail wholesale', list.filter(r => r.grp === 'retail')], ['Store', list.filter(r => r.grp === 'store')], ['Other employees', list.filter(r => r.grp === 'other')]].filter(x => x[1].length) : null;
    const subt = (title, rs2) => '<tr class="sec"><td class="i"></td><td class="n">' + esc(title) + ' · ' + rs2.length + '</td><td></td><td>' + f(rs2.reduce((a, r) => a + (r.leader ? 0 : r.monthly), 0)) + '</td><td>' + f(rs2.reduce((a, r) => a + r.perDay, 0)) + '</td><td>' + f(rs2.reduce((a, r) => a + tot(r), 0)) + '</td>' + D.map(d => '<td>' + f(rs2.reduce((a, r) => a + val(r, d), 0)) + '</td>').join('') + '</tr>';
    let n0 = 0;
    const body = secs ? secs.map(x => '<tr class="gap"><td colspan="60"></td></tr>' + subt(x[0], x[1]) + x[1].map(r => rowH(r, n0++)).join('')).join('')

    const foot = '<tr><td class="i"></td><td class="n">' + (secs ? 'All sections' : 'Total') + ' · ' + list.length + '</td><td></td><td>' + f(list.reduce((a, r) => a + (r.leader ? 0 : r.monthly), 0)) + '</td><td>' + f(list.reduce((a, r) => a + r.perDay, 0)) + '</td><td>' + f(list.reduce((a, r) => a + tot(r), 0)) + '</td>' + D.map(d => '<td>' + f(list.reduce((a, r) => a + val(r, d), 0)) + '</td>').join('') + '</tr>';

    const modes = [['pay', 'Day pay'], ['comm', 'Commission'], ['pen', 'Penalty']];
    const grp = all ? '<div class="seg">' + [['all', 'All']].concat(GK.map(k => [k, GL[k]])).map(x => '<button data-s="eg" data-v="' + x[0] + '" class="' + (S.eg === x[0] ? 'on' : '') + '">' + x[1] + ' (' + (x[0] === 'all' ? M.all.length : M.all.filter(r => r.grp === x[0]).length) + ')</button>').join('') + '</div>' : '';

  function leadView() {

      if (m === 'roas') { const x = M.lrRow[d]; return '<td class="' + tc(d) + '">' + (x && x.roas != null ? x.roas.toFixed(2) : '–') + '</td>'; }
      if (m === 'fin') return l.set[d] ? '<td class="' + tc(d) + '">' + f(l.fin[d]) + '</td>' : '<td class="z ' + tc(d) + '" title="' + (l.sug[d] != null ? 'Not set yet. Suggested ' + f(l.sug[d]) + ' (not counted)' : 'No data') + '">–</td>';

  }

  function penView() {

  function chart(F) {
    const M = S.M, W = 640, H = 170, L = 38, Bm = 20, T = 8, allow = S.edit.target / PAYDAYS;
    const days = [...M.days].reverse(), vals = days.map(d => F.by[d].net), max = Math.max(allow, ...vals, 1) * 1.12, bw = (W - L - 8) / Math.max(1, days.length);
    const y = (v) => T + (H - T - Bm) * (1 - v / max);
    const bars = days.map((d, i) => { const x = L + i * bw + bw * .18; return '<rect x="' + x.toFixed(1) + '" y="' + y(vals[i]).toFixed(1) + '" width="' + (bw * .64).toFixed(1) + '" height="' + Math.max(0, y(0) - y(vals[i])).toFixed(1) + '" fill="' + (allow && vals[i] > allow ? '#b3261e' : '#1d6b47') + '"><title>' + d + ': ' + rs(vals[i]) + '</title></rect><text x="' + (x + bw * .32).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + Number(d.slice(8)) + '</text>'; }).join('');

  /* what needs fixing: worked out from the numbers above, then Claude writes it up in a few plain lines */
  function needs(F) {
    const M = S.M, E = S.edit, n = [];
    if (!E.target) n.push(['warn', 'No target is set for ' + M.month + '. Type it in the box below and Save.']);
    else if (F.projected > E.target) n.push(['bad', 'On this pace the month ends at ' + lakh(F.projected) + ', which is ' + lakh(F.projected - E.target) + ' over the ' + lakh(E.target) + ' target. Cut spending or raise the target.']);
    const unsetDays = Object.values(M.lrRow).filter(x => x.date < M.today && x.sug_amt != null && M.leaders.some(l => !l.set[x.date])).length;
    if (unsetDays) n.push(['warn', 'Leader commission is not set on ' + unsetDays + ' past day' + (unsetDays === 1 ? '' : 's') + '. Those days count as 0 until you Set them on the Leaders tab.']);
    const odd = M.all.filter(r => !r.empId && Object.keys(r.comm).length);
    if (odd.length) n.push(['warn', odd.length + ' name' + (odd.length === 1 ? '' : 's') + ' in the commission result ' + (odd.length === 1 ? 'does' : 'do') + ' not match an employee (' + odd.slice(0, 3).map(r => r.name).join(', ') + '). Their penalties and salary cannot be counted until the names match.']);
    const pend = M.all.reduce((a, r) => a + (r.pen[M.today] || 0), 0);
    if (pend) n.push(['warn', rs(pend) + ' of penalties logged today will be cut tomorrow.']);
    if (!F.exp) n.push(['warn', 'No fixed expenses are entered, so electricity, rent and the like are not in the budget.']);
    GK.forEach(k => { const x = F.L[k]; if (x.goal && x.proj > x.goal) n.push(['bad', GN[k] + ' is heading for ' + lakh(x.proj) + ' against a goal of ' + lakh(x.goal) + ': ' + lakh(x.proj - x.goal) + ' over. ' + (x.pen ? 'Penalties of ' + rs(x.pen) + ' are already taken off.' : '')]); });
    const rSales = M.all.reduce((a, r) => a + Object.values(r.rs || {}).reduce((b, x) => b + (x.billed || 0), 0), 0);
    if (rSales > 0 && !(Number(E.retail.pct) > 0)) n.push(['warn', 'Retail wholesale sold ' + rs(rSales) + ' this month, but the retail commission % is not set, so it earns no commission. Set it in the box on the right and Save.']);
    if (!GK.some(k => F.L[k].goal)) n.push(['warn', 'No goal is set for the sales team, leaders, store or other salaries. Type them in "Budget by line" and Save to see who runs over.']);
    S.warn.forEach(w => n.push(['bad', w]));
    return n;
  }
  function claudeFacts(F) {
    const M = S.M, E = S.edit; return { month: M.month, days_elapsed: F.elapsed, target: E.target, lump_sum: E.lump, spent_so_far: Math.round(F.spent), projected_month_end: Math.round(F.projected), over_target_by: E.target ? Math.round(F.projected - E.target) : null,
      today: F.by[M.today] ? { net: Math.round(F.by[M.today].net) } : null, month_totals: Object.fromEntries(Object.entries(F.tot).map(([k, v]) => [k, Math.round(v)])), fixed_expenses_monthly: Math.round(F.exp), lines: Object.fromEntries(GK.map(k => [GN[k], { goal: Math.round(F.L[k].goal), official_month: Math.round(F.L[k].official), penalties_cut: Math.round(F.L[k].pen), spent_net: Math.round(F.L[k].net), projected_month_end: Math.round(F.L[k].proj) }])),
      problems: needs(F).map(x => x[1]) };
  }
  async function askClaude() {
    if (S.claudeFor === S.M.month + '|' + S.M.today) return; S.claudeFor = S.M.month + '|' + S.M.today; S.claude = '';

  }

  /* Budget by line: the goal you set, the official pay, the penalties taken off, and whether the month is heading over or under */
  function linesView(F) {
    const M = S.M, E = S.edit, ed = M.bud.can_edit, g = (k, v) => ed ? '<input data-goal="' + k + '" value="' + esc(v || '') + '" inputmode="decimal" placeholder="Set goal">' : (v ? rs(v) : '–');

  const tb = $('tb'), grpOf = (e) => e.target.closest && e.target.closest('[data-dept]');
  tb.addEventListener('dragstart', (e) => { const st = e.target.closest && e.target.closest('.st[data-emp]'); if (!st) return; dragId = Number(st.dataset.emp); st.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(dragId)); } catch (x) {} });
  tb.addEventListener('dragend', () => { dragId = 0; tb.querySelectorAll('.drag,.over').forEach(x => x.classList.remove('drag', 'over')); });
  tb.addEventListener('dragover', (e) => { const g = grpOf(e); if (!g || !dragId) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; tb.querySelectorAll('.over').forEach(x => { if (x !== g) x.classList.remove('over'); }); g.classList.add('over'); });
  tb.addEventListener('dragleave', (e) => { const g = grpOf(e); if (g && !g.contains(e.relatedTarget)) g.classList.remove('over'); });
  tb.addEventListener('drop', (e) => {
    const g = grpOf(e); if (!g || !dragId) return; e.preventDefault(); g.classList.remove('over');
    const ids = S.sel.has(dragId) ? [...S.sel] : [dragId]; dragId = 0; moveMany(ids, Number(g.dataset.dept));
  });
  tb.addEventListener('input', (e) => { if (e.target.id !== 'teQ') return; S.q = e.target.value; $('teGroups').innerHTML = teamGroups(); });
  $('mon').value = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 7);
  $('mon').onchange = () => load().catch(err => { $('tb').innerHTML = '<div class="card"><div class="empty">' + esc(err.message) + '</div></div>'; });
  $('btnReload').onclick = () => $('mon').onchange();
  $('mon').onchange();
})();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<title>Commission — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<link rel="stylesheet" href="assets/css/boss.css?v=1">
<link rel="stylesheet" href="assets/css/boss2.css?v=t7">
<style>
.cm-tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.cm-tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 18px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.cm-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cm-need{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;margin-bottom:8px;font-size:13.5px;line-height:1.45;background:#fff7e6;border:1px solid #f5d79a}
.cm-need.bad{background:#fdecec;border-color:#f3b6b3}.cm-need.info{background:#eef4ff;border-color:#c5d8fb}
.cm-need a{margin-left:auto;white-space:nowrap;font-weight:700;color:inherit}
.cm-t{width:100%;border-collapse:collapse;font-size:13px}
.cm-t th{text-align:right;color:#6a7280;font-weight:700;padding:6px 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.cm-t td{text-align:right;padding:8px;border-top:1px solid var(--line);white-space:nowrap}
.cm-t th:first-child,.cm-t td:first-child{text-align:left}
.cm-t td.pos{color:#16945a;font-weight:700}.cm-t td.neg{color:#d9423b;font-weight:700}
.cm-t input{width:78px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;font:inherit;text-align:right}
.cm-t input.ml{width:64px}
.cm-sc{overflow-x:auto}
.cm-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.cm-g label{display:block;font-size:12px;font-weight:700;color:#6a7280;margin-bottom:4px}
.cm-g input,.cm-g select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:12px;font:inherit}
.cm-ppl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.cm-ppl label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12.5px;cursor:pointer;margin:0;color:inherit;font-weight:600}
.cm-ln td{font-size:12px;color:#555;background:#fafbfc}
.cm-note{font-size:12.5px;color:#6a7280;margin:6px 0}
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><div><h1>Commission</h1><div class="bd-sub">Result, Pricing and Offers. Preview only: nothing here pays or changes the old pages until you switch it on.</div></div></div>
    <div class="content"><div class="bd">
      <div class="cm-tabs" id="tabs"></div>
      <div id="root"><div class="bd-empty">Loading…</div></div>
    </div></div>
  </main>
</div>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/api.js?v=9"></script>
<script src="assets/js/layout.js?v=20"></script>
<script src="assets/js/boss_common.js?v=3"></script>
<script src="assets/js/b2_common.js?v=t7"></script>
<script>
  guardPage();
  renderSidebar('boss_engine');
  const { esc, $, toast, inr } = BD;
  const COLS = [7, 6.5, 6, 5, 4, 3];
  let D = null, TAB = (location.hash || '#result').slice(1), RC = null, OPEN = {};
  const today = () => new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10);
  const money = (n) => n == null ? '—' : inr(Math.round(n));
  const num = (n) => n == null ? '—' : Number(n).toLocaleString('en-IN');
  const card = (t, sub, body, right) => '<div class="bd-card"><div class="bd-h"><div><h2>' + t + '</h2>' + (sub ? '<div class="bd-sub">' + sub + '</div>' : '') + '</div>' + (right || '') + '</div>' + body + '</div>';
  const diffTd = (d) => d == null ? '<td>—</td>' : '<td class="' + (d > 0 ? 'pos' : d < 0 ? 'neg' : '') + '">' + (d > 0 ? '+' : '') + money(d) + '</td>';

  async function load(day) {
    try { D = await B2.get('bd.b2_cm_view', { day: day || (D && D.day) || '' }); } catch (e) { $('root').innerHTML = '<div class="bd-card"><div class="bd-empty"><b>Cannot open Commission</b>' + esc(e.message || '') + '</div></div>'; return; }
    render();
  }
  function tabs() {
    $('tabs').innerHTML = [['result', 'Result'], ['pricing', 'Pricing'], ['offers', 'Offers & boosts']].map((t) => '<button type="button" data-t="' + t[0] + '" class="' + (TAB === t[0] ? 'on' : '') + '">' + t[1] + '</button>').join('');
    $('tabs').querySelectorAll('button').forEach((b) => b.onclick = () => { TAB = b.dataset.t; location.hash = TAB; render(); });
  }
  function render() { tabs(); $('root').innerHTML = ({ result: rResult, pricing: rPricing, offers: rOffers }[TAB] || rResult)(); bind(); }

  /* ---------- RESULT ---------- */
  function rResult() {
    const needs = (D.needs || []).map((n) => '<div class="cm-need ' + n.sev + '"><span>' + (n.sev === 'bad' ? '⛔' : n.sev === 'info' ? 'ℹ️' : '⚠️') + '</span><span>' + esc(n.text) + '</span><a href="#' + n.tab + '" data-go="' + n.tab + '">Fix ›</a></div>').join('');
    let h = card('Needs fixing', 'What Claude found missing or odd. Fix these first.', needs || '<div class="bd-empty" style="padding:14px"><b>Nothing to fix</b>Prices, offers and targets look complete.</div>');
    const rows = (D.result.rows || []);
    const body = '<div class="cm-sc"><table class="cm-t"><thead><tr><th>Person</th><th>Target</th><th>Sales</th><th>%</th><th>Orders</th><th>Codes</th><th>Chart</th><th>Offer</th><th>Extra</th><th>New total</th><th>Old</th><th>Change</th></tr></thead><tbody>'
      + rows.map((r) => '<tr data-p="' + r.id + '"><td><b>' + esc(r.name) + '</b>' + (r.boost ? ' <span class="bd-chip">' + esc(r.boost) + '</span>' : '') + '</td><td>' + money(r.target) + '</td><td>' + money(r.sales) + '</td><td>' + (r.pct == null ? '—' : r.pct + '%') + '</td><td>' + r.orders + '</td>'
        + '<td>' + r.codes + (r.code_pct == null ? '' : ' (' + r.code_pct + '%)') + (r.orders ? (r.code_ok ? ' ✓' : ' <span title="Below the code limit: orders without a code pay half">½</span>') : '') + '</td>'
        + '<td>' + money(r.chart_com) + '</td><td>' + money(r.offer_com) + '</td><td>' + (r.bonus ? '+' + r.bonus + '% = ' + money(r.extra) : '—') + '</td><td><b>' + money(r.total) + '</b></td><td>' + money(r.old) + '</td>' + diffTd(r.diff) + '</tr>'
        + (OPEN[r.id] ? '<tr class="cm-ln"><td colspan="12">' + (r.lines.length ? r.lines.map((l) => esc(l.order || '') + ' · ' + l.ml + ' ml · ₹' + num(l.price) + ' · ' + esc(l.rule) + ' ' + (l.pct ? l.pct + '%' : '') + (l.code ? '' : ' (no code)') + ' → ' + money(l.com)).join('<br>') : 'No orders.') + '</td></tr>' : '')).join('')
      + '</tbody></table></div>' + (rows.length ? '<div class="cm-note">Click a name to see every order. Prepaid orders are counted at the price before the 2% discount. “Old” is what the current commission page works out for the same day.</div>' : '<div class="bd-empty"><b>No sales people or orders for this day</b></div>');
    h += card('Day result', 'Targets, sales and commission by the new rules.', body, '<input type="date" id="cmDay" class="bd-in" style="width:auto" value="' + esc(D.day) + '" max="' + today() + '">');
    h += card('Recount the last 10 days', 'Shows targets, best day and the new commission next to the old one. Nothing is changed.',
      RC ? rcHtml() : '<button class="bd-btn pri" id="cmRc" type="button">Recount last 10 days</button>');
    return h;
  }
  function rcHtml() {
    if (RC.error) return '<div class="cm-need bad">' + esc(RC.error) + '</div>';
    const t = RC.people.reduce((a, p) => { a.n += p.new; a.o += (p.old || 0); return a; }, { n: 0, o: 0 });
    return '<div class="bd-sub">' + esc(RC.from) + ' to ' + esc(RC.to) + '</div><div class="cm-sc"><table class="cm-t"><thead><tr><th>Person</th><th>Days</th><th>Target met</th><th>Best day</th><th>Old</th><th>New</th><th>Change</th></tr></thead><tbody>'
      + RC.people.map((p) => '<tr><td><b>' + esc(p.name) + '</b></td><td>' + p.days + '</td><td>' + p.met + ' of ' + p.days + '</td><td>' + (p.best_pct == null ? '—' : p.best_pct + '% (' + esc((p.best_day || '').slice(5)) + ')') + '</td><td>' + money(p.old) + '</td><td><b>' + money(p.new) + '</b></td>' + diffTd(p.diff) + '</tr>').join('')
      + '<tr><td><b>Total</b></td><td></td><td></td><td></td><td>' + money(t.o) + '</td><td><b>' + money(t.n) + '</b></td>' + diffTd(t.n - t.o) + '</tr></tbody></table></div>'
      + '<div class="cm-note">Hand-typed commissions are never touched. This is a preview: nothing has been applied. Tell Claude “apply” once the figures look right.</div><button class="bd-btn sm" id="cmRc" type="button">Recount again</button>';
  }

  /* ---------- PRICING ---------- */
  function rPricing() {
    const c = D.chart;
    const rows = c.rows.map((r, i) => '<tr data-i="' + i + '"><td><input class="ml" data-k="ml" value="' + r.ml + '"> ml</td>' + r.p.map((v, j) => '<td><input data-j="' + j + '" value="' + (v || '') + '" inputmode="decimal"></td>').join('') + '<td><button class="bd-btn sm bad" data-del="' + i + '" type="button">✕</button></td></tr>').join('');
    const tiers = (c.tiers || []).concat([[0, 0], [0, 0], [0, 0]]).slice(0, Math.max(3, (c.tiers || []).length));
    let h = card('Price → commission %, ML by ML', 'Type the selling price for each % column. An order pays the % of the nearest price column: at or above the midpoint of two prices = the higher %, below it = the lower %. Above the 7% price = 7%, below the 3% price = ' + c.floor + '%.',
      '<div class="cm-sc"><table class="cm-t" id="cmTbl"><thead><tr><th>ML</th>' + COLS.map((x) => '<th>' + x + '% price</th>').join('') + '<th></th></tr></thead><tbody>' + rows + '</tbody></table></div><div style="margin-top:10px"><button class="bd-btn sm" id="cmAddRow" type="button">+ Add ML row</button></div>');
    h += card('Rules', '', '<div class="cm-g">'
      + '<div><label>Floor % (below the 3% price)</label><input id="cmFloor" value="' + c.floor + '"></div>'
      + '<div><label>Code limit (share of orders with a code)</label><select id="cmCode">' + [60, 70, 80].map((x) => '<option value="' + x + '"' + (Number(c.codepct) === x ? ' selected' : '') + '>' + x + '%</option>').join('') + '</select></div>'
      + '<div><label>Below the limit, an order without a code pays</label><input id="cmNo" value="' + c.nocode + '"></div>'
      + '<div><label>Prepaid discount (company’s cost) %</label><input id="cmPre" value="' + c.prepaid + '"></div></div>'
      + '<div class="cm-note">At or above the code limit every order of that day pays full. Below it, orders without a code pay the share above (50 = half).</div>'
      + '<h3 style="margin:16px 0 4px;font-size:14px">Over target: extra commission</h3><div class="cm-note">Sales over target by … → extra % on the chart commission. Highest step reached wins. Maximum below.</div>'
      + '<div class="cm-g" id="cmTiers">' + tiers.map((t, i) => '<div><label>Step ' + (i + 1) + ': over target by % → extra %</label><div style="display:flex;gap:6px"><input data-t="' + i + '" data-s="0" value="' + (t[0] || '') + '" placeholder="over %"><input data-t="' + i + '" data-s="1" value="' + (t[1] || '') + '" placeholder="extra %"></div></div>').join('')
      + '<div><label>Maximum extra %</label><input id="cmMax" value="' + c.bonus_max + '"></div></div>'
      + '<label style="display:flex;gap:8px;align-items:center;margin:16px 0 8px;font-weight:700"><input type="checkbox" id="cmRev"' + (c.reviewed ? ' checked' : '') + '> I checked these prices</label>'
      + '<button class="bd-btn pri" id="cmSave" type="button">Save pricing</button>');
    return h;
  }

  /* ---------- OFFERS & BOOSTS ---------- */
  function rOffers() {
    const t = today(), nm = {}; (D.people || []).forEach((p) => nm[p.id] = p.name);
    const st = (o) => !Number(o.active) ? ['Stopped', ''] : o.to_date && o.to_date < t ? ['Ended', ''] : o.from_date > t ? ['Starts ' + o.from_date, 'info'] : ['Running', 'ok'];
    let h = card('Add an offer', 'An offer overrules the pricing chart. An order of that ML sold within ₹20 above or below the offer price pays the offer %. No offer matches = the chart applies.',
      '<div class="cm-g"><div><label>ML</label><input id="oMl" inputmode="numeric"></div><div><label>Offer price ₹</label><input id="oPrice" inputmode="decimal"></div><div><label>Commission %</label><input id="oPct" inputmode="decimal"></div><div><label>From</label><input type="date" id="oFrom" value="' + t + '"></div><div><label>To (blank = until stopped)</label><input type="date" id="oTo"></div></div><div style="margin-top:12px"><button class="bd-btn pri" id="oAdd" type="button">Add offer</button></div>');
    h += card('Offers', '', (D.offers || []).length ? '<div class="cm-sc"><table class="cm-t"><thead><tr><th>ML</th><th>Price</th><th>Window</th><th>%</th><th>From</th><th>To</th><th>Status</th><th></th></tr></thead><tbody>' + D.offers.map((o) => { const s = st(o); return '<tr><td>' + o.ml + ' ml</td><td>' + money(Number(o.price)) + '</td><td>' + money(Number(o.price) - 20) + ' – ' + money(Number(o.price) + 20) + '</td><td>' + Number(o.pct) + '%</td><td>' + esc(o.from_date) + '</td><td>' + esc(o.to_date || '—') + '</td><td><span class="bd-chip ' + s[1] + '">' + s[0] + '</span></td><td>' + (s[0] === 'Running' || s[0].indexOf('Starts') === 0 ? '<button class="bd-btn sm bad" data-os="' + o.id + '" type="button">Stop</button>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="bd-empty"><b>No offers yet</b></div>');
    h += card('Add a boost (bigger over-target extra)', 'For a few days: instead of the normal steps, sales over target pay the steps you type here (example: over by 10% → 30% extra, 20% → 40%, 40% → 70%). It runs for everyone or only the people you tick, and closes at 10:00 the morning after its end date.',
      '<div class="cm-g"><div><label>Name</label><input id="bName" placeholder="Diwali push"></div><div><label>From</label><input type="date" id="bFrom" value="' + t + '"></div><div><label>To (closes 10:00 next morning)</label><input type="date" id="bTo" value="' + t + '"></div><div><label>Applies to</label><select id="bScope"><option value="all">Everyone</option><option value="people">Chosen people</option></select></div></div>'
      + '<div class="cm-g" style="margin-top:12px" id="bTiers">' + [[10, 30], [20, 40], [40, 70]].map((x, i) => '<div><label>Step ' + (i + 1) + ': over target by % → extra %</label><div style="display:flex;gap:6px"><input data-t="' + i + '" data-s="0" value="' + x[0] + '"><input data-t="' + i + '" data-s="1" value="' + x[1] + '"></div></div>').join('') + '</div>'
      + '<div class="cm-ppl" id="bPpl" style="display:none">' + (D.people || []).map((p) => '<label><input type="checkbox" value="' + p.id + '"> ' + esc(p.name) + '</label>').join('') + '</div>'
      + '<div style="margin-top:12px"><button class="bd-btn pri" id="bAdd2" type="button">Add boost</button></div>');
    h += card('Boosts', '', (D.boosts || []).length ? '<div class="cm-sc"><table class="cm-t"><thead><tr><th>Name</th><th>Steps</th><th>For</th><th>From</th><th>Closes</th><th>Status</th><th></th></tr></thead><tbody>' + D.boosts.map((b) => { const run = Number(b.active) && b.from_date <= t && t <= b.to_date, nowT = new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 16).replace('T', ' '), live = Number(b.active) && b.from_date <= t && nowT < b.ends_at; return '<tr><td><b>' + esc(b.name) + '</b></td><td>' + b.tiers.map((x) => '+' + x[0] + '% → ' + x[1] + '%').join(' · ') + '</td><td>' + (b.scope === 'all' ? 'Everyone' : b.emp_ids.map((i) => esc(nm[i] || i)).join(', ')) + '</td><td>' + esc(b.from_date) + '</td><td>' + esc(b.ends_at) + '</td><td><span class="bd-chip ' + (live ? 'ok' : '') + '">' + (!Number(b.active) ? 'Stopped' : live ? 'Running' : b.from_date > t ? 'Starts ' + b.from_date : 'Ended') + '</span></td><td>' + (live ? '<button class="bd-btn sm bad" data-bs="' + b.id + '" type="button">Stop</button>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="bd-empty"><b>No boosts yet</b></div>');
    return h;
  }

  /* ---------- wiring ---------- */
  const val = (id) => ($(id) || {}).value;
  const tiersFrom = (sel) => { const t = []; document.querySelectorAll(sel + ' [data-t]').forEach((i) => { const k = Number(i.dataset.t); t[k] = t[k] || [0, 0]; t[k][Number(i.dataset.s)] = parseFloat(i.value) || 0; }); return t.filter((x) => x && x[0] > 0 && x[1] > 0); };
  const act = async (a, body, ok) => { try { const r = await B2.post(a, body); toast(r.message || ok || 'Saved.'); await load(); } catch (e) { B2.fail(e); } };
  function bind() {
    document.querySelectorAll('[data-go]').forEach((a) => a.onclick = (e) => { e.preventDefault(); TAB = a.dataset.go; location.hash = TAB; render(); });
    if ($('cmDay')) $('cmDay').onchange = (e) => load(e.target.value);
    if ($('cmRc')) $('cmRc').onclick = async () => { $('cmRc').disabled = true; $('cmRc').textContent = 'Counting…'; try { RC = await B2.get('bd.b2_cm_recount', { days: 10 }); } catch (e) { RC = { error: e.message || 'Could not recount.', people: [] }; } render(); };
    document.querySelectorAll('tr[data-p]').forEach((r) => r.onclick = () => { OPEN[r.dataset.p] = !OPEN[r.dataset.p]; render(); });
    if ($('cmAddRow')) $('cmAddRow').onclick = () => { D.chart.rows = readRows(); D.chart.rows.push({ ml: 0, p: [0, 0, 0, 0, 0, 0] }); render(); };
    document.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { D.chart.rows = readRows(); D.chart.rows.splice(Number(b.dataset.del), 1); render(); });
    if ($('cmSave')) $('cmSave').onclick = () => act('bd.b2_cm_chart_save', { rows: readRows(), floor: val('cmFloor'), codepct: val('cmCode'), nocode: val('cmNo'), prepaid: val('cmPre'), bonus_max: val('cmMax'), tiers: tiersFrom('#cmTiers'), reviewed: $('cmRev').checked ? 1 : 0 }, 'Pricing saved.');
    if ($('oAdd')) $('oAdd').onclick = () => act('bd.b2_cm_offer_add', { ml: val('oMl'), price: val('oPrice'), pct: val('oPct'), from_date: val('oFrom'), to_date: val('oTo') });
    document.querySelectorAll('[data-os]').forEach((b) => b.onclick = () => act('bd.b2_cm_offer_stop', { id: Number(b.dataset.os) }));
    if ($('bScope')) $('bScope').onchange = () => { $('bPpl').style.display = val('bScope') === 'people' ? 'flex' : 'none'; };
    if ($('bAdd2')) $('bAdd2').onclick = () => act('bd.b2_cm_boost_add', { name: val('bName'), from_date: val('bFrom'), to_date: val('bTo'), scope: val('bScope'), emp_ids: [].map.call(document.querySelectorAll('#bPpl input:checked'), (i) => Number(i.value)), tiers: tiersFrom('#bTiers') });
    document.querySelectorAll('[data-bs]').forEach((b) => b.onclick = () => act('bd.b2_cm_boost_stop', { id: Number(b.dataset.bs) }));
  }
  function readRows() {
    const out = []; document.querySelectorAll('#cmTbl tbody tr').forEach((tr) => { const ml = parseInt(tr.querySelector('[data-k=ml]').value, 10) || 0; const p = [0, 0, 0, 0, 0, 0]; tr.querySelectorAll('[data-j]').forEach((i) => p[Number(i.dataset.j)] = parseFloat(i.value) || 0); out.push({ ml, p }); });
    return out;
  }
  load();
</script>
</body>
</html>

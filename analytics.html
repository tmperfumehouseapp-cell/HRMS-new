<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HRMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Analytics — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
  .sa-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .sa-top .sp{flex:1;}
  .sa-top .btn{width:auto; padding:7px 14px; min-height:0; font-size:12.5px;}
  .sa-frame{position:relative; background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; height:calc(100vh - 150px); min-height:480px;}
  .sa-frame iframe{display:block; width:100%; height:100%; border:0;}
  .sa-load{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; background:#fff;}
  @media (max-width:820px){ .sa-frame{height:calc(100vh - 170px); border-radius:12px;} }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar sa-top">
      <div><h1>Analytics</h1><div class="sub" style="font-size:12.5px; color:var(--muted); margin-top:2px;">Daily store report</div></div>
      <span class="sp"></span>
      <button type="button" class="btn secondary" id="saReload">↻ Reload</button>
    </div>
    <div class="content">
      <div class="sa-frame"><div class="sa-load" id="saLoad">Loading the report…</div>
        <iframe id="saFrame" title="Analytics report" referrerpolicy="no-referrer" loading="eager"></iframe></div>
    </div>
  </main>
</div>
<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=13"></script>
<script src="assets/js/layout.js?v=31"></script>
<script>
  guardPage();
  // Who may open this: Admin, or a role Admin ticked "Analytics" for on the Roles page. The server decides — it only hands out the report link to them.
  let SA_ME = {}; try { SA_ME = JSON.parse(localStorage.getItem('hrms_user') || '{}'); } catch (e) { SA_ME = {}; }
  renderSidebar('analytics');
  let SA_URL = '';
  const fr = document.getElementById('saFrame'), ld = document.getElementById('saLoad');
  fr.onload = () => { ld.style.display = 'none'; };
  async function saLoad() {
    try { const d = await api.get('analytics.url'); SA_URL = d.url; fr.src = SA_URL; }
    catch (e) { ld.style.display = 'flex'; ld.innerHTML = '<div style="text-align:center;padding:20px"><b>' + String(e.message).replace(/[<>&]/g, '') + '</b><br><span style="font-size:12px">Ask Admin to tick "Analytics" for your role on the Roles page.</span></div>'; }
  }
  // The report is another site inside a frame and takes a few seconds. It starts AFTER this page has finished loading, so the page itself opens at once and shows "Loading the report…".
  if (document.readyState === 'complete') saLoad(); else window.addEventListener('load', () => setTimeout(saLoad, 0));
  document.getElementById('saReload').onclick = () => { if (!SA_URL) { saLoad(); return; } ld.style.display = 'flex'; fr.src = SA_URL + '&_=' + Date.now(); };
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>

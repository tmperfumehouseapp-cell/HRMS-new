<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>What's new — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
  .wn{padding:6px 14px 40px;max-width:900px;margin:0 auto;display:grid;gap:14px}
  .wn .cd{background:var(--card,#fff);border:1px solid var(--line,#e5e7eb);border-radius:16px;padding:16px}
  .wn h2{margin:0 0 10px;font-size:16px}.wn .it{padding:10px 0;border-top:1px solid var(--line,#edf0f4)}.wn .it:first-of-type{border-top:0}
  .wn .it b{font-size:14.5px}.wn .it p{margin:4px 0;font-size:13px;line-height:1.5;color:var(--text,#374151)}
  .wn .wh{display:inline-block;background:#e5efff;color:#1d4ed8;border-radius:8px;padding:2px 9px;font-weight:700;font-size:11.5px}
  .wn .dt{color:var(--muted,#6b7280);font-size:12px;margin-left:6px}.wn .who{background:#fff3d6;color:#8a5a00;border-radius:8px;padding:2px 9px;font-weight:700;font-size:11.5px}
  .wn input{padding:8px 10px;border:1px solid var(--line,#d1d5db);border-radius:10px;font:inherit;width:100%;box-sizing:border-box;background:#fff;color:#111}
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><h1>🆕 What's new</h1></div>
    <div class="content wn" id="wn"><div class="cd">Loading…</div></div>
  </main>
</div>
<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=13"></script>
<script src="assets/js/layout.js?v=34"></script>
<script>
  guardPage();
  renderSidebar('whats_new');
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fd = (d) => { const t = new Date(d + 'T12:00:00'); return isNaN(t) ? d : t.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); };
  let D = null;
  function draw() {
    const q = (document.getElementById('wnQ') ? document.getElementById('wnQ').value : '').toLowerCase();
    const hit = (x) => !q || JSON.stringify(x).toLowerCase().includes(q);
    const items = (D.items || []).filter(hit), issues = (D.issues || []).filter(hit);
    document.getElementById('wn').innerHTML = '<input id="wnQ" placeholder="Search what changed…" value="' + esc(q) + '">'
      + '<div class="cd"><h2>⚠ Open issues <span class="dt">' + issues.length + '</span></h2>' + (issues.map((x) => '<div class="it"><b>' + esc(x.title) + '</b> <span class="who">' + esc(x.who || '') + '</span><p>' + esc(x.detail) + '</p></div>').join('') || '<div class="dt">Nothing open.</div>') + '</div>'
      + '<div class="cd"><h2>✨ What changed <span class="dt">updated ' + esc(fd(D.updated || '')) + '</span></h2>' + (items.map((x) => '<div class="it"><b>' + esc(x.title) + '</b><span class="dt">' + esc(fd(x.date)) + '</span><p>' + esc(x.detail) + '</p><span class="wh">📍 ' + esc(x.where) + '</span></div>').join('') || '<div class="dt">Nothing found.</div>') + '</div>';
    const i = document.getElementById('wnQ'); i.oninput = () => { draw(); const n = document.getElementById('wnQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  }
  fetch('whats_new.json?t=' + Date.now()).then((r) => { if (!r.ok) throw new Error('The list could not be loaded.'); return r.json(); }).then((d) => { D = d; draw(); }).catch((e) => { document.getElementById('wn').innerHTML = '<div class="cd">' + esc(e.message) + '</div>'; });
</script>
</body>
</html>

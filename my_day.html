<style>
  .md{max-width:620px;margin:0 auto;padding:0 4px 30px;}
  .md *{box-sizing:border-box;}
  .md-hero{position:relative;overflow:hidden;border-radius:30px;padding:22px 22px 70px;color:#fff;background:linear-gradient(135deg,#e85d04,#f48c06);box-shadow:0 14px 30px -16px rgba(232,93,4,.7);}
  .md-hero:after{content:"";position:absolute;right:-60px;top:-70px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.12);}
  .md-hero .g{font-size:14px;opacity:.92;} .md-hero h1{margin:2px 0 4px;font-size:30px;font-weight:800;letter-spacing:-.02em;color:#fff;} .md-hero .sub{font-size:13px;opacity:.92;line-height:1.4;max-width:70%;}
  .md-av{position:absolute;right:20px;top:20px;width:72px;height:72px;border-radius:22px;border:3px solid rgba(255,255,255,.85);background:#f6d7b8;overflow:hidden;z-index:2;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#a0480a;}
  .md-av img{width:100%;height:100%;object-fit:cover;display:block;}
  .md-chip{display:inline-block;margin-top:12px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:700;}
  .md-card{background:#fff;border-radius:26px;padding:18px 18px;margin-top:12px;box-shadow:0 1px 2px rgba(20,22,26,.04),0 8px 22px -14px rgba(20,22,26,.18);}
  .md-card.pull{margin-top:-52px;position:relative;z-index:3;}
  .md-lb{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:800;}
  .md-perf{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;text-align:center;}
  .md-perf b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1;} .md-perf small{display:block;font-size:11px;color:var(--muted);line-height:1.25;margin-top:3px;} .md-perf .g b{color:#16945a;} .md-perf .r b{color:#d9423b;}
  .md-h{font-size:17px;font-weight:800;margin:0 0 8px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .md-step{display:flex;gap:13px;padding:14px 0;border-top:1px solid #eef0f3;} .md-step:first-of-type{border-top:0;}
  .md-n{flex:none;width:30px;height:30px;border-radius:50%;background:#e6e8ec;color:#8a91a0;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .md-step.now .md-n{background:#f26a0e;color:#fff;} .md-step.done .md-n{background:#16945a;color:#fff;} .md-step.bad .md-n{background:#d9423b;color:#fff;}
  .md-step .t{font-weight:800;font-size:15.5px;} .md-step.lock .t{color:#9aa0ab;}
  .md-step .s{font-size:13px;color:#5b6270;line-height:1.45;margin-top:2px;}
  .md-step .a{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .md-bad{background:#fdeceb;color:#a02b25;border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin-top:8px;}
  .md-thumb{display:flex;gap:10px;align-items:center;margin-top:9px;flex-wrap:wrap;} .md-thumb img{width:78px;height:78px;object-fit:cover;border-radius:16px;background:#eceef1;}
  .md-go{display:block;width:100%;margin-top:12px;border:0;border-radius:22px;padding:17px;font-size:17px;font-weight:800;font-family:inherit;cursor:pointer;background:#111;color:#fff;} .md-go[disabled]{background:#c8ccd4;color:#fff;cursor:not-allowed;} .md-go.green{background:#16945a;}
  .md-miss{border:2px solid #f2c4c0;background:#fff;}
  .md-miss h3{margin:0 0 6px;color:#b3261e;font-size:19px;font-weight:800;}
  .md-pen{background:#fdeceb;border-radius:16px;padding:12px 14px;margin-top:10px;font-size:13.5px;line-height:1.5;color:#7d1f1a;}
  .md-item{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid #eceef1;border-radius:20px;padding:13px 15px;background:#fff;margin-top:8px;cursor:pointer;text-decoration:none;color:inherit;}
  .md-item .t{font-weight:700;font-size:14.5px;line-height:1.35;} .md-item .s{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .md-item.done{opacity:.6;} .md-item.late{border-color:#f2b33d;background:#fffaf0;}
  .md-tick{width:32px;height:32px;border-radius:50%;border:2px solid #cfd3da;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;} .md-item.done .md-tick{background:#16945a;border-color:#16945a;}
  .md-open{flex:none;font-size:12.5px;font-weight:800;color:#e85d04;}
  .md-sales .big{font-size:30px;font-weight:800;letter-spacing:-.02em;} .md-sales .bar{height:12px;border-radius:99px;background:#f1e4d8;overflow:hidden;margin:8px 0 6px;} .md-sales .bar i{display:block;height:100%;background:linear-gradient(90deg,#f48c06,#e85d04);border-radius:99px;}
  .md-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;} .md-two div{background:#f7f8fa;border-radius:16px;padding:11px 13px;} .md-two b{display:block;font-size:19px;font-weight:800;} .md-two small{font-size:11.5px;color:var(--muted);}
  .md-bonus{background:#fff6e5;border-radius:16px;padding:11px 13px;margin-top:10px;font-size:13px;line-height:1.45;color:#7a4c00;}
  .md-note{background:#eef3ff;color:#2456b3;border-radius:14px;padding:10px 13px;font-size:12.5px;margin-top:10px;line-height:1.45;}
  .md-pt{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #eef0f3;font-size:14px;align-items:center;flex-wrap:wrap;} .md-pt:first-of-type{border-top:0;}
  .md-ov{position:fixed;left:0;right:0;top:0;bottom:0;z-index:3000;background:#fff;display:flex;flex-direction:column;}
  .md-ov iframe{flex:1;border:0;width:100%;background:#fff;}
  .md-ovbar{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #eceef1;font-weight:800;font-size:15px;}
  .md-work{display:flex;align-items:center;justify-content:space-between;gap:12px;} .md-work b{font-size:26px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1;} .md-work small{color:var(--muted);font-size:12.5px;}
  .md-lock{background:#f1f2f4;color:#6b7280;border-radius:99px;padding:8px 14px;font-size:13.5px;font-weight:800;white-space:nowrap;}
  .md-lockbox{margin-top:12px;background:#fff8ea;border:1px solid #f1deb0;border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.45;} .md-lockl{margin:6px 0 2px;font-size:13.5px;} .md-lockl div{margin:2px 0;}
  .md-lockmsg{margin-top:10px;border-radius:12px;padding:9px 12px;font-size:13.5px;} .md-lockmsg.wait{background:#eaf2ff;color:#1e4fa3;} .md-lockmsg.bad{background:#fdeceb;color:#a3302a;}
  .md-out{border:0;border-radius:18px;padding:14px 18px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;background:#111;color:#fff;white-space:nowrap;}
  .md-wait{background:#fff6e5;color:#7a4c00;border-radius:18px;padding:13px 15px;margin-top:12px;font-size:13.5px;line-height:1.5;}
  .md-rec{padding-bottom:40px;} .md-rec .md-card{margin-top:18px;padding:16px 14px 14px;}
  .md-recp{display:flex;gap:7px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;} .md-recp::-webkit-scrollbar{display:none;}
  .md-recp button{flex:none;white-space:nowrap;font:inherit;font-size:13px;font-weight:800;padding:9px 16px;border-radius:999px;background:#fff;border:1px solid var(--line,#dfe3e8);color:#4a4f5c;cursor:pointer;} .md-recp button.on{background:linear-gradient(135deg,#111827,#1f2937);color:#fff;border-color:#111827;}
  .md-recf{position:relative;margin-top:8px;} .md-recf iframe{display:block;width:100%;border:0;background:transparent;height:calc(100vh - 150px);min-height:520px;} .md-recl[hidden]{display:none;} .md-recf iframe[hidden]{display:none;} .md-recl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;pointer-events:none;}
  @media (max-width:420px){.md-hero h1{font-size:26px;} .md-perf b{font-size:21px;}}
  /* phone sizes for every My Day card: assets/css/phone.css (html.ph) */
</style>

<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><div><h1>My Day</h1><div class="bd-sub" id="sub">&nbsp;</div></div><div id="mgr"></div></div>
    <div class="content"><div class="md" id="root"><div class="bd-empty">Loading…</div></div><div class="md md-rec" id="rec"></div></div>
  </main>
</div>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/api.js?v=9"></script>
<script src="assets/js/layout.js?v=22"></script>
<script src="assets/js/boss_common.js?v=3"></script>
<script src="assets/js/b2_common.js?v=t7"></script>
<script src="assets/js/b2_my.js?v=1"></script>
<script src="assets/js/of_place_ui.js?v=p2"></script>
<script src="assets/js/dino.js?v=12"></script>
<script>try { window.DINO = document.createElement("div"); DINO.id = "dinoHost"; if (window.TMDino) TMDino.mount(DINO); } catch (e) { window.DINO = null; /* the game is a bonus */ }</script>
<script>
  guardPage();
  renderSidebar('my_day');
  const { esc, $, toast, inr } = BD;
  let LH = null, SAL = null, ME = null, DP = null, BDD = null, PF = null, ATT = null, FLAGS = null, PO = null, stream = null, OPL = null;   // OPL = registered places (Pantry ...): one card per place, see assets/js/of_place_ui.js
  const PAGE = { dispatch: 'dept_dispatch.html', shops: 'dept_shops.html', supplies: 'dept_supplies.html', fix: 'dept_fix.html' };
  const j = (p) => p.catch(() => null);
  // Busy-hour safety: each read is retried once, and if it still fails the last good copy of it (kept in this tab) is shown instead of a blank card.
  const g = async (action) => {
    const k = 'myday:' + action, ask = () => api.get(action);
    let r = null;
    try { r = await ask(); } catch (e) { await new Promise((z) => setTimeout(z, 500 + Math.random() * 400)); try { r = await ask(); } catch (e2) { r = null; } }
    try { if (r) sessionStorage.setItem(k, JSON.stringify(r)); else { const c = sessionStorage.getItem(k); if (c) r = JSON.parse(c); } } catch (e) { /* no storage: fine */ }
    return r;
  };

  async function load() {
    try {
      const [me, dp, bdd, pf, att, fl, po, opl] = await Promise.all([g('dp.me'), g('dp.my_day'), g('bd.my_day'), g('proofs.my'), g('attendance.today'), g('me.flags'), g('dp.po_state'), g('of.pl_my_day')]);
      PO = po; OPL = opl && Array.isArray(opl.places) ? opl : null; ME = me; DP = dp || { items: [], done: [], penalties: [], mode: 'shadow' }; BDD = bdd || { tasks: [], penalties: [], week: { done: 0, missed: 0 }, mode: DP.mode }; PF = pf; ATT = att; FLAGS = fl || {};
      if (!ME) throw new Error('Your login is not linked to an employee.');
      render(); records();
      api.get('lh.mine').then((r) => { if (r && r.helper) { LH = r; render(); } }).catch(() => { /* not a Leaders Helper: no card */ });
      api.get('salary.detail').then((r) => { if (r && r.detail) { SAL = r.detail; render(); } }).catch(() => { /* commission-only staff have no monthly salary: no card */ });
      BD.who().then((b) => { if (b.manager) $('mgr').innerHTML = '<a class="bd-btn sm" href="boss_engine.html">Boss Engine</a>'; });
    } catch (e) { $('root').innerHTML = '<div class="bd-card"><div class="bd-empty"><b>Cannot open My Day</b>' + esc(e.message) + '</div></div>'; }
  }
  const hhmm = (t) => { const d = new Date(String(t).replace(' ', 'T')); return isNaN(d) ? '' : d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }); };
  const punchedIn = () => !!(ATT && ATT.attendance && ATT.attendance.punch_in) || !!(PF && PF.punched_in);
  const shiftStart = () => { const s = ATT && ATT.shift; return s && (s.shift_start || s.start || s.start_time) || ''; };

  /* ---------------- header + month ---------------- */
  function avatar() {
    if (ME.photo) { try { return '<img alt="" src="' + esc(api.buildUrl('files.view', { path: ME.photo, token: api.token() })) + '" onerror="this.remove()">'; } catch (e) {} }
    return esc((ME.first || '?').charAt(0).toUpperCase());
  }
  function hero() {
    const ss = shiftStart(), pin = punchedIn();
    const sm = ATT && ATT.shift ? (ATT.shift.mode || 'fixed') : 'fixed';
    const chip = pin ? 'Punched in ' + esc(ATT && ATT.attendance ? hhmm(ATT.attendance.punch_in) : '') : (sm === 'hours' ? (esc(String(ATT.shift.hours_target || 8)) + ' h a day · not punched in') : (sm === 'free' ? 'Not punched in' : 'Shift ' + esc(ss || '') + ' · not punched in'));
    return '<div class="md-hero"><div class="md-av">' + avatar() + '</div><div class="g">' + esc(ME.greeting) + ' 👋</div><h1>' + esc(ME.first) + '</h1><div class="sub">' + esc([ME.code, ME.designation].filter(Boolean).join(' · ')) + ' · ' + new Date().toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }) + '</div><span class="md-chip">' + chip + '</span></div>';
  }
  function perfCard() {
    return '<div class="md-card"><div class="md-lb">How you are doing this month</div><div class="md-perf">'
      + '<div class="' + (ME.on_time_punch == null ? '' : (ME.on_time_punch >= 90 ? 'g' : (ME.on_time_punch < 70 ? 'r' : ''))) + '"><b>' + (ME.on_time_punch == null ? '-' : ME.on_time_punch + '%') + '</b><small>on time, this month</small></div>'
      + '<div class="' + (ME.tasks_on_time == null ? '' : (ME.tasks_on_time >= 90 ? 'g' : (ME.tasks_on_time < 70 ? 'r' : ''))) + '"><b>' + (ME.tasks_on_time == null ? '-' : ME.tasks_on_time + '%') + '</b><small>tasks on time</small></div>'
      + '<div class="' + (ME.penalties_month > 0 ? 'r' : 'g') + '"><b>' + inr(ME.penalties_month) + '</b><small>penalties</small></div><div><b>' + ME.streak + '</b><small>days in a row</small></div></div></div>';
  }

  /* ---------------- punch gate ---------------- */
  function punchCard() {
    if (punchedIn() && !(PF && PF.redo)) return '';
    if (!PF || !PF.items || !PF.items.length) return punchedIn() ? '' : punchOnly(0);
    const items = PF.items; let firstOpen = items.findIndex((i) => !i.done);
    const total = items.length, left = items.filter((i) => !i.done).length;
    let h = '';
    if (DP.punch_missed && !punchedIn()) {
      const m = DP.punch_missed;
      h += '<div class="md-card md-miss"><h3>Punch in missed</h3><div style="font-size:14px;line-height:1.5">The steps were not finished ' + m.grace_min + ' minutes after your shift start. Today is marked <b>late, no punch in</b>. Your boss is told.</div>'
        + (m.pen_amount > 0 ? '<div class="md-pen"><b>Penalty ' + inr(m.pen_amount) + '</b> · rule "Punch in missed". ' + (DP.mode !== 'live' ? 'Test period: nothing is charged yet.' : (m.rule_mode === 'auto' ? 'It is taken automatically.' : 'It waits for your boss to say yes or no.')) + '</div>' : '') + '</div>'
        + '<div class="md-card"><div class="md-h">You can still finish and punch in</div><div class="bd-sub">Your punch in is then saved with the late time. The penalty stays.</div></div>';
    }
    h += '<div class="md-card"><div class="md-h">' + (punchedIn() ? 'Please redo these' : 'To punch in, do these ' + total) + '</div>';
    items.forEach((it, i) => {
      const cls = it.done ? 'done' : (it.redo ? 'bad' : (i === firstOpen ? 'now' : 'lock'));
      const n = it.done ? '✓' : (it.redo ? '!' : (i + 1));
      let body = '';
      if (it.done) {
        body = '<div class="s">Done' + (it.proofs && it.proofs[0] && it.proofs[0].clean_rating ? ' · clean ' + it.proofs[0].clean_rating + ' / 5' : '') + (it.proofs && it.proofs[0] && it.proofs[0].ai_note ? ' · ' + esc(it.proofs[0].ai_note) : '') + '</div>'
          + (!punchedIn() && it.proofs && it.proofs.length ? '<div class="a"><button class="bd-btn sm" data-rm="' + it.proofs[0].proof_id + '">Take it back</button></div>' : '');
      } else if (i === firstOpen || it.redo) {
        body = '<div class="s">' + esc(it.instruction || 'Add the screenshot.') + '</div>'
          + (it.redo ? '<div class="md-bad"><b>Not accepted.</b> ' + esc(it.redo_note) + '</div>' : '')
          + (it.link_required ? '<input class="bd-in" id="lk' + it.rule_id + '" placeholder="Paste the link of the post or video you commented on" style="margin-top:9px">' : '')
          + '<div class="a">' + (it.target_url ? '<a class="bd-btn sm" target="_blank" rel="noopener" href="' + esc(it.target_url) + '">Open today\'s ' + (it.kind === 'youtube' ? 'video' : 'reel') + '</a>' : '')
          + (it.footwear || it.capture === 'idcard' ? '<button class="bd-btn pri sm" data-cam="' + it.rule_id + '">📷 Take live photo</button>' : '<button class="bd-btn pri sm" data-file="' + it.rule_id + '">📷 Add screenshot</button><input type="file" accept="image/*" hidden id="fi' + it.rule_id + '" data-rule="' + it.rule_id + '">') + '</div>'
          + (it.footwear || it.capture === 'idcard' ? '<div class="bd-sub" style="margin-top:6px">Live camera only. Photos from the gallery are not accepted.</div>' : '')
          + (it.example ? '<div class="md-thumb"><img alt="example" data-ex="' + it.rule_id + '"><span class="bd-sub">Example photo</span></div>' : '');
      } else body = '<div class="s">Opens after the previous step.</div>';
      h += '<div class="md-step ' + cls + '"><div class="md-n">' + n + '</div><div style="min-width:0;flex:1"><div class="t">' + esc(it.title) + (it.shots_required > 1 ? ' <span class="bd-sub">(' + it.have + ' of ' + it.shots_required + ')</span>' : '') + '</div>' + body + '</div></div>';
    });
    h += '</div><button class="md-go ' + (left ? '' : 'green') + '" id="punchGo" ' + (left ? 'disabled' : '') + '>' + (left ? 'Punch in · ' + left + ' step' + (left === 1 ? '' : 's') + ' left' : 'Punch in now') + '</button>';
    if (!left) h += '<div class="bd-sub" style="text-align:center;margin-top:6px">You will take your face photo on the next screen.</div>';
    return h;
  }
  function punchOnly() { return '<div class="md-card"><div class="md-h">Ready to punch in</div><button class="md-go green" id="punchGo">Punch in now</button></div>'; }

  /* ---------------- tasks ---------------- */
  const mins = (t) => (new Date(String(t.due_at).replace(' ', 'T')) - Date.now()) / 60000;
  function bdItem(t) {
    const done = t.status === 'done', missed = t.status === 'missed', chips = [];
    chips.push('<span class="bd-chip' + (missed ? ' bad' : (mins(t) < 0 && !done ? ' warn' : '')) + '">' + (missed ? 'Missed · was due ' : 'Due ') + esc(t.due_label) + '</span>');
    if (t.proof === 'photo' && !done) chips.push('<span class="bd-chip info">📷 Photo</span>');
    if (t.proof === 'count' && !done) chips.push('<span class="bd-chip info"># Number' + (t.target_qty != null ? ' · ' + ({ min: 'at least ', max: 'at most ', any: '' }[t.cmp] || '') + t.target_qty : '') + '</span>');
    if (t.proof === 'auto' && !done) chips.push('<span class="bd-chip info">Counted automatically' + (t.proof_value != null ? ' · ' + t.proof_value + (t.target_qty ? ' of ' + t.target_qty : '') : '') + '</span>');
    if (t.cover_why && t.orig) chips.push('<span class="bd-chip warn">Covering for ' + esc(t.orig) + '</span>');
    if (done && t.check_state === 'pending') chips.push('<span class="bd-chip info">Waiting for your checker</span>');
    if (t.pen_state === 'pending') chips.push('<span class="bd-chip bad">Penalty may follow</span>');
    return '<div class="md-item ' + (done ? 'done' : (mins(t) < 0 ? 'late' : '')) + '" data-bd="' + t.id + '"><div style="min-width:0"><div class="t">' + esc(t.title) + '</div><div class="s">' + chips.join('') + '</div></div><div class="md-tick">' + (done ? '✓' : '') + '</div></div>';
  }
  function dpItem(t) {
    const late = t.due_at && new Date(String(t.due_at).replace(' ', 'T')) < Date.now();
    const pr = t.payload && t.payload.progress && typeof t.payload.progress.total === 'number' ? t.payload.progress : null;

  /* ---------------- after punch in: working time + punch out ---------------- */
  function dayCard() {
    const at = ATT && ATT.attendance; if (!at || !at.punch_in) return '';

    if (at.punch_out) {

    const m = Math.max(0, Math.floor((Date.now() - inT) / 60000));
    const since = '<small>Working since ' + hhmm(at.punch_in) + '</small><b>' + Math.floor(m / 60) + ' h ' + (m % 60) + ' m</b>';

  function stopCam() { if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; } }
  function openTask(t) {
    let head = '<div class="bd-lb">' + esc(t.section) + ' · due ' + esc(t.due_label) + '</div><h3 style="margin:6px 0 8px">' + esc(t.title) + '</h3>' + (t.why ? '<div class="bd-sub" style="margin-bottom:8px">' + esc(t.why) + '</div>' : '');
    if (t.cover_why && t.orig) head += '<div class="bd-call warn">You are covering for <b>' + esc(t.orig) + '</b> today.</div>';
    if (t.status === 'done') { BD.modal(head + '<div class="bd-call ok">Done' + (t.check_state === 'pending' ? '. Waiting for your checker to look at the photo.' : '.') + '</div><div class="acts"><button class="bd-btn" id="x">Close</button></div>').querySelector('#x').onclick = BD.close; return; }
    if (t.status === 'missed') head += '<div class="bd-call bad">This was due at ' + esc(t.due_label) + '. Do it now anyway; your boss will see it was late.</div>';
    if (t.pen_default > 0 && t.status === 'open') head += '<div class="bd-sub" style="margin-bottom:6px">If missed: a penalty of ' + inr(t.pen_default) + ' may be given.</div>';
    if (t.proof === 'tick') {
      const m = BD.modal(head + '<div class="acts"><button class="bd-btn" id="x">Not yet</button><button class="bd-btn go" id="ok">Mark done</button></div>');
      m.querySelector('#x').onclick = BD.close; m.querySelector('#ok').onclick = () => sendTask(t, {}, m);
    } else if (t.proof === 'count') {
      const m = BD.modal(head + '<div class="bd-f"><label>' + esc(({ min: 'How many? (target ' + t.target_qty + ')', max: 'How many are left? (should be ' + (t.target_qty || 0) + ' or less)', any: 'How many?' }[t.cmp]) + (t.unit ? ' — ' + t.unit : '')) + '</label><input class="bd-in" type="number" inputmode="numeric" min="0" id="n" value="' + (t.proof_value != null ? t.proof_value : '') + '"></div><div class="acts"><button class="bd-btn" id="x">Cancel</button><button class="bd-btn go" id="ok">Save</button></div>');
      m.querySelector('#x').onclick = BD.close; m.querySelector('#ok').onclick = () => { const v = m.querySelector('#n').value; if (v === '') return toast('Enter the number.', true); sendTask(t, { value: Number(v) }, m); };
    } else if (t.proof === 'auto') {
      const m = BD.modal(head + '<div class="bd-call info">The system counts this by itself' + (t.proof_value != null ? ': <b>' + t.proof_value + '</b>' + (t.target_qty ? ' of ' + t.target_qty : '') + ' so far' : '') + '. Just do the work' + (t.unit === 'flyers' ? ' and take the photos on the Flyers page' : '') + '.</div><div class="acts"><button class="bd-btn" id="x">Close</button>' + (t.unit === 'flyers' ? '<a class="bd-btn pri" href="flyers.html">Open Flyers</a>' : '') + '</div>');
      m.querySelector('#x').onclick = BD.close;
    } else taskCamera(t, head);
  }
  async function sendTask(t, extra, m, blob) {
    const btns = m.querySelectorAll('button'); btns.forEach((b) => b.disabled = true);
    try {
      let r;
      if (blob) { const fd = new FormData(); fd.append('task_id', t.id); fd.append('photo', blob, 'proof.jpg'); r = await api.upload('bd.task_submit', fd); }
      else r = await api.post('bd.task_submit', Object.assign({ task_id: t.id }, extra));
      if (r.retake) { btns.forEach((b) => b.disabled = false); return r; }
      stopCam(); BD.close(); toast(r.message || 'Done.'); load(); return r;
    } catch (e) { btns.forEach((b) => b.disabled = false); toast(e.message, true); }
  }
  function taskCamera(t, head, note) {
    camera(t.title, (t.photo_prompt ? 'The photo must show: ' + t.photo_prompt : ''), null, { t, head, note });
  }
  /* one live-camera sheet for everything (shoe photo, ID card, duty photos). onUse(blob) returns true when accepted. */
  function camera(title, hint, onUse, duty, fb) {   // fb = true: also offer the phone camera app when the live camera cannot start (daily place check)
    const head = duty ? duty.head : '<h3 style="margin:0 0 8px">' + esc(title) + '</h3>';
    const m = BD.modal(head + (hint ? '<div class="bd-call info">' + esc(hint) + '</div>' : '') + (duty && duty.note ? '<div class="bd-call bad"><b>Retake:</b> ' + esc(duty.note) + '</div>' : '')
      + '<div class="bd-cam"><video id="vid" playsinline muted autoplay></video><img id="pv" style="display:none" alt=""><div class="msg" id="cmsg">Opening the camera…</div></div>'
      + '<button class="bd-shot" id="shot" type="button" disabled aria-label="Take photo"></button>'
      + (duty || fb ? '<div class="bd-sub" style="text-align:center">Camera not opening? <label style="color:#0f7a4d;font-weight:700;text-decoration:underline;cursor:pointer">Use the phone camera app<input type="file" id="file" accept="image/*" capture="environment" hidden></label></div>' : '<div class="bd-sub" style="text-align:center">Live camera only. If it does not open, allow the camera for this site.</div>')
      + '<div class="acts"><button class="bd-btn" id="x">Cancel</button><button class="bd-btn" id="re" style="display:none">Retake</button><button class="bd-btn go" id="ok" style="display:none">Use this photo</button></div>', { sticky: true });
    const q = (s) => m.querySelector(s); let blob = null; BD.onClose = stopCam;
    q('#x').onclick = () => { stopCam(); BD.close(); };
    const preview = (b) => { blob = b; stopCam(); q('#pv').src = URL.createObjectURL(b); q('#pv').style.display = 'block'; q('#vid').style.display = 'none'; q('#cmsg').style.display = 'none'; q('#shot').style.display = 'none'; q('#re').style.display = ''; q('#ok').style.display = ''; };
    const fi = q('#file'); if (fi) fi.onchange = (e) => { if (e.target.files[0]) preview(e.target.files[0]); };
    q('#re').onclick = () => { blob = null; q('#pv').style.display = 'none'; q('#vid').style.display = ''; q('#shot').style.display = ''; q('#re').style.display = 'none'; q('#ok').style.display = 'none'; start(); };
    q('#ok').onclick = async () => {
      q('#ok').textContent = 'Checking…'; q('#ok').disabled = true;
      if (duty) { const r = await sendTask(duty.t, {}, m, blob); if (r && r.retake) { BD.close(); taskCamera(duty.t, duty.head, r.reason + ' (' + r.left + ' ' + (r.left === 1 ? 'try' : 'tries') + ' left)'); } else if (!r) { q('#ok').textContent = 'Use this photo'; q('#ok').disabled = false; } return; }
      const ok = await onUse(blob); if (ok) { stopCam(); BD.close(); } else { q('#ok').textContent = 'Use this photo'; q('#ok').disabled = false; }
    };
    async function start() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no camera');
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
        const v = q('#vid'); v.srcObject = stream; await v.play(); q('#cmsg').style.display = 'none'; q('#shot').disabled = false;
      } catch (e) { q('#cmsg').innerHTML = 'The camera could not start.<br>Allow the camera for this site and try again.'; }
    }
    q('#shot').onclick = () => {
      const v = q('#vid'); if (!v.videoWidth) return;
      const c = document.createElement('canvas'); const s = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight)); c.width = v.videoWidth * s; c.height = v.videoHeight * s;
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); c.toBlob((b) => b && preview(b), 'image/jpeg', 0.85);
    };
    start();
  }
  const typing = () => { const a = document.activeElement; if (a && a.closest && a.closest('#b2MyBox') && /INPUT|TEXTAREA/.test(a.tagName)) return true; return Array.from(document.querySelectorAll('#b2MyBox input')).some((i) => (i.type === 'file' ? i.files && i.files.length : (i.type !== 'range' && i.value))); };
  load(); setInterval(() => { if (!document.hidden && !$('bdModal') && !$('ofpOv') && !typing() && !(window.TMDino && TMDino.playing && TMDino.playing())) load(); }, 300000); setInterval(() => { if (!document.hidden && !$('bdModal')) pollPO(); }, 60000);   // lighter: the punch-out check every minute, the full day every 5 minutes (it reloads at once when you come back to the app)   // paused while the page is hidden; 7 requests every 2 min (was every 1 min), punch-out check every 30 s (was 20 s, even when hidden)
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('bdModal') && !$('ofpOv') && !typing() && !(window.TMDino && TMDino.playing && TMDino.playing())) load(); });
</script>

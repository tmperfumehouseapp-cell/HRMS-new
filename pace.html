<!DOCTYPE html>
<html lang="en">
<head>
<script>location.replace('hub.html?w=team&t=wasales');</script><!-- Reply pace now lives inside Team → Team performance → Team manager → Pace -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HRMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Reply pace — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
.content{max-width:1300px}
.pp-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pp-back{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font:700 13px inherit;cursor:pointer;color:inherit}
@media (max-width:820px){.topbar{padding-left:62px}.topbar h1{font-size:22px}}
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><div><h1>⚡ Reply pace</h1><div class="muted" style="font-size:12.5px;margin-top:3px;max-width:70ch">How fast every salesperson answers customers, how fast orders close, and whether the two are connected. Last 30 days.</div></div></div>
    <div class="content"><div id="paceRoot"></div></div>
  </main>
</div>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/api.js?v=13"></script>
<script src="assets/js/layout.js?v=30"></script>
<script src="assets/js/wq_pace_ui.js?v=8"></script>
<script src="assets/js/wq_pace_page.js?v=3"></script>
<script>
  guardPage();
  (function () {
    let u = null; try { u = api.currentUser(); } catch (e) { u = null; }
    if (u && u.role === 'Employee') { location.replace('my_chats.html?tab=queries'); return; }   // a salesperson sees their own pace through the ⚡ button
    renderSidebar('wapace');
    const root = document.getElementById('paceRoot');
    if (!window.WaPace || !window.WaPacePage) { root.innerHTML = '<div style="padding:20px;color:#d9423b">The pace page could not load its script. Refresh the page.</div>'; return; }
    const P = new URLSearchParams(location.search);
    window.WaPacePage.mount(root, { emp: +P.get('emp') || 0, days: +P.get('days') === 7 ? 7 : 30 });
  })();
</script>
</body>
</html>

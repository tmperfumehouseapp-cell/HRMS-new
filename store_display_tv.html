<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Store Report Card</title>
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden;cursor:none}
  body{font-family:Inter,'Segoe UI',system-ui,Roboto,Arial,'Noto Sans Gujarati',sans-serif;color:#0b0b0b}
  #stage{position:absolute;left:0;top:0;width:720px;height:1280px;transform-origin:top left;background:#fff}
  #stage *{box-sizing:border-box}
  .h1{position:absolute;left:42px;top:50px;font-size:58px;font-weight:800;letter-spacing:-2px;white-space:nowrap}.h2{position:absolute;left:46px;top:114px;font-size:32px;font-weight:500}
  .live{position:absolute;right:42px;top:62px;display:flex;align-items:center;gap:9px;font-size:24px;color:#16a34a;font-weight:800}.live i{width:15px;height:15px;border-radius:50%;background:#16a34a;animation:p 1.4s infinite}.live.off{color:#b45309}.live.off i{background:#b45309;animation:none}@keyframes p{50%{opacity:.2}}
  .t{position:absolute;left:40px;top:196px;font-size:88px;font-weight:900;line-height:.92;letter-spacing:-3.5px}.per{position:absolute;left:44px;top:366px;font-size:34px;font-weight:500}
  .line{position:absolute;left:44px;right:44px;top:430px;height:4px;background:#ff5a00}
  .big{position:absolute;left:30px;top:430px;font-size:262px;font-weight:900;letter-spacing:-11px;line-height:1;font-variant-numeric:tabular-nums}.bl{position:absolute;left:44px;top:700px;font-size:48px;font-weight:800;color:#ff5a00}
  .plus{position:absolute;left:470px;top:640px;font-size:74px;font-weight:900;color:#16a34a;opacity:0}.plus.go{animation:up 1.8s ease-out}@keyframes up{0%{opacity:0;transform:translateY(30px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-60px)}}
  .rows{position:absolute;left:44px;right:44px;top:768px}.r{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #d4d7e0;padding:10px 0;font-size:32px;font-weight:500}.r b{font-size:54px;font-weight:900;letter-spacing:-2px;font-variant-numeric:tabular-nums}.r small{display:block;font-size:32px;font-weight:500;line-height:1.1}
  .cta{position:absolute;left:42px;right:42px;top:1132px;background:#ff5a00;color:#fff;font-size:56px;font-weight:900;text-align:center;padding:16px;border-radius:60px;letter-spacing:-1px}.url{position:absolute;left:0;right:0;top:1228px;text-align:center;font-size:40px;font-weight:500}
  .flash{animation:fl 1s}@keyframes fl{0%{color:#16a34a;transform:scale(1.07)}100%{transform:scale(1)}}
  .toast{position:absolute;left:44px;right:44px;top:1068px;background:#111;color:#fff;border-radius:14px;padding:12px 20px;font-size:30px;font-weight:700;opacity:0;transition:.3s;text-align:center}.toast.on{opacity:1}
  #msg{position:absolute;left:0;right:0;top:0;height:1280px;padding-top:560px !important;box-sizing:border-box;text-align:center;font-size:30px;color:#b91c1c;padding:0 30px;z-index:5;background:#fff}
</style>
</head>
<body>
<div id="stage">
  <div class="h1" id="title">TM Perfume House</div><div class="h2" id="place">Vesu, Surat</div><div class="live" id="live"><i></i><span id="livet">LIVE</span></div>
  <div class="t">Store<br>Report Card</div><div class="per" id="per">Last 2 months</div><div class="line"></div>
  <div class="big" id="ord">–</div><div class="bl">Orders</div><div class="plus" id="pl">+1</div>
  <div class="rows">
    <div class="r"><span>Bottles sold</span><b id="bt">–</b></div>
    <div class="r"><span>WhatsApp<small>community members</small></span><b id="cm">–</b></div>
    <div class="r"><span>Google reviews</span><b id="gr">–</b></div>
    <div class="r"><span>Average Google rating</span><b id="rt">–</b></div>
  </div>
  <div class="toast" id="ts"></div>
  <div class="cta" id="cta">Order it now</div><div class="url" id="url">tmperfumehouse.com</div>
  <div id="msg" style="color:#555">Loading…</div>
</div>
<script>
/* written in plain old JavaScript so it also runs in the old Chrome of cheap Android TV boxes */
(function () {
  function $(id) { return document.getElementById(id); }
  var st = $('stage'), m = /[?&]k=([^&]*)/.exec(location.search), key = m ? decodeURIComponent(m[1]) : '', fromStore = false;
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return ''; } return ''; }
  if (key) ls('sd_key', key); else { key = ls('sd_key'); fromStore = !!key; }
  function fit() {
    var w = window.innerWidth || document.documentElement.clientWidth, h = window.innerHeight || document.documentElement.clientHeight, s = Math.min(w / 720, h / 1280);
    var tf = 'scale(' + s + ')'; st.style.webkitTransform = tf; st.style.transform = tf;
    st.style.left = Math.max(0, (w - 720 * s) / 2) + 'px'; st.style.top = Math.max(0, (h - 1280 * s) / 2) + 'px';
  }
  window.addEventListener('resize', fit); fit();
  function f(n) { n = Number(n || 0); try { return n.toLocaleString('en-IN'); } catch (e) { return String(n); } }
  var last = null, audio = null;
  function restart(el, cls) { el.className = el.className.replace(' ' + cls, '').replace(cls, ''); void el.offsetWidth; el.className += ' ' + cls; }
  function flash(id) { restart($(id), 'flash'); }
  function toast(t) { var e = $('ts'); e.textContent = t; e.className = 'toast on'; setTimeout(function () { e.className = 'toast'; }, 2600); }
  function ding() { try { var AC = window.AudioContext || window.webkitAudioContext; audio = audio || new AC(); var o = audio.createOscillator(), g = audio.createGain(); o.type = 'sine'; o.frequency.value = 880; g.gain.setValueAtTime(0.0001, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.4, audio.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.7); o.connect(g); g.connect(audio.destination); o.start(0); o.stop(audio.currentTime + 0.75); } catch (e) { /* no sound on this screen */ } }
  function setNum(id, v, old) { $(id).textContent = f(v); if (old !== undefined && old !== null && v !== old) flash(id); }
  function show(d) {
    $('title').textContent = d.title; $('place').textContent = d.place; $('per').textContent = d.period; $('cta').textContent = d.cta; $('url').textContent = d.url;
    $('rt').textContent = d.rating !== '' ? d.rating + '/5' : '–'; $('gr').textContent = f(d.reviews);
    setNum('ord', d.orders, last && last.orders); setNum('bt', d.bottles, last && last.bottles); setNum('cm', d.community, last && last.community);
    if (last && d.orders > last.orders) {
      var p = $('pl'); p.textContent = '+' + (d.orders - last.orders); restart(p, 'go');
      var nb = Math.max(0, d.bottles - last.bottles);
      toast('New bill · ' + nb + ' bottle' + (nb === 1 ? '' : 's') + (d.community > last.community ? ' · +' + (d.community - last.community) + ' community' : '')); if (d.sound) ding();
    }
    last = d; $('msg').style.display = 'none'; $('live').className = 'live'; $('livet').textContent = 'LIVE';
  }
  function offline(text) {
    if (!last) { $('msg').textContent = text; $('msg').style.display = 'block'; } else { $('live').className = 'live off'; $('livet').textContent = 'OFFLINE'; }
  }
  function tick() {
    try {
      var x = new XMLHttpRequest(); x.open('GET', 'api.php?action=st_disp.feed&k=' + encodeURIComponent(key) + '&_t=' + new Date().getTime(), true);
      x.timeout = 15000;
      x.onload = function () {
        var d = null; try { d = JSON.parse(x.responseText); } catch (e) { d = null; }
        if (x.status === 403 && fromStore) { ls('sd_key', null); location.reload(); return; }
        if (x.status !== 200 || !d || d.error) { offline((d && d.error) || 'The screen could not start (code ' + x.status + ').'); return; }
        try { show(d); } catch (e) { offline('Display error: ' + e.message); }
      };
      x.onerror = x.ontimeout = function () { offline('No internet connection.'); };
      x.send();
    } catch (e) { offline('Display error: ' + e.message); }
  }
  window.onerror = function (msg) { try { $('msg').textContent = 'Display error: ' + msg; $('msg').style.display = 'block'; } catch (e) { /* ok */ } };
  function pairMode() {
    var code = ls('sd_code'); if (!/^\d{6}$/.test(code)) { code = String(100000 + Math.floor(Math.random() * 900000)); ls('sd_code', code); }
    $('msg').style.color = '#111'; $('msg').style.fontSize = '34px'; $('msg').style.display = 'block';
    $('msg').innerHTML = 'Connect this screen<br><span style="font-size:130px;font-weight:900;letter-spacing:8px;color:#ff5a00;line-height:1.3">' + code + '</span><br><span style="font-size:28px;color:#444">On the computer or phone open HRMS<br>Store → Display → <b>Connect a TV</b><br>and type this number</span>';
    $('livet').textContent = 'WAITING';
    function poll() {
      try { var x = new XMLHttpRequest(); x.open('GET', 'api.php?action=st_disp.pair&c=' + code + '&_t=' + new Date().getTime(), true); x.timeout = 15000;
        x.onload = function () { var d = null; try { d = JSON.parse(x.responseText); } catch (e) { d = null; } if (d && d.key) { ls('sd_key', d.key); ls('sd_code', null); location.replace('store_display_tv.html'); } };
        x.send(); } catch (e) { /* try again */ }
    }
    poll(); setInterval(poll, 3000);
  }
  if (!key) { pairMode(); } else { tick(); setInterval(tick, 8000); }
  setTimeout(function () { location.reload(); }, 6 * 3600 * 1000);
  document.addEventListener('click', function () { try { var AC = window.AudioContext || window.webkitAudioContext; audio = audio || new AC(); if (audio.resume) audio.resume(); } catch (e) { /* ok */ } });
})();
</script>
</body>
</html>

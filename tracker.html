<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Daily tracker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#eef0f3;color:#14161a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{background:#fff;border-radius:20px;padding:28px 24px;max-width:440px;width:100%;text-align:center;box-shadow:0 1px 2px rgba(20,22,26,.05)}
  .ic{width:56px;height:56px;border-radius:18px;background:#fff1e8;color:#ff7a2f;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:26px}
  h1{font-size:20px;font-weight:800;margin-bottom:6px}
  p{color:#6b7280;font-size:13.5px}
  .tag{display:inline-block;margin-top:16px;border-radius:999px;background:#14161a;color:#fff;font-weight:700;font-size:12.5px;padding:7px 14px}
</style>
</head>
<body>
  <div class="card">
    <div class="ic">&#128203;</div>
    <h1>Daily tracker</h1>
    <p>This section is being set up and is not open yet.<br>It will appear here once it is ready.</p>
    <span class="tag">Coming soon</span>
  </div>
</body>
</html>

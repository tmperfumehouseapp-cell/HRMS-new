<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Store display — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=260928b">
<link rel="stylesheet" href="assets/css/store.css?v=8">
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><div><h1>Store · Display</h1><div class="sub" style="font-size:12.5px;color:var(--muted);margin-top:2px">The live Store Report Card for the TV in the shop. It shows only the card, and changes by itself as bills are made</div></div></div>
    <div class="content"><div class="sx-page" id="root"><div class="sx-card sx-mut">Loading…</div></div></div>
  </main>
</div>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/api.js?v=14"></script>
<script src="assets/js/layout.js?v=43"></script>
<script src="assets/js/store_common.js?v=3"></script>
<script>
  guardPage();
  renderSidebar('store_display');
  let D = null;
  const shortLink = () => new URL('tv.html?k=' + D.cfg.key.slice(0, 8), location.href).href;
  const link = () => new URL('store_display_tv.html?k=' + encodeURIComponent(D.cfg.key), location.href).href;
  const LOOKS = [['brand', 'TM Perfume House'], ['classic', 'Classic white'], ['gold', 'Midnight Gold'], ['sunset', 'Sunset'], ['rose', 'Rose Luxe'], ['emerald', 'Emerald']];
  const PER = { '2m': 'Last 2 months', month: 'This month', all: 'Since the start' };
  const v = (id) => ($(id) || {}).value;
  function render() {
    const c = D.cfg, n = D.numbers || {};
    $('root').innerHTML = `<div style="display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px;align-items:start" id="dg">
      <div class="sx-card" style="padding:10px"><div style="width:100%;aspect-ratio:9/16;position:relative;overflow:hidden;border-radius:10px;border:1px solid #ddd"><iframe id="pv" src="${esc(link())}" style="position:absolute;left:0;top:0;width:100%;height:100%;border:0" title="Preview"></iframe></div><div class="sx-mut" style="font-size:12px;margin-top:6px;text-align:center">Preview, exactly what the TV shows</div></div>
      <div>
        <div class="sx-card"><h3>Put it on the TV</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="sx-btn" id="bOpen">Open full screen</button><button class="sx-btn ghost" id="bCopy">Copy the screen link</button><button class="sx-btn ghost" id="bNew">Make a new link</button></div>
          <div class="sx-mut" style="font-size:12.5px;margin-top:8px;line-height:1.6">On the TV box: turn the screen 90° (portrait) in its display settings, open this link in Chrome (or Fully Kiosk), and leave it. It needs internet. Anyone with the link can see only these numbers, so if it is ever shared by mistake press <b>Make a new link</b> and the old one stops.</div>
          <div style="margin-top:12px;padding:10px 12px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa"><b>Connect a TV</b> <span class="sx-mut" style="font-size:12.5px">— on the TV open <b>${esc(location.host)}/tv.html</b>, it shows 6 numbers, type them here</span>
            <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><input class="sx-in" id="fCode" inputmode="numeric" maxlength="6" placeholder="6 numbers from the TV" style="max-width:220px"><button class="sx-btn" id="bLink">Connect</button></div><div id="lmsg" style="font-size:12.5px;margin-top:6px"></div></div>
          <div style="margin-top:10px;font-size:13.5px">Short link to type on the TV: <b id="sl" style="user-select:all">${esc(shortLink())}</b></div>
          <div id="cmsg" style="font-size:12.5px;margin-top:6px"></div></div>
        <div class="sx-card"><h3>Look on the TV <small>colours with slow live effects: soft moving light, rising sparkles, a shine on the button and confetti on every new bill</small></h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px">${LOOKS.map(([k, n]) => `<button type="button" class="sd-look" data-look="${k}" style="padding:6px;border-radius:14px;border:2px solid ${(c.theme || 'brand') === k ? '#ff5a00' : '#e5e7eb'};background:#fff;cursor:pointer;text-align:center;font:inherit">
            <div style="width:100%;aspect-ratio:9/16;position:relative;overflow:hidden;border-radius:9px;pointer-events:none"><iframe src="${esc(link() + '&theme=' + k)}" loading="lazy" style="position:absolute;left:0;top:0;width:100%;height:100%;border:0" title="${esc(n)}"></iframe></div>
            <div style="font-size:12.5px;font-weight:800;margin-top:6px">${(c.theme || 'brand') === k ? '✓ ' : ''}${esc(n)}</div></button>`).join('')}</div>
          <div id="tmsg" style="font-size:12.5px;margin-top:8px"></div></div>
        <div class="sx-card"><h3>What the card shows <small>now: ${Number(n.orders || 0).toLocaleString('en-IN')} orders · ${Number(n.bottles || 0).toLocaleString('en-IN')} bottles · ${Number(n.community || 0).toLocaleString('en-IN')} community</small></h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">
            <label class="sx-f">Period<select class="sx-in" id="fPer">${Object.keys(PER).map((k) => `<option value="${k}"${c.period === k ? ' selected' : ''}>${PER[k]}</option>`).join('')}</select></label>
            <label class="sx-f">WhatsApp community members now<input class="sx-in" type="number" min="0" id="fCom" value="${Number(c.community_base || 0)}"></label>
            <label class="sx-f">Google reviews<input class="sx-in" type="number" min="0" id="fRev" value="${Number(c.google_reviews || 0)}"></label>
            <label class="sx-f">Average Google rating (like 4.9)<input class="sx-in" id="fRat" value="${esc(c.rating || '')}"></label>
            <label class="sx-f">Button text<input class="sx-in" id="fCta" value="${esc(c.cta)}"></label>
            <label class="sx-f">Website<input class="sx-in" id="fUrl" value="${esc(c.url)}"></label>
            <label class="sx-f">Name<input class="sx-in" id="fTit" value="${esc(c.title)}"></label>
            <label class="sx-f">Place<input class="sx-in" id="fPl" value="${esc(c.place)}"></label></div>
          <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13.5px"><input type="checkbox" id="fSnd"${Number(c.sound) ? ' checked' : ''}> Play a soft "ding" when a new bill comes (the TV must be tapped once after it opens)</label>
          <div class="sx-mut" style="font-size:12.5px;margin-top:8px;line-height:1.6">Orders and bottles come by themselves from the bills. The community number counts up by itself from the new customers added to the community in billing after you save. Google does not give reviews and rating to any tool for free, so type those two when they change.</div>
          <div style="margin-top:12px"><button class="sx-btn" id="bSave">Save</button> <span id="smsg" style="font-size:13px;margin-left:8px"></span></div></div>
      </div></div>`;
    if (innerWidth < 760) $('dg').style.gridTemplateColumns = '1fr';
  }
  const say = (id, t, bad) => { const e = $(id); if (e) { e.style.color = bad ? '#b91c1c' : '#15803d'; e.textContent = t; } };
  async function load() {
    try { const r = await api.get('st_disp.get'); D = { cfg: r, numbers: r.numbers || {} }; render(); }
    catch (e) { $('root').innerHTML = `<div class="sx-card"><div class="sx-msg bad">${sxi('xc')}<span>${esc(e.message)}</span></div></div>`; }
  }
  $('root').addEventListener('click', async (e) => {
    const id = e.target.id;
    if (id === 'bOpen') window.open(link(), '_blank');
    if (id === 'bCopy') { try { await navigator.clipboard.writeText(link()); say('cmsg', 'Link copied. Open it on the TV box.'); } catch (x) { prompt('Copy this link', link()); } }
    if (id === 'bLink') {
      try { await api.post('st_disp.link', { code: v('fCode') }); say('lmsg', 'Done. The TV will show the card in a few seconds.'); $('fCode').value = ''; } catch (x) { say('lmsg', x.message, 1); }
    }
    if (id === 'bNew') {
      if (!confirm('Make a new link? The link now on the TV will stop working and you must open the new one there.')) return;
      try { await api.post('st_disp.newkey', {}); await load(); say('cmsg', 'New link made. The old one has stopped.'); } catch (x) { say('cmsg', x.message, 1); }
    }
    const lk = e.target.closest && e.target.closest('[data-look]');
    if (lk) {
      const c = D.cfg;
      try { await api.post('st_disp.save', { period: c.period, community_base: Number(c.community_base || 0), google_reviews: Number(c.google_reviews || 0), rating: c.rating, cta: c.cta, url: c.url, title: c.title, place: c.place, sound: Number(c.sound) ? 1 : 0, theme: lk.dataset.look });
        await load(); say('tmsg', 'Look changed. The TV changes within a few seconds.'); } catch (x) { say('tmsg', x.message, 1); }
      return;
    }
    if (id === 'bSave') {
      try {
        await api.post('st_disp.save', { period: v('fPer'), community_base: Number(v('fCom') || 0), google_reviews: Number(v('fRev') || 0), rating: v('fRat'), cta: v('fCta'), url: v('fUrl'), title: v('fTit'), place: v('fPl'), sound: $('fSnd').checked ? 1 : 0, theme: D.cfg.theme || 'brand' });
        await load(); say('smsg', 'Saved. The TV changes within a few seconds.');
      } catch (x) { say('smsg', x.message, 1); }
    }
  });
  load();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>

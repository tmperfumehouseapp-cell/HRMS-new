<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Inventory — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=260928b">
<link rel="stylesheet" href="assets/css/store.css?v=6">
<style>
  .tabs2{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs2 button{border:1px solid var(--sx-line);background:#fff;border-radius:999px;padding:8px 15px;font:700 13px inherit;cursor:pointer;color:#4a505c}.tabs2 button.on{background:var(--sx-ink);color:#fff;border-color:var(--sx-ink)}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.bar .sp{flex:1}.bar select,.bar input{width:auto;min-height:36px;padding:5px 12px;font-size:13px;border-radius:999px;border:1px solid var(--sx-line);background:#f6f7f9}.bar input.grow{flex:1;min-width:170px}
  .g{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
  @media (max-width:1000px){.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,1fr)}}@media (max-width:640px){.g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--sx-mut);padding:8px 8px;border-bottom:1px solid var(--sx-line);white-space:nowrap;font-weight:800}.tbl td{padding:9px 8px;border-bottom:1px solid var(--sx-line);vertical-align:middle}.tbl tr:last-child td{border-bottom:0}.tbl tbody tr.cl{cursor:pointer}.tbl tbody tr.cl:hover{background:#f6f7f9}
  .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}.sc{overflow-x:auto}
  .pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:800;white-space:nowrap}.pill.ok{background:var(--sx-good-t);color:var(--sx-good)}.pill.warn{background:var(--sx-warn-t);color:var(--sx-warn)}.pill.bad{background:var(--sx-bad-t);color:var(--sx-bad)}.pill.info{background:var(--sx-blue-t);color:var(--sx-blue)}.pill.mut{background:#eef0f3;color:#6b7280}
  .meter{height:8px;border-radius:6px;background:#e6e8ec;overflow:hidden;min-width:70px;position:relative}.meter i{display:block;height:100%;border-radius:6px}.meter b{position:absolute;top:-2px;bottom:-2px;width:2px;background:#14161a;opacity:.5}
  .hero{position:relative;overflow:hidden;border-radius:26px;color:#fff;padding:clamp(16px,2.2vw,26px);margin-bottom:14px;background:radial-gradient(900px 260px at 92% -30%,rgba(255,122,47,.65),transparent 62%),radial-gradient(500px 220px at 0% 120%,rgba(98,80,214,.45),transparent 60%),linear-gradient(135deg,#14161a,#22262e)}
  .hero .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}.hero h2{font-size:24px;margin:4px 0;font-weight:800;letter-spacing:-.02em}.hero p{margin:0;opacity:.8}
  .hero .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}.hero .nums>div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:9px 13px}.hero .l{font-size:11.5px;opacity:.7;font-weight:600}.hero .v{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
  .btn{border:1.5px solid var(--sx-ink);background:#fff;color:var(--sx-ink);border-radius:999px;padding:7px 15px;font:700 13px inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:36px;text-decoration:none}.btn:hover{background:#f4f5f7}.btn.pri{background:var(--sx-ink);color:#fff}.btn.sm{padding:3px 11px;min-height:28px;font-size:12px}.btn.wa{background:#e3f6ea;border-color:#bfe6cd;color:#17703d}.btn.warn{border-color:var(--sx-bad);color:var(--sx-bad)}.btn[disabled]{opacity:.45;cursor:default}
  .hero .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4)}.hero .btn.go{background:var(--sx-accent);border-color:var(--sx-accent)}
  .al{display:flex;gap:12px;padding:11px 13px;border-radius:16px;background:#f6f7f9;align-items:flex-start}.al .d{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;background:var(--sx-blue)}.al.bad{background:var(--sx-bad-t)}.al.bad .d{background:var(--sx-bad)}.al.warn{background:var(--sx-warn-t)}.al.warn .d{background:var(--sx-warn)}.al b{display:block}.al span{color:var(--sx-mut);font-size:13px}.al .a{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .stack{display:grid;gap:9px}.eq{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px}.eq>div{background:#f6f7f9;border-radius:14px;padding:9px 12px}.eq .l{font-size:11.5px;color:var(--sx-mut);font-weight:700}.eq .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .note{font-size:12px;color:var(--sx-mut)}.empty{padding:22px;text-align:center;color:var(--sx-mut)}
  .fld{display:grid;gap:4px;margin-bottom:9px}.fld label{font-size:12px;font-weight:800;color:var(--sx-mut)}.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--sx-line);border-radius:12px;padding:9px 12px;font:inherit;background:#fff}.fr{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .lc{background:#f6f7f9;border-radius:16px;padding:10px 12px;margin-bottom:9px}.lc input,.lc select{border:1px solid var(--sx-line);border-radius:10px;padding:7px 9px;font:inherit;min-width:0;width:100%;background:#fff}
  .lc .lr{display:flex;gap:6px;margin-bottom:7px;align-items:center}.lc .lr input{flex:2 1 0}.lc .lr select{flex:1.2 1 0}.lc .lr .btn{flex:0 0 34px;padding:0;justify-content:center}
  .lc .l4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.lc .l4 label{display:block;font-size:11px;font-weight:800;color:var(--sx-mut);margin-bottom:2px}
  @media (max-width:560px){.lc .l4{grid-template-columns:repeat(2,minmax(0,1fr))}.lc .lr{flex-wrap:wrap}.lc .lr input{flex:1 1 60%}.lc .lr select{flex:1 1 100%;order:3}}
  .lc .auto{font-size:12px;color:var(--sx-mut);margin-top:6px}.lc .auto b{color:#14161a}.lc .cust{background:var(--sx-warn-t);color:var(--sx-warn);border-radius:99px;padding:1px 9px;font-weight:800;font-size:11px;margin-left:6px}
  .ov{position:fixed;inset:0;background:rgba(20,22,26,.42);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}.ov.on{opacity:1;pointer-events:auto}
  .dr{position:fixed;top:0;right:0;bottom:0;width:min(520px,96vw);background:var(--sx-bg);z-index:41;display:flex;flex-direction:column;transform:translateX(104%);transition:transform .22s cubic-bezier(.2,.8,.2,1);box-shadow:-18px 0 50px rgba(20,22,26,.22);border-radius:26px 0 0 26px}.dr.on{transform:none}@media (max-width:640px){.dr{border-radius:0}}
  .dr-h{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-radius:26px 0 0 0;box-shadow:0 1px 0 var(--sx-line)}@media (max-width:640px){.dr-h{border-radius:0}}.dr-h b{font-size:16px;flex:1}.dr-x{border:0;background:var(--sx-bg);width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
  .dr-b{flex:1;overflow-y:auto;padding:12px 14px;display:grid;gap:10px;align-content:start}.dr-f{padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -1px 0 var(--sx-line);display:flex;gap:8px;flex-wrap:wrap}
  .msg{background:#f6f7f9;border-radius:14px;padding:11px 13px;white-space:pre-wrap;font-size:13px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sx-mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
  svg text{font-size:10.5px;fill:#6f7480}
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><div><h1>Inventory</h1><div class="sub" style="font-size:12.5px;color:var(--muted);margin-top:2px">Oils, perfumes, orders and dealers: what you have, what you need, what will be late</div></div></div>
    <div class="content"><div class="sx-page"><div class="tabs2" id="tabs"></div><div id="root"><div class="sx-card sx-mut">Loading…</div></div></div></div>
  </main>
</div>
<div class="ov" id="ov"></div>
<aside class="dr" id="dr" aria-hidden="true"><div class="dr-h"><b id="drT"></b><button class="dr-x" id="drX" aria-label="Close">×</button></div><div class="dr-b" id="drB"></div><div class="dr-f" id="drF"></div></aside>
<datalist id="pdl"></datalist>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/api.js?v=9"></script>
<script src="assets/js/layout.js?v=23"></script>
<script>
  guardPage();
  renderSidebar('iv_dash');
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n, d = 0) => Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: d, minimumFractionDigits: d });
  const inr = (n) => '₹' + fmt(n);
  const dS = (d) => d ? new Date(String(d).slice(0, 10) + 'T00:00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) : '';
  const EMB = /[?&]in=/.test(location.search);
  if (window.self !== window.top) { const st = document.createElement('style'); st.textContent = '.topbar{display:none!important}'; document.head.appendChild(st); }   // inside the Inventory workspace the workspace draws the title
  const VIEWS = [['dashboard', 'Dashboard'], ['oils', 'Oil stock'], ['perfumes', 'Perfumes'], ['calc', 'Oil calculator'], ['orders', 'Orders'], ['dealers', 'Dealers'], ['alerts', 'Alerts'], ['reports', 'Reports']];
  const view = () => { const v = (location.hash || '').slice(1).split('?')[0]; return VIEWS.some((x) => x[0] === v) ? v : 'dashboard'; };
  const G = (a, p) => api.get(a, p || {});
  const P = (a, b) => api.post(a, b || {});
  let OPT = null, CUR = 'dashboard';
  const opts = async (force) => { if (!OPT || force) { OPT = await G('iv.options'); $('pdl').innerHTML = OPT.perfumes.map((p) => '<option value="' + esc(p.name) + ' (' + esc(p.code) + ')">').join(''); } return OPT; };
  const perfId = (txt) => { const t = String(txt || '').trim().toLowerCase(); if (!t || !OPT) return 0; const hit = OPT.perfumes.find((p) => (p.name + ' (' + p.code + ')').toLowerCase() === t) || OPT.perfumes.find((p) => p.code.toLowerCase() === t) || OPT.perfumes.find((p) => p.name.toLowerCase() === t); return hit ? hit.id : 0; };
  const toast = (m, bad) => { const t = document.createElement('div'); t.textContent = m; t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:' + (bad ? '#d9423b' : '#14161a') + ';color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;z-index:60;max-width:92vw'; document.body.appendChild(t); setTimeout(() => t.remove(), bad ? 4200 : 2200); };
  const fail = (e) => toast(e && e.message ? e.message : 'Something went wrong', true);

  /* ---------- drawer ---------- */
  const openDr = (t, b, f) => { $('drT').textContent = t; $('drB').innerHTML = b; $('drF').innerHTML = f || ''; $('drF').style.display = f ? '' : 'none'; $('dr').classList.add('on'); $('ov').classList.add('on'); $('dr').setAttribute('aria-hidden', 'false'); };
  const closeDr = () => { $('dr').classList.remove('on'); $('ov').classList.remove('on'); $('dr').setAttribute('aria-hidden', 'true'); };
  $('drX').onclick = closeDr; $('ov').onclick = closeDr; document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDr(); });

  const stPill = (s) => ({ out: '<span class="pill bad">Out of stock</span>', low: '<span class="pill bad">Below minimum</span>', watch: '<span class="pill warn">Running down</span>', ok: '<span class="pill ok">Healthy</span>' }[s]);
  const meter = (o) => { const max = Math.max(o.min_ml * 3, o.stock_ml, 1), pc = Math.min(100, o.stock_ml / max * 100); const col = { out: '#d9423b', low: '#d9423b', watch: '#b45309', ok: '#16945a' }[o.status]; return '<div class="meter" title="' + fmt(o.stock_ml) + ' ml, minimum ' + fmt(o.min_ml) + ' ml"><i style="width:' + pc + '%;background:' + col + '"></i><b style="left:' + Math.min(98, o.min_ml / max * 100) + '%"></b></div>'; };
  const alertHtml = (a) => {
    const acts = [];
    if (a.oil_id && ['out', 'low', 'predict', 'overdue'].includes(a.type)) acts.push('<button class="btn sm wa" data-wa="' + a.oil_id + '"' + (a.buy_ml ? ' data-q="' + a.buy_ml + '"' : '') + '>WhatsApp dealer</button>');
    if (a.oil_id && a.buy_ml) acts.push('<button class="btn sm" data-po="' + a.oil_id + '" data-q="' + a.buy_ml + '">Create purchase</button>');
    if (a.type === 'late') { acts.push('<button class="btn sm" data-cm="' + a.order_id + '">Message customer</button>'); acts.push('<a class="btn sm" href="#orders">See order</a>'); }
    if (a.type === 'overdue' || a.type === 'payment') acts.push('<a class="btn sm" href="#dealers">Open dealers</a>');
    return '<div class="al ' + a.sev + '"><span class="d"></span><div><b>' + esc(a.title) + '</b><span>' + esc(a.text) + '</span></div><div class="a">' + acts.join('') + '</div></div>';
  };

  /* ---------- router ---------- */
  function tabs() { $('tabs').style.display = EMB ? 'none' : ''; $('tabs').innerHTML = VIEWS.map((v) => '<button type="button" data-t="' + v[0] + '" class="' + (CUR === v[0] ? 'on' : '') + '">' + v[1] + '</button>').join(''); }
  $('tabs').onclick = (e) => { const b = e.target.closest('button'); if (b) location.hash = '#' + b.dataset.t; };
  async function route() {
    CUR = view(); tabs(); $('root').innerHTML = '<div class="sx-card sx-mut">Loading…</div>';
    try { await opts(); await ({ dashboard: vDash, oils: vOils, perfumes: vPerf, calc: vCalc, orders: vOrders, dealers: vDealers, alerts: vAlerts, reports: vReports }[CUR])(); }
    catch (e) { $('root').innerHTML = '<div class="sx-card"><div class="sx-msg bad"><span>' + esc(e.message) + '</span></div></div>'; }
  }
  window.addEventListener('hashchange', route);
  const redo = () => route();

  /* ---------- dashboard ---------- */
  async function vDash() {
    const d = await G('iv.dash'), k = d.kpi, c = k.counts;
    const donut = (() => { const R = 54, C = 2 * Math.PI * R, tot = Math.max(1, k.oils); let a = 0, s = ''; [['ok', '#16945a'], ['watch', '#b45309'], ['low', '#d9423b'], ['out', '#7a1f17']].forEach(([key, col]) => { const f = c[key] / tot; s += '<circle r="' + R + '" cx="70" cy="70" fill="none" stroke="' + col + '" stroke-width="18" stroke-dasharray="' + (f * C) + ' ' + C + '" stroke-dashoffset="' + (-a * C) + '" transform="rotate(-90 70 70)"/>'; a += f; });
      return '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 140 140" width="130" height="130">' + (k.oils ? s : '<circle r="54" cx="70" cy="70" fill="none" stroke="#e6e8ec" stroke-width="18"/>') + '<text x="70" y="72" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#14161a">' + k.oils + '</text><text x="70" y="88" text-anchor="middle">oils</text></svg><div class="stack" style="gap:6px"><div class="legend"><span><i style="background:#16945a"></i>Healthy ' + c.ok + '</span></div><div class="legend"><span><i style="background:#b45309"></i>Running down ' + c.watch + '</span></div><div class="legend"><span><i style="background:#d9423b"></i>Below minimum ' + c.low + '</span></div><div class="legend"><span><i style="background:#7a1f17"></i>Out of stock ' + c.out + '</span></div></div></div>'; })();
    const todo = c.out + c.low + k.late_orders;
    $('root').innerHTML = (k.oils === 0 ? '<div class="sx-card" style="margin-bottom:12px"><b>Start here.</b> Add your dealers, then your oils with their opening stock, then your perfumes (paste many at once). The dashboard fills itself after that. <a class="btn sm pri" href="#oils" style="margin-left:6px">Add the first oil</a></div>' : '') + `
    <div class="hero"><div class="k">Inventory manager</div><h2>${todo ? todo + ' things need you today' : 'Everything is covered today'}</h2><p>${c.out} oil out of stock, ${c.low} below minimum, ${k.late_orders} orders will be late if nothing is bought.</p>
      <div class="nums"><div><div class="l">Oil in stock</div><div class="v">${fmt(k.total_ml / 1000, 1)} L</div></div><div><div class="l">Stock value</div><div class="v">${inr(k.value)}</div></div><div><div class="l">Perfumes</div><div class="v">${fmt(k.perfumes)}</div></div><div><div class="l">Open orders</div><div class="v">${k.open_orders}</div></div><div><div class="l">Orders at risk</div><div class="v">${k.late_orders}</div></div></div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><a class="btn go" href="#alerts">Open alerts (${k.alerts})</a><a class="btn" href="#calc">Check an order</a><a class="btn" href="#dealers">Message dealers</a></div></div>
    <div class="g g21"><div class="sx-card"><h3>Needs attention</h3><div class="stack">${d.alerts.map(alertHtml).join('') || '<div class="empty">Nothing needs attention.</div>'}</div></div><div class="sx-card"><h3>Stock health</h3>${donut}</div></div>
    <div class="g g2" style="margin-top:12px"><div class="sx-card"><h3>Orders that will be late <small>if you do nothing</small></h3>${d.late.length ? '<div class="sc"><table class="tbl"><thead><tr><th>Order</th><th>Oil missing</th><th>Result</th></tr></thead><tbody>' + d.late.map((o) => '<tr><td><b>' + esc(o.code) + '</b><div class="note">' + esc(o.customer) + ' · due ' + dS(o.due_date) + '</div></td><td>' + (o.sim.short ? Object.keys(o.sim.short).length : 0) + ' oil(s)</td><td><span class="pill bad">about ' + Math.max(1, o.sim.late_by) + ' days late</span></td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">No order is at risk.</div>'}</div>
    <div class="sx-card"><h3>Suggested purchase <small>ready to send</small></h3>${d.buy.length ? '<div class="sc"><table class="tbl"><thead><tr><th>Oil</th><th>Dealer</th><th class="num">Buy</th><th></th></tr></thead><tbody>' + d.buy.map((b) => '<tr><td><b>' + esc(b.oil) + '</b><div class="note">' + fmt(b.stock_ml) + ' ml left</div></td><td>' + esc(b.supplier || '—') + '</td><td class="num">' + fmt(b.qty_ml) + ' ml<div class="note">' + inr(b.est) + '</div></td><td><button class="btn sm wa" data-wa="' + b.oil_id + '" data-q="' + b.qty_ml + '">WhatsApp</button></td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">Nothing to buy now.</div>'}</div></div>
    <div class="sx-card" style="margin-top:12px"><h3>Latest stock movement</h3>${d.recent.length ? d.recent.map((m) => '<div class="note" style="padding:5px 0;border-top:1px solid #eef0f3"><b style="color:#14161a">' + esc(m.oil) + '</b> · ' + ({ in: 'delivery', out: 'used', count: 'count', return: 'returned', open: 'opening stock' }[m.kind] || m.kind) + ' <b style="color:' + (m.qty_ml < 0 ? '#d9423b' : '#16945a') + '">' + (m.qty_ml > 0 ? '+' : '') + fmt(m.qty_ml, 1) + ' ml</b> · balance ' + fmt(m.balance_ml) + ' ml · ' + esc(m.created_at.slice(5, 16)) + ' ' + esc(m.ref || '') + '</div>').join('') : '<div class="empty">No movement yet.</div>'}</div>`;
  }

  /* ---------- oil stock ---------- */
  let OF = { q: '', f: '', off: 0 };
  async function vOils() {
    $('root').innerHTML = '<div class="sx-card"><div class="bar"><input class="grow" id="oq" placeholder="Search oils by name, code or dealer" value="' + esc(OF.q) + '"><select id="of"><option value="">All</option><option value="action">Needs action</option><option value="watch">Running down</option><option value="ok">Healthy</option></select><span class="sp"></span><button class="btn" id="oExp">Export CSV</button><button class="btn" id="oAdd">+ Add oil</button><button class="btn pri" id="oRec">+ Record delivery</button></div><div class="sc"><table class="tbl"><thead><tr><th>Oil</th><th>Dealer</th><th>Stock level</th><th class="num">In stock</th><th class="num">Minimum</th><th class="num">Used</th><th class="num">Days left</th><th>Status</th></tr></thead><tbody id="orows"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody></table></div><div class="bar" style="margin-top:10px"><span class="note" id="ocount"></span><span class="sp"></span><button class="btn sm" id="oPrev">Previous</button><button class="btn sm" id="oNext">Next</button></div><p class="note" style="margin:6px 0 0">The thin black mark on each bar is the minimum. Click a row for its history, perfumes and dealer.</p></div>';
    $('of').value = OF.f; let t = null;
    $('oq').oninput = (e) => { clearTimeout(t); t = setTimeout(() => { OF.q = e.target.value; OF.off = 0; drawOils(); }, 250); }; $('of').onchange = (e) => { OF.f = e.target.value; OF.off = 0; drawOils(); };
    $('oAdd').onclick = () => oilForm(); $('oRec').onclick = () => recvForm(); $('oPrev').onclick = () => { OF.off = Math.max(0, OF.off - 40); drawOils(); }; $('oNext').onclick = () => { OF.off += 40; drawOils(); };

  async function vAlerts() {
    const [d, st] = await Promise.all([G('iv.alerts'), G('iv.settings')]), s = st.settings;
    $('root').innerHTML = '<div class="g g21"><div class="sx-card"><h3>Open alerts <small>' + d.alerts.length + '</small></h3><div class="stack">' + (d.alerts.map(alertHtml).join('') || '<div class="empty">All clear. Nothing needs attention.</div>') + '</div></div><div class="sx-card"><h3>Rules behind the alerts</h3><div class="fld"><label>Safety days (extra days of oil kept beyond delivery time)</label><input id="kS" type="number" min="0" value="' + esc(s.safety_days) + '"></div><div class="fld"><label>Look back for daily use (days)</label><input id="kW" type="number" min="7" value="' + esc(s.window_days) + '"></div><div class="fld"><label>Default oil strength (%)</label><input id="kD" type="number" min="1" max="60" value="' + esc(s.default_pct) + '"></div><div class="fld"><label>Extra oil for wastage (%)</label><input id="kA" type="number" min="0" max="20" step="0.5" value="' + esc(s.wastage_pct) + '"></div><div class="fld"><label>Buy in steps of (ml)</label><input id="kR" type="number" min="10" value="' + esc(s.buy_round_ml) + '"></div><div class="fld"><label>Buy enough for (days after delivery)</label><input id="kT" type="number" min="7" value="' + esc(s.target_days) + '"></div><button class="btn pri" id="kSave">Save rules</button><p class="note" style="margin:8px 0 0">Alerts: out of stock · below minimum · shortage predicted · late order · delivery overdue · payment unpaid for 7+ days. Only Admin can change the rules.</p></div></div>';
    $('kSave').onclick = async () => { try { await P('iv.settings', { safety_days: +$('kS').value, window_days: +$('kW').value, default_pct: +$('kD').value, wastage_pct: +$('kA').value, buy_round_ml: +$('kR').value, target_days: +$('kT').value }); toast('Rules saved'); redo(); } catch (e) { fail(e); } };
  }

  /* ---------- reports ---------- */
  let RP = 'weekly';
  const bars = (vals, labels, color) => { const W = 620, H = 200, L = 44, B = 24, T = 8, n = vals.length, mx = Math.max(1, ...vals) * 1.15, bw = (W - L - 6) / n; let g = ''; for (let i = 0; i <= 4; i++) { const y = T + (H - B - T) * (1 - i / 4); g += '<line x1="' + L + '" x2="' + (W - 4) + '" y1="' + y + '" y2="' + y + '" stroke="#e6e8ec"/><text x="' + (L - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + fmt(mx * i / 4 / 1000, 1) + '</text>'; } return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img">' + g + vals.map((v, i) => { const h = (H - B - T) * v / mx; return '<rect x="' + (L + i * bw + bw * .18) + '" y="' + (H - B - h) + '" width="' + (bw * .64) + '" height="' + h + '" rx="3" fill="' + color + '"/>'; }).join('') + labels.map((l, i) => (n <= 8 || i % 2 === 0) ? '<text x="' + (L + i * bw + bw / 2) + '" y="' + (H - 7) + '" text-anchor="middle">' + esc(l) + '</text>' : '').join('') + '</svg>'; };
  async function vReports() {
    const d = await G('iv.reports', { period: RP }), U = d.used.reduce((a, b) => a + b, 0), Bq = d.bought.reduce((a, b) => a + b, 0), tm = Math.max(1, ...d.top.map((x) => x.used_ml));
    $('root').innerHTML = '<div class="bar"><div class="tabs2" style="margin:0">' + [['daily', 'Daily'], ['weekly', 'Weekly'], ['monthly', 'Monthly']].map(([k, l]) => '<button data-rp="' + k + '" class="' + (RP === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>' +
      '<div class="g g4"><div class="sx-card"><div class="note">Oil available</div><div class="v" style="font-size:24px;font-weight:700">' + fmt(d.total_ml / 1000, 1) + ' L</div></div><div class="sx-card"><div class="note">Oil used</div><div class="v" style="font-size:24px;font-weight:700">' + fmt(U / 1000, 1) + ' L</div></div><div class="sx-card"><div class="note">Oil bought</div><div class="v" style="font-size:24px;font-weight:700">' + fmt(Bq / 1000, 1) + ' L</div><div class="note">' + inr(d.spend) + ' spent</div></div><div class="sx-card"><div class="note">Unpaid to dealers</div><div class="v" style="font-size:24px;font-weight:700;color:' + (d.unpaid ? '#d9423b' : '#16945a') + '">' + inr(d.unpaid) + '</div></div></div>' +
      '<div class="g g2" style="margin-top:12px"><div class="sx-card"><h3>Oil consumption <small>litres</small></h3>' + bars(d.used, d.labels, '#ff7a2f') + '</div><div class="sx-card"><h3>Oil purchased <small>litres</small></h3>' + bars(d.bought, d.labels, '#2a78d6') + '</div></div>' +
      '<div class="g g2" style="margin-top:12px"><div class="sx-card"><h3>Most used oils <small>last 30 days</small></h3><div class="stack">' + (d.top.filter((x) => x.used_ml > 0).map((o) => '<div><div style="display:flex;justify-content:space-between"><span>' + esc(o.name) + '</span><span class="note">' + fmt(o.used_ml) + ' ml</span></div><div class="meter"><i style="width:' + (o.used_ml / tm * 100) + '%;background:#ff7a2f"></i></div></div>').join('') || '<div class="empty">No oil used yet.</div>') + '</div></div><div class="sx-card"><h3>Production capacity <small>with today’s stock</small></h3><div class="eq">' + [20, 50, 100].map((s) => '<div><div class="l">' + s + ' ml bottles</div><div class="v">' + fmt(d.capacity[s]) + '</div><div class="note">per perfume, average</div></div>').join('') + '</div><p class="note" style="margin:10px 0 0">Capacity is how many bottles each perfume can still be made from its oil.</p></div></div>';
    $('root').querySelectorAll('[data-rp]').forEach((b) => { b.onclick = () => { RP = b.dataset.rp; redo(); }; });
  }

  /* ---------- shared clicks ---------- */
  async function waOpen(oilId, qty) {
    try {
      const m = await G('iv.message', { oil_id: oilId, qty_ml: qty || 0 });
      openDr('Message ' + (m.supplier || 'dealer'), '<div class="sx-card"><div class="note">Written from your stock. Check it, then send.</div><div class="msg" id="mTxt">' + esc(m.text) + '</div><div class="note">Dealer number: <b style="color:#14161a">' + esc(m.phone || 'not saved') + '</b></div>' + (m.phone ? '' : '<div class="note" style="color:#d9423b">Add the dealer’s phone on the Dealers page.</div>') + '</div>', (m.wa_url ? '<a class="btn wa" target="_blank" rel="noopener" href="' + esc(m.wa_url) + '">Open WhatsApp</a>' : '') + '<button class="btn" id="mCopy">Copy message</button>' + (m.tel_url ? '<a class="btn" href="' + esc(m.tel_url) + '">Call</a>' : ''));
      $('mCopy').onclick = (e) => { try { navigator.clipboard.writeText(m.text).then(() => { e.target.textContent = 'Copied'; }, () => { e.target.textContent = 'Select the text and copy'; }); } catch (x) { e.target.textContent = 'Select the text and copy'; } };
    } catch (e) { fail(e); }
  }
  document.addEventListener('click', async (e) => {
    const t = e.target.closest('button,a,tr'); if (!t) return; const D = t.dataset || {};
    if (D.wa) return waOpen(+D.wa, +D.q || 0);
    if (D.call) { try { const m = await G('iv.message', { oil_id: +D.call }); openDr('Call ' + (m.supplier || 'dealer'), '<div class="sx-card"><div style="font-size:26px;font-weight:800">' + esc(m.phone || 'No number saved') + '</div></div>', m.tel_url ? '<a class="btn pri" href="' + esc(m.tel_url) + '">Call now</a>' : ''); } catch (x) { fail(x); } return; }
    if (D.po) { try { const r = await P('iv.purchase_create', { oil_id: +D.po, qty_ml: +D.q || 0 }); toast('Purchase ' + r.code + ' created. Delivery expected ' + dS(r.expected_at)); if (CUR === 'dealers' || CUR === 'oils' || CUR === 'dashboard' || CUR === 'alerts') redo(); } catch (x) { fail(x); } return; }
    if (D.cm) { try { const m = await G('iv.order_message', { id: +D.cm }); openDr('Delay message to customer', '<div class="sx-card"><div class="msg">' + esc(m.text) + '</div></div>', '<button class="btn pri" id="mCopy">Copy message</button>'); $('mCopy').onclick = (ev) => { try { navigator.clipboard.writeText(m.text).then(() => { ev.target.textContent = 'Copied'; }, () => {}); } catch (x) { /* manual copy */ } }; } catch (x) { fail(x); } return; }
    if (t.tagName === 'TR' && D.oil) return oilDetail(+D.oil);
    if (t.tagName === 'TR' && D.perf) { const row = (window.__PERF || []).find((p) => p.id === +D.perf); if (row) perfForm(row); return; }
    if (D.act) { const id = +D.id; if (D.act === 'cancel' && t.dataset.sure !== '1') { t.dataset.sure = '1'; t.textContent = 'Sure? Cancel'; setTimeout(() => { if (t.isConnected) { t.dataset.sure = ''; t.textContent = 'Cancel'; } }, 3000); return; } try { await P('iv.order_act', { id, act: D.act }); toast({ issue: 'Production started, oil taken out of stock', ready: 'Marked ready', dispatch: 'Dispatched', cancel: 'Order cancelled' }[D.act]); redo(); } catch (x) { fail(x); } return; }
    if (D.edit) { const o = (window.__ORD || []).find((x) => x.id === +D.edit); if (o) orderForm(o); return; }
    if (D.se) { const s = (window.__SUP || []).find((x) => x.id === +D.se); if (s) supForm(s); return; }
    if (D.sh) { try { const r = await G('iv.purchases', { supplier_id: +D.sh, status: 'all', limit: 50 }); openDr('Purchase history', '<div class="sx-card sc"><table class="tbl"><thead><tr><th>Date</th><th>Oil</th><th class="num">ml</th><th class="num">₹/ml</th><th class="num">Total</th><th>Status</th></tr></thead><tbody>' + (r.purchases.map((p) => '<tr><td>' + dS(p.ordered_at) + '</td><td>' + esc(p.oil || '') + '</td><td class="num">' + fmt(p.qty_ml) + '</td><td class="num">' + fmt(p.price_per_ml, 2) + '</td><td class="num">' + inr(p.total) + '</td><td>' + esc(p.status) + (p.status === 'received' ? (p.paid == 1 ? ' · paid' : ' · unpaid') : '') + '</td></tr>').join('') || '<tr><td colspan="6" class="empty">No purchase yet.</td></tr>') + '</tbody></table></div>'); } catch (x) { fail(x); } return; }
    if (D.prec) { const p = (window.__PUR || []).find((x) => x.id === +D.prec); if (p) { await opts(); recvForm(p.oil_id, p); } return; }
    if (D.pcan) { try { await P('iv.purchase_act', { id: +D.pcan, act: 'cancel' }); toast('Purchase cancelled'); redo(); } catch (x) { fail(x); } return; }
    if (D.ppaid) { try { await P('iv.purchase_act', { id: +D.ppaid, act: 'paid' }); toast('Marked paid'); redo(); } catch (x) { fail(x); } return; }
  });

  route();
</script>
</body>
</html>

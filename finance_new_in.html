<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Finance New · Incoming — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=260928b">
<link rel="stylesheet" href="assets/css/store.css?v=6">
<style>
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar .sp{flex:1}
  .nav{display:flex;gap:4px;align-items:center;background:#fff;border-radius:999px;padding:3px 6px;box-shadow:inset 0 0 0 1.5px var(--sx-line)}
  .nav button{border:0;background:none;width:34px;height:34px;border-radius:12px;font-size:18px;font-weight:800;cursor:pointer}.nav button:hover{background:var(--sx-bg)}.nav button:disabled{opacity:.3;cursor:default}
  .nav input{border:0;background:none;font:800 14px inherit;min-height:34px;padding:0 4px}
  .sec{margin-bottom:16px}.sec>h2{font-size:17px;margin:0 0 2px}.sec>.hint{font-size:12.5px;color:var(--sx-mut);margin-bottom:10px}
  .k3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}@media (max-width:760px){.k3{grid-template-columns:1fr}}
  .k{background:#fff;border-radius:18px;box-shadow:0 0 0 1px var(--sx-line);padding:12px 14px}.k small{display:block;color:var(--sx-mut);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .k b{display:block;font-size:22px;margin-top:2px;font-variant-numeric:tabular-nums}.k span{font-size:12px;color:var(--sx-mut)}.k.bad b{color:#b42318}
  .tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--sx-mut);text-align:right;padding:4px 6px;white-space:nowrap}.tb th:first-child,.tb td:first-child{text-align:left}
  .tb td{padding:7px 6px;border-top:1px solid var(--sx-line);text-align:right;white-space:nowrap}.tb td small{display:block;color:var(--sx-mut);font-size:11px}.tb tr.void td{opacity:.45;text-decoration:line-through}
  .age{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:800;background:#eef0f3;color:#475467}.age.w{background:#fff4e0;color:#b45309}.age.b{background:#fdecea;color:#b42318}
  .wrap{overflow-x:auto}.cap{font-weight:800;font-size:13px;margin:12px 0 4px}
  .tb tr.tot td{font-weight:800;border-top:2px solid var(--sx-ink);background:#eef0f6}.tb tr.off td{opacity:.5}
  .ov{position:fixed;inset:0;background:rgba(20,22,26,.42);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}.ov.on{opacity:1;pointer-events:auto}
  .dr{position:fixed;top:0;right:0;bottom:0;width:min(500px,96vw);background:var(--sx-bg);z-index:41;display:flex;flex-direction:column;transform:translateX(104%);transition:transform .22s cubic-bezier(.2,.8,.2,1);box-shadow:-18px 0 50px rgba(20,22,26,.22);border-radius:26px 0 0 26px}.dr.on{transform:none}
  @media (max-width:640px){.dr{width:100%;border-radius:0}}
  .dr.wide{width:min(780px,96vw)}@media (max-width:640px){.dr.wide{width:100%}}
  .drop{display:block;border:2px dashed var(--sx-line);border-radius:16px;padding:18px 12px;text-align:center;background:#fff;cursor:pointer;color:var(--sx-mut);font-weight:700;margin-top:10px}.drop:hover{border-color:var(--sx-accent);color:var(--sx-ink)}.drop small{display:block;font-weight:600;margin-top:3px}
  .lnkb{border:0;background:none;font:800 13.5px inherit;color:var(--sx-ink);padding:0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}.lnkb:hover{color:var(--sx-accent)}
  .dr-h{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-radius:26px 0 0 0;box-shadow:0 1px 0 var(--sx-line)}@media (max-width:640px){.dr-h{border-radius:0}}
  .dr-h b{font-size:16px;flex:1}.dr-x{border:0;background:var(--sx-bg);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;font-weight:700}
  .dr-b{flex:1;overflow-y:auto;padding:12px 14px;display:grid;gap:10px;align-content:start}.dr-f{padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -1px 0 var(--sx-line)}
  .dr .sx-card{padding:12px 14px;border-radius:18px;box-shadow:none;border:1px solid var(--sx-line)}.dr .sx-in{min-height:38px;padding:7px 10px;font-size:14px}
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><div><h1>Finance New · Incoming</h1><div class="sub" style="font-size:12.5px;color:var(--muted);margin-top:2px">Your two major incomes: Prepaid and COD</div></div></div>
    <div class="content"><div class="sx-page" id="root"><div class="sx-card sx-mut">Loading…</div></div></div>
  </main>
</div>
<div class="ov" id="ov"></div>
<aside class="dr" id="dr" aria-hidden="true"><div class="dr-h"><b id="drT"></b><button class="dr-x" id="drX" aria-label="Close">×</button></div><div class="dr-b" id="drB"></div><div class="dr-f" id="drF"></div></aside>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/api.js?v=13"></script>
<script src="assets/js/layout.js?v=32"></script>
<script src="assets/js/store_common.js?v=3"></script>
<script>
  guardPage();
  renderSidebar('fn_in');
  const m2 = (n) => '₹' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const dFmt = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  const addDays = (d, n) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
  const ageCls = (a) => a >= 10 ? 'b' : a >= 4 ? 'w' : '';
  // the two sections: key = the channel in the original Finance books
  const SEC = [
    { key: 'online_prepaid', title: 'Prepaid', hint: 'Online orders paid in advance (the gateway pays you later: Razorpay, PayU, Snapmint…)' },
    { key: 'online_cod', title: 'COD', hint: 'Online orders paid on delivery (the courier sends you the money later: ShipRocket, Rapidshyp…)' },
  ];
  let day = '', O = null, W = {}, CH = null, DAYE = [], ACC = [];
  const SECKEY = { online_prepaid: 'prepaid', online_cod: 'cod' };
  const open = (title, body, foot, wide) => { $('drT').textContent = title; $('drB').innerHTML = body; $('drF').innerHTML = foot || ''; $('drF').style.display = foot ? '' : 'none'; $('dr').classList.toggle('wide', !!wide); $('dr').classList.add('on'); $('ov').classList.add('on'); $('dr').setAttribute('aria-hidden', 'false'); };
  const close = () => { $('dr').classList.remove('on'); $('ov').classList.remove('on'); $('dr').setAttribute('aria-hidden', 'true'); };
  $('drX').onclick = close; $('ov').onclick = close; document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  const note = (id, m, bad) => { const e = $(id); if (e) e.innerHTML = m ? `<div class="sx-msg ${bad ? 'bad' : 'ok'}">${sxi(bad ? 'xc' : 'ok')}<span>${esc(m)}</span></div>` : ''; };

  function channelsCard(s) {
    if (!CH) return '';
    const sk = SECKEY[s.key], list = CH.channels[sk] || [];
    const live = list.filter((c) => c.active), tD = live.reduce((a, c) => a + c.day, 0), tM = live.reduce((a, c) => a + c.month, 0);
    return `<div class="sx-card wrap" style="margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><div class="cap" style="margin:0;flex:1">${esc(s.title)} channels <small class="sx-mut">net money received · click a channel to open it and upload its UTR file</small></div><button class="sx-btn" data-addch="${sk}" style="padding:2px 12px">+ Add channel</button></div>
      ${list.length ? `<table class="tb"><tr><th>Channel</th><th>Net on ${esc(dFmt(day))}</th><th>Net this month</th><th></th></tr>${list.map((c) => `<tr class="${c.active ? '' : 'off'}"><td><button class="lnkb" data-open="${c.id}" title="Open ${esc(c.name)}">${esc(c.name)}</button>${c.active ? '' : ' <small>hidden</small>'}</td><td>${c.day ? '<b>' + m2(c.day) + '</b>' : '<span class="sx-mut">—</span>'}${c.fee_day ? '<small>gross ' + m2(c.gross_day) + ' · charges ' + m2(c.fee_day) + '</small>' : ''}</td><td>${c.month ? m2(c.month) : '<span class="sx-mut">—</span>'}${c.fee_month ? '<small>gross ' + m2(c.gross_month) + ' · charges ' + m2(c.fee_month) + '</small>' : ''}</td><td style="white-space:nowrap"><button class="sx-btn" data-addrec="${c.id}" style="padding:2px 10px">+ Receipt</button> <button class="sx-btn" data-edch="${c.id}" style="padding:2px 10px">Edit</button></td></tr>`).join('')}
        <tr class="tot"><td>TOTAL</td><td>${m2(tD)}</td><td>${m2(tM)}</td><td></td></tr></table>` : `<div class="sx-mut">No channel yet. Click “+ Add channel”.</div>`}
      ${enteredTable(list)}</div>`;
  }
  function enteredTable(list) {
    const byHead = {}; list.forEach((c) => { if (c.head_id) byHead[c.head_id] = c; });
    const rows = DAYE.filter((e) => e.side === 'in' && byHead[e.head_id]);
    if (!rows.length) return '';
    return `<div class="cap">Receipts entered on ${esc(dFmt(day))} <small class="sx-mut">they also show on the Receipt and Payment tab</small></div><table class="tb"><tr><th>Channel</th><th>Bank</th><th>Note</th><th>Amount</th><th></th></tr>${rows.map((e) => `<tr class="${e.status === 'void' ? 'void' : ''}"><td><b>${esc(byHead[e.head_id].name)}</b></td><td>${esc(e.account)}</td><td style="text-align:left">${esc(e.note)}${e.status === 'void' ? ' <small>(cancelled: ' + esc(e.void_reason) + ')</small>' : ''}${e.edited ? ' <small class="sx-mut">(edited)</small>' : ''}</td><td><b>${m2(e.amount)}</b></td><td style="white-space:nowrap">${e.status === 'ok' ? `<button class="sx-btn" data-edrec="${e.id}" style="padding:2px 10px">Edit</button> <button class="sx-btn" data-voidrec="${e.id}" style="padding:2px 10px">Cancel</button>` : ''}</td></tr>`).join('')}</table>`;
  }
  // ---------- one channel opened: its UTR files
  const colName = (h, i) => (i + 1) + '. ' + (h[i] || '(empty)');
  async function chSection(id) {
    const c = Object.values(CH.channels).flat().find((x) => x.id === id); if (!c) return;
    let ups = []; try { ups = (await api.get('fn.in_uploads', { channel_id: id })).uploads; } catch (e) { ups = []; }
    const mo = new Date(CH.month_from + 'T00:00:00').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    open(c.name + ' · ' + (CH.channels.cod.some((x) => x.id === id) ? 'COD' : 'Prepaid'), `
      <div class="k3" style="margin-bottom:0"><div class="k"><small>Net income · ${esc(mo)}</small><b>${m2(c.month)}</b><span>${c.files_month || 0} file${c.files_month === 1 ? '' : 's'} + receipts</span></div>
        <div class="k"><small>Gross from files</small><b>${m2(c.gross_month)}</b><span>before charges</span></div>
        <div class="k"><small>Charges taken</small><b>${m2(c.fee_month)}</b><span>fees + GST</span></div></div>
      <div class="sx-card"><div class="cap" style="margin-top:0">Upload the UTR file</div>
        <div class="sx-r2"><label class="sx-f">Day the money came<input class="sx-in" id="uDay" type="date" value="${esc(day)}" max="${esc(O.today)}"></label>
        <label class="sx-f">Orders of day <small class="sx-mut">(T+1: the day before)</small><input class="sx-in" id="uOd" type="date" value="${esc(addDays(day, -1))}" max="${esc(O.today)}"></label></div>
        <label class="sx-f" style="margin-top:8px">Came into (bank)<select class="sx-in" id="uAcc">${ACC.map((a) => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label>
        <label class="drop" for="uFile">Choose the settlement / UTR file (.xlsx or .csv)<small>The columns are found by themselves; you can correct them before saving.</small></label><input type="file" id="uFile" accept=".xlsx,.csv,.txt,.tsv" style="display:none">
        <div id="uMsg" style="margin-top:8px"></div><div id="uPrev"></div></div>
      <div id="uRecon"></div>
      <div class="sx-card wrap"><div class="cap" style="margin-top:0">Files saved for ${esc(c.name)}</div>
        ${ups.length ? `<table class="tb"><tr><th>Day</th><th>File</th><th>Rows</th><th>Gross</th><th>Charges</th><th>Net</th><th></th></tr>${ups.map((u) => `<tr class="${u.status === 'void' ? 'void' : ''}"><td>${esc(dFmt(u.day))}<small>${esc(u.account)}</small></td><td style="text-align:left">${esc(u.file)}${u.status === 'void' ? '<small>cancelled: ' + esc(u.void_reason) + '</small>' : u.orders_day ? '<small>orders of ' + esc(dFmt(u.orders_day)) + '</small>' : ''}</td><td>${u.rows}</td><td>${m2(u.gross)}</td><td>${m2(u.fee)}</td><td><b>${m2(u.net)}</b></td><td style="white-space:nowrap">${u.status === 'ok' && u.has_recon ? `<button class="sx-btn" data-uprec="${u.id}" style="padding:2px 10px">Compare</button> ` : ''}${u.status === 'ok' ? `<button class="sx-btn" data-upvoid="${u.id}" data-ch="${id}" style="padding:2px 10px">Cancel</button>` : ''}</td></tr>`).join('')}</table>` : '<div class="sx-mut">No file yet.</div>'}</div>
      <button class="sx-btn" data-addrec="${id}">+ Add a receipt without a file</button>`, '', true);
    if (!ACC.length) $('uMsg').innerHTML = '<div class="sx-msg warn">' + sxi('alert') + '<span>Add a bank first: Finance New → Bank Accounts.</span></div>';
    $('uFile').onchange = async () => {
      const f = $('uFile').files[0]; if (!f) return; $('uPrev').innerHTML = ''; $('uMsg').innerHTML = `<div class="sx-mut">Reading ${esc(f.name)} …</div>`;
      try { const fd = new FormData(); fd.append('file', f); fd.append('channel_id', id); const p = await api.upload('fn.in_upload_preview', fd); $('uMsg').innerHTML = ''; uPreview(id, p); }
      catch (e) { note('uMsg', e.message, 1); }
    };
  }
  // ---------- the comparison: your prepaid orders of a day against the settlement file
  function renderRecon(el, rc, title) {
    let filt = 'all', all = false;
    const draw2 = () => {
      const rows = rc.orders.filter((o) => filt === 'all' || (filt === 'came' ? o.found : !o.found)), shown = all ? rows : rows.slice(0, 40);
      const chg = rc.charges.length ? rc.charges.map((c) => `<tr><td style="text-align:left">${esc(c.name)}</td><td>${m2(c.amount)}</td><td>${rc.found.gross ? (100 * c.amount / rc.found.gross).toFixed(2) + '%' : ''}</td></tr>`).join('') + `<tr class="tot"><td>Total charges cut</td><td>${m2(rc.found.fee)}</td><td>${rc.found.gross ? (100 * rc.found.fee / rc.found.gross).toFixed(2) + '%' : ''}</td></tr>` : '';
      el.innerHTML = `<div class="sx-card wrap"><div class="cap" style="margin-top:0">${esc(title)} <small class="sx-mut">prepaid orders of ${esc(dFmt(rc.orders_day))}</small></div>
        ${rc.expected.orders ? '' : `<div class="sx-msg warn">${sxi('alert')}<span>No prepaid order found for ${esc(dFmt(rc.orders_day))}. Check the “Orders of day”.</span></div>`}
        <div class="k3" style="margin-bottom:8px"><div class="k"><small>Prepaid orders</small><b style="font-size:19px">${rc.expected.orders}</b><span>${m2(rc.expected.amount)}</span></div><div class="k"><small>Money came for</small><b style="font-size:19px">${rc.found.orders}</b><span>gross ${m2(rc.found.gross)}</span></div><div class="k ${rc.missing.orders ? 'bad' : ''}"><small>Not in this file</small><b style="font-size:19px">${rc.missing.orders}</b><span>${m2(rc.missing.amount)}</span></div></div>
        <div class="k3" style="margin-bottom:8px"><div class="k"><small>Gross (these orders)</small><b style="font-size:19px">${m2(rc.found.gross)}</b></div><div class="k"><small>Charges cut (these orders)</small><b style="font-size:19px">${m2(rc.found.fee)}</b><span>${rc.found.gross ? (100 * rc.found.fee / rc.found.gross).toFixed(2) + '% of gross' : ''}</span></div><div class="k"><small>Net (these orders)</small><b style="font-size:19px">${m2(rc.found.net)}</b></div></div>
        ${chg ? `<div class="cap">Charges bifurcation</div><table class="tb"><tr><th>Charge</th><th>Amount</th><th>% of gross</th></tr>${chg}</table>` : ''}
        <div class="cap" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">Orders <button class="sx-btn" data-rf="all" style="padding:2px 10px;${filt === 'all' ? '' : 'opacity:.55'}">All ${rc.orders.length}</button><button class="sx-btn" data-rf="came" style="padding:2px 10px;${filt === 'came' ? '' : 'opacity:.55'}">Money came ${rc.found.orders}</button><button class="sx-btn" data-rf="miss" style="padding:2px 10px;${filt === 'miss' ? '' : 'opacity:.55'}">Not in file ${rc.missing.orders}</button></div>
        ${shown.length ? `<table class="tb"><tr><th>Order</th><th>Customer</th><th>Order amt</th><th>Status</th><th>Gross</th><th>Charges</th><th>Net</th><th>UTR</th></tr>${shown.map((o) => `<tr><td><b>${esc(o.name)}</b></td><td style="text-align:left">${esc(o.customer)}</td><td>${m2(o.amount)}</td><td>${o.found ? '<span class="age" style="background:#e3f6ee;color:#0d7a55">came</span>' : '<span class="age b">not in file</span>'}${o.differs ? ' <span class="age w" title="The file amount is different from the order amount">differs</span>' : ''}</td><td>${o.found ? m2(o.gross) : ''}</td><td>${o.found ? m2(o.fee) : ''}</td><td>${o.found ? '<b>' + m2(o.net) + '</b>' : ''}</td><td style="font-size:11.5px">${esc(o.utr)}</td></tr>`).join('')}</table>${rows.length > 40 && !all ? `<div style="padding:8px 0"><button class="sx-btn" data-rall="1">Show all ${rows.length}</button></div>` : ''}${rc.truncated ? '<div class="sx-mut" style="font-size:12px">Only the first 600 orders are listed.</div>' : ''}` : '<div class="sx-mut">None.</div>'}
        ${rc.other_rows.rows ? `<div class="cap">In the file but not an order of ${esc(dFmt(rc.orders_day))} <small class="sx-mut">${rc.other_rows.rows} row${rc.other_rows.rows === 1 ? '' : 's'} · net ${m2(rc.other_rows.net)} (older orders, other gateway orders, or no order number)</small></div><table class="tb"><tr><th>UTR</th><th>Gross</th><th>Charges</th><th>Net</th></tr>${rc.other_rows.list.slice(0, 10).map((r) => `<tr><td style="text-align:left">${esc(r.utr)}</td><td>${m2(r.gross)}</td><td>${m2(r.fee)}</td><td>${m2(r.net)}</td></tr>`).join('')}</table>` : ''}</div>`;
      el.querySelectorAll('[data-rf]').forEach((b) => { b.onclick = () => { filt = b.dataset.rf; all = false; draw2(); }; });
      const ra = el.querySelector('[data-rall]'); if (ra) ra.onclick = () => { all = true; draw2(); };
    };
    draw2();
  }
  async function showRecon(id) { try { const r = await api.get('fn.in_upload_recon', { id }); renderRecon($('uRecon'), r.recon, 'Saved file: ' + r.file); $('uRecon').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) { alert(e.message); } }
  function uPreview(id, p) {
    const H = p.header, M = { utr: p.cols.utr, gross: p.cols.gross, net: p.cols.net, order: p.cols.order, fees: p.cols.fees.slice() };
    const sel = (k, label) => `<label class="sx-f">${label}<select class="sx-in" data-m="${k}"><option value="-1">— none —</option>${H.map((_, i) => H[i] === '' ? '' : `<option value="${i}" ${M[k] === i ? 'selected' : ''}>${esc(colName(H, i))}</option>`).join('')}</select></label>`;
    $('uPrev').innerHTML = `<div class="cap">${esc(p.file)} <small class="sx-mut">${p.rows} rows</small></div>
      ${p.same_file ? `<div class="sx-msg warn">${sxi('alert')}<span>This same file was already saved: ${esc(p.same_file)}.</span></div>` : ''}
      <div class="sx-r2">${sel('utr', 'UTR column')}${sel('net', 'Net amount column (money that reached the bank)')}</div>
      <div class="sx-r2" style="margin-top:8px">${sel('order', 'Order number / transaction ID column (to match your orders)')}${sel('gross', 'Gross amount column (optional)')}</div>
      <div class="sx-r2" style="margin-top:8px"><div class="sx-f">Charges columns (fees, GST…)<div style="display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px">${H.map((h, i) => h === '' ? '' : `<label style="display:flex;gap:4px;align-items:center;font-size:12.5px;font-weight:600"><input type="checkbox" class="mf" value="${i}" ${M.fees.includes(i) ? 'checked' : ''}>${esc(h)}</label>`).join('')}</div></div><div></div></div>
      <div id="uCalc" style="margin-top:10px"></div>
      <details style="margin-top:8px"><summary class="sx-mut" style="cursor:pointer;font-size:12.5px">First rows as read</summary><div class="wrap"><table class="tb"><tr>${H.map((h) => `<th>${esc(h)}</th>`).join('')}</tr>${p.sample.map((r) => `<tr>${H.map((_, i) => `<td>${esc(r[i] || '')}</td>`).join('')}</tr>`).join('')}</table></div></details>
      <button class="sx-btn big" id="uSave" style="margin-top:10px" disabled>Save</button>`;
    let last = null;
    const show = (r) => {
      last = r; const bad = r.dups > 0 || r.net <= 0;
      $('uCalc').innerHTML = `<div class="k3" style="grid-template-columns:repeat(4,1fr);margin-bottom:0"><div class="k"><small>Rows</small><b style="font-size:18px">${r.rows}</b><span>${r.utrs} UTR${r.utrs === 1 ? '' : 's'}</span></div><div class="k"><small>Gross</small><b style="font-size:18px">${m2(r.gross)}</b></div><div class="k"><small>Charges</small><b style="font-size:18px">${m2(r.fee)}</b></div><div class="k"><small>Net income</small><b style="font-size:18px">${m2(r.net)}</b></div></div>
        ${r.dups > 0 ? `<div class="sx-msg bad" style="margin-top:8px">${sxi('xc')}<span>${r.dups} UTR${r.dups === 1 ? ' is' : 's are'} already saved from ${esc(r.dup_first)}. Cancel that file first, or this money would be counted twice.</span></div>` : r.net <= 0 ? `<div class="sx-msg warn" style="margin-top:8px">${sxi('alert')}<span>No money found. Choose the UTR and the net amount column.</span></div>` : ''}`;
      $('uSave').disabled = bad; $('uSave').textContent = bad ? 'Save' : 'Save ' + m2(r.net) + ' as received';
    };
    const recalc = async () => {
      M.utr = +document.querySelector('[data-m="utr"]').value; M.net = +document.querySelector('[data-m="net"]').value; M.gross = +document.querySelector('[data-m="gross"]').value; M.order = +document.querySelector('[data-m="order"]').value; M.fees = [...document.querySelectorAll('.mf:checked')].map((x) => +x.value);
      try { const r = await api.post('fn.in_upload_calc', { upload_id: p.upload_id, cols: M, orders_day: $('uOd').value }); show(r); if (r.recon) renderRecon($('uRecon'), r.recon, 'Comparison with your orders'); else $('uRecon').innerHTML = ''; } catch (e) { note('uCalc', e.message, 1); }
    };
    $('uDay').onchange = () => { if (!$('uOd').dataset.own) $('uOd').value = addDays($('uDay').value, -1); recalc(); };
    $('uOd').onchange = () => { $('uOd').dataset.own = '1'; recalc(); };
    $('uPrev').querySelectorAll('select').forEach((x) => { x.onchange = recalc; }); $('uPrev').querySelectorAll('.mf').forEach((x) => { x.onchange = recalc; });
    show(Object.assign({ dup_first: p.calc.dup_first }, p.calc)); recalc();
    $('uSave').onclick = async () => {
      $('uSave').disabled = true;
      try { await api.post('fn.in_upload_commit', { upload_id: p.upload_id, cols: M, date: $('uDay').value, account_id: +$('uAcc').value, orders_day: $('uOd').value }); await load($('uDay').value); await chSection(id); $('uMsg').innerHTML = `<div class="sx-msg ok">${sxi('ok')}<span>Saved: ${m2(last.net)} net income. It is now on the Receipt and Payment tab too.</span></div>`; }
      catch (e) { note('uMsg', e.message, 1); $('uSave').disabled = false; }
    };
  }
  function recDrawer(chId, ent) {
    const all = Object.values(CH.channels).flat().filter((c) => c.active || (ent && c.head_id === ent.head_id));
    const cur = ent ? all.find((c) => c.head_id === ent.head_id) : all.find((c) => c.id === chId);
    if (!ACC.length) { alert('Add a bank first: Finance New → Bank Accounts.'); return; }
    open(ent ? 'Edit this receipt' : 'Add a receipt', `<div class="sx-card">
      <label class="sx-f">Channel<select class="sx-in" id="rC">${all.map((c) => `<option value="${c.id}" ${cur && cur.id === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
      <div class="sx-r2" style="margin-top:10px"><label class="sx-f">Date<input class="sx-in" id="rD" type="date" value="${esc(ent ? ent.day : day)}" max="${esc(O.today)}"></label>
      <label class="sx-f">Received in (bank)<select class="sx-in" id="rA">${ACC.map((a) => `<option value="${a.id}" ${ent && ent.account_id === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></label></div>
      <label class="sx-f" style="margin-top:10px">Amount (₹)<input class="sx-in" id="rM" type="number" step="0.01" inputmode="decimal" placeholder="0" value="${ent ? ent.amount : ''}"></label>
      <label class="sx-f" style="margin-top:10px">Note (optional)<input class="sx-in" id="rN" maxlength="255" autocomplete="off" value="${ent ? esc(ent.note) : ''}"></label>
      <div class="sx-mut" style="font-size:12px;margin-top:6px">This also appears on the Receipt and Payment tab, on this channel's line, and in the bank's balance.</div><div id="rMsg" style="margin-top:8px"></div></div>`,
      `<button class="sx-btn big" id="rOk">${ent ? 'Save changes' : 'Save receipt'}</button>`);
    $('rM').focus();
    $('rOk').onclick = async () => {
      try {
        const h = await api.post('fn.in_channel_head', { id: +$('rC').value });
        const body = { date: $('rD').value, side: 'in', head_id: h.head_id, account_id: +$('rA').value, amount: $('rM').value, note: $('rN').value };
        if (ent) await api.post('fn.entry_update', Object.assign({ id: ent.id }, body)); else await api.post('fn.entry_save', body);
        close(); await load($('rD').value);
      } catch (e) { note('rMsg', e.message, 1); }
    };
  }
  function chDrawer(sec, id) {
    const c = id ? Object.values(CH.channels).flat().find((x) => x.id === id) : null;
    const heads = CH.heads.filter((h) => h.active || (c && h.id === c.head_id));
    open(c ? 'Edit: ' + c.name : 'Add a ' + (sec === 'cod' ? 'COD' : 'Prepaid') + ' channel', `<div class="sx-card">
      <label class="sx-f">Channel name<input class="sx-in" id="cN" autocomplete="off" placeholder="e.g. Flipkart, Razorpay" value="${c ? esc(c.name) : ''}"></label>
      <label class="sx-f" style="margin-top:10px">Receipt line it uses<select class="sx-in" id="cH"><option value="0">— automatic —</option>${heads.map((h) => `<option value="${h.id}" ${c && c.head_id === h.id ? 'selected' : ''}>${esc(h.name)}</option>`).join('')}</select></label>
      <div class="sx-mut" style="font-size:12px;margin-top:6px">Leave it empty: a receipt line with the channel's name is created by itself the first time you add a receipt. Money added here shows on that line in the Receipt and Payment tab.</div>
      ${c ? `<label class="sx-f" style="margin-top:8px;display:flex;flex-direction:row;gap:6px;align-items:center"><input type="checkbox" id="cX" ${c.active ? '' : 'checked'}> Hide this channel</label>` : ''}<div id="cM" style="margin-top:8px"></div></div>`,
      `<button class="sx-btn big" id="cS">${c ? 'Save changes' : 'Add channel'}</button>`);
    $('cN').focus();
    $('cS').onclick = async () => {
      try { await api.post('fn.in_channel_save', { id: id || 0, section: sec, name: $('cN').value, head_id: +$('cH').value, active: c && $('cX').checked ? 0 : 1 }); close(); await load(day); }
      catch (e) { note('cM', e.message, 1); }
    };
  }
  function section(s) {
    const c = (O.channels || []).find((x) => x.key === s.key) || {};
    const w = W[s.key] || {}, list = (w.orders && w.orders.list) || [];
    const rec = (O.receipts || []).filter((r) => r.channel === s.key);
    const alive = rec.filter((r) => r.status === 'ok');
    return `<div class="sec"><h2>${esc(s.title)}</h2><div class="hint">${esc(s.hint)}</div>
      <div class="k3"><div class="k"><small>Booked on this day</small><b>${m2(c.booked_day)}</b><span>${c.orders_day || 0} order${c.orders_day === 1 ? '' : 's'}</span></div>
        <div class="k"><small>Received on this day</small><b>${m2(c.received_day)}</b><span>${alive.length} receipt${alive.length === 1 ? '' : 's'}</span></div>
        <div class="k ${c.outstanding > 0 ? 'bad' : ''}"><small>Still to come (all days)</small><b>${m2(c.outstanding)}</b><span>${c.oldest_age ? 'oldest day waiting ' + c.oldest_age + ' days' : 'nothing is late'}${c.advance ? ' · received ahead ' + m2(c.advance) : ''}</span></div></div>
      ${channelsCard(s)}
      <div class="sx-card wrap"><div class="cap" style="margin-top:0">Money received on ${esc(dFmt(day))}</div>
        ${rec.length ? `<table class="tb"><tr><th>No</th><th>Bank</th><th>Reference</th><th>Note</th><th>Amount</th></tr>${rec.map((r) => `<tr class="${r.status === 'void' ? 'void' : ''}"><td>${esc(r.no)}</td><td>${esc(r.account)}</td><td style="text-align:left">${esc(r.ref)}</td><td style="text-align:left">${esc(r.note || r.payer)}</td><td><b>${m2(r.amount)}</b></td></tr>`).join('')}</table>` : '<div class="sx-mut">No money received on this day.</div>'}
        <div class="cap">Orders still waiting for the money <small class="sx-mut">${w.orders ? w.orders.waiting + ' orders · ' + m2(w.orders.waiting_amount) : ''}</small></div>
        ${list.length ? `<table class="tb"><tr><th>Order</th><th>Customer</th><th>Placed</th><th>Waiting</th><th>Amount</th></tr>${list.slice(0, 40).map((o) => { const a = Math.max(0, Math.round((new Date(O.today + 'T00:00:00') - new Date(o.day + 'T00:00:00')) / 86400000)); return `<tr><td><b>${esc(o.name)}</b></td><td style="text-align:left">${esc(o.customer || '')}</td><td>${esc(dFmt(o.day))}</td><td><span class="age ${ageCls(a)}">${a} d</span></td><td><b>${m2(o.amount)}</b></td></tr>`; }).join('')}</table>${list.length > 40 ? `<div class="sx-mut" style="margin-top:6px;font-size:12px">Showing the oldest 40 of ${w.orders.waiting}.</div>` : ''}` : '<div class="sx-mut">Nothing is waiting. 🎉</div>'}</div></div>`;
  }
  function draw() {
    const canNext = day < O.today;
    $('root').innerHTML = `<div class="bar"><div class="nav"><button id="pv" aria-label="Previous day">‹</button><input type="date" id="dp" value="${esc(day)}" max="${esc(O.today)}"><button id="nx" ${canNext ? '' : 'disabled'} aria-label="Next day">›</button></div>${day !== O.today ? '<button class="sx-btn" id="tdy">Today</button>' : ''}<span class="sp"></span></div>${SEC.map(section).join('')}`;
  }
  async function load(d) {
    try {
      // the numbers come from the same books as the original Finance (read only: nothing here changes them)
      O = await api.get('fi.overview', d ? { date: d } : {}); day = O.date;
      const r = await Promise.all(SEC.map((s) => api.get('fi.outstanding', { channel: s.key }))); W = {}; SEC.forEach((s, i) => { W[s.key] = r[i]; });
      try { CH = await api.get('fn.in_channels', { date: day }); DAYE = (await api.get('fn.day', { date: day })).entries || []; ACC = (await api.get('fn.accounts')).accounts.filter((a) => a.active); } catch (e) { CH = null; }
      draw();
    } catch (e) { $('root').innerHTML = `<div class="sx-card"><div class="sx-msg bad">${sxi('xc')}<span>${esc(e.message)}</span></div></div>`; }
  }
  async function voidUpload(id, ch) { const why = prompt('Why is this file cancelled? Its money is taken off again.'); if (!why) return; try { await api.post('fn.in_upload_void', { id, reason: why }); await load(day); await chSection(ch); } catch (er) { alert(er.message); } }
  async function voidRec(id) { const why = prompt('Why is this receipt cancelled?'); if (!why) return; try { await api.post('fn.entry_void', { id, reason: why }); await load(day); } catch (er) { alert(er.message); } }
  document.addEventListener('click', (e) => { const t = e.target.closest('button'); if (!t) return; if (t.id === 'pv') load(addDays(day, -1)); else if (t.id === 'nx' && !t.disabled) load(addDays(day, 1)); else if (t.id === 'tdy') load(''); else if (t.dataset.addch) chDrawer(t.dataset.addch, 0); else if (t.dataset.open) chSection(+t.dataset.open); else if (t.dataset.uprec) showRecon(+t.dataset.uprec); else if (t.dataset.upvoid) voidUpload(+t.dataset.upvoid, +t.dataset.ch); else if (t.dataset.addrec) recDrawer(+t.dataset.addrec, null); else if (t.dataset.edrec) recDrawer(0, DAYE.find((x) => x.id === +t.dataset.edrec)); else if (t.dataset.voidrec) voidRec(+t.dataset.voidrec); else if (t.dataset.edch) chDrawer('', +t.dataset.edch); });
  document.addEventListener('change', (e) => { if (e.target.id === 'dp' && e.target.value) load(e.target.value); });
  load('');
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>

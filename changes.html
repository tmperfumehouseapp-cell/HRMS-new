<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Changes — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=260928b">
<link rel="stylesheet" href="assets/css/store.css?v=6">
<style>
  .chg{display:grid;gap:10px;padding:12px 14px}.chg .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chg .hd b{font-size:15px}
  .chg .st{padding:2px 10px;border-radius:999px;font-size:11px;font-weight:800;background:#eef0f3;color:#4b5563}
  .chg .st.building{background:#fff4e0;color:#9a5b00}.chg .st.review{background:#e6f0ff;color:#1d4ed8}.chg .st.deployed{background:#e7f6ec;color:#177245}.chg .st.closed{background:#eef0f3;color:#6b7280}
  .chg .pr{font-size:13px;line-height:1.5;white-space:pre-wrap;color:#374151;background:#f7f8fa;border-radius:10px;padding:8px 10px;max-height:180px;overflow:auto}
  .chg .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chg button,.frm button{border:0;border-radius:999px;padding:8px 16px;font:800 13px inherit;cursor:pointer;background:#eef0f3;color:#111}.chg button.go,.frm button.go{background:#111827;color:#fff}
  .frm{display:grid;gap:8px}.frm input,.frm textarea{width:100%;box-sizing:border-box;border:1px solid #d5d9e0;border-radius:10px;padding:9px 11px;font:inherit}
  .frm textarea{min-height:92px;resize:vertical}
  .warn{background:#fff4e0;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55}.warn code{background:#fff;border-radius:6px;padding:1px 6px}
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><div><h1>Changes</h1><div class="sub" style="font-size:12.5px;color:var(--muted);margin-top:2px">Ask for something new. Claude Code builds it. You check it and tap Approve &amp; deploy.</div></div></div>
    <div class="content"><div class="sx-page" id="root"><div class="sx-card sx-mut">Loading…</div></div></div>
  </main>
</div>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/api.js?v=13"></script>
<script src="assets/js/layout.js?v=29"></script>
<script>
  guardPage();
  renderSidebar('changes');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const root = document.getElementById('root'); let D = null, busy = false;
  const STATE = { building: 'Claude is building it…', review: 'Ready for you to check', deployed: 'Live', closed: 'Closed' };
  function form() {
    return '<div class="sx-card frm"><b>Ask for a change</b><input id="cT" maxlength="120" placeholder="Short title, e.g. Packing report by day">'
      + '<textarea id="cD" placeholder="Say what you want, where it should appear and what it should use. You can also tell the assistant button by voice."></textarea>'
      + '<div><button class="go" id="cSend">Send to the builder</button></div></div>';
  }
  function draw() {
    if (!D) return;
    let h = '';
    if (!D.ready) {
      h += '<div class="warn"><b>Not connected yet.</b> Two things are needed, once:<br>1) In GitHub → this repository → Settings → Secrets and variables → Actions, add a secret <code>ANTHROPIC_API_KEY</code>.<br>2) Create a fine-grained GitHub token for this repository only (Contents, Issues and Pull requests: read &amp; write) and add a line <code>define(\'GITHUB_TOKEN\', \'…\');</code> to <code>empmanagment/config.php</code>.</div>';
    } else h += form();
    (D.items || []).forEach((it) => {
      h += '<div class="sx-card chg"><div class="hd"><b>#' + it.issue + ' ' + esc(it.title) + '</b><span class="st ' + it.state + '">' + esc(STATE[it.state] || it.state) + '</span></div>';
      if (it.pr) {
        h += '<div class="pr">' + esc(it.pr.body || it.pr.title) + '</div>';
        h += '<div class="row"><a href="' + esc(it.pr.url) + '" target="_blank" rel="noopener">See every changed line</a>' + (it.pr.files ? '<span class="sx-mut">' + it.pr.files + ' file' + (it.pr.files === 1 ? '' : 's') + ' changed</span>' : '') + '</div>';
        if (it.state === 'review') {
          const bad = it.pr.mergeable === false;
          h += '<div class="row">' + (bad ? '<span class="sx-mut">It clashes with newer work. Ask for it again.</span>' : '<button class="go" data-a="ok" data-pr="' + it.pr.number + '">Approve &amp; deploy</button>') + '<button data-a="no" data-i="' + it.issue + '" data-pr="' + it.pr.number + '">Not this</button></div>';
        }
      } else if (it.state === 'building') {
        h += '<div class="row"><span class="sx-mut">Claude Code is working. This takes a few minutes. This page refreshes by itself.</span><button data-a="no" data-i="' + it.issue + '" data-pr="0">Cancel</button></div>';
      }
      h += '</div>';
    });
    if (D.ready && !(D.items || []).length) h += '<div class="sx-card sx-mut">No requests yet.</div>';
    root.innerHTML = h;
  }
  function load() { return api.get('chg.list').then((d) => { D = d; if (!busy) draw(); }).catch((e) => { root.innerHTML = '<div class="warn">' + esc((e && e.message) || 'Could not load.') + '</div>'; }); }
  root.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return; busy = true;
    const done = (m) => { busy = false; if (m) alert(m); return load(); };
    if (b.id === 'cSend') {
      const t = document.getElementById('cT').value.trim(), d = document.getElementById('cD').value.trim();
      if (t.length < 4 || d.length < 10) { busy = false; return alert('Write a short title and say what you want.'); }
      b.disabled = true; b.textContent = 'Sending…';
      return api.post('chg.create', { title: t, details: d }).then((r) => done(r.message)).catch((er) => { b.disabled = false; b.textContent = 'Send to the builder'; done((er && er.message) || 'Could not send.'); });
    }
    if (b.dataset.a === 'ok') { if (!confirm('Approve and put this live now?')) { busy = false; return; } b.disabled = true; b.textContent = 'Going live…'; return api.post('chg.approve', { pr: Number(b.dataset.pr) }).then((r) => done(r.message)).catch((er) => done((er && er.message) || 'Could not approve.')); }
    if (b.dataset.a === 'no') { if (!confirm('Close this request?')) { busy = false; return; } return api.post('chg.close', { issue: Number(b.dataset.i), pr: Number(b.dataset.pr) }).then((r) => done(r.message)).catch((er) => done((er && er.message) || 'Could not close.')); }
    busy = false;
  });
  load(); setInterval(() => { if (!busy && document.activeElement && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) load(); }, 20000);
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>My Sales — HRMS</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5e9f0;--g:#16a34a;--o:#f97316}
html.dk{--bg:#0b141a;--card:#111b21;--ink:#e9edef;--mut:#8696a0;--line:#25343e}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{background:linear-gradient(135deg,#0f766e,#16a34a);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 30px;border-radius:0 0 28px 28px}
.top .hi{font-weight:800;font-size:18px}.top .sub{opacity:.9;font-size:13px}
.wrap{padding:0 14px;margin-top:-14px}
.card{background:var(--card);border-radius:18px;padding:12px;box-shadow:0 6px 20px rgba(15,23,42,.07);margin-bottom:12px}
.h3{font-weight:800;font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:12.5px}
.hasbk .app{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.top.hm{padding-bottom:54px}.wrap.hm{margin-top:-40px}.top .r{display:flex;align-items:center;justify-content:space-between;gap:8px}.chip{background:rgba(255,255,255,.2);border-radius:99px;padding:6px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.sk{height:16px;border-radius:8px;margin:10px 0;background:linear-gradient(90deg,#e6e9ee 25%,#f3f5f9 37%,#e6e9ee 63%);background-size:400% 100%;animation:sk 1.2s ease infinite}@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.ring{display:flex;align-items:center;gap:12px}.ring .t{flex:1;min-width:0}.ring .t>b{display:block;font-size:20px;letter-spacing:-.02em}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#16a34a)}
.up{color:#16a34a;font-weight:800;font-size:12.5px}.dn{color:#dc2626;font-weight:800;font-size:12.5px}
.next{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;display:flex;align-items:center;gap:12px}.next small{opacity:.85;font-weight:700;letter-spacing:.04em;font-size:11px}.next b{display:block;font-size:14.5px;margin-top:2px}
.btn.w{background:#fff;color:#4c1d95;border:0;flex:none}.btn.dk{background:#111827;color:#fff;border:0;flex:none}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.tile{background:var(--card);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:0 4px 14px rgba(15,23,42,.06)}.tile b{display:block;font-size:18px}.tile span{font-size:11px;color:var(--mut)}
.q{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}.q .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:#ecfdf5;flex:none}.q .m{flex:1;min-width:0}.q .m b{display:block;font-size:13.5px}.q .m span{font-size:11.5px;color:var(--mut)}.ok{color:#16a34a;font-weight:800;white-space:nowrap}.todo{color:#f97316;font-weight:800;white-space:nowrap}
.lb{display:flex;align-items:center;gap:10px;padding:6px 0}.lb .n{width:26px;text-align:center;font-weight:800;color:var(--mut)}.lb .av{width:32px;height:32px;border-radius:50%;background:#e0e7ff;display:grid;place-items:center;font-weight:800;color:#3730a3;flex:none;font-size:13px}.lb .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lb .v{font-weight:800}.lb.me{background:#f0fdf4;border-radius:12px;padding:6px 8px;margin-top:4px}html.dk .lb.me{background:#12281a}
.med{display:flex;gap:8px;flex-wrap:wrap}.med span{background:#fff7ed;color:#9a3412;border-radius:99px;padding:6px 10px;font-weight:800;font-size:12.5px}
.say{background:#f0fdf4;border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:600;color:#14532d;margin-bottom:12px}html.dk .say{background:#12281a;color:#bbf7d0}
.rmk{background:#fffbeb;border:1px solid #fde68a;border-radius:16px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}.rmk small{display:block;color:#92400e;font-weight:800;margin-bottom:2px}.rmk .btn{min-height:40px;margin-top:8px;font-size:13px}
.fl{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border-radius:16px;padding:10px 12px;margin-bottom:12px;font-weight:800;font-size:13.5px}
.erow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.erow:first-of-type{border-top:0}.erow b{font-size:16px}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;color:#15803d}
.fab{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:18;min-height:52px;padding:0 18px;border-radius:99px;border:0;background:#16a34a;color:#fff;font-weight:800;font-size:14px;box-shadow:0 10px 26px rgba(22,163,74,.45)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column}.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:var(--card);border-bottom:1px solid var(--line);font-weight:800}.sheet iframe{flex:1;width:100%;border:0}
.conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}.conf i{position:absolute;top:-30px;font-style:normal;font-size:26px;animation:fall 1.8s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:#111827;color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;z-index:70;max-width:90vw;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.tiles.c2{grid-template-columns:1fr 1fr}
.tl{background:var(--card);border-radius:16px;padding:9px 9px 8px;box-shadow:0 4px 14px rgba(15,23,42,.07);min-height:92px;display:flex;flex-direction:column;min-width:0;overflow:hidden}.tl[data-tile]{cursor:pointer}
.tl .ic{font-size:15px;line-height:1}.tl .b{font-size:19px;font-weight:800;letter-spacing:-.03em;margin-top:4px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tl .l{font-size:11px;font-weight:800;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tl .s2{font-size:10.5px;color:var(--mut);margin-top:auto;padding-top:4px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.tl.t-g .b{color:#15803d}
.tl.t-g{background:linear-gradient(160deg,#ecfdf5,var(--card) 70%)}.tl.t-o{background:linear-gradient(160deg,#fff7ed,var(--card) 70%)}.tl.t-p{background:linear-gradient(160deg,#eef2ff,var(--card) 70%)}.tl.t-y{background:linear-gradient(160deg,#fdf4ff,var(--card) 70%)}
html.dk .tl.t-g,html.dk .tl.t-o,html.dk .tl.t-p,html.dk .tl.t-y{background:var(--card)}
.btn.sm{min-height:44px;padding:0 12px;font-size:12.5px}
.sheet.sm{background:rgba(15,23,42,.45);justify-content:flex-end;align-items:center}.sheet.sm .hd{width:100%;max-width:480px;border-radius:20px 20px 0 0}.sheet.sm .bd{width:100%;max-width:480px;background:var(--card);padding:6px 14px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:70vh;overflow:auto}
.ar{display:grid;grid-template-columns:1.5fr .6fr 1fr 1fr .7fr;gap:6px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px;align-items:center}.ar.hd{font-weight:800;color:var(--mut);border-top:0;font-size:11px}.ar.tot{font-weight:800}.ar .num{text-align:right;white-space:nowrap}.mo{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:40px;padding:0 8px;font-size:13px;max-width:60%}
.s{display:none}.s.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);max-width:480px;margin:0 auto;z-index:20}
nav a{flex:1;min-width:0;text-align:center;text-decoration:none;color:var(--mut);font-size:11px;font-weight:700;padding:6px 2px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav a i{font-style:normal;font-size:21px}nav a.on{color:var(--g)}
.search{width:100%;min-height:46px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font-size:16px;margin-bottom:10px;background:var(--card);color:var(--ink)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tabs button{flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:0 14px;min-height:40px;font-size:13px;font-weight:700;white-space:nowrap}
.tabs button.on{background:#111827;color:#fff;border-color:#111827}
.pr{border-top:1px solid var(--line);padding:10px 0}.pr:first-of-type{border-top:0}
.pr .r{display:flex;align-items:center;gap:10px}.pr .l{flex:1;min-width:0}.pr .l b{display:block;font-size:15px}.pr .l span{font-size:12px;color:var(--mut)}
.pr .v{font-size:17px;font-weight:800;white-space:nowrap}
.add{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--g);font-size:22px;font-weight:800}
.lad{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.lad div{background:var(--bg);border-radius:12px;padding:7px 4px;text-align:center}.lad b{display:block;font-size:14px}.lad span{font-size:10.5px;color:var(--mut)}.lad .me{outline:2px solid var(--g)}
.bk{position:fixed;left:0;right:0;bottom:calc(82px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;padding:0 12px;z-index:19}
.bk .in{background:#111827;color:#fff;border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.bk .t{flex:1;min-width:0}.bk .t b{font-size:18px}.bk .t span{display:block;font-size:11.5px;opacity:.8}
.bk select{min-height:44px;border-radius:12px;border:0;padding:0 8px;font-size:14px;max-width:120px}.bk button{min-height:44px;border:0;border-radius:12px;padding:0 14px;font-weight:800}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line);min-height:48px}.set:first-of-type{border-top:0}
.tg{flex:none;width:48px;height:30px;border-radius:99px;background:#16a34a;position:relative;border:0;padding:0}.tg::after{content:"";position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff}.tg.off{background:#cbd5e1}.tg.off::after{right:auto;left:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:14px;text-decoration:none}
.empty{padding:24px 8px;text-align:center;color:var(--mut)}.err{color:#d9423b;padding:12px}
</style>
</head>
<body>
<div class="app">
  <section class="s on" id="home"><div class="top hm"><div class="r"><div><div class="hi" id="hiName">My Sales</div><div class="sub" id="hiSub">Your day, your numbers</div></div><div class="chip" id="hiStreak" hidden></div></div></div>
    <div class="wrap hm" id="homeBody"><div class="card"><div class="sk"></div><div class="sk" style="height:70px"></div></div></div></section>
  <section class="s" id="earn"><div class="top"><div class="hi">💰 My earnings</div><div class="sub">Today, this month, salary</div></div>
    <div class="wrap" id="earnBody"><div class="card"><div class="sk"></div><div class="sk" style="height:70px"></div></div></div></section>
  <section class="s" id="prices"><div class="top"><div class="hi">🧴 Price chart</div><div class="sub">Same prices as the bot and the cart</div></div>
    <div class="wrap"><input class="search" id="prQ" type="search" placeholder="🔍 Search by ml or pieces" inputmode="search" autocomplete="off"><div class="tabs" id="prSeg"></div><div id="prBody"><div class="empty">Loading…</div></div></div></section>
  <section class="s" id="me"><div class="top"><div class="hi">👤 Me</div><div class="sub">Settings and records</div></div>
    <div class="wrap"><div class="card" id="meSet"></div><div class="card"><div class="h3">My records</div>
      <a class="set" href="my_day.html#records/attendance" style="text-decoration:none;color:inherit"><span>🕘 Attendance</span><span>›</span></a>
      <a class="set" href="my_day.html#records/leave" style="text-decoration:none;color:inherit"><span>🌴 Leave</span><span>›</span></a>
      <a class="set" href="my_day.html#records/penalties" style="text-decoration:none;color:inherit"><span>🧾 Penalties</span><span>›</span></a>
      <a class="set" href="my_day.html#records/agreements" style="text-decoration:none;color:inherit"><span>📄 Agreements</span><span>›</span></a>
</div></div></section>
  <button type="button" class="fab" id="fabAlloc" hidden>➕ Allocate order</button>
  <button type="button" class="fab" id="fabMo" style="bottom:calc(146px + env(safe-area-inset-bottom,0px));background:#4f46e5;box-shadow:0 10px 26px rgba(79,70,229,.4)" onclick="location.href='manual_order.html'">🧾 Manual order</button>
  <div class="bk" id="bk" hidden></div>
  <nav>
    <a href="#home" data-s="home"><i>🏠</i>Home</a>
    <a href="my_chats.html" data-chat="1"><i>💬</i>Chats</a>
    <a href="#earn" data-s="earn"><i>💰</i>Earn</a>
    <a href="#prices" data-s="prices"><i>🧴</i>Prices</a>
    <a href="#me" data-s="me"><i>👤</i>Me</a>
  </nav>
</div>
